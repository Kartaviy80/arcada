<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a24">
<title>Bubble Blast</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0a24; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  #menu { background: radial-gradient(ellipse at 50% 38%, rgba(20,10,50,.05), rgba(14,8,40,.55) 58%, rgba(8,4,26,.92) 100%); }
  .titlebox { position: relative; }
  .title { font-weight: 900; font-size: clamp(54px, 16vw, 112px); line-height: .86; letter-spacing: 1px; transform: rotate(-3deg);
    background: linear-gradient(180deg, #ffffff 0%, #ffd6fb 22%, #ff6ad5 48%, #a63cff 74%, #4a1aa8 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #2a0a5a) drop-shadow(0 0 26px rgba(220,90,255,.65)); }
  .title span { display: block; font-size: .78em; letter-spacing: .08em; background: linear-gradient(180deg, #ffffff 0%, #b8fbff 30%, #3ad8ff 60%, #1a5ad8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { font-size: 12px; letter-spacing: 7px; font-weight: 800; color: #e8d0ff; text-shadow: 0 0 12px #b04aff; margin-top: 10px; }
  .orb { position: absolute; border-radius: 50%; pointer-events: none; animation: bob 3.2s ease-in-out infinite;
    background: radial-gradient(circle at 34% 30%, #fff 0 8%, var(--c) 30%, rgba(0,0,0,.35) 100%); box-shadow: 0 0 22px var(--c), inset 0 -6px 10px rgba(255,255,255,.25); }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  .shop { display: flex; align-items: center; gap: 12px; }
  .wandcard { position: relative; width: 210px; padding: 10px 12px 12px; border-radius: 18px; background: linear-gradient(180deg, rgba(60,30,110,.78), rgba(22,10,50,.86));
    border: 2px solid rgba(200,150,255,.45); box-shadow: 0 10px 30px rgba(0,0,0,.55), inset 0 0 22px rgba(170,90,255,.25), 0 0 20px rgba(150,70,255,.25); }
  .wandcard canvas { width: 120px; height: 120px; display: block; margin: 0 auto; }
  .wandcard .nm { font-size: 17px; font-weight: 900; letter-spacing: 3px; color: #ffe6ff; text-shadow: 0 0 10px rgba(255,120,240,.6); }
  .wandcard .ds { font-size: 12px; color: #d8c8f0; min-height: 30px; line-height: 1.3; margin-top: 2px; }
  .wandcard.lock canvas { filter: grayscale(.85) brightness(.55); }
  .buy { margin-top: 6px; border: 0; border-radius: 999px; padding: 6px 16px; font-weight: 900; font-size: 13px; letter-spacing: 2px; cursor: pointer; color: #3a1a00;
    background: linear-gradient(180deg, #fff2a8, #ffc23a 55%, #e88a10); box-shadow: 0 3px 0 #8a4a06; }
  .buy.owned { background: linear-gradient(180deg, #c8ffe8, #3ae0a0 55%, #10a070); color: #04301e; box-shadow: 0 3px 0 #06603e; }
  .buy.poor { filter: grayscale(.7) brightness(.8); }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(220,170,255,.7); background: rgba(70,30,140,.55); color: #f4e4ff; font-size: 19px; font-weight: 900; cursor: pointer; box-shadow: 0 0 14px rgba(170,90,255,.4); }
  .coin { display: inline-block; width: 1em; height: 1em; border-radius: 50%; vertical-align: -.14em; margin-right: .25em;
    background: radial-gradient(circle at 35% 30%, #fff8c8 0 12%, #ffd23a 40%, #c87a08 100%); box-shadow: inset 0 0 0 .09em #a86000, 0 0 6px rgba(255,200,60,.6); }
  .stat { font-size: 14px; color: #ece0ff; text-shadow: 0 1px 2px #000; letter-spacing: 1px; } .stat b { color: #ffd84a; }
  .btn { white-space: nowrap; border: 0; padding: 14px 64px; border-radius: 999px; font-size: 27px; font-weight: 900; letter-spacing: 6px; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #ffa0e8 0%, #ff4ab8 45%, #b0128a 100%); box-shadow: 0 6px 0 #5a0848, 0 0 30px rgba(255,80,200,.55), inset 0 2px 0 rgba(255,255,255,.6);
    text-shadow: 0 2px 0 #7a0a5e; animation: pulse 1.6s ease-in-out infinite; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #5a0848; }
  .btn.alt { font-size: 15px; padding: 8px 26px; letter-spacing: 3px; animation: none; background: linear-gradient(180deg, #a890ff, #6a3ae0 55%, #3a1aa0); box-shadow: 0 4px 0 #20105a, 0 0 18px rgba(130,90,255,.45); text-shadow: 0 1px 0 #20105a; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #5a0848, 0 0 50px rgba(255,110,220,.9), inset 0 2px 0 rgba(255,255,255,.6); } }
  .hint { font-size: 12px; letter-spacing: .5px; color: #cfc0ee; max-width: 460px; text-shadow: 0 1px 2px #000; line-height: 1.45; }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(70,20,110,.82), rgba(8,4,24,.96)); }
  #over h2 { font-size: clamp(44px, 12.5vw, 88px); font-weight: 900; line-height: .9; letter-spacing: 2px; transform: rotate(-2deg);
    background: linear-gradient(180deg, #fff, #c8b0ff 40%, #7a4aff 75%, #3a1a9a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #1a0848) drop-shadow(0 0 24px rgba(150,90,255,.6)); }
  #over .btn:not(.alt) { padding: 13px 44px; font-size: 24px; }
  #overScore { font-size: 54px; font-weight: 900; color: #fff6d8; text-shadow: 0 0 22px rgba(255,200,90,.65), 0 3px 0 #5a2a08; }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #3a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 0 22px rgba(255,220,80,.85); animation: nb .7s ease-in-out infinite alternate; }
  @keyframes nb { to { transform: rotate(-3deg) scale(1.08); } }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 24px; font-size: 14px; color: #dccff4; text-align: left; } .grid b { color: #fff; float: right; margin-left: 14px; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #pause { background: rgba(10,6,30,.74); }
  #pause h3 { font-size: 40px; font-weight: 900; letter-spacing: 8px; color: #f0dcff; text-shadow: 0 0 22px rgba(190,110,255,.8); }
  @media (max-height: 700px) and (min-height: 521px) { .title { font-size: 58px; } .wandcard canvas { width: 90px; height: 90px; } .overlay { gap: 9px; } }
  @media (max-height: 520px) {
    .overlay { gap: 5px; padding: 6px 16px; } .title { font-size: 40px; } .tag { font-size: 9px; letter-spacing: 4px; margin-top: 4px; } .orb { display: none; }
    .wandcard { width: 180px; padding: 6px 10px 8px; } .wandcard canvas { width: 54px; height: 54px; } .wandcard .nm { font-size: 13px; } .wandcard .ds { font-size: 10.5px; min-height: 0; }
    .buy { padding: 4px 12px; font-size: 11px; margin-top: 3px; } .arrow { width: 34px; height: 34px; font-size: 15px; } .btn { padding: 8px 44px; font-size: 20px; } .hint { display: none; }
    #over h2 { font-size: 38px; } #overScore { font-size: 32px; } .grid { font-size: 12px; gap: 2px 18px; } #newBest { font-size: 12px; padding: 3px 10px; } .btn.alt { font-size: 12px; padding: 5px 18px; }
    #pause h3 { font-size: 28px; }
  }
  @media (max-height: 520px) and (min-width: 600px) { #menu { flex-direction: row; flex-wrap: wrap; align-content: center; column-gap: 28px; } #menu .titlebox { width: 100%; } #menu .mcol { display: flex; flex-direction: column; gap: 6px; align-items: center; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="overlay" id="menu">
  <div class="titlebox">
    <i class="orb" style="--c:#ff3d6e;width:26px;height:26px;left:-30px;top:6px"></i>
    <i class="orb" style="--c:#25e0e6;width:18px;height:18px;right:-24px;top:-6px;animation-delay:-1.1s"></i>
    <i class="orb" style="--c:#ffb41f;width:22px;height:22px;right:-34px;bottom:26px;animation-delay:-2.2s"></i>
    <div class="title">BUBBLE<span>BLAST</span></div><div class="tag">&#10022; WITCHING HOUR &#10022;</div></div>
  <div class="mcol"><div class="shop"><button class="arrow" id="prevW" aria-label="Previous wand">&#9664;</button>
    <div class="wandcard" id="wandCard"><canvas id="wandPrev" width="240" height="240"></canvas><div class="nm" id="wandName">WILLOW WAND</div><div class="ds" id="wandDesc"></div><button class="buy" id="wandBuy">EQUIPPED</button></div>
    <button class="arrow" id="nextW" aria-label="Next wand">&#9654;</button></div></div>
  <div class="mcol"><div class="stat" id="bestMenu"></div>
  <div class="stat" id="coinMenu"></div>
  <button class="btn" id="startBtn">PLAY</button>
  <div class="hint">Drag to aim &middot; release to shoot &middot; tap the spare bubble to swap &middot; bank shots off the walls &middot; pop 3+ of a color and drop whole clusters</div></div>
</div>
<div class="overlay hidden" id="over">
  <h2>OUT OF<br>MAGIC</h2>
  <div id="overScore">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <div class="row"><button class="btn" id="againBtn">PLAY AGAIN</button></div>
  <div class="row"><button class="btn alt" id="menuBtn">MENU</button></div>
  <div class="hint" id="unlockMsg"></div>
</div>
<div class="overlay hidden" id="pause"><h3>PAUSED</h3><div class="hint">tap anywhere to continue</div><button class="btn alt" id="quitBtn">QUIT TO MENU</button></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG

    $('overStats').innerHTML = [['Level', G.level], ['Popped', fmt(G.popped)], ['Dropped', fmt(G.dropped)], ['Biggest drop', G.bestDrop], ['Best combo', 'x' + G.bestCombo], ['Bank shots', G.banks], ['Creatures freed', G.freed], ['Gems', G.gemsGot], ['Bosses', G.bosses], ['Coins', '+' + fmt(G.coinsRun)]].map(([a, b]) => '<div>' + a + '<b>' + b + '</b></div>').join('');
    const aff = WANDS.filter((w, i) => !SAVE.owned[i] && SAVE.coins >= w.price).map(w => w.name);
    $('unlockMsg').textContent = aff.length ? 'You can now buy the ' + aff[0] + ' in the menu!' : 'Coins: ' + fmt(SAVE.coins) + ' · best ' + fmt(SAVE.best);
    $('pause').classList.add('hidden'); paused = false; $('over').classList.remove('hidden'); updateMenu();
    if (nb) seq([784, 988, 1175, 1568, 1976], 110, 'triangle', .05, .3);
  }
  function pause() { if (!G || G.attract || G.phase === 'over' || paused) return; paused = true; ptr = null; G.aimOn = false; $('pause').classList.remove('hidden'); }
  function resume() { paused = false; $('pause').classList.add('hidden'); last = performance.now(); }
  $('pause').addEventListener('pointerdown', e => { if (e.target.id !== 'quitBtn') resume(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  addEventListener('resize', () => { layout(); const px = spritePx(); if (Math.abs(px - sprPx) / sprPx > .25) loadAll(px); });

  // ---------- test hook ----------
  let last = performance.now(), fpsVal = 60, fpsAcc = 0, fpsN = 0;
  window.__bb = {
    G: () => G, start, toMenu, state: () => ({ phase: G.phase, level: G.level, score: G.score, shots: G.shots, hearts: G.hearts, type: G.obj && G.obj.type, have: G.obj && G.obj.have, need: G.obj && G.obj.need, cells: countCells(b => b.k !== 'anchor'), boss: G.boss && { hp: G.boss.hp, max: G.boss.max, dead: G.boss.dead }, theme: G.theme, combo: G.combo, coins: SAVE.coins }),
    autopilot: v => { G.autopilot = v; G.bot = null; }, setLevel: n => { G.hearts = Math.max(G.hearts, 3); FX.clear(); startLevel(n); }, coins: n => { SAVE.coins += n; saveNow(); updateMenu(); },
    hearts: n => { G.hearts = n; }, shots: n => { G.shots = n; }, win: () => { if (G.phase === 'play') winLevel(); }, fail: () => { if (G.phase === 'play') failLevel('shots'); }, next: () => nextLevel(), cont: v => continueFail(v), skip: () => skipIntro(),
    fire: a => fire(a), swap, boost: id => useBoost(id), aim: a => { G.aim = aimLimit(a); G.aimOn = G.aimValid = true; }, fps: () => fpsVal, save: () => JSON.parse(JSON.stringify(SAVE)),
    layout: () => ({ W, H, S, FX0, LX, LY, sideMode, gridTop: gridTop(), launcher: [FX0 + LX * S, LY * S], next: [FX0 + (LX + NEXT_DX) * S, (LY + NEXT_DY) * S], boosts: boostBtns.map(b => [b.id, b.x, b.y]), pause: [pauseBtn.x, pauseBtn.y] }),
    ff: n => { for (let i = 0; i < n && G.phase !== 'over'; i++) update(1 / 60); }, ready: () => sprReady, wand: i => { SAVE.owned[i] = true; SAVE.wand = i; saveNow(); }
  };
  const spritePx = () => clamp(Math.round(BS * Math.max(S, .6) * DPR), 56, 150);
  layout();
  onSprites = () => { drawWandPreview(); };
  loadAll(spritePx());
  newRun(true); updateMenu();
  (function loop(now) {
    const rdt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; fpsAcc += rdt; fpsN++; if (fpsAcc > .5) { fpsVal = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
    if (!paused && G) update(rdt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
