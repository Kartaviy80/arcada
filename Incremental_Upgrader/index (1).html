<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1a10">
<title>Deep Mine</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2a1a10;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; color: #f4e2c4;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
  .top .coins { font-size: 32px; font-weight: 900; color: #ffd24a; -webkit-text-stroke: 1.5px #3a2008; text-shadow: 0 3px 0 #3a2008, 0 0 18px rgba(255,190,60,.5); }
  .top .ps { font-size: 13px; font-weight: 800; color: #ffe8b0; background: rgba(30,16,6,.7); display: inline-block; padding: 2px 12px; border-radius: 12px; margin-top: 2px; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; height: 44%; background: linear-gradient(#4a3020, #2a1a0e); border-top: 5px solid #c8964a; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.5); display: flex; flex-direction: column; z-index: 3; }
  @media (min-aspect-ratio: 1/1) { .panel { left: auto; top: 0; width: min(420px, 40%); height: 100%; border-radius: 22px 0 0 22px; border-top: 0; border-left: 5px solid #c8964a; } }
  .tabs { display: flex; gap: 6px; padding: 10px 10px 6px; }
  .tabs button { flex: 1; border: 0; border-radius: 12px; padding: 9px 4px; font: inherit; font-size: 14px; font-weight: 900; color: #e8c890; background: #5a3a24; cursor: pointer; }
  .tabs button.on { background: linear-gradient(#ffd24a, #e8901a); color: #3a2008; box-shadow: 0 3px 0 #8a5004; }
  .tabs .mode { flex: 0 0 64px; background: #1a0e06; color: #ffd24a; }
  .list { flex: 1; overflow-y: auto; padding: 4px 10px 80px; -webkit-overflow-scrolling: touch; }
  .card { display: flex; align-items: center; gap: 10px; background: linear-gradient(#5a3e2a, #45301e); border: 2px solid #7a5a3a; border-radius: 16px; padding: 8px; margin-bottom: 8px; box-shadow: 0 3px 0 #1a0e06; }
  .card canvas { width: 58px; height: 58px; flex: 0 0 58px; border-radius: 12px; background: radial-gradient(circle at 40% 35%, #8a6a4a, #3a2414); }
  .card .info { flex: 1; min-width: 0; }
  .card .nm { font-weight: 900; font-size: 15px; color: #ffe8b0; } .card .nm small { color: #ffb84a; font-size: 13px; }
  .card .ds { font-size: 12px; color: #d8b88a; line-height: 1.3; }
  .card button { flex: 0 0 auto; min-width: 88px; border: 0; border-radius: 12px; padding: 8px 6px; font: inherit; font-weight: 900; font-size: 13px; color: #3a2008; background: linear-gradient(#ffe24a, #e8a01a); box-shadow: 0 3px 0 #8a5004; cursor: pointer; line-height: 1.15; }
  .card button:disabled { background: #6a5440; box-shadow: 0 3px 0 #2a1a0e; color: #a8906a; }
  .card button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #8a5004; }
  .dyn { position: fixed; z-index: 4; width: 74px; height: 74px; border-radius: 50%; border: 4px solid #ffe8b0; background: radial-gradient(circle at 40% 35%, #ff7a5a, #a8200a); color: #fff; font: inherit; font-weight: 900; font-size: 11px; cursor: pointer; box-shadow: 0 5px 0 #5a0a04, 0 0 20px rgba(255,90,40,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .dyn .ic { font-size: 28px; } .dyn:disabled { filter: grayscale(.8) brightness(.7); box-shadow: 0 5px 0 #2a1a0e; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: radial-gradient(ellipse at 50% 35%, rgba(90,60,30,.96), rgba(14,8,4,.98)); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 240px; height: 240px; }
  h1 { font-size: clamp(44px, 13.5vw, 72px); font-weight: 900; line-height: .95; color: #ffd24a; -webkit-text-stroke: 3px #3a2008; text-shadow: 0 5px 0 #3a2008, 0 0 30px rgba(255,190,60,.6); }
  .overlay p { max-width: 320px; font-size: 15px; line-height: 1.55; color: #e8d0a8; }
  .overlay .stat b { color: #ffd24a; }
  .btn { border: 4px solid #ffe8b0; background: linear-gradient(#ffd24a, #e8901a); color: #3a2008; font: inherit; font-size: 21px; font-weight: 900; letter-spacing: 3px; padding: 14px 46px; border-radius: 40px; cursor: pointer; box-shadow: 0 6px 0 #6a3a04, 0 12px 24px rgba(0,0,0,.4); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><div class="coins" id="coins">0</div><div class="ps" id="ps">0 / sec</div></div>
<button class="dyn" id="dyn"><span class="ic">🧨</span><span id="dynT">BLAST</span></button>
<div class="panel" id="panel">
  <div class="tabs"><button class="on" data-t="crew">Crew</button><button data-t="tools">Tools</button><button class="mode" id="mode">x1</button></div>
  <div class="list" id="list"></div>
</div>
<div class="overlay" id="menu">
  <canvas id="logo" width="480" height="480"></canvas>
  <h1>DEEP<br>MINE</h1>
  <p><b>How deep can you dig?</b> Tap the rock to break it and find gold and gems. Hire dwarves, drills and lava pumps to dig for you. Every layer is harder — and richer. The shaft never ends.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">DIG IN</button>
</div>
<div class="overlay hidden" id="away">
  <canvas id="awayArt" width="480" height="480"></canvas>
  <h1>WELCOME<br>BACK!</h1>
  <p id="awayTxt"></p>
  <button class="btn" id="awayBtn">COLLECT</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }
        else if (p.shape === 'heart') { ctx.rotate(p.rot * .2); heart(ctx, p.size); }
        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * (.4 + k * .6), 0, TAU); ctx.fill(); }
        ctx.restore(); ctx.shadowBlur = 0;
      }
      for (const t of texts) {
        const age = t.max - t.life, pop = age < .18 ? 1 + Math.sin(age / .18 * Math.PI) * .45 : 1, a = Math.min(1, t.life / t.max * 2.2);

// ---------- idle core: big-number formatting, geometric prices, saves and offline earnings ----------
const Idle = (() => {
  const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td', 'Qad', 'Qid', 'Sxd', 'Spd', 'Ocd', 'Nod', 'Vg'];
  // past the named suffixes: aa, ab, ac … zz
  const letters = i => String.fromCharCode(97 + Math.floor(i / 26) % 26) + String.fromCharCode(97 + i % 26);
  function fmt(n, dec = 2) {
    if (!isFinite(n)) return '∞';
    if (n < 0) return '-' + fmt(-n, dec);
    if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n).toString();
    const e = Math.floor(Math.log10(n) / 3), v = n / Math.pow(10, e * 3);
    const s = e < SUF.length ? SUF[e] : letters(e - SUF.length);
    return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(dec)) + s;
  }
  function fmtTime(s) { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return h ? h + 'h ' + m + 'm' : m ? m + 'm ' + x + 's' : x + 's'; }
  // price of buying n more when `owned` are owned: base * g^owned * (g^n - 1) / (g - 1)
  const cost = (base, g, owned, n = 1) => base * Math.pow(g, owned) * (Math.pow(g, n) - 1) / (g - 1);
  // how many can be afforded with `money`
  function maxAfford(base, g, owned, money) { const c0 = base * Math.pow(g, owned); if (money < c0) return 0; return Math.max(1, Math.floor(Math.log(money * (g - 1) / c0 + 1) / Math.log(g))); }
  // milestone multiplier: x2 at 10, 25, 50, 100, then every 100
  function milestone(owned) { let m = 1; for (const k of [10, 25, 50]) if (owned >= k) m *= 2; if (owned >= 100) m *= Math.pow(2, Math.floor(owned / 100)); return m; }
  function nextMilestone(owned) { for (const k of [10, 25, 50, 100]) if (owned < k) return k; return (Math.floor(owned / 100) + 1) * 100; }
  function load(key, defaults) { let s = null; try { s = JSON.parse(localStorage.getItem(key)); } catch (e) {} return Object.assign(JSON.parse(JSON.stringify(defaults)), s || {}); }
  function save(key, state) { state.seen = Date.now(); try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }
  // seconds since the last save, capped (default 8 hours)
  function away(state, cap = 8 * 3600) { if (!state.seen) return 0; return Math.min(cap, Math.max(0, (Date.now() - state.seen) / 1000)); }
  return { fmt, fmtTime, cost, maxAfford, milestone, nextMilestone, load, save, away };
})();

    const shift = col => { const n = parseInt(col.slice(1), 16), rr = n >> 16, gg = (n >> 8) & 255, bb = n & 255, h = L.hueShift; return 'hsl(' + ((Math.atan2(Math.sqrt(3) * (gg - bb), 2 * rr - gg - bb) * 57.3 + h + 360) % 360) + ',' + Math.min(70, 25 + L.tier * 6) + '%,' + Math.round((Math.max(rr, gg, bb) + Math.min(rr, gg, bb)) / 5.1) + '%)'; };

    for (let i = 0; i < 260; i++) { g.fillStyle = r() < .5 ? 'rgba(0,0,0,' + (.08 + r() * .14) + ')' : 'rgba(255,255,255,' + (.04 + r() * .08) + ')'; g.beginPath(); g.ellipse(r() * size, r() * size, 2 + r() * 10, 1 + r() * 6, r() * 3, 0, 7); g.fill(); }

  }
  function drawScene() {
    const { w, h } = sceneR, B = BLOCK(), blockTop = B.y - B.s / 2, shaftW = B.s * 1.25;

      if (d < 0) { // the surface: sky, grass, a little cabin
        if (d === -1) { const sk = ctx.createLinearGradient(0, y - h, 0, y + rowH); sk.addColorStop(0, '#5ab8f0'); sk.addColorStop(1, '#c8ecff'); ctx.fillStyle = sk; ctx.fillRect(0, y - h, w, h + rowH); ctx.fillStyle = '#6ab83a'; ctx.fillRect(0, y + rowH - 16, w, 16); ctx.fillStyle = '#8a5a34'; ctx.fillRect(w * .1, y + rowH - 70, 70, 54); ctx.fillStyle = '#c83a2a'; ctx.beginPath(); ctx.moveTo(w * .1 - 10, y + rowH - 70); ctx.lineTo(w * .1 + 35, y + rowH - 104); ctx.lineTo(w * .1 + 80, y + rowH - 70); ctx.fill(); }
        continue;
      }
      const T = tex(Math.floor(d / 40)); ctx.drawImage(T, 0, (d * 37) % 128, 256, 128, 0, y, w, rowH);
      if (d % 40 === 0) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, y, w, 4); const L = layer(d); ctx.font = '900 13px sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,240,200,.8)'; ctx.fillText('▼ ' + L.name + ' · ' + d + ' m', 10, y + 18); }
    }
    // the dug shaft above the current block
    const sx = B.x - shaftW / 2;
    const sg = ctx.createLinearGradient(sx, 0, sx + shaftW, 0); sg.addColorStop(0, 'rgba(10,6,2,.92)'); sg.addColorStop(.5, 'rgba(30,18,8,.82)'); sg.addColorStop(1, 'rgba(10,6,2,.92)');
    ctx.fillStyle = sg; ctx.fillRect(sx, -10, shaftW, blockTop + 10);
    // wooden supports and a ladder
    ctx.strokeStyle = '#7a4a1a'; ctx.lineWidth = 6; for (let y = (blockTop - cam) % 90; y < blockTop; y += 90) { ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + shaftW, y); ctx.stroke(); }
    ctx.strokeStyle = '#a8763a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sx + 12, 0); ctx.lineTo(sx + 12, blockTop); ctx.moveTo(sx + 30, 0); ctx.lineTo(sx + 30, blockTop); ctx.stroke(); for (let y = (blockTop - cam) % 22; y < blockTop; y += 22) { ctx.beginPath(); ctx.moveTo(sx + 12, y); ctx.lineTo(sx + 30, y); ctx.stroke(); }
    // hanging lamps light the shaft
    for (let y = (blockTop - cam * .5) % 160 + 40; y < blockTop; y += 160) { const lx = sx + shaftW - 16, gl = ctx.createRadialGradient(lx, y, 0, lx, y, 90); gl.addColorStop(0, 'rgba(255,210,120,.45)'); gl.addColorStop(1, 'rgba(255,210,120,0)'); ctx.fillStyle = gl; ctx.fillRect(lx - 90, y - 90, 180, 180); ctx.fillStyle = '#ffe8a0'; ctx.beginPath(); ctx.arc(lx, y, 5, 0, 7); ctx.fill(); }

    const crewN = Math.min(8, CREW.reduce((a, c) => a + (owned(c.id) ? 1 : 0), 0) + Math.min(4, Math.floor(owned('dwarf') / 5)));

  }
  function drawBlock(B) {
    const L = layer(S.depth), k = 1 - S.hp / blockHp(S.depth), chest = S.depth % 25 === 24, sq = hitT * .06;
    ctx.save(); ctx.translate(B.x + (Math.random() - .5) * hitT * 6, B.y); ctx.scale(1 + sq, 1 - sq);
    const s = B.s;
    ctx.save(); ctx.beginPath(); ctx.roundRect(-s / 2, -s / 2, s, s, s * .08); ctx.clip();
    ctx.drawImage(tex(Math.floor(S.depth / 40)), 40, 40, 160, 160, -s / 2, -s / 2, s, s);
    const sh = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2); sh.addColorStop(0, 'rgba(255,255,255,.25)'); sh.addColorStop(1, 'rgba(0,0,0,.4)'); ctx.fillStyle = sh; ctx.fillRect(-s / 2, -s / 2, s, s);
    // a chunky ore vein
    ctx.fillStyle = L.b.ore; ctx.shadowColor = L.b.ore; ctx.shadowBlur = 14; for (const [x, y, r] of [[-.2, -.1, .1], [.18, .15, .08], [.05, -.25, .06], [-.25, .25, .05]]) { ctx.beginPath(); for (let a = 0; a < 6; a++) ctx.lineTo(x * s + Math.cos(a * 1.05) * r * s, y * s + Math.sin(a * 1.05) * r * s * .8); ctx.fill(); } ctx.shadowBlur = 0;
    // cracks spread as it takes damage

    const n = Math.floor(k * 9); for (let i = 0; i < n; i++) { const a = i * 2.4, r0 = s * .05; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); let x = Math.cos(a) * r0, y = Math.sin(a) * r0; for (let j = 0; j < 4; j++) { x += Math.cos(a + (j % 2 ? .5 : -.4)) * s * .1; y += Math.sin(a + (j % 2 ? .5 : -.4)) * s * .1; ctx.lineTo(x, y); } ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(-s / 2, -s / 2, s, s, s * .08); ctx.stroke();
    if (chest) { const z = s * .5; ctx.shadowColor = '#ffd24a'; ctx.shadowBlur = 24; ctx.drawImage(SPR.chest, -z / 2, -z / 2, z, z); ctx.shadowBlur = 0; }
    ctx.restore();
    // hp bar under the block
    const bw = s, by = B.y + s / 2 + 12; ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.beginPath(); ctx.roundRect(B.x - bw / 2, by, bw, 14, 7); ctx.fill();
    const hg = ctx.createLinearGradient(0, by, 0, by + 14); hg.addColorStop(0, '#ffe24a'); hg.addColorStop(1, '#e8901a'); ctx.fillStyle = hg; ctx.beginPath(); ctx.roundRect(B.x - bw / 2, by, Math.max(14, bw * (1 - k)), 14, 7); ctx.fill();
    ctx.font = '900 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#3a2008'; ctx.fillText(fmt(Math.max(0, S.hp)) + ' / ' + fmt(blockHp(S.depth)), B.x, by + 11);
    ctx.font = '900 15px sans-serif'; ctx.fillStyle = '#ffe8b0'; ctx.lineWidth = 4; ctx.strokeStyle = '#1a0e06'; const lab = (chest ? 'TREASURE · ' : '') + S.depth + ' m · ' + L.b.oreName; ctx.strokeText(lab, B.x, by + 32); ctx.fillText(lab, B.x, by + 32);
  }

  // ---------- economy ----------
  function earn(v) { S.gold += v; S.life += v; }
  function damage(d, x, y, show) {
    // every hit chips off a little ore, so even a tough block pays while it is being worked
    const bh = blockHp(S.depth); earn(goldOf(S.depth) * .3 * Math.min(d, Math.max(0, S.hp)) / bh);
    S.hp -= d; hitT = Math.min(1, hitT + .5);
    if (show) { FX.text(x, y - 10, fmt(d), { color: '#ffffff', size: 22, stroke: '#3a2008', rise: 70, life: .6 }); FX.burst(x, y, { n: 6, colors: layer(S.depth).b.rock.concat([layer(S.depth).b.ore]), shape: 'square', speed: 220, size: 6, gravity: 800 }); }
    while (S.hp <= 0) breakBlock();
  }
  function breakBlock() {
    const B = BLOCK(), v = goldOf(S.depth), chest = S.depth % 25 === 24; earn(v);
    // when the crew smashes many blocks in one frame only the first ones get the full show
    if (breaksThisFrame++ > 1) { S.depth++; S.deepest = Math.max(S.deepest, S.depth); S.hp = blockHp(S.depth); return; }
    FX.burst(B.x, B.y, { n: chest ? 50 : 26, colors: layer(S.depth).b.rock.concat([layer(S.depth).b.ore, '#ffd24a']), shape: 'square', speed: 420, size: 9, gravity: 900 });
    FX.text(B.x, B.y - B.s * .3, '+' + fmt(v) + ' 🪙', { color: chest ? '#ffe24a' : '#ffd24a', size: chest ? 40 : 28, stroke: '#3a2008', life: chest ? 1.4 : .9 });
    if (chest) { FX.burst(B.x, B.y, { n: 40, colors: ['#ffe24a', '#fff6b0'], shape: 'star', speed: 500, size: 10, gravity: 300, glow: 1 }); FX.flash('#ffe8a0', .35); [784, 988, 1175, 1568].forEach((f, k) => setTimeout(() => audio.sfx(f, .2, 'square', .05), k * 70)); }
    S.depth++; S.deepest = Math.max(S.deepest, S.depth); S.hp = blockHp(S.depth); cam = -B.s; shake = .3;

  canvas.addEventListener('pointerdown', e => {
    if (!S.started) return; const B = BLOCK(), x = e.clientX, y = e.clientY;
    if (Math.abs(x - B.x) < B.s * .7 && Math.abs(y - B.y) < B.s * .7) { swing = 1; damage(tapDmg(), x, y, true); audio.sfx(300 + Math.random() * 100, .05, 'square', .05, 150); }
  });
  $('dyn').onclick = () => { if (dynCD > 0 || !S.started) return; dynCD = Math.max(10, 40 - lvl('tnt') * 1.5); const B = BLOCK(); FX.burst(B.x, B.y, { n: 60, colors: ['#ffe24a', '#ff7a1a', '#ffffff', '#3a3a3a'], speed: 700, size: 12, gravity: 500, glow: 1 }); FX.ring(B.x, B.y, { color: '#ffe24a', r1: B.s * 1.6, width: 16 }); FX.shake(18, .5); FX.flash('#ffb04a', .5); FX.text(B.x, B.y - B.s * .6, 'KABOOM!', { color: '#ffe24a', size: 44, stroke: '#7a1a04', wobble: .1, life: 1.2 }); audio.sfx(60, .9, 'sawtooth', .12, 25); damage(tapDmg() * (30 + lvl('tnt') * 10), B.x, B.y, false); };
  function priceN(base, g, own) { if (mode === 'max') { const n = Math.max(1, maxAfford(base, g, own, S.gold)); return [n, cost(base, g, own, n)]; } return [mode, cost(base, g, own, mode)]; }
  function buyCrew(c) { const [n, p] = priceN(c.base, 1.15, owned(c.id)); if (S.gold < p) return; S.gold -= p; const b = owned(c.id); S.crew[c.id] = b + n; if (milestone(b + n) > milestone(b)) FX.text(sceneR.w / 2, sceneR.h * .3, c.name + ' x2!', { color: '#7aff8a', size: 28, stroke: '#0a3a0a', life: 1.4 }); audio.sfx(660, .08, 'square', .05, 990); store(); renderList(true); }
  function buyTool(u) { const p = cost(u.base, u.g, lvl(u.id), 1); if (S.gold < p || (u.max && lvl(u.id) >= u.max)) return; S.gold -= p; S.tools[u.id] = lvl(u.id) + 1; audio.sfx(880, .12, 'square', .05, 1320); store(); renderList(true); }
  const store = () => Idle.save(KEY, S);

  // ---------- panel ----------
  let tab = 'crew', mode = 1, rows = [];
  document.querySelectorAll('.tabs [data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('.tabs [data-t]').forEach(x => x.classList.toggle('on', x === b)); renderList(true); });
  $('mode').onclick = () => { mode = mode === 1 ? 10 : mode === 10 ? 'max' : 1; $('mode').textContent = mode === 'max' ? 'MAX' : 'x' + mode; renderList(true); };
  function iconCanvas(id) { const c = document.createElement('canvas'); c.width = 116; c.height = 116; if (SPR) c.getContext('2d').drawImage(SPR[id], 6, 6, 104, 104); return c; }
  function renderList(full) {

  addEventListener('visibilitychange', () => { if (document.hidden) store(); });

  // ---------- loop ----------
  let saveT = 0, uiT = 0, crewT = 0;
  function update(dt) {

    t += dt; FX.update(dt); hitT = Math.max(0, hitT - dt * 5); cam *= Math.pow(.0005, dt); if (Math.abs(cam) < .5) cam = 0; shake = Math.max(0, shake - dt);

    dynCD = Math.max(0, dynCD - dt);
    const d = dps(); if (d > 0) { damage(d * dt, 0, 0, false); crewT += dt; if (crewT > .7) { crewT = 0; const B = BLOCK(); FX.text(B.x + (Math.random() - .5) * B.s * .6, B.y - B.s * .45, fmt(d * .7), { color: '#c8ffb0', size: 15, stroke: '#1a2a0a', rise: 40, life: .6 }); audio.sfx(200 + Math.random() * 80, .04, 'square', .02); } }
    saveT += dt; if (saveT > 5) { saveT = 0; store(); }
    uiT += dt; if (uiT > .2) { uiT = 0; $('coins').textContent = '🪙 ' + fmt(S.gold); $('ps').textContent = fmt(d) + ' dmg/s · ' + S.depth + ' m'; $('dyn').disabled = dynCD > 0; $('dynT').textContent = dynCD > 0 ? Math.ceil(dynCD) + 's' : 'BLAST'; renderList(false); }

  }
  function drawLogo(cv) {
    const g = cv.getContext('2d'); g.clearRect(0, 0, 480, 480);
    const glow = g.createRadialGradient(240, 260, 20, 240, 260, 240); glow.addColorStop(0, 'rgba(255,200,90,.5)'); glow.addColorStop(1, 'rgba(255,200,90,0)'); g.fillStyle = glow; g.fillRect(0, 0, 480, 480);
    const T = tex(2); g.save(); g.beginPath(); g.roundRect(140, 230, 200, 200, 18); g.clip(); g.drawImage(T, 0, 0, 200, 200, 140, 230, 200, 200); g.restore();
    g.fillStyle = '#ffd24a'; g.shadowColor = '#ffd24a'; g.shadowBlur = 20; for (const [x, y] of [[200, 300], [280, 360], [250, 280]]) { g.beginPath(); for (let a = 0; a < 6; a++) g.lineTo(x + Math.cos(a * 1.05) * 20, y + Math.sin(a * 1.05) * 16); g.fill(); } g.shadowBlur = 0;
    g.drawImage(SPR.dwarfSwing, 100, 100, 160, 160); g.save(); g.translate(380, 210); g.scale(-1, 1); g.drawImage(SPR.dwarf, -60, -60, 120, 120); g.restore(); g.drawImage(SPR.chest, 330, 330, 110, 110);
  }

  resize();
  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
