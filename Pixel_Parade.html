<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff9a8b">
<title>Pixel Parade</title>
<style>
  :root { --safeT: env(safe-area-inset-top, 0px); --safeB: env(safe-area-inset-bottom, 0px); --ink: #4a2f6b; --cream: #fff8ef; --font: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffc7a6; color: #fff; font-family: var(--font); font-weight: 800;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  button { font-family: inherit; font-weight: 900; cursor: pointer; border: 0; color: inherit; background: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 58%, rgba(50,16,70,.30) 100%); }
  .hide { display: none !important; }

  /* ---------- chunky buttons ---------- */
  .btn { --b1: #6ee68a; --b2: #2fb34f; --b3: #1d7d36; position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 20px; padding: 13px 26px; font-size: 21px; line-height: 1; color: #fff; letter-spacing: .5px;
    background: linear-gradient(180deg, var(--b1), var(--b2)); box-shadow: 0 6px 0 var(--b3), 0 10px 18px rgba(40,10,60,.28), inset 0 2px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(0,0,0,.08);
    text-shadow: 0 2px 0 rgba(0,0,0,.22); transition: transform .08s, box-shadow .08s, filter .15s; }
  .btn::after { content: ''; position: absolute; left: 10%; right: 10%; top: 4px; height: 34%; border-radius: 14px; background: linear-gradient(rgba(255,255,255,.42), rgba(255,255,255,0)); pointer-events: none; }
  .btn:active, .btn.press { transform: translateY(5px); box-shadow: 0 1px 0 var(--b3), 0 3px 8px rgba(40,10,60,.25), inset 0 2px 0 rgba(255,255,255,.5); }
  .btn.blue { --b1: #6cc8ff; --b2: #3a86f0; --b3: #2353a8; }
  .btn.orange { --b1: #ffc061; --b2: #ff8a26; --b3: #c25a0e; }
  .btn.pink { --b1: #ff8fc8; --b2: #f0459a; --b3: #a8236a; }
  .btn.purple { --b1: #c39bff; --b2: #8a52e8; --b3: #5a2ea8; }
  .btn.red { --b1: #ff8a8a; --b2: #ec3b4b; --b3: #a01e2c; }
  .btn.gray { --b1: #d9d4e4; --b2: #a59cb8; --b3: #6f6784; }
  .btn.big { font-size: 26px; padding: 16px 34px; border-radius: 24px; }
  .btn.sm { font-size: 16px; padding: 9px 16px; border-radius: 15px; box-shadow: 0 4px 0 var(--b3), 0 6px 10px rgba(40,10,60,.22), inset 0 2px 0 rgba(255,255,255,.5); }
  .btn.sm:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--b3); }
  .btn[disabled] { filter: grayscale(.85) brightness(.95); opacity: .8; }
  .ico { display: inline-block; width: 1.1em; height: 1.1em; flex: none; }
  .ico svg { width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; left: 0; right: 0; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(var(--safeT) + 8px) 12px 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .rnd { width: 46px; height: 46px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex: none;
    background: linear-gradient(#ffffff, #f1e6ff); box-shadow: 0 4px 0 #b9a3d6, 0 6px 12px rgba(40,10,60,.25); color: var(--ink); transition: transform .08s, box-shadow .08s; }
  .rnd:active { transform: translateY(3px); box-shadow: 0 1px 0 #b9a3d6; }
  .rnd .ico { width: 24px; height: 24px; }
  #lvlBox { flex: 1; max-width: 230px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  #lvlRow { display: flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 14px; background: rgba(255,255,255,.92); color: var(--ink);
    box-shadow: 0 3px 0 rgba(120,80,160,.35); font-size: 17px; font-weight: 900; white-space: nowrap; }
  .badge { display: inline-block; padding: 3px 7px 2px; border-radius: 8px; font-size: 11px; font-weight: 900; letter-spacing: .8px; color: #fff; line-height: 1.1; vertical-align: middle;
    background: linear-gradient(#ff6a6a, #d8203a); box-shadow: 0 2px 0 #8a1020; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .badge.super { background: linear-gradient(#b25cff, #6a1fd0); box-shadow: 0 2px 0 #3a0a80; }
  .badge.daily { background: linear-gradient(#5ad0ff, #2a7ae0); box-shadow: 0 2px 0 #174a90; }
  .pbar { width: 100%; height: 10px; border-radius: 6px; background: rgba(60,20,90,.28); overflow: hidden; box-shadow: inset 0 2px 2px rgba(0,0,0,.2); }
  .pbar i { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(#9cf5a8, #36c45a); box-shadow: inset 0 2px 0 rgba(255,255,255,.5); transition: width .25s; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 7px; border-radius: 16px; background: rgba(255,255,255,.92); color: var(--ink);
    box-shadow: 0 3px 0 rgba(120,80,160,.35); font-size: 17px; font-weight: 900; white-space: nowrap; }
  .pill .ico { width: 24px; height: 24px; }
  .pill.bump { animation: bump .35s; }
  @keyframes bump { 40% { transform: scale(1.18); } }

  /* ---------- boosters ---------- */
  #boost { position: fixed; z-index: 10; display: flex; justify-content: center; align-items: center; gap: 10px; pointer-events: none; }
  #boost > button { pointer-events: auto; }
  .bst { position: relative; width: 58px; height: 58px; border-radius: 18px; display: flex; align-items: center; justify-content: center; flex: none;
    background: linear-gradient(#fffdf8, #f3e4ff); box-shadow: 0 5px 0 #a98fcf, 0 8px 14px rgba(40,10,60,.25), inset 0 2px 0 #fff; color: var(--ink); transition: transform .08s, box-shadow .08s; }
  .bst:active { transform: translateY(4px); box-shadow: 0 1px 0 #a98fcf; }
  .bst .ico { width: 34px; height: 34px; }
  .bst b { position: absolute; right: -6px; top: -6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; font-size: 14px; line-height: 24px; color: #fff;
    background: linear-gradient(#ff7aa8, #e8306c); box-shadow: 0 2px 0 #9a1844; border: 2px solid #fff; }
  .bst b.buy { background: linear-gradient(#7aeb8c, #2fb34f); box-shadow: 0 2px 0 #1d7d36; font-size: 12px; }
  .bst.locked { filter: grayscale(1); opacity: .55; }
  .bst.locked b { background: #8a80a0; box-shadow: none; font-size: 11px; }
  .bst.on { animation: glow 1s infinite alternate; }
  @keyframes glow { to { box-shadow: 0 5px 0 #a98fcf, 0 0 0 5px rgba(255,220,80,.85), 0 8px 14px rgba(40,10,60,.25); } }

  /* ---------- overlays ---------- */
  .ov { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: calc(var(--safeT) + 16px) 16px calc(var(--safeB) + 16px); text-align: center; }
  .ov.show { display: flex; animation: ovIn .28s ease-out; }
  .ov.dim { background: rgba(48,18,72,.55); }
  @keyframes ovIn { from { opacity: 0; } }
  .ov.out { animation: ovOut .19s ease-in forwards; pointer-events: none; }
  .ov.out * { pointer-events: none !important; }
  @keyframes ovOut { to { opacity: 0; } }
  .mb:active .rnd { transform: translateY(3px); box-shadow: 0 1px 0 #b9a3d6; }
  .tabs button, .seg button, .tg, .day { transition: transform .08s; }
  .tabs button:active, .seg button:active, .tg:active { transform: translateY(2px) scale(.97); }
  .panel { position: relative; width: min(100%, 420px); max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px;
    background: var(--cream); color: var(--ink); border-radius: 28px; padding: 40px 18px 20px; box-shadow: 0 8px 0 #d9c3ea, 0 22px 50px rgba(30,6,50,.45); animation: popIn .38s cubic-bezier(.2,1.5,.4,1); }
  @keyframes popIn { from { transform: scale(.6); opacity: 0; } }
  .ribbon { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); padding: 11px 30px; border-radius: 18px; font-size: 24px; font-weight: 900; color: #fff; white-space: nowrap;
    background: linear-gradient(#ff8fc8, #f0459a); box-shadow: 0 5px 0 #a8236a, 0 8px 14px rgba(0,0,0,.2); text-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .ribbon.red { background: linear-gradient(#ff8a7a, #ec3b4b); box-shadow: 0 5px 0 #a01e2c; }
  .ribbon.blue { background: linear-gradient(#7ad4ff, #3a86f0); box-shadow: 0 5px 0 #2353a8; }
  .ribbon.green { background: linear-gradient(#7aeb8c, #2fb34f); box-shadow: 0 5px 0 #1d7d36; }
  .ribbon.purple { background: linear-gradient(#c39bff, #8a52e8); box-shadow: 0 5px 0 #5a2ea8; }
  .x { position: absolute; right: -8px; top: -12px; width: 42px; height: 42px; border-radius: 50%; font-size: 22px; color: #fff; z-index: 2;
    background: linear-gradient(#ff8a7a, #ec3b4b); box-shadow: 0 4px 0 #a01e2c; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; }
  .x:active { transform: translateY(3px); box-shadow: 0 1px 0 #a01e2c; }
  .txt { font-size: 17px; line-height: 1.35; color: #6a5288; font-weight: 800; }
  .lnk { font-size: 16px; color: #8a72a8; text-decoration: underline; padding: 6px 10px; }
  .scroll { overflow-y: auto; width: 100%; -webkit-overflow-scrolling: touch; touch-action: pan-y; }

  /* ---------- menu ---------- */
  #menu { justify-content: flex-start; background: linear-gradient(180deg, rgba(255,244,236,.78) 0%, rgba(255,240,245,.30) 34%, rgba(255,240,245,.22) 62%, rgba(70,30,100,.5) 100%); }
  #menu .mmid { margin-top: auto; }
  .mtop { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  .logoWrap { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 0; }
  #logo { width: min(86vw, 440px); height: auto; aspect-ratio: 36 / 17; filter: drop-shadow(0 6px 0 rgba(90,30,110,.35)) drop-shadow(0 10px 20px rgba(60,10,80,.25)); }
  .tagline { font-size: 15px; letter-spacing: 3px; color: #fff; text-shadow: 0 2px 0 rgba(120,40,120,.55), 0 0 12px rgba(120,40,120,.35); text-transform: uppercase; }
  .mmid { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #bPlay { flex-direction: column; gap: 4px; min-width: 230px; padding: 16px 30px 14px; }
  #bPlay .pl1 { font-size: 34px; letter-spacing: 2px; }
  #bPlay .pl2 { font-size: 15px; opacity: .95; display: flex; align-items: center; gap: 6px; }
  .mbot { display: flex; gap: 14px; justify-content: center; margin: 16px 0 44px; }
  .mb { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: #fff; text-shadow: 0 2px 0 rgba(60,20,90,.6); }
  .mb .rnd { width: 60px; height: 60px; border-radius: 20px; }
  .mb .rnd .ico { width: 34px; height: 34px; }
  .mb em, .dotN { position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: #ff3b5c; border: 3px solid #fff; display: none; animation: pulse 1s infinite alternate; }
  .mb em.on { display: block; }
  @keyframes pulse { to { transform: scale(1.2); } }
  .streak { color: #ff6a2a; }

  /* ---------- win ---------- */
  #win { background: radial-gradient(circle at 50% 40%, rgba(255,240,180,.55), rgba(90,30,120,.75) 70%); gap: 10px; }
  .rays { position: absolute; left: 50%; top: 38%; width: 900px; height: 900px; margin: -450px 0 0 -450px; pointer-events: none; opacity: .5;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.38) 0 10deg, rgba(255,255,255,0) 10deg 20deg); animation: spin 18s linear infinite;
    -webkit-mask: radial-gradient(circle, #000 0, transparent 62%); mask: radial-gradient(circle, #000 0, transparent 62%); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wtitle { position: relative; font-size: clamp(38px, 11vw, 58px); font-weight: 900; color: #fff; letter-spacing: 2px; text-shadow: 0 4px 0 #c2307e, 0 8px 0 rgba(90,20,80,.4); animation: popIn .5s cubic-bezier(.2,1.6,.4,1); }
  .postcard { margin-bottom: 14px; position: relative; background: #fff; padding: 12px 12px 8px; border-radius: 14px; box-shadow: 0 8px 0 #e3cfee, 0 18px 36px rgba(30,6,50,.4); transform: rotate(-2deg); color: var(--ink); }
  .postcard canvas { display: block; width: min(64vw, 270px, 38vh); height: min(64vw, 270px, 38vh); border-radius: 8px; background: #f6eefc; }
  .postcard .pname { font-size: 17px; margin-top: 6px; font-weight: 900; }
  .pnew { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%) scale(0) rotate(2deg); padding: 5px 14px; border-radius: 12px; font-size: 14px; font-weight: 900; color: #fff; white-space: nowrap;
    background: linear-gradient(#ffc061, #ff8a26); box-shadow: 0 3px 0 #c25a0e; transition: transform .35s cubic-bezier(.2,1.6,.4,1); }
  .pnew.on { transform: translateX(-50%) scale(1) rotate(2deg); }
  .albumBar.done { box-shadow: 0 0 0 3px #ffd436, 0 4px 0 rgba(120,80,160,.35); animation: bump .5s 2; }
  .postcard.fly { transition: transform .7s cubic-bezier(.5,-0.3,.6,1), opacity .7s; }
  .albumBar { position: relative; width: min(84vw, 320px); display: flex; flex-direction: column; gap: 5px; padding: 9px 14px; border-radius: 16px; background: rgba(255,255,255,.92); color: var(--ink); font-size: 15px; box-shadow: 0 4px 0 rgba(120,80,160,.35); }
  .albumBar .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .albumBar .pbar { height: 14px; }
  .albumBar .pbar i { background: linear-gradient(#ffd86a, #ff9a26); }
  .reward { position: relative; display: flex; align-items: center; gap: 8px; font-size: 32px; color: #fff; text-shadow: 0 3px 0 rgba(90,30,110,.6); }
  #win .reward { opacity: 0; transform: scale(.55); transition: opacity .2s, transform .45s cubic-bezier(.3,1.7,.5,1); } #win .reward.on { opacity: 1; transform: none; }
  .reward .ico { width: 38px; height: 38px; }
  .tag { font-size: 15px; padding: 4px 10px; border-radius: 10px; background: linear-gradient(#ffb36a, #ff5a26); box-shadow: 0 3px 0 #b03a10; text-shadow: none; display: inline-flex; align-items: center; gap: 4px; }
  .tag .ico { width: 18px; height: 18px; }
  .wbtns { display: flex; gap: 12px; align-items: center; }

  /* ---------- album ---------- */
  .albHead { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .arw { width: 44px; height: 44px; border-radius: 14px; font-size: 22px; color: #fff; background: linear-gradient(#c39bff, #8a52e8); box-shadow: 0 4px 0 #5a2ea8; flex: none; }
  .arw:active { transform: translateY(3px); box-shadow: 0 1px 0 #5a2ea8; }
  .albTitle { font-size: 21px; font-weight: 900; }
  .albSub { font-size: 13px; color: #8a72a8; }
  .grid10 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; width: 100%; }
  .pc { position: relative; aspect-ratio: 1; border-radius: 10px; background: #fff; padding: 4px; box-shadow: 0 3px 0 #e0cdef, 0 4px 8px rgba(60,20,90,.15); }
  .pc canvas { width: 100%; height: 100%; display: block; border-radius: 6px; }
  .pc.lock canvas { opacity: .9; }
  .pc .n { position: absolute; left: 0; right: 0; bottom: -2px; font-size: 9px; color: #8a72a8; }
  .pc.new::after { content: ''; position: absolute; inset: -3px; border-radius: 12px; border: 3px solid #ffd23a; animation: pulse .6s infinite alternate; }
  .dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: #e0cdef; }
  .dots i.on { background: #8a52e8; }
  .dots i.done { background: #36c45a; }
  .dots i.on.done { background: #1d7d36; box-shadow: 0 0 0 2px #8a52e8; }

  /* ---------- shop ---------- */
  .tabs { display: flex; gap: 6px; width: 100%; }
  .tabs button { flex: 1; padding: 9px 4px; border-radius: 12px; font-size: 14px; color: #8a72a8; background: #f0e4fa; box-shadow: 0 3px 0 #d9c3ea; }
  .tabs button.on { color: #fff; background: linear-gradient(#c39bff, #8a52e8); box-shadow: 0 3px 0 #5a2ea8; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 10px; width: 100%; padding: 4px 2px 8px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 8px; border-radius: 16px; background: #fff; box-shadow: 0 3px 0 #e0cdef, 0 4px 10px rgba(60,20,90,.12); }
  .item.eq { box-shadow: 0 0 0 3px #36c45a, 0 3px 0 #e0cdef; }
  .item canvas, .item .icoBig { width: 72px; height: 72px; display: block; }
  .item .nm { font-size: 14px; font-weight: 900; }
  .item .ds { font-size: 11px; color: #8a72a8; min-height: 14px; line-height: 1.2; }
  .item .btn { width: 100%; }
  .own { font-size: 12px; color: #36c45a; }

  /* ---------- daily ---------- */
  .cal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
  .day { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 2px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 #e0cdef; font-size: 12px; min-height: 84px; }
  .day .ico { width: 30px; height: 30px; }
  .day b { font-size: 13px; }
  .day.got { opacity: .55; }
  .day.got::after { content: '✓'; position: absolute; right: 6px; top: 4px; color: #36c45a; font-size: 18px; }
  .day.today { box-shadow: 0 0 0 3px #ffb020, 0 3px 0 #e0cdef; animation: pulse .7s infinite alternate; }
  .day.big { grid-column: span 2; background: linear-gradient(#fff6d6, #ffe4a8); }
  .dpic { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: linear-gradient(#efe4ff, #e2d0ff); }
  .dpic canvas { width: 76px; height: 76px; border-radius: 10px; background: #fff; flex: none; }
  .dpic div { flex: 1; text-align: left; font-size: 14px; }

  /* ---------- settings ---------- */
  .set { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .srow { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 #e8daf3; font-size: 17px; }
  .tg { width: 58px; height: 32px; border-radius: 16px; background: #d9cfe6; position: relative; transition: background .2s; flex: none; }
  .tg::after { content: ''; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 3px rgba(0,0,0,.25); transition: left .2s; }
  .tg.on { background: #36c45a; }
  .tg.on::after { left: 29px; }
  .seg { display: flex; gap: 4px; }
  .seg button { padding: 6px 12px; border-radius: 10px; background: #efe4fa; color: #8a72a8; font-size: 15px; }
  .seg button.on { background: #8a52e8; color: #fff; }

  /* ---------- tutorial ---------- */
  .tutPic { width: 200px; height: 130px; border-radius: 16px; background: #f3e8ff; }
  .tutTitle { font-size: 24px; font-weight: 900; }

  /* ---------- banners / toasts / finger ---------- */
  #banner { position: fixed; left: 0; right: 0; top: 40%; z-index: 30; display: flex; flex-direction: column; align-items: center; pointer-events: none; opacity: 0; }
  #banner .bt { font-size: clamp(36px, 10vw, 64px); font-weight: 900; color: #fff; letter-spacing: 2px; text-shadow: 0 4px 0 var(--bc, #c2307e), 0 9px 16px rgba(40,10,60,.45); white-space: nowrap; }
  #banner .bs { font-size: 18px; color: #fff; padding: 5px 14px; border-radius: 12px; background: var(--bc, #c2307e); margin-top: 4px; }
  #banner.go { animation: ban 1.7s cubic-bezier(.2,.9,.3,1) forwards; }
  @keyframes ban { 0% { opacity: 0; transform: scale(2.2); } 14% { opacity: 1; transform: scale(.94); } 22% { transform: scale(1); } 78% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-40px) scale(.9); } }
  #toast { position: fixed; left: 50%; top: calc(var(--safeT) + 70px); z-index: 40; transform: translate(-50%, -20px); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    padding: 10px 18px; border-radius: 16px; background: rgba(60,24,90,.9); color: #fff; font-size: 16px; white-space: nowrap; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #finger { position: fixed; z-index: 35; width: 64px; height: 70px; pointer-events: none; display: none; margin: -6px 0 0 -26px; filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); }
  #finger.on { display: block; animation: tap 1.1s ease-in-out infinite; }
  @keyframes tap { 0%, 100% { transform: translate(14px, 22px) scale(1); } 45% { transform: translate(0, 0) scale(1); } 55% { transform: translate(0, 0) scale(.9); } }
  #finger::before { content: ''; position: absolute; left: 14px; top: -6px; width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9); opacity: 0; animation: tapRing 1.1s infinite; }
  @keyframes tapRing { 50% { opacity: 0; transform: scale(.4); } 58% { opacity: 1; } 100% { opacity: 0; transform: scale(1.6); } }
  #hint { position: fixed; z-index: 34; padding: 7px 14px; border-radius: 14px; background: rgba(60,24,90,.88); color: #fff; font-size: 15px; pointer-events: none; display: none; transform: translate(-50%, -100%); white-space: nowrap; }
  #hint.on { display: block; animation: ovIn .25s; }
  .flyc { position: fixed; z-index: 45; width: 30px; height: 30px; margin: -15px 0 0 -15px; pointer-events: none; }
  .flyc svg { width: 100%; height: 100%; }

  /* ---------- compact & landscape ---------- */
  @media (max-height: 520px) {
    .rnd { width: 40px; height: 40px; border-radius: 13px; }
    #lvlRow { font-size: 15px; padding: 4px 10px; }
    .pill { font-size: 15px; padding: 4px 10px 4px 5px; }
    .pill .ico { width: 20px; height: 20px; }
    .bst { width: 48px; height: 48px; border-radius: 15px; }
    .bst .ico { width: 28px; height: 28px; }
    .bst b { min-width: 20px; height: 20px; line-height: 20px; font-size: 12px; }
    .panel { padding: 30px 14px 12px; gap: 8px; border-radius: 22px; }
    .ribbon { font-size: 19px; padding: 8px 22px; top: -16px; }
    .btn.big { font-size: 21px; padding: 12px 26px; }
    #bPlay .pl1 { font-size: 26px; }
    #logo { width: min(50vw, 330px); }
    .mbot { margin-bottom: 4px; }
    .mb .rnd { width: 48px; height: 48px; }
    .mb .rnd .ico { width: 28px; height: 28px; }
    .postcard canvas { width: 34vh; height: 34vh; }
    .wtitle { font-size: 34px; }
    .reward { font-size: 24px; }
    .grid10 { gap: 6px; }
    .day { min-height: 62px; padding: 4px 2px; }
    .day .ico { width: 22px; height: 22px; }
    .srow { padding: 6px 12px; font-size: 15px; }
    .tutPic { width: 170px; height: 100px; }
    #toast { top: calc(var(--safeT) + 6px); }
    #fail .panel { gap: 6px; padding-top: 28px; }
    #fail #fPic { width: 128px !important; height: 80px !important; }
    #fail .txt { display: none; }
    #fail .tutTitle { font-size: 19px; }
    #fail .btn.big { padding: 10px 24px; }
    #fail .lnk { padding: 2px 10px; }
    body.land #win .wtitle { font-size: 34px; }
    body.land #win .postcard canvas { width: min(56vh, 34vw); height: min(56vh, 34vw); }
  }
  @media (max-height: 700px) and (orientation: portrait) {
    #logo { width: min(64vw, 300px); }
    .tagline { font-size: 12px; }
    #bPlay { min-width: 200px; padding: 12px 26px 10px; }
    #bPlay .pl1 { font-size: 28px; }
    .mbot { margin: 8px 0 40px; gap: 10px; }
    .mb .rnd { width: 50px; height: 50px; border-radius: 16px; }
    .mb .rnd .ico { width: 30px; height: 30px; }
    .postcard canvas { width: min(60vw, 32vh); height: min(60vw, 32vh); }
    .wtitle { font-size: 36px; }
  }
  body.land #menu { display: none; }
  body.land #menu.show { display: grid; grid-template-columns: 1fr 34vw 1fr; grid-template-rows: auto 1fr auto; align-items: center; justify-items: center; }
  body.land #menu .mtop { grid-column: 1 / 4; }

  body.land #menu .mbot { grid-row: 3; grid-column: 1 / 4; margin: 0; }

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);

//  PICTURE LIBRARY — 120 original flat vector subjects in 12 albums.
//  Each subject is authored as SVG path data in a 100×100 box.
//  Shapes: "spec:path" joined by "|". spec = palette key (or "-" to erase)
//  + "~w" stroke width (",d" dash) + "*" even-odd fill + "^" clip to the last plain shape.
//  Path macros on top of SVG path data: O cx cy r · E cx cy rx ry · R x y w h r ·
//  U cx cy rx ry deg (rotated ellipse) · X cx cy ro ri n (star) · K cx cy s (heart) · P x y x y… (polygon)
// =====================================================================
const WEDGES = (c, cx, cy, r, n, gap) => {
  let s = c + ':';
  for (let k = 0; k < n; k++) {
    const a0 = (k / n) * TAU + gap, a1 = ((k + 1) / n) * TAU - gap, am = (a0 + a1) / 2;
    const ox = cx + Math.cos(am) * 3, oy = cy + Math.sin(am) * 3;
    s += 'P' + [ox, oy, cx + Math.cos(a0) * r, cy + Math.sin(a0) * r, cx + Math.cos(am) * r * 1.02, cy + Math.sin(am) * r * 1.02, cx + Math.cos(a1) * r, cy + Math.sin(a1) * r].map(v => v.toFixed(1)).join(' ');
  }
  return s;
};
