<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06070d">
<title>Darts Pro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06070d; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .disp { font-family: "Arial Black", "Avenir Next Heavy", "Helvetica Neue", Impact, sans-serif; font-weight: 900; }
  #menu { justify-content: space-between; padding: calc(16px + env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(3,4,10,.92) 0%, rgba(3,4,10,.55) 16%, rgba(3,4,10,0) 28%, rgba(3,4,10,0) 62%, rgba(3,4,10,.72) 75%, rgba(3,4,10,.95) 100%); }
  .logo { display: flex; flex-direction: column; align-items: center; }
  .title { font-size: clamp(50px, 15vw, 104px); line-height: .92; font-style: italic; letter-spacing: -1px; display: flex; gap: .16em; transform: skewX(-8deg); }
  .title .t1 { background: linear-gradient(180deg, #fff 0%, #e4eaf2 40%, #8592a4 52%, #f2f6fa 72%, #a8b2c0 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #141824) drop-shadow(0 0 16px rgba(150,190,255,.35)); padding-right: .06em; }
  .title .t2 { background: linear-gradient(180deg, #fff3b0 0%, #ffcc33 38%, #e8541a 62%, #a8121e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #3a0608) drop-shadow(0 0 18px rgba(255,120,40,.5)); padding-right: .08em; }
  .tag { margin-top: 8px; font-size: 12px; font-weight: 900; letter-spacing: .5em; color: #ffd65a; padding: 4px 8px 4px 16px; border-top: 1px solid rgba(255,214,90,.5); border-bottom: 1px solid rgba(255,214,90,.5); text-shadow: 0 0 10px rgba(255,200,60,.6); }
  .mbottom { display: flex; flex-direction: column; align-items: center; gap: 11px; padding-bottom: 34px; }
  .mstats { font-size: 13px; color: #cfd8e8; letter-spacing: .5px; line-height: 1.5; text-shadow: 0 1px 2px #000; } .mstats b { color: #ffd65a; }
  .btn { border: none; padding: 15px 44px; border-radius: 40px; font-size: 22px; letter-spacing: 3px; color: #fff; cursor: pointer; font-style: italic;
    background: linear-gradient(180deg, #ff5a4a 0%, #e0182a 48%, #9a0614 100%); box-shadow: 0 5px 0 #4a020a, 0 0 0 2px rgba(255,210,120,.65), 0 0 30px rgba(255,60,40,.45); text-shadow: 0 2px 0 rgba(0,0,0,.35); animation: pulse 1.6s ease-in-out infinite; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #4a020a, 0 0 0 2px rgba(255,210,120,.65); }
  @keyframes pulse { 50% { box-shadow: 0 5px 0 #4a020a, 0 0 0 2px rgba(255,230,150,.9), 0 0 46px rgba(255,90,50,.75); } }
  .btn2 { border: 2px solid rgba(255,214,90,.7); padding: 10px 22px; border-radius: 30px; font-size: 15px; letter-spacing: 2px; color: #ffe08a; cursor: pointer; background: linear-gradient(180deg, rgba(40,46,70,.92), rgba(14,16,28,.94)); box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  .btn2:active { transform: translateY(2px); }
  .mrow { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .coin { display: inline-flex; align-items: center; gap: 7px; font-weight: 900; font-size: 16px; color: #ffe08a; text-shadow: 0 1px 2px #000; }
  .coin::before { content: ''; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c0, #ffcc33 45%, #b87808 100%); box-shadow: 0 0 0 1.5px #7a4a04 inset, 0 0 8px rgba(255,200,60,.6); }
  .hint { font-size: 12px; color: #b8c4d8; max-width: 440px; line-height: 1.45; text-shadow: 0 1px 2px #000; }
  #shop { background: rgba(4,5,12,.86); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }
  .shopbox { width: min(580px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(180deg, #1a1f34, #0c0e1a); border: 1px solid rgba(255,214,90,.35); border-radius: 18px; padding: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.7); }
  .shophead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .shoptitle { font-size: 26px; font-style: italic; background: linear-gradient(180deg,#fff3b0,#ffcc33 50%,#e8641a); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 4px; }
  .x { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: #fff; font-size: 17px; font-weight: 900; cursor: pointer; }
  .tabs { display: flex; gap: 6px; } .tabs button { flex: 1; padding: 9px 2px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: #a8b4cc; font: 900 12px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 1.2px; cursor: pointer; }
  .tabs button.on { background: linear-gradient(180deg, #ffd65a, #e8941a); color: #2a1404; border-color: #ffe08a; }
  .items { overflow-y: auto; touch-action: pan-y; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 2px; }
  .item { position: relative; border-radius: 14px; padding: 8px; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 5px; text-align: left; }
  .item.eq { border-color: #ffd65a; box-shadow: 0 0 0 1px #ffd65a inset, 0 0 18px rgba(255,200,60,.25); }
  .item canvas { width: 100%; height: auto; aspect-ratio: 2 / 1.1; border-radius: 9px; display: block; background: #0a0c16; }
  .item .nm { font: 900 13px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 1px; color: #fff; }
  .item .ds { font-size: 11px; color: #9aa6bc; min-height: 14px; line-height: 1.3; }
  .bar { display: flex; align-items: center; gap: 6px; font-size: 9px; color: #8a96ac; font-weight: 800; letter-spacing: 1px; } .bar span { width: 64px; } .bar i { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; } .bar i b { display: block; height: 100%; background: linear-gradient(90deg, #ffd65a, #ff7a2a); }
  .item button { margin-top: 2px; padding: 8px; border-radius: 9px; border: none; font: 900 12px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 1px; cursor: pointer; background: linear-gradient(180deg, #3adf7a, #129a48); color: #fff; }
  .item button.buy { background: linear-gradient(180deg, #ffd65a, #e8941a); color: #2a1404; } .item button.no { background: rgba(255,255,255,.08); color: #6a7488; cursor: default; } .item button.on { background: transparent; color: #ffd65a; border: 1px solid rgba(255,214,90,.5); }
  #over { background: radial-gradient(ellipse at 50% 35%, rgba(40,10,20,.84), rgba(4,4,10,.96)); }
  .otitle { font-size: clamp(38px, 11vw, 72px); font-style: italic; transform: skewX(-6deg); background: linear-gradient(180deg, #fff, #c8d2e2 50%, #6a7a94); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #10141e); padding-right: 6px; }
  #overScore { font-size: 54px; color: #ffd65a; text-shadow: 0 0 24px rgba(255,200,60,.55); }
  #newBest { font-size: 15px; letter-spacing: 4px; color: #2a0a04; background: linear-gradient(90deg, #ffe84a, #ff9a2a); padding: 6px 16px; border-radius: 4px; transform: rotate(-3deg); box-shadow: 0 0 22px rgba(255,200,60,.8); animation: nb .6s ease-in-out infinite alternate; }
  @keyframes nb { to { transform: rotate(-3deg) scale(1.08); } }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 26px; font-size: 14px; color: #b8c4d8; text-align: left; } .grid b { color: #fff; float: right; margin-left: 14px; }
  #pause { background: rgba(4,5,12,.72); font-size: 38px; letter-spacing: 8px; color: #ffd65a; }
  @media (min-aspect-ratio: 6/5) {
    #menu { flex-direction: row; padding: 20px max(26px, env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(3,4,10,.94) 0%, rgba(3,4,10,.62) 21%, rgba(3,4,10,0) 33%, rgba(3,4,10,0) 67%, rgba(3,4,10,.62) 79%, rgba(3,4,10,.94) 100%); }
    .logo, .mbottom { width: 27%; } .mbottom { padding-bottom: 0; } .title { font-size: clamp(36px, 5.4vw, 84px); flex-direction: column; gap: 0; align-items: center; }
  }
  @media (max-height: 520px) {
    .overlay { gap: 6px; padding: 10px 16px; } .tag { font-size: 9px; letter-spacing: .3em; } .btn { padding: 10px 26px; font-size: 16px; letter-spacing: 2px; } .btn2 { padding: 7px 14px; font-size: 12px; } .hint { display: none; }
    .mbottom { gap: 8px; } .mstats { font-size: 11px; } #overScore { font-size: 32px; } .otitle { font-size: 32px; } .grid { font-size: 12px; gap: 2px 20px; } #newBest { font-size: 12px; padding: 4px 12px; }
    .shopbox { padding: 10px; gap: 6px; } .item canvas { aspect-ratio: 2 / .8; } .items { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } .shoptitle { font-size: 20px; } .tabs button { padding: 6px 2px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="overlay" id="menu">
  <div class="logo">
    <div class="title disp"><span class="t1">DARTS</span><span class="t2">PRO</span></div>
    <div class="tag">CHAMPIONSHIP CAREER</div>
  </div>
  <div class="mbottom">
    <div class="mstats" id="bestMenu"></div>
    <button class="btn disp" id="startBtn">START CAREER</button>
    <div class="mrow"><button class="btn2 disp" id="shopBtn">PRO SHOP</button><div class="coin" id="coinsMenu">0</div></div>
    <div class="hint">Touch to aim · drag to fine-tune · hold still to steady your hand · release or flick up to throw</div>
  </div>
</div>
<div class="overlay hidden" id="shop">
  <div class="shopbox">
    <div class="shophead"><div class="shoptitle disp">PRO SHOP</div><div class="coin" id="shopCoins">0</div><button class="x" id="shopClose">X</button></div>
    <div class="tabs" id="tabs"><button data-t="dart" class="on">DARTS</button><button data-t="flight">FLIGHTS</button><button data-t="board">BOARDS</button><button data-t="venue">VENUES</button></div>
    <div class="items" id="items"></div>
  </div>
</div>
<div class="overlay hidden" id="over">
  <div class="otitle disp">CAREER OVER</div>
  <div id="overScore" class="disp">0</div>
  <div id="newBest" class="disp">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <div class="mrow"><button class="btn disp" id="againBtn">PLAY AGAIN</button><button class="btn2 disp" id="menuBtn">MENU</button></div>
  <div class="hint" id="overMsg"></div>
</div>
<div class="overlay hidden disp" id="pause">PAUSED<div class="hint">tap to continue</div></div>
<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;

  }
  let shopTab = 'dart';
  const thumbs = {};
  $('shopBtn').onclick = () => { $('shop').classList.remove('hidden'); renderShop(); audio.sfx(660, .06, 'triangle', .04, 990); };
  $('shopClose').onclick = () => $('shop').classList.add('hidden');
  $('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; shopTab = b.dataset.t; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); renderShop(); };
  function boardThumb(i) { return thumbs['b' + i] || (thumbs['b' + i] = renderBoard(BOARDS[i], 256)); }
  function drawPreview(c, tab, i) {
    const g = c.getContext('2d'), w = c.width, h = c.height;
    let gr = g.createRadialGradient(w / 2, h * .4, 10, w / 2, h / 2, w * .7); gr.addColorStop(0, '#2a3050'); gr.addColorStop(1, '#0a0c16'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    if (tab === 'dart') drawDartSide(g, w / 2, h / 2, w * .84, DARTS[i], FLIGHTS[SAVE.eq.flight], -.14);
    else if (tab === 'flight') drawDartSide(g, w * .8, h / 2 + 4, w * 1.55, DARTS[SAVE.eq.dart], FLIGHTS[i], -.1);
    else if (tab === 'board') { g.drawImage(SHADOW, w / 2 - h * .6, h * .02, h * 1.2, h * 1.08); g.drawImage(boardThumb(i), w / 2 - h * .47, h * .03, h * .94, h * .94); }
    else { paintVenue(g, i, w, h, w / 2, h * .5, h * .25, 1, { lamps: [], neon: [], st: 0 }); const R = h * .25 * 300 / 225; g.drawImage(boardThumb(SAVE.eq.board), w / 2 - R, h * .5 - R, R * 2, R * 2); }
  }
  function renderShop() {
    const list = CAT[shopTab], box = $('items'); box.innerHTML = '';
    list.forEach((it, i) => {
      const own = SAVE.own[shopTab].includes(i), eq = SAVE.eq[shopTab] === i, el = document.createElement('div');
      el.className = 'item' + (eq ? ' eq' : '');
      const c = mk(300, 165); drawPreview(c, shopTab, i); el.appendChild(c);
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.nm; el.appendChild(nm);
      if (shopTab === 'dart') {
        const bars = [['STABILITY', 1 - (it.stab - 6) / 8], ['PRECISION', 1 - (it.prec - 2) / 5], ['GRIP', (it.grip - .5) / 1]];
        const ds = document.createElement('div'); ds.innerHTML = `<div class="ds">${it.wt}</div>` + bars.map(([a, v]) => `<div class="bar"><span>${a}</span><i><b style="width:${Math.round(clamp(v, .08, 1) * 100)}%"></b></i></div>`).join(''); el.appendChild(ds);
      } else { const ds = document.createElement('div'); ds.className = 'ds'; ds.textContent = shopTab === 'venue' ? it.ds : shopTab === 'board' ? (it.thin ? 'Blade-thin wires · fewer bounce-outs' : it.wood ? 'Old-school elm end grain' : 'Self-healing bristle board') : 'Pattern: ' + it.pat; el.appendChild(ds); }
      const b = document.createElement('button');
      if (eq) { b.className = 'on'; b.textContent = 'EQUIPPED'; }
      else if (own) b.textContent = 'EQUIP';
      else { b.className = SAVE.coins >= it.price ? 'buy' : 'no'; b.textContent = 'BUY ' + fmt(it.price); }
      b.onclick = () => {
        if (eq) return;
        if (!own) { if (SAVE.coins < it.price) { audio.sfx(160, .15, 'square', .04); return; } SAVE.coins -= it.price; SAVE.own[shopTab].push(i); audio.sfx(1568, .1, 'square', .04, 2093); }
        SAVE.eq[shopTab] = i; saveNow(); audio.sfx(880, .08, 'triangle', .05, 1320);
        if (shopTab === 'board') { buildBoardCache(true); }
        if (shopTab === 'venue' && G && G.attract) setVenue(i, venueK);
        if (shopTab === 'flight' || shopTab === 'dart') { for (const k in thumbs) if (k[0] === 'f') delete thumbs[k]; }
        renderShop();
      };
      el.appendChild(b); box.appendChild(el);
    });
    updateMenu();
  }
  function pause() { if (!G || G.attract || paused || G.phase === 'over') return; paused = true; hold = null; $('pause').classList.remove('hidden'); }
  function resume() { paused = false; $('pause').classList.add('hidden'); last = performance.now(); }
  $('pause').addEventListener('pointerdown', e => { e.stopPropagation(); resume(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  addEventListener('resize', () => { resize(); });

  // ---------- test hook ----------
  window.__dp = {
    G: () => G, SAVE, start, fps: () => Math.round(fps),
    state: () => ({ phase: G.phase, stage: G.stage, type: G.match && G.match.type, turn: G.match && G.match.turn, rem: G.match && G.match.rem, tgt: G.match && G.match.tgt, pts: G.match && G.match.pts, lives: G.lives, score: G.score, coins: SAVE.coins, darts: G.darts.length, venue: venueIdx, canThrow: canThrow(), zoom: +CAM.z.toFixed(2), replay: !!G.replay, fps: Math.round(fps) }),
    autopilot: v => { G.autopilot = v; }, perfect: v => { G.perfect = v; },
    setStage: n => { G.stage = n - 1; G.lives = Math.max(G.lives, 3); FX.clear(); nextStage(); },
    coins: n => { SAVE.coins += n; saveNow(); updateMenu(); },
    unlockAll: () => { for (const k in CAT) SAVE.own[k] = CAT[k].map((_, i) => i); saveNow(); },
    equip: (tab, i) => { SAVE.eq[tab] = i; if (!SAVE.own[tab].includes(i)) SAVE.own[tab].push(i); saveNow(); if (tab === 'board') buildBoardCache(true); if (tab === 'venue') setVenue(i, venueK); },
    win: () => matchEnd(true), lose: () => matchEnd(false), lives: n => { G.lives = n; },
    next: () => { if (G.phase === 'intro') beginPlay(); else if (G.phase === 'result') advanceResult(); else if (G.phase === 'trophy') leaveTrophy(); },
    setRem: n => { G.match.rem[0] = n; G.match.vstart = n; },
    throwAt: lb => { if (!canThrow()) return false; const p = toWorld(...labelPoint(lb), poseAt(G.mt + FLIGHT_T)); startHold('t', p[0], p[1]); const pf = G.perfect; G.perfect = true; release(null); G.perfect = pf; return true; },
    gameOver: () => gameOver()
  };
  resize(); newRun(true); updateMenu();
  (function loop(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    fpsT += dt; fpsN++; if (fpsT >= .5) { fps = fpsN / fpsT; fpsT = 0; fpsN = 0; }
    if (!paused) update(dt);
    render(); requestAnimationFrame(loop);
  })(performance.now());
})();
</script>
</body>
</html>
