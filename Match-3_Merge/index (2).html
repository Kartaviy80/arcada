<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a5d80">
<title>Ocean Pop</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a5d80;
    font-family: "Baloo 2", "Trebuchet MS", "Segoe UI", sans-serif; color: #eafcff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(460px, 94vw); display: flex; gap: 8px; pointer-events: none; }
  .pill { flex: 1; text-align: center; background: #ffffff22; border: 2px solid #ffffff55; border-radius: 18px; padding: 4px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .pill small { display: block; font-size: 10px; letter-spacing: 2px; opacity: .8; }
  .pill b { font-size: 22px; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: #032a3acc; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card { width: min(350px, 100%); background: linear-gradient(#1fb6d6, #0a5d80); border: 3px solid #bff3ff; border-radius: 28px; padding: 24px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px #0008; }
  .card canvas { width: 170px; height: 85px; margin: 0 auto; }
  h1 { font-size: clamp(42px, 12vw, 60px); line-height: 1; color: #fff; text-shadow: 0 4px 0 #0a5d80, 0 0 20px #bff3ff; }
  p { font-size: 15px; line-height: 1.5; }
  .stat { font-size: 18px; } .stat b { color: #ffe066; }
  .btn { border: none; background: #ffe066; color: #0a5d80; font: inherit; font-weight: bold; font-size: 22px; padding: 12px; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 0 #c9a21c; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c9a21c; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="pill"><small>LEVEL</small><b id="level">1</b></div>
  <div class="pill"><small>BUBBLES</small><b id="bubbles">0</b></div>
  <div class="pill"><small>MOVES</small><b id="moves">0</b></div>
</div>

<div class="overlay" id="menu"><div class="card">
  <canvas id="logo" width="340" height="170"></canvas>
  <h1>Ocean Pop</h1>
  <p>Sea friends are trapped in bubbles! Make matches <b>on top of the bubbles</b> to pop them. Pop every bubble before your moves run out. Thick bubbles need two hits.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">Dive in</button>
</div></div>
<div class="overlay hidden" id="win"><div class="card">
  <h1>All free!</h1>
  <div class="stat">Moves left <b id="left">0</b></div>
  <button class="btn" id="nextBtn">Next reef</button>
</div></div>
<div class="overlay hidden" id="over"><div class="card">
  <h1>Out of air</h1>
  <div class="stat">Reached reef <b id="finalLevel">1</b> · best <b id="bestOver">1</b></div>
  <button class="btn" id="againBtn">Try again</button>
</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*MATCH3-ENGINE-START*/
// ---------- match-3 engine: swaps, matches, specials, cascades, blockers ----------
// Game code renders pieces from engine.grid using each piece's animated x/y (in cell units)
// and reacts to events (onClear, onCascade, onSettled ...).
const Match3 = (opts) => {
  const C = opts.cols, R = opts.rows, K = opts.kinds;
  let uid = 1, phase = 'idle', timer = 0, cascade = 0, swapPair = null, idleT = 0;
  const grid = [], layer = [];
  const mk = (kind, r, c, y) => ({ id: uid++, kind, special: null, r, c, x: c, y: y === undefined ? r : y, vy: 0, dying: 0, pop: 0 });
  const inside = (r, c) => r >= 0 && r < R && c >= 0 && c < C;
  const holeAt = (r, c) => opts.hole ? opts.hole(r, c) : false;
  const rk = () => Math.floor(Math.random() * K);

  for (let r = 0; r < R; r++) {
    grid.push([]); layer.push([]);
    for (let c = 0; c < C; c++) {
      layer[r].push(opts.layer ? opts.layer(r, c) : 0);
      if (holeAt(r, c)) { grid[r].push(null); continue; }
      let k;
      do { k = rk(); } while ((c >= 2 && grid[r][c - 1] && grid[r][c - 2] && grid[r][c - 1].kind === k && grid[r][c - 2].kind === k) ||
                              (r >= 2 && grid[r - 1][c] && grid[r - 2][c] && grid[r - 1][c].kind === k && grid[r - 2][c].kind === k));
      grid[r].push(mk(k, r, c, r - R - 1));
    }
  }
  phase = 'fall';

  const at = (r, c) => inside(r, c) ? grid[r][c] : null;
  const same = (a, b) => a && b && !a.dying && !b.dying && a.kind >= 0 && a.kind === b.kind;

  function findRuns() {
    const runs = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C;) {
      let e = c + 1; while (e < C && same(grid[r][c], grid[r][e])) e++;
      if (e - c >= 3 && grid[r][c] && grid[r][c].kind >= 0) runs.push({ dir: 'h', cells: Array.from({ length: e - c }, (_, i) => [r, c + i]) });
      c = e;
    }
    for (let c = 0; c < C; c++) for (let r = 0; r < R;) {
      let e = r + 1; while (e < R && same(grid[r][c], grid[e][c])) e++;
      if (e - r >= 3 && grid[r][c] && grid[r][c].kind >= 0) runs.push({ dir: 'v', cells: Array.from({ length: e - r }, (_, i) => [r + i, c]) });
      r = e;
    }
    return runs;
  }

  // queue every cell to clear, chaining through special pieces
  function blast(seed) {
    const out = new Map(), q = [...seed];
    while (q.length) {
      const [r, c] = q.pop(), key = r * C + c;
      if (out.has(key) || !inside(r, c)) continue;
      const p = grid[r][c];
      out.set(key, [r, c]);
      if (!p || !p.special) continue;
      if (p.special === 'h') for (let x = 0; x < C; x++) q.push([r, x]);
      else if (p.special === 'v') for (let y = 0; y < R; y++) q.push([y, c]);
      else if (p.special === 'bomb') for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) q.push([r + y, c + x]);
      else if (p.special === 'color') { const k = p.target !== undefined ? p.target : rk(); for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) if (grid[y][x] && grid[y][x].kind === k) q.push([y, x]); }
    }
    return [...out.values()];
  }

  function clearCells(cells, keep) {
    const cleared = [];
    for (const [r, c] of cells) {
      const p = grid[r][c];
      if (layer[r][c] > 0) { layer[r][c]--; opts.onLayer && opts.onLayer(r, c, layer[r][c]); }
      if (!p || p.dying || keep.has(p)) continue;
      p.dying = 0.0001;
      cleared.push(p);
    }
    if (cleared.length) opts.onClear && opts.onClear(cleared, cascade);
    return cleared.length;
  }

  function resolve(preferred) {
    const runs = findRuns();
    if (!runs.length) return false;
    cascade++;
    const count = {};
    runs.forEach((run, i) => run.cells.forEach(([r, c]) => { (count[r * C + c] = count[r * C + c] || []).push(i); }));
    const keep = new Set(), used = new Set();
    const promote = (r, c, special, target) => {
      const p = grid[r][c]; if (!p) return;
      p.special = special; p.pop = 1; keep.add(p);
      if (special === 'color') { p.kind = -1; }
      opts.onSpecial && opts.onSpecial(p);
    };
    const pick = run => {
      if (preferred) for (const p of preferred) if (p && run.cells.some(([r, c]) => r === p.r && c === p.c)) return [p.r, p.c];
      return run.cells[Math.floor(run.cells.length / 2)];
    };
    if (opts.specials !== false) {
      runs.forEach((run, i) => { if (run.cells.length >= 5) { used.add(i); const [r, c] = pick(run); promote(r, c, 'color'); } });
      for (const key in count) {
        const ids = count[key].filter(i => !used.has(i));
        if (ids.length >= 2) { ids.forEach(i => used.add(i)); promote(Math.floor(key / C), key % C, 'bomb'); }
      }
      runs.forEach((run, i) => { if (!used.has(i) && run.cells.length === 4) { const [r, c] = pick(run); promote(r, c, run.dir === 'h' ? 'v' : 'h'); } });
    }
    const seed = [];
    runs.forEach(run => run.cells.forEach(cell => { const p = grid[cell[0]][cell[1]]; if (!keep.has(p)) seed.push(cell); }));
    clearCells(blast(seed), keep);
    phase = 'clear'; timer = 0.24;
    return true;
  }

  function collapse() {
    for (let c = 0; c < C; c++) {
      // pieces drop through each column; holes stay empty
      const stack = [];
      for (let r = R - 1; r >= 0; r--) { if (holeAt(r, c)) continue; const p = grid[r][c]; if (p && !p.dying) stack.push(p); grid[r][c] = null; }
      let spawn = 0;
      for (let r = R - 1; r >= 0; r--) {
        if (holeAt(r, c)) continue;
        let p = stack.shift();
        if (!p) { spawn++; p = mk(rk(), r, c, -spawn); }
        p.r = r; p.c = c; grid[r][c] = p;
      }
    }
    phase = 'fall';
  }

  function swapKinds(a, b) { const t = grid[a.r][a.c]; grid[a.r][a.c] = grid[b.r][b.c]; grid[b.r][b.c] = t; }
  function hasMove() {
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const p = grid[r][c]; if (!p) continue;
      if (p.special === 'color') return [[r, c], inside(r, c + 1) && grid[r][c + 1] ? [r, c + 1] : [r + 1, c]];
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const q = at(r + dr, c + dc); if (!q) continue;
        swapKinds({ r, c }, { r: r + dr, c: c + dc });
        const ok = findRuns().length > 0;
        swapKinds({ r, c }, { r: r + dr, c: c + dc });
        if (ok) return [[r, c], [r + dr, c + dc]];
      }
    }
    return null;
  }
  function shuffle() {
    const all = []; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (grid[r][c]) all.push(grid[r][c]);
    for (let tries = 0; tries < 200; tries++) {
      all.forEach(p => { if (!p.special) p.kind = rk(); });
      if (!findRuns().length && hasMove()) break;
    }
    opts.onShuffle && opts.onShuffle();
  }

  const api = {
    grid, layer, R, C, selected: null, hint: null,
    get phase() { return phase; },
    get busy() { return phase !== 'idle'; },
    trySwap(r1, c1, r2, c2) {
      if (phase !== 'idle' || !inside(r1, c1) || !inside(r2, c2) || Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return false;
      const a = grid[r1][c1], b = grid[r2][c2];
      if (!a || !b || (opts.canSwap && !opts.canSwap())) return false;
      api.selected = null; api.hint = null; idleT = 0;
      grid[r1][c1] = b; grid[r2][c2] = a;
      a.r = r2; a.c = c2; b.r = r1; b.c = c1;
      swapPair = [a, b]; cascade = 0; phase = 'swap';
      opts.onSwap && opts.onSwap();
      return true;
    },
    update(dt) {
      let moving = false;
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {

      ctx.drawImage(p.special === 'color' ? SPR.pearl : SPR['s' + p.kind], -sz / 2, -sz / 2, sz, sz);
      ctx.restore();
      if (p.special === 'h' || p.special === 'v') { ctx.save(); ctx.translate(x, y); if (p.special === 'v') ctx.rotate(Math.PI / 2); ctx.fillStyle = 'rgba(255,255,255,.85)'; for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * sz * 0.5, 0); ctx.lineTo(d * sz * 0.36, -sz * 0.12); ctx.lineTo(d * sz * 0.36, sz * 0.12); ctx.fill(); } ctx.restore(); }
      if (p.special === 'bomb') { ctx.strokeStyle = 'rgba(255,224,102,' + (0.6 + Math.sin(t * 8) * 0.4) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, sz * 0.5, 0, Math.PI * 2); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    // bubble blockers sit on top of the board cells
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const L = eng.layer[r][c]; if (L) { const wob = 1 + Math.sin(t * 3 + r + c) * 0.03; const sz = cell * 1.02 * wob; ctx.drawImage(SPR[L > 1 ? 'bub2' : 'bub1'], bx + (c + 0.5) * cell - sz / 2, by + (r + 0.5) * cell - sz / 2, sz, sz); } }
    for (const p of pops) { ctx.globalAlpha = Math.max(0, p.life * 1.8); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, p.ring ? 3 : 4, 0, Math.PI * 2); ctx.stroke(); }
    ctx.globalAlpha = 1;
    $('level').textContent = level; $('moves').textContent = Math.max(0, moves); $('bubbles').textContent = bubLeft;
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
