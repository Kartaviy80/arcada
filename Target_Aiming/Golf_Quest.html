<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b3a1a">
<title>Golf Quest</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b3a1a; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; text-align: center; transition: opacity .35s; }
  .hidden { opacity: 0 !important; pointer-events: none !important; }
  button { font-family: inherit; }
  #menu { justify-content: space-between; padding: calc(26px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(3,26,10,.78) 0%, rgba(3,26,10,.18) 30%, rgba(3,26,10,0) 50%, rgba(3,22,9,.9) 100%); }
  .title { font-size: clamp(56px, 16vw, 116px); font-weight: 900; line-height: .84; letter-spacing: 1px; font-style: italic;
    background: linear-gradient(180deg, #ffffff 0%, #fff6c0 26%, #ffd23a 52%, #ff9a1a 78%, #d4600a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #1d5a1a) drop-shadow(0 6px 0 #0b3210) drop-shadow(0 12px 18px rgba(0,0,0,.55)); }
  .title span { display: block; background: linear-gradient(180deg, #f6ffe8 0%, #b8ff7a 40%, #3fd23f 72%, #138a22 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { letter-spacing: .4em; font-size: 12px; font-weight: 800; color: #eaffdc; text-shadow: 0 2px 4px rgba(0,0,0,.7); margin-top: 12px; }
  .mb { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .row { display: flex; align-items: center; gap: 14px; justify-content: center; }
  .col { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  #locker { width: 116px; height: 136px; filter: drop-shadow(0 8px 10px rgba(0,0,0,.5)); }
  .btn { border: none; border-radius: 999px; padding: 15px 50px; font-weight: 900; font-size: 28px; line-height: 1; letter-spacing: 3px; color: #3a2200; cursor: pointer; font-style: italic;
    background: linear-gradient(180deg, #fff8c8 0%, #ffd23a 45%, #ff9a1a 100%); box-shadow: 0 6px 0 #b0560a, 0 12px 24px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.85);
    text-shadow: 0 1px 0 rgba(255,255,255,.7); animation: pulse 1.6s ease-in-out infinite; }
  .btn:active { transform: translateY(4px) !important; box-shadow: 0 2px 0 #b0560a, 0 6px 14px rgba(0,0,0,.4); }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  .btn2 { border: 2px solid rgba(255,255,255,.45); border-radius: 999px; padding: 10px 20px; font-weight: 900; font-size: 15px; line-height: 1; letter-spacing: 2px; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #48d062, #1a8a32); box-shadow: 0 4px 0 #0c5a1c, 0 8px 16px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; gap: 8px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .btn2:active { transform: translateY(3px); box-shadow: 0 1px 0 #0c5a1c; }
  .coin { display: inline-block; width: 18px; height: 18px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 30%, #fff8c0, #ffd23a 45%, #c8860a); box-shadow: inset 0 0 0 2px #a8700a, 0 1px 2px rgba(0,0,0,.4); }
  .stat { font-size: 14px; font-weight: 800; letter-spacing: 1px; color: #e8ffd8; text-shadow: 0 1px 3px #000; } .stat b { color: #ffe27a; }
  .hint { font-size: 12px; color: #d8f0c8; max-width: min(460px, calc(100vw - 110px)); text-shadow: 0 1px 2px #000; line-height: 1.4; }
  #shop { background: radial-gradient(ellipse at 50% 25%, rgba(24,100,44,.95), rgba(3,28,11,.98)); justify-content: flex-start; padding: calc(12px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom)); gap: 8px; z-index: 12; }
  .shead { width: 100%; max-width: 580px; display: flex; justify-content: space-between; align-items: center; }
  .shead h3 { font-size: 27px; font-weight: 900; font-style: italic; letter-spacing: 2px; color: #ffe27a; text-shadow: 0 3px 0 #0b4a18, 0 0 18px rgba(255,220,90,.35); }
  .pill { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.38); padding: 6px 13px; border-radius: 999px; font-weight: 900; font-size: 17px; color: #ffe27a; }
  #shopPrev { width: 100%; max-width: 380px; height: 150px; flex: none; }
  .tabs { display: flex; gap: 6px; width: 100%; max-width: 580px; flex: none; }
  .tabs button { flex: 1; padding: 10px 2px; border-radius: 12px; border: none; font-weight: 900; font-size: 13px; letter-spacing: 1px; color: #cfe8c8; background: rgba(0,0,0,.32); cursor: pointer; }
  .tabs button.on { background: linear-gradient(180deg, #fff0a0, #ffb02a); color: #3a2200; box-shadow: 0 3px 0 #a8600a; }
  .items { flex: 1; min-height: 0; width: 100%; max-width: 580px; overflow-y: auto; touch-action: pan-y; display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; align-content: start; padding: 4px 2px; }
  .item { position: relative; background: linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.04)); border: 2px solid rgba(255,255,255,.12); border-radius: 14px; padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; transition: transform .12s; }
  .item:active { transform: scale(.96); }
  .item.eq { border-color: #ffe27a; box-shadow: 0 0 16px rgba(255,226,122,.45), inset 0 0 12px rgba(255,226,122,.18); }
  .item.sel { border-color: #9fe8ff; }
  .item canvas { width: 64px; height: 64px; }
  .item .nm { font-size: 11px; font-weight: 900; letter-spacing: 1px; white-space: nowrap; }
  .item .pr { font-size: 12px; font-weight: 900; color: #ffe27a; display: flex; align-items: center; gap: 4px; }
  .item .pr .coin { width: 13px; height: 13px; }
  .item .pr.own { color: #a8f0a8; } .item.eq .pr { color: #ffe27a; }
  .item.poor .pr { color: #ff9a8a; } .item.locked canvas { filter: saturate(.35) brightness(.75); }
  .bars { display: flex; flex-direction: column; gap: 2px; width: 74px; }
  .bars i { display: block; height: 4px; border-radius: 2px; background: rgba(0,0,0,.4); overflow: hidden; } .bars i b { display: block; height: 100%; background: linear-gradient(90deg, #7affb0, #ffe27a); }
  .sdesc { font-size: 12px; font-weight: 800; color: #d8f0c8; min-height: 16px; letter-spacing: .5px; }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(10,64,28,.88), rgba(2,18,8,.97)); z-index: 11; }
  #over h2 { font-size: clamp(40px, 11vw, 78px); font-weight: 900; font-style: italic; line-height: 1; color: #ffe27a; text-shadow: 0 4px 0 #0b4a18, 0 0 30px rgba(255,210,60,.45); }
  #overHole { font-size: 13px; font-weight: 800; letter-spacing: 3px; color: #cfe8c8; }
  #overScore { font-size: 58px; font-weight: 900; line-height: 1; text-shadow: 0 0 24px rgba(255,230,120,.55), 0 4px 0 #0b4a18; }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #3a1a00; background: linear-gradient(90deg, #fff27a, #ffb02a); padding: 6px 16px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 0 22px rgba(255,220,80,.85); animation: pulse 1s ease-in-out infinite; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 26px; font-size: 14px; font-weight: 700; color: #d8eccc; text-align: left; background: rgba(0,0,0,.25); padding: 12px 16px; border-radius: 14px; }
  .grid b { float: right; color: #ffe27a; margin-left: 14px; }
  .card { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: min(420px, 92vw); }
  .card i { font-style: normal; width: 26px; height: 32px; border-radius: 7px; background: rgba(0,0,0,.3); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 8px; font-weight: 800; color: #9ab890; line-height: 1.1; }
  .card i b { font-size: 13px; font-weight: 900; width: 19px; height: 19px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; }
  .card i b.u { background: #2fae4a; box-shadow: 0 0 0 2px #8aff6a; } .card i b.e { background: #1a8ab0; box-shadow: 0 0 0 2px #7af0ff; } .card i b.h { background: #d89a10; box-shadow: 0 0 0 2px #ffe14a; } .card i b.o { background: #b8461a; } .card i b.p { background: transparent; }
  #unlockMsg { font-size: 13px; font-weight: 800; color: #9fe8ff; letter-spacing: 1px; min-height: 16px; }
  #pause { background: rgba(2,20,8,.72); z-index: 11; } .ptitle { font-size: 42px; font-weight: 900; font-style: italic; letter-spacing: 8px; color: #ffe27a; text-shadow: 0 4px 0 #0b4a18; }
  .hb { position: fixed; z-index: 6; width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(4,30,12,.5); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); transition: opacity .3s; padding: 0; }
  .hb svg { width: 20px; height: 20px; }
  #pauseBtn { top: calc(8px + env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); }
  #mapBtn { top: calc(56px + env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); }
  #mapBtn.on { background: linear-gradient(180deg, #fff0a0, #ffb02a); color: #3a2200; }
  #chipBtn { bottom: max(14px, env(safe-area-inset-bottom)); left: max(14px, env(safe-area-inset-left)); width: auto; height: 46px; border-radius: 23px; padding: 0 16px 0 8px; font-weight: 900; font-size: 15px; letter-spacing: 2px; gap: 7px; }
  #chipBtn .ic { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; }
  #chipBtn.on { background: linear-gradient(180deg, #fff0a0, #ff9d1a); color: #3a2200; border-color: #fff6c0; box-shadow: 0 0 18px rgba(255,200,60,.6); }
  @media (max-height: 700px) and (min-height: 521px) { .title { font-size: 62px; } #locker { width: 96px; height: 112px; } .btn { padding: 12px 40px; font-size: 24px; } }
  @media (max-height: 520px) {
    .overlay { gap: 6px; padding: 8px 16px; } .title { font-size: 46px; } .tag { margin-top: 4px; font-size: 10px; } .hint { display: none; }
    #menu { padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
    #locker { width: 80px; height: 94px; } .btn { padding: 10px 34px; font-size: 21px; } .btn2 { padding: 8px 16px; font-size: 13px; }
    #shopPrev { height: 86px; } .shead h3 { font-size: 21px; } .tabs button { padding: 7px 2px; } .items { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; } .item canvas { width: 46px; height: 46px; }
    #over h2 { font-size: 38px; } #overScore { font-size: 36px; } .card { display: none; } .grid { font-size: 12px; gap: 3px 18px; padding: 8px 12px; } .ptitle { font-size: 30px; }
  }
  @media (max-height: 520px) and (min-width: 600px) { #menu { flex-direction: row; align-items: center; justify-content: space-around; } #over { flex-direction: row; flex-wrap: wrap; align-content: center; column-gap: 28px; } #over h2 { width: 100%; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="overlay" id="menu">
  <div class="titlebox"><div class="title">GOLF<span>QUEST</span></div><div class="tag">ENDLESS MINI GOLF ADVENTURE</div></div>
  <div class="mb">
    <div class="stat" id="bestMenu"></div>
    <div class="row">
      <canvas id="locker" width="232" height="272"></canvas>
      <div class="col">
        <button class="btn" id="startBtn">PLAY</button>
        <button class="btn2" id="shopBtn"><i class="coin"></i><span id="coinMenu">0</span>&nbsp;· PRO SHOP</button>
      </div>
    </div>
    <div class="hint">Drag back from anywhere &amp; release to putt · CHIP flies over hazards · every stroke over par costs a heart</div>
  </div>
</div>
<div class="overlay hidden" id="shop">
  <div class="shead"><h3>PRO SHOP</h3><div class="pill"><i class="coin"></i><span id="coinShop">0</span></div></div>
  <canvas id="shopPrev" width="760" height="300"></canvas>
  <div class="sdesc" id="sdesc"></div>
  <div class="tabs" id="tabs"><button data-t="ball" class="on">BALLS</button><button data-t="putter">PUTTERS</button><button data-t="flag">FLAGS</button><button data-t="hat">HATS</button></div>
  <div class="items" id="items"></div>
  <button class="btn2" id="shopBack">BACK TO MENU</button>
</div>
<div class="overlay hidden" id="over">
  <h2 id="overTitle">OUT OF HEARTS</h2>
  <div id="overHole"></div>
  <div id="overScore">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <div class="card" id="scoreCard"></div>
  <div id="unlockMsg"></div>
  <div class="col"><button class="btn" id="againBtn">PLAY AGAIN</button><button class="btn2" id="menuBtn">MENU</button></div>
</div>
<div class="overlay hidden" id="pause"><div class="ptitle">PAUSED</div><div class="hint" style="display:block">tap to continue</div><button class="btn2" id="quitBtn">QUIT TO MENU</button></div>
<button class="hb hidden" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>
<button class="hb hidden" id="mapBtn" aria-label="Course map"><svg viewBox="0 0 20 20"><path d="M2 5 L7 3 L13 5 L18 3 L18 15 L13 17 L7 15 L2 17 Z M7 3 V15 M13 5 V17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
<button class="hb hidden" id="chipBtn" aria-label="Toggle chip shot"><span class="ic"><svg viewBox="0 0 20 20"><path d="M2 16 Q10 -2 18 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="2.5 2.5"/><circle cx="18" cy="15" r="2.4" fill="currentColor"/></svg></span><span id="chipLbl">CHIP</span></button>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +

    if (!mode) { const f = gear('flag'), fs = SPR['flag_' + f.id], px = w * .8, pt = h * .25; g.strokeStyle = '#f4f4f0'; g.lineWidth = 4; g.beginPath(); g.moveTo(px, fy); g.lineTo(px, pt); g.stroke(); g.fillStyle = '#111'; g.beginPath(); g.ellipse(px, fy, 14, 5, 0, 0, TAU); g.fill(); if (fs) for (let i = 0; i < 12; i++) g.drawImage(fs, i * 10, 0, 10, 80, px + 2 + i * 7, pt + Math.sin(i * .6) * 4 * i / 12, 7.6, 56); }

    g.strokeStyle = '#d8dde4'; g.lineWidth = 3.4 * s; g.beginPath(); g.moveTo(lerp(hx, bx - 20 * s, .3), lerp(hy, by, .3)); g.lineTo(bx - 20 * s, by); g.stroke();
    g.fillStyle = P.c; g.strokeStyle = OL; g.lineWidth = 2; g.beginPath(); P.head === 'mallet' ? g.ellipse(bx - 18 * s, by, 16 * s, 8 * s, 0, 0, TAU) : g.rect(bx - 32 * s, by - 5 * s, 26 * s, 10 * s); g.fill(); g.stroke();

  }
  let shopTab = 'ball';
  function openShop() { $('menu').classList.add('hidden'); $('shop').classList.remove('hidden'); renderShop(); SND.click(); }
  $('shopBtn').onclick = openShop;
  $('shopBack').onclick = () => { $('shop').classList.add('hidden'); $('menu').classList.remove('hidden'); updateMenu(); };
  for (const b of $('tabs').children) b.onclick = () => { shopTab = b.dataset.t; renderShop(); };
  function thumb(kind, it) {
    const c = mk(128, 128), g = c.getContext('2d');
    if (kind === 'ball') { const s = SPR['ball_' + it.id]; g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(68, 104, 34, 9, 0, 0, TAU); g.fill(); if (it.trail !== 'line') { g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 6; i++) { g.globalAlpha = i / 8; g.drawImage(glow(it.tc), 4 + i * 8, 40 + i * 2, 30, 30); } g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; } if (s) g.drawImage(s, 30, 22, 76, 76); }
    else if (kind === 'putter') { g.lineCap = 'round'; g.strokeStyle = it.grip; g.lineWidth = 9; g.beginPath(); g.moveTo(98, 10); g.lineTo(80, 40); g.stroke(); g.strokeStyle = '#d0d6de'; g.lineWidth = 4; g.beginPath(); g.moveTo(80, 40); g.lineTo(50, 98); g.stroke(); g.fillStyle = it.c; g.strokeStyle = OL; g.lineWidth = 3; g.beginPath(); if (it.head === 'mallet') g.ellipse(46, 104, 30, 13, 0, 0, TAU); else if (it.head === 'wood') { rrectG(g, 16, 92, 58, 22, 8); } else g.rect(18, 96, 58, 14); g.fill(); g.stroke(); if (it.head === 'laser') { g.globalCompositeOperation = 'lighter'; g.drawImage(glow(it.c), 0, 70, 96, 64); g.globalCompositeOperation = 'source-over'; } }
    else if (kind === 'flag') { const s = SPR['flag_' + it.id]; g.strokeStyle = '#eee'; g.lineWidth = 5; g.beginPath(); g.moveTo(28, 120); g.lineTo(28, 10); g.stroke(); if (s) for (let i = 0; i < 12; i++) g.drawImage(s, i * 10, 0, 10, 80, 30 + i * 7.5, 12 + Math.sin(i * .7) * 5 * i / 12, 8, 54); }
    else { const s = golferSprite('addr', it.id); g.drawImage(s, 36, 70, 180, 180, 4, 2, 124, 124); }

  }
  function rrectG(g, x, y, w, h, r) { g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  const TH = {};

    for (const b of $('tabs').children) b.classList.toggle('on', b.dataset.t === shopTab);
    const box = $('items'); box.innerHTML = '';

      el.className = 'item' + (eq ? ' eq' : '') + (!own ? ' locked' : '') + (!own && it.price > SAVE.coins ? ' poor' : '');

      if (shopTab === 'putter') stat = `<div class="bars"><i><b style="width:${(it.pw - .9) / .32 * 100}%"></b></i><i><b style="width:${it.guide / 360 * 100}%"></b></i></div>`;
      el.innerHTML = `<img src="${TH[key]}" style="width:64px;height:64px" alt=""><div class="nm">${it.nm}</div>${stat}<div class="pr${own ? ' own' : ''}">${eq ? 'EQUIPPED' : own ? 'EQUIP' : '<i class="coin"></i>' + fmt(it.price)}</div>`;

        if (own) { SAVE.eq[shopTab] = it.id; SND.click(); }
        else if (SAVE.coins >= it.price) { SAVE.coins -= it.price; SAVE.owned[shopTab].push(it.id); SAVE.eq[shopTab] = it.id; audioOn = true; audio.sfx(880, .1, 'square', .04); later(90, () => audio.sfx(1320, .2, 'square', .04)); const r = el.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height / 2, { n: 24, colors: ['#ffe14a', '#ffffff'], shape: 'star', speed: 260, size: 5, gravity: 200, life: .8 }); }
        else { el.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 220 }); $('sdesc').textContent = 'Need ' + fmt(it.price - SAVE.coins) + ' more coins'; return; }
        saveNow(); renderShop();
      };
      box.appendChild(el);
    }
    const cur = gear(shopTab);
    $('sdesc').textContent = shopTab === 'putter' ? `${cur.nm}: power x${cur.pw.toFixed(2)} · aim guide ${cur.guide}` : shopTab === 'ball' ? `${cur.nm}: ${cur.ds}` : shopTab === 'flag' ? `${cur.nm} flag flies over every cup` : `${cur.nm} for your golfer`;
    drawLocker($('shopPrev'), 760, 300, 0);
  }
  // ---------- pause ----------
  function pause() { if (!G || G.attract || G.over || paused || inMenu()) return; paused = true; if (rollH) rollH.set(55, 0); G.drag = null; G.aim = null; $('pause').classList.remove('hidden'); syncButtons(); }
  function resume() { paused = false; $('pause').classList.add('hidden'); last = performance.now(); syncButtons(); }
  $('pause').addEventListener('pointerdown', e => { if (e.target.id !== 'quitBtn') resume(); });
  addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // ---------- test hook & loop ----------
  let last = performance.now(), fpsVal = 60, fpsAcc = 0, fpsN = 0; const PROF = { u: 0, r: 0 };
  window.__gq = {
    G: () => G, HO: () => HO, ball: () => ball, cam: () => cam, start, toMenu, fps: () => fpsVal, save: () => JSON.parse(JSON.stringify(SAVE)),
    autopilot: v => { G.autopilot = v; G.bot = null; }, setHole: n => { G.hole = n - 1; G.trans = null; nextHole(); }, hearts: n => { G.hearts = n; },
    coins: n => { SAVE.coins += n; saveNow(); updateMenu(); if (!$('shop').classList.contains('hidden')) renderShop(); },
    skipIntro: () => { if (G.phase === 'intro') G.phaseT = 2.2; }, shot: (a, p, c) => takeShot(a, p, !!c), finish: h => finishHole(h !== false), advance,
    bestShot: () => { const B = botPlan(2); while (!(() => { G.bot = B; return botStep(); })()); G.bot = null; return B.best; },
    gen: (n, sd, simple) => { R = mulberry(sd); let h = null, err = null; try { h = buildHole(n, simple); } catch (e) { err = e.message + ' ' + e.stack; } R = Math.random; return h ? { ok: 1, par: h.par, tee: h.flowAt(h.tee.x, h.tee.y), tpl: h.tpl, feats: h.feats } : { ok: 0, err, last: DBG }; }, chip: toggleChip, map: toggleMap, pause, resume, phase: () => G.phase, prof: () => PROF
  };

  (function loop(now) {
