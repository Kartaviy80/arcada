<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14080c">
<title>Ninja Slice</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14080c; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  #menu { background: radial-gradient(ellipse at 50% 42%, rgba(20,6,10,.15), rgba(10,4,8,.82) 78%); }
  .tag { font-size: 12px; letter-spacing: 7px; font-weight: 800; color: #ffd6dc; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .title { position: relative; font-size: clamp(58px, 17vw, 112px); font-weight: 900; line-height: .86; letter-spacing: 2px; font-style: italic; transform: skewX(-8deg);
    background: linear-gradient(180deg, #ffffff 0%, #f4eef0 45%, #b8b0b8 70%, #6a6470 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #1a0a10) drop-shadow(0 0 18px rgba(255,255,255,.25)); }
  .title span { display: block; background: linear-gradient(180deg, #ffd0d4 0%, #ff4a5a 40%, #c8102a 72%, #5a0614 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #2a0208) drop-shadow(0 0 26px rgba(255,40,70,.65)); }
  .title::after { content: ''; position: absolute; left: -12%; right: -12%; top: 58%; height: 4px; border-radius: 4px; transform: rotate(-11deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff 30%, #ffe0e4 60%, rgba(255,60,80,0)); box-shadow: 0 0 14px #ff4a5a, 0 0 4px #fff; animation: cut 3.2s ease-in-out infinite; }
  @keyframes cut { 0%, 62% { clip-path: inset(0 100% 0 0); opacity: 1; } 72% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { clip-path: inset(0 0 0 100%); opacity: 0; } }
  .hero { display: flex; align-items: center; gap: 10px; }
  .hero canvas { width: 124px; height: 124px; }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,220,225,.7); background: rgba(255,255,255,.08); color: #fff; font-size: 18px; font-weight: 900; cursor: pointer; }
  .skin { font-size: 15px; font-weight: 900; letter-spacing: 3px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.7); min-height: 20px; } .skin.lock { color: #b8aab0; }
  .stat { font-size: 14px; color: #f4e8ea; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,.8); } .stat b { color: #ff6a7a; }
  .btn { border: 0; padding: 15px 64px; border-radius: 10px; font: inherit; font-size: 25px; font-weight: 900; letter-spacing: 6px; color: #fff; cursor: pointer; font-style: italic;
    background: linear-gradient(180deg, #ff5a6a, #c8102a 60%, #8a0618); box-shadow: 0 0 0 3px #fff inset, 0 7px 0 #3a020a, 0 14px 30px rgba(0,0,0,.5), 0 0 30px rgba(255,40,70,.35);
    transform: skewX(-8deg); animation: bob 1.4s ease-in-out infinite; }
  .btn.alt { background: linear-gradient(180deg, #4a4450, #26222c); font-size: 17px; padding: 11px 34px; animation: none; box-shadow: 0 0 0 2px rgba(255,255,255,.7) inset, 0 5px 0 #0a080c; }
  @keyframes bob { 50% { transform: skewX(-8deg) translateY(-4px) scale(1.03); } }
  .hint { font-size: 12px; color: #e8dce0; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,.8); line-height: 1.6; }
  .hint b { color: #ffb0b8; }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(60,6,14,.78), rgba(8,4,8,.96)); }
  #over h2 { font-size: clamp(46px, 13vw, 84px); font-weight: 900; font-style: italic; color: #ff3a4a; transform: skewX(-8deg); letter-spacing: 3px; text-shadow: 0 4px 0 #2a0208, 0 0 28px rgba(255,40,60,.7); }
  #overScore { font-size: 54px; font-weight: 900; text-shadow: 0 0 20px rgba(255,90,110,.7); }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #2a0408; background: linear-gradient(90deg, #ffe0a0, #ffb84a); padding: 5px 16px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 0 22px rgba(255,200,90,.8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 26px; font-size: 14px; color: #e0d0d4; text-align: left; } .grid b { color: #fff; float: right; margin-left: 12px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #pause { background: rgba(10,4,8,.72); font-size: 32px; font-weight: 900; letter-spacing: 8px; font-style: italic; }
  #pauseBtn { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top) + 10px); right: max(10px, env(safe-area-inset-right)); width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55);
    background: rgba(10,4,8,.45); color: #fff; font-weight: 900; font-size: 14px; letter-spacing: 1px; cursor: pointer; }
  #pauseBtn.hidden { display: none; }
  #up { background: radial-gradient(ellipse at 50% 45%, rgba(30,6,12,.72), rgba(6,2,6,.94)); gap: 10px; }
  .upTitle { font-size: clamp(26px, 7vw, 40px); font-weight: 900; font-style: italic; letter-spacing: 4px; transform: skewX(-8deg); color: #fff; text-shadow: 0 3px 0 #3a020a, 0 0 22px rgba(255,60,80,.6); }
  .upSub { font-size: 12px; letter-spacing: 4px; color: #ffb0b8; font-weight: 800; }
  .cards { display: flex; gap: 14px; flex-direction: row; align-items: stretch; justify-content: center; max-width: 100%; }
  .card { position: relative; width: 196px; padding: 16px 14px 14px; border-radius: 14px; border: 2px solid var(--rc); cursor: pointer; color: #fff; font: inherit; text-align: center;
    background: linear-gradient(180deg, rgba(40,26,34,.96), rgba(16,10,16,.98)); box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 10px 26px rgba(0,0,0,.55), 0 0 24px var(--rg) inset;
    display: flex; flex-direction: column; align-items: center; gap: 7px; transform: translateY(30px) scale(.9); opacity: 0; animation: cardIn .38s cubic-bezier(.2,1.4,.4,1) forwards; }
  .card:nth-child(2) { animation-delay: .08s; } .card:nth-child(3) { animation-delay: .16s; }
  .card:hover, .card:focus { transform: translateY(-4px) scale(1.03); outline: none; box-shadow: 0 0 0 2px #fff, 0 14px 30px rgba(0,0,0,.6), 0 0 34px var(--rg) inset; }
  @keyframes cardIn { to { transform: none; opacity: 1; } }
  .card .ic { width: 72px; height: 72px; flex: none; filter: drop-shadow(0 0 10px var(--rg)); }
  .card .nm { font-size: 17px; font-weight: 900; letter-spacing: 1px; }
  .card .ds { font-size: 13px; color: #e8d8dc; line-height: 1.35; }
  .card .rr { font-size: 10px; font-weight: 900; letter-spacing: 3px; color: var(--rc); }
  .card .lv { display: flex; gap: 4px; } .card .lv i { width: 12px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); } .card .lv i.on { background: var(--rc); box-shadow: 0 0 6px var(--rc); } .card .lv i.nw { background: #fff; animation: blink .6s infinite alternate; }
  .card .tx { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  @keyframes blink { to { opacity: .35; } }
  @media (max-width: 640px) and (min-height: 521px) {
    .cards { flex-direction: column; gap: 10px; width: 100%; max-width: 380px; }
    .card { width: 100%; flex-direction: row; text-align: left; padding: 12px 14px; gap: 12px; }
    .card .ic { width: 58px; height: 58px; } .card .tx { align-items: flex-start; gap: 4px; }
  }
  @media (max-height: 520px) {
    .overlay { gap: 6px; padding: 8px 16px; }
    .title { font-size: 48px; } .tag { font-size: 10px; letter-spacing: 4px; }
    .hero canvas { height: 66px; width: 66px; } .arrow { width: 34px; height: 34px; font-size: 14px; }
    .btn { padding: 9px 44px; font-size: 19px; } .btn.alt { padding: 7px 24px; font-size: 14px; } .hint { display: none; } .stat, .skin { font-size: 12px; }
    #over h2 { font-size: 36px; } #overScore { font-size: 32px; } .grid { font-size: 12px; gap: 2px 18px; } #newBest { font-size: 12px; padding: 3px 10px; }
    .upTitle { font-size: 24px; } .upSub { display: none; }
    .card { width: 180px; padding: 10px; gap: 4px; } .card .ic { width: 46px; height: 46px; } .card .nm { font-size: 14px; } .card .ds { font-size: 11px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button id="pauseBtn" class="hidden" aria-label="Pause">II</button>
<div class="overlay" id="menu">
  <div class="tag">BLADE · SHADOW · STEEL</div>
  <div class="title">NINJA<span>SLICE</span></div>
  <div class="hero"><button class="arrow" id="prevSkin" aria-label="Previous skin">◀</button><canvas id="skinPrev" width="248" height="248"></canvas><button class="arrow" id="nextSkin" aria-label="Next skin">▶</button></div>
  <div class="skin" id="skinName"></div>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">PLAY</button>
  <div class="hint">Drag to move · <b>SLASH</b> Space/J · <b>DASH</b> Shift/K · <b>SHURIKEN</b> E/L · <b>THOUSAND CUTS</b> Q/U</div>
</div>
<div class="overlay hidden" id="over">
  <h2 id="overTitle">DEFEATED</h2>
  <div id="overScore">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <div class="row"><button class="btn" id="againBtn">RETRY</button><button class="btn alt" id="menuBtn">MENU</button></div>
  <div class="hint" id="unlockMsg"></div>
</div>
<div class="overlay hidden" id="up">
  <div class="upSub" id="upSub">STAGE CLEARED</div>
  <div class="upTitle">CHOOSE A TECHNIQUE</div>
  <div class="cards" id="cards"></div>
</div>
<div class="overlay hidden" id="pause">PAUSED<div class="hint">tap to continue</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
