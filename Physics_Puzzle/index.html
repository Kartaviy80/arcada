<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6e7c8">
<title>Snip Snack</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f6e7c8;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; color: #5a3a1a;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; }
  .hud b { font-size: 24px; font-weight: 900; letter-spacing: 3px; color: #8a4fd8; text-shadow: 0 2px 0 #fff; }
  .hud div { font-size: 13px; font-weight: 700; color: #a07a4a; margin-top: 2px; letter-spacing: 1px; }
  .tools { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 10px; right: 64px; display: flex; justify-content: center; }
  .tools button { padding: 11px 20px; border-radius: 18px; border: 3px solid #fff; background: #a46ef0; color: #fff; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 #6a3ab0, 0 8px 14px #0002; }
  .tools button:active { transform: translateY(3px); box-shadow: 0 1px 0 #6a3ab0; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse at 50% 40%, #fffaf0f2, #f3dcaef2); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 220px; height: 220px; }
  h1 { font-size: clamp(40px, 12vw, 64px); font-weight: 900; letter-spacing: 3px; color: #a46ef0; line-height: 1; text-shadow: 0 3px 0 #fff, 0 6px 0 #6a3ab0, 0 10px 16px #0003; }
  p { max-width: 310px; font-size: 15px; line-height: 1.6; color: #7a5a32; }
  .stat { font-size: 16px; color: #7a5a32; font-weight: 700; } .stat b { color: #e2702a; }
  .stars { font-size: 44px; letter-spacing: 6px; color: #ffc21a; text-shadow: 0 3px 0 #c77a12; } .stars i { color: #e8d6ae; text-shadow: none; font-style: normal; }
  .btn { border: 4px solid #fff; background: linear-gradient(#c49aff, #9a5ef0); color: #fff; font: inherit; font-size: 19px; font-weight: 900; letter-spacing: 4px; padding: 13px 46px; border-radius: 40px; cursor: pointer; box-shadow: 0 5px 0 #6a3ab0, 0 10px 20px #6a3ab055; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #6a3ab0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b id="level">LEVEL 1</b><div id="sub">Swipe to cut the rope</div></div>
<div class="tools"><button id="reset">⟳ Restart</button></div>

<div class="overlay" id="menu">
  <canvas id="logo" width="440" height="440"></canvas>
  <h1>SNIP<br>SNACK</h1>
  <p><b>Nibbles is hungry!</b> Swipe across the ropes to cut them and swing the candy into his mouth. Grab the stars on the way, tap bubbles to pop them and keep away from spikes.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">PLAY</button>
</div>
<div class="overlay hidden" id="win">
  <canvas id="winArt" width="440" height="440"></canvas>
  <h1>YUMMY!</h1>
  <div class="stars" id="stars">★★★</div>
  <div class="stat">Level <b id="winLevel">1</b> complete</div>
  <button class="btn" id="nextBtn">NEXT</button>
</div>
<div class="overlay hidden" id="fail">
  <canvas id="failArt" width="440" height="440"></canvas>
  <h1>OH NO!</h1>
  <p id="failWhy">The candy got away.</p>
  <button class="btn" id="retryBtn">TRY AGAIN</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*INK-START*/
// ---------- ink: freehand strokes that become solid walls ----------
// A stroke is a list of points; consecutive points form segments that circles bounce off.
const Ink = {
  // append a point only once the finger has moved far enough (keeps strokes light)
  add(stroke, x, y, minD = 6) {
    const p = stroke[stroke.length - 1];
    if (!p || Math.hypot(x - p.x, y - p.y) >= minD) { stroke.push({ x, y }); return true; }
    return false;
  },
  length(stroke) { let L = 0; for (let i = 1; i < stroke.length; i++) L += Math.hypot(stroke[i].x - stroke[i - 1].x, stroke[i].y - stroke[i - 1].y); return L; },
  segments(strokes) {
    const out = [];
    for (const s of strokes) for (let i = 1; i < s.length; i++) out.push({ ax: s[i - 1].x, ay: s[i - 1].y, bx: s[i].x, by: s[i].y });
    return out;
  },
  closest(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    const k = L ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L)) : 0;
    const x = ax + dx * k, y = ay + dy * k;
    return { x, y, d: Math.hypot(px - x, py - y) };
  },
  // push a circle out of every segment it overlaps; reflect its velocity with some bounce and friction
  collide(b, segs, r, bounce = 0.3, friction = 0.995, thick = 3) {
    let hit = false;
    for (const s of segs) {
      const c = Ink.closest(b.x, b.y, s.ax, s.ay, s.bx, s.by), min = r + thick;
      if (c.d < min) {
        let nx = b.x - c.x, ny = b.y - c.y, d = c.d;
        if (d < 1e-6) { nx = -(s.by - s.ay); ny = s.bx - s.ax; d = Math.hypot(nx, ny) || 1; }
        nx /= d; ny /= d;
        b.x = c.x + nx * min; b.y = c.y + ny * min;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= (1 + bounce) * vn * nx; b.vy -= (1 + bounce) * vn * ny; }
        b.vx *= friction; b.vy *= friction;
        hit = true;
      }
    }
    return hit;
  },
  // does segment p1-p2 cross segment p3-p4?
  cross(p1, p2, p3, p4) {
    const d = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
    const d1 = d(p3, p4, p1), d2 = d(p3, p4, p2), d3 = d(p1, p2, p3), d4 = d(p1, p2, p4);
    return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
  },
  // a smooth, tapered pen line
  draw(ctx, stroke, color, width, glow) {
    if (stroke.length < 2) return;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 12; }
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(stroke[0].x, stroke[0].y);
    for (let i = 1; i < stroke.length - 1; i++) { const mx = (stroke[i].x + stroke[i + 1].x) / 2, my = (stroke[i].y + stroke[i + 1].y) / 2; ctx.quadraticCurveTo(stroke[i].x, stroke[i].y, mx, my); }
    const l = stroke[stroke.length - 1]; ctx.lineTo(l.x, l.y); ctx.stroke();
    ctx.restore();
  }
};
/*INK-END*/
(() => {
  const audio = GameAudio({
    bpm: 108, scale: 'major', root: 62, prog: [0, 5, 3, 4], seed: 701,
    waves: { lead: 'square', bass: 'triangle', arp: 'triangle', pad: 'sine' },
    pad: true, arp: true, arpEvery: 2, arpOct: 1, arpCutoff: 2000, leadOct: 1, leadCutoff: 1800, leadDensity: 0.34, drums: 'soft', bassPattern: [0, 8], swing: 0.1, volume: 0.16,
    btnBg: 'rgba(255,255,255,.75)', btnColor: '#9a5ef0'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'snip_snack_level';
  let level = 1; try { level = +localStorage.getItem(KEY) || 1; } catch (e) {}
  $('bestMenu').innerHTML = level > 1 ? 'Continue from level <b>' + level + '</b>' : '';

  // ---------- levels: world is 100 x 160 ----------
  // ropes: fixed pins tied to the candy; auto: pins that grab the candy when it comes within r;
  // bubbles lift the candy; spikes are deadly segments; m = monster mouth
  const LEVELS = [
    { name: 'First Bite', candy: [50, 62], ropes: [[50, 22]], m: [50, 132], stars: [[50, 82], [50, 100], [50, 116]] },
    { name: 'Swing It', candy: [62, 40], ropes: [[24, 24]], m: [74, 134], stars: [[24, 66], [52, 58], [70, 110]] },
    { name: 'Two Strings', candy: [50, 50], ropes: [[14, 24], [86, 24]], m: [26, 134], stars: [[50, 66], [62, 70], [28, 112]] },
    { name: 'Bubble Up', candy: [56, 92], ropes: [[24, 84]], bubbles: [[24, 116]], m: [24, 34], stars: [[42, 112], [24, 90], [24, 60]] },
    { name: 'Sharp Floor', candy: [86, 34], ropes: [[50, 24]], spikes: [[8, 128, 92, 128]], m: [16, 104], stars: [[50, 70], [30, 66], [18, 86]] },
    { name: 'Catch Me', candy: [50, 50], ropes: [[50, 20]], auto: [[32, 82, 20]], m: [80, 134], stars: [[50, 72], [36, 104], [62, 112]] },
    { name: 'Triangle', candy: [50, 56], ropes: [[12, 30], [88, 30], [50, 14]], spikes: [[6, 140, 46, 140]], m: [78, 136], stars: [[50, 76], [66, 92], [78, 114]] },
    { name: 'Pop Goes', candy: [50, 40], ropes: [[50, 18]], bubbles: [[50, 80]], spikes: [[10, 22, 90, 22]], m: [50, 140], stars: [[50, 62], [50, 100], [50, 120]] },
    { name: 'Hand Off', candy: [46, 30], ropes: [[20, 20]], auto: [[56, 64, 20]], spikes: [[30, 150, 96, 150]], m: [86, 104], stars: [[12, 47], [41, 38], [72, 76]] },
    { name: 'Relay', candy: [40, 26], ropes: [[16, 18]], auto: [[44, 70, 18], [78, 50, 18]], m: [82, 134], stars: [[19, 44], [38, 87], [71, 93]] },
    { name: 'Spike Pit', candy: [50, 44], ropes: [[28, 20], [72, 20]], bubbles: [[50, 104]], spikes: [[6, 140, 94, 140], [6, 14, 40, 14], [60, 14, 94, 14]], m: [50, 24], stars: [[56, 112], [57, 75], [57, 54]] },
    { name: 'Grand Finale', candy: [50, 36], ropes: [[30, 16], [70, 16]], auto: [[20, 86, 18]], bubbles: [[64, 120]], spikes: [[34, 140, 98, 140]], m: [86, 96], stars: [[74, 44], [87, 71], [89, 38]] }
  ];
  const CR = 4, G = 130, H_STEP = 1 / 120, ITER = 16;

  // ---------- simulation (pure, so it can also be run headless) ----------
  function addRope(w, ax, ay, len) {
    const c = w.pts[0], d = Math.hypot(c.x - ax, c.y - ay), L = len || d, n = Math.max(3, Math.round(L / 3.2));
    const ids = [w.pts.length]; w.pts.push({ x: ax, y: ay, px: ax, py: ay, inv: 0 });
    for (let i = 1; i < n; i++) { const k = i / n, x = ax + (c.x - ax) * k, y = ay + (c.y - ay) * k; ids.push(w.pts.length); w.pts.push({ x, y, px: x, py: y, inv: 4 }); }
    ids.push(0);
    const cons = [];
    for (let i = 0; i < n; i++) { cons.push(w.cons.length); w.cons.push({ a: ids[i], b: ids[i + 1], len: L / n, cut: false }); }
    w.ropes.push({ ids, cons, ax, ay });
  }

  }

  // ---------- render ----------
  function drawRopes() {
    for (const R of w.ropes) {
      // split the rope into its uncut runs
      let run = [R.ids[0]];
      const flush = () => {
        if (run.length > 1) {
          const pts = run.map(i => ({ x: sx(w.pts[i].x), y: sy(w.pts[i].y) })), wd = Math.max(2.5, S * 1.05);
          Ink.draw(ctx, pts.map(p => ({ x: p.x + 1, y: p.y + 2.5 })), 'rgba(80,40,10,.18)', wd);
          Ink.draw(ctx, pts, '#8a5a2a', wd);
          ctx.save(); ctx.setLineDash([wd * .9, wd * .9]); Ink.draw(ctx, pts, '#c8945a', wd * .55); ctx.restore();
        }
        run = [];
      };
      R.cons.forEach((k, i) => { if (w.cons[k].cut) { flush(); run = [R.ids[i + 1]]; } else run.push(R.ids[i + 1]); });
      flush();
    }
  }
  function render() {
    if (BG) ctx.drawImage(BG, 0, 0, W, H);
    if (!SPR || !w || phase === 'menu') return;
    const c = w.pts[0], cs = CR * 3.4 * S;
    // auto pins show their reach
    for (const a of w.auto) if (!a.used) {
      ctx.save(); ctx.strokeStyle = 'rgba(164,110,240,.55)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.lineDashOffset = -t * 20;
      ctx.beginPath(); ctx.arc(sx(a.x), sy(a.y), a.r * S, 0, 7); ctx.stroke(); ctx.restore();
      ctx.fillStyle = 'rgba(164,110,240,.07)'; ctx.beginPath(); ctx.arc(sx(a.x), sy(a.y), a.r * S, 0, 7); ctx.fill();
    }
    // spikes: a steel rail with teeth
    for (const s of w.spikes) {
      const ax = sx(s.ax), ay = sy(s.ay), bx = sx(s.bx), by = sy(s.by), len = Math.hypot(bx - ax, by - ay), ang = Math.atan2(by - ay, bx - ax), tw = S * 3.2;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang);
      const mg = ctx.createLinearGradient(0, -tw, 0, tw); mg.addColorStop(0, '#f4f7fa'); mg.addColorStop(.5, '#9aa4ae'); mg.addColorStop(1, '#5a646e');
      ctx.fillStyle = mg;
      for (let x = 0; x < len - 1; x += tw) { ctx.beginPath(); ctx.moveTo(x, tw * .35); ctx.lineTo(x + tw / 2, -tw * .9); ctx.lineTo(x + tw, tw * .35); ctx.fill(); ctx.beginPath(); ctx.moveTo(x, -tw * .35); ctx.lineTo(x + tw / 2, tw * .9); ctx.lineTo(x + tw, -tw * .35); ctx.fill(); }
      ctx.fillStyle = '#4a545e'; ctx.beginPath(); ctx.roundRect(-2, -tw * .32, len + 4, tw * .64, 3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(0, -tw * .3, len, tw * .14);
      ctx.restore();
    }
    // monster in his box
    const mx = sx(w.m[0]), my = sy(w.m[1]), ms = 26 * S, near = Math.hypot(c.x - w.m[0], c.y - w.m[1]) < 30 && phase === 'play';
    const mood = phase === 'won' ? (Math.floor(t * 8) % 2 ? 'mChew' : 'mIdle') : phase === 'lost' ? 'mSad' : near ? 'mOpen' : 'mIdle';
    if (!(phase === 'won' && chew <= 0 && endT > 1.2)) {}
    const bob = Math.sin(t * 2.4) * S * .4 + (phase === 'won' ? -Math.abs(Math.sin(t * 9)) * S : 0);
    ctx.drawImage(SPR[phase === 'won' && endT > .9 ? 'mChew' : mood], mx - ms / 2, my - ms * .62 + bob, ms, ms);
    ctx.save(); ctx.shadowColor = 'rgba(80,40,10,.3)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
    ctx.drawImage(SPR.box, mx - ms * .56, my + ms * .2, ms * 1.12, ms * .67); ctx.restore();
    // stars
    for (const s of w.stars) if (!s.got) {
      const z = S * 9 * (1 + Math.sin(t * 3 + s.x) * .06);
      const gl = ctx.createRadialGradient(sx(s.x), sy(s.y), 0, sx(s.x), sy(s.y), z); gl.addColorStop(0, 'rgba(255,220,80,.45)'); gl.addColorStop(1, 'rgba(255,220,80,0)'); ctx.fillStyle = gl; ctx.fillRect(sx(s.x) - z, sy(s.y) - z, z * 2, z * 2);
      ctx.save(); ctx.translate(sx(s.x), sy(s.y)); ctx.rotate(Math.sin(t * 1.5 + s.y) * .15); ctx.drawImage(SPR.star, -z / 2, -z / 2, z, z); ctx.restore();
    }
    drawRopes();
    for (const R of w.ropes) { const z = S * 4.4; ctx.drawImage(SPR.pin, sx(R.ax) - z / 2, sy(R.ay) - z / 2, z, z); }
    for (const a of w.auto) if (!a.used) { const z = S * 4.4; ctx.drawImage(SPR.pin, sx(a.x) - z / 2, sy(a.y) - z / 2, z, z); }
    // candy (hidden once eaten or smashed)
    if (phase === 'play' || (phase === 'lost' && w.why.indexOf('spikes') < 0)) {
      ctx.save(); ctx.translate(sx(c.x), sy(c.y)); ctx.rotate(w.ang); ctx.drawImage(SPR.candy, -cs / 2, -cs / 2, cs, cs); ctx.restore();
    }
    // bubbles
    for (const b of w.bubbles) if (!b.popped && (phase === 'play' || !b.held)) {
      const r = S * 7 * (1 + Math.sin(t * 4 + b.x) * .04), X = sx(b.x), Y = sy(b.y);
      const bg = ctx.createRadialGradient(X - r * .3, Y - r * .3, r * .1, X, Y, r); bg.addColorStop(0, 'rgba(255,255,255,.25)'); bg.addColorStop(.75, 'rgba(160,220,255,.18)'); bg.addColorStop(1, 'rgba(120,190,255,.55)');
      ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(X, Y, r, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X, Y, r * .78, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
      ctx.strokeStyle = 'rgba(200,120,255,.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(X, Y, r, 0, 7); ctx.stroke();
    }
    // particles, flying stars and the blade trail
    for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life * 1.5); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), p.r * S, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    for (const f of flyStars) { const k = f.t * f.t, x = sx(f.x) + (W / 2 + 40 - sx(f.x)) * k, y = sy(f.y) + (40 - sy(f.y)) * k, z = S * 8 * (1 - f.t * .6); ctx.globalAlpha = 1 - f.t * .5; ctx.drawImage(SPR.star, x - z / 2, y - z / 2, z, z); }
    ctx.globalAlpha = 1;
    if (trail.length > 1) {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let i = 1; i < trail.length; i++) { const a = trail[i - 1], b = trail[i]; ctx.strokeStyle = 'rgba(255,255,255,' + b.life * 3.6 + ')'; ctx.lineWidth = 2 + b.life * 22; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
  }
  function art(cv, key, withCandy) {
    const g = cv.getContext('2d'); g.clearRect(0, 0, 440, 440);
    const glow = g.createRadialGradient(220, 250, 30, 220, 250, 210); glow.addColorStop(0, 'rgba(200,150,255,.45)'); glow.addColorStop(1, 'rgba(200,150,255,0)'); g.fillStyle = glow; g.fillRect(0, 0, 440, 440);
    g.drawImage(SPR[key], 100, 120, 240, 240); g.drawImage(SPR.box, 76, 268, 288, 172);
    if (withCandy) {
      g.strokeStyle = '#8a5a2a'; g.lineWidth = 7; g.lineCap = 'round'; g.beginPath(); g.moveTo(220, 0); g.quadraticCurveTo(212, 60, 222, 112); g.stroke();
      g.setLineDash([6, 6]); g.strokeStyle = '#c8945a'; g.lineWidth = 3.5; g.beginPath(); g.moveTo(220, 0); g.quadraticCurveTo(212, 60, 222, 112); g.stroke(); g.setLineDash([]);
      g.save(); g.translate(222, 130); g.rotate(-.3); g.drawImage(SPR.candy, -48, -48, 96, 96); g.restore();
    }
    for (const [x, y, s] of [[70, 110, 60], [370, 90, 50], [380, 230, 40]]) g.drawImage(SPR.star, x - s / 2, y - s / 2, s, s);
  }

  resize();
  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
