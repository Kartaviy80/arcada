<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d2340">
<title>Word Hunt</title>
<style>
  :root { --ui: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif; --ink: #1d2340; --gold: #ffd25a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1d2340; color: #fff; font-family: var(--ui);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: var(--ui); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .35s, visibility 0s .35s; }
  /* ---- top hud ---- */
  #hud { position: fixed; z-index: 8; left: 0; right: 0; top: 0; height: 0; }
  .round { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); cursor: pointer;
    background: linear-gradient(180deg, rgba(40,48,96,.75), rgba(16,20,48,.8)); box-shadow: 0 3px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; }
  .round svg { width: 20px; height: 20px; }
  #pauseBtn { left: 12px; top: max(10px, env(safe-area-inset-top)); }
  .pill { position: fixed; z-index: 14; right: 12px; top: max(12px, env(safe-area-inset-top)); height: 38px; padding: 0 14px 0 6px; border-radius: 20px; display: flex; align-items: center; gap: 7px;
    background: linear-gradient(180deg, rgba(40,48,96,.8), rgba(16,20,48,.85)); border: 2px solid rgba(255,220,120,.85); font-weight: 900; font-size: 18px; color: #ffe9a8; box-shadow: 0 3px 0 rgba(0,0,0,.35); text-shadow: 0 1px 2px #000; }
  .coin { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fffbe0 0 12%, #ffd84a 30%, #e8a018 70%, #a86a08 100%); box-shadow: inset 0 0 0 2px rgba(150,90,0,.55), 0 1px 2px rgba(0,0,0,.5); position: relative; flex: none; }
  .coin::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; border: 2px solid rgba(160,100,10,.55); }
  .pill.bump { animation: bump .35s; } @keyframes bump { 40% { transform: scale(1.18); } }
  /* ---- hint bar ---- */
  #hintBar { position: fixed; z-index: 8; display: flex; gap: 10px; }
  .hbtn { position: relative; width: 76px; height: 60px; border-radius: 18px; border: 2px solid #fff; cursor: pointer; color: var(--ink);
    background: linear-gradient(180deg, #ffffff, #e6ebfa 60%, #cfd8f2); box-shadow: 0 5px 0 #6b76a8, 0 8px 16px rgba(0,0,0,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 900; }
  .hbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #6b76a8; }
  .hbtn svg { width: 26px; height: 26px; }
  .hbtn .pr { font-size: 12px; display: flex; align-items: center; gap: 3px; letter-spacing: .5px; }
  .hbtn .pr i { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8c0, #ffc828 50%, #b87808); display: inline-block; }
  .hbtn .bdg { position: absolute; top: -8px; right: -8px; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 5px; background: linear-gradient(#ff7a6a, #e8303a); color: #fff; font-size: 12px; line-height: 19px; border: 2px solid #fff; display: none; }
  .hbtn.free { background: linear-gradient(180deg, #fffbe0, #ffe58a 60%, #ffc84a); box-shadow: 0 5px 0 #a8701a, 0 0 22px rgba(255,220,90,.75); animation: glowp 1.2s ease-in-out infinite; }
  @keyframes glowp { 50% { box-shadow: 0 5px 0 #a8701a, 0 0 34px rgba(255,230,120,1); } }
  .hbtn.off { filter: grayscale(.7); opacity: .6; }
  /* ---- menu ---- */
  #menu { justify-content: space-between; padding: max(62px, calc(env(safe-area-inset-top) + 54px)) 16px max(70px, calc(env(safe-area-inset-bottom) + 64px));
    background: linear-gradient(180deg, rgba(12,16,44,.62) 0%, rgba(12,16,44,.1) 26%, rgba(12,16,44,0) 50%, rgba(12,16,44,.55) 72%, rgba(12,16,44,.88) 100%); }
  .mTop, .mBot { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 420px; }
  .tag { font-size: 12px; font-weight: 900; letter-spacing: 4px; color: #ffe9b8; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
  .title { font-weight: 900; font-size: clamp(58px, 18vw, 112px); line-height: .86; letter-spacing: 2px;
    background: linear-gradient(180deg, #fffdf0 0%, #ffe28a 38%, #ffb03a 64%, #f0702a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #6a2a12) drop-shadow(0 0 24px rgba(255,190,90,.55)); }
  .title b { display: block; font-weight: 900; background: linear-gradient(180deg, #ffffff 0%, #bff0ff 40%, #5ac0f0 70%, #2a6ad0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 #14285a); }
  .sub { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; color: #fff3d8; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .destCard { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 360px; padding: 8px 14px 8px 8px; border-radius: 20px; text-align: left;
    background: linear-gradient(180deg, rgba(255,250,238,.96), rgba(244,232,210,.96)); color: var(--ink); box-shadow: 0 6px 18px rgba(0,0,0,.4); border: 2px solid #fff; }
  .destCard canvas { width: 64px; height: 64px; flex: none; }
  .dcName { font-weight: 900; font-size: 18px; letter-spacing: 1px; }
  .dcSub { font-size: 13px; font-weight: 700; color: #5a6088; margin: 2px 0 5px; }
  .dcBar { height: 9px; border-radius: 5px; background: rgba(29,35,64,.15); overflow: hidden; } .dcBar i { display: block; height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, #ffb03a, #f0602a); }
  .btn { border: 3px solid #fff6d8; padding: 13px 34px; border-radius: 40px; font-size: 22px; font-weight: 900; letter-spacing: 3px; color: #4a1c04; cursor: pointer; min-width: 240px;
    background: linear-gradient(180deg, #fff4b0, #ffc43a 50%, #f08a1a); box-shadow: 0 6px 0 #9a4a0a, 0 0 26px rgba(255,190,70,.45); animation: pulse 1.8s ease-in-out infinite; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9a4a0a; }
  .btn small { display: block; font-size: 12px; letter-spacing: 2px; margin-top: 1px; opacity: .8; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #9a4a0a, 0 0 42px rgba(255,210,90,.85); } }
  .row { display: flex; gap: 10px; }
  .btn2 { border: 2px solid rgba(255,255,255,.85); padding: 9px 18px; border-radius: 26px; font-size: 15px; font-weight: 900; letter-spacing: 2px; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, rgba(70,90,170,.85), rgba(30,40,100,.9)); box-shadow: 0 4px 0 rgba(8,10,30,.6); display: inline-flex; align-items: center; gap: 7px; }
  .btn2:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(8,10,30,.6); }
  .btn2 svg { width: 18px; height: 18px; }
  .stat { font-size: 13px; font-weight: 700; color: #e8ecff; text-shadow: 0 1px 3px #000; } .stat b { color: var(--gold); }
  /* ---- cards & sheets ---- */
  .card, .sheet { position: relative; width: min(92vw, 400px); border-radius: 26px; padding: 22px 20px 18px; color: var(--ink);
    background: linear-gradient(180deg, #fffdf6, #f5ead4); border: 3px solid #fff; box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 -4px 0 rgba(160,120,60,.18); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .card::before, .sheet::before { content: ''; position: absolute; top: -12px; left: 50%; width: 120px; height: 26px; transform: translateX(-50%) rotate(-2deg); background: var(--tape, rgba(255,140,120,.8)); opacity: .9; box-shadow: 0 2px 4px rgba(0,0,0,.15);
    clip-path: polygon(0 8%, 4% 0, 8% 10%, 12% 0, 100% 0, 96% 12%, 100% 22%, 96% 100%, 0 100%, 4% 88%, 0 78%); }
  .dLvl { font-size: 13px; font-weight: 900; letter-spacing: 4px; color: #8a6a4a; }
  .dTitle { font-size: 38px; font-weight: 900; letter-spacing: 1px; line-height: 1; background: linear-gradient(180deg, #ffb03a, #e0501a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(120,40,10,.25)); }
  .dTitle.sm { font-size: 22px; color: var(--ink); background: none; -webkit-text-fill-color: var(--ink); filter: none; }
  .stars { display: flex; gap: 6px; align-items: flex-end; height: 64px; }
  .stars i { width: 54px; height: 54px; background: #d8ccb6; clip-path: polygon(50% 0, 61.8% 35%, 98% 35%, 68.5% 57%, 79.4% 91%, 50% 70%, 20.6% 91%, 31.5% 57%, 2% 35%, 38.2% 35%); transform: scale(.4); opacity: .4; transition: transform .45s cubic-bezier(.3,1.8,.5,1), opacity .3s, background .3s; }
  .stars i:nth-child(2) { width: 64px; height: 64px; }
  .stars i.on { background: linear-gradient(180deg, #fff4a0, #ffc81a 55%, #e88a08); transform: scale(1); opacity: 1; filter: drop-shadow(0 3px 0 #a85a08); }
  .newBest { white-space: nowrap; font-size: 14px; font-weight: 900; letter-spacing: 3px; color: #4a1004; background: linear-gradient(90deg, #ffe84a, #ffaa2a); padding: 4px 14px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 0 18px rgba(255,200,60,.8); }
  .dGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; font-size: 14px; font-weight: 700; color: #5a5070; width: 100%; max-width: 300px; text-align: left; }
  .dGrid b { float: right; color: var(--ink); }
  .dRew { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .dRew span { font-size: 12px; font-weight: 900; padding: 4px 10px; border-radius: 12px; background: rgba(29,35,64,.08); color: #4a4060; }
  .dRew span.tot { background: linear-gradient(180deg, #fff2a8, #ffc84a); color: #5a2a04; font-size: 15px; }
  .dRew span.miss { opacity: .45; text-decoration: line-through; }
  .dStamp { display: flex; align-items: center; gap: 10px; font-weight: 900; letter-spacing: 1px; color: #a0302a; }
  .dStamp canvas { width: 92px; height: 92px; animation: stampIn .55s cubic-bezier(.2,1.6,.4,1) both .5s; }
  @keyframes stampIn { 0% { transform: scale(2.6) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
  .link { background: none; border: none; color: #6a6090; font-weight: 900; letter-spacing: 3px; font-size: 14px; cursor: pointer; padding: 6px 14px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .opt { padding: 14px 8px; border-radius: 16px; border: 2px solid #fff; font-size: 17px; font-weight: 900; letter-spacing: 1px; cursor: pointer; color: var(--ink); background: linear-gradient(180deg, #ffffff, #e2e8f8); box-shadow: 0 4px 0 #8a94c0; }
  .opt.ok { background: linear-gradient(180deg, #c8ffb8, #5ad86a); box-shadow: 0 4px 0 #2a8a3a; } .opt.bad { background: linear-gradient(180deg, #ffd0c8, #ff7a6a); box-shadow: 0 4px 0 #a8302a; }
  .gwords { font-size: 13px; font-weight: 800; color: #5a6088; letter-spacing: 1px; line-height: 1.5; }
  .sheet { width: min(94vw, 560px); max-height: calc(100% - 36px); padding: 18px 16px 16px; }
  .shHead { display: flex; width: 100%; align-items: center; justify-content: space-between; font-size: 26px; font-weight: 900; letter-spacing: 3px; }
  .x { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(29,35,64,.1); color: var(--ink); font-size: 18px; font-weight: 900; cursor: pointer; }
  .tabs { display: flex; gap: 8px; width: 100%; }
  .tabs button { flex: 1; padding: 9px; border-radius: 14px; border: 2px solid rgba(29,35,64,.15); background: rgba(255,255,255,.6); font-weight: 900; letter-spacing: 2px; font-size: 13px; color: #6a6088; cursor: pointer; }
  .tabs button.on { background: var(--ink); color: #ffe9a8; border-color: var(--ink); }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; width: 100%; overflow-y: auto; padding: 4px 2px 6px; touch-action: pan-y; }
  .item { border-radius: 18px; padding: 8px 8px 10px; background: rgba(255,255,255,.75); border: 2px solid rgba(29,35,64,.1); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .item.eq { border-color: #f0902a; box-shadow: 0 0 0 3px rgba(255,170,60,.35); }
  .item canvas { width: 100%; max-width: 160px; aspect-ratio: 2 / 1; border-radius: 12px; }
  .item .nm { font-weight: 900; font-size: 14px; letter-spacing: 1px; }
  .item button { width: 100%; padding: 7px; border-radius: 12px; border: none; font-weight: 900; font-size: 13px; letter-spacing: 1px; cursor: pointer; color: #fff; background: linear-gradient(180deg, #5a74d8, #2a3a9a); box-shadow: 0 3px 0 #1a2260; }
  .item button.buy { color: #4a1c04; background: linear-gradient(180deg, #fff2a8, #ffb83a); box-shadow: 0 3px 0 #a8601a; }
  .item button.buy.no { filter: grayscale(1); opacity: .55; }
  .item button.on { background: linear-gradient(180deg, #8ae07a, #3aa84a); box-shadow: 0 3px 0 #1a6a2a; }
  .passSub { font-size: 13px; font-weight: 800; color: #6a6088; letter-spacing: 1px; }
  .stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; width: 100%; overflow-y: auto; touch-action: pan-y;
    background: repeating-linear-gradient(0deg, rgba(29,35,64,.05) 0 1px, transparent 1px 22px); border-radius: 14px; padding: 6px; }
  .stamps canvas { width: 100%; aspect-ratio: 1; }
  #pause .card { width: min(84vw, 320px); }
  #pause .btn { min-width: 200px; }
  #done, #pause, #guess, #shop, #passport { background: radial-gradient(ellipse at 50% 45%, rgba(14,18,48,.5), rgba(8,10,30,.84)); z-index: 13; }
  #hud, #hintBar { display: none; } body.play #hud { display: block; } body.play #hintBar { display: flex; }
  body.land #menu { align-items: flex-end; justify-content: center; gap: 26px; padding-right: max(4vw, 20px); background: linear-gradient(90deg, rgba(12,16,44,0) 0%, rgba(12,16,44,.15) 45%, rgba(12,16,44,.72) 70%, rgba(12,16,44,.85) 100%); }
  body.land .mTop, body.land .mBot { width: 46vw; max-width: 460px; }
  @media (max-height: 700px) and (min-height: 521px) { .title { font-size: clamp(40px, 13.5vw, 64px); } .title b { display: inline; margin-left: .18em; } #menu { padding-bottom: 60px; } .destCard canvas { width: 54px; height: 54px; } .sub { font-size: 15px; } .mBot { gap: 7px; } .btn { padding: 11px 30px; font-size: 20px; } .stars { height: 54px; } .stars i { width: 44px; height: 44px; } .stars i:nth-child(2) { width: 54px; height: 54px; } .dTitle { font-size: 32px; } .card { gap: 8px; padding: 18px 18px 14px; } }
  @media (max-height: 520px) {
    #menu { padding: 8px 16px 10px; }
    .mTop { gap: 2px; } .title { font-size: 44px; } .title b { display: inline; margin-left: 12px; } .sub { font-size: 13px; } .tag { font-size: 10px; letter-spacing: 3px; }
    .mBot { gap: 6px; } .destCard { padding: 4px 10px 4px 4px; } .destCard canvas { width: 44px; height: 44px; } .dcName { font-size: 15px; } .dcSub { font-size: 11px; margin: 0 0 3px; }
    .btn { padding: 8px 26px; font-size: 18px; min-width: 200px; } .btn2 { padding: 6px 14px; font-size: 13px; }
    .card { padding: 12px 16px 10px; gap: 5px; width: min(92vw, 560px); display: grid; grid-template-columns: 1fr 1fr; align-items: center; justify-items: center; }
    .card > .dLvl, .card > .dTitle { grid-column: 1 / -1; } .card .btn { grid-column: 2; } .card .link { grid-column: 1; grid-row: auto; }
    .dTitle { font-size: 26px; } .stars { height: 44px; } .stars i { width: 36px; height: 36px; } .stars i:nth-child(2) { width: 44px; height: 44px; }
    .dGrid { font-size: 12px; gap: 2px 14px; } .newBest { font-size: 11px; letter-spacing: 2px; padding: 3px 10px; } .dStamp canvas { width: 64px; height: 64px; } .dRew span { font-size: 11px; padding: 2px 8px; }
    #pause .card, #guess .card { display: flex; } .opt { padding: 9px 6px; font-size: 15px; }
    .sheet { padding: 10px 14px 12px; gap: 6px; } .shHead { font-size: 20px; } .items { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .hbtn { width: 66px; height: 50px; } .hbtn svg { width: 22px; height: 22px; }
  }
  @media (max-width: 370px) { .hbtn { width: 68px; } .btn { min-width: 210px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="pill" id="coinPill"><span class="coin"></span><span id="coinTxt">0</span></div>
<div id="hud">
  <button class="round" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="4.5" height="14" rx="1.5" fill="#fff"/><rect x="11.5" y="3" width="4.5" height="14" rx="1.5" fill="#fff"/></svg></button>
</div>
<div id="hintBar">
  <button class="hbtn" id="hSpot" aria-label="Spotlight hint"><svg viewBox="0 0 26 26"><circle cx="13" cy="11" r="7.5" fill="#ffd84a" stroke="#8a5a08" stroke-width="1.8"/><path d="M10 18.5h6v3.2a1.4 1.4 0 0 1-1.4 1.4h-3.2a1.4 1.4 0 0 1-1.4-1.4z" fill="#8a94c0" stroke="#3a4270" stroke-width="1.4"/><path d="M10.5 9.5a3 3 0 0 1 3-2.6" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg><span class="pr" id="pSpot"><i></i>20</span><span class="bdg" id="bSpot"></span></button>
  <button class="hbtn" id="hReveal" aria-label="Reveal a word"><svg viewBox="0 0 26 26"><path d="M2 13s4-7 11-7 11 7 11 7-4 7-11 7S2 13 2 13z" fill="#fff" stroke="#3a4270" stroke-width="1.8"/><circle cx="13" cy="13" r="4.6" fill="#4a8af0" stroke="#1a3a8a" stroke-width="1.4"/><circle cx="13" cy="13" r="2" fill="#0a1440"/><circle cx="11.6" cy="11.6" r="1" fill="#fff"/></svg><span class="pr" id="pReveal"><i></i>50</span></button>
  <button class="hbtn" id="hTurn" aria-label="Turn the board"><svg viewBox="0 0 26 26"><path d="M20.5 9.5A8.5 8.5 0 1 0 21.5 15" fill="none" stroke="#3a4270" stroke-width="2.6" stroke-linecap="round"/><path d="M22.5 3.5v7h-7z" fill="#3a4270"/></svg><span class="pr">TURN</span></button>
</div>

<div class="overlay" id="menu">
  <div class="mTop">
    <div class="tag">✈ A WORD SEARCH JOURNEY ✈</div>
    <div class="title">WORD<b>HUNT</b></div>
    <div class="sub">around the world, one word at a time</div>
  </div>
  <div class="mBot">
    <div class="destCard"><canvas id="destIcon" width="128" height="128"></canvas><div style="flex:1"><div class="dcName" id="dcName"></div><div class="dcSub" id="dcSub"></div><div class="dcBar"><i id="dcBar"></i></div></div></div>
    <button class="btn" id="startBtn">PLAY</button>
    <div class="row">
      <button class="btn2" id="passBtn"><svg viewBox="0 0 18 18"><rect x="3" y="1.5" width="12" height="15" rx="2" fill="#2a4aa8" stroke="#fff" stroke-width="1.4"/><circle cx="9" cy="8" r="3" fill="none" stroke="#ffd25a" stroke-width="1.3"/><path d="M6 13h6" stroke="#ffd25a" stroke-width="1.3"/></svg>PASSPORT</button>
      <button class="btn2" id="shopBtn"><svg viewBox="0 0 18 18"><path d="M3 6h12l-1.2 10H4.2z" fill="#ff8a5a" stroke="#fff" stroke-width="1.4"/><path d="M6 6V5a3 3 0 0 1 6 0v1" fill="none" stroke="#fff" stroke-width="1.4"/></svg>SHOP</button>
    </div>
    <div class="stat" id="menuStats"></div>
  </div>
</div>

<div class="overlay hidden" id="shop"><div class="sheet" style="--tape: rgba(120,190,255,.85)">
  <div class="shHead"><span>SHOP</span><button class="x" id="shopX">✕</button></div>
  <div class="tabs"><button id="tabTiles" class="on">LETTER TILES</button><button id="tabHL">HIGHLIGHTERS</button></div>
  <div class="items" id="shopItems"></div>
</div></div>

<div class="overlay hidden" id="passport"><div class="sheet" style="--tape: rgba(255,200,90,.85)">
  <div class="shHead"><span>PASSPORT</span><button class="x" id="passX">✕</button></div>
  <div class="passSub" id="passSub"></div>
  <div class="stamps" id="stamps"></div>
</div></div>

<div class="overlay hidden" id="done"><div class="card">
  <div class="dLvl" id="dLvl"></div>
  <div class="dTitle" id="dTitle">COMPLETE!</div>
  <div class="stars" id="dStars"><i></i><i></i><i></i></div>
  <div class="newBest" id="dBest">NEW BEST PACE!</div>
  <div class="dGrid" id="dStats"></div>
  <div class="dRew" id="dRew"></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }
        else if (p.shape === 'heart') { ctx.rotate(p.rot * .2); heart(ctx, p.size); }
        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * (.4 + k * .6), 0, TAU); ctx.fill(); }
        ctx.restore(); ctx.shadowBlur = 0;
      }
      for (const t of texts) {
        const age = t.max - t.life, pop = age < .18 ? 1 + Math.sin(age / .18 * Math.PI) * .45 : 1, a = Math.min(1, t.life / t.max * 2.2);
        ctx.save(); ctx.globalAlpha = a; ctx.translate(t.x, t.y); ctx.scale(pop, pop); if (t.wobble) ctx.rotate(Math.sin(age * 20) * t.wobble);
        ctx.font = t.font + t.size + 'px "Avenir Next", "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, t.size * .16); ctx.strokeStyle = t.stroke; ctx.strokeText(t.str, 0, 0); ctx.fillStyle = t.c; ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },
    drawFlash(ctx, W, H) { if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  };
})();
/*FX-END*/

    const P = G.P, wd = P.words.reduce((a, b) => (b.d === 0 && b.w.length <= a.w.length) || a.d !== 0 ? b : a), t = (G.tut % 2.6) / 2.6;
    const [x0, y0] = cellXY(wd.cells[0]), [x1, y1] = cellXY(wd.cells[wd.cells.length - 1]), k = clamp((t - .15) / .5, 0, 1), e = ease(k);
    const x = lerp(x0, x1, e), y = lerp(y0, y1, e), a = t < .1 ? t / .1 : t > .85 ? (1 - t) / .15 : 1;
    if (k > 0) { ctx.globalAlpha = a; drawCapsule(x0, y0, x1, y1, LAY.cs * .8, '#ffffff', .4 * a, e); }
    drawFinger(x + 4, y + 6, LAY.cs * 1.1, a * .95);
    const h = LAY.head, bx = LAY.land ? h.x : W / 2, by = LAY.land ? LAY.list.y + LAY.list.h + 34 : h.y - 30 >= SAFE_T + 78 ? h.y - 30 : h.y + 49;
    ctx.font = `900 15px ${UIF}`; const msg = 'Swipe across the letters to find ' + wd.w, w = ctx.measureText(msg).width + 30;
    ctx.globalAlpha = 1; ctx.fillStyle = '#fffaf0'; rr(ctx, bx - w / 2, by - 16, w, 32, 16); ctx.fill(); ctx.strokeStyle = G.P.D.stamp; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fffaf0'; ctx.beginPath(); ctx.moveTo(bx - 8, by + 15); ctx.lineTo(bx + 8, by + 15); ctx.lineTo(bx, by + 24); ctx.fill();
    txt(msg, bx, by + 1, 15, '#1d2340', 'center', '900', null);
  }
  function render(dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!G || curDest < 0) { ctx.fillStyle = '#1d2340'; ctx.fillRect(0, 0, W, H); return; }
    drawBackdrop(dt, DESTS[curDest], G.t);
    const [ox, oy] = FX.offset(); ctx.save(); ctx.translate(ox, oy);
    drawBoard();
    if (!G.attract) { drawHeader(); drawList(); }
    drawFly();
    if (G.attract && G.sel) { const c = G.sel.cells, [x, y] = cellXY(c[c.length - 1]); drawFinger(x + 4, y + 6, LAY.cs * 1.05, .85); }
    ctx.restore();
    FX.draw(ctx);
    drawCoinFly();
    drawOverlays();
    FX.drawFlash(ctx, W, H);
  }

  // ---------- screens: menu, shop, passport, results, pause ----------
  let paused = false;
  const show = id => $(id).classList.remove('hidden'), hide = id => $(id).classList.add('hidden'), shown = id => !$(id).classList.contains('hidden');
  const anyOverlay = () => ['done', 'guess', 'pause', 'shop', 'passport', 'menu'].some(shown);
  function updateHintBar() {
    if (!G) return; const free = spotCost() === 0, sp = $('hSpot');
    sp.classList.toggle('free', free); $('pSpot').innerHTML = free ? 'FREE' : '<i></i>20';
    $('bSpot').style.display = SAVE.free > 0 ? 'block' : 'none'; $('bSpot').textContent = SAVE.free;
    $('hReveal').classList.toggle('off', SAVE.coins < 50);
  }
  function updateMenu() {
    const L = SAVE.level, ch = Math.floor((L - 1) / 8), di = ch % DESTS.length, k = (L - 1) % 8;
    $('dcName').textContent = DESTS[di].name; $('dcSub').textContent = 'Chapter ' + (ch + 1) + ' · Level ' + L + ' (' + (k + 1) + ' of 8)';
    $('dcBar').style.width = (k / 8 * 100) + '%';
    const g = $('destIcon').getContext('2d'); drawStamp(g, 128, di, 'cur');
    $('startBtn').innerHTML = (L > 1 || SAVE.cur ? 'CONTINUE' : 'PLAY') + '<small>LEVEL ' + L + '</small>';
    $('menuStats').innerHTML = SAVE.played ? '★ <b>' + SAVE.stars + '</b> &nbsp;·&nbsp; <b>' + fmt(SAVE.words) + '</b> words &nbsp;·&nbsp; best pace <b>' + (SAVE.bestPace ? SAVE.bestPace.toFixed(1) + 's' : '–') + '</b>' : 'Find hidden words · collect passport stamps';
    coinShown = SAVE.coins;
  }
  function start() {
    audio.start(); audioOn = true; hide('menu'); hide('shop'); hide('passport'); hide('done'); hide('pause'); paused = false;
    document.body.classList.add('play'); startLevel(SAVE.level, true);
  }
  function goMenu() {
    saveCur(); paused = false; ['done', 'pause', 'guess', 'shop', 'passport'].forEach(hide); document.body.classList.remove('play');
    show('menu'); updateMenu(); demoN = 0; startDemo(); requestAnimationFrame(() => layout());
  }
  function showDone() {
    if (!G || !G.rewards) return; const R = G.rewards, P = G.P;
    document.querySelector('#done .card').style.setProperty('--tape', hexA(P.D.accent, .85));
    $('dLvl').textContent = 'LEVEL ' + P.L + ' · ' + P.D.name;
    $('dTitle').textContent = P.special === 'timed' ? (R.nf === P.words.length ? 'ALL FOUND!' : 'ROUND OVER') : ['', 'COMPLETE!', 'GREAT JOB!', 'PERFECT!'][R.stars];
    [...$('dStars').children].forEach((s, k) => { s.classList.remove('on'); later(400 + k * 280, () => { if (k < R.stars) { s.classList.add('on'); sfx(NOTE(8 + k * 3), .45, 'triangle', .07); sfx(NOTE(13 + k * 3), .45, 'sine', .03); } }); });
    $('dBest').style.display = R.newBest ? '' : 'none'; $('dBest').textContent = 'NEW BEST PACE · ' + R.pace.toFixed(1) + 's / word';
    $('dStats').innerHTML = [['Time', mmss(G.time)], ['Words', R.nf + ' / ' + P.words.length], ['Bonus words', G.bonus.length], ['Hints', G.hints]].map(([a, b]) => '<div>' + a + '<b>' + b + '</b></div>').join('');
    $('dRew').innerHTML = R.rw.map(([n, v, miss]) => '<span class="' + (miss ? 'miss' : '') + '">' + n + ' +' + v + '</span>').join('') + '<span class="tot">● +' + R.total + '</span>';
    $('dStamp').style.display = R.chapterDone ? '' : 'none';
    if (R.chapterDone) { drawStamp($('stampCv').getContext('2d'), 200, P.destIdx, 'done', SAVE.chap[P.chapter] || 0, P.tour); $('dStampTxt').innerHTML = 'PASSPORT<br>STAMPED!'; later(1000, () => { boom(.25, .25, 600, 120); sfx(90, .2, 'sine', .1, 50); }); }
    $('nextBtn').innerHTML = R.chapterDone ? 'NEXT STOP ✈' : 'NEXT ▶';
    show('done');
    const r = $('dRew').getBoundingClientRect(); for (let j = 0; j < Math.min(10, R.newCoins); j++) G.coinFly.push({ x0: r.left + r.width / 2 + rnd(-60, 60), y0: r.top + rnd(-6, 6), t: -.6 - j * .07, v: Math.floor(R.newCoins / Math.min(10, R.newCoins)) + (j < R.newCoins % Math.min(10, R.newCoins) ? 1 : 0) });
  }
  function pause() { if (!G || G.attract || paused || G.state !== 'play' || anyOverlay()) return; paused = true; ptr.id = null; G.sel = null; $('pLvl').textContent = 'LEVEL ' + G.L + ' · ' + G.P.D.name; show('pause'); saveCur(); }
  function resume() { paused = false; hide('pause'); last = performance.now(); }
  // shop
  let shopTab = 'tiles';
  function drawPreview(c, i) {
    const g = c.getContext('2d'), Wc = c.width, Hc = c.height, di = curDest >= 0 ? curDest : 0, D = DESTS[di];
    g.clearRect(0, 0, Wc, Hc); g.fillStyle = lg(g, 0, 0, 0, Hc, [[0, D.panel[0]], [1, D.panel[1]]]); rr(g, 0, 0, Wc, Hc, 22); g.fill();
    const tiles = shopTab === 'tiles', t = tiles ? (i ? SKINS[i].t : D.tile) : tileFor(), set = tileSet(t, tiles ? (i ? 's' + i : 'd' + di) : tileKey());
    if (!set) { later(150, () => drawPreview(c, i)); return; }
    const word = 'WORD', s = 66, x0 = (Wc - s * 4) / 2, y = Hc / 2 - (tiles ? 0 : 0);
    const sts = tiles ? ['n', 'n', 's', 'g'] : ['n', 'n', 'n', 'n'];
    for (let k = 0; k < 4; k++) g.drawImage(set[sts[k]], x0 + k * s, y - s / 2, s, s);
    if (!tiles) { const h = HLS[i], cap = (a, b, col, yy) => { g.save(); g.globalAlpha = h.a; g.fillStyle = h.rainbow ? lg(g, a, 0, b, 0, h.cols.map((cc, j) => [j / 7, cc])) : col; rr(g, a - 26, yy - 26, b - a + 52, 52, 26); g.fill(); g.globalAlpha = 1; g.strokeStyle = shade(col, -.35); g.lineWidth = 2; g.stroke(); g.restore(); };
      cap(x0 + s / 2, x0 + s * 3.5, h.cols[0], y); for (let k = 0; k < 8; k++) { g.fillStyle = h.cols[k]; g.beginPath(); g.arc(Wc / 2 + (k - 3.5) * 22, Hc - 16, 7, 0, TAU); g.fill(); } }
    g.font = `900 36px ${UIF}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let k = 0; k < 4; k++) { const st = sts[k]; g.fillStyle = st === 's' ? '#fff' : st === 'g' ? '#5a3a02' : t.ink; g.fillText(word[k], x0 + k * s + s / 2, y - 1); }
  }
  function renderShop() {
    $('tabTiles').classList.toggle('on', shopTab === 'tiles'); $('tabHL').classList.toggle('on', shopTab !== 'tiles');
    const box = $('shopItems'), list = shopTab === 'tiles' ? SKINS : HLS, own = shopTab === 'tiles' ? SAVE.skins : SAVE.hls, eqI = shopTab === 'tiles' ? SAVE.skin : SAVE.hl; box.innerHTML = '';
    list.forEach((it, i) => {
      const owned = own.includes(i), eq = eqI === i, d = document.createElement('div'); d.className = 'item' + (eq ? ' eq' : '');
      const c = document.createElement('canvas'); c.width = 320; c.height = 160; d.appendChild(c);
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name.toUpperCase(); d.appendChild(nm);
      const b = document.createElement('button'); b.className = eq ? 'on' : owned ? '' : 'buy' + (SAVE.coins < it.price ? ' no' : ''); b.textContent = eq ? '✓ EQUIPPED' : owned ? 'EQUIP' : '● ' + fmt(it.price);
      b.onclick = () => {
        if (!owned) { if (SAVE.coins < it.price) { audio.sfx(200, .2, 'square', .03, 150); b.animate([{ transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], 240); return; } spend(it.price); own.push(i); audio.sfx(880, .2, 'triangle', .06); later(90, () => audio.sfx(1320, .3, 'triangle', .05)); }
        if (shopTab === 'tiles') SAVE.skin = i; else SAVE.hl = i; saveNow(); renderShop();
      };
      d.appendChild(b); box.appendChild(d); drawPreview(c, i);
    });
  }
  function renderPassport() {
    const curCh = Math.floor((SAVE.level - 1) / 8), tour = Math.floor(curCh / 12), box = $('stamps'); box.innerHTML = '';
    let done = 0; for (let i = 0; i < 12; i++) { const ch = tour * 12 + i, st = ch < curCh ? 'done' : ch === curCh ? 'cur' : 'locked'; if (st === 'done') done++; const c = document.createElement('canvas'); c.width = 220; c.height = 220; drawStamp(c.getContext('2d'), 220, i, st, SAVE.chap[ch] || 0, tour); box.appendChild(c); }
    $('passSub').textContent = 'WORLD TOUR ' + (tour + 1) + ' · ' + done + ' / 12 STAMPS · ★ ' + SAVE.stars + ' TOTAL';
  }
  $('startBtn').onclick = start;
  $('shopBtn').onclick = () => { shopTab = 'tiles'; renderShop(); show('shop'); };
  $('passBtn').onclick = () => { renderPassport(); show('passport'); };
  $('shopX').onclick = () => { hide('shop'); updateMenu(); }; $('passX').onclick = () => hide('passport');
  $('tabTiles').onclick = () => { shopTab = 'tiles'; renderShop(); }; $('tabHL').onclick = () => { shopTab = 'hl'; renderShop(); };
  $('nextBtn').onclick = () => { hide('done'); startLevel(SAVE.level, false); };
  $('dMenu').onclick = goMenu; $('pMenu').onclick = goMenu; $('resumeBtn').onclick = resume;
  $('pauseBtn').onclick = pause;
  $('hSpot').onclick = useSpot; $('hReveal').onclick = useReveal; $('hTurn').onclick = useTurn;
  addEventListener('keydown', e => {
    if (e.code === 'Enter' && shown('menu') && !shown('shop') && !shown('passport')) start();
    else if (e.code === 'Escape') { if (paused) resume(); else pause(); }
    else if (G && !G.attract && !paused) { if (e.code === 'KeyH') useSpot(); else if (e.code === 'KeyT') useTurn(); }
  });
  addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // ---------- resize & loop ----------
  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const cs = getComputedStyle($('safe')); SAFE_T = parseFloat(cs.paddingTop) || 0; SAFE_B = parseFloat(cs.paddingBottom) || 0;
    GLYPH.clear(); OLDBG = null; panelKey = ''; if (curDest >= 0) buildBackdrop(curDest, true); layout();
    measurePill();
  }
  addEventListener('resize', resize);
  let last = performance.now(), fAcc = 0, fN = 0;
  function frame(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    fAcc += dt; fN++; if (fAcc >= 1) { fps = Math.round(fN / fAcc); fAcc = 0; fN = 0; }
    if (!paused) update(dt);
    render(dt);
    if (coinShown > SAVE.coins) coinShown = SAVE.coins;
    const ct = fmt(coinShown); if ($('coinTxt').textContent !== ct) { $('coinTxt').textContent = ct; measurePill(); }
    requestAnimationFrame(frame);
  }

  // ---------- test hook ----------
  function validate(a, b) {
    const errs = []; let n = 0;
    for (let L = a; L <= b; L++) {
      const P = genLevel(L); if (!P) { errs.push(L + ': no puzzle'); continue; } n++;
      if (P.grid.some(ch => !/^[A-Z]$/.test(ch))) errs.push(L + ': bad grid');
      for (const w of P.words) { if (occurrences(P.grid, P.N, w.w).length !== 1) errs.push(L + ': ' + w.w + ' not unique'); if (!WordKit.theme(w.theme).includes(w.w)) errs.push(L + ': ' + w.w + ' not a theme word'); }
      if (P.hidden && (P.hidden.cells.map(i => P.grid[i]).join('') !== P.hidden.word || !(WordKit.isWord(P.hidden.word) || P.D.themes.some(t => WordKit.theme(t).includes(P.hidden.word))))) errs.push(L + ': hidden word');
    }
    return { checked: n, errs };
  }
  window.__wh = {
    G: () => G, S: () => SAVE, start, gen: genLevel, validate, fps: () => fps, pause, resume,
    level: n => { if (shown('menu')) start(); ['done', 'guess', 'pause'].forEach(hide); paused = false; SAVE.cur = null; SAVE.level = n; startLevel(n, false); G.intro = null; },
    solve: () => unfound().forEach((i, k) => later(k * 90, () => { if (G && !G.found[i] && G.state === 'play') foundWord(i); })),
    findOne: () => { const o = unfound(); if (o.length) foundWord(o[0]); return o.length - 1; },
    autopilot: v => { G.autopilot = v; G.bot = null; },
    coins: n => { SAVE.coins += n; coinShown = SAVE.coins; saveNow(); updateHintBar(); },
    unlockAll: () => { SAVE.skins = SKINS.map((_, i) => i); SAVE.hls = HLS.map((_, i) => i); saveNow(); },
    equip: (skin, hl) => { if (skin != null) SAVE.skin = skin; if (hl != null) SAVE.hl = hl; saveNow(); },
    cell: i => cellXY(i), wordCells: i => G.P.words[i].cells.map(cellXY), cs: () => LAY.cs,
    skipIntro: () => { if (G) G.intro = null; }, setTime: v => { G.timeLeft = v; },
    state: () => ({ level: G.L, state: G.state, found: G.found.filter(Boolean).length, total: G.P.words.length, special: G.P.special, N: G.P.N, dest: G.P.D.name, coins: SAVE.coins, time: G.time, attract: G.attract, mistakes: G.mistakes, bonus: G.bonus.slice(), rot: G.rot, spot: G.spot, hints: G.hints, goal: G.goal, goalState: G.goalState, paused })
  };

  resize(); goMenu(); updateMenu();
  requestAnimationFrame(frame);
})();
</script>
