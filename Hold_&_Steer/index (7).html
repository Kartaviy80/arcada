<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06466e">
<title>Surf Legend</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06466e; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); visibility: hidden; pointer-events: none; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  #menu { justify-content: space-between; padding: calc(env(safe-area-inset-top) + 5vh) 18px calc(env(safe-area-inset-bottom) + 70px);
    background: linear-gradient(180deg, rgba(2,20,44,.5) 0%, rgba(2,20,44,0) 32%, rgba(2,20,44,0) 50%, rgba(2,14,32,.82) 100%); }
  .kicker { font-weight: 900; font-size: 12px; letter-spacing: 6px; color: #c8fbff; text-shadow: 0 2px 10px rgba(0,30,70,.9); margin-bottom: 4px; }
  .title { font-style: italic; font-weight: 900; line-height: .82; letter-spacing: -1px; font-size: clamp(66px, 20vw, 132px);
    display: flex; flex-direction: column; align-items: center; transform: rotate(-5deg); animation: bob 3.2s ease-in-out infinite; }
  .title span { background: linear-gradient(180deg, #fffef2 6%, #ffe45c 38%, #ff9c2e 66%, #ff4f72 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px #04263f; filter: drop-shadow(0 6px 0 #04263f) drop-shadow(0 0 26px rgba(70,240,255,.75)); padding: 0 .1em; }
  .title span + span { font-size: .74em; margin-top: .02em; background: linear-gradient(180deg, #ffffff 4%, #a6faff 40%, #25cbe9 72%, #0b72c4 100%); -webkit-background-clip: text; background-clip: text; }
  @keyframes bob { 0%,100% { transform: rotate(-5deg) translateY(0); } 50% { transform: rotate(-4deg) translateY(-6px); } }
  .stats { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .chip { background: rgba(3,30,52,.72); border: 1.5px solid rgba(150,240,255,.35); border-radius: 14px; padding: 6px 12px 5px; min-width: 84px; }
  .chip small { display: block; font-size: 10px; font-weight: 900; letter-spacing: 2px; color: #8fe8f4; }
  .chip b { font-size: 19px; font-weight: 900; font-style: italic; color: #ffe27a; text-shadow: 0 2px 0 #3a1a00; }
  .play { font: italic 900 28px/1 "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 4px; color: #fff; cursor: pointer;
    padding: 20px 66px 18px; border-radius: 999px; border: 3px solid #fff6cc;
    background: linear-gradient(180deg, #ffe45a 0%, #ff9e2c 52%, #ff5638 100%); text-shadow: 0 3px 0 #a3330a; position: relative;
    box-shadow: 0 7px 0 #8e2a08, 0 0 0 7px rgba(255,214,110,.22), 0 0 46px rgba(255,170,60,.85); }
  .play::after { content: ''; position: absolute; inset: -12px; border-radius: 999px; border: 3px solid rgba(255,226,140,.8); box-shadow: 0 0 26px rgba(255,190,80,.9);
    animation: pulse 1.5s ease-out infinite; pointer-events: none; }
  .play:active { transform: translateY(4px); box-shadow: 0 3px 0 #8e2a08, 0 0 30px rgba(255,170,60,.8); }
  @keyframes pulse { 0% { transform: scale(.94); opacity: .9; } 100% { transform: scale(1.14, 1.3); opacity: 0; } }
  button[aria-label="Toggle music"] { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  .how { margin-top: 16px; font-size: 13px; line-height: 1.6; font-weight: 700; color: #d6f8ff; text-shadow: 0 2px 6px rgba(0,20,40,.9); }
  .how b { color: #ffe27a; }
  #over { justify-content: center; padding: 20px; background: radial-gradient(ellipse at 50% 40%, rgba(2,30,56,.55), rgba(1,10,24,.88)); }
  .card { width: min(380px, 92vw); background: linear-gradient(180deg, rgba(10,62,96,.93), rgba(3,24,44,.96)); border: 2px solid rgba(140,236,255,.45);
    border-radius: 28px; padding: 20px 20px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25); }
  .wipe { font-style: italic; font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: 1px;
    background: linear-gradient(180deg, #ffffff, #8ff2ff 55%, #2aa8e8); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 2px #032036; filter: drop-shadow(0 4px 0 #032036); }
  .final { font-style: italic; font-weight: 900; font-size: 56px; line-height: 1.1; color: #ffe45a; text-shadow: 0 4px 0 #5a2600, 0 0 24px rgba(255,200,80,.6); margin-top: 6px; }
  .newbest { display: inline-block; font-weight: 900; font-size: 15px; letter-spacing: 3px; color: #3a1400; padding: 5px 14px; border-radius: 12px;
    background: linear-gradient(180deg, #fff3a0, #ffb02a); box-shadow: 0 0 22px rgba(255,200,60,.9); animation: nb .7s ease-in-out infinite alternate; }
  @keyframes nb { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.1) rotate(3deg); } }
  .bestline { font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #9fe6f4; margin: 6px 0 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .grid div { background: rgba(0,20,40,.45); border-radius: 12px; padding: 7px 8px; border: 1px solid rgba(140,236,255,.18); }
  .grid small { display: block; font-size: 10px; font-weight: 900; letter-spacing: 1.5px; color: #82d8ea; }
  .grid b { font-size: 16px; font-weight: 900; font-style: italic; color: #fff; }
  .card .play { font-size: 23px; padding: 16px 40px 14px; }
  .ghost { display: block; margin: 14px auto 0; background: none; border: 0; color: #9fe6f4; font: 800 14px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 3px; cursor: pointer; padding: 6px 14px; }
  #pause { justify-content: center; background: rgba(1,14,30,.66); cursor: pointer; }
  .ptitle { font-style: italic; font-weight: 900; font-size: 54px; color: #fff; text-shadow: 0 5px 0 #04263f, 0 0 30px rgba(80,230,255,.8); }
  .psub { margin-top: 10px; font-weight: 800; letter-spacing: 3px; color: #a6f2ff; animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  #pauseBtn { position: fixed; z-index: 5; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); width: 40px; height: 40px;
    border-radius: 50%; border: 2px solid rgba(190,248,255,.55); background: rgba(3,34,58,.5); color: #dffaff; font: 900 13px sans-serif; letter-spacing: -1px; cursor: pointer;
    display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button id="pauseBtn" aria-label="Pause">❚❚</button>
<div class="overlay" id="menu">
  <div>
    <div class="kicker">ENDLESS BIG-WAVE SURFING</div>
    <div class="title"><span>SURF</span><span>LEGEND</span></div>
  </div>
  <div>
    <div class="stats" id="menuStats"></div>
    <button class="play" id="startBtn">PLAY</button>
    <div class="how"><b>HOLD</b> carve up the face · <b>RELEASE</b> drop for speed<br>Hit the lip fast to launch · <b>HOLD</b> in air to flip · <b>TAP</b> to spin</div>
  </div>
</div>
<div class="overlay hidden" id="over">
  <div class="card">
    <div class="wipe" id="overTitle">WIPEOUT!</div>
    <div class="final" id="finalScore">0</div>
    <div id="newBest" class="newbest">NEW BEST!</div>
    <div class="bestline" id="bestLine">BEST 0</div>
    <div class="grid" id="runStats"></div>
    <button class="play" id="againBtn">PLAY AGAIN</button>
    <button class="ghost" id="menuBtn">MENU</button>
  </div>
</div>
<div class="overlay hidden" id="pause"><div class="ptitle">PAUSED</div><div class="psub">TAP TO RESUME</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);

      const a = .75 + .25 * Math.sin(t * 10);
      txt('IN THE TUBE  ' + S.tubeT.toFixed(1) + 's', W / 2, H * (port ? .35 : .36), Math.round(20 * u), 'rgba(125,255,216,' + a + ')', 'center', 5 * u);
    }
    // edge warnings for incoming hazards
    for (const it of items) {
      if (!it.alive || !it.obst) continue;
      const sx = (it.x - camX) * k; if (sx < W - 10 || sx > W + 520 * k) continue;
      const sy = clamp((it.y - 20 - camY) * k, 90, H - 90), a = 1 - (sx - W) / (520 * k);
      ctx.globalAlpha = a * (.7 + .3 * Math.sin(t * 12));
      ctx.beginPath(); ctx.moveTo(W - SA.r - 6, sy); ctx.lineTo(W - SA.r - 22, sy - 10); ctx.lineTo(W - SA.r - 22, sy + 10); ctx.closePath(); ctx.fillStyle = '#ff5a4a'; ctx.fill();
      txt('!', W - SA.r - 28, sy, 15, '#ffffff', 'right', 3);
    }
    ctx.globalAlpha = 1;
    // trick banner
    if (banner) {
      const bt = banner.t, sIn = bt < .28 ? easeBack(bt / .28) : 1, a = bt > 1.5 ? 1 - (bt - 1.5) / .4 : 1;
      const by = H * (port ? .27 : .25);
      ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.translate(W / 2, by); ctx.rotate(-.05); ctx.scale(sIn, sIn);
      let fs = Math.round(32 * u); ctx.font = 'italic 900 ' + fs + 'px ' + FONT; const tw = ctx.measureText(banner.name).width; if (tw > W - 40) fs = Math.floor(fs * (W - 40) / tw);
      const bg = ctx.createLinearGradient(0, -fs / 2, 0, fs / 2); bg.addColorStop(0, '#ffffff'); bg.addColorStop(.6, banner.col); bg.addColorStop(1, shade(banner.col, -.25));
      ctx.shadowColor = banner.col; ctx.shadowBlur = 18;
      txt(banner.name, 0, 0, fs, bg, 'center', Math.max(4, fs * .2), 'rgba(4,20,40,.9)');
      ctx.shadowBlur = 0;
      if (banner.sub) txt(banner.sub + (banner.mult > 1 ? '   x' + banner.mult : ''), 0, fs * .95, Math.round(16 * u), banner.q === 'PERFECT' ? '#ffe45a' : '#e8fdff', 'center', 4 * u);
      ctx.restore();
    }
    // set banner
    if (setBanner) {
      const bt = setBanner.t, a = bt < .3 ? bt / .3 : bt > 2.4 ? 1 - (bt - 2.4) / .6 : 1, slide = bt < .4 ? (1 - easeBack(bt / .4)) * W * .4 : 0;
      const by = H * (port ? .4 : .42);
      ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.translate(W / 2 + slide, by); ctx.rotate(-.06);
      const bw = Math.min(W - 30, 420 * u);
      const gb = ctx.createLinearGradient(-bw / 2, 0, bw / 2, 0); gb.addColorStop(0, 'rgba(0,30,60,0)'); gb.addColorStop(.2, 'rgba(0,30,60,.7)'); gb.addColorStop(.8, 'rgba(0,30,60,.7)'); gb.addColorStop(1, 'rgba(0,30,60,0)');
      ctx.fillStyle = gb; ctx.fillRect(-bw / 2, -44 * u, bw, 96 * u);
      const tg = ctx.createLinearGradient(0, -30 * u, 0, 20 * u); tg.addColorStop(0, '#fffef0'); tg.addColorStop(.5, '#ffe45a'); tg.addColorStop(1, '#ff8a2a');
      txt('SET ' + setBanner.n, 0, -10 * u, Math.round(52 * u), tg, 'center', 9 * u, '#04263f');
      txt(setBanner.name + ' · ' + setBanner.place, 0, 30 * u, Math.round(15 * u), '#c8fbff', 'center', 4 * u, '#04263f', '900');
      ctx.restore();
    }
    // tutorial / start hint
    if (mode === 'play' && S.alive && (tut || hint > 0) && !setBanner) drawHint(u, port);
  }
  function drawHint(u, port) {
    let msg = 'HOLD TO CARVE UP', sub = 'release to drop & gain speed', icon = 'hold';
    if (tut) {
      if (tut.step === 1) { msg = 'RELEASE TO DROP'; sub = 'dropping down the face builds speed'; icon = 'release'; }
      else if (tut.step === 2) { msg = 'HIT THE LIP FAST TO LAUNCH'; sub = 'build speed, then hold up to the top'; icon = 'hold'; }
      else if (tut.step === 3) { msg = 'HOLD TO FLIP · TAP TO SPIN'; sub = 'release & land straight!'; icon = 'hold'; }
      else if (tut.step === 4) { msg = 'NICE! CHAIN TRICKS FOR COMBOS'; sub = 'stay ahead of the whitewater'; icon = ''; }
    }
    const a = tut ? Math.min(1, tut.t * 3) : Math.min(1, hint);
    const y = H * (port ? .5 : .52) + (port ? 0 : 0);
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = 'italic 900 ' + Math.round(20 * u) + 'px ' + FONT;
    const w = Math.max(ctx.measureText(msg).width + 90 * u, 240 * u);
    rr(W / 2 - w / 2, y - 30 * u, w, 60 * u, 30 * u); ctx.fillStyle = 'rgba(2,26,48,.62)'; ctx.fill(); ctx.strokeStyle = 'rgba(160,246,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
    const ix = W / 2 - w / 2 + 34 * u;
    if (icon) {
      const pressed = icon === 'hold' ? (t % 1.4) < 1 : (t % 1.4) > .9;
      ctx.beginPath(); ctx.arc(ix, y, 15 * u, 0, TAU); ctx.fillStyle = pressed ? '#ffe45a' : 'rgba(255,255,255,.25)'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      if (pressed) { const rp = (t * 2) % 1; ctx.globalAlpha = a * (1 - rp); ctx.beginPath(); ctx.arc(ix, y, 15 * u + rp * 16 * u, 0, TAU); ctx.stroke(); ctx.globalAlpha = a; }
      txt(icon === 'hold' ? '▲' : '▼', ix, y + 1, Math.round(14 * u), pressed ? '#5a2600' : '#ffffff', 'center', 0, '', '900');
    }
    txt(msg, W / 2 + (icon ? 14 * u : 0), y - 7 * u, Math.round(18 * u), '#ffffff', 'center', 0);
    txt(sub, W / 2 + (icon ? 14 * u : 0), y + 13 * u, Math.round(11 * u), '#9fe6f4', 'center', 0, '', '800');
    ctx.restore();
  }

  // =====================================================================
  //  FLOW: menu / play / over / pause
  // =====================================================================
  function refreshMenu() {
    $('menuStats').innerHTML = '<div class="chip"><small>BEST</small><b>' + fmt(SAVE.best) + '</b></div><div class="chip"><small>BEST SET</small><b>' + SAVE.bestSet + '</b></div><div class="chip"><small>MAX COMBO</small><b>x' + SAVE.bestCombo + '</b></div>';
  }
  function startDemo() {
    mode = 'demo'; resetWorld(1, true); S.lives = 99;
    $('menu').classList.remove('hidden'); $('over').classList.add('hidden'); $('pauseBtn').style.display = 'none';
    refreshMenu();
    if (roar) { roar.set(40, 0); rush.set(80, 0); }
  }
  function startRun() {
    mode = 'play'; overT = 0; paused = false;
    resetWorld(1, false);
    $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('pause').classList.add('hidden'); $('pauseBtn').style.display = 'block';
    audio.start();
    if (!roar) { roar = audio.hum('sawtooth', 170); rush = audio.hum('triangle', 900); }
    tut = SAVE.tut ? null : { step: 0, t: 0, hold: 0, drop: 0 };
    hint = SAVE.tut ? 3.6 : 0;
    setBanner = { n: 1, name: curSet.pal.name, place: curSet.place, t: .3 };
    SAVE.runs++; store();
    input.ptr.clear(); input.keys.clear(); input.hold = false;
  }
  function gameOver() {
    overT = performance.now(); mode = 'over';
    const newBest = score > SAVE.best;
    SAVE.best = Math.max(SAVE.best, Math.floor(score)); SAVE.bestSet = Math.max(SAVE.bestSet, stats.set); SAVE.bestCombo = Math.max(SAVE.bestCombo, stats.maxCombo);
    if (stats.bestTrick && stats.bestTrickPts > (SAVE.bestTrickPts || 0)) { SAVE.bestTrick = stats.bestTrick; SAVE.bestTrickPts = stats.bestTrickPts; }
    store();
    $('overTitle').textContent = stats.set >= 5 ? 'LEGENDARY RUN!' : 'WIPED OUT!';
    $('newBest').style.display = newBest ? 'inline-block' : 'none';
    $('bestLine').textContent = 'BEST ' + fmt(SAVE.best);
    $('runStats').innerHTML = [['SET REACHED', stats.set], ['DISTANCE', Math.round(stats.dist / 10) + ' m'], ['MAX COMBO', 'x' + stats.maxCombo], ['TUBE TIME', stats.tube.toFixed(1) + ' s'],
      ['AIRS / FLIPS', stats.airs + ' / ' + stats.flips], ['SHELLS', stats.shells], ['BEST TRICK', '<span style="font-size:12px">' + (stats.bestTrick || '—') + '</span>'], ['PERFECT LANDINGS', stats.perfect]]
      .map(([a, b]) => '<div><small>' + a + '</small><b>' + b + '</b></div>').join('');
    $('pauseBtn').style.display = 'none';
    later(450, () => { $('over').classList.remove('hidden'); countUp(); });
    if (newBest) later(700, () => { [523, 659, 784, 1046].forEach((f, i) => later(i * 110, () => sfx(f, .2, 'square', .05))); });
    if (roar) { roar.set(40, 0); rush.set(80, 0); }
  }
  function countUp() {
    const target = Math.floor(score), t0 = performance.now();
    const step = () => { const u = Math.min(1, (performance.now() - t0) / 900); $('finalScore').textContent = fmt(target * (1 - Math.pow(1 - u, 3))); if (u < 1) requestAnimationFrame(step); };
    step();
  }
  function pause() { if (mode !== 'play' || paused) return; paused = true; $('pause').classList.remove('hidden'); input.ptr.clear(); input.keys.clear(); input.hold = false; if (roar) { roar.set(40, 0); rush.set(80, 0); } }
  function resume() { if (!paused) return; paused = false; $('pause').classList.add('hidden'); last = performance.now(); }

  // ---------- input ----------
  const HOLDKEYS = new Set(['Space', 'ArrowUp', 'KeyW', 'ArrowRight', 'KeyD']);
  function setHold() { const h = input.ptr.size > 0 || input.keys.size > 0; if (h !== input.hold) { input.hold = h; onHoldChange(h); } }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (mode !== 'play' || paused) return;
    input.ptr.add(e.pointerId); try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    setHold();
  });
  const up = e => { input.ptr.delete(e.pointerId); setHold(); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);
  addEventListener('keydown', e => {
    if (e.code === 'Escape' || e.code === 'KeyP') { if (mode === 'play') { paused ? resume() : pause(); } return; }
    if (mode === 'demo' && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); if (SPR) startRun(); return; }
    if (mode === 'over' && (e.code === 'Space' || e.code === 'Enter') && performance.now() - overT > 1200) { e.preventDefault(); startRun(); return; }
    if (paused && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); resume(); return; }
    if (HOLDKEYS.has(e.code)) { e.preventDefault(); if (mode === 'play' && !e.repeat) { input.keys.add(e.code); setHold(); } }
  });
  addEventListener('keyup', e => { if (input.keys.delete(e.code)) setHold(); });
  addEventListener('blur', () => { input.ptr.clear(); input.keys.clear(); setHold(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  $('pause').addEventListener('pointerdown', e => { e.preventDefault(); resume(); });
  $('pauseBtn').addEventListener('pointerdown', e => e.stopPropagation());
  $('pauseBtn').addEventListener('click', e => { e.stopPropagation(); pause(); });
  $('startBtn').addEventListener('click', () => { if (SPR) startRun(); });
  $('againBtn').addEventListener('click', () => startRun());
  $('menuBtn').addEventListener('click', () => startDemo());

  let dprCap = 2, perfT = 0, perfN = 0, perfS = 0;
  function adaptRes(raw) { // drop internal resolution a notch if the device can't hold ~50 fps
    if (mode !== 'play' || paused) return;
    perfT += raw; perfN++; perfS += raw;
    if (perfT < 2.5) return;
    const f = perfN / perfS; perfT = perfN = perfS = 0;
    const floor = Math.max(.75, Math.min(1.25, (window.devicePixelRatio || 1) * .6));
    if (f < 48 && DPR > floor + .01) { dprCap = Math.max(floor, DPR - .3); resize(); }
  }
  function resize() {
    DPR = Math.min(dprCap, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    readSafe(); buildVignette();
    if (curSet) {
      for (const s of sets) s.layers = null;
      curSet.layers = buildLayers(curSet.pal); LAY = curSet.layers; LAYOLD = null; palT = 1; PAL = curSet.pal;
      for (const s of sets) if (s !== curSet) layerJobs.push(s);
      buildGradients();
    }
    updCamera(1);
  }
  addEventListener('resize', resize);

  // ---------- test hook ----------
  window.__sl = {
    state: () => ({ mode, paused, score: Math.floor(score), set: curSet ? curSet.n : 0, biome: PAL ? PAL.name : '', x: S.x, y: S.y, H: waveH(S.x), h: -S.y / waveH(S.x), speed: S.s, th: S.th, air: S.air, vx: S.vx, vy: S.vy, rot: S.rot, flip: S.flip,
      alive: S.alive, lives: S.lives, mult: combo.mult, gap: S.x - wave.xw, tube: !!S.tubeB, inBarrelAhead: !!barrelAt(S.x + 150), fps: Math.round(fps), dpr: DPR, perf: { u: +perf.u.toFixed(2), r: +perf.r.toFixed(2) }, best: SAVE.best, zoom: k, particles: pn, tl: S.air ? timeToLand() : 0,
      pw: { big: pw.big, gold: pw.gold }, stats, banner: banner ? banner.name : '', spins: S.spins, spinQ: S.spinQ, tut: tut ? tut.step : -1,
      items: items.filter(it => it.alive && it.x > S.x - 50 && it.x < S.x + 600).map(it => ({ type: it.type, dx: it.x - S.x, h: -it.y / waveH(it.x), obst: it.obst })) }),
    setStage: n => { const x = S.x; const s = makeSet(n, x - 400, null); sets = [s]; curSet = s; items = items.filter(it => it.x < x + 200 && !it.obst); barrels = []; genX = x + 300; barrelEnd = -1e9; runLull = 0; applyPalette(s, true); setBanner = { n, name: s.pal.name, place: s.place, t: 0 }; if (stats) stats.set = n; ensureSets(x + 5000); return s.pal.name; },
    god: (v = true) => { god = v; },
    give: type => pickup({ type, x: S.x, y: S.y - 40, alive: true }),
    wipe: () => { S.invT = 0; wipeout('test'); },
    lives: n => { S.lives = n; },
    barrel: () => { const b = { x0: S.x + 150, x1: S.x + 1500, done: false }; barrels.push(b); items = items.filter(it => !(it.obst && it.x > b.x0 - 100 && it.x < b.x1 + 100)); return b; },
    spawn: (type, dx = 400, f = .5) => addItem(type, S.x + dx, { f, off: 120, vx: type === 'rival' ? 200 : type === 'gull' ? -100 : type === 'shark' ? -80 : type === 'kite' ? 240 : 0, p: 0, ph: 0 }),
    speed: v => { S.s = v; },
    sprites: () => SPR,
    pal: () => PAL,
    dbg: DBG
  };

  // ---------- main loop ----------
  let last = performance.now();
  const perf = { u: 0, r: 0 };
  function frame(now) {
    const raw = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    msAcc.push(raw); if (msAcc.length > 60) msAcc.shift();
    adaptRes(raw);
    fps = msAcc.length / Math.max(.001, msAcc.reduce((a, b) => a + b, 0));
    if (!paused && SPR) {
      if (hitStop > 0) hitStop -= raw;
      else {
        if (slowT <= 0) timeScale = lerp(timeScale, 1, 1 - Math.exp(-raw * 6));
        const dt = raw * timeScale;
        const a0 = performance.now();
        update(dt);
        FX.update(dt);
        perf.u = perf.u * .95 + (performance.now() - a0) * .05;
      }
    }
    const r0 = performance.now();
    if (PAL) render();
    perf.r = perf.r * .95 + (performance.now() - r0) * .05;
    requestAnimationFrame(frame);
  }
  resize();
  refreshMenu();
  $('startBtn').disabled = true;
  loadAll().then(() => { startDemo(); $('startBtn').disabled = false; resize(); });
  requestAnimationFrame(frame);
})();
</script>
