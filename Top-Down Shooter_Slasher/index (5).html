<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a14">
<title>Dungeon Blade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0a14; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  #menu { background: radial-gradient(ellipse at 50% 46%, rgba(14,8,24,.12), rgba(8,4,14,.82) 80%); }
  .tag { font-size: 12px; letter-spacing: 6px; font-weight: 800; color: #ffd88a; text-shadow: 0 2px 8px rgba(0,0,0,.9), 0 0 14px rgba(255,160,60,.5); }
  .title { font-size: clamp(54px, 16.5vw, 116px); font-weight: 900; line-height: .86; letter-spacing: 1px; font-style: italic; transform: skewX(-6deg);
    background: linear-gradient(180deg, #fffbe8 0%, #ffe08a 32%, #ffa42a 60%, #d8401a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #4a1604) drop-shadow(0 0 26px rgba(255,150,40,.55)); }
  .title span { display: block; background: linear-gradient(180deg, #ffffff 0%, #e4e8ff 28%, #a0a8ff 58%, #5a36d8 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #1a0a4a) drop-shadow(0 0 26px rgba(140,110,255,.6)); }
  .heroSel { display: flex; align-items: center; gap: 10px; }
  .heroSel canvas { width: 136px; height: 136px; }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,220,150,.7); background: rgba(255,200,120,.12); color: #ffe8c0; font-size: 18px; font-weight: 900; cursor: pointer; }
  .heroName { font-size: 18px; font-weight: 900; letter-spacing: 4px; color: #ffe08a; text-shadow: 0 2px 0 #3a1a04, 0 0 14px rgba(255,180,60,.6); min-height: 22px; }
  .heroName.lock { color: #a8a0c0; text-shadow: 0 2px 0 #000; }
  .heroDesc { font-size: 12px; color: #d8d0f0; letter-spacing: 1px; min-height: 15px; text-shadow: 0 1px 4px #000; }
  .stat { font-size: 14px; color: #fff; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,.8); } .stat b { color: #ffd84a; }
  .btn { border: 0; padding: 16px 58px; border-radius: 40px; font: inherit; font-size: 24px; font-weight: 900; letter-spacing: 5px; color: #fff; cursor: pointer; text-shadow: 0 2px 0 rgba(90,20,0,.6);
    background: linear-gradient(180deg, #ffd25a, #ff8a1a 52%, #d8401a); box-shadow: 0 0 0 3px #fff2c8 inset, 0 7px 0 #6a1a04, 0 14px 30px rgba(0,0,0,.5), 0 0 34px rgba(255,140,40,.35); animation: bob 1.4s ease-in-out infinite; }
  .btn.alt { padding: 10px 30px; font-size: 15px; letter-spacing: 3px; animation: none; background: linear-gradient(180deg, #8a7ab0, #463668); box-shadow: 0 0 0 2px rgba(255,255,255,.55) inset, 0 5px 0 #1a1030, 0 10px 20px rgba(0,0,0,.4); }
  @keyframes bob { 50% { transform: translateY(-4px) scale(1.03); } }
  .hint { font-size: 12px; color: #d8d0f0; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(60,10,20,.62), rgba(8,4,14,.94)); }
  #over h2 { font-size: clamp(44px, 12vw, 80px); font-weight: 900; font-style: italic; color: #ff6a4a; text-shadow: 0 4px 0 #4a0a04, 0 0 26px rgba(255,80,40,.7); }
  #overScore { font-size: 52px; font-weight: 900; color: #ffe8a8; text-shadow: 0 3px 0 #4a2004, 0 0 22px rgba(255,190,80,.7); line-height: 1; }
  #overScore small { display: block; font-size: 13px; letter-spacing: 5px; color: #d8c8f0; text-shadow: none; margin-bottom: 4px; }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #2a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; border-radius: 8px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,220,80,.8); animation: bob 1s ease-in-out infinite; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 24px; font-size: 14px; color: #d8d0ee; text-align: left; } .grid b { color: #fff; float: right; margin-left: 12px; }
  .row { display: flex; gap: 12px; align-items: center; }
  #pause { background: rgba(8,4,16,.72); }
  #pause h3 { font-size: 34px; font-weight: 900; letter-spacing: 8px; color: #ffe08a; text-shadow: 0 3px 0 #3a1a04; }
  #pauseBtn { position: fixed; z-index: 8; top: calc(env(safe-area-inset-top) + 10px); right: max(10px, env(safe-area-inset-right)); width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(255,230,180,.6); background: rgba(16,10,28,.62); color: #ffe8c0; font: 900 13px sans-serif; cursor: pointer; }
  #pauseBtn.hidden { display: none; }
  #cards { background: radial-gradient(ellipse at 50% 42%, rgba(40,22,70,.78), rgba(5,3,10,.93)); gap: 8px; }
  .cardsTitle { font-size: clamp(34px, 9.5vw, 56px); font-weight: 900; font-style: italic; letter-spacing: 1px; background: linear-gradient(180deg, #ffffff, #ffe08a 45%, #ff9a2a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #5a2a04) drop-shadow(0 0 18px rgba(255,180,60,.6)); }
  .cardsSub { font-size: 13px; letter-spacing: 4px; color: #d8d0f0; font-weight: 800; margin-bottom: 8px; }
  .cardRow { display: flex; gap: 10px; justify-content: center; perspective: 800px; }
  .card { --rc: #5ab8ff; --rg: rgba(90,184,255,.5); width: min(30vw, 172px); min-height: 226px; border-radius: 16px; padding: 12px 8px 10px; position: relative;
    background: linear-gradient(180deg, #2c2546 0%, #17122a 70%, #120e20 100%); border: 3px solid var(--rc);
    box-shadow: 0 0 0 2px rgba(0,0,0,.7), 0 0 24px var(--rg), inset 0 0 26px rgba(255,255,255,.05), inset 0 2px 0 rgba(255,255,255,.18);
    display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; animation: cardIn .5s cubic-bezier(.2,1.3,.4,1) backwards; transition: transform .15s; }
  .card:nth-child(2) { animation-delay: .08s; } .card:nth-child(3) { animation-delay: .16s; }
  .card:hover, .card:active { transform: translateY(-6px) scale(1.05); }
  .card svg { width: 74%; height: auto; filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  .card .rr { font-size: 9px; letter-spacing: 3px; color: var(--rc); font-weight: 900; }
  .card .nm { font-weight: 900; font-size: 15px; letter-spacing: .5px; line-height: 1.1; text-shadow: 0 2px 0 #000; }
  .card .ds { font-size: 11.5px; color: #cfc8e8; line-height: 1.25; }
  .card .lv { position: absolute; top: 6px; right: 8px; font-size: 10px; font-weight: 900; color: #ffe08a; }
  .card .key { position: absolute; top: 6px; left: 9px; font-size: 10px; font-weight: 900; color: rgba(255,255,255,.35); }
  @keyframes cardIn { from { transform: translateY(46px) rotateY(80deg) scale(.8); opacity: 0; } }
  @media (max-height: 520px) {
    .overlay { gap: 5px; padding: 8px 16px; }
    .title { font-size: 46px; } .tag { font-size: 10px; letter-spacing: 4px; }
    .heroSel canvas { width: 76px; height: 76px; } .arrow { width: 34px; height: 34px; font-size: 14px; }
    .heroName { font-size: 14px; min-height: 16px; } .heroDesc { font-size: 11px; }
    .btn { padding: 9px 40px; font-size: 19px; } .hint { display: none; } .stat { font-size: 12px; }
    #over h2 { font-size: 36px; } #overScore { font-size: 34px; } .grid { font-size: 12px; gap: 2px 18px; } #newBest { font-size: 12px; padding: 3px 10px; }
    .cardsTitle { font-size: 30px; } .cardsSub { margin-bottom: 2px; font-size: 11px; }
    .card { min-height: 0; width: 150px; padding: 8px 6px; gap: 3px; } .card svg { width: 44%; } .card .ds { font-size: 10.5px; }
  }
  @media (max-width: 420px) { .tag { letter-spacing: 3px; font-size: 11px; } .stat { font-size: 12.5px; } .hint { font-size: 11px; } }
  @media (max-width: 370px) { .card .ds { font-size: 10.5px; } .card .nm { font-size: 13.5px; } .btn { padding: 14px 44px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button id="pauseBtn" class="hidden" aria-label="Pause">II</button>
<div class="overlay" id="menu">
  <div class="tag">⚔ ENDLESS DUNGEON CRAWLER ⚔</div>
  <div class="title">DUNGEON<span>BLADE</span></div>
  <div class="heroSel"><button class="arrow" id="prevHero">◀</button><canvas id="heroPrev" width="272" height="272"></canvas><button class="arrow" id="nextHero">▶</button></div>
  <div class="heroName" id="heroName"></div>
  <div class="heroDesc" id="heroDesc"></div>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">ENTER</button>
  <div class="hint">Move to dodge · stand still to shoot · Space roll · E skill</div>
</div>
<div class="overlay hidden" id="cards"><div class="cardsTitle" id="cardsTitle">LEVEL UP!</div><div class="cardsSub" id="cardsSub">CHOOSE A SKILL</div><div class="cardRow" id="cardRow"></div></div>
<div class="overlay hidden" id="over">
  <h2 id="overTitle">YOU FELL</h2>
  <div id="overScore"><small>ROOM REACHED</small>0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <div class="row"><button class="btn alt" id="menuBtn">MENU</button><button class="btn" id="againBtn">RETRY</button></div>
  <div class="hint" id="unlockMsg"></div>
</div>
<div class="overlay hidden" id="pause"><h3>PAUSED</h3><div class="hint">tap to continue</div><button class="btn alt" id="quitBtn">QUIT RUN</button></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  addEventListener('keydown', e => {
    if (!$('menu').classList.contains('hidden') && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); start(); return; }
    if (!$('menu').classList.contains('hidden') && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) { (e.code === 'ArrowLeft' ? $('prevHero') : $('nextHero')).onclick(); return; }
    if (!$('over').classList.contains('hidden') && e.code === 'Enter') { start(); return; }
    if (G && G.cards && /^Digit[1-3]$/.test(e.code)) { const i = +e.code.slice(5) - 1; if (G.cardIds[i]) pickCard(G.cardIds[i]); return; }
    if (e.code === 'Escape' || e.code === 'KeyP') { if (paused) resume(); else pause(); return; }
    if (paused && e.code !== 'Escape') resume();
  });

  // ---------- test hook ----------
  window.__db = {
    G: () => G, P: () => P, start, spr: () => SPR, enemies: () => enemies, bullets: () => ebul.length, fps: () => fpsAvg,
    autopilot: v => { G.autopilot = v; }, god: v => { G.god = v; },
    room: n => { G.trans = null; G.cards = false; $('cards').classList.add('hidden'); enterRoom(n); },
    give: (id, k = 1) => { for (let i = 0; i < k; i++) applyAbility(id); }, levelUp: () => { addXP(xpNeed(P.lvl) - P.xp + .01); },
    pick: i => { if (G.cards) pickCard(G.cardIds[i || 0]); }, killAll: () => { for (const e of enemies.slice()) if (!e.dead) killEnemy(e); },
    hurt: d => { const g = G.god; G.god = false; P.inv = 0; hurtHero(d, null); G.god = g; }, special: () => { P.specCd = 0; castSpecial(); }, save: () => SAVE, theme: n => theme(n),
    state: () => ({ room: G.n, kind: G.room.kind, hp: Math.round(P.hp), max: Math.round(P.max), lvl: P.lvl, enemies: enemies.length, bullets: ebul.length, arrows: arrows.length, cleared: G.cleared, over: G.over, cards: G.cards, kills: G.kills, coins: G.coins, abilities: Object.assign({}, P.ab), boss: G.bossName, chapter: G.room.th.name, fps: Math.round(fpsAvg) })
  };

  // ---------- loop ----------
  resize();
  sprReady.then(() => { newRun(true); updateMenu(); ctl.setEnabled(false); setInterval(() => { if (!$('menu').classList.contains('hidden')) drawPreview(); }, 50); });
  (function loop(now) {
    const raw = Math.max(0, (now - last) / 1000), dt = Math.min(.05, raw); last = now;
    if (raw > 0 && raw < .5) fpsAvg = fpsAvg * .95 + (1 / raw) * .05;
    if (!paused) update(dt);
    render();
    requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
