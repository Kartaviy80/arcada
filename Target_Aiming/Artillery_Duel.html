<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a140c">
<title>Artillery Duel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a140c; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 22px 16px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  #menu { background: radial-gradient(ellipse at 50% 45%, rgba(20,14,6,.05), rgba(16,10,4,.45) 58%, rgba(8,5,2,.9) 100%); }
  .tag { font-size: 12px; letter-spacing: clamp(2px, 1.1vw, 6px); white-space: nowrap; font-weight: 800; color: #ffcf6a; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .title { font-size: clamp(54px, 15.5vw, 112px); font-weight: 900; line-height: .84; letter-spacing: 1px; font-style: italic; transform: skewX(-7deg);
    background: linear-gradient(180deg, #fffbe8 0%, #ffe28a 28%, #ff9e2a 58%, #b8320e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #3a1404) drop-shadow(0 0 24px rgba(255,130,30,.55)); }
  .title span { display: block; font-size: 1.06em; letter-spacing: 10px; background: linear-gradient(180deg, #ffffff 0%, #dfe6ee 36%, #8a96a4 60%, #343c48 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #0c1016) drop-shadow(0 0 20px rgba(150,190,255,.3)); }
  .stripe { width: min(300px, 70vw); height: 7px; border-radius: 4px; background: repeating-linear-gradient(-45deg, #ffb52a 0 10px, #17130c 10px 20px); box-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .tabs { display: flex; gap: 4px; padding: 3px; border-radius: 20px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,200,110,.35); }
  .tabs button { font: inherit; font-size: 12px; font-weight: 900; letter-spacing: 3px; padding: 7px 16px; border: 0; border-radius: 16px; background: transparent; color: #d8c8a0; cursor: pointer; }
  .tabs button.on { background: linear-gradient(180deg, #ffd25a, #e88a1a); color: #2a1404; box-shadow: 0 2px 8px rgba(255,150,40,.5); }
  .gear { display: flex; align-items: center; gap: 8px; }
  .gear canvas { width: 220px; height: 138px; }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,206,110,.75); background: rgba(34,26,14,.65); color: #ffd27a; font-size: 18px; font-weight: 900; cursor: pointer; }
  .gname { font-size: 19px; font-weight: 900; letter-spacing: 4px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.8); min-height: 22px; }
  .gdesc { font-size: 12px; color: #e8dcc0; max-width: 320px; text-shadow: 0 1px 3px #000; min-height: 15px; margin-top: -6px; }
  .gstats { display: flex; gap: 12px; font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #f0e8d4; text-shadow: 0 1px 2px #000; }
  .gstats b { display: inline-block; width: 44px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.5); margin-left: 4px; vertical-align: middle; position: relative; overflow: hidden; }
  .gstats b i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ffd04a, #ff6a2a); }
  .buy { border: 2px solid #ffc84a; background: rgba(50,34,10,.75); color: #ffe08a; font: inherit; font-size: 14px; font-weight: 900; padding: 6px 18px; border-radius: 20px; cursor: pointer; letter-spacing: 1px; }
  .buy.owned { border-color: #7ae86a; color: #b8ffa8; background: rgba(16,40,12,.7); }
  .stat { font-size: 13px; color: #f4ecd8; text-shadow: 0 1px 3px #000; } .stat b { color: #ffc84a; }
  .btn { border: 0; padding: 15px 56px; border-radius: 14px; font: inherit; font-size: 25px; font-weight: 900; letter-spacing: 6px; color: #fff; cursor: pointer; text-shadow: 0 2px 0 rgba(90,24,0,.7);
    background: linear-gradient(180deg, #ffb84a 0%, #f06a1a 52%, #b8320e 100%); box-shadow: 0 6px 0 #5a1806, 0 0 28px rgba(255,120,30,.55), inset 0 2px 0 rgba(255,240,200,.6); animation: pulse 1.6s ease-in-out infinite; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #5a1806; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #5a1806, 0 0 46px rgba(255,150,50,.9), inset 0 2px 0 rgba(255,240,200,.6); } }
  .hint { font-size: 12px; letter-spacing: .5px; color: #e8dcc4; max-width: 460px; text-shadow: 0 1px 3px #000; }
  .coins { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 14px; z-index: 11; font-size: 18px; font-weight: 900; color: #ffd84a; text-shadow: 0 2px 3px #000; }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(60,20,8,.72), rgba(10,6,3,.95)); }
  #over h2 { font-size: clamp(36px, 10vw, 72px); font-weight: 900; font-style: italic; letter-spacing: 2px; color: #ffb84a; text-shadow: 0 4px 0 #4a1404, 0 0 30px rgba(255,120,40,.6); }
  #overScore { font-size: 54px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(255,200,120,.6); }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #3a1004; background: linear-gradient(90deg, #ffe84a, #ff9a2a); padding: 5px 16px; border-radius: 4px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,200,80,.8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; font-size: 14px; color: #e8dcc8; text-align: left; } .grid b { color: #fff; float: right; margin-left: 12px; }
  #pause { background: rgba(10,6,3,.72); font-size: 34px; font-weight: 900; letter-spacing: 8px; color: #ffc84a; }
  @media (max-height: 700px) and (min-height: 521px) { .title { font-size: 50px; } .gear canvas { width: 176px; height: 110px; } .overlay { gap: 7px; } .btn { padding: 12px 48px; font-size: 22px; } }
  @media (max-height: 520px) {
    .overlay { gap: 4px; padding: 6px 16px; } .title { font-size: 34px; } .title span { display: inline; margin-left: 12px; font-size: 1em; letter-spacing: 4px; } .tag { font-size: 9px; letter-spacing: 4px; }
    .stripe, .gdesc, .hint { display: none; } .tabs button { padding: 4px 12px; font-size: 10px; } .gear canvas { width: 120px; height: 75px; } .arrow { width: 34px; height: 34px; font-size: 14px; }
    .gname { font-size: 15px; min-height: 18px; } .buy { font-size: 12px; padding: 4px 14px; } .stat { font-size: 11px; } .btn { padding: 8px 40px; font-size: 19px; }
    #over h2 { font-size: 32px; } #overScore { font-size: 32px; } .grid { font-size: 12px; gap: 2px 18px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="coins" id="coinsTop"></div>
<div class="overlay" id="menu">
  <div class="tag">★ TURN-BASED TANK WARFARE ★</div>
  <div class="title">ARTILLERY<span>DUEL</span></div>
  <div class="stripe"></div>
  <div class="tabs"><button id="tabTank" class="on">GARAGE</button><button id="tabWpn">ARSENAL</button></div>
  <div class="gear"><button class="arrow" id="prevG" aria-label="Previous">◀</button><canvas id="gearPrev" width="352" height="220"></canvas><button class="arrow" id="nextG" aria-label="Next">▶</button></div>
  <div class="gname" id="gName"></div>
  <div class="gdesc" id="gDesc"></div>
  <div class="gstats" id="gStats"></div>
  <button class="buy" id="buyBtn"></button>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">DEPLOY</button>
  <div class="hint">Drag back from your tank to aim, release to fire · ◀ ▶ to drive · tap the weapon to switch · mind the wind</div>
</div>
<div class="overlay hidden" id="over">
  <h2>TANK DESTROYED</h2>
  <div id="overScore">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <button class="btn" id="againBtn">REMATCH</button>
  <div class="hint" id="coinMsg"></div>
</div>
<div class="overlay hidden" id="pause">PAUSED<div class="hint">tap to continue</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {

  const KEYS = {};
  addEventListener('keydown', e => {

  addEventListener('keyup', e => { KEYS[e.code] = 0; if (!G) return; if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') G.keyA = 0; if (e.code === 'ArrowUp' || e.code === 'ArrowDown') G.keyP = 0; if (e.code === 'KeyA' || e.code === 'KeyD') G.move = 0; });

      if (!own) { g.font = '900 30px ' + AV; g.textAlign = 'center'; g.fillStyle = 'rgba(255,255,255,.85)'; g.fillText('🔒', 300, 40); }
