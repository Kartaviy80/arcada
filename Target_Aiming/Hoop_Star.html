<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140a26">
<title>Hoop Star</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #140a26; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .sport { font-family: "Arial Black", "Avenir Next", "Trebuchet MS", sans-serif; font-weight: 900; font-style: italic; }
  #menu { justify-content: space-between; padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(14,6,30,.88) 0%, rgba(14,6,30,.42) 24%, rgba(14,6,30,0) 40%, rgba(14,6,30,.15) 52%, rgba(14,6,30,.9) 78%, rgba(14,6,30,.96) 100%); }
  .top { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; padding-top: 30px; }
  .coinpill { position: absolute; top: 0; right: 0; display: flex; align-items: center; gap: 7px; padding: 5px 12px 5px 6px; border-radius: 30px;
    background: linear-gradient(180deg, rgba(60,30,90,.85), rgba(30,14,50,.85)); border: 1px solid rgba(255,210,90,.45); font-weight: 900; font-size: 16px; color: #ffe08a; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .coin { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c0, #ffd23a 40%, #c88a0a 75%, #7a4a04); box-shadow: inset 0 0 0 2px rgba(120,70,0,.5); display: inline-block; }
  .bestpill { position: absolute; top: 0; left: 0; padding: 6px 12px; border-radius: 30px; font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #e8dcff;
    background: rgba(30,14,50,.7); border: 1px solid rgba(255,255,255,.14); }
  .bestpill b { color: #ffd24a; }
  .title { font-size: clamp(58px, 17vw, 112px); line-height: .84; letter-spacing: 1px; transform: skewX(-9deg) rotate(-4deg); padding: 0 .1em;
    background: linear-gradient(180deg, #fff8dc 0%, #ffd84a 30%, #ff8a1a 58%, #d23a0a 82%, #8a1a04 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #3a0c02) drop-shadow(0 0 30px rgba(255,130,30,.55)); }
  .title span { display: block; font-size: .78em; margin-left: .9em; background: linear-gradient(180deg, #ffffff 0%, #bff6ff 35%, #3ad8ff 65%, #1a6ad8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { font-size: 11px; letter-spacing: .55em; color: #ffd8a8; font-weight: 800; margin-top: 8px; text-shadow: 0 2px 6px #000; }
  .bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 430px; }
  .shop { width: 100%; background: linear-gradient(180deg, rgba(48,24,92,.82), rgba(18,10,42,.9)); border: 1px solid rgba(255,190,110,.32); border-radius: 18px;
    padding: 10px 12px 12px; box-shadow: 0 14px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14); }
  .tabs { display: flex; gap: 6px; }
  .tab { flex: 1; padding: 7px 0; border-radius: 10px; border: none; background: rgba(255,255,255,.07); color: #c8b8e8; font-weight: 900; letter-spacing: 3px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .tab.on { background: linear-gradient(180deg, #ffbe5a, #ff6a1a); color: #2a0e02; box-shadow: 0 3px 12px rgba(255,120,30,.45); }
  .item { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .prevbox { position: relative; width: 112px; height: 112px; flex: none; border-radius: 16px; background: radial-gradient(circle at 50% 42%, rgba(255,170,80,.28), rgba(40,20,80,.0) 70%); }
  #itemPrev { width: 112px; height: 112px; display: block; }
  .info { flex: 1; text-align: left; min-width: 0; }
  .iname { font-size: 19px; letter-spacing: .5px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.5); line-height: 1.02; overflow-wrap: anywhere; }
  .istat { font-size: 12px; color: #d8c8f0; margin: 3px 0 7px; line-height: 1.3; min-height: 2.6em; }
  .buy { border: none; border-radius: 10px; padding: 8px 14px; font-weight: 900; font-size: 13px; letter-spacing: 1.5px; cursor: pointer; font-family: inherit;
    background: linear-gradient(180deg, #7affb0, #1ab86a); color: #04301a; box-shadow: 0 3px 0 #0a5a30; display: inline-flex; align-items: center; gap: 6px; }
  .buy .coin { width: 16px; height: 16px; }
  .buy.eq { background: rgba(255,255,255,.12); color: #e8dcff; box-shadow: none; }
  .buy.use { background: linear-gradient(180deg, #8ad8ff, #2a8ae8); color: #021a3a; box-shadow: 0 3px 0 #0a3a7a; }
  .buy.no { background: rgba(255,80,80,.18); color: #ffb0b0; box-shadow: none; cursor: default; }
  .arrow { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1px solid rgba(255,200,120,.5); background: rgba(255,255,255,.06); color: #ffd8a0; font-size: 14px; font-weight: 900; cursor: pointer; }
  .dots { display: flex; gap: 5px; justify-content: center; margin-top: 8px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .dots i.own { background: rgba(255,255,255,.5); } .dots i.on { background: #ffb04a; box-shadow: 0 0 6px #ff8a1a; }
  .btn { border: none; padding: 14px 70px; border-radius: 40px; font-size: 28px; letter-spacing: 4px; color: #2a0a00; cursor: pointer;
    background: linear-gradient(180deg, #fff0a0 0%, #ffbe3a 35%, #ff7a1a 75%, #e8500a 100%); box-shadow: 0 6px 0 #8a2a04, 0 0 30px rgba(255,140,40,.5), inset 0 2px 0 rgba(255,255,255,.6);
    text-shadow: 0 1px 0 rgba(255,255,255,.5); animation: pulse 1.6s ease-in-out infinite; }
  .btn { white-space: nowrap; } #againBtn { padding: 14px 40px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8a2a04; }
  .btn2 { border: 2px solid rgba(255,200,140,.6); padding: 11px 26px; border-radius: 40px; font-size: 18px; letter-spacing: 3px; color: #ffe0b8; cursor: pointer; background: rgba(40,20,70,.6); }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #8a2a04, 0 0 52px rgba(255,170,60,.85), inset 0 2px 0 rgba(255,255,255,.6); } }
  .hint { font-size: 12px; letter-spacing: .5px; color: #d8c8f0; max-width: min(520px, calc(100vw - 120px)); text-shadow: 0 1px 2px #000; opacity: .85; }
  #over { background: radial-gradient(ellipse at 50% 38%, rgba(70,24,90,.82), rgba(10,4,22,.96)); gap: 10px; }
  #over h2 { font-size: clamp(42px, 12vw, 84px); line-height: .9; transform: skewX(-8deg) rotate(-3deg);
    background: linear-gradient(180deg, #fff 0%, #ffd84a 40%, #ff5a1a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #3a0a02) drop-shadow(0 0 26px rgba(255,100,30,.5)); }
  #overScore { font-size: 58px; color: #fff; text-shadow: 0 0 24px rgba(255,180,80,.7), 0 4px 0 rgba(0,0,0,.4); }
  #newBest { font-size: 17px; font-weight: 900; letter-spacing: 4px; color: #2a0a00; background: linear-gradient(90deg, #fff07a, #ffb02a, #fff07a); background-size: 200% 100%; padding: 6px 18px; border-radius: 8px;
    transform: rotate(-3deg); box-shadow: 0 0 26px rgba(255,210,80,.85); animation: shine 1.2s linear infinite, pop .5s cubic-bezier(.2,2,.4,1) both; }
  @keyframes shine { to { background-position: -200% 0; } }
  @keyframes pop { from { transform: rotate(-3deg) scale(0); } }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 26px; font-size: 14px; color: #d8c8f0; text-align: left; padding: 12px 18px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); }
  .grid b { color: #fff; float: right; margin-left: 14px; }
  #overCoins { font-size: 18px; font-weight: 900; color: #ffe08a; display: flex; align-items: center; gap: 8px; }
  .brow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #pause { background: rgba(14,6,30,.72); font-size: 40px; letter-spacing: 6px; color: #ffd24a; }
  @media (max-height: 700px) and (min-height: 521px) { .title { font-size: 60px; } .top { padding-top: 34px; } .prevbox, #itemPrev { width: 92px; height: 92px; } .btn { padding: 11px 60px; font-size: 24px; } .bottom { gap: 9px; } }
  @media (max-height: 520px) {
    #menu { flex-direction: row; align-items: center; justify-content: center; gap: 28px; padding: 10px 70px 10px 20px; }
    .top { width: auto; padding-top: 0; flex: 1; max-width: 340px; } .coinpill { position: fixed; top: 10px; right: 14px; } .bestpill { position: static; margin-top: 10px; }
    .title { font-size: 54px; } .tag { font-size: 9px; } .bottom { max-width: 360px; gap: 8px; }
    .shop { padding: 7px 10px 9px; } .prevbox, #itemPrev { width: 74px; height: 74px; } .istat { min-height: 0; font-size: 11px; margin: 2px 0 5px; } .iname { font-size: 16px; }
    .btn { padding: 9px 50px; font-size: 22px; } .hint { display: none; } .dots { margin-top: 5px; }
    #over { gap: 5px; padding: 8px; } #over h2 { font-size: 38px; } #overScore { font-size: 34px; } .grid { font-size: 12px; gap: 3px 18px; padding: 7px 14px; } #newBest { font-size: 13px; padding: 3px 12px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="overlay" id="menu">
  <div class="top">
    <div class="bestpill" id="bestMenu">BEST <b>0</b></div>
    <div class="coinpill"><i class="coin"></i><span id="menuCoins">0</span></div>
    <div class="title sport">HOOP<span>STAR</span></div>
    <div class="tag">FLICK · SWISH · CATCH FIRE</div>
  </div>
  <div class="bottom">
    <div class="shop">
      <div class="tabs"><button class="tab on" id="tabBalls">BALLS</button><button class="tab" id="tabHoops">HOOPS</button></div>
      <div class="item">
        <button class="arrow" id="prevItem" aria-label="previous">◀</button>
        <div class="prevbox"><canvas id="itemPrev" width="224" height="224"></canvas></div>
        <div class="info"><div class="iname sport" id="itemName">CLASSIC</div><div class="istat" id="itemStat"></div><button class="buy" id="buyBtn">EQUIPPED</button></div>
        <button class="arrow" id="nextItem" aria-label="next">▶</button>
      </div>
      <div class="dots" id="itemDots"></div>
    </div>
    <button class="btn sport" id="startBtn">PLAY</button>
    <div class="hint">Swipe up to shoot · longer swipe = more power · swishes, banks &amp; streaks set you ON FIRE</div>
  </div>
</div>
<div class="overlay hidden" id="over">
  <h2 class="sport" id="overTitle">FINAL BUZZER</h2>
  <div id="overScore" class="sport">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <div id="overCoins"><i class="coin"></i><span id="overCoinsN">+0</span></div>
  <div class="brow"><button class="btn sport" id="againBtn">PLAY AGAIN</button><button class="btn2 sport" id="menuBtn">MENU</button></div>
</div>
<div class="overlay hidden sport" id="pause">PAUSED<div class="hint">tap to continue</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {

    if (G.zoom > 1.002) { ctx.translate(G.zx, G.zy); ctx.scale(G.zoom, G.zoom); ctx.translate(-G.zx, -G.zy); }
    ctx.translate(ox, oy);
    renderWorld();
    ctx.restore();
    const cine = clamp((G.zoom - 1) / .26, 0, 1); if (cine > .01) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H * .07 * cine); ctx.fillRect(0, H - H * .07 * cine, W, H * .07 * cine); }
    let t0 = performance.now();
    ctx.drawImage(VIG, 0, 0, W, H);
    FX.drawFlash(ctx, W, H);
    pt('vig', t0); t0 = performance.now();
    if (!G.attract) { drawHUD(); drawTut(); drawBanner(); }
    pt('hud', t0);
    drawCoinsFly();
    if (G.trans) { ctx.globalAlpha = clamp(G.trans < 1 ? G.trans : 2 - G.trans, 0, 1); ctx.fillStyle = '#0a0414'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  }

  // ---------- menu: shop with ball and hoop skins ----------
  let shopTab = 'balls', shopIdx = SAVE.ball;
  const PREV_R = ident(); rotateM(PREV_R, 1, 0, 0, -.5);
  const PREV_C = mk(176, 176);
  const shopList = () => shopTab === 'balls' ? BALLS : HOOPS;
  const ownedList = () => shopTab === 'balls' ? SAVE.balls : SAVE.hoops;
  const isEquipped = i => shopTab === 'balls' ? SAVE.ball === i : SAVE.hoop === i;
  function updateMenu() {
    $('menuCoins').textContent = fmt(SAVE.coins);
    $('bestMenu').innerHTML = SAVE.best ? 'BEST <b>' + fmt(SAVE.best) + '</b> · STAGE <b>' + SAVE.bestStage + '</b>' : 'NEW PLAYER';
    $('tabBalls').className = 'tab' + (shopTab === 'balls' ? ' on' : ''); $('tabHoops').className = 'tab' + (shopTab === 'hoops' ? ' on' : '');
    const L = shopList(), it = L[shopIdx], own = ownedList().includes(shopIdx), btn = $('buyBtn');
    $('itemName').textContent = it.name;
    $('itemStat').textContent = it.desc;
    if (isEquipped(shopIdx)) { btn.className = 'buy eq'; btn.innerHTML = 'EQUIPPED'; }
    else if (own) { btn.className = 'buy use'; btn.innerHTML = 'EQUIP'; }
    else { btn.className = 'buy' + (SAVE.coins >= it.price ? '' : ' no'); btn.innerHTML = '<i class="coin"></i>' + fmt(it.price); }
    $('itemDots').innerHTML = L.map((_, i) => '<i class="' + (i === shopIdx ? 'on' : ownedList().includes(i) ? 'own' : '') + '"></i>').join('');
    if (shopTab === 'hoops') drawHoopPreview(HOOPS[shopIdx], !own);
  }
  function drawHoopPreview(hs, locked) {
    const c = $('itemPrev'), g = c.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 224, 224);
    if (locked) g.globalAlpha = .55;
    const L = 26, T = 22, Wd = 172, Ht = 102;
    if (hs.paint) { g.fillStyle = hs.paint; g.beginPath(); g.moveTo(50, 222); g.lineTo(174, 222); g.lineTo(152, 186); g.lineTo(72, 186); g.closePath(); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke(); }
    g.fillStyle = POLE[hs.board === 'steel' ? 1 : 4]; g.fillRect(104, T + Ht, 16, 70);
    if (hs.board === 'steel') { g.fillStyle = '#ecece4'; g.fillRect(L, T, Wd, Ht); g.strokeStyle = '#1a1a1e'; g.lineWidth = 5; g.strokeRect(L, T, Wd, Ht); g.strokeStyle = '#e8501a'; g.lineWidth = 4; g.strokeRect(84, 60, 56, 42); }
    else if (hs.board === 'neon') { g.fillStyle = '#12061e'; g.fillRect(L, T, Wd, Ht); g.shadowColor = '#3af8ff'; g.shadowBlur = 14; g.strokeStyle = '#8afcff'; g.lineWidth = 4; g.strokeRect(L, T, Wd, Ht); g.shadowColor = hs.rim; g.strokeStyle = '#ffb8fa'; g.strokeRect(84, 60, 56, 42); g.shadowBlur = 0; }
    else { const gr = g.createLinearGradient(L, T, L + Wd, T + Ht); gr.addColorStop(0, 'rgba(230,245,255,.5)'); gr.addColorStop(1, 'rgba(160,200,240,.18)'); g.fillStyle = gr; g.fillRect(L, T, Wd, Ht); g.strokeStyle = hs.board === 'gold' ? '#ffcc3a' : '#f4f6fa'; g.lineWidth = 6; g.strokeRect(L, T, Wd, Ht); g.lineWidth = 4; g.strokeRect(84, 60, 56, 42); }
    const cx = 112, cy = 112, rx = 44, ry = 11, nb = 62, cols = hs.net === 'tri' ? ['#e8202a', '#ffffff', '#2a4ae8'] : [hs.net];
    g.lineWidth = 6; g.strokeStyle = shade(hs.rim, -.3); g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, Math.PI, TAU); g.stroke();
    const NL = 5, NI = 9, pt = (lv, i) => { const k = lv / NL, w = rx * (1 - k * .42), t = i / (NI - 1); return [cx - w + t * 2 * w, cy + Math.sin(t * Math.PI) * ry * (1 - k) * .9 + k * nb]; };
    g.lineWidth = hs.chain ? 2.6 : 1.8; g.lineCap = 'round';
    for (let lv = 0; lv < NL; lv++) { g.strokeStyle = cols[lv % cols.length]; g.beginPath(); for (let i = 0; i < NI; i++) { const a = pt(lv, i); if (i < NI - 1) { const b = pt(lv + 1, i + 1); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); } if (i > 0) { const b = pt(lv + 1, i - 1); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); } } g.stroke(); }
    if (hs.glow) { g.shadowColor = hs.rim; g.shadowBlur = 16; }
    g.lineWidth = 7; g.strokeStyle = hs.rim; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI); g.stroke(); g.shadowBlur = 0;
    g.lineWidth = 2; g.strokeStyle = shade(hs.rim, .5); g.beginPath(); g.ellipse(cx, cy - 2, rx - 2, ry - 2, 0, .2, Math.PI - .2); g.stroke();
    g.globalAlpha = 1; if (locked) { g.font = '900 30px sans-serif'; g.textAlign = 'center'; g.fillText('🔒', 112, 190); }
  }
  function drawMenuPreview(dt) {
    if (shopTab !== 'balls') return;
    const c = $('itemPrev'), g = c.getContext('2d'), it = BALLS[shopIdx], locked = !SAVE.balls.includes(shopIdx);
    rotateM(PREV_R, 0, 1, 0, dt * 1.1); rotateM(PREV_R, 1, 0, 0, dt * .35); if (frameId % 60 === 0) orthoM(PREV_R);
    renderBall(PREV_C, PREV_R, it);
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 224, 224);
    const bob = Math.sin(performance.now() / 400) * 5;
    g.globalAlpha = .45; g.drawImage(SHADOW, 52, 186, 120, 26); g.globalAlpha = 1;
    if (it.glow) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = .55; g.drawImage(glow(it.glow), 6, 6 + bob, 212, 212); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
    if (locked) g.filter = 'grayscale(.7) brightness(.7)';
    g.drawImage(PREV_C, 24, 24 + bob, 176, 176); g.filter = 'none';
    if (locked) { g.font = '900 34px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🔒', 112, 112 + bob); }
  }
  $('tabBalls').onclick = () => { shopTab = 'balls'; shopIdx = SAVE.ball; updateMenu(); sfx(660, .05, 'square', .03); };
  $('tabHoops').onclick = () => { shopTab = 'hoops'; shopIdx = SAVE.hoop; updateMenu(); sfx(660, .05, 'square', .03); };
  $('prevItem').onclick = () => { shopIdx = (shopIdx + shopList().length - 1) % shopList().length; updateMenu(); };
  $('nextItem').onclick = () => { shopIdx = (shopIdx + 1) % shopList().length; updateMenu(); };
  $('buyBtn').onclick = () => {
    const it = shopList()[shopIdx], own = ownedList().includes(shopIdx);
    if (!own) { if (SAVE.coins < it.price) { $('buyBtn').animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 220 }); return; } SAVE.coins -= it.price; ownedList().push(shopIdx); if (audioOn) { audio.sfx(880, .1, 'square', .04, 1320); setTimeout(() => audio.sfx(1320, .2, 'square', .04, 1760), 100); } }
    if (shopTab === 'balls') SAVE.ball = shopIdx; else { SAVE.hoop = shopIdx; if (G) buildBG(); }
    saveNow(); updateMenu();
    if (G && G.attract) { if (G.held) { G.held.skin = skinB(); G.held.cv = {}; } }
  };

  // ---------- run start / game over / pause ----------
  function start() {
    audio.start(); audioOn = true;
    $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('pause').classList.add('hidden');
    paused = false; FX.clear(); newRun(false);
  }
  function showMenu() { $('over').classList.add('hidden'); $('pause').classList.add('hidden'); paused = false; newRun(true); updateMenu(); $('menu').classList.remove('hidden'); }
  $('startBtn').onclick = start; $('againBtn').onclick = start; $('menuBtn').onclick = showMenu;
  function gameOver() {
    G.over = true;
    const sc = G.score, prev = SAVE.best, nb = sc > prev;
    if (nb) SAVE.best = sc; SAVE.bestStage = Math.max(SAVE.bestStage, G.stage); SAVE.makes += G.makes; SAVE.swishes += G.swishes; SAVE.games++; saveNow();
    $('overTitle').textContent = nb ? 'RECORD NIGHT' : 'FINAL BUZZER';
    $('overScore').textContent = fmt(sc); $('newBest').style.display = nb ? 'block' : 'none';
    const acc = G.shots ? Math.round(G.makes / G.shots * 100) : 0;
    $('overStats').innerHTML = [['Stage', G.stage], ['Baskets', G.makes], ['Accuracy', acc + '%'], ['Swishes', G.swishes], ['Best streak', G.bestStreak], ['3-pointers', G.threes]].map(([a, b]) => '<div>' + a + '<b>' + b + '</b></div>').join('');
    $('overCoinsN').textContent = '+' + fmt(G.coinsRun) + ' coins  ·  bank ' + fmt(SAVE.coins);
    $('over').classList.remove('hidden'); updateMenu();
    if (nb) { audio.sfx(784, .15, 'square', .05); setTimeout(() => audio.sfx(1046, .15, 'square', .05), 140); setTimeout(() => audio.sfx(1318, .3, 'square', .05), 280); for (let i = 0; i < 5; i++) setTimeout(() => FX.burst(rnd(0, W), -10, { n: 30, colors: ['#ffd24a', '#ff3a6a', '#3ad8ff', '#ffffff'], shape: 'square', speed: 240, size: 9, gravity: 380, life: 2.4, dir: Math.PI / 2, spread: 1.5 }), i * 160); }
  }
  function pause() { if (!G || G.attract || G.over || paused || $('menu').classList.contains('hidden') === false) return; paused = true; $('pause').classList.remove('hidden'); PTR.id = null; G.aim = null; }
  function resume() { if (!paused) return; paused = false; $('pause').classList.add('hidden'); last = performance.now(); }
  $('pause').addEventListener('pointerdown', e => { e.preventDefault(); resume(); });
  addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  addEventListener('blur', () => pause());
  addEventListener('keydown', e => {
    if (e.code === 'Enter' && !$('menu').classList.contains('hidden')) start();
    else if (e.code === 'Enter' && !$('over').classList.contains('hidden')) start();
    else if (e.code === 'Escape' || e.code === 'KeyP') { if (paused) resume(); else pause(); }
    else if (paused) resume();
  });

  // ---------- boot ----------
  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const cs = getComputedStyle($('safe')); SAFE_T = parseFloat(cs.paddingTop) || 0; SAFE_B = parseFloat(cs.paddingBottom) || 0;
    layout();
    VIG = mk(Math.max(2, Math.ceil(W / 2)), Math.max(2, Math.ceil(H / 2))); const g = VIG.getContext('2d'), r = Math.hypot(VIG.width, VIG.height) / 2, gr = g.createRadialGradient(VIG.width / 2, VIG.height * .45, r * .45, VIG.width / 2, VIG.height / 2, r);
    gr.addColorStop(0, 'rgba(10,4,24,0)'); gr.addColorStop(1, 'rgba(10,4,24,.62)'); g.fillStyle = gr; g.fillRect(0, 0, VIG.width, VIG.height);
    if (G) buildBG();
  }
  addEventListener('resize', resize); resize();
  let fpsN = 0, fpsT = 0, fpsVal = 60;
  window.__hs = {
    G: () => G, ST: () => ST, SAVE: () => JSON.parse(JSON.stringify(SAVE)), start, menu: showMenu,
    autopilot: v => { G.autopilot = v; G.botShot = null; G.botT = 0; },
    setStage: n => { G.trans = 0; G.transDone = false; G.over = false; if (G.lives <= 0) G.lives = 3; FX.clear(); nextStage(n); },
    coins: n => { SAVE.coins += n; if (G) G.coinShown = SAVE.coins; saveNow(); updateMenu(); },
    unlockAll: () => { SAVE.balls = BALLS.map((_, i) => i); SAVE.hoops = HOOPS.map((_, i) => i); saveNow(); updateMenu(); },
    equip: (b, h) => { if (b != null) SAVE.ball = b; if (h != null) SAVE.hoop = h; saveNow(); if (G) buildBG(); updateMenu(); },
    shoot: (power, yawDeg, curve) => shoot(power, (yawDeg || 0) * Math.PI / 180, true, curve || 0), star: () => ST.star,
    solve: () => aimFor(0, 0, 0, ST.wind, G.T, true),
    lives: n => { G.lives = n; }, fire: n => { G.streak = n; G.fire = n >= skinB().fireAt * 2 ? 2 : n >= skinB().fireAt ? 1 : 0; },
    kill: () => { G.lives = 1; loseLife(); },
    ballXY: () => ({ x: CX, y: BALL_SY, drag: DRAG }), fps: () => fpsVal, slow: () => G.slowT,
    pause, resume, paused: () => paused, prof: () => Object.fromEntries(Object.entries(PROF).map(([k, v]) => [k, +v.toFixed(2)]))
  };
  newRun(true); updateMenu();
  (function loop(now) {
    const rdt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    let t0 = performance.now();
    if (!paused && G) { update(rdt); FX.update(rdt * Math.max(.35, G.ts)); }
    pt('update', t0); t0 = performance.now();
    render();
    pt('render', t0); t0 = performance.now();
    if (!$('menu').classList.contains('hidden')) drawMenuPreview(rdt);
    pt('menu', t0);
    fpsN++; fpsT += rdt; if (fpsT >= 1) { fpsVal = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
    requestAnimationFrame(loop);
  })(last);
})();
</script>
