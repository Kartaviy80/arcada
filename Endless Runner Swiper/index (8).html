<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2350">
<title>Rooftop Fox</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #2b2350;
    font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
    color: #fff;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 18px 0;
    pointer-events: none;
  }
  .pill {
    background: #ffffff22; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-radius: 999px; padding: 6px 16px;
    font-weight: 700; font-size: 18px;
  }
  .pill.stars { color: #ffe27a; }
  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center;
    background: linear-gradient(#2b235099, #1a1433dd);
    transition: opacity .35s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card {
    background: #fff; color: #3a2f63;
    border-radius: 28px; padding: 30px 28px 26px;
    width: min(360px, 100%);
    box-shadow: 0 18px 0 #00000022, 0 30px 60px #0006;
    display: flex; flex-direction: column; gap: 14px; align-items: center;
  }
  .card h1 { font-size: 40px; line-height: 1; color: #ff7b54; letter-spacing: -1px; }
  .card h1 span { color: #3a2f63; }
  .card p { font-size: 15px; line-height: 1.5; color: #6a5f93; }
  .fox { font-size: 54px; line-height: 1; }
  .row { display: flex; gap: 10px; width: 100%; }
  .stat { flex: 1; background: #f3f0ff; border-radius: 16px; padding: 10px 6px; }
  .stat small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #9a90c4; }
  .stat b { font-size: 24px; }
  .btn {
    border: none; cursor: pointer; width: 100%;
    padding: 16px; border-radius: 18px;
    font-family: inherit; font-weight: 800; font-size: 20px;
    color: #fff; background: #ff7b54;
    box-shadow: 0 6px 0 #d4502c;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d4502c; }
  .hint { font-size: 12px; color: #9a90c4; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="pill" id="score">0</div>
  <div class="pill stars" id="stars">★ 0</div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <div class="fox">🦊</div>
    <h1>Rooftop <span>Fox</span></h1>
    <p><b>Tap</b> or <b>swipe up</b> to jump — tap again in the air for a double jump.<br><b>Swipe down</b> to slide under crows and dive faster.</p>
    <div class="row">
      <div class="stat"><small>Best</small><b id="bestMenu">0</b></div>
    </div>
    <button class="btn" id="startBtn">Let's run!</button>
    <div class="hint">Keyboard: Space / ↑ jump, ↓ slide</div>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="card">
    <div class="fox">🌙</div>
    <h1>Oops!</h1>
    <div class="row">
      <div class="stat"><small>Score</small><b id="finalScore">0</b></div>
      <div class="stat"><small>Stars</small><b id="finalStars">0</b></div>
      <div class="stat"><small>Best</small><b id="bestOver">0</b></div>
    </div>
    <button class="btn" id="againBtn">Run again</button>
  </div>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);

  const BEST_KEY = 'rooftop_fox_best';
  const loadBest = () => { try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; } };
  const saveBest = v => { try { localStorage.setItem(BEST_KEY, v); } catch (e) {} };
  let best = loadBest();
  $('bestMenu').textContent = best;

  // ---------- audio: procedural music + sound effects ----------
  const audio = GameAudio({
    bpm: 94, scale: 'pentaMinor', root: 57, prog: [0, 3, 2, 4], seed: 29,
    waves: { lead: 'triangle', bass: 'sine', arp: 'sine', pad: 'triangle' },
    pad: true, arp: true, arpEvery: 2, arpOct: 1, leadDensity: 0.3, drums: 'soft', swing: 0.15, bassPattern: [0, 7, 10], volume: 0.18,
    btnBg: 'rgba(255,255,255,.18)'
  });
  function tone(freq, dur, type = 'sine', vol = 0.07, to = 0) { audio.sfx(freq, dur, type, vol, to); }

  // ---------- view (logical coordinates) ----------
  let W, H, DPR, S, LW, LH;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    S = Math.min(W / 420, H / 480);
    LW = W / S; LH = H / S;
  }
  window.addEventListener('resize', resize);
  resize();

  // deterministic noise for skyline layers
  const hash = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

  // ---------- game state ----------
  const GRAV = 2100, JUMP = -760, JUMP2 = -640;
  let state = 'menu';
  let fox, cam, speed, roofs, items, stars, particles, t, shake, deadTimer;

  function groundBase() { return LH - 40; }

  function reset() {
    t = 0; shake = 0; deadTimer = 0;
    speed = 280; cam = 0; stars = 0;
    particles = [];
    roofs = [{ x: -200, w: 900, top: groundBase() - 150, hue: 0 }];
    items = [];
    fox = { x: 0, y: roofs[0].top, vy: 0, onGround: true, jumps: 0, slide: 0, run: 0, dead: false };
    while (roofEnd() < cam + LW + 600) addRoof();
  }

  const roofEnd = () => { const r = roofs[roofs.length - 1]; return r.x + r.w; };

  function addRoof() {
    const prev = roofs[roofs.length - 1];
    const diff = Math.min(1, cam / 30000);
    const gapMax = Math.min(speed * 0.48, 230);
    const gap = 50 + Math.random() * (gapMax - 50);
    const w = 260 + Math.random() * 360 - diff * 80;
    let top = prev.top + (Math.random() * 160 - 90);
    top = Math.max(groundBase() - 280, Math.min(groundBase() - 90, top));
    const x = prev.x + prev.w + gap;
    const roof = { x, w, top, hue: Math.floor(Math.random() * 4), tank: Math.random() < 0.3 };
    roofs.push(roof);

    // obstacles on the roof (keep the edges clear for landing)
    let px = x + 120;
    while (px < x + w - 90) {
      const r = Math.random();
      if (r < 0.28 + diff * 0.15) {
        items.push({ type: 'chimney', x: px, y: top, w: 26, h: 40 });
        px += 170 + Math.random() * 80;
      } else if (r < 0.46 + diff * 0.2) {
        items.push({ type: 'crow', x: px, y: top - 34, w: 34, h: 22, ph: Math.random() * 6 });
        px += 190 + Math.random() * 80;
      } else {
        // a little arc of stars
        for (let i = 0; i < 4; i++) {
          items.push({ type: 'star', x: px + i * 30, y: top - 50 - Math.sin(i / 3 * Math.PI) * 40, r: 9 });
        }
        px += 170;
      }
    }
    // stars over the gap
    if (gap > 110) {
      for (let i = 1; i < 4; i++) {
        const gx = prev.x + prev.w + gap * i / 4;
        items.push({ type: 'star', x: gx, y: Math.min(prev.top, top) - 90 - Math.sin(i / 4 * Math.PI) * 30, r: 9 });
      }
    }
  }

  function start() {
    reset();
    state = 'play';
    $('menu').classList.add('hidden');
    $('over').classList.add('hidden');
    audio.start();
    tone(520, 0.15, 'triangle', 0.08, 900);
  }

  function die() {
    if (fox.dead) return;
    fox.dead = true;
    fox.vy = -600;
    shake = 12;
    tone(300, 0.6, 'sawtooth', 0.08, 70);
    if (navigator.vibrate) try { navigator.vibrate(120); } catch (e) {}
    deadTimer = 1.1;
  }

  function gameOver() {
    state = 'over';
    const s = score();
    if (s > best) { best = s; saveBest(best); }
    $('finalScore').textContent = s;
    $('finalStars').textContent = stars;
    $('bestOver').textContent = best;
    $('bestMenu').textContent = best;
    $('over').classList.remove('hidden');
  }

  const score = () => Math.floor(cam / 20) + stars * 10;

  // ---------- input ----------
  function jump() {
    if (state !== 'play' || fox.dead) return;
    if (fox.onGround) {
      fox.vy = JUMP; fox.onGround = false; fox.jumps = 1; fox.slide = 0;
      tone(420, 0.14, 'triangle', 0.07, 760);
      puff(fox.x, fox.y, 6);
    } else if (fox.jumps < 2) {
      fox.vy = JUMP2; fox.jumps = 2;
      tone(620, 0.14, 'triangle', 0.07, 1100);
      puff(fox.x, fox.y - 10, 8, '#ffe27a');
    }
  }
  function slide() {
    if (state !== 'play' || fox.dead) return;
    fox.slide = 0.6;
    if (!fox.onGround) fox.vy = Math.max(fox.vy, 900);
    tone(260, 0.1, 'sine', 0.06, 160);
  }

  let px0 = 0, py0 = 0, down = false, swiped = false;
  canvas.addEventListener('pointerdown', e => {
    px0 = e.clientX; py0 = e.clientY; down = true; swiped = false;
  });
  canvas.addEventListener('pointermove', e => {
    if (!down || swiped) return;
    const dx = e.clientX - px0, dy = e.clientY - py0;
    if (Math.abs(dy) > 26 && Math.abs(dy) > Math.abs(dx)) {
      swiped = true;
      if (dy < 0) jump(); else slide();
    }
  });
  window.addEventListener('pointerup', () => {
    if (down && !swiped) jump();
    down = false;
  });
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (state !== 'play' && (k === 'Enter' || k === ' ')) { start(); e.preventDefault(); return; }
    if (e.repeat) return;
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') jump();
    else if (k === 'ArrowDown' || k === 's' || k === 'S') slide();
    else return;
    e.preventDefault();
  });
  $('startBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);

  function puff(x, y, n, col = '#ffffff') {
    for (let i = 0; i < n; i++) {
      particles.push({ x, y, vx: (Math.random() - .5) * 160 - speed * 0.3, vy: -Math.random() * 120, life: .5, r: 2 + Math.random() * 3, col });
    }
  }

  // ---------- update ----------
  const FOX_W = 36;
  function foxH() { return fox.slide > 0 && fox.onGround ? 16 : 30; }

  function update(dt) {
    t += dt;
    if (state === 'menu') { cam += dt * 120; }
    if (state === 'play') {
      if (!fox.dead) {
        speed = Math.min(600, 280 + cam / 90);
        cam += speed * dt;
      }
      fox.x = cam + Math.min(LW * 0.26, 150);

      const prevY = fox.y;
      fox.vy += GRAV * dt;
      fox.y += fox.vy * dt;
      if (fox.slide > 0) fox.slide -= dt;
      fox.run += dt * speed / 40;

      if (!fox.dead) {
        // landing / walls
        fox.onGround = false;
        for (const r of roofs) {
          const overlap = fox.x + FOX_W / 2 > r.x && fox.x - FOX_W / 2 < r.x + r.w;
          if (!overlap) continue;
          if (prevY <= r.top + 2 && fox.y >= r.top && fox.vy >= 0) {
            if (fox.jumps > 0) puff(fox.x, r.top, 5);
            fox.y = r.top; fox.vy = 0; fox.onGround = true; fox.jumps = 0;
          } else if (fox.y > r.top + 8 && fox.x + FOX_W / 2 - r.x < 24) {
            die(); // smacked into the side of a building
          }
        }
        if (fox.y > LH + 60) die();

        // items
        const h = foxH();
        const fl = fox.x - FOX_W / 2 + 4, fr = fox.x + FOX_W / 2 - 4, ft = fox.y - h, fb = fox.y;
        for (const it of items) {
          if (it.taken) continue;
          if (it.type === 'star') {
            if (Math.abs(it.x - fox.x) < 24 && Math.abs(it.y - (fox.y - h / 2)) < 26) {
              it.taken = true; stars++;
              tone(900 + (stars % 6) * 90, 0.09, 'sine', 0.07);
              puff(it.x, it.y, 6, '#ffe27a');
            }
          } else {
            let l = it.x - it.w / 2, r = it.x + it.w / 2, top, bot;
            if (it.type === 'chimney') { top = it.y - it.h; bot = it.y; }
            else { const fy = it.y + Math.sin(t * 6 + it.ph) * 3; top = fy - it.h / 2; bot = fy + it.h / 2; }
            if (fr > l && fl < r && fb > top + 3 && ft < bot - 3) die();
          }
        }
      } else {
        deadTimer -= dt;
        if (deadTimer <= 0 && state === 'play') gameOver();
      }

      // recycle world
      while (roofEnd() < cam + LW + 600) addRoof();
      while (roofs.length > 2 && roofs[0].x + roofs[0].w < cam - 300) roofs.shift();
      items = items.filter(it => it.x > cam - 200 && !(it.type === 'star' && it.taken));
    }
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    if (shake > 0) shake = Math.max(0, shake - dt * 30);
  }

  // ---------- render ----------
  const ROOF_COLORS = [
    ['#4b3f7a', '#5d4f93'], ['#3e3a6e', '#514c8c'], ['#55407a', '#6a5196'], ['#3f4a7a', '#525f98']
  ];

  function skyline(par, base, hmin, hmax, wmin, wmax, col, seed, windows) {
    const off = cam * par;
    let i = Math.floor(off / wmax) - 1;
    for (let k = 0; k < Math.ceil(LW / wmin) + 3; k++, i++) {
      const bw = wmin + hash(i * 3 + seed) * (wmax - wmin);
      const bx = i * wmax - off;
      const bh = hmin + hash(i * 7 + seed) * (hmax - hmin);
      ctx.fillStyle = col;
      ctx.fillRect(bx, base - bh, bw - 4, bh + 400);
      if (hash(i * 11 + seed) < 0.3) ctx.fillRect(bx + bw * 0.3, base - bh - 22, 4, 22);
      if (windows) {
        ctx.fillStyle = '#ffd98a';
        for (let wy = base - bh + 14; wy < base; wy += 22) {
          for (let wx = bx + 10; wx < bx + bw - 16; wx += 18) {
            if (hash(wx * 0.37 + wy * 1.7 + seed) < 0.18) ctx.fillRect(wx, wy, 7, 10);
          }
        }
      }
    }
  }

  function drawFox() {
    const sliding = fox.slide > 0 && fox.onGround;
    ctx.save();
    ctx.translate(fox.x, fox.y);
    if (fox.dead) ctx.rotate(Math.min(3, (1.1 - deadTimer) * 6));
    const run = fox.onGround ? Math.sin(fox.run * 2.4) : 0;

    // tail
    ctx.save();
    ctx.translate(-14, sliding ? -8 : -18);
    ctx.rotate(-0.5 + run * 0.15 + (fox.onGround ? 0 : 0.4));
    ctx.fillStyle = '#ff7b54';
    ctx.beginPath(); ctx.ellipse(-14, 0, 17, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-27, 0, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (sliding) {
      ctx.fillStyle = '#ff7b54';
      ctx.beginPath(); ctx.ellipse(0, -8, 22, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(18, -10, 10, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(24, -7, 6, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff7b54';
      ctx.beginPath(); ctx.moveTo(12, -15); ctx.lineTo(6, -24); ctx.lineTo(18, -16); ctx.fill();
      ctx.fillStyle = '#2b2350';
      ctx.beginPath(); ctx.arc(20, -12, 1.8, 0, Math.PI * 2); ctx.fill();
    } else {
      // legs
      ctx.fillStyle = '#3a2f63';
      const legs = [[-9, run], [9, -run]];
      for (const [lx, a] of legs) {
        ctx.save(); ctx.translate(lx, -10); ctx.rotate(a * 0.7 + (fox.onGround ? 0 : 0.6));
        ctx.fillRect(-2.5, 0, 5, 11); ctx.restore();
      }
      // body
      ctx.fillStyle = '#ff7b54';
      ctx.beginPath(); ctx.ellipse(0, -16, 18, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe8dc';
      ctx.beginPath(); ctx.ellipse(6, -12, 9, 5, 0, 0, Math.PI * 2); ctx.fill();
      // head
      ctx.fillStyle = '#ff7b54';
      ctx.beginPath(); ctx.ellipse(16, -28, 11, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(24, -30); ctx.lineTo(34, -24); ctx.lineTo(24, -22); ctx.fill();
      // ears
      ctx.beginPath(); ctx.moveTo(8, -33); ctx.lineTo(9, -46); ctx.lineTo(16, -36); ctx.fill();
      ctx.beginPath(); ctx.moveTo(15, -35); ctx.lineTo(20, -47); ctx.lineTo(23, -34); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(24, -23, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2b2350';
      ctx.beginPath(); ctx.arc(34, -24.5, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(21, -30, 2, 0, Math.PI * 2); ctx.fill();
      // scarf
      ctx.fillStyle = '#5ed1c4';
      ctx.fillRect(6, -24, 9, 5);
      ctx.save(); ctx.translate(7, -22); ctx.rotate(0.6 + Math.sin(t * 14) * 0.2);
      ctx.fillRect(-14, -2, 14, 4); ctx.restore();
    }
    ctx.restore();
  }

  function drawRoof(r) {
    const [wall, cap] = ROOF_COLORS[r.hue];
    ctx.fillStyle = wall;
    ctx.fillRect(r.x, r.top, r.w, LH - r.top + 10);
    // windows
    for (let wy = r.top + 26; wy < LH; wy += 34) {
      for (let wx = r.x + 18; wx < r.x + r.w - 28; wx += 32) {
        const lit = hash(wx * 0.13 + wy * 0.71 + r.x) < 0.35;
        ctx.fillStyle = lit ? '#ffd98a' : '#00000030';
        ctx.fillRect(wx, wy, 14, 18);
      }
    }
    // cap
    ctx.fillStyle = cap;
    ctx.fillRect(r.x - 4, r.top - 6, r.w + 8, 10);
    // water tank decoration
    if (r.tank) {
      const tx = r.x + r.w - 70;
      ctx.fillStyle = '#2f2858';
      ctx.fillRect(tx, r.top - 22, 4, 18); ctx.fillRect(tx + 30, r.top - 22, 4, 18);
      ctx.fillRect(tx - 4, r.top - 56, 42, 36);
      ctx.beginPath(); ctx.moveTo(tx - 6, r.top - 56); ctx.lineTo(tx + 17, r.top - 70); ctx.lineTo(tx + 40, r.top - 56); ctx.fill();
    }
  }

  function drawItem(it) {
    if (it.type === 'chimney') {
      ctx.fillStyle = '#c4566a';
      ctx.fillRect(it.x - it.w / 2, it.y - it.h, it.w, it.h);
      ctx.fillStyle = '#e07085';
      ctx.fillRect(it.x - it.w / 2 - 3, it.y - it.h - 6, it.w + 6, 8);
      ctx.fillStyle = '#00000025';
      for (let by = it.y - it.h + 8; by < it.y; by += 9) ctx.fillRect(it.x - it.w / 2, by, it.w, 2);
      // smoke
      for (let i = 0; i < 3; i++) {
        const k = (t * 0.6 + i / 3) % 1;
        ctx.fillStyle = 'rgba(255,255,255,' + (0.35 * (1 - k)) + ')';
        ctx.beginPath(); ctx.arc(it.x - k * 30, it.y - it.h - 12 - k * 40, 6 + k * 10, 0, Math.PI * 2); ctx.fill();
      }
    } else if (it.type === 'crow') {
      const fy = it.y + Math.sin(t * 6 + it.ph) * 3;
      const flap = Math.sin(t * 18 + it.ph);
      ctx.fillStyle = '#1d1838';
      ctx.beginPath(); ctx.ellipse(it.x, fy, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(it.x - 12, fy - 4, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffb347';
      ctx.beginPath(); ctx.moveTo(it.x - 17, fy - 5); ctx.lineTo(it.x - 25, fy - 2); ctx.lineTo(it.x - 17, fy - 1); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(it.x - 13, fy - 6, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2f2858';
      ctx.beginPath(); ctx.moveTo(it.x - 4, fy - 2); ctx.lineTo(it.x + 6, fy - 2 - flap * 16); ctx.lineTo(it.x + 10, fy); ctx.fill();
    } else if (it.type === 'star') {
      const s = it.r * (1 + Math.sin(t * 5 + it.x) * 0.12);
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(t * 1.5);
      ctx.fillStyle = '#ffe27a55';
      ctx.beginPath(); ctx.arc(0, 0, s * 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe27a';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? s * 0.45 : s;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // sky
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2b2350'); g.addColorStop(0.55, '#7a4f9a'); g.addColorStop(1, '#ff9e7a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.scale(S, S);
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    // twinkling stars
    for (let i = 0; i < 40; i++) {
      const sx = (hash(i) * LW * 1.2 - cam * 0.02) % LW;
      const sy = hash(i + 99) * LH * 0.45;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + 0.5 * Math.abs(Math.sin(t * 2 + i))) + ')';
      ctx.fillRect((sx + LW) % LW, sy, 2, 2);
    }
    // moon
    const mx = LW * 0.78, my = LH * 0.2, mr = 46;
    ctx.fillStyle = '#fff6e0';
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f0e2c0';
    ctx.beginPath(); ctx.arc(mx - 14, my - 10, 9, 0, Math.PI * 2); ctx.arc(mx + 16, my + 14, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff6e018';
    ctx.beginPath(); ctx.arc(mx, my, mr * 2.2, 0, Math.PI * 2); ctx.fill();

    // parallax skyline layers
    skyline(0.15, LH - 120, 60, 200, 50, 110, '#5a4a8a', 1, false);
    skyline(0.35, LH - 60, 80, 230, 60, 130, '#43386f', 2, true);

    // world
    ctx.save();
    ctx.translate(-cam, 0);
    for (const r of roofs) if (r.x < cam + LW + 50 && r.x + r.w > cam - 50) drawRoof(r);
    for (const it of items) if (it.x > cam - 60 && it.x < cam + LW + 60) drawItem(it);
    drawFox();
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life * 2);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // low fog
    const fg = ctx.createLinearGradient(0, LH - 90, 0, LH);
    fg.addColorStop(0, 'rgba(255,158,122,0)'); fg.addColorStop(1, 'rgba(255,158,122,.45)');
    ctx.fillStyle = fg; ctx.fillRect(0, LH - 90, LW, 90);
    ctx.restore();

    $('score').textContent = state === 'menu' ? 'Best ' + best : score();
    $('stars').textContent = '★ ' + stars;
  }

  reset();
  let last = performance.now();
  function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000));
    last = now;
    if (state === 'menu') {
      // idle demo: fox trots along the first roof
      fox.x = cam + Math.min(LW * 0.26, 150);
      fox.run += dt * 4;
      if (roofs.length && fox.x > roofs[0].x + roofs[0].w - 40) reset();
    }
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
