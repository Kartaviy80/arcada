<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Checkers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Inter:wght@600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#1c1410;font-family:'Inter',system-ui,sans-serif;color:#f5e6d3;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:420px;margin:0 auto;padding:max(env(safe-area-inset-top),8px) 10px max(env(safe-area-inset-bottom),8px)}
.header{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding:4px 0}
.logo{font-family:'Libre Baskerville',serif;font-size:16px;color:#d4a574}
.badge{background:#2a211c;border-radius:12px;padding:6px 12px;font-size:12px;font-weight:700}
.badge.active{outline:2px solid #d4a574}
.status{text-align:center;font-size:12px;font-weight:600;padding:4px 0;color:#a89080;flex-shrink:0;min-height:20px}
.status.win{color:#4ade80;font-size:14px}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(94vw,calc(100dvh - 155px));aspect-ratio:1;border-radius:6px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.cell{display:flex;align-items:center;justify-content:center;position:relative}
.cell.dark{background:#5c4033}.cell.light{background:#d4b896}
.cell.valid{box-shadow:inset 0 0 0 3px #4ade80;cursor:pointer}
.cell.selected{box-shadow:inset 0 0 0 3px #fbbf24}
.piece{width:72%;height:72%;border-radius:50%;pointer-events:none}
.piece.you{background:radial-gradient(circle at 35% 30%,#f5e6d3,#c4a574);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.piece.bot{background:radial-gradient(circle at 35% 30%,#4a3728,#1c1410);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.piece.king::after{content:'♛';position:absolute;font-size:clamp(10px,3.5vw,16px);color:rgba(255,200,50,.9)}
.controls{display:flex;gap:8px;justify-content:center;padding:6px 0 2px;flex-shrink:0}
button{font-family:inherit;background:#2a211c;border:1px solid #3d2e24;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:700;color:#f5e6d3;min-height:40px;cursor:pointer}
button:active{transform:scale(.96)}
#btnMusic.active{background:#3d2e24;border-color:#d4a574;color:#d4a574}
.hint{text-align:center;font-size:10px;color:#6b5344;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="badge" id="cardYou">You</div>
    <div class="logo">Checkers</div>
    <div class="badge" id="cardBot">Bot</div>
  </div>
  <div class="status" id="status">Your turn</div>
  <div class="board-wrap"><div id="board"></div></div>
  <div class="controls">
    <button id="btnMusic" onclick="toggleMusic()">♪ Music</button>
    <button onclick="newGame()">New</button>
  </div>
  <div class="hint">Capture by jumping · Reach end to king</div>
</div>
<script>
const N=8;
// 0 empty, 1 you, 2 bot, 3 you king, 4 bot king
let board,turn,sel,over;
const boardEl=document.getElementById('board'),st=document.getElementById('status');

let audioCtx=null,musicNodes=[],musicOn=false,musicTimer=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function stopMusic(){musicNodes.forEach(n=>{try{n.stop()}catch(e){}try{n.disconnect()}catch(e){}});musicNodes=[];if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function startMusic(){
  const ctx=ensureAudio();stopMusic();
  const m=ctx.createGain();m.gain.value=0.05;m.connect(ctx.destination);
  function tone(f,t,d){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.035,t+.4);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(m);o.start(t);o.stop(t+d+.05);musicNodes.push(o)}
  function L(){const t=ctx.currentTime+.05;tone(196,t,3);tone(246.94,t+.5,2.5);tone(293.66,t+1.3,2);tone(392,t+2.2,1.8)}
  L();musicTimer=setInterval(L,4500);
}
function toggleMusic(){musicOn=!musicOn;document.getElementById('btnMusic').classList.toggle('active',musicOn);if(musicOn)startMusic();else stopMusic()}

function newGame(){
  board=Array.from({length:N},()=>Array(N).fill(0));
  for(let r=0;r<3;r++)for(let c=0;c<N;c++)if((r+c)%2===1)board[r][c]=2;
  for(let r=5;r<8;r++)for(let c=0;c<N;c++)if((r+c)%2===1)board[r][c]=1;
  turn=1;sel=null;over=false;render();upd();
}
function upd(){
  document.getElementById('cardYou').classList.toggle('active',turn===1&&!over);
  document.getElementById('cardBot').classList.toggle('active',turn===2&&!over);
  if(over){st.className='status win';st.textContent=turn===2?'You win!':'Bot wins!'}
  else{st.className='status';st.textContent=turn===1?'Your turn':'Bot thinking...'}
}
function isYou(p){return p===1||p===3}
function isBot(p){return p===2||p===4}
function isKing(p){return p===3||p===4}
function dirs(p){
  if(p===1)return[[-1,-1],[-1,1]];
  if(p===2)return[[1,-1],[1,1]];
  return[[-1,-1],[-1,1],[1,-1],[1,1]];
}
function getMoves(r,c){
  const p=board[r][c];if(!p)return[];
  const mine=isYou(p),opp=mine?isBot:isYou;
  const moves=[],jumps=[];
  for(const[dr,dc]of dirs(p)){
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>=N||nc<0||nc>=N)continue;
    if(!board[nr][nc])moves.push({r:nr,c:nc,jump:null});
    else if(opp(board[nr][nc])){
      const jr=nr+dr,jc=nc+dc;
      if(jr>=0&&jr<N&&jc>=0&&jc<N&&!board[jr][jc])jumps.push({r:jr,c:jc,jump:{r:nr,c:nc}});
    }
  }
  return jumps.length?jumps:moves;
}
function allMoves(player){
  const list=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const p=board[r][c];
    if((player===1&&isYou(p))||(player===2&&isBot(p))){
      const m=getMoves(r,c);if(m.length)list.push({from:{r,c},moves:m});
    }
  }
  const anyJump=list.some(x=>x.moves.some(m=>m.jump));
  if(anyJump)return list.map(x=>({from:x.from,moves:x.moves.filter(m=>m.jump)})).filter(x=>x.moves.length);
  return list;
}
function doMove(fr,fc,tr,tc,jump){
  let p=board[fr][fc];board[fr][fc]=0;board[tr][tc]=p;
  if(jump)board[jump.r][jump.c]=0;
  if(p===1&&tr===0)board[tr][tc]=3;
  if(p===2&&tr===7)board[tr][tc]=4;
}
function render(){
  boardEl.innerHTML='';
  const myMoves=(!over&&turn===1)?allMoves(1):[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const cell=document.createElement('div');
    cell.className='cell '+((r+c)%2?'dark':'light');
    const p=board[r][c];
    if(p){
      const d=document.createElement('div');
      d.className='piece '+(isYou(p)?'you':'bot')+(isKing(p)?' king':'');
      cell.appendChild(d);
    }
    if(sel&&sel.r===r&&sel.c===c)cell.classList.add('selected');
    if(sel){
      const ms=getMoves(sel.r,sel.c);
      if(ms.some(m=>m.r===r&&m.c===c)){
        cell.classList.add('valid');
        cell.onclick=()=>{
          const m=ms.find(x=>x.r===r&&x.c===c);
          doMove(sel.r,sel.c,r,c,m.jump);
          sel=null;
          if(!countPieces(2)){over=true;turn=2;render();upd();return}
          turn=2;upd();render();setTimeout(botMove,400);
        };
      }
    } else if(turn===1&&isYou(p)){
      const ms=getMoves(r,c);
      const forced=myMoves.some(x=>x.moves.some(m=>m.jump));
      if(ms.length&&(!forced||ms.some(m=>m.jump))){
        cell.style.cursor='pointer';
        cell.onclick=()=>{sel={r,c};render()};
      }
    }
    boardEl.appendChild(cell);
  }
}
function countPieces(player){
  let n=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const p=board[r][c];
    if(player===1&&isYou(p))n++;
    if(player===2&&isBot(p))n++;
  }return n;
}
function botMove(){
  const moves=allMoves(2);
  if(!moves.length){over=true;turn=1;upd();render();return}
  // prefer jumps, then random
  let pick=moves[Math.floor(Math.random()*moves.length)];
  const jumpOnes=moves.filter(x=>x.moves.some(m=>m.jump));
  if(jumpOnes.length)pick=jumpOnes[Math.floor(Math.random()*jumpOnes.length)];
  const m=pick.moves[Math.floor(Math.random()*pick.moves.length)];
  doMove(pick.from.r,pick.from.c,m.r,m.c,m.jump);
  if(!countPieces(1)){over=true;turn=1;render();upd();return}
  turn=1;upd();render();
}
newGame();
</script>
</body>
</html>
