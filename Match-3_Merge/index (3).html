<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<title>Rune Battle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14111c;
    font-family: "Cinzel", "Trajan Pro", "Georgia", serif; color: #e8dcc0;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  #skill { position: fixed; right: 12px; top: 200px; border: 2px solid #b48cff; background: #2a1a44; color: #e9dcff; font: inherit; font-size: 14px;
    padding: 10px 14px; border-radius: 12px; cursor: pointer; opacity: .45; box-shadow: 0 0 0 #b48cff; transition: opacity .2s, box-shadow .2s; display: none; }
  #skill.ready { opacity: 1; box-shadow: 0 0 18px #b48cff; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: #0a0810d9; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .scroll { width: min(360px, 100%); background: linear-gradient(#e9d9b0, #cbb07a); color: #3a2410; border-radius: 6px; padding: 26px 22px; text-align: center; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 0 0 4px #7a5a2c, 0 20px 50px #000; }
  .scroll canvas { width: 140px; height: 140px; margin: 0 auto; }
  h1 { font-size: clamp(34px, 10vw, 48px); letter-spacing: 3px; color: #6b1a12; }
  p { font-family: Georgia, serif; font-size: 14px; line-height: 1.5; }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; text-align: left; font-family: Georgia, serif; font-size: 13px; }
  .legend i { font-style: normal; font-weight: bold; }
  .stat { font-size: 17px; } .stat b { color: #6b1a12; }
  .btn { border: 2px solid #3a2410; background: #6b1a12; color: #f3e3c0; font: inherit; font-size: 18px; letter-spacing: 2px; padding: 12px; cursor: pointer; border-radius: 4px; }
  .btn:active { background: #4a0f0a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="skill">✦ METEOR</button>

<div class="overlay" id="menu"><div class="scroll">
  <canvas id="logo" width="280" height="280"></canvas>
  <h1>RUNE BATTLE</h1>
  <p>Match runes to fight the monsters of the deep crypt. Every swap counts — when the monster's counter hits zero, it strikes.</p>
  <div class="legend"><i style="color:#c2281a">Fire</i><span>damage</span><i style="color:#b08a00">Storm</i><span>damage</span><i style="color:#1c5aa8">Water</i><span>shield</span><i style="color:#2c7a2c">Nature</i><span>heal</span><i style="color:#6a2ca8">Shadow</i><span>mana → Meteor (60 dmg)</span></div>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">ENTER THE CRYPT</button>
</div></div>
<div class="overlay hidden" id="over"><div class="scroll">
  <h1>FALLEN</h1>
  <div class="stat">Monsters slain <b id="finalScore">0</b></div>
  <div class="stat">Best <b id="bestOver">0</b></div>
  <button class="btn" id="againBtn">RISE AGAIN</button>
</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*MATCH3-ENGINE-START*/
// ---------- match-3 engine: swaps, matches, specials, cascades, blockers ----------
// Game code renders pieces from engine.grid using each piece's animated x/y (in cell units)
// and reacts to events (onClear, onCascade, onSettled ...).
const Match3 = (opts) => {
  const C = opts.cols, R = opts.rows, K = opts.kinds;
  let uid = 1, phase = 'idle', timer = 0, cascade = 0, swapPair = null, idleT = 0;
  const grid = [], layer = [];
  const mk = (kind, r, c, y) => ({ id: uid++, kind, special: null, r, c, x: c, y: y === undefined ? r : y, vy: 0, dying: 0, pop: 0 });
  const inside = (r, c) => r >= 0 && r < R && c >= 0 && c < C;
  const holeAt = (r, c) => opts.hole ? opts.hole(r, c) : false;
  const rk = () => Math.floor(Math.random() * K);

  for (let r = 0; r < R; r++) {
    grid.push([]); layer.push([]);
    for (let c = 0; c < C; c++) {
      layer[r].push(opts.layer ? opts.layer(r, c) : 0);
      if (holeAt(r, c)) { grid[r].push(null); continue; }
      let k;
      do { k = rk(); } while ((c >= 2 && grid[r][c - 1] && grid[r][c - 2] && grid[r][c - 1].kind === k && grid[r][c - 2].kind === k) ||
                              (r >= 2 && grid[r - 1][c] && grid[r - 2][c] && grid[r - 1][c].kind === k && grid[r - 2][c].kind === k));
      grid[r].push(mk(k, r, c, r - R - 1));
    }
  }
  phase = 'fall';

  const at = (r, c) => inside(r, c) ? grid[r][c] : null;
  const same = (a, b) => a && b && !a.dying && !b.dying && a.kind >= 0 && a.kind === b.kind;

  function findRuns() {
    const runs = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C;) {
      let e = c + 1; while (e < C && same(grid[r][c], grid[r][e])) e++;
      if (e - c >= 3 && grid[r][c] && grid[r][c].kind >= 0) runs.push({ dir: 'h', cells: Array.from({ length: e - c }, (_, i) => [r, c + i]) });
      c = e;
    }
    for (let c = 0; c < C; c++) for (let r = 0; r < R;) {
      let e = r + 1; while (e < R && same(grid[r][c], grid[e][c])) e++;
      if (e - r >= 3 && grid[r][c] && grid[r][c].kind >= 0) runs.push({ dir: 'v', cells: Array.from({ length: e - r }, (_, i) => [r + i, c]) });
      r = e;
    }
    return runs;
  }

  // queue every cell to clear, chaining through special pieces
  function blast(seed) {
    const out = new Map(), q = [...seed];
    while (q.length) {
      const [r, c] = q.pop(), key = r * C + c;
      if (out.has(key) || !inside(r, c)) continue;
      const p = grid[r][c];
      out.set(key, [r, c]);
      if (!p || !p.special) continue;
      if (p.special === 'h') for (let x = 0; x < C; x++) q.push([r, x]);
      else if (p.special === 'v') for (let y = 0; y < R; y++) q.push([y, c]);
      else if (p.special === 'bomb') for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) q.push([r + y, c + x]);
      else if (p.special === 'color') { const k = p.target !== undefined ? p.target : rk(); for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) if (grid[y][x] && grid[y][x].kind === k) q.push([y, x]); }
    }
    return [...out.values()];
  }

  function clearCells(cells, keep) {
    const cleared = [];
    for (const [r, c] of cells) {
      const p = grid[r][c];
      if (layer[r][c] > 0) { layer[r][c]--; opts.onLayer && opts.onLayer(r, c, layer[r][c]); }
      if (!p || p.dying || keep.has(p)) continue;
      p.dying = 0.0001;
      cleared.push(p);
    }
    if (cleared.length) opts.onClear && opts.onClear(cleared, cascade);
    return cleared.length;
  }

  function resolve(preferred) {
    const runs = findRuns();
    if (!runs.length) return false;
    cascade++;
    const count = {};
    runs.forEach((run, i) => run.cells.forEach(([r, c]) => { (count[r * C + c] = count[r * C + c] || []).push(i); }));
    const keep = new Set(), used = new Set();
    const promote = (r, c, special, target) => {
      const p = grid[r][c]; if (!p) return;
      p.special = special; p.pop = 1; keep.add(p);
      if (special === 'color') { p.kind = -1; }
      opts.onSpecial && opts.onSpecial(p);
    };
    const pick = run => {
      if (preferred) for (const p of preferred) if (p && run.cells.some(([r, c]) => r === p.r && c === p.c)) return [p.r, p.c];
      return run.cells[Math.floor(run.cells.length / 2)];
    };
    if (opts.specials !== false) {
      runs.forEach((run, i) => { if (run.cells.length >= 5) { used.add(i); const [r, c] = pick(run); promote(r, c, 'color'); } });
      for (const key in count) {
        const ids = count[key].filter(i => !used.has(i));
        if (ids.length >= 2) { ids.forEach(i => used.add(i)); promote(Math.floor(key / C), key % C, 'bomb'); }
      }
      runs.forEach((run, i) => { if (!used.has(i) && run.cells.length === 4) { const [r, c] = pick(run); promote(r, c, run.dir === 'h' ? 'v' : 'h'); } });
    }
    const seed = [];
    runs.forEach(run => run.cells.forEach(cell => { const p = grid[cell[0]][cell[1]]; if (!keep.has(p)) seed.push(cell); }));
    clearCells(blast(seed), keep);
    phase = 'clear'; timer = 0.24;
    return true;
  }

  function collapse() {
    for (let c = 0; c < C; c++) {
      // pieces drop through each column; holes stay empty
      const stack = [];
      for (let r = R - 1; r >= 0; r--) { if (holeAt(r, c)) continue; const p = grid[r][c]; if (p && !p.dying) stack.push(p); grid[r][c] = null; }
      let spawn = 0;
      for (let r = R - 1; r >= 0; r--) {
        if (holeAt(r, c)) continue;
        let p = stack.shift();
        if (!p) { spawn++; p = mk(rk(), r, c, -spawn); }
        p.r = r; p.c = c; grid[r][c] = p;
      }
    }
    phase = 'fall';
  }

  function swapKinds(a, b) { const t = grid[a.r][a.c]; grid[a.r][a.c] = grid[b.r][b.c]; grid[b.r][b.c] = t; }
  function hasMove() {
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const p = grid[r][c]; if (!p) continue;
      if (p.special === 'color') return [[r, c], inside(r, c + 1) && grid[r][c + 1] ? [r, c + 1] : [r + 1, c]];
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const q = at(r + dr, c + dc); if (!q) continue;
        swapKinds({ r, c }, { r: r + dr, c: c + dc });
        const ok = findRuns().length > 0;
        swapKinds({ r, c }, { r: r + dr, c: c + dc });
        if (ok) return [[r, c], [r + dr, c + dc]];
      }
    }
    return null;
  }
  function shuffle() {
    const all = []; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (grid[r][c]) all.push(grid[r][c]);
    for (let tries = 0; tries < 200; tries++) {
      all.forEach(p => { if (!p.special) p.kind = rk(); });
      if (!findRuns().length && hasMove()) break;
    }
    opts.onShuffle && opts.onShuffle();
  }

  const api = {
    grid, layer, R, C, selected: null, hint: null,
    get phase() { return phase; },
    get busy() { return phase !== 'idle'; },
    trySwap(r1, c1, r2, c2) {
      if (phase !== 'idle' || !inside(r1, c1) || !inside(r2, c2) || Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return false;
      const a = grid[r1][c1], b = grid[r2][c2];
      if (!a || !b || (opts.canSwap && !opts.canSwap())) return false;
      api.selected = null; api.hint = null; idleT = 0;
      grid[r1][c1] = b; grid[r2][c2] = a;
      a.r = r2; a.c = c2; b.r = r1; b.c = c1;
      swapPair = [a, b]; cascade = 0; phase = 'swap';
      opts.onSwap && opts.onSwap();
      return true;
    },
    update(dt) {
      let moving = false;

// input: drag a piece onto a neighbour, or tap one piece and then a neighbour.
// getEngine() returns the current board, so levels can swap engines freely.
const attachMatch3Input = (el, getEngine, cellAt) => {
  let start = null, done = false;
  el.addEventListener('pointerdown', e => {
    const cell = cellAt(e.clientX, e.clientY); if (!cell) return;
    start = { x: e.clientX, y: e.clientY, cell }; done = false;
  });
  el.addEventListener('pointermove', e => {
    const eng = getEngine();
    if (!start || done || !eng) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (Math.hypot(dx, dy) < 18) return;
    done = true;
    const [r, c] = start.cell;
    if (Math.abs(dx) > Math.abs(dy)) eng.trySwap(r, c, r, c + Math.sign(dx)); else eng.trySwap(r, c, r + Math.sign(dy), c);
  });
  addEventListener('pointerup', () => {
    const eng = getEngine();
    if (start && !done && eng) {
      const [r, c] = start.cell, s = eng.selected;
      if (s && Math.abs(s[0] - r) + Math.abs(s[1] - c) === 1) eng.trySwap(s[0], s[1], r, c);
      else eng.selected = s && s[0] === r && s[1] === c ? null : [r, c];
    }
    start = null;
  });
};

    t += dt;
    if (eng) eng.update(dt);
    for (const f of fx) f.t += dt * (f.meteor ? 2.2 : 2.6);
    fx = fx.filter(f => f.t < 1);
    for (const n of nums) { n.y -= 40 * dt; n.life -= dt; }
    nums = nums.filter(n => n.life > 0);
    if (foe && foe.dying) foe.dying += dt;
    shake = Math.max(0, shake - dt * 30); foeHit = Math.max(0, foeHit - dt); heroHit = Math.max(0, heroHit - dt);
    if (hero) $('skill').classList.toggle('ready', hero.mana >= 15);
  }

  function bar(x, y, w, h, v, max, col, label) {
    ctx.fillStyle = '#0008'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = col; ctx.fillRect(x + 2, y + 2, Math.max(0, (w - 4) * v / max), h - 4);
    ctx.strokeStyle = '#c9a26a'; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, h);
    if (label) { ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.round(h * 0.75) + 'px Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x + w / 2, y + h / 2 + 1); }
  }

  function render() {
    ctx.fillStyle = '#14111c'; ctx.fillRect(0, 0, W, H);
    // crypt backdrop: stone arches and torches
    const g = ctx.createLinearGradient(0, 0, 0, sceneH); g.addColorStop(0, '#2a2236'); g.addColorStop(1, '#14111c');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, sceneH);
    ctx.strokeStyle = '#3a3048'; ctx.lineWidth = 2;
    for (let y = 10; y < sceneH; y += 26) for (let x = (y / 26 % 2) * 30 - 30; x < W; x += 60) ctx.strokeRect(x, y, 60, 26);
    for (const tx of [30, W - 30]) {
      const fl = ctx.createRadialGradient(tx, sceneH * 0.3, 2, tx, sceneH * 0.3, 90);
      fl.addColorStop(0, 'rgba(255,170,80,.5)'); fl.addColorStop(1, 'rgba(255,170,80,0)');
      ctx.fillStyle = fl; ctx.fillRect(tx - 90, sceneH * 0.3 - 90, 180, 180);
      ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.ellipse(tx, sceneH * 0.3, 6, 12 + Math.sin(t * 20) * 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5a4030'; ctx.fillRect(tx - 3, sceneH * 0.3 + 8, 6, 20);
    }
    ctx.fillStyle = '#0a0810'; ctx.fillRect(0, sceneH - 4, W, 4);
    if (!SPR) return;
    ctx.save();
    if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    if (foe) {
      const ms = Math.min(sceneH * 0.72, W * 0.55), mx = W / 2, my = sceneH * 0.5 + Math.sin(t * 2) * 4;
      ctx.save(); ctx.translate(mx, my);
      if (foe.dying) { ctx.globalAlpha = Math.max(0, 1 - foe.dying); ctx.scale(1 + foe.dying * 0.3, 1 - foe.dying * 0.6); }
      if (foeHit) ctx.translate(Math.sin(t * 80) * 6, 0);
      const breathe = 1 + Math.sin(t * 2.5) * 0.02;
      ctx.drawImage(SPR['m' + foe.k], -ms / 2, -ms / 2, ms, ms * breathe);
      if (foeHit) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = foeHit * 1.5; ctx.drawImage(SPR['m' + foe.k], -ms / 2, -ms / 2, ms, ms * breathe); ctx.globalCompositeOperation = 'source-over'; }
      ctx.restore(); ctx.globalAlpha = 1;
      const bw = Math.min(260, W * 0.6);
      ctx.fillStyle = '#e8dcc0'; ctx.font = 'bold 15px Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(foe.name, W / 2, Math.max(22, sceneH * 0.08));
      bar(W / 2 - bw / 2, Math.max(28, sceneH * 0.1), bw, 16, foe.hp, foe.max, '#d0301a', foe.hp + ' / ' + foe.max);
      // attack countdown sword
      const cx = W / 2 + bw / 2 + 22, cy = Math.max(36, sceneH * 0.1 + 8);
      ctx.fillStyle = foe.timer <= 1 ? '#ff5a3a' : '#5a4a6a'; ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 15px Georgia, serif'; ctx.textBaseline = 'middle'; ctx.fillText(Math.max(0, foe.timer), cx, cy + 1); ctx.textBaseline = 'alphabetic';
    }
    if (hero) {
      const bw = Math.min(180, W * 0.42), y = sceneH - 26;
      if (heroHit) { ctx.fillStyle = 'rgba(255,0,0,' + heroHit * 0.5 + ')'; ctx.fillRect(0, 0, W, H); }
      bar(12, y, bw, 16, hero.hp, hero.max, '#3ac04a', '♥ ' + hero.hp);
      if (hero.shield) bar(12, y - 18, bw * hero.shield / 60, 10, 1, 1, '#3aa0ff', '');
      bar(W - 12 - bw * 0.6, y, bw * 0.6, 16, hero.mana, 15, '#9a5aff', '✦ ' + hero.mana + '/15');
    }
    ctx.restore();
    if (!eng) return;
    // board on a dark slate
    const fw = N * cell;
    ctx.fillStyle = '#0a0810'; ctx.fillRect(bx - 8, by - 8, fw + 16, fw + 16);
    ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 3; ctx.strokeRect(bx - 8, by - 8, fw + 16, fw + 16);
    ctx.save(); ctx.beginPath(); ctx.rect(bx, by, fw, fw); ctx.clip();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const p = eng.grid[r][c]; if (!p) continue;
      let s = 1, a = 1;
      if (p.dying) { s = 1 + p.dying * 1.5; a = Math.max(0, 1 - p.dying * 4); }
      if (p.pop) s *= 1 + Math.sin(p.pop * Math.PI) * 0.25;
      if (eng.hint && eng.hint.some(([rr, cc]) => rr === p.r && cc === p.c)) s *= 1 + Math.sin(t * 8) * 0.07;
      const sel = eng.selected && eng.selected[0] === p.r && eng.selected[1] === p.c;
      const x = bx + (p.x + 0.5) * cell, y = by + (p.y + 0.5) * cell, sz = cell * 0.94 * s;
      ctx.globalAlpha = a;
      ctx.drawImage(p.special === 'color' ? SPR.orb : SPR['r' + p.kind], x - sz / 2, y - sz / 2, sz, sz);
      if (p.special === 'h' || p.special === 'v') { ctx.save(); ctx.translate(x, y); if (p.special === 'v') ctx.rotate(Math.PI / 2); ctx.strokeStyle = RUNES[p.kind].col; ctx.lineWidth = 3; ctx.shadowColor = RUNES[p.kind].col; ctx.shadowBlur = 10; ctx.beginPath(); ctx.moveTo(-sz * 0.45, 0); ctx.lineTo(sz * 0.45, 0); ctx.stroke(); ctx.restore(); }
      if (p.special === 'bomb') { ctx.save(); ctx.translate(x, y); ctx.rotate(t * 2); ctx.strokeStyle = RUNES[p.kind].col; ctx.lineWidth = 2.5; ctx.shadowColor = RUNES[p.kind].col; ctx.shadowBlur = 12; ctx.strokeRect(-sz * 0.36, -sz * 0.36, sz * 0.72, sz * 0.72); ctx.restore(); }
      if (sel) { ctx.strokeStyle = '#ffe7a0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, sz * 0.5, 0, Math.PI * 2); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    for (const f of fx) {
      const k = f.t * f.t, x = f.x + (f.tx - f.x) * k, y = f.y + (f.ty - f.y) * k;
      ctx.fillStyle = f.col; ctx.shadowColor = f.col; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(x, y, f.meteor ? 22 : 5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    }
    for (const n of nums) {
      ctx.globalAlpha = Math.min(1, n.life * 2); ctx.textAlign = 'center';
      ctx.font = 'bold ' + (n.big ? 30 : 18) + 'px Georgia, serif';
      ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(n.txt, n.x, n.y); ctx.fillStyle = n.col; ctx.fillText(n.txt, n.x, n.y);
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
