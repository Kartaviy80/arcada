<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fde4e1">
<title>Cake Layers</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fde4e1;
    font-family: "Georgia", "Palatino", serif; color: #6b3b3b;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  .hud b { font-size: 34px; font-style: italic; }
  .hud span { font-size: 24px; letter-spacing: 2px; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: #6b3b3b55; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .menu { width: min(340px, 100%); background: #fffaf3; border-radius: 6px; padding: 30px 24px; text-align: center; display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 20px 50px #6b3b3b44; border: 1px solid #e9cfc4; outline: 6px solid #fffaf3; }
  .menu small { letter-spacing: 6px; font-size: 11px; color: #c08a7d; }
  h1 { font-size: clamp(38px, 11vw, 52px); font-style: italic; font-weight: normal; color: #b4495a; }
  p { font-size: 15px; line-height: 1.6; color: #8a5d55; }
  .dots { border-bottom: 2px dotted #e9cfc4; }
  .stat { display: flex; justify-content: space-between; font-size: 17px; } .stat b { color: #b4495a; }
  .btn { border: none; background: #b4495a; color: #fffaf3; font: inherit; font-style: italic; font-size: 20px; padding: 14px; border-radius: 40px; cursor: pointer; }
  .btn:active { background: #8f3646; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b id="score">0</b><span id="lives">🍒🍒🍒</span></div>

<div class="overlay" id="menu"><div class="menu">
  <small>PÂTISSERIE</small>
  <h1>Cake Layers</h1>
  <div class="dots"></div>
  <p><b>Drag</b> the plate to catch the falling layers. Stack them neatly — a cake that leans too far will tumble. Three dropped layers and the kitchen closes.</p>
  <div class="stat"><span>Tallest cake</span><b id="bestMenu">0</b></div>
  <button class="btn" id="startBtn">Start baking</button>
</div></div>
<div class="overlay hidden" id="over"><div class="menu">
  <small>FIN</small>
  <h1 id="overTitle">Splat!</h1>
  <div class="dots"></div>
  <div class="stat"><span>Layers</span><b id="finalScore">0</b></div>
  <div class="stat"><span>Tallest cake</span><b id="bestOver">0</b></div>
  <button class="btn" id="againBtn">Bake again</button>
</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const audio = GameAudio({
    bpm: 112, scale: 'major', root: 65, prog: [0, 3, 4, 0], seed: 205,
    waves: { lead: 'triangle', bass: 'triangle', arp: 'sine' },
    arp: true, arpEvery: 2, arpOct: 1, leadOct: 1, leadDensity: 0.35, drums: 'soft', swing: 0.2, bassPattern: [0, 6, 8, 14], volume: 0.17,
    btnBg: 'rgba(180,73,90,.35)'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'cake_layers_best';
  let best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  $('bestMenu').textContent = best;

  let W, H, DPR, S, LW, LH;
  const LH_ = 30;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    S = Math.min(W / 400, H / 700); LW = W / S; LH = H / S;
  }
  addEventListener('resize', resize); resize();
  const FLAVORS = [
    { body: '#7a4a35', cream: '#fff3e6' }, { body: '#f3a3b5', cream: '#fff' }, { body: '#f7e3b0', cream: '#f3a3b5' },
    { body: '#a8c98a', cream: '#fff8e8' }, { body: '#c9a3e8', cream: '#fff' }, { body: '#ffd27a', cream: '#7a4a35' }
  ];

  let state = 'menu', plateX, cake, falling, camY, lives, t = 0, topple = null, splats = [], spawnT, wob = 0;
  function reset() { plateX = 0; cake = []; falling = []; camY = 0; lives = 3; topple = null; splats = []; spawnT = 0.6; wob = 0; }
  reset();
  const cakeTop = () => 20 + cake.length * LH_;      // plate thickness 20
  const fallSpeed = () => 150 + Math.min(220, cake.length * 9);

  function start() { reset(); state = 'play'; audio.start(); $('menu').classList.add('hidden'); $('over').classList.add('hidden'); }
  function end(title) {
    if (state !== 'play') return;
    state = 'over';
    const s = cake.length; if (s > best) { best = s; try { localStorage.setItem(KEY, best); } catch (e) {} }
    $('overTitle').textContent = title; $('finalScore').textContent = s; $('bestOver').textContent = best; $('bestMenu').textContent = best;
    setTimeout(() => $('over').classList.remove('hidden'), 1300);
  }

  let dragging = false, lastX = 0;
  canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; });
  addEventListener('pointermove', e => { if (dragging && state === 'play' && !topple) { plateX += (e.clientX - lastX) / S * 1.2; lastX = e.clientX; } });
  addEventListener('pointerup', () => { dragging = false; });
  const keys = {};
  addEventListener('keydown', e => {
    if (state !== 'play' && (e.key === ' ' || e.key === 'Enter') && (state === 'menu' || !$('over').classList.contains('hidden'))) { start(); e.preventDefault(); return; }
    keys[e.key] = true;
  });
  addEventListener('keyup', e => { keys[e.key] = false; });
  $('startBtn').onclick = start; $('againBtn').onclick = start;

  function unstable() {
    // offsets are relative to the plate; check every level's centre of mass against the layer below
    for (let i = cake.length - 1; i >= 1; i--) {
      let m = 0, mx = 0;
      for (let j = i; j < cake.length; j++) { m += cake[j].w; mx += cake[j].w * cake[j].off; }
      const com = mx / m, b = cake[i - 1];
      if (Math.abs(com - b.off) > b.w / 2) return { i, side: Math.sign(com - b.off) };
    }
    return null;
  }

  function update(dt) {
    t += dt;
    if (state === 'play' && !topple) {
      const kd = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
      plateX += kd * 380 * dt;
      plateX = Math.max(-LW / 2 + 40, Math.min(LW / 2 - 40, plateX));
      spawnT -= dt;
      if (spawnT <= 0 && falling.length < 2) {
        const w = 100 + Math.random() * 50 - Math.min(30, cake.length);
        falling.push({ x: (Math.random() - 0.5) * (LW - w - 40), y: camY + LH + 20, w, f: FLAVORS[Math.floor(Math.random() * FLAVORS.length)], rot: (Math.random() - .5) * 0.3 });
        spawnT = Math.max(0.9, 2.2 - cake.length * 0.05);
      }
      for (const L of falling) {
        const prev = L.y;
        L.y -= fallSpeed() * dt; L.rot *= 0.98;
        const top = cakeTop(), topLayer = cake[cake.length - 1];
        const topX = plateX + (topLayer ? topLayer.off : 0), topW = topLayer ? topLayer.w : 170;
        if (prev >= top && L.y <= top && !L.missed) {
          const off = L.x - topX;
          if (Math.abs(off) < (topW / 2 + L.w / 2) * 0.62) {
            L.done = true;
            const rel = (topLayer ? topLayer.off : 0) + (Math.abs(off) < 6 ? 0 : off);
            cake.push({ off: rel, w: L.w, f: L.f });
            wob = Math.min(1, Math.abs(off) / 40) * 6 + 2;
            audio.sfx(Math.abs(off) < 6 ? 988 : 523, 0.18, 'sine', 0.08, Math.abs(off) < 6 ? 1318 : 0);
            const u = unstable();
            if (u) {
              const b = cake[u.i - 1];
              topple = { i: u.i, side: u.side, ang: 0, av: 0, px: b.off + u.side * b.w / 2, py: 20 + u.i * LH_ };
              audio.sfx(300, 0.8, 'triangle', 0.08, 80);
            }
          } else L.missed = true;
        }
        if (L.y < camY - 60 && !L.done) {
          L.done = true; lives--;
          splats.push({ x: L.x, life: 1.5, col: L.f.body });
          audio.sfx(200, 0.3, 'sawtooth', 0.06, 80);
          if (lives <= 0) end('Kitchen closed');
        }
      }
      falling = falling.filter(L => !L.done);
    }
    if (topple) { topple.av += 3 * dt; topple.ang += topple.av * dt; if (topple.ang > 1.3) end('Splat!'); }
    const target = Math.max(0, cakeTop() - LH * 0.45);
    camY += (target - camY) * Math.min(1, dt * 3);
    wob = Math.max(0, wob - dt * 8);
    for (const s of splats) s.life -= dt;
    splats = splats.filter(s => s.life > 0);
  }

  const sy = y => LH * 0.88 - (y - camY);
  function layer(x, yBottom, w, f, wobble) {
    const yTop = sy(yBottom + LH_);
    ctx.fillStyle = f.body;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - w / 2 + wobble, yTop, w, LH_, 6) : ctx.rect(x - w / 2 + wobble, yTop, w, LH_); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(x - w / 2 + wobble, yTop + LH_ - 8, w, 6);
    // cream with drips
    ctx.fillStyle = f.cream;
    ctx.fillRect(x - w / 2 + wobble, yTop, w, 7);
    for (let k = 0; k < w / 14; k++) {
      const dx = x - w / 2 + wobble + 6 + k * 14, dl = 4 + ((k * 7 + Math.round(w)) % 5) * 2;
      ctx.beginPath(); ctx.arc(dx, yTop + 6 + dl / 2, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(dx - 4, yTop + 5, 8, dl / 2);
    }
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#fde4e1'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.scale(S, S);
    // wallpaper stripes + polka dots
    for (let x = 0; x < LW; x += 40) { ctx.fillStyle = (x / 40) % 2 ? '#fbd5d1' : '#fde4e1'; ctx.fillRect(x, 0, 40, LH); }
    ctx.fillStyle = '#ffffff88';
    for (let y = -40; y < LH + 40; y += 46) for (let x = 0; x < LW + 40; x += 40) ctx.fillRect(x + 18, ((y + camY * 0.3) % (LH + 80)) - 40, 4, 4);
    // counter
    const counterY = sy(0);
    ctx.fillStyle = '#c99a7a'; ctx.fillRect(0, counterY + 6, LW, 400);
    ctx.fillStyle = '#e0b998'; ctx.fillRect(0, counterY, LW, 10);
    for (const s of splats) { ctx.globalAlpha = Math.min(1, s.life); ctx.fillStyle = s.col; ctx.beginPath(); ctx.ellipse(LW / 2 + s.x, counterY + 4, 40, 8, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.save(); ctx.translate(LW / 2, 0);
    // cake stand
    ctx.fillStyle = '#ffffff'; ctx.fillRect(plateX - 10, counterY - 14, 20, 14);
    ctx.fillStyle = '#e9e4f0'; ctx.beginPath(); ctx.ellipse(plateX, sy(14), 100, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(plateX, sy(18), 100, 9, 0, 0, Math.PI * 2); ctx.fill();
    // stacked layers (wobble decays upward)
    cake.forEach((L, i) => {
      if (topple && i >= topple.i) return;
      const wobble = Math.sin(t * 30) * wob * (i / Math.max(1, cake.length));
      layer(plateX + L.off, 20 + i * LH_, L.w, L.f, wobble);
    });
    if (topple) {
      const px = plateX + topple.px;
      ctx.save(); ctx.translate(px, sy(topple.py)); ctx.rotate(topple.side * topple.ang); ctx.translate(-px, -sy(topple.py));
      for (let i = topple.i; i < cake.length; i++) layer(plateX + cake[i].off, 20 + i * LH_, cake[i].w, cake[i].f, 0);
      ctx.restore();
    }
    // cherry on top
    if (cake.length && !topple) {
      const tl = cake[cake.length - 1];
      ctx.fillStyle = '#c4213a'; ctx.beginPath(); ctx.arc(plateX + tl.off, sy(cakeTop()) - 8, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#4b7a3a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(plateX + tl.off, sy(cakeTop()) - 15); ctx.quadraticCurveTo(plateX + tl.off + 4, sy(cakeTop()) - 26, plateX + tl.off + 10, sy(cakeTop()) - 28); ctx.stroke();
    }
    for (const L of falling) {
      ctx.save(); ctx.translate(L.x, sy(L.y + LH_ / 2)); ctx.rotate(L.rot); ctx.translate(-L.x, -sy(L.y + LH_ / 2));
      layer(L.x, L.y, L.w, L.f, 0);
      ctx.restore();
      // shadow marker on the cake top
      ctx.fillStyle = 'rgba(107,59,59,.15)'; ctx.fillRect(L.x - L.w / 2, sy(cakeTop()) - 2, L.w, 3);
    }
    ctx.restore();
    ctx.restore();
    $('score').textContent = cake.length;
    $('lives').textContent = '🍒'.repeat(Math.max(0, lives)) + '·'.repeat(3 - Math.max(0, lives));
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
