<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2240">
<title>Word Guess</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1b2240; color: #fff;
    font-family: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
  .dim { background: radial-gradient(ellipse at 50% 40%, rgba(14,18,44,.55), rgba(5,7,20,.86)); }
  .ic { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -0.2em; }
  .ic svg { width: 100%; height: 100%; display: block; }

  /* ---------- menu ---------- */
  #menu { background: linear-gradient(180deg, rgba(8,10,30,.42), rgba(8,10,30,.05) 30%, rgba(8,10,30,.08) 62%, rgba(6,8,24,.7)); padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); }
  .mwrap { width: 100%; height: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .mhead { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 34px; }
  .tag { font-size: 12px; font-weight: 800; letter-spacing: 6px; color: #fff6dc; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .lrow { display: flex; gap: 6px; perspective: 600px; }
  .lt { --s: clamp(44px, 12.4vw, 68px); width: var(--s); height: var(--s); border-radius: calc(var(--s) * .2); display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--s) * .6); font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25);
    box-shadow: 0 5px 0 var(--d), 0 9px 16px rgba(0,0,0,.35), inset 0 3px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(0,0,0,.12);
    background: linear-gradient(180deg, var(--a), var(--b)); animation: flipIn .7s cubic-bezier(.3,1.4,.5,1) backwards, bob 4s ease-in-out infinite; will-change: transform; }
  .lt.g { --a: #8be07c; --b: #3fa34a; --d: #23702c; } .lt.y { --a: #ffe07a; --b: #e2a521; --d: #9a6a08; } .lt.x { --a: #a9b2c2; --b: #6b7486; --d: #3f4656; }
  .lt.w { --a: #ffffff; --b: #e3e8f0; --d: #9aa3b4; color: #1d2333; text-shadow: none; }
  @keyframes flipIn { 0% { transform: rotateX(90deg) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3px; } }
  #demoSlot { flex: 1 1 auto; width: 100%; min-height: 90px; }
  .mfoot { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .chap { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 16px; border-radius: 16px; background: rgba(10,14,36,.55); border: 1px solid rgba(255,255,255,.14); min-width: 250px; }
  .chap .cn { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #ffe08a; }
  .chap .dots { display: flex; gap: 5px; }
  .chap .dots i { width: 18px; height: 18px; border-radius: 6px; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 9px; font-weight: 900; color: rgba(255,255,255,.55); }
  .chap .dots i.s1 { background: linear-gradient(#ffe07a, #d89a1c); color: #5a3a00; } .chap .dots i.s0 { background: linear-gradient(#a9b2c2, #6b7486); color: #fff; }
  .chap .dots i.cur { outline: 2px solid #fff; outline-offset: 1px; background: linear-gradient(#8be07c, #3fa34a); color: #fff; animation: pulseDot 1.2s ease-in-out infinite; }
  .chap .dots i.sp { border-radius: 50%; }
  @keyframes pulseDot { 50% { transform: scale(1.15); } }
  .btn { border: none; cursor: pointer; color: #fff; font-weight: 900; letter-spacing: 3px; font-size: 22px; padding: 14px 42px; border-radius: 20px;
    background: linear-gradient(180deg, #96ea86, #45b552 52%, #2f8a3b); text-shadow: 0 2px 0 rgba(0,0,0,.25);
    box-shadow: 0 6px 0 #1f5e28, 0 12px 26px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.55); transition: transform .08s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f5e28, 0 6px 12px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.55); }
  .btn.big { font-size: 24px; padding: 15px 34px; min-width: 260px; position: relative; }
  .btn.big::after { content: ''; position: absolute; inset: -6px; border-radius: 24px; box-shadow: 0 0 30px 6px rgba(120,235,130,.55); opacity: 0; animation: glow 1.8s ease-in-out infinite; pointer-events: none; will-change: opacity; }
  .btn small { display: block; font-size: 12px; letter-spacing: 2px; opacity: .92; margin-top: 2px; }
  .btn.gold { background: linear-gradient(180deg, #ffe58a, #f2b630 52%, #c88512); box-shadow: 0 6px 0 #8a5a08, 0 12px 26px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.6); color: #4a2c00; text-shadow: 0 1px 0 rgba(255,255,255,.4); }
  .btn.gray { background: linear-gradient(180deg, #b6bfcf, #7a8496 55%, #5d6678); box-shadow: 0 6px 0 #3a4152, 0 12px 26px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.5); }
  .btn[disabled] { filter: grayscale(.8) brightness(.8); }
  @keyframes glow { 50% { opacity: 1; } }
  .mrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .sbtn { cursor: pointer; border: 1px solid rgba(255,255,255,.24); background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.08)); color: #fff; font-weight: 800; letter-spacing: 1.5px;
    font-size: 13px; padding: 10px 13px; border-radius: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.25); background-color: rgba(14,18,44,.45); }
  .sbtn:active { transform: translateY(2px); }
  .sbtn .ic { margin-right: 5px; }
  .mstat { font-size: 13px; font-weight: 700; color: #eef2ff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .mstat b { color: #ffe08a; }
  .coins { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 14px; z-index: 12; font-size: 17px; font-weight: 900; color: #ffe8a0; padding: 6px 12px 6px 8px; border-radius: 20px;
    background: rgba(10,14,36,.6); border: 1px solid rgba(255,255,255,.18); text-shadow: 0 1px 2px #000; display: flex; align-items: center; gap: 6px; }
  .coins .ic { width: 22px; height: 22px; }

  /* ---------- cards ---------- */
  .card { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; touch-action: pan-y; padding: 20px 18px 18px; border-radius: 26px;
    background: linear-gradient(180deg, rgba(40,48,88,.95), rgba(20,25,52,.97)); border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14); display: flex; flex-direction: column; align-items: center; gap: 12px; animation: cardIn .45s cubic-bezier(.2,1.3,.4,1); }
  .overlay.hidden .card { animation: none; }
  @keyframes cardIn { 0% { transform: translateY(30px) scale(.92); opacity: 0; } }
  .ch { font-size: 26px; font-weight: 900; letter-spacing: 3px; color: #ffe08a; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
  .csub { font-size: 13px; color: #c8d0ea; font-weight: 700; letter-spacing: 1px; }
  .close { cursor: pointer; border: none; background: rgba(255,255,255,.12); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; font-weight: 900; align-self: flex-end; margin-bottom: -40px; }
  .rtitle { font-size: clamp(30px, 9vw, 42px); font-weight: 900; letter-spacing: 2px; line-height: 1;
    background: linear-gradient(180deg, #fff, #ffe08a 45%, #f2a12a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); animation: pop .6s cubic-bezier(.2,1.6,.4,1) backwards; }
  .rtitle.lose { background: linear-gradient(180deg, #fff, #c6d2f0 50%, #8ea0d0); -webkit-background-clip: text; background-clip: text; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } }
  .tiles { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; perspective: 500px; }
  .tiles + .tiles { margin-top: -4px; }
  .tl { --s: 40px; width: var(--s); height: var(--s); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: calc(var(--s) * .58); color: #fff;
    background: linear-gradient(180deg, var(--a), var(--b)); box-shadow: 0 4px 0 var(--d), inset 0 2px 0 rgba(255,255,255,.4); animation: flipIn .55s backwards; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .tl.g { --a: #8be07c; --b: #3fa34a; --d: #23702c; } .tl.y { --a: #ffe07a; --b: #e2a521; --d: #9a6a08; } .tl.x { --a: #a9b2c2; --b: #6b7486; --d: #3f4656; } .tl.b { --a: #8fb4ff; --b: #4a6fd8; --d: #2a3f8a; }
  .hc .tl.g, .hc .lt.g { --a: #ffb27a; --b: #f2702a; --d: #a8461a; } .hc .tl.y, .hc .lt.y { --a: #a8d6ff; --b: #3d8fe0; --d: #23588f; }
  .rl, .rr { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .stars { display: flex; gap: 8px; align-items: flex-end; }
  .stars .st .ic { width: 100%; height: 100%; display: block; }
  .stars .st { width: 44px; height: 44px; opacity: .25; filter: grayscale(1); }
  .stars .st:nth-child(2) { width: 56px; height: 56px; }
  .stars .st.on { opacity: 1; filter: none; animation: starIn .5s cubic-bezier(.2,1.8,.4,1) backwards; }
  @keyframes starIn { 0% { transform: scale(2.4) rotate(-40deg); opacity: 0; } }
  .mg { display: flex; gap: 16px; justify-content: center; }
  .mgrid { display: grid; gap: 3px; }
  .mgrid i { width: 14px; height: 14px; border-radius: 3px; background: #4a5268; display: block; }
  .mgrid i.c { background: #4cb556; } .mgrid i.p { background: #e8b42a; } .mgrid i.e { background: rgba(255,255,255,.08); }
  .hc .mgrid i.c { background: #f2702a; } .hc .mgrid i.p { background: #3d8fe0; }
  .rew { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .pill { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 16px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.12); font-weight: 900; font-size: 17px; }
  .pill .ic { width: 22px; height: 22px; }
  .pill.coin { color: #ffe08a; } .pill.fire { color: #ffb36a; } .pill.lost { color: #9aa6c8; font-size: 13px; }
  .glist { width: 100%; display: flex; flex-direction: column; gap: 7px; }
  .goal { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; padding: 8px 12px; border-radius: 14px; background: rgba(0,0,0,.22); text-align: left; font-size: 13px; font-weight: 700; }
  .goal .bar { grid-column: 1 / 3; height: 7px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
  .goal .bar b { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #6fd36c, #b8f07a); transition: width .8s; }
  .goal .rw { color: #ffe08a; font-weight: 900; display: flex; align-items: center; gap: 4px; } .goal .rw .ic { width: 16px; height: 16px; }
  .goal.done { background: linear-gradient(90deg, rgba(80,200,90,.35), rgba(80,200,90,.12)); animation: pop .5s backwards; }
  .goal.done .rw { color: #b8ffb0; }
  .achs { display: grid; grid-template-columns: 1fr; gap: 6px; width: 100%; margin-top: 6px; }
  .ach { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 14px; background: rgba(0,0,0,.22); text-align: left; font-size: 12px; color: #b8c2e0; }
  .ach .md { width: 34px; height: 34px; filter: grayscale(1) brightness(.6); opacity: .6; }
  .ach b { display: block; color: #fff; font-size: 13px; } .ach em { font-style: normal; font-weight: 900; color: #ffe08a; font-size: 12px; }
  .ach .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 4px; } .ach .bar b { height: 100%; background: linear-gradient(90deg, #ffc42a, #ffe58a); }
  .ach.got .md { filter: none; opacity: 1; } .ach.got { background: linear-gradient(90deg, rgba(255,196,42,.22), rgba(0,0,0,.2)); } .ach.got em { color: #b8ffb0; }
  .ach.fresh { animation: pop .5s backwards; }
  .sec { font-size: 11px; font-weight: 900; letter-spacing: 3px; color: #9fb0dc; align-self: flex-start; }
  .sgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
  .sgrid div { background: rgba(0,0,0,.24); border-radius: 14px; padding: 8px 2px; font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #b8c2e0; }
  .sgrid b { display: block; font-size: 24px; color: #fff; letter-spacing: 0; }
  .hist { width: 100%; display: flex; flex-direction: column; gap: 5px; }
  .hist .hr { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 13px; }
  .hist .hr > span { width: 14px; text-align: right; color: #c8d0ea; }
  .hist .hb { height: 22px; min-width: 26px; border-radius: 6px; background: linear-gradient(90deg, #6b7486, #8a93a6); display: flex; align-items: center; justify-content: flex-end; padding-right: 7px; font-size: 13px; transition: width .7s cubic-bezier(.2,1,.3,1); }
  .hist .hb.me { background: linear-gradient(90deg, #3fa34a, #7ad66f); }
  .hc .hist .hb.me { background: linear-gradient(90deg, #c4561a, #ffab6e); }
  .xs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; width: 100%; font-size: 13px; color: #c8d0ea; text-align: left; font-weight: 700; }
  .xs b { float: right; color: #fff; }
  /* shop */
  .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .th { position: relative; border-radius: 16px; overflow: hidden; background: rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.12); cursor: pointer; display: flex; flex-direction: column; }
  .th canvas { width: 100%; aspect-ratio: 16 / 10; display: block; }
  .th .tn { font-size: 13px; font-weight: 900; letter-spacing: 2px; padding: 6px 4px 2px; }
  .th .tb { margin: 4px 8px 8px; padding: 6px; border-radius: 10px; font-size: 12px; font-weight: 900; letter-spacing: 1px; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; gap: 4px; }
  .th .tb .ic { width: 15px; height: 15px; }
  .th.own .tb { background: rgba(80,200,90,.3); } .th.eq { border-color: #7ad66f; box-shadow: 0 0 18px rgba(122,214,111,.45); } .th.eq .tb { background: linear-gradient(#7ad66f, #3fa34a); }
  .th.lock .tb { background: linear-gradient(#ffe07a, #e2a521); color: #4a2c00; } .th.lock.poor .tb { filter: grayscale(.7); opacity: .7; }
  .th.lock canvas { filter: saturate(.75) brightness(.8); }
  /* how to */
  .how { text-align: left; font-size: 14px; font-weight: 600; color: #dfe5f8; line-height: 1.45; width: 100%; display: flex; flex-direction: column; gap: 9px; }
  .how b { color: #fff; } .how .tiles { justify-content: flex-start; } .how .tl { --s: 34px; animation: none; }
  .how ul { padding-left: 18px; } .how li { margin: 2px 0; }
  .tog { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 9px 14px; border-radius: 14px; background: rgba(0,0,0,.24); font-weight: 800; font-size: 14px; letter-spacing: 1px; cursor: pointer; }
  .tog i { width: 46px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.2); position: relative; transition: background .2s; }
  .tog i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; }
  .tog.on i { background: #4cb556; } .tog.on i::after { left: 23px; }
  .pbtns { display: flex; flex-direction: column; gap: 12px; width: 100%; align-items: center; }
  .pbtns .btn { width: 100%; max-width: 300px; }
  #dtoast { position: fixed; left: 50%; top: 22%; transform: translate(-50%, 0); z-index: 30; padding: 10px 18px; border-radius: 14px; background: rgba(255,255,255,.95); color: #1d2333; font-weight: 900; letter-spacing: 1px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #dtoast.on { opacity: 1; }
  #legend { position: fixed; left: 50%; top: max(70px, calc(env(safe-area-inset-top) + 64px)); transform: translate(-50%, 0); z-index: 9; width: min(360px, calc(100% - 24px)); padding: 12px 14px; border-radius: 18px;
    background: rgba(18,22,48,.93); border: 1px solid rgba(255,255,255,.2); box-shadow: 0 14px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 7px; font-size: 13px; font-weight: 700; text-align: left; transition: opacity .4s, transform .4s; }
  #legend.hidden { opacity: 0; transform: translate(-50%, -20px); pointer-events: none; }
  #legend .lr { display: flex; align-items: center; gap: 10px; } #legend .tl { --s: 28px; animation: none; border-radius: 7px; }
  @media (max-aspect-ratio: 1/1) { .overlay.dim { padding-bottom: max(62px, env(safe-area-inset-bottom)); } }
  @media (min-aspect-ratio: 4/3) {
    .mwrap { max-width: 1100px; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(300px, 1.1fr); grid-template-rows: auto 1fr; grid-template-areas: "head demo" "foot demo"; column-gap: 24px; }
    .mhead { grid-area: head; padding-top: 18px; } .mfoot { grid-area: foot; justify-content: flex-start; padding-top: 10px; } #demoSlot { grid-area: demo; height: auto; margin-top: 52px; }
  }
  @media (max-height: 700px) { .mhead { padding-top: 46px; gap: 6px; } .tag { display: none; } .lt { --s: clamp(38px, 10.5vw, 54px); } .chap { padding: 6px 12px; } .btn.big { padding: 12px 30px; } .card { padding: 16px 14px 14px; gap: 9px; } }
  @media (max-height: 520px) {
    .overlay { padding: 8px 12px; } .tag { display: none; } .mhead { padding-top: 4px; } .lt { --s: 38px; } .lrow { gap: 4px; } .logo { gap: 4px; }
    .mfoot { gap: 7px; padding-top: 4px; } .btn.big { font-size: 19px; padding: 9px 26px; min-width: 220px; } .btn { font-size: 18px; padding: 10px 28px; } .sbtn { padding: 7px 10px; font-size: 12px; }
    .chap { min-width: 0; padding: 5px 10px; } .chap .dots i { width: 15px; height: 15px; }
    .card { max-width: 760px; padding: 12px 14px; gap: 7px; border-radius: 20px; } .ch { font-size: 20px; } .rtitle { font-size: 28px; }
    #res .card { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; align-items: center; justify-items: center; }
    #res .card > .rl { grid-column: 1; } #res .card > .rr { grid-column: 2; }
    .stars .st { width: 32px; height: 32px; } .stars .st:nth-child(2) { width: 40px; height: 40px; } .tl { --s: 32px; }
    .mgrid i { width: 10px; height: 10px; } .sgrid b { font-size: 19px; } .hist .hb { height: 17px; } .shop { grid-template-columns: repeat(3, 1fr); gap: 8px; } .th canvas { aspect-ratio: 16 / 7; object-fit: cover; } .th .tn { font-size: 11px; padding: 3px 4px 0; } .th .tb { margin: 3px 6px 6px; padding: 4px; }
    .goal { padding: 5px 10px; font-size: 12px; } #pause .sec, #pause .glist { display: none; } .tog { padding: 6px 12px; } .how { font-size: 12.5px; gap: 5px; } .how .tl { --s: 26px; }
    #stats .card, #goals .card, #how .card, #pause .card { max-width: 600px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="coins" id="coinsTop"></div>
<div class="overlay" id="menu">
  <div class="mwrap">
    <div class="mhead">
      <div class="tag">THE ENDLESS WORD PUZZLE</div>
      <div class="logo" id="logo"></div>
    </div>
    <div id="demoSlot"></div>
    <div class="mfoot">
      <div class="chap" id="chapCard"></div>
      <button class="btn big" id="startBtn">PLAY</button>
      <div class="mrow">
        <button class="sbtn" id="shopBtn"></button><button class="sbtn" id="statsBtn"></button><button class="sbtn" id="goalsBtn"></button><button class="sbtn" id="howBtn"></button>
      </div>
      <div class="mstat" id="menuStat"></div>
    </div>
  </div>
</div>
<div class="overlay hidden dim" id="res"><div class="card" id="resCard"></div></div>
<div class="overlay hidden dim" id="stats"><div class="card" id="statsCard"></div></div>
<div class="overlay hidden dim" id="shop"><div class="card" id="shopCard"></div></div>
<div class="overlay hidden dim" id="goals"><div class="card" id="goalsCard"></div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }
        else if (p.shape === 'heart') { ctx.rotate(p.rot * .2); heart(ctx, p.size); }
        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * (.4 + k * .6), 0, TAU); ctx.fill(); }
        ctx.restore(); ctx.shadowBlur = 0;
      }
      for (const t of texts) {
        const age = t.max - t.life, pop = age < .18 ? 1 + Math.sin(age / .18 * Math.PI) * .45 : 1, a = Math.min(1, t.life / t.max * 2.2);
        ctx.save(); ctx.globalAlpha = a; ctx.translate(t.x, t.y); ctx.scale(pop, pop); if (t.wobble) ctx.rotate(Math.sin(age * 20) * t.wobble);
        ctx.font = t.font + t.size + 'px "Avenir Next", "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, t.size * .16); ctx.strokeStyle = t.stroke; ctx.strokeText(t.str, 0, 0); ctx.fillStyle = t.c; ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },
    drawFlash(ctx, W, H) { if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  };
})();
/*FX-END*/

  // ---------- words: answer pools, level generator ----------
  const BLOCK = new Set(
    'john mike peter tony smith trump china japan jersey google yahoo twitter amazon intel ford roman chile august harry potter marvel bush gonna wanna gotta yeah okay lbs mph xxx dude'.split(
      ' '
    )
  );
  const answerOK = w => !BLOCK.has(w) && /[aeiouy]/.test(w) && !(/s$/.test(w) && !/(ss|us|is)$/.test(w)) && !(/ed$/.test(w) && !/eed$/.test(w));
  const POOL = {},
    RANKS = {};
  for (const L of [4, 5, 6, 7]) {
    POOL[L] = WordKit.wordsOfLength(L)
      .filter(answerOK)
      .sort((a, b) => WordKit.rank(a) - WordKit.rank(b));
    RANKS[L] = POOL[L].map(w => WordKit.rank(w));
  }
  const lowerBound = (arr, v) => {
    let lo = 0,
      hi = arr.length;
    while (lo < hi) {
      const m = (lo + hi) >> 1;
      if (arr[m] < v) lo = m + 1;
      else hi = m;
    }
    return lo;
  };
  const TPOOL = WordKit.themeNames()
    .map(n => ({
      n,
      w: WordKit.theme(n)
        .map(x => x.toLowerCase())
        .filter(w => w.length >= 4 && w.length <= 7 && /^[a-z]+$/.test(w) && WordKit.rank(w) >= 0)
    }))
    .filter(t => t.w.length >= 5);
  const SPECIALS = ['double', 'speed', 'hard', 'theme'];
  const SPECIAL_INFO = {
    double: { name: 'DOUBLE TROUBLE', sub: 'Two words at once · 7 guesses', col: '#ff9ad0' },
    speed: { name: 'SPEED ROUND', sub: '3 minutes · solve as many as you can', col: '#7ad8ff' },
    hard: { name: 'HARD MODE', sub: 'Every revealed hint must be used', col: '#ff8a6a' },
    theme: { name: 'THEME WORD', sub: '', col: '#b8a0ff' }
  };
  const WINDOW = 800;
  const SPEC = [null],
    HIST = new Map();
  const maxRankFor = n => Math.min(7431, Math.round(650 + n * 16 + Math.pow(n, 1.3) * 0.9));
  function lenFor(n, r) {
    if (n <= 2) return 4;
    if (n < 10) return n % 4 === 3 ? 4 : 5;
    const p7 = n >= 24 ? Math.min(0.24, 0.05 + (n - 24) * 0.0025) : 0,
      p6 = Math.min(0.32, 0.1 + (n - 10) * 0.004),
      p4 = Math.max(0.08, 0.18 - n * 0.0008),
      x = r();
    return x < p7 ? 7 : x < p7 + p6 ? 6 : x < p7 + p6 + p4 ? 4 : 5;
  }
  function pickAnswer(L, maxRank, r, n, avoid) {
    const pool = POOL[L];
    let cnt = Math.min(pool.length, Math.max(40, lowerBound(RANKS[L], maxRank)));
    for (let round = 0; round < 10; round++) {
      for (let k = 0; k < 24; k++) {
        const w = pool[Math.floor(r() * cnt)],
          last = HIST.get(w);
        if ((last === undefined || n - last > WINDOW) && !(avoid && avoid.includes(w))) return w;
      }
      cnt = Math.min(pool.length, Math.ceil(cnt * 1.5));
    }
    let best = pool[0],
      bl = Infinity;
    for (const w of pool) {
      const l = HIST.has(w) ? HIST.get(w) : -1;
      if (l < bl && !(avoid && avoid.includes(w))) {
        bl = l;
        best = w;
      }
    }
    return best;
  }
  function genSpec(n) {
    const r = WordKit.rng(n * 7919 + 1305),
      type = n % 5 === 0 ? SPECIALS[(n / 5 - 1) % 4] : 'normal',
      mr = maxRankFor(n);
    const s = { n, type, chapter: Math.floor((n - 1) / 10), rows: 6, answers: [], theme: null, mr, len: 5 };
    if (type === 'double') {
      s.len = n < 25 ? 4 : 5;
      s.rows = 7;
      const a = pickAnswer(s.len, mr, r, n);
      s.answers = [a, pickAnswer(s.len, mr, r, n, [a])];
    } else if (type === 'theme') {
      const order = WordKit.shuffle(TPOOL.slice(), r);
      for (const t of order) {
        const ws = t.w.filter(w => {
          const l = HIST.get(w);
          return l === undefined || n - l > WINDOW;
        });
        if (ws.length) {
          s.theme = t.n;
          s.answers = [ws[Math.floor(r() * ws.length)]];
          break;
        }
      }
      if (!s.answers.length) {
        s.theme = order[0].n;
        s.answers = [order[0].w[Math.floor(r() * order[0].w.length)]];
      }
      s.len = s.answers[0].length;
    } else if (type === 'speed') {
      s.len = n < 30 ? 4 : 5;
      s.time = 180;
    } else {
      s.len = lenFor(n, r);
      if (type === 'hard') s.len = Math.max(5, s.len);
      s.answers = [pickAnswer(s.len, mr, r, n)];
    }
    for (const a of s.answers) HIST.set(a, n);
    return s;
  }
  const getSpec = n => {
    while (SPEC.length <= n) SPEC.push(genSpec(SPEC.length));
    return SPEC[n];
  };
  // speed words never touch HIST (so the main sequence stays deterministic), they only avoid recent answers
  function speedWords(s) {
    if (s.words) return s.words;
    const r = WordKit.rng(s.n * 104729 + 77),
      L = s.len,
      pool = POOL[L],
      cnt = Math.min(pool.length, Math.max(140, lowerBound(RANKS[L], s.mr * 0.7)));
    const recent = new Set();
    for (let i = Math.max(1, s.n - 60); i < s.n; i++) getSpec(i).answers.forEach(a => recent.add(a));
    const out = [];
    let guard = 0;
    while (out.length < 40 && guard++ < 5000) {
      const w = pool[Math.floor(r() * cnt)];
      if (!out.includes(w) && !recent.has(w)) out.push(w);
    }
    return (s.words = out);
  }

  // ---------- feedback + solver bot (filters candidates by every clue, scores by letter frequency) ----------
  function score(g, a) {
    const L = g.length,
      res = new Array(L).fill(0),
      cnt = {};
    for (let i = 0; i < L; i++) {
      if (g[i] === a[i]) res[i] = 2;
      else cnt[a[i]] = (cnt[a[i]] || 0) + 1;
    }
    for (let i = 0; i < L; i++)
      if (res[i] !== 2 && cnt[g[i]] > 0) {
        res[i] = 1;
        cnt[g[i]]--;
      }
    return res;
  }
  const rkey = r => r.join('');
  const OPENERS = {};
  function rankWords(cands, list) {
    const L = cands[0].length,
      pres = {},
      pos = Array.from({ length: L }, () => ({}));
    for (const w of cands) {
      const seen = new Set();
      for (let i = 0; i < L; i++) {
        const c = w[i];
        pos[i][c] = (pos[i][c] || 0) + 1;
        if (!seen.has(c)) {
          seen.add(c);
          pres[c] = (pres[c] || 0) + 1;
        }
      }
    }
    return list
      .map(w => {
        let s = 0;
        const seen = new Set();
        for (let i = 0; i < L; i++) {
          const c = w[i];
          s += (pos[i][c] || 0) * 0.45;
          if (!seen.has(c)) {
            seen.add(c);
            s += pres[c] || 0;
          }
        }
        return [w, s];
      })
      .sort((a, b) => b[1] - a[1]);
  }
  const openers = L =>
    OPENERS[L] ||
    (OPENERS[L] = rankWords(POOL[L], POOL[L].slice(0, 900))
      .slice(0, 12)
      .map(x => x[0]));
  const makeBot = L => ({ L, cands: POOL[L].slice(), hist: [] });
  function botGuess(bot, variety = true) {
    if (!bot.hist.length) return variety ? pick(openers(bot.L).slice(0, 8)) : openers(bot.L)[0];
    const c = bot.cands;
    if (c.length <= 2) return c[0];
    const ranked = rankWords(c, c);
    return variety && ranked.length > 3 && Math.random() < 0.3 ? ranked[1][0] : ranked[0][0];
  }
  function botUpdate(bot, g, res) {
    const k = rkey(res);
    bot.hist.push([g, k]);
    bot.cands = bot.cands.filter(w => w !== g || k === rkey(res.map(() => 2))).filter(w => rkey(score(g, w)) === k);
    if (!bot.cands.length) bot.cands = WordKit.wordsOfLength(bot.L).filter(w => bot.hist.every(([hg, hk]) => rkey(score(hg, w)) === hk));
  }

  // ---------- a play session (also drives the attract demo) ----------
  function newSession(spec, attract) {
    const S = {
      spec,
      attract,
      len: spec.len,
      rows: spec.rows,
      guesses: [],
      cur: '',
      boards: [],
      keys: [],
      hints: [],
      removed: new Set(),
      t: 0,
      reveal: null,
      pop: [],
      shakeT: -9,
      done: false,
      usedHint: false,
      extra: 0,
      stag: attract ? 0.2 : spec.type === 'speed' ? 0.13 : 0.27,
      dur: spec.type === 'speed' ? 0.3 : 0.42,
      boardIn: -9,
      bounce: [],
      showAns: -1e9
    };
    const ans = spec.type === 'speed' ? [speedWords(spec)[0]] : spec.answers;
    ans.forEach(a => addBoard(S, a));
    return S;
  }
  function addBoard(S, a) {
    S.boards.push({ ans: a, res: [], solved: -1 });
    S.keys.push({});
    S.hints.push({});
    S.bounce.push(null);
  }
  const keyState = (S, b, ch) => Math.max(S.keys[b][ch] || 0, S.removed.has(ch) ? 1 : 0);
  function typeLetter(S, ch) {
    if (S.reveal || S.done || S.cur.length >= S.len) return false;
    S.cur += ch;
    S.pop[S.cur.length - 1] = S.t;
    return true;
  }
  function backspace(S) {
    if (S.reveal || S.done || !S.cur.length) return false;
    S.cur = S.cur.slice(0, -1);
    return true;
  }
  function hardCheck(S, g) {
    for (const b of S.boards) {
      if (b.solved >= 0) continue;
      for (let i = 0; i < b.res.length; i++) {
        const res = b.res[i],
          gw = S.guesses[i],
          need = {};
        for (let j = 0; j < S.len; j++) if (res[j] === 2 && g[j] !== gw[j]) return ordinal(j + 1) + ' letter must be ' + gw[j].toUpperCase();
        for (let j = 0; j < S.len; j++) if (res[j] > 0) need[gw[j]] = (need[gw[j]] || 0) + 1;
        for (const c in need) if (g.split(c).length - 1 < need[c]) return 'Guess must contain ' + c.toUpperCase();
      }
    }
    return null;
  }
  function validate(S, g) {
    if (g.length < S.len) return 'Not enough letters';
    if (!WordKit.isWord(g) && !S.boards.some(b => b.ans === g)) return 'Not in word list';
    if (S.spec.type === 'hard') return hardCheck(S, g);
    return null;
  }
  function applyGuess(S, g) {
    S.guesses.push(g);
    for (const b of S.boards) if (b.solved < 0) b.res.push(score(g, b.ans));
  }
  function submit(S) {
    if (S.reveal || S.done) return 'busy';
    const g = S.cur,
      err = validate(S, g);
    if (err) {
      S.shakeT = S.t;
      return err;
    }
    applyGuess(S, g);
    S.cur = '';
    S.reveal = { row: S.guesses.length - 1, t: 0, played: 0 };
    return null;
  }
  // after the flip: keyboard colors, solved boards, outcome
  function settleRow(S, row) {
    const g = S.guesses[row],
      newly = [];
    S.boards.forEach((b, bi) => {
      const res = b.res[row];
      if (!res || (b.solved >= 0 && b.solved < row)) return;
      for (let i = 0; i < S.len; i++) {
        const st = res[i] + 1;
        if ((S.keys[bi][g[i]] || 0) < st) S.keys[bi][g[i]] = st;
      }
      if (res.every(x => x === 2)) {
        b.solved = row;
        newly.push(bi);
        S.bounce[bi] = { t: S.t, row };
      }
    });
    const out = S.boards.every(b => b.solved >= 0) ? 'win' : S.guesses.length >= S.rows ? 'lose' : 'go';
    return { out, newly };
  }

    S.t += dt;

    if (!R) return;
    R.t += dt;
    while (R.played < S.len && R.t >= R.played * S.stag + S.dur * 0.5) {
      if (S.onFlip) S.onFlip(S, R.row, R.played);
      R.played++;
    }
    if (R.t >= (S.len - 1) * S.stag + S.dur) {
      S.reveal = null;
      const o = settleRow(S, R.row);
      if (o.out !== 'go') S.done = true;
      if (S.onRow) S.onRow(S, o.out, o.newly, R.row);
    }
  }

          a = (r() - 0.5) * 8;

      return s;

    if (sk.id === 'candy')
      return (
        `<path d="M${fx + fw * 0.62} ${fy - 4} L${fx + fw * 0.78} ${fy - 4} L${fx + fw * 0.3} ${fy + fh + 4} L${fx + fw * 0.14} ${fy + fh + 4} Z" fill="#fff" opacity=".16"/>` +

          [0.86, 0.34, 1.8],
          [0.7, 0.3, 1.4]

          .map(([x, y, rr]) => `<circle cx="${fx + fw * x}" cy="${fy + fh * y}" r="${rr}" fill="#fff" opacity=".85"/>`)

        [0.8, 0.74, 6],
        [0.68, 0.84, 3.5],
        [0.86, 0.56, 2.5]

        .map(
          ([x, y, rr]) =>

      let s = '';
      for (let i = 0; i < 6; i++)

        sy = fy + fh * 0.22;

        s +
        `<path d="M${sx} ${sy - 6} Q${sx} ${sy} ${sx + 6} ${sy} Q${sx} ${sy} ${sx} ${sy + 6} Q${sx} ${sy} ${sx - 6} ${sy} Q${sx} ${sy} ${sx} ${sy - 6}Z" fill="#fff" opacity=".8"/>`
      );
    }
    if (sk.id === 'neon') {
      let s = '';
      for (let y = fy + 6; y < fy + fh; y += 7) s += `<rect x="${fx}" y="${y}" width="${fw}" height="1.2" fill="#fff" opacity=".05"/>`;

  const PRAISE = ['GENIUS!', 'MAGNIFICENT!', 'IMPRESSIVE!', 'SPLENDID!', 'GREAT!', 'PHEW!', 'CLUTCH!', 'WHEW!'];

  function drawThumb(c, sk) {
    const g = c.getContext('2d'),
      w = c.width,
      h = c.height,
      sc = buildScene(sk.id, 0, w, h, 1),
      o = SKSPR[sk.id];
    drawScene(g, sc, 3, 0, true);
    if (!o || !o.ready) return;
    const word = 'WORD',
      sts = [SAVE.set.hc ? 'hcC' : 'correct', SAVE.set.hc ? 'hcP' : 'present', 'absent', 'typed'],
      s = w * 0.17,
      x0 = w / 2 - (s * 4 + s * 0.36) / 2,
      y0 = h * 0.56 - s / 2;
    g.fillStyle = sk.panel;
    g.beginPath();
    g.roundRect ? g.roundRect(x0 - s * 0.2, y0 - s * 0.2, s * 4.76, s * 1.4, s * 0.25) : g.rect(x0 - s * 0.2, y0 - s * 0.2, s * 4.76, s * 1.4);
    g.fill();
    for (let i = 0; i < 4; i++) {
      const P = PG.tile,
        k = s / 100,
        x = x0 + i * s * 1.12;
      g.drawImage(o.tile[sts[i]], x - P.pad * k, y0 - P.pad * k, P.vw * k, P.vh * k);
      g.font = '900 ' + Math.round(s * 0.56) + 'px ' + FONT;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillStyle = i === 3 ? sk.ink.typed : sk.ink.on;
      g.fillText(word[i], x + s / 2, y0 + s * 0.5);
    }
  }

  // ---------- attract demo: the solver bot plays behind the menu (silent) ----------
  const DEMO = { S: null, bot: null, word: null, wait: 0 };
  function demoNew() {
    const r = Math.random(),
      L2 = r < 0.62 ? 5 : r < 0.82 ? 4 : 6,
      pool = POOL[L2],
      ans = pool[Math.floor(Math.random() * Math.min(500, pool.length))];
    DEMO.S = newSession({ n: 0, type: 'normal', len: L2, rows: 6, answers: [ans], chapter: 0 }, true);
    DEMO.S.boardIn = 0;
    DEMO.bot = makeBot(L2);
    DEMO.word = null;
    DEMO.wait = 0.9;
    DEMO.S.onRow = (S, out, newly, row) => {
      botUpdate(DEMO.bot, S.guesses[row], S.boards[0].res[row]);
      if (out === 'win') {
        DEMO.wait = 2.6;
        demoCelebrate();
      } else if (out === 'lose') {
        S.showAns = S.t;
        DEMO.wait = 2.6;
      } else DEMO.wait = 0.5 + Math.random() * 0.4;
    };
  }
  function demoCelebrate() {
    if (!demoRect) return;
    FX.burst(demoRect.x + demoRect.w / 2, demoRect.y + demoRect.h / 2, {
      n: 30,
      colors: ['#ff5a7a', '#ffd23a', '#4cd06a', '#4aa8ff', '#fff'],
      shape: 'square',
      size: 7,
      speed: 380,
      gravity: 500,
      life: 1.4
    });
  }
  function demoUpdate(dt) {
    const D = DEMO;
    if (!D.S) demoNew();
    const S = D.S;
    updateSession(S, dt);
    D.wait -= dt;
    if (D.wait > 0 || S.reveal) return;
    if (S.done) {
      demoNew();
      return;
    }
    if (!D.word) D.word = botGuess(D.bot);
    if (S.cur.length < D.word.length) {
      typeLetter(S, D.word[S.cur.length]);
      D.wait = 0.09 + Math.random() * 0.12;
    } else {
      if (submit(D.S)) {
        D.bot.cands = D.bot.cands.filter(w => w !== D.word);
        S.cur = '';
      }
      D.word = null;
      D.wait = 0.3;
    }
  }

  // ---------- main loop ----------
  let last = performance.now(),
    fpsN = 0,
    fpsT = 0,
    FPS = 60,
    RMS = 0;
  function update(dt) {
    sceneT += dt;
    FX.update(dt);
    if (BANNER) {
      BANNER.t += dt;
      if (BANNER.t > BANNER.life) BANNER = null;
    }
    if (TOAST) {
      TOAST.t += dt;
      if (TOAST.t > TOAST.life) TOAST = null;
    }
    coinPulse = Math.max(0, coinPulse - dt * 3);
    for (const f of FLY) {
      f.t += dt;
      if (!f.done && f.t - f.d >= 0.75) {
        f.done = true;
        coinDisp += f.v;
        coinPulse = 1;
        SND.coin(Math.round(f.t * 20));
        FX.ring(f.tx, f.ty, { r1: 26, color: '#ffe08a', width: 3, life: 0.3 });
      }
    }
    FLY = FLY.filter(f => !f.done);
    if (!FLY.length) coinDisp = SAVE.coins;
    const tl = TIMERS;
    TIMERS = [];
    for (const T of tl) {
      T.t -= dt;
      if (T.t <= 0) T.fn();
      else TIMERS.push(T);
    }
    if (mode === 'menu') demoUpdate(dt);
    else if (G) {
      updateSession(G, dt);
      if (G.speed && mode === 'play' && !G.ended && !G.tut) {
        const before = G.speed.left;
        G.speed.left -= dt;
        if (before > 10 && G.speed.left <= 10) toast('10 seconds left!', true, 1.4);
        if (G.speed.left < 10 && Math.floor(before) !== Math.floor(G.speed.left)) SND.tick(G.speed.left < 5);
        if (G.speed.left <= 0) {
          G.speed.left = 0;
          endSpeed();
        }
        if (Math.floor(before / 5) !== Math.floor(G.speed.left / 5)) saveRun();
      }
      if (G.autopilot && mode === 'play') autopilot(dt);
      if (G.tut && !G.tut.t0) G.tut.t0 = G.t;
    }
  }
  function render(dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const [ox, oy] = FX.offset();

      drawHUD(G);
      drawTutorial(G);

    FX.draw(ctx);
    drawFly();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    FX.drawFlash(ctx, W, H);
  }
  // autopilot for tests: uses the same solver bot and the real key path
  function autopilot(dt) {
    const S = G;
    S.ap = S.ap || { wait: 0.3, word: null, bots: null, key: '' };
    const A = S.ap,
      k = S.boards.map(b => b.ans).join('|') + S.rows;
    if (A.key !== k) {
      A.key = k;
      A.bots = S.boards.map(() => makeBot(S.len));
      A.seen = 0;
      A.word = null;
    }
    while (A.seen < S.guesses.length && !S.reveal) {
      const g = S.guesses[A.seen];
      S.boards.forEach((b, bi) => {
        if (b.res[A.seen]) botUpdate(A.bots[bi], g, b.res[A.seen]);
      });
      A.seen++;
    }
    A.wait -= dt;
    if (A.wait > 0 || S.reveal || S.done) return;
    if (!A.word) {
      const open = S.boards
        .map((b, bi) => [b, bi])
        .filter(([b]) => b.solved < 0)
        .sort((a, b) => A.bots[a[1]].cands.length - A.bots[b[1]].cands.length);
      A.word = open.length ? botGuess(A.bots[open[0][1]], false) : null;
      if (!A.word) return;
      if (S.cur && !A.word.startsWith(S.cur)) {
        while (S.cur.length) pressKey('back');
      }
    }
    if (S.cur.length < A.word.length) {
      pressKey(A.word[S.cur.length]);
      A.wait = 0.07;
    } else {
      pressKey('enter');
      if (S.cur.length) {
        const bad = A.word;
        A.bots.forEach(b => {
          b.cands = b.cands.filter(w => w !== bad);
        });
        while (S.cur.length) pressKey('back');
      }
      A.bots.forEach(b => {
        b.cands = b.cands.filter(w => w !== A.word || S.boards.some(x => x.ans === w));
      });
      A.word = null;
      A.wait = 0.25;
    }
  }
  function loop(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    fpsN++;
    fpsT += dt;
    if (fpsT >= 1) {
      FPS = fpsN / fpsT;
      fpsN = 0;
      fpsT = 0;
    }
    if (!paused) update(dt);
    const r0 = performance.now();
    render(dt);
    RMS = RMS * 0.95 + (performance.now() - r0) * 0.05;
    requestAnimationFrame(loop);
  }

  // ---------- test hook ----------
  window.__wg = {
    state: () => ({
      mode,
      paused,
      level: SAVE.level,
      coins: SAVE.coins,
      spec: G && G.spec,
      guesses: G && G.guesses.slice(),
      cur: G && G.cur,
      rows: G && G.rows,
      answers: G && G.boards.map(b => b.ans),
      solved: G && G.boards.map(b => b.solved),
      done: G && G.done,
      speed: G && G.speed,
      fps: FPS,
      renderMs: RMS,
      theme: SAVE.theme,
      stats: SAVE.stats
    }),
    G: () => G,
    SAVE,
    start: startGame,
    menu: toMenu,
    level: n => {
      SAVE.level = n;
      SAVE.run = null;
      saveNow();
      if (mode !== 'menu') {
        ['res', 'pause', 'offer'].forEach(hide);
        startLevel(n);
      } else updateMenu();
    },
    gen: n => getSpec(n),
    speedWords: n => speedWords(getSpec(n)),
    score,
    isWord: w => WordKit.isWord(w),
    autopilot: v => {
      if (G) {
        G.autopilot = v;
        G.ap = null;
      }
    },
    type: w => {
      for (const c of w) pressKey(c);
    },
    enter: () => pressKey('enter'),
    hint: k => useHint(k),
    coins: n => {
      SAVE.coins += n;
      coinDisp = SAVE.coins;
      saveNow();
      updateMenu();
    },
    unlockAll: () => {
      SAVE.owned = SKINS.map(s => s.id);
      saveNow();
    },
    theme: id => {
      SAVE.theme = id;
      saveNow();
      loadSkin(SKIN(id)).then(() => ensureScene(true));
      ensureScene(true);
      updateMenu();
    },
    timeLeft: s => {
      if (G && G.speed) G.speed.left = s;
    },
    keyRect: k => L.kb.keys.find(K => K.k === k),
    hintRect: id => L.hints.find(B => B.id === id),
    pauseRect: () => L.pause,
    layout: () => L,
    demo: () => DEMO.S && { guesses: DEMO.S.guesses.slice(), ans: DEMO.S.boards[0].ans },
    solveBot: (ans, maxRows = 6) => {
      const b = makeBot(ans.length),
        gs = [];
      for (let i = 0; i < maxRows; i++) {
        const g = botGuess(b, false);
        gs.push(g);
        if (g === ans) break;
        botUpdate(b, g, score(g, ans));
      }
      return gs;
    }
  };

  // ---------- boot ----------
  applyHC();
  resize();
  loadSkin(curSkin()).then(() => {
    SKINS.forEach(s => loadSkin(s));
  });
  toMenu();
  requestAnimationFrame(loop);
})();
</script>
