<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b5a74">
<title>Tri Peaks</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b4f6a; color: #fff;
    font-family: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif; font-weight: 800;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px 16px; text-align: center; transition: opacity .3s, visibility .3s; }
  svg.i { width: 1em; height: 1em; display: inline-block; vertical-align: -.14em; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; z-index: 12; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center;
    padding: max(8px, env(safe-area-inset-top)) 10px 0; pointer-events: none; transition: opacity .3s; }
  #hud > div { display: flex; align-items: center; gap: 8px; }
  .ib { pointer-events: auto; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.08)); border: 2px solid rgba(255,255,255,.55);
    box-shadow: 0 3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .ib:active { transform: translateY(2px); }
  .ib.glow { animation: bulb 1.2s ease-in-out infinite; }
  @keyframes bulb { 50% { box-shadow: 0 0 18px 4px rgba(255,230,120,.9), inset 0 1px 0 rgba(255,255,255,.4); } }
  .lvl { display: flex; flex-direction: column; line-height: 1.05; text-shadow: 0 2px 3px rgba(0,0,0,.55); }
  .lvl b { font-size: 19px; font-weight: 900; letter-spacing: 1px; }
  .lvl small { font-size: 12px; font-weight: 800; color: #fff3c4; letter-spacing: .5px; }
  .boss .lvl b { color: #ffb4a8; }
  .pill { pointer-events: auto; display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 5px; border-radius: 18px; font-size: 17px; font-weight: 900;
    background: linear-gradient(180deg, rgba(10,30,50,.62), rgba(10,30,50,.42)); border: 2px solid rgba(255,230,150,.6); text-shadow: 0 1px 2px #000; }
  .pill svg.i { width: 24px; height: 24px; }
  .pill.bump { animation: bump .25s ease-out; }
  @keyframes bump { 40% { transform: scale(1.18); } }
  #crownPill.done { border-color: #8dff9a; }

  /* ---------- boosters ---------- */
  #boost { position: fixed; z-index: 12; display: flex; gap: 8px; transition: opacity .3s; }
  .bst { position: relative; width: 60px; height: 60px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #ffffff, #dfe9f2 60%, #b9c9d8); border: 2px solid #fff; color: #23405a;
    box-shadow: 0 4px 0 #5a7088, 0 6px 12px rgba(0,0,0,.35); font-size: 10px; letter-spacing: .5px; }
  .bst svg { width: 30px; height: 30px; }
  .bst span { margin-top: 1px; font-weight: 900; }
  .bst:active { transform: translateY(3px); box-shadow: 0 1px 0 #5a7088, 0 2px 6px rgba(0,0,0,.35); }
  .bst .cnt { position: absolute; top: -7px; right: -7px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; font-size: 13px; line-height: 20px;
    background: linear-gradient(180deg, #ff6a5a, #d42a3a); color: #fff; border: 2px solid #fff; font-weight: 900; text-shadow: 0 1px 1px rgba(0,0,0,.4); }
  .bst .cnt.buy { background: linear-gradient(180deg, #ffe066, #f0a020); color: #5a3000; text-shadow: none; font-size: 11px; }
  .bst.on { outline: 4px solid #ffe066; outline-offset: 2px; animation: wig .5s ease-in-out infinite; }
  .bst.off { filter: grayscale(.7) brightness(.85); }
  @keyframes wig { 50% { transform: rotate(-4deg) scale(1.05); } }

  /* ---------- menu ---------- */
  #menu { justify-content: flex-end; padding-bottom: max(26px, calc(env(safe-area-inset-bottom) + 18px)); background: linear-gradient(180deg, rgba(0,25,40,0) 0%, rgba(0,25,40,0) 46%, rgba(0,25,40,.72) 56%, rgba(0,18,30,.92)); }
  #menu .hint { max-width: min(470px, calc(100vw - 120px)); }
  @media (orientation: landscape) { #menu { justify-content: center; padding-left: 54vw; padding-bottom: 20px; background: linear-gradient(90deg, rgba(0,25,40,0) 0%, rgba(0,25,40,0) 50%, rgba(0,25,40,.72) 58%, rgba(0,18,30,.9)); } #menu .title { font-size: clamp(56px, 9vw, 120px); } #menu .hint { max-width: 40vw; } }
  .tag { font-size: 13px; letter-spacing: 6px; color: #fff4cc; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
  .title { font-size: clamp(64px, 19vw, 132px); line-height: .86; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(180deg, #fffef4 0%, #fff0a0 32%, #ffb02a 62%, #e05a18 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #0a4058) drop-shadow(0 0 26px rgba(255,200,90,.55)); }
  .title span { display: block; font-size: .7em; letter-spacing: .14em; background: linear-gradient(180deg, #f2fffe, #7ff0f0 50%, #1aa0b8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mstats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 16px; font-size: 15px; background: rgba(0,25,40,.55); border: 1.5px solid rgba(255,255,255,.3); text-shadow: 0 1px 2px #000; }
  .chip svg.i { width: 20px; height: 20px; }
  .btn { display: flex; flex-direction: column; align-items: center; border: 3px solid #fff7d0; padding: 12px 54px 10px; border-radius: 40px; font-size: 30px; font-weight: 900; letter-spacing: 4px; color: #4a2200; line-height: 1;
    background: linear-gradient(180deg, #fff6b0, #ffcc3a 50%, #f08a12); box-shadow: 0 6px 0 #8a4204, 0 10px 24px rgba(0,0,0,.4), 0 0 30px rgba(255,200,70,.45); animation: pulse 1.7s ease-in-out infinite; }
  .btn small { font-size: 13px; letter-spacing: 3px; margin-top: 3px; color: #7a3a00; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8a4204; }
  .btn.green { background: linear-gradient(180deg, #d8ffb0, #6ed84a 50%, #2a9a2a); box-shadow: 0 6px 0 #166016, 0 10px 24px rgba(0,0,0,.4); color: #08300a; border-color: #eaffd8; animation: none; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #8a4204, 0 10px 24px rgba(0,0,0,.4), 0 0 48px rgba(255,220,90,.85); } }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn2 { min-width: 120px; padding: 11px 20px; border-radius: 22px; font-size: 18px; font-weight: 900; letter-spacing: 2px; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(180deg, #3ad0e8, #1890b8 55%, #0e6a92); border: 2.5px solid #c8f6ff; box-shadow: 0 5px 0 #0a4664, 0 8px 16px rgba(0,0,0,.35); text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .btn2:active { transform: translateY(3px); box-shadow: 0 2px 0 #0a4664; }
  .btn2.red { background: linear-gradient(180deg, #ff8a7a, #e04a3a 55%, #b0282a); border-color: #ffd8d0; box-shadow: 0 5px 0 #6a1414, 0 8px 16px rgba(0,0,0,.35); }
  .btn2.gold { background: linear-gradient(180deg, #fff2a0, #ffc23a 55%, #e08a10); border-color: #fff8d8; color: #4a2400; text-shadow: none; box-shadow: 0 5px 0 #8a4a04, 0 8px 16px rgba(0,0,0,.35); }
  .btn2 svg.i { width: 22px; height: 22px; }
  .hint { font-size: 13px; letter-spacing: .5px; color: #e8fbff; max-width: 470px; text-shadow: 0 1px 3px #000; font-weight: 700; }
  .coinsTop { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; }

  /* ---------- panels ---------- */
  .dim { background: radial-gradient(ellipse at 50% 45%, rgba(0,30,45,.55), rgba(0,12,22,.88)); }
  .panel { position: relative; width: min(440px, 94vw); max-height: 92vh; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 18px 18px; border-radius: 28px;
    background: linear-gradient(180deg, #fffaf0, #f4e6c8); color: #4a3210; border: 4px solid #fff; box-shadow: 0 0 0 4px #e0a43a, 0 18px 50px rgba(0,0,0,.55); }
  .panel h2 { font-size: 30px; font-weight: 900; letter-spacing: 2px; color: #fff; padding: 8px 28px; margin-top: -48px; border-radius: 18px;
    background: linear-gradient(180deg, #4ad8f0, #1488c0); border: 3px solid #fff; box-shadow: 0 5px 0 #0a5a86; text-shadow: 0 2px 0 rgba(0,0,0,.25); white-space: nowrap; }
  .panel h2.red { background: linear-gradient(180deg, #ff8a6a, #d83a2a); box-shadow: 0 5px 0 #7a1a10; }
  .panel h2.gold { background: linear-gradient(180deg, #ffd84a, #f08a12); box-shadow: 0 5px 0 #8a4a04; }
  .stars { display: flex; gap: 6px; align-items: flex-end; height: 74px; }
  .stars svg { width: 58px; height: 58px; filter: drop-shadow(0 3px 0 rgba(120,70,0,.45)); transform: scale(0); }
  .stars svg:nth-child(2) { width: 74px; height: 74px; }
  .stars svg.pop { animation: starpop .45s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes starpop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
  .sgrid { display: grid; grid-template-columns: 1fr auto; gap: 5px 22px; font-size: 16px; width: 100%; max-width: 300px; text-align: left; color: #6a4a20; }
  .sgrid b { text-align: right; color: #3a2408; font-weight: 900; }
  .big { font-size: 20px; color: #3a2408; }
  .newbest { font-size: 15px; font-weight: 900; letter-spacing: 3px; color: #4a1a00; background: linear-gradient(90deg, #ffe84a, #ffa62a); padding: 4px 14px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 0 18px rgba(255,200,60,.8); }
  .sub { font-size: 15px; color: #7a5a2a; font-weight: 800; }
  .x { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 50%; font-size: 22px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, #ff8a6a, #d83a2a); border: 2.5px solid #fff; box-shadow: 0 3px 0 #7a1a10; }
  .tabs { display: flex; gap: 6px; width: 100%; }
  .tabs button { flex: 1; padding: 8px 2px; border-radius: 12px; font-size: 14px; font-weight: 900; color: #7a5a2a; background: #ead8b0; border: 2px solid #d8bf8a; }
  .tabs button.on { background: linear-gradient(180deg, #4ad8f0, #1488c0); color: #fff; border-color: #fff; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); gap: 10px; width: 100%; overflow-y: auto; padding: 4px; max-height: 58vh; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 14px; background: #fff; border: 2.5px solid #e2d0a6; font-size: 12px; color: #5a3a10; }
  .item.sel { border-color: #2ac04a; box-shadow: 0 0 0 3px rgba(42,192,74,.35); }
  .item img, .item canvas { width: 58px; height: 81px; border-radius: 6px; box-shadow: 0 3px 6px rgba(0,0,0,.3); }
  .item canvas.wide { width: 86px; height: 58px; }
  .item .p { display: flex; align-items: center; gap: 3px; padding: 2px 9px; border-radius: 10px; background: linear-gradient(180deg, #ffe066, #f0a020); color: #4a2400; font-weight: 900; font-size: 13px; }
  .item .p.own { background: #d8f5d0; color: #1a6a2a; }
  .item .p.no { filter: grayscale(.8); opacity: .7; }
  .item .p svg.i { width: 15px; height: 15px; }
  .item b { font-size: 13px; font-weight: 900; text-align: center; }
  .item .bico { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(180deg, #ffffff, #cfdbe6); border: 2px solid #b0c2d2; color: #23405a; }
  .item .bico svg { width: 34px; height: 34px; }
  .opt { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 6px; border-bottom: 1.5px solid #e6d4ae; font-size: 16px; }
  .seg { display: flex; gap: 4px; } .seg button { padding: 6px 10px; border-radius: 10px; font-size: 13px; font-weight: 900; background: #ead8b0; color: #7a5a2a; }
  .seg button.on { background: #1aa0c8; color: #fff; }

  /* ---------- level intro / pause / map / toast ---------- */
  #intro { z-index: 15; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, rgba(0,20,30,.55), rgba(0,20,30,0) 70%); gap: 8px; }
  #intro .lv { font-size: clamp(46px, 13vw, 84px); font-weight: 900; letter-spacing: 2px; line-height: 1; color: #fff; text-shadow: 0 5px 0 #0a4a64, 0 0 26px rgba(120,230,255,.7); }
  #intro .lv.boss { color: #ffd0c0; text-shadow: 0 5px 0 #6a1010, 0 0 30px rgba(255,90,60,.8); }
  #intro .nm { font-size: 18px; letter-spacing: 3px; color: #fff3c0; text-shadow: 0 2px 4px #000; }
  .grade { padding: 4px 14px; border-radius: 12px; font-size: 14px; letter-spacing: 2px; color: #fff; border: 2px solid rgba(255,255,255,.7); }
  .newsp { display: flex; align-items: center; gap: 10px; max-width: 360px; padding: 8px 14px; border-radius: 16px; background: rgba(255,250,235,.95); color: #4a3210; font-size: 14px; text-align: left; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .newsp svg { width: 40px; height: 40px; flex: none; }
  .newsp b { color: #d84a1a; }
  #pause .panel { gap: 12px; }
  #mapTop { position: fixed; z-index: 14; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: max(8px, env(safe-area-inset-top)) 10px 10px; background: linear-gradient(180deg, rgba(0,30,50,.7), rgba(0,30,50,0)); transition: opacity .3s; }
  #mapTop h3 { font-size: 20px; letter-spacing: 3px; text-shadow: 0 2px 3px #000; flex: 1; text-align: center; }
  #mapBot { position: fixed; z-index: 14; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; justify-content: center; transition: opacity .3s; pointer-events: none; }
  #mapBot .btn { pointer-events: auto; padding: 10px 40px 8px; font-size: 24px; }
  #toast { position: fixed; z-index: 40; left: 50%; top: 22%; transform: translate(-50%, -10px); padding: 10px 18px; border-radius: 16px; background: rgba(10,25,40,.88); border: 2px solid rgba(255,255,255,.4);
    font-size: 16px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .lvl b, .lvl small, .bst span { white-space: nowrap; }
  @media (max-width: 380px) { .lvl b { font-size: 16px; } .lvl small { font-size: 11px; } .pill { font-size: 15px; padding-right: 9px; } .ib { width: 38px; height: 38px; } #hud > div { gap: 6px; } .bst { font-size: 8.5px; } .bst svg { width: 26px; height: 26px; } }
  @media (max-height: 700px) and (min-height: 521px) { .title { font-size: clamp(54px, 15vw, 100px); } .overlay { gap: 9px; } }
  @media (max-height: 520px) {
    .overlay { gap: 6px; padding: 8px 14px; } .title { font-size: 46px; } .title span { display: inline; margin-left: 12px; } .tag { font-size: 10px; letter-spacing: 4px; }
    .btn { padding: 8px 40px 6px; font-size: 22px; } .btn2 { padding: 7px 16px; font-size: 15px; min-width: 96px; } .hint { display: none; } .chip { padding: 3px 10px; font-size: 13px; }
    .panel { padding: 14px 14px 12px; gap: 6px; max-height: 96vh; } .panel h2 { font-size: 22px; margin-top: -30px; padding: 4px 20px; }
    .stars { height: 50px; } .stars svg { width: 40px; height: 40px; } .stars svg:nth-child(2) { width: 50px; height: 50px; }
    .sgrid { font-size: 13px; gap: 2px 18px; } .items { max-height: 50vh; } .newsp { font-size: 12px; padding: 5px 10px; }
    #intro .lv { font-size: 44px; } .lvl b { font-size: 16px; } .ib { width: 36px; height: 36px; font-size: 18px; } .pill { height: 30px; font-size: 15px; }
    .opt { padding: 5px 6px; font-size: 14px; }
  }
  @media (max-height: 520px) and (min-width: 700px) { #shop .panel, #pause .panel { width: min(640px, 94vw); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>

<div id="hud" class="hidden">
  <div><button class="ib" id="pauseBtn" aria-label="Pause"></button><div class="lvl"><b id="lvlTxt">LEVEL 1</b><small id="lvlSub">Tropical Bay</small></div></div>
  <div><div class="pill" id="crownPill"><span data-ico="crown"></span><span id="crownTxt">0/0</span></div><button class="ib" id="hintBtn" aria-label="Hint"></button><div class="pill" id="coinPill"><span data-ico="coin"></span><span id="coinTxt">0</span></div></div>
</div>
<div id="boost" class="hidden">
  <button class="bst" data-b="plus5"><span data-ico="plus5"></span><span>+5 CARDS</span><i class="cnt"></i></button>
  <button class="bst" data-b="wild"><span data-ico="wild"></span><span>WILD</span><i class="cnt"></i></button>
  <button class="bst" data-b="undo"><span data-ico="undo"></span><span>UNDO</span><i class="cnt"></i></button>
  <button class="bst" data-b="column"><span data-ico="column"></span><span>COLUMN</span><i class="cnt"></i></button>
</div>

<div class="overlay" id="menu">
  <div class="coinsTop"><div class="pill" id="menuCoins"><span data-ico="coin"></span><span class="v">0</span></div></div>
  <div class="tag">A SOLITAIRE ADVENTURE</div>
  <div class="title">TRI<span>PEAKS</span></div>
  <div class="mstats" id="menuStats"></div>
  <button class="btn" id="startBtn">PLAY<small id="startSub">LEVEL 1</small></button>
  <div class="row"><button class="btn2" id="mapBtn"><span data-ico="map"></span>MAP</button><button class="btn2" id="shopBtn"><span data-ico="bag"></span>SHOP</button></div>
  <div class="hint">Tap a card one higher or lower than the open card · Aces and Kings wrap · build streaks for coins and wild cards</div>
</div>

<div id="mapTop" class="hidden"><button class="ib" id="mapBack" aria-label="Back"></button><h3 id="mapTitle">WORLD MAP</h3><div class="pill" id="mapCoins"><span data-ico="coin"></span><span class="v">0</span></div></div>
<div id="mapBot" class="hidden"><button class="btn" id="mapPlay">PLAY<small id="mapPlaySub">LEVEL 1</small></button></div>

<div class="overlay hidden" id="intro"><div class="lv" id="introLv">LEVEL 1</div><div class="nm" id="introNm"></div><div class="grade" id="introGrade"></div><div id="introNew"></div></div>

<div class="overlay dim hidden" id="result"><div class="panel">
  <h2 id="resTitle">CLEARED!</h2>
  <div class="stars" id="resStars"></div>
  <div class="sub" id="resSub"></div>
  <div class="newbest" id="resBest">NEW BEST!</div>
  <div class="sgrid" id="resGrid"></div>
  <div class="row" id="resBtns"></div>
</div></div>

<div class="overlay dim hidden" id="pause"><div class="panel">
  <h2>PAUSED</h2>
  <div class="sub" id="pauseSub"></div>
  <button class="btn green" id="resumeBtn">RESUME</button>
  <div class="row"><button class="btn2" id="restartBtn">RESTART</button><button class="btn2" id="pMapBtn">MAP</button></div>
  <div class="row"><button class="btn2 gold" id="pShopBtn">SHOP</button><button class="btn2 red" id="homeBtn">MENU</button></div>
</div></div>

<div class="overlay dim hidden" id="shop"><div class="panel">
  <h2 class="gold">SHOP</h2><button class="x" id="shopX">✕</button>
  <div class="pill" style="background:#3a2a10;align-self:center;color:#ffe08a" id="shopCoins"><span data-ico="coin"></span><span class="v">0</span></div>
  <div class="tabs" id="shopTabs"><button data-t="backs" class="on">BACKS</button><button data-t="tables">TABLES</button><button data-t="boost">BOOSTERS</button><button data-t="opts">SETTINGS</button></div>
  <div class="items" id="shopItems"></div>
</div></div>
<div id="toast"></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;

    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);

  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');

    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';

    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {

// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};

// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {

      for (let i = 0; i < n; i++) {

        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });

    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },

  };
})();

  addEventListener('keydown', e => { if (MODE !== 'game' || !G || G.attract) return; if (e.key === ' ' || e.key === 'd') drawStock(); if (e.key === 'z' || e.key === 'u') useBoost('undo'); if (e.key === 'h') showHint(); if (e.key === 'Escape' || e.key === 'p') PAUSED ? resume() : pause(); });

  // ---------- update ----------
  let AUTO = false;
  function update(dt) {
    for (const b of BANNERS) if (!G) b.life = 0;
    if (MODE === 'map' || !G || PAUSED) { FX.update(dt); return; }
    G.t += dt;
    if (G.state === 'deal') { G.dealT -= dt; if (G.dealT <= 0) finishDeal(G); }
    let landed = 0;
    for (const c of G.cards) {
      if (c.tw) { const was = c.tw.t; c.tw.t += dt; if (was < c.tw.d && c.tw.t >= c.tw.d) { c.tw = null; landed++; } }
      if (c.fd > 0) c.fd -= dt; else { const tg = c.up ? 1 : 0; if (c.flip !== tg) c.flip = tg > c.flip ? Math.min(1, c.flip + dt / .3) : Math.max(0, c.flip - dt / .3); }
      if (c.shake > 0) c.shake = Math.max(0, c.shake - dt);
      if (c.lockT > 0 && c.lockT < 1) c.lockT = Math.min(1, c.lockT + dt * 1.6);
      if (c.gone > 0 && c.gone < 1) c.gone = Math.min(1, c.gone + dt * 2.4);
    }
    if (landed && G.state === 'deal') SND.slide();
    for (const c of G.stock) if (c.inT != null && c.inT < 1) c.inT = Math.min(1, c.inT + dt * 2.2);
    for (let k = G.flyers.length - 1; k >= 0; k--) { const f = G.flyers[k]; f.t += dt; if (f.t >= f.d) { G.flyers.splice(k, 1); const p = flyerPos(f, 1); if (f.done) f.done(p[0], p[1]); } }
    for (let k = G.coinsFx.length - 1; k >= 0; k--) { const f = G.coinsFx[k]; f.t += dt; if (f.t >= f.d) { G.coinsFx.splice(k, 1); if (f.k === 'coin') { G.pend = Math.max(0, G.pend - f.val); if (!(G.coinTick > 0)) { SND.coin(); G.coinTick = .07; } bump('coinPill'); } else if (f.k === 'crown') bump('crownPill'); if (f.done) f.done(); } }
    if (G.coinTick > 0) G.coinTick -= dt;
    if (G.hint) { G.hint.t -= dt; if (G.hint.t <= 0) G.hint = null; }
    if (G.state === 'play') G.idle += dt;
    // bot: attract demo or test autopilot
    if ((G.attract || AUTO) && G.state === 'play' && !G.flyers.some(f => f.to)) { G.botT -= dt; if (G.botT <= 0) { G.botT = G.attract ? .6 : .28; botStep(); } }
    // tutorial
    G.tut = null;
    if (!G.attract && SAVE.tut < 2 && G.L <= 2 && G.state === 'play' && !G.flyers.length) {
      const L2 = legal(G);
      if (SAVE.tut === 0 && L2.length) G.tut = { i: L2[0], msg: 'Tap a card that is one higher or one lower than your open card.' };
      else if (!L2.length && G.si < G.stock.length) G.tut = { i: -1, msg: 'No match? Tap the deck to draw a new open card.' };
      else if (SAVE.tut === 1 && L2.length && G.moves < 6) G.tut = { i: L2[0], msg: 'Keep the streak going! Aces and Kings connect, too.' };
    }
    if (!G.attract && SAVE.tut === 0 && G.moves > 0 && G.cards.some(c => c.rm)) { SAVE.tut = 1; saveNow(); }
    if (!G.attract && SAVE.tut === 1 && G.si > 0 && G.moves > 2) { SAVE.tut = 2; saveNow(); }
    FX.update(dt);
    if (!G.attract && (G.t % .25) < dt) updateHUD();
  }
  function bump(id) { const e = $(id); if (!e) return; e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); updateHUD(); }

  // ---------- boot & loop ----------
  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const cs = getComputedStyle($('safe')); SAFE_T = parseFloat(cs.paddingTop) || 0; SAFE_B = parseFloat(cs.paddingBottom) || 0;
    if (MAP.w !== W) { MAP.cache.clear(); MAP.w = W; }
    computeLayout();
  }
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  let last = performance.now(), TT = 0, fpsN = 0, fpsT = 0, FPS = 60;
  function frame(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; TT += dt;
    fpsN++; fpsT += dt; if (fpsT >= 1) { FPS = fpsN / fpsT; fpsN = 0; fpsT = 0; }
    try { update(dt); render(dt, TT); } catch (err) { console.error(err); }
    requestAnimationFrame(frame);
  }
  resize(); showMenu(); requestAnimationFrame(frame);

  // ---------- test hook ----------
  window.__tp = {
    G: () => G, SAVE: () => SAVE, LY: () => LY, mode: () => MODE, fps: () => FPS, atlas: () => !!ATLAS,
    state: () => G && { L: G.L, state: G.state, attract: G.attract, left: G.cards.filter(c => !c.rm).length, stock: G.stock.length - G.si, waste: top(G).id, streak: G.streak, moves: G.moves, coins: SAVE.coins, legal: legal(G), paused: PAUSED, name: G.deal.name },
    start: (L, resume) => startLevel(L, resume), menu: showMenu, map: showMap, shop: t => showShop(t || 'backs', 'menu'),
    gen: (L, s) => { const d = genLevel(L, s || 0); return { L, name: d.name, N: d.N, S: d.S, nodes: d.nodes, tries: d.tries, grade: d.grade, greedy: d.greedy, built: d.built, sp: d.cells.filter(c => c.sp).map(c => c.sp.k) }; },
    verify: L => { const d = genLevel(L), g = newGame(d), T = g.T, r = solve(T, d.stock.map(id => BASE[id] ? BASE[id].r : 1), { w: BASE[d.w0] ? BASE[d.w0].r : 1, budget: 400000 }); return { L, ok: r.ok, nodes: r.nodes, aborted: r.aborted, solPathOk: replay(d) }; },
    autopilot: v => { AUTO = v !== false; if (G) G.botT = 0; }, hint: showHint, play: i => play(i), draw: drawStock, boost: useBoost, legal: () => legal(G),
    coins: n => { SAVE.coins += n; saveNow(); updateHUD(true); updateMenu(); }, unlockAll: () => { SAVE.backs = CardKit.BACKS.slice(); SAVE.tables = TABLES.map(t => t.key); saveNow(); },
    win: () => { if (!G) return; G.cards.forEach(c => { c.rm = true; }); G.state = 'play'; afterMove(); },
    lose: () => { if (!G) return; G.si = G.stock.length; G.wildFree = 0; G.waste.push(inst('KS')); G.cards.forEach((c, i) => { if (!c.rm && (c.c.r === 1 || c.c.r === 12)) c.c = inst('7H'); }); G.state = 'play'; checkStuck(); },
    cardXY: i => { const c = G.cards[i], h = home(c); return { x: h[0], y: h[1] }; }, stockXY: () => ({ x: LY.stockR, y: LY.stockY }), wasteXY: () => ({ x: LY.wasteX, y: LY.wasteY }),
    clearSave: () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  };
  // replays the generator's winning line against the special-card rules (keys, ice, bombs)
  function replay(d) {
    const g = newGame(d), sol = d.sol || []; let si = 0, w = BASE[d.w0].r, mv = 0;
    for (const m of sol) { mv++; if (m === -1) { if (si >= d.stock.length) return false; w = BASE[d.stock[si++]].r; }
      else { const c = g.cards[m]; if (c.rm || !isFree(g, m) || locked(g, m) || frozen(g, m) || !adj(c.c.r, w)) return false; c.rm = true; w = c.c.r; }
      for (const c of g.cards) if (!c.rm && c.sp && c.sp.k === 'bomb' && c.sp.K <= mv) return false; }
    return g.cards.every(c => c.rm);
  }
})();
