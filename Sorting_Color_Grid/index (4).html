<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c86a3c">
<title>Color Flood</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #c86a3c;
    font-family: "Gill Sans", "Gill Sans MT", "Segoe UI", sans-serif; color: #fff8ec;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: none; }
  .hud div { background: #fff8ec; color: #6a2a10; border-radius: 12px; padding: 4px 14px; text-align: center; box-shadow: 0 3px 0 #7a3a1a; }
  .hud small { display: block; font-size: 10px; letter-spacing: 2px; color: #b06a3a; } .hud b { font-size: 22px; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: #4a1c08aa; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card { width: min(350px, 100%); background: #fff8ec; color: #4a1c08; border-radius: 20px; padding: 24px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; border: 6px solid #2a6ab0; outline: 3px solid #fff8ec; box-shadow: 0 16px 40px #0006; }
  .card canvas { width: 100%; height: auto; }
  h1 { font-size: clamp(38px, 11vw, 52px); color: #2a6ab0; line-height: 1; }
  p { font-size: 15px; line-height: 1.5; }
  .stat b { color: #c0392b; }
  .btn { border: none; background: #2a6ab0; color: #fff; font: inherit; font-size: 20px; padding: 13px; border-radius: 14px; cursor: pointer; box-shadow: 0 5px 0 #1a4070; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1a4070; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div><small>LEVEL</small><b id="level">1</b></div><div><small>MOVES</small><b id="moves">0/0</b></div><div><small>FILLED</small><b id="pct">0%</b></div></div>

<div class="overlay" id="menu"><div class="card">
  <canvas id="logo" width="600" height="150"></canvas>
  <h1>Color Flood</h1>
  <p>The glaze spreads from the <b>top-left tile</b>. Pick a paint pot (or tap any tile) to change its colour and swallow every touching tile of that colour. Cover the whole mosaic within the move limit!</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">Start glazing</button>
</div></div>
<div class="overlay hidden" id="end"><div class="card">
  <h1 id="endTitle">Masterpiece!</h1>
  <div class="stat" id="endText"></div>
  <button class="btn" id="endBtn">Next mosaic</button>
</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
(() => {
  const audio = GameAudio({
    bpm: 96, scale: 'dorian', root: 57, prog: [0, 3, 4, 3], seed: 505,
    waves: { lead: 'triangle', bass: 'triangle', arp: 'sine' },
    arp: true, arpEvery: 2, arpOct: 1, leadOct: 1, leadDensity: 0.3, drums: 'soft', swing: 0.18, bassPattern: [0, 6, 10], volume: 0.17,
    btnBg: 'rgba(74,28,8,.45)'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'color_flood_level';
  let level = 1; try { level = +localStorage.getItem(KEY) || 1; } catch (e) {}
  $('bestMenu').innerHTML = level > 1 ? 'Continue from mosaic <b>' + level + '</b>' : '';

  // ---------- glazed ceramic tiles and paint pots ----------
  const COL = ['#d63a2e', '#f2a42a', '#f4e04a', '#3aa85a', '#2a6ab0', '#7a4ab0', '#f4f0e6'];
  const PAT = [
    '<circle cx="50" cy="50" r="14" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>',
    '<path d="M50 30 L 70 50 L 50 70 L 30 50 Z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>',
    '<path d="M50 32 C 56 44, 68 50, 50 68 C 32 50, 44 44, 50 32 Z" fill="#fff" fill-opacity=".25"/>',
    '<path d="M32 50 H68 M50 32 V68" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>',
    '<path d="M36 36 L 64 64 M64 36 L 36 64" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>',
    '<circle cx="50" cy="50" r="6" fill="#fff" fill-opacity=".35"/><circle cx="50" cy="50" r="16" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>',
    '<path d="M50 34 L 54 46 L 66 50 L 54 54 L 50 66 L 46 54 L 34 50 L 46 46 Z" fill="#2a6ab0" fill-opacity=".35"/>'
  ];
  const tileSVG = (c, i) => svgDoc('<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + shade(c, 0.3) + '"/><stop offset=".55" stop-color="' + c + '"/><stop offset="1" stop-color="' + shade(c, -0.25) + '"/></linearGradient></defs>' +
    '<rect x="2" y="2" width="96" height="96" rx="12" fill="' + shade(c, -0.4) + '"/>' +
    '<rect x="5" y="4" width="90" height="88" rx="10" fill="url(#g)"/>' + PAT[i] +
    '<path d="M12 14 Q 50 6 88 14" stroke="#fff" stroke-opacity=".45" stroke-width="5" fill="none" stroke-linecap="round"/>' +
    '<ellipse cx="28" cy="26" rx="10" ry="5" fill="#fff" opacity=".35" transform="rotate(-25 28 26)"/>');
  const potSVG = c => svgDoc('<defs><linearGradient id="m" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a929a"/><stop offset=".35" stop-color="#e8ecf0"/><stop offset="1" stop-color="#6a727a"/></linearGradient>' +
    '<filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity=".45"/></filter></defs>' +
    '<g filter="url(#s)"><path d="M18 30 L 82 30 L 78 88 C 78 94, 22 94, 22 88 Z" fill="url(#m)"/>' +
    '<rect x="22" y="44" width="56" height="28" rx="3" fill="#fff8ec"/><rect x="22" y="44" width="56" height="28" rx="3" fill="' + c + '" opacity=".25"/>' +
    '<ellipse cx="50" cy="30" rx="32" ry="9" fill="#5a626a"/><ellipse cx="50" cy="30" rx="28" ry="7" fill="' + c + '"/>' +
    '<path d="M70 30 C 72 40, 68 44, 66 52" stroke="' + c + '" stroke-width="6" stroke-linecap="round" fill="none"/>' +
    '<ellipse cx="42" cy="28" rx="10" ry="2.5" fill="#fff" opacity=".45"/>' +
    '<path d="M20 30 C 20 6, 80 6, 80 30" stroke="#5a626a" stroke-width="3" fill="none"/></g>');

  let SPR = null;
  const defs = {}; COL.forEach((c, i) => { defs['t' + i] = tileSVG(c, i); defs['p' + i] = potSVG(c); });
  loadSprites(defs, 128).then(s => { SPR = s; const lc = $('logo').getContext('2d'); for (let r = 0; r < 3; r++) for (let c = 0; c < 12; c++) lc.drawImage(SPR['t' + ((r * 3 + c * 7) % 6)], c * 50, r * 50, 50, 50); });

  let W, H, DPR, N, K, grid, owned, cell, bx, by, potY, potS, moves, limit, state = 'menu', t = 0, wave = [];
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!N) return;
    potS = Math.min(64, (W - 30) / K * 0.9);
    cell = Math.min((W - 24) / N, (H - 190 - potS) / N);
    bx = (W - cell * N) / 2; by = 80 + Math.max(0, (H - 190 - potS - cell * N) / 2);
    potY = by + cell * N + 24;
  }
  addEventListener('resize', resize);

  function region(g, color) {
    // flood from (0,0) over the current owned colour
    const seen = new Uint8Array(N * N), q = [0]; seen[0] = 1; const out = [];
    const c0 = g[0];
    while (q.length) {
      const i = q.pop(); out.push(i);
      const r = Math.floor(i / N), c = i % N;
      for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nr = r + dr, nc = c + dc; if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
        const j = nr * N + nc; if (seen[j] || g[j] !== (color === undefined ? c0 : color)) continue;
        seen[j] = 1; q.push(j);
      }
    }
    return out;
  }
  function apply(g, color) { const reg = region(g); for (const i of reg) g[i] = color; return region(g).length; }
  function greedy(g0) {
    const g = g0.slice(); let steps = 0;
    while (region(g).length < N * N && steps < 200) {
      let bestC = -1, bestN = -1;
      for (let c = 0; c < K; c++) { if (c === g[0]) continue; const h = g.slice(); const n = apply(h, c); if (n > bestN) { bestN = n; bestC = c; } }
      apply(g, bestC); steps++;
    }
    return steps;
  }
  function load() {
    N = Math.min(14, 8 + Math.floor((level - 1) / 2));
    K = Math.min(7, 4 + Math.floor((level - 1) / 3));
    grid = Array.from({ length: N * N }, () => Math.floor(Math.random() * K));
    limit = greedy(grid) + (level < 4 ? 2 : 1);
    moves = 0; owned = new Set(region(grid)); wave = []; resize(); hud();
  }
  function hud() { $('level').textContent = level; $('moves').textContent = moves + '/' + limit; $('pct').textContent = Math.floor(owned.size / (N * N) * 100) + '%'; }
  function start() { if (!SPR) return; load(); state = 'play'; audio.start(); $('menu').classList.add('hidden'); $('end').classList.add('hidden'); }
  $('startBtn').onclick = start;
  $('endBtn').onclick = () => { if ($('endBtn').dataset.next === '1') { level++; try { localStorage.setItem(KEY, level); } catch (e) {} } start(); };

  function pick(color) {
    if (state !== 'play' || color === grid[0]) return;
    const before = new Set(region(grid));
    apply(grid, color); moves++;
    const now = region(grid);
    owned = new Set(now);
    const gained = now.filter(i => !before.has(i));
    for (const i of now) { const r = Math.floor(i / N), c = i % N; wave.push({ i, t: -(r + c) * 0.025, gained: gained.includes(i) }); }
    audio.sfx(330 + gained.length * 6, 0.25, 'triangle', 0.07, 660 + gained.length * 10);
    hud();
    if (owned.size === N * N) finish(true); else if (moves >= limit) finish(false);
  }
  function finish(won) {
    state = 'end';
    $('endTitle').textContent = won ? 'Masterpiece!' : 'Out of glaze';
    $('endText').innerHTML = won ? 'Covered in <b>' + moves + '</b> of ' + limit + ' moves' : 'The mosaic is <b>' + Math.floor(owned.size / (N * N) * 100) + '%</b> glazed';
    $('endBtn').textContent = won ? 'Next mosaic' : 'Try again'; $('endBtn').dataset.next = won ? '1' : '0';
    if (won) [523, 659, 784, 1046].forEach((f, k) => setTimeout(() => audio.sfx(f, 0.3, 'triangle', 0.08), k * 110));
    else audio.sfx(300, 0.6, 'sine', 0.07, 150);
    setTimeout(() => $('end').classList.remove('hidden'), 700);
  }
  canvas.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    const x = e.clientX, y = e.clientY;
    if (y >= potY && y <= potY + potS) { const total = K * potS + (K - 1) * 8, k = Math.floor((x - (W - total) / 2) / (potS + 8)); if (k >= 0 && k < K) pick(k); return; }
    const c = Math.floor((x - bx) / cell), r = Math.floor((y - by) / cell);
    if (r >= 0 && r < N && c >= 0 && c < N) pick(grid[r * N + c]);
  });
  addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && state === 'menu') { e.preventDefault(); start(); } const n = +e.key; if (n >= 1 && n <= K) pick(n - 1); });

  function update(dt) { t += dt; for (const w of wave) w.t += dt; wave = wave.filter(w => w.t < 0.5); }
  function render() {
    // terracotta floor with grout pattern
    ctx.fillStyle = '#c86a3c'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(90,30,10,.25)'; ctx.lineWidth = 2;
    for (let y = 0; y < H; y += 60) for (let x = (y / 60 % 2) * 30; x < W; x += 60) ctx.strokeRect(x, y, 60, 60);
    if (!SPR || !grid) return;
    ctx.fillStyle = '#f4ecdc'; ctx.fillRect(bx - 10, by - 10, cell * N + 20, cell * N + 20);
    ctx.fillStyle = '#2a6ab0'; ctx.fillRect(bx - 6, by - 6, cell * N + 12, cell * N + 12);
    ctx.fillStyle = '#e8dcc4'; ctx.fillRect(bx - 2, by - 2, cell * N + 4, cell * N + 4);
    const wmap = new Map(wave.map(w => [w.i, w]));
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const i = r * N + c, w = wmap.get(i);
      let s = 1; if (w && w.t > 0) s = 1 - Math.sin(Math.min(1, w.t / 0.35) * Math.PI) * (w.gained ? 0.25 : 0.1);
      const x = bx + c * cell + cell / 2, y = by + r * cell + cell / 2, sz = (cell - 1.5) * s;
      ctx.drawImage(SPR['t' + grid[i]], x - sz / 2, y - sz / 2, sz, sz);
    }
    // outline of the flooded region
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2.5; ctx.beginPath();
    for (const i of owned) {
      const r = Math.floor(i / N), c = i % N, x = bx + c * cell, y = by + r * cell;
      if (r === 0 || !owned.has(i - N)) { ctx.moveTo(x, y); ctx.lineTo(x + cell, y); }
      if (r === N - 1 || !owned.has(i + N)) { ctx.moveTo(x, y + cell); ctx.lineTo(x + cell, y + cell); }
      if (c === 0 || !owned.has(i - 1)) { ctx.moveTo(x, y); ctx.lineTo(x, y + cell); }
      if (c === N - 1 || !owned.has(i + 1)) { ctx.moveTo(x + cell, y); ctx.lineTo(x + cell, y + cell); }
    }
    ctx.stroke();
    // paint pots
    const total = K * potS + (K - 1) * 8;
    for (let k = 0; k < K; k++) {
      const x = (W - total) / 2 + k * (potS + 8), cur = k === grid[0];
      ctx.globalAlpha = cur ? 0.35 : 1;
      ctx.drawImage(SPR['p' + k], x, potY + (cur ? 6 : Math.sin(t * 3 + k) * 2), potS, potS);
      ctx.globalAlpha = 1;
    }
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
