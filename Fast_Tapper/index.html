<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5ec2f2">
<title>Mole Mayhem</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #5ec2f2;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; color: #4a2a0a;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse at 50% 35%, rgba(255,250,225,.96), rgba(255,214,120,.96)); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 250px; height: 250px; }
  h1 { font-size: clamp(42px, 13vw, 70px); font-weight: 900; letter-spacing: 2px; line-height: .95; color: #ffcf2a;
    -webkit-text-stroke: 3px #7a3a08; text-shadow: 0 5px 0 #7a3a08, 0 10px 20px rgba(0,0,0,.25); }
  p { max-width: 320px; font-size: 15px; line-height: 1.55; color: #6a3a10; }
  .stat { font-size: 17px; font-weight: 800; color: #6a3a10; } .stat b { color: #d8501a; }
  .big { font-size: 46px; font-weight: 900; color: #d8501a; -webkit-text-stroke: 2px #7a3a08; }
  .btn { border: 4px solid #fff; background: linear-gradient(#7ae04a, #2a9a2a); color: #fff; font: inherit; font-size: 21px; font-weight: 900; letter-spacing: 4px; padding: 14px 50px; border-radius: 40px; cursor: pointer;
    box-shadow: 0 6px 0 #1a6a1a, 0 12px 24px rgba(0,0,0,.25); text-shadow: 0 2px 0 #1a6a1a; animation: bob 1.2s ease-in-out infinite; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #1a6a1a; }
  @keyframes bob { 50% { transform: translateY(-4px) scale(1.03); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay" id="menu">
  <canvas id="logo" width="500" height="500"></canvas>
  <h1>MOLE<br>MAYHEM</h1>
  <p><b>The moles are wrecking the farm!</b> Tap them as they pop up. Golden moles give bonus time — but never bonk the bunny or a mole holding a bomb!</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">PLAY</button>
</div>
<div class="overlay hidden" id="clear">
  <canvas id="clearArt" width="500" height="500"></canvas>
  <h1>FIELD<br>CLEARED!</h1>
  <div class="stat">Stage <b id="clrStage">1</b> · bonus <b id="clrBonus">0</b></div>
  <div class="big" id="clrScore">0</div>
  <button class="btn" id="nextBtn">NEXT FIELD</button>
</div>
<div class="overlay hidden" id="over">
  <canvas id="overArt" width="500" height="500"></canvas>
  <h1>GAME<br>OVER</h1>
  <div class="big" id="ovScore">0</div>
  <div class="stat" id="ovBest">Best: 0</div>
  <button class="btn" id="againBtn">TRY AGAIN</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = o.n || 14;
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }
        else if (p.shape === 'heart') { ctx.rotate(p.rot * .2); heart(ctx, p.size); }
        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * (.4 + k * .6), 0, TAU); ctx.fill(); }
        ctx.restore(); ctx.shadowBlur = 0;
      }
      for (const t of texts) {
        const age = t.max - t.life, pop = age < .18 ? 1 + Math.sin(age / .18 * Math.PI) * .45 : 1, a = Math.min(1, t.life / t.max * 2.2);
        ctx.save(); ctx.globalAlpha = a; ctx.translate(t.x, t.y); ctx.scale(pop, pop); if (t.wobble) ctx.rotate(Math.sin(age * 20) * t.wobble);
        ctx.font = t.font + t.size + 'px "Avenir Next", "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, t.size * .16); ctx.strokeStyle = t.stroke; ctx.strokeText(t.str, 0, 0); ctx.fillStyle = t.c; ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },
    drawFlash(ctx, W, H) { if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  };
})();
/*FX-END*/
(() => {
  const audio = GameAudio({
    bpm: 136, scale: 'pentaMajor', root: 60, prog: [0, 3, 4, 3], seed: 801,
    waves: { lead: 'square', bass: 'triangle', arp: 'triangle', pad: 'sine' },
    pad: false, arp: true, arpEvery: 1, arpOct: 2, arpCutoff: 2600, leadOct: 1, leadCutoff: 2000, leadDensity: 0.42, drums: true, bassPattern: [0, 4, 8, 12], swing: 0.14, volume: 0.15,
    btnBg: 'rgba(255,255,255,.75)', btnColor: '#2a9a2a'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'mole_mayhem';
  let save = { stage: 1, best: 0 }; try { save = Object.assign(save, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
  $('bestMenu').innerHTML = save.best ? 'Best score <b>' + save.best + '</b> · stage <b>' + save.stage + '</b>' : '';

  // ---------- endless stages: every number maps to its own field ----------
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  function stageParams(n) {
    const r = rng(n * 911);
    return {
      cols: 3, rows: n < 4 ? 3 : 4,
      goal: Math.min(40, 12 + Math.floor(n * 2.2) + Math.floor(r() * 4)),
      time: 30,
      up: Math.max(.5, 1.45 * Math.pow(.94, n - 1)),
      every: Math.max(.3, .95 * Math.pow(.93, n - 1)),
      max: Math.min(5, 1 + Math.floor((n + 1) / 2)),
      bomb: n < 2 ? 0 : Math.min(.26, .06 + n * .015),
      bunny: n < 3 ? 0 : Math.min(.16, .04 + n * .008),
      gold: .07,
      sky: r() // tints the sky so each field looks a little different
    };
  }

  // ---------- art ----------
  const lg = (id, stops, x2 = 0, y2 = 1) => '<linearGradient id="' + id + '" x1="0" y1="0" x2="' + x2 + '" y2="' + y2 + '">' + stops.map(([o, c]) => '<stop offset="' + o + '" stop-color="' + c + '"/>').join('') + '</linearGradient>';

      ctx.fillStyle = '#a8784a'; ctx.beginPath(); ctx.ellipse(h.x, h.y + ry * .05, rx * 1.1, ry * .7, 0, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#c8a07a'; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.ellipse(h.x - rx * .8 + k * rx * .4, h.y + ry * (.5 + (k % 2) * .3), 3.4, 2.2, 0, 0, 7); ctx.fill(); }
    }
  }
  function drawCritter(h) {
    const m = h.m; if (!m) return;
    const w = cell * .78, hh = w * 1.24, e = m.state === 'rise' ? 1 - Math.pow(1 - m.k, 3) : m.k;
    const sq = m.squash, sx = 1 + sq * .25, sy = 1 - sq * .3;
    const rise = hh * .82 * Math.max(0, e), bob = m.state === 'up' ? Math.sin(t * 9) * 2 : 0;
    ctx.save(); ctx.beginPath(); ctx.rect(h.x - w, h.y - hh * 1.4, w * 2, hh * 1.4); ctx.clip();
    ctx.translate(h.x, h.y + hh * .1 - rise + bob); ctx.scale(sx, sy);
    const img = m.state === 'hit' && (m.kind === 'mole' || m.kind === 'gold') ? SPR.hit : SPR[m.kind];
    if (m.kind === 'gold') { ctx.shadowColor = '#ffe24a'; ctx.shadowBlur = 20 + Math.sin(t * 8) * 8; }
    ctx.drawImage(img, -w / 2, 0, w, hh); ctx.restore();
    if (m.kind === 'bomb' && m.state === 'up' && Math.random() < .5) FX.burst(h.x + w * .36, h.y - rise + hh * .55, { n: 1, colors: ['#ffcf2a', '#fff'], speed: 60, size: 3, gravity: -40, life: .3 });
    if (m.kind === 'gold' && Math.random() < .2) FX.burst(h.x + (Math.random() - .5) * w, h.y - rise + hh * .3, { n: 1, colors: ['#fff6b0'], shape: 'star', speed: 20, size: 5, gravity: -30, life: .6 });
  }
  function drawHUD() {
    // wooden sign with stage and score
    const sw = Math.min(W - 20, 520), sx = W / 2 - sw / 2, sy = 10;
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.roundRect(sx + 3, sy + 5, sw, 62, 14); ctx.fill();
    const wg = ctx.createLinearGradient(0, sy, 0, sy + 62); wg.addColorStop(0, '#d8a060'); wg.addColorStop(1, '#9a6430'); ctx.fillStyle = wg; ctx.beginPath(); ctx.roundRect(sx, sy, sw, 62, 14); ctx.fill();
    ctx.strokeStyle = '#5a3410'; ctx.lineWidth = 3; ctx.stroke(); ctx.strokeStyle = 'rgba(90,50,15,.3)'; ctx.lineWidth = 1; for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.moveTo(sx + 8, sy + k * 15.5); ctx.lineTo(sx + sw - 8, sy + k * 15.5); ctx.stroke(); }
    ctx.fillStyle = '#5a3410'; for (const xx of [sx + 10, sx + sw - 10]) { ctx.beginPath(); ctx.arc(xx, sy + 12, 3, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(xx, sy + 50, 3, 0, 7); ctx.fill(); }
    ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const label = (txt, x, y, size, col, align = 'left') => { ctx.font = '900 ' + size + 'px "Avenir Next", sans-serif'; ctx.textAlign = align; ctx.lineWidth = 5; ctx.strokeStyle = '#4a2a08'; ctx.strokeText(txt, x, y); ctx.fillStyle = col; ctx.fillText(txt, x, y); };
    label('STAGE ' + stage, sx + 20, sy + 20, 17, '#ffe24a');
    label(Math.round(shown).toLocaleString(), sx + sw / 2, sy + 32, 32, '#ffffff', 'center');
    // hearts
    for (let i = 0; i < 3; i++) { const x = sx + sw - 24 - i * 26, y = sy + 20, r = 9; ctx.fillStyle = i < hearts ? '#ff3a5a' : 'rgba(60,30,10,.4)'; ctx.beginPath(); ctx.moveTo(x, y + r * .8); ctx.bezierCurveTo(x - r * 1.6, y - r * .3, x - r * .6, y - r * 1.4, x, y - r * .4); ctx.bezierCurveTo(x + r * .6, y - r * 1.4, x + r * 1.6, y - r * .3, x, y + r * .8); ctx.fill(); }
    // goal progress
    label(whacked + ' / ' + P.goal, sx + 20, sy + 45, 15, '#ffffff');
    if (combo >= 4) label('x' + Math.min(5, 1 + Math.floor(combo / 4)), sx + sw - 24, sy + 45, 18, '#ff8a2a', 'right');
    // carrot-shaped timer bar
    const by = sy + 74, bw = sw - 20, k = Math.max(0, Math.min(1, timeLeft / P.time));
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.roundRect(sx + 10, by, bw, 14, 7); ctx.fill();
    const tg = ctx.createLinearGradient(0, by, 0, by + 14); tg.addColorStop(0, timeLeft < 5 ? '#ff6a5a' : '#ffb04a'); tg.addColorStop(1, timeLeft < 5 ? '#c82a1a' : '#e8701a'); ctx.fillStyle = tg; ctx.beginPath(); ctx.roundRect(sx + 10, by, Math.max(14, bw * k), 14, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(sx + 16, by + 2, Math.max(0, bw * k - 12), 3);
    ctx.fillStyle = '#4ab83a'; const lx = sx + 10 + Math.max(14, bw * k); ctx.beginPath(); ctx.ellipse(lx, by + 3, 7, 3.4, -.5, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(lx + 2, by + 9, 7, 3.4, .4, 0, 7); ctx.fill();
    label(Math.ceil(timeLeft) + 's', sx + 22, by + 7.5, 12, '#fff');
  }
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const [ox, oy] = FX.offset(); ctx.translate(ox, oy);
    if (BG) ctx.drawImage(BG, -10, -10, W + 20, H + 20); else { ctx.fillStyle = '#5ec2f2'; ctx.fillRect(0, 0, W, H); }
    // turning sun rays and drifting clouds
    ctx.save(); ctx.translate(W * .82, 40); ctx.rotate(t * .15); ctx.fillStyle = 'rgba(255,250,200,.25)'; for (let k = 0; k < 12; k++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-18, 220); ctx.lineTo(18, 220); ctx.fill(); } ctx.restore();
    const sg = ctx.createRadialGradient(W * .82, 40, 0, W * .82, 40, 46); sg.addColorStop(0, '#fffbe0'); sg.addColorStop(.6, '#ffe24a'); sg.addColorStop(1, 'rgba(255,226,74,0)'); ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(W * .82, 40, 46, 0, 7); ctx.fill();
    for (let k = 0; k < 3; k++) { const x = ((t * (12 + k * 5) + k * 300) % (W + 200)) - 100, y = 30 + k * 34; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(x, y, 18, 0, 7); ctx.arc(x + 20, y - 8, 16, 0, 7); ctx.arc(x + 40, y, 18, 0, 7); ctx.fill(); }
    if (!SPR || !P || phase === 'menu') { FX.draw(ctx); return; }
    // windmill blades
    const wx = W * .84, wy = Math.max(120, boardY - cell * .1) - 64; ctx.save(); ctx.translate(wx, wy); ctx.rotate(t * 1.4); ctx.fillStyle = '#f4f0e8'; ctx.strokeStyle = '#8a7a5a'; for (let k = 0; k < 4; k++) { ctx.rotate(Math.PI / 2); ctx.fillRect(-3, 0, 6, 26); ctx.strokeRect(-3, 0, 6, 26); } ctx.restore();
    for (const h of holes) drawHole(h, false);
    for (const h of holes) { drawCritter(h); drawHole(h, true); }
    // the mallet swings down where you tap
    for (const hm of hammers) {
      const k = hm.t / .32, a = k < .35 ? -1.1 + k / .35 * 1.5 : .4 - (k - .35) * .6, z = cell * .9;
      ctx.save(); ctx.globalAlpha = k > .7 ? 1 - (k - .7) / .3 : 1; ctx.translate(hm.x + z * .55, hm.y + z * .5); ctx.rotate(a); ctx.drawImage(SPR.hammer, -z * .5 - z * .05, -z * 1.15, z, z * 1.2); ctx.restore();
    }
    FX.draw(ctx);
    drawHUD();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); FX.drawFlash(ctx, W, H);
  }
  function art(cv, kind, hammer) {
    const g = cv.getContext('2d');
    const glow = g.createRadialGradient(250, 260, 30, 250, 260, 250); glow.addColorStop(0, 'rgba(255,255,255,.8)'); glow.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = glow; g.fillRect(0, 0, 500, 500);
    for (let k = 0; k < 12; k++) { g.save(); g.translate(250, 260); g.rotate(k * Math.PI / 6); g.fillStyle = 'rgba(255,200,60,.18)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(-30, 250); g.lineTo(30, 250); g.fill(); g.restore(); }
    g.fillStyle = '#7a4a24'; g.beginPath(); g.ellipse(250, 400, 170, 46, 0, 0, 7); g.fill(); g.fillStyle = '#1a0a04'; g.beginPath(); g.ellipse(250, 395, 120, 30, 0, 0, 7); g.fill();
    g.save(); g.beginPath(); g.rect(0, 0, 500, 398); g.clip(); g.drawImage(SPR[kind], 150, 150, 200, 248); g.restore();
    g.fillStyle = '#a8784a'; g.beginPath(); g.ellipse(250, 404, 150, 22, 0, 0, Math.PI); g.fill();
    if (hammer) { g.save(); g.translate(390, 170); g.rotate(-.7); g.drawImage(SPR.hammer, -70, -84, 140, 168); g.restore(); }
  }

  resize();
  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
