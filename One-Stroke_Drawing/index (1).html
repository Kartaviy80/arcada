<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14301c">
<title>Fill Path</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14301c;
    font-family: "Avenir Next", "Segoe UI", sans-serif; color: #fff6dc;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; text-shadow: 0 2px 6px #0008; }
  .hud b { font-size: 25px; font-weight: 600; letter-spacing: 5px; color: #fff3c8; } .hud div { font-size: 13px; letter-spacing: 3px; opacity: .8; margin-top: 2px; color: #d9f2b0; }
  .tools { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .tools button { padding: 11px 16px; border-radius: 30px; border: 1px solid #f7e2a066; background: #3a2a14b0; color: #fff3c8; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; box-shadow: 0 3px 10px #0005; }
  .tools button:active { background: #6a4a20; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: radial-gradient(circle at 50% 40%, #24502ef0, #0d2213f4); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 210px; height: 210px; }
  h1 { font-size: clamp(38px, 11vw, 62px); font-weight: 700; letter-spacing: 8px; color: #fff3c8; text-shadow: 0 3px 0 #6a3d1a, 0 0 24px #ff8fb1aa; }
  p { max-width: 310px; font-size: 15px; line-height: 1.65; color: #d9ecc0; }
  .stat b { color: #ffd36a; font-weight: 600; }
  .btn { border: 2px solid #ffd36a; background: linear-gradient(#ff8fb1, #e0567f); color: #fff; font: inherit; font-weight: 700; font-size: 16px; letter-spacing: 6px; padding: 14px 44px; border-radius: 40px; cursor: pointer; box-shadow: 0 5px 0 #8a2b48, 0 8px 20px #0006; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a2b48; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b id="level">LEVEL 1</b><div id="count">0 / 0</div></div>
<div class="tools"><button id="undo">↶ Undo</button><button id="reset">⟳ Reset</button><button id="hint">✿ Hint</button></div>

<div class="overlay" id="menu">
  <canvas id="logo" width="420" height="420"></canvas>
  <h1>FILL PATH</h1>
  <p><b>Walk the ladybug over every mossy tile in one stroke.</b> Drag from the ladybug to a neighbouring tile — each tile can be visited only once, and flowers bloom where she walks. Drag back to undo.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">PLAY</button>
</div>
<div class="overlay hidden" id="win">
  <h1>BLOOMED</h1>
  <div class="stat">Garden <b id="winLevel">1</b> in full flower</div>
  <button class="btn" id="nextBtn">NEXT</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
(() => {
  const audio = GameAudio({
    bpm: 92, scale: 'pentaMajor', root: 60, prog: [0, 3, 4, 2], seed: 602,
    waves: { lead: 'triangle', bass: 'sine', arp: 'sine', pad: 'triangle' },
    pad: true, arp: true, arpEvery: 2, arpOct: 1, arpCutoff: 2400, leadOct: 1, leadDensity: 0.28, drums: 'soft', bassPattern: [0, 6, 8], volume: 0.17,
    btnBg: 'rgba(58,42,20,.7)', btnColor: '#ffd36a'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'fill_path_level';
  let level = 1; try { level = +localStorage.getItem(KEY) || 1; } catch (e) {}
  $('bestMenu').innerHTML = level > 1 ? 'Continue from garden <b>' + level + '</b>' : '';

  // ---------- artwork ----------
  let srand = 7; const sr = () => { srand = (srand * 16807) % 2147483647; return (srand - 1) / 2147483646; };
  const tuft = (n, cols) => { let s = ''; for (let i = 0; i < n; i++) { const x = 12 + sr() * 76, y = 12 + sr() * 72, r = 2 + sr() * 4; s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + cols[i % cols.length] + '" opacity="' + (0.35 + sr() * 0.45).toFixed(2) + '"/>'; } return s; };
  const clover = (x, y, s, c) => '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">' + [0, 120, 240].map(a => '<ellipse cx="0" cy="-5" rx="4" ry="5.5" fill="' + c + '" transform="rotate(' + a + ')"/>').join('') + '<circle r="1.4" fill="#2c5a1e"/></g>';
  const tileSVG = (a, b, c, lit) => svgDoc('<defs><radialGradient id="m" cx="38%" cy="30%" r="85%"><stop offset="0" stop-color="' + a + '"/><stop offset=".6" stop-color="' + b + '"/><stop offset="1" stop-color="' + c + '"/></radialGradient>' +
    '<linearGradient id="e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
    '<radialGradient id="l"><stop offset="0" stop-color="#fff6b0" stop-opacity=".55"/><stop offset="1" stop-color="#fff6b0" stop-opacity="0"/></radialGradient></defs>' +
    '<rect x="5" y="8" width="90" height="90" rx="20" fill="#0c2410" opacity=".55"/>' +
    '<rect x="5" y="4" width="90" height="89" rx="20" fill="url(#m)" stroke="' + shade(c, -0.35) + '" stroke-width="2.5"/>' +
    tuft(26, [shade(a, 0.25), shade(c, -0.15), shade(b, 0.15)]) +
    clover(24 + sr() * 50, 26 + sr() * 46, 0.9, shade(a, 0.1)) +
    '<rect x="11" y="8" width="78" height="34" rx="15" fill="url(#e)"/>' + (lit ? '<circle cx="50" cy="50" r="46" fill="url(#l)"/>' : '') +
    '<path d="M14 82 Q50 92 86 82" stroke="' + shade(c, -0.3) + '" stroke-width="2" fill="none" opacity=".5"/>');
  const stoneSVG = () => svgDoc('<defs><radialGradient id="s" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#d9d5c8"/><stop offset=".55" stop-color="#9a958a"/><stop offset="1" stop-color="#5a564e"/></radialGradient>' +
    '<radialGradient id="d" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#7a5232"/><stop offset="1" stop-color="#4a2e18"/></radialGradient></defs>' +
    '<rect x="5" y="6" width="90" height="90" rx="20" fill="url(#d)" stroke="#2e1a0c" stroke-width="2"/>' + tuft(18, ['#9a6a42', '#3a2210', '#b07a4a']) +
    '<ellipse cx="51" cy="80" rx="34" ry="9" fill="#1d1008" opacity=".55"/>' +
    '<path d="M18 70 Q14 40 34 26 Q52 14 70 24 Q88 36 84 62 Q80 82 52 82 Q24 84 18 70Z" fill="url(#s)" stroke="#3e3a33" stroke-width="2.5"/>' +
    '<path d="M38 30 Q46 44 40 56 M62 40 Q70 52 64 66" stroke="#55514a" stroke-width="2" fill="none" opacity=".7"/>' +
    '<path d="M30 30 Q48 16 68 24 Q60 30 52 30 Q40 30 30 38Z" fill="#6aa83f"/><path d="M34 31 Q48 21 62 25" stroke="#a6d86a" stroke-width="2" fill="none"/>' +
    '<ellipse cx="34" cy="46" rx="6" ry="9" fill="#fff" opacity=".35" transform="rotate(20 34 46)"/>');
  const flowerSVG = (pet, mid, n) => {
    let s = '<defs><radialGradient id="p" cx="50%" cy="85%" r="95%"><stop offset="0" stop-color="' + shade(pet, -0.35) + '"/><stop offset=".45" stop-color="' + pet + '"/><stop offset="1" stop-color="' + shade(pet, 0.55) + '"/></radialGradient>' +
      '<radialGradient id="c" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff3a0"/><stop offset=".6" stop-color="' + mid + '"/><stop offset="1" stop-color="' + shade(mid, -0.45) + '"/></radialGradient></defs>';
    s += '<path d="M50 54 Q30 70 16 64 Q28 52 50 54Z" fill="#4f9a3a" stroke="#2c5a1e" stroke-width="1.5"/><path d="M50 54 Q72 72 86 62 Q72 50 50 54Z" fill="#5fae44" stroke="#2c5a1e" stroke-width="1.5"/>';
    for (let i = 0; i < n; i++) s += '<path d="M50 50 Q38 30 50 12 Q62 30 50 50Z" fill="url(#p)" stroke="' + shade(pet, -0.4) + '" stroke-width="1.2" transform="rotate(' + (i * 360 / n) + ' 50 50)"/>';
    for (let i = 0; i < n; i++) s += '<path d="M50 44 L50 22" stroke="#fff" stroke-width="1.4" opacity=".35" transform="rotate(' + (i * 360 / n) + ' 50 50)"/>';
    s += '<circle cx="50" cy="50" r="10" fill="url(#c)" stroke="' + shade(mid, -0.5) + '" stroke-width="1.2"/>';
    for (let i = 0; i < 7; i++) { const a = i * 0.9; s += '<circle cx="' + (50 + Math.cos(a) * 5).toFixed(1) + '" cy="' + (50 + Math.sin(a) * 5).toFixed(1) + '" r="1.2" fill="' + shade(mid, -0.55) + '"/>'; }
    return svgDoc(s + '<circle cx="47" cy="47" r="3" fill="#fff" opacity=".7"/>');
  };
  const bugSVG = () => {
    let s = '<defs><radialGradient id="r" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ff8a70"/><stop offset=".45" stop-color="#e2281e"/><stop offset="1" stop-color="#6e0a08"/></radialGradient>' +
      '<radialGradient id="h" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#4a4a52"/><stop offset="1" stop-color="#0c0c10"/></radialGradient></defs>';
    s += '<ellipse cx="53" cy="60" rx="30" ry="33" fill="#000" opacity=".3"/>';
    for (const [y, a] of [[44, -30], [58, 0], [72, 30]]) { s += '<path d="M50 ' + y + ' L20 ' + (y + a * 0.25 - 4) + ' L14 ' + (y + a * 0.4) + '" stroke="#111" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 ' + y + ' L80 ' + (y + a * 0.25 - 4) + ' L86 ' + (y + a * 0.4) + '" stroke="#111" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'; }
    s += '<path d="M44 20 Q38 8 30 6" stroke="#111" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M56 20 Q62 8 70 6" stroke="#111" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="30" cy="6" r="3" fill="#222"/><circle cx="70" cy="6" r="3" fill="#222"/>';
    s += '<ellipse cx="50" cy="26" rx="15" ry="11" fill="url(#h)" stroke="#000" stroke-width="1.5"/><ellipse cx="42" cy="24" rx="4" ry="3.5" fill="#fff"/><ellipse cx="58" cy="24" rx="4" ry="3.5" fill="#fff"/><circle cx="42" cy="23" r="1.6" fill="#111"/><circle cx="58" cy="23" r="1.6" fill="#111"/>';
    s += '<path d="M50 30 C24 30 18 52 20 66 C22 86 40 94 50 94 C60 94 78 86 80 66 C82 52 76 30 50 30Z" fill="url(#r)" stroke="#3a0404" stroke-width="2"/>';
    s += '<path d="M50 31 L50 94" stroke="#2a0303" stroke-width="2.4"/>';
    for (const [x, y, r] of [[36, 46, 6], [64, 46, 6], [30, 66, 6.5], [70, 66, 6.5], [40, 82, 5], [60, 82, 5], [50, 38, 4.5]]) s += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#160606"/>';
    s += '<path d="M30 46 Q34 36 46 34" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".55"/><ellipse cx="66" cy="38" rx="4" ry="2.5" fill="#fff" opacity=".35" transform="rotate(30 66 38)"/>';

  };
  const FLOWERS = [['#ff7aa8', '#ffcf3a', 6], ['#ffffff', '#ffc21a', 10], ['#b48cff', '#ffe066', 5], ['#ffad5a', '#ff6a3a', 7], ['#7ec8ff', '#fff07a', 6], ['#ff5a6e', '#ffd84a', 8]];
  let SPR = null;
  const defs = { stone: stoneSVG(), bug: bugSVG() };
  for (let i = 0; i < 3; i++) { defs['moss' + i] = tileSVG('#8fca55', '#4f9a3a', '#2e6a28'); defs['lit' + i] = tileSVG('#d6f08a', '#8cc94e', '#4f8f30', true); }
  FLOWERS.forEach((f, i) => defs['fl' + i] = flowerSVG(f[0], f[1], f[2]));
  loadSprites(defs, 128).then(s => { SPR = s; logo(); });

  // ---------- level generator: random Hamiltonian path (backbite moves), stones placed off the path ----------
  const SIZES = [[4, 4], [4, 5], [5, 5], [5, 6], [6, 6], [6, 7], [7, 7], [7, 8], [7, 9], [8, 9]];
  function generate(lv) {

      blocked[path.pop()] = 1;
    }
    shuffle(N * 20);
    return { cols, rows, blocked, sol: path, start: path[0] };
  }

  let W, H, DPR, G, cell, ox, oy, path, inPath, bloom, state = 'menu', t = 0, drag = null, sparks = [], petals = [], winT = 0, bug = null, blades = [], flies = [], hintCells = [], hintT = 0;
  function resize() {

    if (!G) return;

  addEventListener('resize', resize); resize();
  const C = i => ({ x: ox + (i % G.cols + 0.5) * cell, y: oy + (Math.floor(i / G.cols) + 0.5) * cell });
  const free = () => G.cols * G.rows - G.blocked.reduce((a, b) => a + b, 0);

  function load() {

    bloom = new Float32Array(G.cols * G.rows).fill(-1); bloom[G.start] = t; winT = 0; hintCells = []; resize();

  }
  function hud() { $('level').textContent = 'GARDEN ' + level; $('count').textContent = path.length + ' / ' + free() + ' tiles'; }
  function start() { if (!SPR) return; load(); state = 'play'; audio.start(); $('menu').classList.add('hidden'); $('win').classList.add('hidden'); }
  $('startBtn').onclick = start;
  $('nextBtn').onclick = () => { level++; try { localStorage.setItem(KEY, level); } catch (e) {} start(); };
  const truncate = k => { while (path.length > k) { const v = path.pop(); inPath[v] = 0; bloom[v] = -1; } hud(); };
  $('reset').onclick = () => { if (state === 'play') { truncate(1); audio.sfx(300, 0.2, 'triangle', 0.05, 150); } };
  $('undo').onclick = () => { if (state === 'play' && path.length > 1) { truncate(path.length - 1); audio.sfx(420, 0.12, 'triangle', 0.05, 300); } };
  $('hint').onclick = () => {
    if (state !== 'play') return;
    let k = 0; while (k < path.length && path[k] === G.sol[k]) k++;
    truncate(k);
    hintCells = G.sol.slice(k, k + 3); hintT = 2.2;
    visit(G.sol[k]);
  };

  const NOTES = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
  function visit(i) {
    path.push(i); inPath[i] = 1; bloom[i] = t;
    audio.sfx(392 * Math.pow(2, NOTES[path.length % NOTES.length] / 12), 0.22, 'sine', 0.06);
    const p = C(i); for (let k = 0; k < 10; k++) { const a = Math.random() * 6.28, v = 40 + Math.random() * 90; sparks.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: 0.7, c: Math.random() < 0.5 ? '#fff6a0' : '#ffd0e0' }); }

    if (path.length === free()) {

      [523, 659, 784, 880, 1046, 1318].forEach((f, k) => setTimeout(() => audio.sfx(f, 0.45, 'triangle', 0.06), k * 110));
      setTimeout(() => $('win').classList.remove('hidden'), 1500);
    }
  }
  function stepTo(i) {
    const head = path[path.length - 1];
    if (i < 0 || i === head) return;
    if (path.length > 1 && i === path[path.length - 2]) { truncate(path.length - 1); audio.sfx(330, 0.08, 'sine', 0.03); return; }
    if (!inPath[i] && !G.blocked[i] && adj(head, i)) visit(i);
  }
  function cellAt(x, y) { const c = Math.floor((x - ox) / cell), r = Math.floor((y - oy) / cell); return c < 0 || r < 0 || c >= G.cols || r >= G.rows ? -1 : r * G.cols + c; }
  canvas.addEventListener('pointerdown', e => {

    const i = cellAt(e.clientX, e.clientY); if (i < 0) return;

  });
  addEventListener('pointermove', e => {

  });
  addEventListener('pointerup', () => { drag = null; });
  addEventListener('pointercancel', () => { drag = null; });
  addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && state === 'menu') { e.preventDefault(); start(); } });
  if (/test/.test(location.search)) window.__fillpath = { sol: () => G.sol.map(C), state: () => state, level: () => level, count: () => path.length };

  function update(dt) {
    t += dt; if (winT) winT += dt; if (hintT > 0) hintT -= dt;
    for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 60 * dt; s.life -= dt; } sparks = sparks.filter(s => s.life > 0);

      bug.x += dx * Math.min(1, dt * 16); bug.y += dy * Math.min(1, dt * 16);

  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  function background() {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2f6a3a'); g.addColorStop(0.5, '#1d4a28'); g.addColorStop(1, '#10301a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const x = W * (0.1 + i * 0.22) + Math.sin(t * 0.2 + i) * 30, gr = ctx.createLinearGradient(x, 0, x + 160, H);
      gr.addColorStop(0, 'rgba(255,240,170,.10)'); gr.addColorStop(1, 'rgba(255,240,170,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(x - 30, 0); ctx.lineTo(x + 40, 0); ctx.lineTo(x + 260, H); ctx.lineTo(x + 120, H); ctx.fill();
    }
    ctx.restore();
    // leafy bokeh
    for (let i = 0; i < 14; i++) { const x = (i * 197.3) % W, y = (i * 113.7) % H, r = 20 + (i * 37) % 50; const gr = ctx.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(160,220,110,.10)'); gr.addColorStop(1, 'rgba(160,220,110,0)'); ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
    // swaying grass at the bottom and top
    for (const top of [false, true]) for (const b of blades) {
      const base = top ? 0 : H, dir = top ? 1 : -1, h = b.h * (top ? 0.6 : 1), sway = Math.sin(t * 1.6 + b.ph + b.x * 0.01) * 6;
      ctx.strokeStyle = b.c < 0.5 ? (top ? '#285a2c' : '#3f8a34') : (top ? '#1f4a24' : '#5aa83c'); ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(b.x, base); ctx.quadraticCurveTo(b.x + sway * 0.4, base + dir * h * 0.6, b.x + sway, base + dir * h); ctx.stroke();
    }
    // fireflies
    for (const f of flies) {
      const x = ((f.x * W + Math.sin(t * 0.3 * f.s + f.ph) * 40) % W + W) % W, y = ((f.y * H + Math.cos(t * 0.25 * f.s + f.ph) * 30 - t * 6 * f.s) % H + H) % H;
      const a = 0.25 + 0.5 * Math.abs(Math.sin(t * 1.3 + f.ph)), gr = ctx.createRadialGradient(x, y, 0, x, y, 9);
      gr.addColorStop(0, 'rgba(255,250,170,' + a + ')'); gr.addColorStop(1, 'rgba(255,250,170,0)'); ctx.fillStyle = gr; ctx.fillRect(x - 9, y - 9, 18, 18);
    }
  }
  function planter() {
    const pad = Math.max(10, cell * 0.22), x = ox - pad, y = oy - pad, w = cell * G.cols + pad * 2, h = cell * G.rows + pad * 2;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
    const wood = ctx.createLinearGradient(x, y, x, y + h); wood.addColorStop(0, '#b07a42'); wood.addColorStop(0.5, '#8a5a2c'); wood.addColorStop(1, '#5e3a1a');
    ctx.fillStyle = wood; rr(x, y, w, h, pad * 0.9); ctx.fill(); ctx.restore();
    // wood grain
    ctx.save(); rr(x, y, w, h, pad * 0.9); ctx.clip(); ctx.strokeStyle = 'rgba(60,30,10,.28)'; ctx.lineWidth = 1.2;
    for (let k = 0; k < h; k += 9) { ctx.beginPath(); ctx.moveTo(x, y + k); for (let xx = 0; xx <= w; xx += 20) ctx.lineTo(x + xx, y + k + Math.sin(xx * 0.05 + k) * 2.5); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,220,160,.35)'; ctx.lineWidth = 2; rr(x + 1.5, y + 1.5, w - 3, h - 3, pad * 0.85); ctx.stroke();

    const soil = ctx.createRadialGradient(ox + w / 2, oy + h / 2, 0, ox + w / 2, oy + h / 2, Math.max(w, h)); soil.addColorStop(0, '#5a3a20'); soil.addColorStop(1, '#2e1b0c');
    ctx.fillStyle = soil; rr(ox - 3, oy - 3, cell * G.cols + 6, cell * G.rows + 6, 10); ctx.fill();
    // corner nails
    for (const [cx, cy] of [[x + pad * 0.5, y + pad * 0.5], [x + w - pad * 0.5, y + pad * 0.5], [x + pad * 0.5, y + h - pad * 0.5], [x + w - pad * 0.5, y + h - pad * 0.5]]) {
      const ng = ctx.createRadialGradient(cx - 1, cy - 1, 0, cx, cy, 4); ng.addColorStop(0, '#f4ead0'); ng.addColorStop(1, '#6a5a40'); ctx.fillStyle = ng; ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, 6.29); ctx.fill();
    }
  }
  const easeBack = k => { k = Math.min(1, k); const s = 1.9; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
  function render() {
    background();
    if (!G || !SPR) return;
    planter();
    const N = G.cols * G.rows, gap = cell * 0.04;
    for (let i = 0; i < N; i++) {
      const p = C(i), s = cell - gap;
      const img = G.blocked[i] ? SPR.stone : inPath[i] ? SPR['lit' + (i % 3)] : SPR['moss' + ((i * 7) % 3)];
      ctx.drawImage(img, p.x - s / 2, p.y - s / 2, s, s);
    }
    // hint glow
    if (hintT > 0) hintCells.forEach((v, k) => { if (inPath[v]) return; const p = C(v); ctx.strokeStyle = 'rgba(255,240,140,' + Math.min(1, hintT) * (0.9 - k * 0.25) + ')'; ctx.lineWidth = 3; ctx.setLineDash([6, 5]); ctx.lineDashOffset = -t * 20; rr(p.x - cell * 0.4, p.y - cell * 0.4, cell * 0.8, cell * 0.8, cell * 0.18); ctx.stroke(); ctx.setLineDash([]); });

    if (path.length > 1) {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const trace = () => { ctx.beginPath(); path.forEach((v, k) => { const p = C(v); k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }); };
      ctx.save(); ctx.shadowColor = '#fff27a'; ctx.shadowBlur = winT ? 28 : 16; trace(); ctx.strokeStyle = 'rgba(255,226,110,.75)'; ctx.lineWidth = cell * 0.16; ctx.stroke(); ctx.restore();
      trace(); ctx.strokeStyle = 'rgba(255,255,230,.9)'; ctx.lineWidth = cell * 0.05; ctx.stroke();
      // travelling sparkles
      for (let k = 0; k < path.length - 1; k++) { const a = C(path[k]), b = C(path[k + 1]), f = (t * 1.2 + k * 0.37) % 1; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, cell * 0.035 + 1, 0, 6.29); ctx.fill(); }
    }
    // flowers bloom on visited tiles
    path.forEach((v, k) => {
      if (k === path.length - 1 && state === 'play') return;
      const p = C(v), age = t - bloom[v], sc = easeBack(age / 0.45) * (winT ? 1 + 0.12 * Math.sin(winT * 8 + k) : 1), s = cell * 0.62 * sc;
      if (s <= 0) return;
      ctx.save(); ctx.translate(p.x + cell * 0.14 * ((v * 13) % 3 - 1) * 0.6, p.y + cell * 0.1 * ((v * 7) % 3 - 1) * 0.6); ctx.rotate(Math.sin(t * 1.5 + v) * 0.08 + v);
      ctx.drawImage(SPR['fl' + ((v * 5 + level) % FLOWERS.length)], -s / 2, -s / 2, s, s); ctx.restore();
    });
    // start marker ring
    if (path.length === 1 && state === 'play') { const p = C(G.start), r = cell * (0.42 + 0.04 * Math.sin(t * 4)); ctx.strokeStyle = 'rgba(255,240,150,.85)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.29); ctx.stroke(); }

      const s = cell * 0.78 * (1 + 0.04 * Math.sin(t * 9)), fade = winT ? Math.max(0, 1 - winT / 1.2) : 1;
      ctx.save(); ctx.globalAlpha = fade; ctx.translate(bug.x, bug.y - (winT ? winT * 60 : 0)); ctx.rotate(bug.a); ctx.drawImage(SPR.bug, -s / 2, -s / 2, s, s); ctx.restore();
    }
    for (const s of sparks) { ctx.globalAlpha = Math.max(0, s.life * 1.4); ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, 2.2, 0, 6.29); ctx.fill(); }
    for (const s of petals) { ctx.globalAlpha = Math.max(0, Math.min(1, s.life)); ctx.fillStyle = s.c; ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.r); ctx.beginPath(); ctx.ellipse(0, 0, 6, 3, 0, 0, 6.29); ctx.fill(); ctx.restore(); }
    ctx.globalAlpha = 1;
  }
  function logo() {
    const lc = $('logo').getContext('2d'), n = 3, cs = 112, o = 210 - cs * 1.5;
    const seq = [6, 3, 0, 1, 4, 7, 8, 5, 2], P = i => ({ x: o + (i % n + 0.5) * cs, y: o + (Math.floor(i / n) + 0.5) * cs });
    lc.save(); lc.shadowColor = '#0008'; lc.shadowBlur = 20; lc.shadowOffsetY = 8; lc.fillStyle = '#7a4e26'; lc.beginPath(); lc.roundRect ? lc.roundRect(o - 18, o - 18, cs * 3 + 36, cs * 3 + 36, 24) : lc.rect(o - 18, o - 18, cs * 3 + 36, cs * 3 + 36); lc.fill(); lc.restore();
    for (let i = 0; i < 9; i++) { const p = P(i); lc.drawImage(i === 2 ? SPR.moss0 : SPR['lit' + (i % 3)], p.x - cs / 2 + 2, p.y - cs / 2 + 2, cs - 4, cs - 4); }
    lc.lineCap = 'round'; lc.lineJoin = 'round'; lc.shadowColor = '#fff27a'; lc.shadowBlur = 18; lc.strokeStyle = 'rgba(255,226,110,.85)'; lc.lineWidth = 16;
    lc.beginPath(); seq.slice(0, 8).forEach((v, k) => { const p = P(v); k ? lc.lineTo(p.x, p.y) : lc.moveTo(p.x, p.y); }); lc.stroke(); lc.shadowBlur = 0;
    lc.strokeStyle = '#fffbe0'; lc.lineWidth = 5; lc.stroke();
    seq.slice(0, 7).forEach((v, k) => { const p = P(v); lc.drawImage(SPR['fl' + (k % FLOWERS.length)], p.x - 34, p.y - 34, 68, 68); });
    const b = P(5); lc.save(); lc.translate(b.x, b.y); lc.drawImage(SPR.bug, -50, -50, 100, 100); lc.restore();
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
