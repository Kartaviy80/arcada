<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1a10">
<title>Word Cascade</title>
<style>
  :root { --f: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif; --ink: #3a2414; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2a1a10; color: #fff; font-family: var(--f); font-weight: 800;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; font-weight: 900; cursor: pointer; border: none; color: inherit; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }

  #coinsTop { position: fixed; z-index: 35; top: max(10px, env(safe-area-inset-top)); right: 12px; height: 36px; min-width: 92px; padding: 0 14px 0 5px;
    display: flex; align-items: center; gap: 7px; border-radius: 20px; font-size: 18px; color: #fff; letter-spacing: .5px;
    background: linear-gradient(180deg, rgba(60,36,18,.82), rgba(28,16,8,.85)); border: 2px solid rgba(255,214,140,.6);
    box-shadow: 0 3px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25); text-shadow: 0 2px 2px rgba(0,0,0,.5); transition: transform .12s; }
  #coinsTop.bump { transform: scale(1.14); }
  #coinsTop.poor { animation: shakeX .35s; }
  @keyframes shakeX { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .coin { display: inline-block; width: 25px; height: 25px; border-radius: 50%; flex: none; position: relative;
    background: radial-gradient(circle at 38% 32%, #fff7c4 0 12%, #ffd84a 34%, #f0a316 72%, #b86e08 100%); box-shadow: inset 0 -2px 0 rgba(120,60,0,.55), 0 1px 2px rgba(0,0,0,.4); }
  .coin::after { content: "W"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #b8700a; text-shadow: 0 1px 0 #fff3b0; }

  .btn { position: relative; border: 3px solid #fff4c8; padding: 12px 54px 14px; border-radius: 40px; font-size: 28px; letter-spacing: 4px; color: #fff;
    background: linear-gradient(180deg, #ffe07a 0%, #ffab35 48%, #f37a1c 100%); text-shadow: 0 2px 0 #b2500c, 0 0 8px rgba(160,60,0,.4);
    box-shadow: 0 7px 0 #a9480e, 0 12px 24px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6); animation: pulse 1.8s ease-in-out infinite; white-space: nowrap; }
  .btn small { display: block; font-size: 13px; letter-spacing: 3px; margin-top: 2px; color: #fff8e0; text-shadow: 0 1px 0 #b2500c; }
  .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #a9480e, inset 0 2px 0 rgba(255,255,255,.6); }
  .btn.green { background: linear-gradient(180deg, #b6f27a 0%, #5fd04a 48%, #2fa63a 100%); text-shadow: 0 2px 0 #1d6a24; box-shadow: 0 7px 0 #1f7a2c, 0 12px 24px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); }
  .btn.green:active { box-shadow: 0 2px 0 #1f7a2c; }
  .btn.blue { background: linear-gradient(180deg, #9ae0ff 0%, #4aa8f0 50%, #2a6ad0 100%); text-shadow: 0 2px 0 #1a3a8a; box-shadow: 0 7px 0 #1a3a8a, 0 12px 24px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); }
  @keyframes pulse { 50% { filter: brightness(1.08); transform: scale(1.03); } }
  .btn2 { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; border-radius: 22px; font-size: 15px; letter-spacing: 2px; color: #fff;
    background: linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.08)); border: 2px solid rgba(255,236,200,.55);
    box-shadow: 0 4px 0 rgba(0,0,0,.28), 0 6px 16px rgba(0,0,0,.2); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .btn2:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .btn2 svg { width: 18px; height: 18px; }
  .link { background: none; color: #9a7a5a; font-size: 14px; letter-spacing: 3px; padding: 6px 14px; }

  #menu { justify-content: space-between; background: linear-gradient(180deg, rgba(20,10,4,.72) 0%, rgba(20,10,4,.25) 26%, rgba(20,10,4,0) 40%, rgba(20,10,4,0) 62%, rgba(20,10,4,.7) 84%, rgba(20,10,4,.86) 100%); }
  .mtop, .mbot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .mtop { padding-top: 48px; } .mbot { padding-bottom: 40px; }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .wordw { font-size: clamp(50px, 15vw, 84px); line-height: .9; font-weight: 900; letter-spacing: 10px; margin-right: -10px;
    background: linear-gradient(180deg, #fffbe8 0%, #ffe27a 34%, #ff9a2e 66%, #d2441c 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #6a2a08) drop-shadow(0 0 18px rgba(255,170,80,.5)); }
  .tiles { display: flex; gap: 3px; }
  .tiles b { width: 46px; height: 49px; display: block; background: no-repeat center/100% 100%; animation: drop 3.2s cubic-bezier(.3,1.4,.5,1) infinite; }
  .tiles b:nth-child(2) { animation-delay: .1s; } .tiles b:nth-child(3) { animation-delay: .2s; } .tiles b:nth-child(4) { animation-delay: .3s; }
  .tiles b:nth-child(5) { animation-delay: .4s; } .tiles b:nth-child(6) { animation-delay: .5s; } .tiles b:nth-child(7) { animation-delay: .6s; }
  @keyframes drop { 0% { transform: translateY(-14px); opacity: .0; } 8% { opacity: 1; } 16%, 80% { transform: translateY(0); } 88% { transform: translateY(-5px); } 100% { transform: translateY(0); } }
  .tag { font-size: 12px; letter-spacing: 6px; color: #fff0d8; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
  .chap { font-size: 14px; letter-spacing: 3px; color: #ffe2a8; text-shadow: 0 2px 4px rgba(0,0,0,.85); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .stats { font-size: 12px; letter-spacing: 1px; color: #fff4e4; text-shadow: 0 1px 3px #000; opacity: .92; }
  .stats b { color: #ffd86a; }

  .dim { background: radial-gradient(ellipse at 50% 40%, rgba(50,26,10,.55), rgba(14,8,4,.88)); }
  .card { position: relative; width: min(92vw, 390px); padding: 24px 20px 14px; border-radius: 28px; color: var(--ink);
    background: linear-gradient(180deg, #fffaf0 0%, #f7ead4 60%, #efd9b6 100%); border: 3px solid #fff;
    box-shadow: 0 10px 0 #c49a64, 0 24px 50px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .ptitle { font-size: 30px; letter-spacing: 3px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #8a4a14, 0 0 14px rgba(255,160,60,.4); }
  .ribbon { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); padding: 8px 30px; font-size: 20px; letter-spacing: 3px; white-space: nowrap; color: #fff;
    background: linear-gradient(180deg, #ff9a5a, #e8502a); border-radius: 10px; box-shadow: 0 4px 0 #9a2a0a, 0 8px 16px rgba(0,0,0,.3); text-shadow: 0 2px 0 #9a2a0a; }
  .ribbon.gold { background: linear-gradient(180deg, #ffd84a, #f0a01a); box-shadow: 0 4px 0 #9a5a0a, 0 8px 16px rgba(0,0,0,.3); text-shadow: 0 2px 0 #9a5a0a; }
  .ribbon.violet { background: linear-gradient(180deg, #c08aff, #7a4ae0); box-shadow: 0 4px 0 #3a2a90, 0 8px 16px rgba(0,0,0,.3); text-shadow: 0 2px 0 #3a2a90; }
  .wl { margin-top: 8px; font-size: 13px; letter-spacing: 4px; color: #a07a52; }
  .wt { font-size: 36px; letter-spacing: 2px; font-weight: 900; background: linear-gradient(180deg, #ffbe3a, #e8501a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 #fff); }
  .stars { display: flex; gap: 6px; align-items: flex-end; height: 70px; }
  .stars i { width: 60px; height: 60px; display: block; transform: scale(0); background: no-repeat center/contain; }
  .stars i:nth-child(2) { width: 72px; height: 72px; }
  .stars i.on { animation: starIn .5s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  .stars i.off { animation: starIn .4s ease-out forwards; filter: grayscale(1) brightness(.8) opacity(.35); }
  @keyframes starIn { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
  .wrows { width: 100%; display: flex; flex-direction: column; gap: 5px; font-size: 15px; }
  .wrows div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 12px; border-radius: 12px; background: rgba(160,100,40,.1); }
  .wrows div b { color: #6a3a14; } .wrows div.ok b { color: #2a9a4a; } .wrows div.no b { color: #c0a888; }
  .wcoins { display: flex; align-items: center; gap: 8px; font-size: 30px; color: #e8901a; font-weight: 900; text-shadow: 0 2px 0 #fff3c8; }
  .newbest { font-size: 14px; letter-spacing: 3px; color: #fff; padding: 5px 16px; border-radius: 8px; transform: rotate(-3deg);
    background: linear-gradient(90deg, #ff5a8a, #ffa02a); box-shadow: 0 3px 0 #a02a3a; animation: pulse 1.2s infinite; }
  .pbtns { display: flex; flex-direction: column; gap: 14px; align-items: center; margin-top: 6px; }
  .pbtns .btn { min-width: 230px; font-size: 22px; padding: 10px 30px 12px; animation: none; }
  .ptxt { font-size: 15px; color: #7a5a3a; line-height: 1.35; }

  .sheet { justify-content: flex-start; padding-top: max(14px, env(safe-area-inset-top)); background: radial-gradient(ellipse at 50% 0%, #6a3a1a, #2a160a 55%, #120a04); }
  .phead { width: min(94vw, 760px); display: flex; align-items: center; gap: 14px; min-height: 44px; padding-right: 110px; }
  .x { width: 44px; height: 44px; border-radius: 50%; font-size: 20px; color: #fff; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.4); flex: none; }
  .scroll { width: min(94vw, 760px); flex: 1; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 8px 4px 70px; }
  .tabs { display: flex; gap: 8px; margin: 2px 0; }
  .tabs button { padding: 9px 22px; border-radius: 18px; font-size: 14px; letter-spacing: 2px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.3); }
  .tabs button.on { background: linear-gradient(180deg, #ffe07a, #f39a2a); color: #5a2a00; border-color: #fff4c8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; }
  .sc { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 8px 12px; border-radius: 18px; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
    border: 2px solid rgba(255,255,255,.22); box-shadow: 0 6px 14px rgba(0,0,0,.3); }
  .sc.eq { border-color: #7aff9a; box-shadow: 0 0 0 3px rgba(122,255,154,.25); }
  .sc canvas { width: 100%; max-width: 170px; aspect-ratio: 17/9; }
  .sc .sn { font-size: 13px; letter-spacing: 2px; } .sc .sd { font-size: 11px; color: #f0dcc0; opacity: .8; font-weight: 700; min-height: 28px; }
  .sc button { min-width: 110px; padding: 7px 12px; border-radius: 14px; font-size: 13px; letter-spacing: 1px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    background: linear-gradient(180deg, #ffe07a, #f39a2a); color: #5a2a00; box-shadow: 0 3px 0 #a9480e; }
  .sc button.own { background: linear-gradient(180deg, #8ae8ff, #3a9ae8); color: #fff; box-shadow: 0 3px 0 #1a5a9a; }
  .sc button.on { background: #2aa84a; color: #fff; box-shadow: 0 3px 0 #146a2a; }
  .sc button.poor { filter: grayscale(.7); opacity: .7; }
  .sc button .coin { width: 16px; height: 16px; } .sc button .coin::after { font-size: 8px; }
  .chaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .cc { position: relative; border-radius: 18px; overflow: hidden; border: 2px solid rgba(255,255,255,.25); box-shadow: 0 6px 16px rgba(0,0,0,.4); text-align: left; }
  .cc canvas { display: block; width: 100%; aspect-ratio: 16/8; }
  .cc div { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 7px; background: linear-gradient(180deg, transparent, rgba(0,0,0,.75)); }
  .cc .cn { font-size: 10px; letter-spacing: 3px; color: #ffd8a0; } .cc .ct { font-size: 16px; } .cc .cs { font-size: 12px; color: #ffd86a; }
  .cc.lock { filter: saturate(.15) brightness(.55); } .cc.cur { border-color: #ffd86a; box-shadow: 0 0 0 3px rgba(255,216,106,.35); }
  .ach { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .ach div { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 14px; text-align: left; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.12); }
  .ach div.done { border-color: rgba(255,216,106,.6); background: rgba(255,200,90,.14); }
  .ach i { font-style: normal; font-size: 22px; text-align: center; } .ach b { display: block; font-size: 15px; } .ach small { font-size: 12px; color: #f0dcc0; font-weight: 700; } .ach em { font-style: normal; font-size: 13px; color: #ffd86a; }
  .h3 { font-size: 13px; letter-spacing: 4px; color: #ffd8a0; margin: 6px 2px 10px; text-align: left; }
  #tip .card { gap: 8px; } #tip canvas { width: 96px; height: 96px; } #tip h3 { font-size: 22px; letter-spacing: 2px; color: #8a3a10; } #tip .btn { font-size: 20px; padding: 9px 40px 11px; animation: none; }
  #toast { position: fixed; z-index: 30; left: 50%; top: 70px; transform: translate(-50%, -30px); opacity: 0; transition: .35s; padding: 9px 18px; border-radius: 16px; font-size: 14px; letter-spacing: 1px; white-space: nowrap;
    background: linear-gradient(180deg, #ffe9a8, #ffc24a); color: #5a2a00; box-shadow: 0 4px 0 #a9680e, 0 8px 18px rgba(0,0,0,.35); pointer-events: none; }
  #toast.on { transform: translate(-50%, 0); opacity: 1; }

  @media (orientation: landscape) and (min-aspect-ratio: 21/20) {
    #menu { align-items: flex-start; padding-left: max(28px, env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(20,10,4,.78) 0%, rgba(20,10,4,.45) 40%, rgba(20,10,4,0) 54%); }
    .mtop, .mbot { width: 46%; } .mtop { padding-top: 6px; } .mbot { padding-bottom: 6px; }
  }
  @media (max-height: 700px) and (min-height: 521px) {
    .tiles b { width: 40px; height: 43px; } .wordw { font-size: 58px; } .btn { padding: 10px 46px 12px; font-size: 24px; } .mtop { padding-top: 40px; } .mbot { padding-bottom: 26px; }
    .stars { height: 58px; } .stars i { width: 50px; height: 50px; } .stars i:nth-child(2) { width: 60px; height: 60px; } .card { gap: 6px; padding: 20px 18px 10px; } .wt { font-size: 30px; }
    .wrows { font-size: 14px; gap: 4px; } .wrows div { padding: 4px 12px; } .wcoins { font-size: 26px; } .stats { display: none; }
  }
  @media (max-width: 400px) { .tag { font-size: 10px; letter-spacing: 4px; } .row { gap: 7px; } .btn2 { padding: 8px 11px; font-size: 13px; letter-spacing: 1px; gap: 5px; } .btn2 svg { width: 15px; height: 15px; } .tiles b { width: 40px; height: 43px; } }
  @media (max-height: 520px) {
    .overlay { gap: 6px; } .mtop, .mbot { gap: 6px; }
    .tiles b { width: 32px; height: 34px; } .wordw { font-size: 40px; letter-spacing: 6px; } .tag { font-size: 10px; letter-spacing: 4px; }
    .btn { padding: 7px 36px 9px; font-size: 20px; } .btn small { font-size: 11px; } .btn2 { padding: 7px 12px; font-size: 13px; } .stats { display: none; }
    .card { flex-direction: row; flex-wrap: wrap; justify-content: center; width: min(94vw, 660px); padding: 14px 16px 10px; gap: 6px 14px; }
    .card .wrows { width: 48%; } .card .wt { font-size: 26px; } .stars { height: 46px; } .stars i { width: 40px; height: 40px; } .stars i:nth-child(2) { width: 46px; height: 46px; }
    .wrows div { padding: 3px 10px; font-size: 13px; } .wcoins { font-size: 22px; } .ptitle { font-size: 24px; } .wl { margin-top: 0; width: 100%; }
    .pbtns { flex-direction: row; } .pbtns .btn { min-width: 0; font-size: 17px; padding: 8px 20px 10px; }
    .ribbon { top: -18px; font-size: 15px; padding: 5px 22px; } #tip canvas { width: 60px; height: 60px; } #tip .ptxt { width: 70%; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="coinsTop"><span class="coin"></span><span id="coinNum">0</span></div>
<div id="toast"></div>

<div class="overlay" id="menu">
  <div class="mtop">
    <div class="logo"><div class="wordw">WORD</div><div class="tiles" id="logoTiles"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div></div>
    <div class="tag">✦ SPELL · DROP · CASCADE ✦</div>
  </div>
  <div class="mbot">
    <div class="chap" id="menuChap">CHAPTER 1 · THE GREAT LIBRARY</div>
    <button class="btn" id="startBtn">PLAY<small id="startLvl">LEVEL 1</small></button>
    <div class="row">
      <button class="btn2" id="journeyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>JOURNEY</button>
      <button class="btn2" id="shopBtn"><svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2" opacity=".7"/><rect x="3" y="13" width="8" height="8" rx="2" opacity=".7"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>SHOP</button>
      <button class="btn2" id="sfxBtn">SFX ON</button>
    </div>
    <div class="stats" id="menuStats"></div>
  </div>
</div>

<div class="overlay hidden dim" id="win">
  <div class="card">
    <div class="ribbon gold" id="winRibbon">LEVEL COMPLETE</div>
    <div class="wl" id="winLvl">LEVEL 1</div>
    <div class="wt" id="winTitle">SPLENDID!</div>
    <div class="stars" id="winStars"><i></i><i></i><i></i></div>
    <div class="newbest" id="winBest">NEW BEST!</div>
    <div class="wrows" id="winRows"></div>
    <div class="wcoins"><span class="coin"></span><span id="winCoins">+0</span></div>
    <button class="btn green" id="nextBtn">NEXT<small id="nextLvl">LEVEL 2</small></button>
    <button class="link" id="winHome">HOME</button>
  </div>
</div>

<div class="overlay hidden dim" id="fail">
  <div class="card">
    <div class="ribbon" id="failRibbon">OUT OF MOVES</div>
    <div class="wl" id="failLvl">LEVEL 5</div>
    <div class="ptxt" id="failTxt">So close!</div>
    <div class="pbtns">
      <button class="btn green" id="moreBtn">+5 MOVES</button>
      <button class="btn" id="retryBtn">RETRY</button>
    </div>
    <button class="link" id="failHome">HOME</button>
  </div>
</div>

<div class="overlay hidden dim" id="pause">
  <div class="card">
    <div class="ribbon violet">PAUSED</div>
    <div class="wl" id="pauseLvl">LEVEL 1</div>
    <div class="ptxt" id="pauseObj"></div>
    <div class="pbtns">
      <button class="btn green" id="resumeBtn">RESUME</button>
      <button class="btn" id="restartBtn">RESTART</button>
    </div>
    <div class="row"><button class="link" id="pauseSfx">SFX ON</button><button class="link" id="pauseHome">HOME</button></div>
  </div>
</div>

<div class="overlay hidden dim" id="tip">
  <div class="card">
    <div class="ribbon violet" id="tipRibbon">NEW!</div>
    <canvas id="tipIcon" width="192" height="192"></canvas>
    <h3 id="tipTitle">FIRE TILES</h3>
    <div class="ptxt" id="tipTxt"></div>
    <button class="btn green" id="tipOk">GOT IT</button>
  </div>
</div>

<div class="overlay hidden sheet" id="journey">
  <div class="phead"><button class="x" id="journeyClose">✕</button><div class="ptitle">JOURNEY</div></div>
  <div class="scroll"><div class="h3">CHAPTERS</div><div class="chaps" id="chapList"></div><div class="h3" style="margin-top:20px">TROPHIES</div><div class="ach" id="achList"></div></div>
</div>

<div class="overlay hidden sheet" id="shop">
  <div class="phead"><button class="x" id="shopClose">✕</button><div class="ptitle">SHOP</div></div>
  <div class="tabs"><button id="tabTiles" class="on">TILE SKINS</button><button id="tabPU">POWER-UPS</button></div>
  <div class="scroll"><div class="grid" id="shopGrid"></div></div>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }
        else if (p.shape === 'heart') { ctx.rotate(p.rot * .2); heart(ctx, p.size); }
        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * (.4 + k * .6), 0, TAU); ctx.fill(); }
        ctx.restore(); ctx.shadowBlur = 0;
      }
      for (const t of texts) {
        const age = t.max - t.life, pop = age < .18 ? 1 + Math.sin(age / .18 * Math.PI) * .45 : 1, a = Math.min(1, t.life / t.max * 2.2);
        ctx.save(); ctx.globalAlpha = a; ctx.translate(t.x, t.y); ctx.scale(pop, pop); if (t.wobble) ctx.rotate(Math.sin(age * 20) * t.wobble);
        ctx.font = t.font + t.size + 'px "Avenir Next", "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, t.size * .16); ctx.strokeStyle = t.stroke; ctx.strokeText(t.str, 0, 0); ctx.fillStyle = t.c; ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },
    drawFlash(ctx, W, H) { if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  };
})();
/*FX-END*/

        if ([1, 2, 3, 4, 5, 10, 15, 40, 100, 150, 200].includes(n)) out.samples.push(`${n}: ${c.type} moves=${c.moves} ${c.type === 'score' ? 'target=' + c.target : c.type === 'long' ? c.K + 'x' + c.L + '+' : c.type === 'letters' ? JSON.stringify(c.need) : c.type === 'fire' ? 'fires=' + c.fires : c.type === 'gems' ? 'gems=' + c.gemsN : c.type === 'chains' ? 'chains=' + c.locks : 'hp=' + c.hp} golden=${c.golden} side="${c.side.text}" words=${list.length} e.g. ${list.slice(0, 6).map(x => x.w).join(',')}`);
      } catch (e) { out.bad.push(n + ': ' + e.message); }
    }
    out.ms = Math.round(performance.now() - t0); return out;
  }
  // play a whole level instantly with a bot (no animation) — for balancing
  function simLevel(n, mode = 'human') {
    const keep = G; newLevel(n, false); G.sim = true; let guard = 0;
    while (G.state !== 'won' && G.state !== 'fail' && guard++ < 200) {
      if (G.state === 'play') { const p = botPick(mode); if (!p) { doShuffle(true); continue; } submit(pathTiles(p)); }
      runQueue(true);
      if (G.state === 'finale') { while (G.q.length) G.q.shift()(); }
    }
    const c = G.cfg, r = { n, type: c.type, won: G.state === 'won', why: G.failWhy, score: G.score, pre: G.pre, prog: G.prog.fire, needLeft: G.need, movesLeft: G.leftAtWin, perMove: Math.round((G.pre || G.score) / Math.max(1, G.words.length)), s2: c.s2, s3: c.s3, need: c.need, moves: c.moves, stars: G.state === 'won' ? 1 + (G.score >= c.s2) + (G.score >= c.s3) : 0, words: G.words.length };
    G = keep; return r;
  }
  window.__wc = {
    G: () => G, save: () => SAVE, start, fps: () => fps, cfg: levelCfg, check: validateLevels, sim: simLevel, layout: () => JSON.parse(JSON.stringify(L)), ts: () => TS,
    state: () => G && { n: G.n, attract: G.attract, state: G.state, moves: G.moves, score: G.score, type: G.cfg.type, prog: G.prog, need: G.need, boss: G.boss && G.boss.hp, golden: G.golden, goldenFound: G.goldenFound, words: G.words.map(w => w.w), sel: G.sel.map(tileTxt).join(''), valid: G.valid, fires: fires().length, pmode: G.pmode },
    level: n => { if (!audioOn) { audio.start(); audioOn = true; } SAVE.snap = null; SAVE.level = n; SAVE.maxLevel = Math.max(SAVE.maxLevel, n); startLevel(n); },
    autopilot: (v, opt) => { AUTOP = v; AUTO = opt || null; G.bot = null; G.sel = []; },
    cell: (c, r) => cellCenter(c, r), letters: () => G.grid[0].map((_, r) => G.grid.map(col => col[r].ch).join('')).join('/'),
    findWord: (minLen = 3) => { const l = solve(G.grid, G.cols, G.rows).filter(x => x.w.length >= minLen && !x.path.some(k => G.grid[Math.floor(k / G.rows)][k % G.rows].kind === 'wild')); const p = l.sort((a, b) => b.w.length - a.w.length)[0]; return p && { w: p.w, path: p.path.map(k => cellCenter(Math.floor(k / G.rows), k % G.rows)) }; },
    coins: n => { SAVE.coins += n; coinShow = SAVE.coins; updateCoinPill(); saveNow(); }, unlockAll: () => { SAVE.owned = SKINS.map((s, i) => i); saveNow(); },
    skin: i => { SAVE.skin = i; TC.clear(); renderLogo(); saveNow(); }, moves: m => { G.moves = m; }, fireTop: () => { const t = spawnFire(0); if (t) { const up = G.grid[t.c][0]; G.grid[t.c][0] = t; G.grid[t.c][t.r] = up; reindex(G.grid); } },
    win: () => { G.prog.long = 99; G.prog.fire = 99; G.prog.gems = 99; G.prog.chains = 99; if (G.need) for (const k in G.need) G.need[k] = 0; G.score = Math.max(G.score, G.cfg.target || 0); if (G.boss) G.boss.hp = 0; G.state = 'busy'; queue(endCheck); },
    pause, resume, showMenu, openShop, openJourney, renderOnce: () => render(0), bgMs: () => BG && BG.ms
  };

  // =====================================================================
  //  BOOT
  // =====================================================================
  function loadAll() {
    const tiles = {}; SKINS.forEach((s, i) => { tiles['skin' + i] = tileSvg(s.svg); });
    for (let g = 1; g <= 4; g++) tiles['gem' + g] = gemSvg(GEMC[g]);
    tiles.fireT = fireSvg; tiles.wildT = wildTile; tiles.chain1 = chainSvg(1); tiles.chain2 = chainSvg(2);
    const icons = {}; for (const k in ICON) if (k !== 'hand') icons['i_' + k] = svgDoc(ICON[k]);
    const bosses = {}; BOSSES.forEach((b, i) => { bosses['boss' + i] = svgDoc(b.svg, '0 0 200 200'); });
    return Promise.all([loadSprites(tiles, [224, 236]), loadSprites(icons, 128), loadSprites({ i_hand: svgDoc(ICON.hand, '0 0 110 130') }, [110, 130]), loadSprites(bosses, 256), loadSprites({ flame: flameFx }, [100, 120])])
      .then(arr => { arr.forEach(o => Object.assign(SPR, o)); ready = true; TC.clear(); renderLogo(); });
  }
  resize();
  showMenu();
  loadAll();
  requestAnimationFrame(frame);
})();
