<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lights Out</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#0a0a0f;font-family:'Space Grotesk',system-ui,sans-serif;color:#e4e4e7;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:420px;margin:0 auto;padding:max(env(safe-area-inset-top),8px) 10px max(env(safe-area-inset-bottom),8px)}
.header{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding:4px 0}
.logo{font-size:16px;font-weight:700;letter-spacing:1px;color:#fbbf24}
.stat{background:#18181b;border:1px solid #27272a;border-radius:10px;padding:6px 12px;font-size:12px;font-weight:700}
.status{text-align:center;font-size:13px;font-weight:600;padding:6px 0;color:#71717a;flex-shrink:0;min-height:22px}
.status.win{color:#fbbf24;font-size:15px}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#board{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:8px;width:min(88vw,calc(100dvh - 170px));aspect-ratio:1}
.cell{border-radius:12px;cursor:pointer;transition:background .15s,box-shadow .15s;border:none}
.cell.on{background:linear-gradient(145deg,#fbbf24,#f59e0b);box-shadow:0 0 16px rgba(251,191,36,.5)}
.cell.off{background:#1c1c22;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.cell:active{transform:scale(.94)}
.controls{display:flex;gap:8px;justify-content:center;padding:8px 0 4px;flex-shrink:0}
button{font-family:inherit;background:#18181b;border:1px solid #27272a;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;color:#e4e4e7;min-height:42px;cursor:pointer}
button:active{transform:scale(.96)}
#btnMusic.active{background:#422006;border-color:#fbbf24;color:#fbbf24}
.hint{text-align:center;font-size:11px;color:#52525b;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="stat">Moves <span id="moves">0</span></div>
    <div class="logo">LIGHTS OUT</div>
    <div class="stat" id="left">25 on</div>
  </div>
  <div class="status" id="status">Turn all lights off</div>
  <div class="board-wrap"><div id="board"></div></div>
  <div class="controls">
    <button id="btnMusic" onclick="toggleMusic()">♪ Music</button>
    <button onclick="newGame()">New</button>
  </div>
  <div class="hint">Tap a light — it and neighbors flip</div>
</div>
<script>
const N=5;
let grid,moves;
const boardEl=document.getElementById('board');

let audioCtx=null,musicNodes=[],musicOn=false,musicTimer=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function stopMusic(){musicNodes.forEach(n=>{try{n.stop()}catch(e){}try{n.disconnect()}catch(e){}});musicNodes=[];if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function startMusic(){
  const ctx=ensureAudio();stopMusic();
  const m=ctx.createGain();m.gain.value=0.055;m.connect(ctx.destination);
  function tone(f,t,d){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.04,t+.4);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(m);o.start(t);o.stop(t+d+.05);musicNodes.push(o)}
  function L(){const t=ctx.currentTime+.05;tone(277.18,t,2.5);tone(349.23,t+.6,2);tone(415.3,t+1.3,2);tone(554.37,t+2.2,1.5)}
  L();musicTimer=setInterval(L,4000);
}
function toggleMusic(){musicOn=!musicOn;document.getElementById('btnMusic').classList.toggle('active',musicOn);if(musicOn)startMusic();else stopMusic()}

function newGame(){
  grid=Array.from({length:N},()=>Array(N).fill(0));
  // random solvable-ish by random presses
  for(let i=0;i<12;i++){
    const r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);
    flip(r,c,true);
  }
  moves=0;document.getElementById('moves').textContent=0;
  document.getElementById('status').textContent='Turn all lights off';
  document.getElementById('status').className='status';
  render();
}
function flip(r,c,silent){
  const dirs=[[0,0],[-1,0],[1,0],[0,-1],[0,1]];
  for(const[dr,dc]of dirs){
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<N&&nc>=0&&nc<N)grid[nr][nc]^=1;
  }
  if(!silent){moves++;document.getElementById('moves').textContent=moves}
}
function countOn(){return grid.flat().filter(x=>x).length}
function render(){
  boardEl.innerHTML='';
  const on=countOn();
  document.getElementById('left').textContent=on+' on';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const cell=document.createElement('button');
    cell.className='cell '+(grid[r][c]?'on':'off');
    cell.onclick=()=>{
      flip(r,c);render();
      if(countOn()===0){document.getElementById('status').textContent='Solved! ✨';document.getElementById('status').className='status win'}
    };
    boardEl.appendChild(cell);
  }
}
newGame();
</script>
</body>
</html>
