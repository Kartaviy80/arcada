<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#24305e">
<title>Sky Tower</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #24305e;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; color: #1e2648;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
  .top .coins { font-size: 32px; font-weight: 900; color: #fff; -webkit-text-stroke: 1.5px #1e2a5a; text-shadow: 0 3px 0 #1e2a5a, 0 6px 16px rgba(0,0,30,.35); }
  .top .ps { font-size: 13px; font-weight: 800; color: #1e2a5a; background: rgba(255,255,255,.88); display: inline-block; padding: 2px 12px; border-radius: 12px; margin-top: 2px; }
  .top .boost { font-size: 13px; font-weight: 900; color: #fff; background: linear-gradient(#ff7ab0, #d83a8a); display: inline-block; padding: 2px 10px; border-radius: 12px; margin-left: 6px; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; height: 45%; background: linear-gradient(#f6f8ff, #e2e8f8); border-top: 5px solid #e8b04a; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 24px rgba(10,20,60,.35); display: flex; flex-direction: column; z-index: 3; }
  @media (min-aspect-ratio: 1/1) { .panel { left: auto; top: 0; width: min(420px, 40%); height: 100%; border-radius: 22px 0 0 22px; border-top: 0; border-left: 5px solid #e8b04a; } }
  .tabs { display: flex; gap: 6px; padding: 10px 10px 6px; }
  .tabs button { flex: 1; border: 0; border-radius: 12px; padding: 9px 4px; font: inherit; font-size: 14px; font-weight: 900; color: #3a4a7a; background: #dfe4f4; cursor: pointer; }
  .tabs button.on { background: linear-gradient(#6a8aff, #3a4ad8); color: #fff; box-shadow: 0 3px 0 #1a2a8a; }
  .tabs .mode { flex: 0 0 64px; background: #1e2a5a; color: #ffd24a; }
  .list { flex: 1; overflow-y: auto; padding: 4px 10px 80px; -webkit-overflow-scrolling: touch; }
  .card { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid #d4dcf0; border-radius: 16px; padding: 8px; margin-bottom: 8px; box-shadow: 0 3px 0 #c4cce4; }
  .card.build { background: linear-gradient(#fffaf0, #ffecb8); border-color: #e8b04a; box-shadow: 0 3px 0 #c8902a; }
  .card canvas { width: 58px; height: 58px; flex: 0 0 58px; border-radius: 12px; background: #e8eefa; }
  .card .info { flex: 1; min-width: 0; }
  .card .nm { font-weight: 900; font-size: 15px; } .card .nm small { font-weight: 800; color: #5a6aa8; font-size: 12px; }
  .card .ds { font-size: 12px; color: #5a6488; line-height: 1.3; }
  .card .bar { height: 5px; background: #e4e8f4; border-radius: 3px; margin-top: 4px; overflow: hidden; } .card .bar i { display: block; height: 100%; background: linear-gradient(90deg, #6a8aff, #3ad8b0); }
  .card button { flex: 0 0 auto; min-width: 86px; border: 0; border-radius: 12px; padding: 8px 6px; font: inherit; font-weight: 900; font-size: 13px; color: #fff; background: linear-gradient(#3ad8a0, #1a9a7a); box-shadow: 0 3px 0 #0a6a54; cursor: pointer; line-height: 1.15; }
  .card.build button { background: linear-gradient(#ffd24a, #e8901a); box-shadow: 0 3px 0 #a85a04; color: #4a2a04; }
  .card button:disabled, .card.build button:disabled { background: #cfd6e6; box-shadow: 0 3px 0 #aab4cc; color: #fff; }
  .card button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0a6a54; }
  .card.locked { opacity: .55; filter: grayscale(.8); }
  .prest { text-align: center; padding: 10px 8px; }
  .prest h3 { font-size: 22px; color: #3a4ad8; } .prest p { font-size: 14px; line-height: 1.5; margin: 8px 0; color: #3a4468; }
  .prest .big { font-size: 40px; font-weight: 900; color: #2aa87a; -webkit-text-stroke: 1px #0a4a34; }
  .prest button { border: 0; border-radius: 16px; padding: 12px 26px; font: inherit; font-size: 16px; font-weight: 900; color: #4a2a04; background: linear-gradient(#ffd24a, #e8901a); box-shadow: 0 4px 0 #a85a04; cursor: pointer; }
  .prest button:disabled { background: #cfd6e6; box-shadow: 0 4px 0 #aab4cc; color: #fff; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: radial-gradient(ellipse at 50% 30%, rgba(120,175,255,.97), rgba(26,34,96,.98)); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 240px; height: 240px; }
  h1 { font-size: clamp(44px, 13.5vw, 72px); font-weight: 900; line-height: .95; color: #ffd24a; -webkit-text-stroke: 3px #1e2a5a; text-shadow: 0 5px 0 #1e2a5a, 0 0 30px rgba(255,210,80,.5); }
  .overlay p { max-width: 320px; font-size: 15px; line-height: 1.55; color: #eef2ff; }
  .overlay .stat { color: #dfe6ff; } .overlay .stat b { color: #ffd24a; }
  .btn { border: 4px solid #fff; background: linear-gradient(#ffd24a, #e8901a); color: #3a2004; font: inherit; font-size: 21px; font-weight: 900; letter-spacing: 3px; padding: 14px 46px; border-radius: 40px; cursor: pointer; box-shadow: 0 6px 0 #8a4a04, 0 12px 24px rgba(0,0,0,.3); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><div class="coins" id="coins">0</div><div><span class="ps" id="ps">0 / sec</span><span class="boost" id="boost" style="display:none">x7 RUSH HOUR</span></div></div>
<div class="panel" id="panel">
  <div class="tabs"><button class="on" data-t="floors">Floors</button><button data-t="upg">Upgrades</button><button data-t="inv">💼 Invest</button><button class="mode" id="mode">x1</button></div>
  <div class="list" id="list"></div>
</div>
<div class="overlay" id="menu">
  <canvas id="logo" width="480" height="480"></canvas>
  <h1>SKY<br>TOWER</h1>
  <p><b>Build it to the stars.</b> Stack café, arcade, sushi bar and cinema floors one on top of another. Every floor earns coins, every upgrade earns more — and there is always room for one more storey.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">BUILD</button>
</div>
<div class="overlay hidden" id="away">
  <canvas id="awayArt" width="480" height="480"></canvas>
  <h1>WELCOME<br>BACK!</h1>
  <p id="awayTxt"></p>
  <button class="btn" id="awayBtn">COLLECT</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }

// ---------- idle core: big-number formatting, geometric prices, saves and offline earnings ----------
const Idle = (() => {
  const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td', 'Qad', 'Qid', 'Sxd', 'Spd', 'Ocd', 'Nod', 'Vg'];
  // past the named suffixes: aa, ab, ac … zz
  const letters = i => String.fromCharCode(97 + Math.floor(i / 26) % 26) + String.fromCharCode(97 + i % 26);
  function fmt(n, dec = 2) {
    if (!isFinite(n)) return '∞';
    if (n < 0) return '-' + fmt(-n, dec);
    if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n).toString();
    const e = Math.floor(Math.log10(n) / 3), v = n / Math.pow(10, e * 3);
    const s = e < SUF.length ? SUF[e] : letters(e - SUF.length);
    return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(dec)) + s;
  }
  function fmtTime(s) { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return h ? h + 'h ' + m + 'm' : m ? m + 'm ' + x + 's' : x + 's'; }
  // price of buying n more when `owned` are owned: base * g^owned * (g^n - 1) / (g - 1)
  const cost = (base, g, owned, n = 1) => base * Math.pow(g, owned) * (Math.pow(g, n) - 1) / (g - 1);
  // how many can be afforded with `money`
  function maxAfford(base, g, owned, money) { const c0 = base * Math.pow(g, owned); if (money < c0) return 0; return Math.max(1, Math.floor(Math.log(money * (g - 1) / c0 + 1) / Math.log(g))); }
  // milestone multiplier: x2 at 10, 25, 50, 100, then every 100
  function milestone(owned) { let m = 1; for (const k of [10, 25, 50]) if (owned >= k) m *= 2; if (owned >= 100) m *= Math.pow(2, Math.floor(owned / 100)); return m; }
  function nextMilestone(owned) { for (const k of [10, 25, 50, 100]) if (owned < k) return k; return (Math.floor(owned / 100) + 1) * 100; }
  function load(key, defaults) { let s = null; try { s = JSON.parse(localStorage.getItem(key)); } catch (e) {} return Object.assign(JSON.parse(JSON.stringify(defaults)), s || {}); }
  function save(key, state) { state.seen = Date.now(); try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }
  // seconds since the last save, capped (default 8 hours)
  function away(state, cap = 8 * 3600) { if (!state.seen) return 0; return Math.min(cap, Math.max(0, (Date.now() - state.seen) / 1000)); }
  return { fmt, fmtTime, cost, maxAfford, milestone, nextMilestone, load, save, away };
})();

    if (heli && Math.hypot(x - heli.x, y - heli.y) < 55) return catchHeli();
    if (hint && Math.abs(x - hint.x) < hint.w / 2 + 6 && Math.abs(y - hint.y) < hint.h / 2 + 6) return build();
    const k = Math.floor((baseY + scroll - y) / FH);
    if (x > X0 && x < X0 + TW && k >= 0 && k < S.floors.length) tap(x, y, k);
  });
  addEventListener('pointermove', e => { if (!drag) return; const dy = e.clientY - drag.y; if (Math.abs(dy) > 6) { scroll = clampScroll(drag.s + dy); manualT = 5; } });
  addEventListener('pointerup', () => drag = null); addEventListener('pointercancel', () => drag = null);
  canvas.addEventListener('wheel', e => { e.preventDefault(); scroll = clampScroll(scroll - e.deltaY * .6); manualT = 5; }, { passive: false });
  function catchHeli() {
    const g = heli; heli = null; const tx = Math.max(130, Math.min(sceneR.w - 130, g.x));
    if (Math.random() < .55) { rush = 20; FX.text(tx, g.y, 'RUSH HOUR x7!', { color: '#ff9ad8', size: 32, stroke: '#5a0a3a', life: 1.4 }); }
    else { const v = Math.max(60, cps() * 600 + tapValue() * 50); earn(v); FX.text(tx, g.y, 'VIP TIP +' + fmt(v), { color: '#ffe24a', size: 30, stroke: '#5a3a04', life: 1.4 }); }
    FX.burst(g.x, g.y, { n: 44, colors: ['#ffe24a', '#fff6b0', '#ff9ad8'], shape: 'star', speed: 420, size: 9, gravity: 220, glow: 1 }); FX.flash('#fff0c0', .3);
    [784, 988, 1175, 1568].forEach((f, k) => setTimeout(() => audio.sfx(f, .2, 'square', .05), k * 70));
  }
  function priceN(base, g, own, money) { if (mode === 'max') { const n = Math.max(1, maxAfford(base, g, own, money)); return [n, cost(base, g, own, n)]; } return [mode, cost(base, g, own, mode)]; }
  function upFloor(k) {
    const L = S.floors[k], [n, c] = priceN(upBase(k), 1.12, L - 1, S.coins); if (S.coins < c) return;
    S.coins -= c; S.floors[k] = L + n; flashes[k] = 1;
    if (milestone(L + n) > milestone(L)) { FX.text(sceneR.w / 2, sceneR.h * .3, NAMES[roomOf(k)] + ' x2!', { color: '#7affc8', size: 28, stroke: '#0a3a2a', life: 1.4 }); audio.sfx(1046, .3, 'square', .05); }
    audio.sfx(660, .08, 'square', .05, 990); store(); renderList(false);
  }
  function buyUpg(u) { const c = cost(u.base, u.g, lvl(u.id), 1); if (S.coins < c || (u.max && lvl(u.id) >= u.max)) return; S.coins -= c; S.upg[u.id] = lvl(u.id) + 1; audio.sfx(880, .12, 'square', .05, 1320); store(); renderList(true); }
  function prestige() {
    const n = invAvail(); if (n <= 0) return;
    S.inv += n; S.prestiges++; S.coins = 0; S.floors = [1]; S.upg = { night: lvl('night') }; scroll = 0; elev.f = elev.target = 0; FX.flash('#ffffff', .8);
    FX.burst(sceneR.w / 2, sceneR.h / 2, { n: 80, colors: ['#ffe24a', '#ffffff', '#7affc8'], shape: 'star', speed: 600, size: 12, gravity: 100, life: 1.6, glow: 1 });
    [523, 659, 784, 1046, 1318].forEach((f, k) => setTimeout(() => audio.sfx(f, .3, 'square', .05), k * 110)); store(); renderList(true);
  }
  const store = () => Idle.save(KEY, S);

  // ---------- panel ----------
  let tab = 'floors', rows = [];
  document.querySelectorAll('.tabs [data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('.tabs [data-t]').forEach(x => x.classList.toggle('on', x === b)); renderList(true); audio.sfx(700, .04, 'triangle', .03); });
  $('mode').onclick = () => { mode = mode === 1 ? 10 : mode === 10 ? 'max' : 1; $('mode').textContent = mode === 'max' ? 'MAX' : 'x' + mode; renderList(false); };
  function iconCanvas(id) {
    const c = document.createElement('canvas'); c.width = 116; c.height = 116; if (!SPR) return c; const g = c.getContext('2d');
    if (id.startsWith('room_')) { const cx = ICON_X[id.slice(5)]; g.drawImage(SPR[id], (cx - 40) * 2, 0, 160, 160, 0, 0, 116, 116); } else g.drawImage(SPR[id], 6, 6, 104, 104);
    return c;
  }
  function renderList(full) {
    const L = $('list');
    if (full || (tab === 'floors' && rows.length && rows[0].n !== S.floors.length)) {
      L.innerHTML = ''; rows = [];
      if (tab === 'floors') {
        const n = S.floors.length, el = document.createElement('div'); el.className = 'card build';
        el.innerHTML = '<div class="info"><div class="nm"></div><div class="ds"></div></div><button></button>'; el.prepend(iconCanvas('room_' + roomOf(n))); el.querySelector('button').onclick = build; L.appendChild(el); rows.push({ el, kind: 'build', n });
        for (let k = n - 1; k >= 0; k--) {
          const e = document.createElement('div'); e.className = 'card';
          e.innerHTML = '<div class="info"><div class="nm"></div><div class="ds"></div><div class="bar"><i></i></div></div><button></button>'; e.prepend(iconCanvas('room_' + roomOf(k)));
          e.querySelector('button').onclick = () => upFloor(k); L.appendChild(e); rows.push({ el: e, kind: 'floor', k });
        }
      } else if (tab === 'upg') {
        for (const u of UPG) { const el = document.createElement('div'); el.className = 'card'; el.innerHTML = '<div class="info"><div class="nm"></div><div class="ds"></div></div><button></button>'; el.prepend(iconCanvas(u.id === 'heli' ? 'pad' : u.id)); el.querySelector('button').onclick = () => buyUpg(u); L.appendChild(el); rows.push({ el, u, kind: 'upg' }); }
      } else {
        const el = document.createElement('div'); el.className = 'prest';
        el.innerHTML = '<h3>💼 Investors 💼</h3><div class="big" id="pInv"></div><p id="pTxt"></p><button id="pBtn">SELL TOWER & BUILD AGAIN</button><p style="font-size:12px;opacity:.75">Each investor makes every floor 10% richer — forever. You keep your investors and your Night Manager.</p>';
        L.appendChild(el); $('pBtn').onclick = prestige; rows.push({ el, kind: 'inv' });
      }
    }
    for (const r of rows) {
      const btn = r.el.querySelector('button');
      if (r.kind === 'build') {
        const n = S.floors.length, c = buildCost(n), type = roomOf(n);
        r.el.querySelector('.nm').innerHTML = 'Build ' + NAMES[type] + ' <small>Floor ' + n + '</small>'; r.el.querySelector('.ds').textContent = 'Earns ' + fmt(baseRate(n) * mult()) + '/s at Lv 1';
        btn.innerHTML = 'BUILD<br>🪙 ' + fmt(c); btn.disabled = S.coins < c;
      } else if (r.kind === 'floor') {
        const k = r.k, L = S.floors[k], [n, c] = priceN(upBase(k), 1.12, L - 1, S.coins), nm2 = nextMilestone(L), prev = L >= 100 ? Math.floor(L / 100) * 100 : ([0, 10, 25, 50].filter(q => q <= L).pop() || 0);
        r.el.querySelector('.nm').innerHTML = NAMES[roomOf(k)] + ' <small>' + (k ? k + 'F' : 'G') + ' · Lv ' + L + '</small>'; r.el.querySelector('.ds').textContent = fmt(floorRate(k)) + '/s · x2 at Lv ' + nm2;
        r.el.querySelector('.bar i').style.width = Math.min(100, (L - prev) / (nm2 - prev) * 100) + '%';
        btn.innerHTML = 'UP' + (mode === 1 ? '' : ' +' + n) + '<br>🪙 ' + fmt(c); btn.disabled = S.coins < c;
      } else if (r.kind === 'upg') {
        const u = r.u, l = lvl(u.id), c = cost(u.base, u.g, l, 1), maxed = u.max && l >= u.max; r.el.querySelector('.nm').innerHTML = u.name + ' <small>Lv ' + l + '</small>'; r.el.querySelector('.ds').textContent = u.desc(l);
        btn.innerHTML = maxed ? 'MAX' : 'UPGRADE<br>🪙 ' + fmt(c); btn.disabled = maxed || S.coins < c;
      } else { const n = invAvail(); $('pInv').textContent = '💼 ' + S.inv + (n > 0 ? '  (+' + n + ')' : ''); $('pTxt').innerHTML = 'Lifetime earnings: <b>' + fmt(S.life) + '</b><br>' + (n > 0 ? 'Sell now to win <b>' + n + '</b> new investor' + (n > 1 ? 's' : '') + ' (+' + n * 10 + '% forever).' : 'Next investor at ' + fmt(Math.pow(S.inv + 1, 2) * 1e6) + ' lifetime.'); btn.disabled = n <= 0; }
    }
  }
  window.__st = { state: () => S, cps, tapValue, build, upFloor, buyUpg: i => buyUpg(UPG[i]), give: v => earn(v), heli: () => heli, spawnHeli: () => { heliT = 0; }, catchHeli, prestige, setScroll: v => { scroll = clampScroll(v); manualT = 30; }, maxScroll };

  // ---------- start, offline earnings ----------
  function begin() { if (!SPR) return; S.started = true; $('menu').classList.add('hidden'); audio.start(); resize(); scroll = maxScroll(); renderList(true); store(); }
  $('startBtn').onclick = () => {
    const away = Idle.away(S), rate = Math.min(1, .5 + lvl('night') * .1), earned = S.seen && S.started ? cps() * away * rate : 0;
    if (earned > 1 && away > 30) { earn(earned); $('awayTxt').innerHTML = 'You were away for <b>' + Idle.fmtTime(away) + '</b>.<br>Your ' + S.floors.length + ' floors earned <b>🪙 ' + fmt(earned) + '</b> while you were gone!'; $('menu').classList.add('hidden'); $('away').classList.remove('hidden'); audio.start(); }
    else begin();
  };
  $('awayBtn').onclick = () => { $('away').classList.add('hidden'); begin(); FX.burst(sceneR.w / 2, sceneR.h / 2, { n: 50, colors: ['#ffe24a', '#fff6b0'], shape: 'star', speed: 500, size: 10, gravity: 300, life: 1.4 }); audio.sfx(988, .3, 'square', .05); };
  $('bestMenu').innerHTML = S.life > 0 ? 'Tower <b>' + S.floors.length + ' floors</b> · earned <b>' + fmt(S.life) + '</b>' + (S.inv ? ' · 💼 ' + S.inv : '') : '';
  addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !S.started) { e.preventDefault(); $('startBtn').click(); } });
  addEventListener('visibilitychange', () => { if (document.hidden) store(); });

  // ---------- loop ----------
  let saveT = 0, uiT = 0;
  function update(dt) {
    t += dt; FX.update(dt);
    for (const k in flashes) flashes[k] = Math.max(0, flashes[k] - dt * 3);
    for (const c of cars) { if (c.wait > 0) { c.wait -= dt; continue; } c.x += c.v * dt; if (c.x > sceneR.w + 80 || c.x < -80) { c.wait = 2 + Math.random() * 6; c.x = c.v > 0 ? -60 : sceneR.w + 60; } }
    if (!S.started) return;
    rush = Math.max(0, rush - dt);
    earn(cps() * dt);
    if (drop > 0) { drop = Math.max(0, drop - dt * 2.2); if (drop === 0) landed(); }
    if (manualT > 0) manualT -= dt; else scroll += (maxScroll() - scroll) * Math.min(1, dt * 3);
    scroll = clampScroll(scroll);
    // the elevator wanders between floors
    if (elev.wait > 0) elev.wait -= dt; else { const d = elev.target - elev.f, st = Math.sign(d) * Math.min(Math.abs(d), dt * 2.5); elev.f += st; if (Math.abs(d) < .001) { elev.wait = 1 + Math.random() * 1.5; elev.target = Math.floor(Math.random() * S.floors.length); audio.sfx(1318, .05, 'sine', .02); } }
    elev.target = Math.min(elev.target, S.floors.length - 1);
    heliT -= dt; if (heliT <= 0 && !heli) { const dir = Math.random() < .5 ? 1 : -1; heli = { x: dir > 0 ? -70 : sceneR.w + 70, y: 120 + Math.random() * sceneR.h * .3, vx: dir * (70 + Math.random() * 40), ph: 0 }; heliT = (40 + Math.random() * 40) * Math.pow(.85, lvl('heli')); audio.sfx(196, .4, 'sawtooth', .03, 220); }
    if (heli) { heli.x += heli.vx * dt; heli.ph += dt; if (heli.x < -120 || heli.x > sceneR.w + 120) heli = null; }
    // a floor now and then shows what it just earned
    tickT += dt; if (tickT > 1.3) { tickT = 0; const n = S.floors.length, k = Math.floor(Math.random() * n), y = baseY + scroll - (k + 1) * FH; if (y > 60 && y < sceneR.h - FH * .5) FX.text(X0 + 8 + (TW - SW - 16) * (.3 + Math.random() * .4), y + FH * .35, '+' + fmt(floorRate(k) * 1.3), { color: '#fff36a', size: 14, stroke: '#3a2a04', rise: 30, life: .9 }); }
    saveT += dt; if (saveT > 5) { saveT = 0; store(); }
    uiT += dt; if (uiT > .2) { uiT = 0; $('coins').textContent = '🪙 ' + fmt(S.coins); $('ps').textContent = fmt(cps()) + ' / sec'; $('boost').style.display = rush > 0 ? 'inline-block' : 'none'; if (rush > 0) $('boost').textContent = 'x7 RUSH HOUR ' + Math.ceil(rush) + 's'; renderList(false); }
  }
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawSky();
    if (!SPR) return;
    const [ox, oy] = FX.offset(); ctx.translate(ox, oy);
    drawSkyline(); drawClouds(); drawGround(); drawTower(); drawHeli();
    FX.draw(ctx);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); FX.drawFlash(ctx, W, H);
  }
  function drawLogo(cv) {
    const g = cv.getContext('2d'); g.clearRect(0, 0, 480, 480);
    const glow = g.createRadialGradient(240, 230, 20, 240, 230, 240); glow.addColorStop(0, 'rgba(255,255,255,.75)'); glow.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = glow; g.fillRect(0, 0, 480, 480);
    g.drawImage(SPR.cloud1, 0, 150, 170, 76); g.drawImage(SPR.cloud2, 320, 250, 160, 72);
    const w = 240, fh = Math.round(w * .27), x = 120, rooms = ['lobby', 'cafe', 'arcade', 'sushi'];
    let y = 450;
    rooms.forEach((r, i) => {
      y -= fh; const [f1, f2] = FACADES[i % 3], fg = g.createLinearGradient(x, 0, x + w, 0); fg.addColorStop(0, f1); fg.addColorStop(1, f2); g.fillStyle = fg; g.fillRect(x, y, w, fh);
      g.drawImage(SPR['room_' + r], x + 6, y, w - 34, fh - 5); g.fillStyle = '#1c2030'; g.fillRect(x + w - 26, y, 24, fh);
      g.drawImage(SPR['p' + (i * 3 % 8)], x + 40 + i * 37, y + fh * .5, fh * .23, fh * .46);
      const sl = g.createLinearGradient(0, y + fh - 5, 0, y + fh); sl.addColorStop(0, '#eef0f6'); sl.addColorStop(1, '#8a92a4'); g.fillStyle = sl; g.fillRect(x - 3, y + fh - 5, w + 6, 5);
    });
    g.drawImage(SPR.roof, x - 5, y - (w + 10) * .3, w + 10, (w + 10) * .3);
    g.drawImage(SPR.heli, 300, 40, 150, 75);
  }

  resize();
  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
