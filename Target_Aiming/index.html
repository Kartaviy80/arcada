<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#160a05">
<title>Knife Rush</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #160a05; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  button { font-family: inherit; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .disp { font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif; font-weight: 400; letter-spacing: 2px; }
  /* coin + apple glyphs drawn in CSS so no emoji fonts are needed */
  .cn, .ap { display: inline-block; width: .95em; height: .95em; border-radius: 50%; vertical-align: -.12em; position: relative; }
  .cn { background: radial-gradient(circle at 35% 30%, #fff8c8, #ffd040 45%, #b87a10); box-shadow: inset 0 0 0 .09em #8a5608; }
  .ap { background: radial-gradient(circle at 35% 32%, #ff9a8a, #e8202a 50%, #7a0a10); border-radius: 46% 46% 50% 50%; }
  .ap::after { content: ''; position: absolute; width: .42em; height: .22em; top: -.16em; left: .45em; background: #4ac04a; border-radius: 0 70% 0 70%; }
  #menu { justify-content: space-between; padding: calc(14px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
    background: radial-gradient(ellipse 85% 46% at 50% 44%, rgba(12,5,2,0) 0%, rgba(12,5,2,.18) 60%, rgba(8,3,1,.82) 100%), linear-gradient(180deg, rgba(8,3,1,.55), rgba(8,3,1,0) 26%, rgba(8,3,1,0) 52%, rgba(8,3,1,.8)); }
  .mtop, .mbot { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .mgap { flex: 1; min-height: 10px; }
  .title { font-size: clamp(50px, 15vw, 100px); line-height: .86; transform: skewX(-7deg) rotate(-3deg);
    background: linear-gradient(180deg, #ffffff 0%, #e4ecf4 36%, #8496aa 50%, #f4f8fc 58%, #aab8c8 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #2a1408) drop-shadow(0 6px 0 #120804) drop-shadow(0 0 26px rgba(255,140,50,.45)); }
  .title span { display: block; font-size: 1.16em; letter-spacing: 6px; background: linear-gradient(180deg, #fff8d0 0%, #ffd34a 32%, #ff8a1a 62%, #b8280a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { font-size: 12px; font-weight: 800; letter-spacing: 7px; color: #ffe2b8; text-shadow: 0 0 10px rgba(255,120,40,.8), 0 2px 3px #000; }
  .stat { font-size: 13px; color: #f4e6d0; text-shadow: 0 1px 3px #000; letter-spacing: 1px; } .stat b { color: #ffd34a; }
  .wallet { display: flex; gap: 14px; font-size: 16px; font-weight: 900; color: #fff4dc; text-shadow: 0 1px 3px #000; padding: 4px 14px; border-radius: 20px; background: rgba(20,8,3,.6); border: 1px solid rgba(255,210,120,.25); }
  .row { display: flex; align-items: center; gap: 10px; }
  .arrow { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,210,122,.65); background: rgba(40,18,8,.75); color: #ffe0a0; font-size: 18px; font-weight: 900; cursor: pointer; flex: none; }
  .arrow:active { transform: scale(.92); }
  .kcard { position: relative; width: 236px; padding: 6px 10px 9px; border-radius: 16px; background: linear-gradient(180deg, rgba(64,36,20,.94), rgba(24,12,6,.96));
    border: 2px solid var(--rc, rgba(255,210,122,.55)); box-shadow: 0 10px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.14), 0 0 22px var(--rg, rgba(0,0,0,0)); }
  .kcard canvas { width: 216px; height: 86px; display: block; margin: 0 auto; }
  .kname { font-size: 19px; line-height: 1.05; color: #fff4dc; text-shadow: 0 2px 0 #000; }
  .krar { font-size: 10px; font-weight: 900; letter-spacing: 4px; color: var(--rc, #ccc); margin-top: 2px; }
  .kstats { display: flex; justify-content: center; gap: 12px; margin-top: 5px; font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #e8d8c0; }
  .kstats i { display: inline-block; width: 44px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.5); margin-left: 4px; vertical-align: middle; position: relative; overflow: hidden; }
  .kstats i u { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ffd34a, #ff7a1a); }
  .sbtn { border: 2px solid #ffd34a; background: rgba(50,24,8,.85); color: #ffe6a8; font-weight: 900; font-size: 14px; padding: 7px 20px; border-radius: 20px; cursor: pointer; letter-spacing: 1px; min-width: 150px; }
  .sbtn.own { border-color: rgba(140,230,140,.7); color: #b8f8b0; background: rgba(20,40,16,.75); }
  .sbtn.poor { opacity: .55; }
  .btn { white-space: nowrap; border: 3px solid #fff0b0; padding: 11px 58px; border-radius: 40px; font-size: 30px; letter-spacing: 6px; color: #3a1404; cursor: pointer;
    background: linear-gradient(180deg, #fff2a8, #ffc23a 45%, #ff7a1a 80%, #d8480a); box-shadow: 0 6px 0 #6a2404, 0 0 28px rgba(255,150,40,.55); text-shadow: 0 1px 0 #fff4c8; animation: pulse 1.6s ease-in-out infinite; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #6a2404; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #6a2404, 0 0 48px rgba(255,170,60,.9); } }
  .link { background: none; border: none; color: #ffd8a0; font-size: 12px; font-weight: 800; letter-spacing: 3px; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; padding: 4px 10px; text-shadow: 0 1px 3px #000; }
  .hint { font-size: 12px; letter-spacing: 1px; color: #e8d4b8; max-width: 480px; text-shadow: 0 1px 3px #000; }
  #shop { background: radial-gradient(ellipse at 50% 40%, rgba(40,18,8,.9), rgba(10,4,2,.97)); justify-content: flex-start; padding-top: calc(18px + env(safe-area-inset-top)); }
  #shop h3 { font-size: clamp(24px, 8vw, 36px); white-space: nowrap; color: #ffd34a; text-shadow: 0 3px 0 #4a1a04, 0 0 20px rgba(255,160,40,.5); }
  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 9px; width: min(100%, 760px); overflow-y: auto; padding: 4px 4px 14px; flex: 1; align-content: start; touch-action: pan-y; }
  .scard { position: relative; border-radius: 12px; padding: 4px 4px 6px; background: linear-gradient(180deg, #3a2012, #1a0c06); border: 2px solid var(--rc); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,.5); }
  .scard canvas { width: auto; height: 76px; display: block; margin: 0 auto; }
  .scard .nm { font-size: 9px; font-weight: 900; letter-spacing: .5px; color: #f4e4cc; line-height: 1.15; min-height: 21px; }
  .scard .pr { font-size: 11px; font-weight: 900; color: #ffd34a; margin-top: 2px; }
  .scard.lock canvas { filter: brightness(.62) saturate(.55); } .scard.lock::before { content: ''; position: absolute; top: 6px; right: 6px; width: 9px; height: 7px; border-radius: 2px; background: #ffd34a; box-shadow: 0 -5px 0 -1px transparent; } .scard.lock::after { content: ''; position: absolute; top: 1px; right: 7.5px; width: 6px; height: 6px; border: 1.6px solid #ffd34a; border-bottom: none; border-radius: 4px 4px 0 0; }
  .scard.eq { box-shadow: 0 0 0 2px #fff4c0, 0 0 18px rgba(255,210,80,.7); }
  .scard.eq::after { content: 'EQUIPPED'; position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 8px; font-weight: 900; letter-spacing: 1px; background: #ffd34a; color: #3a1404; padding: 1px 5px; border-radius: 6px; }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(70,24,8,.8), rgba(12,4,2,.96)); }
  #over h2 { font-size: clamp(50px, 14vw, 92px); line-height: .95; color: #ffd34a; text-shadow: 0 4px 0 #5a1404, 0 0 36px rgba(255,120,30,.6); transform: rotate(-3deg) skewX(-6deg); }
  .ostage { font-size: 13px; font-weight: 900; letter-spacing: 5px; color: #f8dcc0; }
  #againBtn { padding: 11px 40px; } #overScore { font-size: 58px; color: #fff4dc; text-shadow: 0 0 22px rgba(255,190,80,.6), 0 3px 0 #3a1004; }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #3a1004; background: linear-gradient(90deg, #ffe84a, #ffaa2a); padding: 5px 16px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 0 22px rgba(255,220,80,.85); animation: nb 1s ease-in-out infinite alternate; }
  @keyframes nb { to { transform: rotate(-3deg) scale(1.08); } }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 24px; font-size: 14px; color: #ead8c0; text-align: left; } .grid b { color: #fff; float: right; margin-left: 12px; }
  .orew { font-size: 16px; font-weight: 900; color: #fff4dc; letter-spacing: 1px; }
  #pause { background: rgba(14,6,2,.74); font-size: 40px; color: #ffd34a; }
  #pauseBtn { position: fixed; z-index: 9; top: calc(10px + env(safe-area-inset-top)); left: 10px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,220,160,.5); background: rgba(30,12,4,.55); color: #ffe6b8; font-size: 15px; font-weight: 900; cursor: pointer; letter-spacing: -1px; }
  #pauseBtn.hidden { display: none; }
  @media (min-aspect-ratio: 5/4) {
    #menu { flex-direction: row; align-items: center; justify-content: space-between; padding-left: calc(28px + env(safe-area-inset-left)); padding-right: calc(28px + env(safe-area-inset-right)); }
    #menu .mgap { display: none; } .mtop, .mbot { width: min(36vw, 400px); }
  }
  @media (max-height: 700px) and (min-height: 521px) { .title { font-size: 54px; } .kcard canvas { height: 70px; } .overlay { gap: 8px; } .mtop, .mbot { gap: 6px; } }
  @media (max-height: 520px) {
    .overlay { gap: 5px; padding: 8px 16px; } .title { font-size: 44px; } .tag { font-size: 9px; letter-spacing: 4px; } .mtop, .mbot { gap: 5px; }
    .kcard { width: 200px; padding: 4px 8px 6px; } .kcard canvas { width: 180px; height: 52px; } .kname { font-size: 15px; } .kstats { margin-top: 2px; }
    .arrow { width: 34px; height: 34px; font-size: 14px; } .btn { padding: 7px 40px; font-size: 22px; } .sbtn { padding: 4px 14px; font-size: 12px; } .hint { display: none; } .wallet { font-size: 13px; padding: 2px 10px; }
    #over h2 { font-size: 38px; } #overScore { font-size: 34px; } .grid { font-size: 12px; gap: 2px 18px; } #newBest { font-size: 12px; padding: 3px 12px; }
    #shop h3 { font-size: 24px; } .scard canvas { height: 54px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button id="pauseBtn" class="hidden" aria-label="Pause">II</button>
<div class="overlay" id="menu">
  <div class="mtop">
    <div class="title disp">KNIFE<span>RUSH</span></div>
    <div class="tag">THROW · STICK · SLICE</div>
    <div class="stat" id="bestMenu"></div>
  </div>
  <div class="mgap"></div>
  <div class="mbot">
    <div class="wallet"><span><span class="cn"></span> <b id="mCoins">0</b></span><span><span class="ap"></span> <b id="mApples">0</b></span></div>
    <div class="row"><button class="arrow" id="prevK" aria-label="Previous knife">◀</button>
      <div class="kcard" id="kcard"><canvas id="kPrev" width="432" height="172"></canvas><div class="kname disp" id="kName"></div><div class="krar" id="kRar"></div><div class="kstats" id="kStats"></div></div>
      <button class="arrow" id="nextK" aria-label="Next knife">▶</button></div>
    <button class="sbtn" id="kAct">EQUIPPED</button>
    <button class="btn disp" id="startBtn">PLAY</button>
    <button class="link" id="shopBtn">ALL KNIVES</button>
  </div>
</div>
<div class="overlay hidden" id="shop">
  <h3 class="disp">KNIFE COLLECTION</h3>
  <div class="wallet"><span><span class="cn"></span> <b id="sCoins">0</b></span><span><span class="ap"></span> <b id="sApples">0</b></span></div>
  <div class="sgrid" id="shopGrid"></div>
  <button class="sbtn" id="shopClose">BACK</button>
</div>
<div class="overlay hidden" id="over">
  <h2 class="disp">RUN OVER</h2>
  <div class="ostage" id="overStage">STAGE 1</div>
  <div id="overScore" class="disp">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <div class="orew" id="overRew"></div>
  <button class="btn disp" id="againBtn">PLAY AGAIN</button>
  <button class="link" id="menuBtn">MENU</button>
</div>
<div class="overlay hidden disp" id="pause">PAUSED<div class="hint">tap to continue</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();

    $('mCoins').textContent = fmt(SAVE.coins); $('mApples').textContent = fmt(SAVE.apples);
    $('shopBtn').textContent = 'ALL KNIVES · ' + SAVE.owned.length + '/' + KNIVES.length;
    drawPreview();
  }
  function buildShop() {
    const grid = $('shopGrid'); grid.innerHTML = '';
    KNIVES.forEach((k, i) => {
      const own = SAVE.owned.includes(i), el = document.createElement('div'), rc = RARITY[k.rar][1];
      el.className = 'scard' + (own ? '' : ' lock') + (SAVE.knife === i ? ' eq' : ''); el.style.setProperty('--rc', rc);
      const c = mk(120, 152), g = c.getContext('2d');
      g.fillStyle = radG(g, 60, 76, 0, 72, [[0, hexA(rc, .32)], [1, hexA(rc, 0)]]); g.fillRect(0, 0, 120, 152);
      if (KSPR[i]) { g.save(); g.translate(60, 76); g.rotate(PI / 4); if (k.glow && own) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = .55; g.drawImage(glow(k.glow), -30, -80, 60, 160); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; } g.drawImage(KSPR[i], -17, -68, 34, 136); g.restore(); }
      el.appendChild(c);
      el.insertAdjacentHTML('beforeend', `<div class="nm">${k.n}</div><div class="pr">${own ? (SAVE.knife === i ? '&nbsp;' : 'OWNED') : '<span class="' + (k.cur === 'a' ? 'ap' : 'cn') + '"></span> ' + fmt(k.price)}</div>`);
      el.onclick = () => { prevIdx = i; drawPreview(); $('shop').classList.add('hidden'); };
      grid.appendChild(el);
    });
    $('sCoins').textContent = fmt(SAVE.coins); $('sApples').textContent = fmt(SAVE.apples);
  }
  $('prevK').onclick = () => { prevIdx = (prevIdx + KNIVES.length - 1) % KNIVES.length; drawPreview(); };
  $('nextK').onclick = () => { prevIdx = (prevIdx + 1) % KNIVES.length; drawPreview(); };
  $('shopBtn').onclick = () => { buildShop(); $('shop').classList.remove('hidden'); };
  $('shopClose').onclick = () => $('shop').classList.add('hidden');
  $('kAct').onclick = () => {
    const k = KNIVES[prevIdx];
    if (SAVE.owned.includes(prevIdx)) { SAVE.knife = prevIdx; saveNow(); updateMenu(); chime(); return; }
    const apples = k.cur === 'a', bal = apples ? SAVE.apples : SAVE.coins;
    if (bal < k.price) { $('kAct').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 260 }); const need = k.price - bal; $('bestMenu').innerHTML = 'Need <b>' + fmt(need) + '</b> more ' + (apples ? 'apples' : 'coins') + ' · keep slicing!'; return; }
    if (apples) SAVE.apples -= k.price; else SAVE.coins -= k.price;
    SAVE.owned.push(prevIdx); SAVE.knife = prevIdx; saveNow(); updateMenu(); buildShop(); chime(); setTimeout(chime, 180);
    $('kcard').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 380 });
  };
  function start() {
    audio.start(); audioOn = true;
    for (const id of ['menu', 'over', 'shop', 'pause']) $(id).classList.add('hidden');
    $('pauseBtn').classList.remove('hidden');
    paused = false; newRun(false); last = performance.now();
  }
  function toMenu() {
    for (const id of ['over', 'shop', 'pause']) $(id).classList.add('hidden');
    $('pauseBtn').classList.add('hidden'); paused = false;
    newRun(true); prevIdx = SAVE.knife; updateMenu(); $('menu').classList.remove('hidden');
  }
  $('startBtn').onclick = start; $('againBtn').onclick = start; $('menuBtn').onclick = toMenu;
  function gameOver() {
    G.over = true;
    const sc = Math.floor(G.score), prev = SAVE.best, nb = sc > prev;
    if (nb) SAVE.best = sc;
    SAVE.bestStage = Math.max(SAVE.bestStage, G.stage); SAVE.coins += G.coins; SAVE.apples += G.apples; SAVE.runs++; SAVE.bosses += G.bosses; saveNow();
    G.coinFly = []; G.coinsShown = 0; G.coins = 0; G.apples = 0;
    $('overStage').textContent = 'REACHED STAGE ' + G.stage + ' · ' + THEMES[G.theme % THEMES.length].name;
    $('overScore').textContent = fmt(sc); $('newBest').style.display = nb ? '' : 'none';
    $('overStats').innerHTML = [['Knives stuck', G.stuck], ['Best rhythm', '×' + Math.min(6, G.bestStreak)], ['Apples sliced', G.sliced], ['Close calls', G.closeCalls], ['Bosses split', G.bosses], ['Challenges', G.challenges]].map(([a, b]) => '<div>' + a + '<b>' + b + '</b></div>').join('');
    const earnedC = SAVE.coins - G._c0, earnedA = SAVE.apples - G._a0;
    $('overRew').innerHTML = '+<span class="cn"></span> ' + fmt(earnedC) + ' &nbsp;&nbsp; +<span class="ap"></span> ' + fmt(earnedA) + (nb && prev ? ' &nbsp;·&nbsp; old best ' + fmt(prev) : '');
    $('over').classList.remove('hidden'); $('pauseBtn').classList.add('hidden');
    updateMenu();
    if (nb) [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => sfx(f, .2, 'square', .04), i * 110));
  }
  function pause() { if (!G || G.attract || G.over || paused) return; paused = true; $('pause').classList.remove('hidden'); }
  function resume() { if (!paused) return; paused = false; $('pause').classList.add('hidden'); last = performance.now(); }
  $('pause').addEventListener('pointerdown', e => { e.preventDefault(); resume(); });
  $('pauseBtn').addEventListener('pointerdown', e => e.stopPropagation());
  $('pauseBtn').addEventListener('click', e => { e.stopPropagation(); paused ? resume() : pause(); });
  addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); if (!G || G.attract || G.over) return; if (paused) { resume(); return; } tryThrow(); });
  addEventListener('keydown', e => {
    const menuOpen = !$('menu').classList.contains('hidden'), overOpen = !$('over').classList.contains('hidden');
    if (e.code === 'Enter' && (menuOpen || overOpen) && $('shop').classList.contains('hidden')) { start(); return; }
    if (!G || G.attract) return;
    if (e.code === 'Escape' || e.code === 'KeyP') { paused ? resume() : pause(); return; }
    if (paused) { resume(); return; }
    if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) { e.preventDefault(); if (!e.repeat) tryThrow(); }
  });

  // ---------- boot, loop, test hook ----------
  let last = performance.now(), fps = 60, fpsN = 0, fpsT = 0;
  resize();
  Promise.all(loads).then(res => {
    res.forEach(r => Object.assign(SPR, r));
    KNIVES.forEach((k, i) => { KSPR[i] = SPR['k' + i]; KSH[i] = whiteOf(KSPR[i], '#000'); });
    BOSSES.forEach((b, i) => { b.img = SPR['boss' + i]; b.white = whiteOf(b.img); });
    SPR.halfR = mirror(SPR.halfL); SPR.halfGR = mirror(SPR.halfGL);
    ready = true; newRun(true); updateMenu(); buildShop();
  });
  function loop(now) {
    const raw = Math.max(0, (now - last) / 1000), rdt = Math.min(.05, raw); last = now;
    fpsN++; fpsT += raw; if (fpsT >= .5) { fps = fpsN / fpsT; fpsN = 0; fpsT = 0; }
    if (G && ready && !paused) update(rdt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.__kr = {
    DBG, G: () => G, SAVE, KNIVES,
    state: () => G && G.T ? { stage: G.stage, score: G.score, lives: G.lives, state: G.state, need: G.T.need, done: G.T.done, left: knivesLeft(), over: G.over, attract: G.attract, coins: SAVE.coins, apples: SAVE.apples, runCoins: G.coins, streak: G.streak, best: SAVE.best, fps: Math.round(fps), pat: G.T.pat, boss: G.T.boss, bossName: G.T.boss ? BOSSES[G.T.bi].name : '', theme: THEMES[G.theme % THEMES.length].name, ch: G.T.ch && G.T.ch.text, U, CY, SPAWN, ready } : null,
    start, menu: toMenu, autopilot: v => { G.autopilot = v !== false; }, god: v => { G.god = v !== false; },
    setStage: n => { G.stage = n - 1; G.flying.length = 0; G.chunks = []; G.loose = []; G.halves = []; nextStage(); },
    give: (c = 5000, a = 300) => { SAVE.coins += c; SAVE.apples += a; saveNow(); updateMenu(); },
    unlockAll: () => { SAVE.owned = KNIVES.map((k, i) => i); saveNow(); updateMenu(); buildShop(); },
    equip: i => { if (!SAVE.owned.includes(i)) return false; SAVE.knife = i; prevIdx = i; if (G) G.knife = i; makeIcons(); saveNow(); updateMenu(); return true; },
    throw: () => tryThrow(), safety: () => throwSafety(G.T), win: () => { if (G.state === 'play') { G.T.done = G.T.need - 1; G.lastStick = -9; } },
    die: () => { G.lives = 0; G.state = 'dead'; G.deadT = 0; }, pause, resume, fps: () => fps
  };
})();
</script>
</body>
