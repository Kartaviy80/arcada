<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070720">
<title>Type Defense</title>
<style>
  :root { --f: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05061a; color: #fff; font-family: var(--f); font-weight: 800;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; font-weight: 900; cursor: pointer; border: none; color: inherit; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; visibility: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
  #menu { background: radial-gradient(ellipse at 50% 35%, rgba(6,6,30,.05), rgba(4,4,22,.5) 58%, rgba(2,2,12,.9)); }
  .tag { font-size: 12px; letter-spacing: 6px; color: #9ae8ff; text-shadow: 0 0 10px rgba(80,220,255,.7); }
  .title { font-size: clamp(54px, 16vw, 108px); font-weight: 900; font-style: italic; line-height: .86; letter-spacing: 2px;
    background: linear-gradient(180deg, #ffffff 0%, #c8fbff 26%, #4ad8ff 52%, #2a6aff 78%, #7a3aff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #0a1450) drop-shadow(0 0 22px rgba(74,200,255,.55)); padding: 0 .12em; }
  .title span { display: block; font-size: .5em; letter-spacing: .26em; margin-top: 6px;
    background: linear-gradient(180deg, #ffffff 0%, #ffd0f6 35%, #ff4ad8 65%, #8a1a9a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #3a0a40) drop-shadow(0 0 16px rgba(255,74,216,.5)); }
  .shop { width: min(92vw, 380px); padding: 10px 12px 12px; border-radius: 22px; background: linear-gradient(180deg, rgba(30,32,96,.66), rgba(10,10,42,.78));
    border: 1.5px solid rgba(120,200,255,.35); box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18); }
  .tabs { display: flex; gap: 6px; }
  .tabs button { flex: 1; padding: 7px 0; border-radius: 12px; font-size: 12px; letter-spacing: 2px; background: rgba(255,255,255,.07); color: #9ab8e8; border: 1px solid rgba(255,255,255,.1); }
  .tabs button.on { background: linear-gradient(180deg, #8af6ff, #2a8aff); color: #04103a; box-shadow: 0 0 14px rgba(74,220,255,.5); }
  .gear { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 6px; }
  .gear canvas { width: 220px; height: 138px; }
  .arrow { width: 40px; height: 40px; flex: none; border-radius: 50%; background: rgba(74,200,255,.12); border: 2px solid rgba(120,220,255,.5); color: #bff4ff; font-size: 15px; }
  .arrow:active { transform: scale(.92); }
  .iname { font-size: 17px; letter-spacing: 4px; color: #fff; text-shadow: 0 0 12px rgba(74,220,255,.6); }
  .idesc { font-size: 11px; color: #9ab8e8; letter-spacing: 1px; min-height: 14px; font-weight: 700; margin-top: 2px; }
  .buy { margin-top: 7px; padding: 8px 22px; border-radius: 20px; font-size: 14px; letter-spacing: 2px; background: linear-gradient(180deg, #ffe88a, #f0a020); color: #3a2000; box-shadow: 0 3px 0 #8a5000; }
  .buy.own { background: rgba(255,255,255,.1); color: #bff4ff; box-shadow: none; border: 1.5px solid rgba(120,220,255,.5); }
  .buy.eq { background: rgba(74,255,160,.14); color: #8affc0; box-shadow: none; border: 1.5px solid rgba(74,255,160,.5); }
  .buy.no { filter: grayscale(.7); opacity: .6; }
  .stat { font-size: 13px; color: #c8d8f8; letter-spacing: 1px; } .stat b { color: #ffd84a; }
  .startrow { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 2px; color: #9ab8e8; }
  .startrow b { min-width: 120px; color: #fff; font-size: 15px; line-height: 1.1; } .startrow b small { display: block; font-size: 9px; letter-spacing: 2px; color: #ffb0e8; }
  .medals { display: flex; gap: 5px; justify-content: center; align-items: center; margin-top: 6px; }
  .medals i { width: 22px; height: 22px; border-radius: 50%; font-style: normal; font-size: 12px; line-height: 22px; text-align: center; background: rgba(255,255,255,.07); color: rgba(160,175,220,.45); border: 1px solid rgba(255,255,255,.12); }
  .medals i.on { background: radial-gradient(circle at 38% 32%, #fff7c4, #ffd84a 45%, #c87a0a); color: #5a2a00; border-color: #ffe8a0; box-shadow: 0 0 8px rgba(255,210,80,.6); }
  .medals span { font-size: 10px; letter-spacing: 2px; color: #9ab8e8; margin-left: 4px; }
  .arrow.sm { width: 32px; height: 32px; font-size: 12px; }
  .btn { padding: 12px 52px; border-radius: 40px; font-size: 24px; letter-spacing: 5px; color: #04103a; line-height: 1.05;
    background: linear-gradient(180deg, #d8fdff 0%, #4af0ff 42%, #1a8aff 100%); box-shadow: 0 6px 0 #0a3a8a, 0 0 30px rgba(74,220,255,.55); animation: pulse 1.6s ease-in-out infinite; }
  .btn small { display: block; font-size: 11px; letter-spacing: 3px; opacity: .8; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0a3a8a; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #0a3a8a, 0 0 52px rgba(74,220,255,.9); } }
  .link { background: none; color: #9ab8e8; font-size: 12px; letter-spacing: 3px; text-decoration: underline; padding: 4px 8px; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .opts button { padding: 7px 12px; border-radius: 14px; font-size: 11px; letter-spacing: 1.5px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); color: #c8e8ff; }
  .hint { font-size: 11px; color: #8aa0c8; max-width: 380px; letter-spacing: .5px; font-weight: 700; }
  #coinsTop { position: fixed; z-index: 11; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); padding: 5px 14px 5px 6px; border-radius: 20px;
    display: flex; gap: 7px; align-items: center; font-size: 17px; background: linear-gradient(180deg, rgba(30,30,80,.8), rgba(10,10,40,.85)); border: 1.5px solid rgba(255,216,74,.55); box-shadow: 0 3px 10px rgba(0,0,0,.4); }
  .coin { width: 22px; height: 22px; border-radius: 50%; display: inline-block; background: radial-gradient(circle at 38% 32%, #fff7c4 0 12%, #ffd84a 34%, #f0a316 72%, #b86e08 100%); box-shadow: inset 0 -2px 0 rgba(120,60,0,.5); }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(40,10,70,.84), rgba(4,4,16,.96)); }
  #over h2 { font-size: clamp(34px, 10vw, 62px); font-style: italic; letter-spacing: 3px; color: #ff7a9a; text-shadow: 0 4px 0 #3a0a1a, 0 0 30px rgba(255,80,120,.55); }
  #overScore { font-size: clamp(40px, 12vw, 64px); font-weight: 900; color: #fff; text-shadow: 0 0 24px rgba(120,220,255,.7); line-height: 1; }
  #newBest { font-size: 15px; letter-spacing: 4px; color: #3a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,220,80,.8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: min(92vw, 420px); }
  .grid div { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 7px 8px; font-size: 10px; letter-spacing: 1.5px; color: #9ab8e8; }
  .grid b { display: block; font-size: 20px; color: #fff; letter-spacing: 1px; }
  .row2 { display: flex; gap: 12px; align-items: center; }
  #pause { background: rgba(4,4,20,.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  #pause h3 { font-size: 40px; letter-spacing: 10px; color: #bff4ff; text-shadow: 0 0 20px rgba(74,220,255,.6); font-style: italic; }
  @media (min-aspect-ratio: 6/5) {
    #menu { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 26px; row-gap: 10px; align-content: center; justify-items: center;
      grid-template-areas: "tag shop" "title shop" "stat shop" "start shop" "play opts" "new hint"; }
    #menu .tag { grid-area: tag; align-self: end; } #menu .title { grid-area: title; } #menu .shop { grid-area: shop; align-self: center; } #bestMenu { grid-area: stat; }
    #startRow { grid-area: start; } #startBtn { grid-area: play; } #newBtn { grid-area: new; align-self: start; } #menu .opts { grid-area: opts; } #menu .hint { grid-area: hint; align-self: start; }
  }
  @media (max-height: 700px) and (max-aspect-ratio: 6/5) { #menu .tag, #menu .hint, .idesc { display: none; } #menu { padding-top: max(50px, env(safe-area-inset-top)); } .title { font-size: clamp(44px, 13vw, 70px); } .gear canvas { width: 180px; height: 113px; } .overlay { gap: 7px; } .shop { padding: 8px 10px 10px; } }
  @media (max-height: 520px) {
    .medals { margin-top: 3px; } .medals i { width: 18px; height: 18px; line-height: 18px; font-size: 10px; }
    .overlay { gap: 5px; padding: max(8px, env(safe-area-inset-top)) 14px max(8px, env(safe-area-inset-bottom)); }
    #menu { row-gap: 5px; } .title { font-size: 46px; } .title span { margin-top: 3px; } .tag { font-size: 10px; letter-spacing: 4px; }
    .gear canvas { width: 150px; height: 94px; } .arrow { width: 32px; height: 32px; font-size: 12px; } .iname { font-size: 14px; } .idesc { display: none; }
    .buy { padding: 5px 16px; font-size: 12px; margin-top: 4px; } .tabs button { padding: 5px 0; font-size: 11px; } .shop { padding: 7px 9px 9px; }
    .btn { padding: 8px 36px; font-size: 19px; } .hint { display: none; } .stat { font-size: 11px; }
    #over h2 { font-size: 30px; } #overScore { font-size: 34px; } .grid { gap: 5px; } .grid div { padding: 4px 6px; } .grid b { font-size: 15px; } #newBest { font-size: 12px; padding: 3px 12px; }
    #pause h3 { font-size: 28px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="coinsTop"><i class="coin"></i><span id="coinsVal">0</span></div>
<div class="overlay" id="menu">
  <div class="tag">◆ DEFEND THE STATION ◆</div>
  <div class="title">TYPE<span>DEFENSE</span></div>
  <div class="shop">
    <div class="tabs" id="tabs"><button data-t="station" class="on">STATION</button><button data-t="laser">LASER</button><button data-t="trail">TRAIL</button></div>
    <div class="gear"><button class="arrow" id="prevItem" aria-label="Previous">◀</button><canvas id="prev" width="440" height="276"></canvas><button class="arrow" id="nextItem" aria-label="Next">▶</button></div>
    <div class="iname" id="itemName"></div><div class="idesc" id="itemDesc"></div>
    <button class="buy" id="buyBtn"></button>
  </div>
  <div class="stat" id="bestMenu"></div>
  <div class="startrow" id="startRow"><span>START AT</span><button class="arrow sm" id="wPrev" aria-label="Earlier wave">◀</button><b id="wStart">WAVE 1</b><button class="arrow sm" id="wNext" aria-label="Later wave">▶</button></div>
  <button class="btn" id="startBtn">PLAY</button>
  <button class="link" id="newBtn">NEW RUN</button>
  <div class="opts"><button id="kbBtn"></button><button id="assistBtn"></button></div>
  <div class="hint">Type an enemy's word to lock on and fire · Backspace releases the lock · 1 2 3 trigger power-ups · Esc pauses</div>
</div>
<div class="overlay hidden" id="over">
  <h2>STATION LOST</h2>
  <div id="overScore">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <div class="stat" id="coinMsg"></div>
  <button class="btn" id="againBtn">PLAY AGAIN</button>
  <button class="link" id="menuBtn">MAIN MENU</button>
</div>
<div class="overlay hidden" id="pause">
  <h3>PAUSED</h3>
  <div class="stat" id="pauseInfo"></div>
  <button class="btn" id="resumeBtn">RESUME</button>
  <div class="opts"><button id="kbBtn2"></button><button id="assistBtn2"></button></div>
  <button class="link" id="quitBtn">SAVE &amp; QUIT TO MENU</button>
</div>
<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`

// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};

// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }

  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },

    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }
        else if (p.shape === 'heart') { ctx.rotate(p.rot * .2); heart(ctx, p.size); }
        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * (.4 + k * .6), 0, TAU); ctx.fill(); }
        ctx.restore(); ctx.shadowBlur = 0;
      }

      }
      ctx.globalAlpha = 1;
    },
    drawFlash(ctx, W, H) { if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  };
})();
