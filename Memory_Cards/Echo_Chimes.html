<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f2a">
<title>Echo Chimes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f2a; color: #fff;
    font-family: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif; font-weight: 800;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; font-weight: 900; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .hidden { opacity: 0 !important; pointer-events: none !important; }
  .coin { display: inline-block; width: 1em; height: 1em; border-radius: 50%; vertical-align: -0.14em;
    background: radial-gradient(circle at 35% 30%, #fffbe0 0 14%, #ffd84a 34%, #e8a020 70%, #9a5a08 100%); box-shadow: 0 0 0 1.5px #7a4406 inset, 0 0 8px rgba(255,210,80,.6); }
  .coinPill { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 4px); right: 12px; z-index: 30; display: flex; align-items: center; gap: 7px;
    padding: 6px 14px 6px 8px; border-radius: 22px; font-size: 19px; color: #fff4c8; text-shadow: 0 2px 3px rgba(0,0,0,.6);
    background: linear-gradient(180deg, rgba(40,36,90,.82), rgba(14,14,44,.86)); border: 1.5px solid rgba(255,230,150,.45); box-shadow: 0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18); transition: transform .15s; }
  .coinPill .coin { width: 22px; height: 22px; }
  .coinPill.bump { transform: scale(1.14); }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0 0 auto 0; z-index: 20; pointer-events: none; transition: opacity .3s; }
  .iconBtn { pointer-events: auto; position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 2px); left: 12px; width: 46px; height: 46px; border-radius: 50%;
    border: 1.5px solid rgba(200,235,255,.5); background: linear-gradient(180deg, rgba(60,70,140,.8), rgba(18,20,56,.85)); box-shadow: 0 4px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center; gap: 6px; }
  .iconBtn span { width: 6px; height: 18px; border-radius: 2px; background: #e8f6ff; }
  #lvlPill { position: absolute; left: 50%; top: calc(max(8px, env(safe-area-inset-top)) + 2px); transform: translateX(-50%); text-align: center; padding: 6px 22px 7px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(50,56,130,.78), rgba(16,16,50,.82)); border: 1.5px solid rgba(190,230,255,.4); box-shadow: 0 4px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.2); white-space: nowrap; }
  #lvlNum { display: block; font-size: 21px; letter-spacing: 2px; line-height: 1.05; background: linear-gradient(180deg, #fff, #c8f2ff 55%, #9ab8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #lvlNum.boss { background: linear-gradient(180deg, #fffbe0, #ffd86a 55%, #ff9a3a); -webkit-background-clip: text; background-clip: text; }
  #lvlChap { display: block; font-size: 11px; letter-spacing: 2.5px; color: #bfe6ff; opacity: .9; text-transform: uppercase; }
  #subHud { position: absolute; left: 50%; top: calc(max(8px, env(safe-area-inset-top)) + 62px); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  #lives { display: flex; gap: 4px; }
  #lives svg { width: 20px; height: 24px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); transition: transform .3s, opacity .3s; }
  #lives svg.lost { opacity: .35; transform: scale(.85) rotate(-12deg); }
  #chips { display: flex; gap: 5px; }
  .chip { font-size: 11px; letter-spacing: 1.5px; padding: 4px 9px; border-radius: 12px; color: #10122a; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  #replayBtn { position: fixed; z-index: 21; left: 14px; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 2px); display: flex; align-items: center; gap: 8px;
    padding: 10px 16px 10px 12px; border-radius: 28px; font-size: 15px; letter-spacing: 1.5px; color: #eaf8ff;
    border: 1.5px solid rgba(170,230,255,.6); background: linear-gradient(180deg, rgba(70,110,200,.85), rgba(28,30,90,.9)); box-shadow: 0 5px 0 rgba(8,10,40,.7), 0 0 20px rgba(120,200,255,.25); transition: opacity .3s, transform .1s; }
  #replayBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(8,10,40,.7); }
  #replayBtn .rIcon { font-size: 22px; line-height: 1; }
  #replayBtn .rCost { display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; background: rgba(0,0,0,.35); color: #ffe48a; }
  #replayBtn.shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* ---------- overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px; text-align: center; transition: opacity .35s; }
  #menu { z-index: 25; justify-content: space-between; padding: calc(max(14px, env(safe-area-inset-top)) + 46px) 16px calc(max(14px, env(safe-area-inset-bottom)) + 8px);
    background: linear-gradient(180deg, rgba(6,8,30,.55), rgba(6,8,30,0) 26%, rgba(6,8,30,0) 52%, rgba(6,8,30,.72) 80%, rgba(4,6,24,.9)); }
  .mTop, .mBot { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  #demoSlot { flex: 1; width: 100%; min-height: 120px; pointer-events: none; }
  .tag { font-size: 11px; letter-spacing: 4px; white-space: nowrap; color: #cfeeff; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .title { font-size: clamp(56px, 17vw, 112px); line-height: .86; letter-spacing: 4px; font-weight: 900;
    background: linear-gradient(180deg, #ffffff 0%, #e8fbff 28%, #8fe2ff 55%, #8a8cff 80%, #c08aff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #1a1450) drop-shadow(0 0 24px rgba(140,210,255,.55)); }
  .title span { display: block; font-size: .5em; letter-spacing: .42em; margin-left: .42em; background: linear-gradient(180deg, #fff6d8, #ffd27a 50%, #ff9ad0); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #2a1040); }
  .skins { display: flex; gap: 8px; justify-content: center; }
  .skin { position: relative; width: 80px; padding: 6px 4px 7px; border-radius: 16px; border: 1.5px solid rgba(180,220,255,.28); color: #e8f4ff;
    background: linear-gradient(180deg, rgba(40,46,110,.72), rgba(12,12,40,.82)); box-shadow: 0 4px 12px rgba(0,0,0,.35); transition: transform .15s, border-color .2s; }
  .skin canvas { width: 54px; height: 54px; display: block; margin: 0 auto 2px; }
  .skin b { display: block; font-size: 10px; letter-spacing: 1px; white-space: nowrap; }
  .skin small { display: block; font-size: 10px; color: #ffe48a; margin-top: 2px; }
  .skin.on { border-color: #9af0ff; box-shadow: 0 0 0 2px rgba(150,240,255,.5), 0 0 22px rgba(120,220,255,.45); transform: translateY(-3px); }
  .skin.locked canvas { filter: grayscale(.7) brightness(.6); }
  .btn { position: relative; border: 2px solid rgba(255,255,255,.85); padding: 11px 60px 9px; border-radius: 40px; font-size: 27px; letter-spacing: 6px; color: #fff;
    text-shadow: 0 2px 0 rgba(30,20,90,.6); background: linear-gradient(180deg, #a8f4ff 0%, #5ab4ff 40%, #6a5cff 75%, #8a4cf0 100%);
    box-shadow: 0 6px 0 #2a1a7a, 0 0 28px rgba(120,200,255,.55), inset 0 2px 0 rgba(255,255,255,.6); animation: pulse 1.8s ease-in-out infinite; }
  .btn small { display: block; font-size: 12px; letter-spacing: 3px; opacity: .95; margin-top: 1px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2a1a7a; }
  .btn:disabled { filter: grayscale(.8) brightness(.7); animation: none; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #2a1a7a, 0 0 46px rgba(150,220,255,.9), inset 0 2px 0 rgba(255,255,255,.6); } }
  .ghostBtn { position: relative; border: 1.5px solid rgba(190,230,255,.55); padding: 9px 20px; border-radius: 24px; font-size: 15px; letter-spacing: 2.5px; color: #e4f6ff;
    background: linear-gradient(180deg, rgba(60,70,150,.7), rgba(20,20,60,.8)); box-shadow: 0 4px 0 rgba(8,8,36,.7); }
  .ghostBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(8,8,36,.7); }
  .ghostBtn:disabled { opacity: .45; }
  .ghostBtn i { position: absolute; top: -3px; right: -3px; width: 13px; height: 13px; border-radius: 50%; background: #ff5a8a; box-shadow: 0 0 10px #ff5a8a; display: none; }
  .ghostBtn i.on { display: block; animation: pulse2 1s infinite; }
  @keyframes pulse2 { 50% { transform: scale(1.3); } }
  .mRow { display: flex; align-items: center; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .stat { font-size: 13px; color: #d8ecff; text-shadow: 0 1px 3px #000; letter-spacing: .5px; } .stat b { color: #ffe48a; }

  .panel { position: relative; width: min(92vw, 420px); max-height: calc(100% - 10px); overflow: auto; padding: 22px 20px 20px; border-radius: 26px;
    background: linear-gradient(180deg, rgba(36,40,104,.92), rgba(12,12,40,.95)); border: 1.5px solid rgba(180,225,255,.4);
    box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.2), 0 0 40px rgba(120,180,255,.18); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .overlay.dim { background: radial-gradient(ellipse at 50% 45%, rgba(10,12,40,.45), rgba(4,4,18,.82)); }
  .pTag { font-size: 11px; letter-spacing: 5px; color: #9fdcff; text-transform: uppercase; }
  .panel h2 { font-size: clamp(30px, 8.5vw, 44px); letter-spacing: 2px; line-height: 1; background: linear-gradient(180deg, #fff, #c8f4ff 50%, #8aa8ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 rgba(20,10,70,.8)); }
  .panel h2.gold { background: linear-gradient(180deg, #fffbe0, #ffd86a 55%, #ff9a3a); -webkit-background-clip: text; background-clip: text; }
  .panel h2.red { background: linear-gradient(180deg, #fff0f4, #ff9ab8 55%, #c84a8a); -webkit-background-clip: text; background-clip: text; }
  .sub { font-size: 14px; color: #cfe4ff; font-weight: 700; letter-spacing: .3px; }
  .stars { display: flex; gap: 10px; align-items: flex-end; height: 70px; }
  .stars i { width: 54px; height: 54px; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: rgba(255,255,255,.14); }
  .stars i:nth-child(2) { width: 68px; height: 68px; }
  .stars i.on { background: linear-gradient(180deg, #fffbe0, #ffd84a 45%, #f09a10); animation: starPop .55s cubic-bezier(.3,1.8,.5,1) backwards; filter: drop-shadow(0 0 10px rgba(255,210,80,.8)); }
  .stars i.on:nth-child(2) { animation-delay: .25s; } .stars i.on:nth-child(3) { animation-delay: .5s; }
  @keyframes starPop { 0% { transform: scale(0) rotate(-40deg); } }
  #newBest { font-size: 14px; letter-spacing: 3px; color: #2a0a30; background: linear-gradient(90deg, #ffe84a, #ff9ad0); padding: 5px 16px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 0 22px rgba(255,200,120,.7); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 18px; font-size: 14px; color: #c8dcf8; text-align: left; width: 100%; max-width: 300px; font-weight: 700; }
  .grid b { color: #fff; float: right; margin-left: 10px; font-weight: 900; }
  .reward { display: flex; align-items: center; gap: 8px; font-size: 30px; color: #ffe48a; text-shadow: 0 2px 0 #5a3006, 0 0 16px rgba(255,210,80,.5); }
  .reward .coin { width: 30px; height: 30px; }
  .goalToast { font-size: 13px; color: #9affd0; letter-spacing: .5px; min-height: 0; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .row .btn { padding: 10px 34px 8px; font-size: 22px; letter-spacing: 4px; }
  .twIcon { width: 86px; height: 86px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 46px; color: #10122a;
    box-shadow: 0 0 0 4px rgba(255,255,255,.35), 0 0 34px currentColor; animation: twSpin 2.4s ease-in-out infinite; }
  @keyframes twSpin { 50% { transform: scale(1.08) rotate(8deg); } }
  #pause h2 { letter-spacing: 6px; }
  .pBtns { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; }
  .pBtns .ghostBtn { width: 100%; }
  .chapGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .chap { border-radius: 12px; overflow: hidden; position: relative; border: 1.5px solid rgba(180,220,255,.3); background: #000; }
  .chap canvas { width: 100%; display: block; aspect-ratio: 3 / 2; }
  .chap div { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 4px; font-size: 10px; letter-spacing: .5px; background: linear-gradient(0deg, rgba(0,0,0,.8), rgba(0,0,0,0)); }
  .chap.lock canvas { filter: grayscale(1) brightness(.35); }
  .chap.cur { border-color: #9af0ff; box-shadow: 0 0 14px rgba(140,230,255,.6); }
  .goals { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .goal { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px; background: rgba(255,255,255,.06); text-align: left; }
  .goal .gi { flex: 1; } .goal b { display: block; font-size: 13px; color: #fff; } .goal small { display: block; font-size: 11px; color: #a8c4e8; font-weight: 700; }
  .goal .bar { height: 5px; border-radius: 3px; background: rgba(0,0,0,.4); margin-top: 4px; overflow: hidden; } .goal .bar i { display: block; height: 100%; background: linear-gradient(90deg, #7af0ff, #b08aff); }
  .goal button { border: none; border-radius: 14px; padding: 6px 10px; font-size: 12px; color: #2a1a04; background: linear-gradient(180deg, #fff2a0, #f0b030); box-shadow: 0 3px 0 #7a4a06; white-space: nowrap; }
  .goal button:disabled { background: rgba(255,255,255,.12); color: #c8d8f0; box-shadow: none; }
  .secT { font-size: 12px; letter-spacing: 4px; color: #9fdcff; align-self: flex-start; }
  #toast { position: fixed; left: 50%; top: 30%; z-index: 60; transform: translate(-50%, -50%) scale(.9); padding: 10px 20px; border-radius: 20px; font-size: 16px; letter-spacing: 1px;
    background: rgba(14,14,44,.92); border: 1.5px solid rgba(255,220,140,.5); color: #ffe8a8; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; }
  #toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .flyCoin { position: fixed; z-index: 70; width: 22px; height: 22px; pointer-events: none; transition: transform .75s cubic-bezier(.5,-0.3,.7,1), opacity .2s; }

  @media (max-height: 700px) and (min-height: 521px) {
    .title { font-size: clamp(48px, 14vw, 80px); } .mTop, .mBot { gap: 7px; } .skin { width: 72px; } .skin canvas { width: 44px; height: 44px; }
    .btn { font-size: 23px; padding: 9px 50px 7px; } .stars { height: 58px; } .stars i { width: 44px; height: 44px; } .stars i:nth-child(2) { width: 56px; height: 56px; } .panel { gap: 9px; padding: 16px; }
  }
  @media (min-aspect-ratio: 3/2) and (min-height: 521px) {
    #menu { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; grid-template-areas: "top slot" "bot slot"; align-items: center; padding: 50px 30px 34px; gap: 18px 10px;
      background: linear-gradient(90deg, rgba(6,8,30,.72), rgba(6,8,30,.35) 48%, rgba(6,8,30,0) 70%); }
    .mTop { grid-area: top; align-self: end; } .mBot { grid-area: bot; align-self: start; } #demoSlot { grid-area: slot; height: 100%; }
  }
  @media (min-width: 700px) { .goals { display: grid; grid-template-columns: 1fr 1fr; } #journey .panel { width: min(94vw, 760px) !important; } }
  .xBtn { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid rgba(190,230,255,.5); background: rgba(20,20,60,.8); color: #e4f6ff; font-size: 16px; }
  @media (max-width: 400px) {
    #lvlPill { left: 66px; transform: none; padding: 5px 14px 6px; } #lvlNum { font-size: 18px; letter-spacing: 1px; } #lvlChap { font-size: 9.5px; letter-spacing: 1.2px; }
    .coinPill { font-size: 16px; padding: 5px 10px 5px 6px; } .coinPill .coin { width: 18px; height: 18px; }
  }
  @media (max-width: 370px) { .skin { width: 74px; } .skins { gap: 6px; } }
  @media (max-height: 520px) {
    #menu { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; grid-template-areas: "top slot" "bot slot"; align-items: center; padding: calc(max(8px, env(safe-area-inset-top)) + 6px) 12px 8px; gap: 4px 6px;
      background: linear-gradient(90deg, rgba(6,8,30,.82), rgba(6,8,30,.45) 50%, rgba(6,8,30,0) 70%); }
    .mTop { grid-area: top; gap: 2px; } .mBot { grid-area: bot; gap: 6px; } #demoSlot { grid-area: slot; height: 100%; }
    .title { font-size: 46px; } .title span { display: inline; font-size: .62em; letter-spacing: .2em; margin-left: .2em; } .tag { font-size: 9px; letter-spacing: 3px; }
    .skin { width: 62px; padding: 4px 2px; border-radius: 12px; } .skin canvas { width: 32px; height: 32px; } .skin b { font-size: 8px; } .skin small { font-size: 9px; }
    .btn { font-size: 20px; padding: 7px 40px 5px; } .btn small { font-size: 10px; } .ghostBtn { padding: 6px 14px; font-size: 13px; } .stat { font-size: 11px; }
    #subHud { top: calc(max(8px, env(safe-area-inset-top)) + 8px); left: auto; right: 150px; transform: none; flex-direction: column; gap: 3px; }
    #lvlPill { padding: 4px 16px 5px; } #lvlNum { font-size: 18px; }
    .panel { width: min(94vw, 620px); padding: 12px 16px; gap: 7px; } .panel h2 { font-size: 28px; } .stars { height: 44px; } .stars i { width: 34px; height: 34px; } .stars i:nth-child(2) { width: 42px; height: 42px; }
    .grid { font-size: 12px; gap: 3px 16px; max-width: 420px; } .reward { font-size: 22px; } .twIcon { width: 56px; height: 56px; font-size: 30px; }
    .chapGrid { grid-template-columns: repeat(6, 1fr); } .goals { display: grid; grid-template-columns: 1fr 1fr; }
    #replayBtn { padding: 7px 12px 7px 10px; font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="coinPill" id="coinPill"><i class="coin"></i><span id="coinTxt">0</span></div>
<div id="hud" class="hidden">
  <button class="iconBtn" id="pauseBtn" aria-label="Pause"><span></span><span></span></button>
  <div id="lvlPill"><b id="lvlNum">LEVEL 1</b><small id="lvlChap">Crystal Cave</small></div>
  <div id="subHud"><div id="lives"></div><div id="chips"></div></div>
</div>
<button id="replayBtn" class="hidden" aria-label="Hear the melody again"><span class="rIcon">↻</span><span class="rTxt">HEAR AGAIN</span><span class="rCost"><i class="coin"></i><span id="replayCost">20</span></span></button>

<div class="overlay" id="menu">
  <div class="mTop">
    <div class="tag">✦ A CRYSTAL MELODY MEMORY ✦</div>
    <div class="title">ECHO<span>CHIMES</span></div>
    <div class="stat" id="bestMenu"></div>
  </div>
  <div id="demoSlot"></div>
  <div class="mBot">
    <div class="skins" id="skins"></div>
    <button class="btn" id="startBtn">PLAY<small id="startSub">LEVEL 1</small></button>
    <div class="mRow"><button class="ghostBtn" id="journeyBtn">✦ JOURNEY<i id="goalDot"></i></button></div>
  </div>
</div>

<div class="overlay dim hidden" id="win">
  <div class="panel">
    <div class="pTag" id="winTag">CRYSTAL CAVE</div>
    <h2 id="winTitle">LEVEL 1 CLEAR!</h2>
    <div class="stars" id="stars"><i></i><i></i><i></i></div>
    <div id="newBest">NEW BEST STREAK!</div>
    <div class="grid" id="winStats"></div>
    <div class="reward"><i class="coin"></i><span id="winCoins">+0</span></div>
    <div class="goalToast" id="goalToast"></div>
    <div class="row"><button class="ghostBtn" id="winMenu">MENU</button><button class="btn" id="nextBtn">NEXT ▶</button></div>
  </div>
</div>

<div class="overlay dim hidden" id="fail">
  <div class="panel">
    <div class="pTag" id="failTag">LEVEL 1</div>
    <h2 class="red">SHATTERED</h2>
    <div class="sub">The crystal couldn't hold the melody.</div>
    <div class="grid" id="failStats"></div>
    <div class="pBtns">
      <button class="btn" id="mendBtn" style="font-size:18px;letter-spacing:2px;padding:10px 18px 8px">MEND +1 ♦<small><i class="coin"></i> <span id="mendCost">60</span></small></button>
      <button class="ghostBtn" id="retryBtn">↺ TRY AGAIN</button>
      <button class="ghostBtn" id="failMenu">MENU</button>
    </div>
  </div>
</div>

<div class="overlay dim hidden" id="pause">
  <div class="panel">
    <h2>PAUSED</h2>
    <div class="sub" id="pauseSub"></div>
    <div class="pBtns">

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }
        else if (p.shape === 'heart') { ctx.rotate(p.rot * .2); heart(ctx, p.size); }
        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * (.4 + k * .6), 0, TAU); ctx.fill(); }
        ctx.restore(); ctx.shadowBlur = 0;
      }
      for (const t of texts) {
        const age = t.max - t.life, pop = age < .18 ? 1 + Math.sin(age / .18 * Math.PI) * .45 : 1, a = Math.min(1, t.life / t.max * 2.2);
        ctx.save(); ctx.globalAlpha = a; ctx.translate(t.x, t.y); ctx.scale(pop, pop); if (t.wobble) ctx.rotate(Math.sin(age * 20) * t.wobble);
        ctx.font = t.font + t.size + 'px "Avenir Next", "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, t.size * .16); ctx.strokeStyle = t.stroke; ctx.strokeText(t.str, 0, 0); ctx.fillStyle = t.c; ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },
    drawFlash(ctx, W, H) { if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  };
})();
/*FX-END*/

    ctx.fillStyle = lg(ctx, 0, ty - ts / 2, 0, ty + ts / 2, b.boss ? [[0, '#fffbe0'], [.55, '#ffd86a'], [1, '#ff9a3a']] : [[0, '#ffffff'], [.55, '#d8f6ff'], [1, C.accent]]); ctx.fillText(b.title, W / 2 + dx, ty);
    ctx.font = `800 ${Math.min(17, ts * .32)}px ${FONT}`; ctx.fillStyle = '#e0f0ff'; ctx.fillText(b.sub.toUpperCase().split('').join(String.fromCharCode(8202)), W / 2 - dx * .5, ty + ts * .66);
    if (b.sub2) { ctx.font = `900 ${Math.min(15, ts * .28)}px ${FONT}`; ctx.fillStyle = b.boss ? '#ffd86a' : '#ffe8a8'; ctx.fillText(b.sub2, W / 2, ty + ts * 1.12); }
    ctx.globalAlpha = 1;
  }
  function drawFinger() {
    const f = G.finger; if (!f || !SPR.finger || G.phase !== 'answer') return;
    if (!G.bot && !f.tut) return;
    const s = Math.max(44, LY.S * .62) * (1 - G.fingerPress * .14);
    ctx.globalAlpha = G.attract ? .8 : .95;
    if (G.fingerPress > .3) { ctx.strokeStyle = hexA('#ffffff', G.fingerPress * .8); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, LY.S * (.6 - G.fingerPress * .25), 0, TAU); ctx.stroke(); }
    ctx.drawImage(SPR.finger, f.x - s * .48, f.y - s * .05, s, s);
    ctx.globalAlpha = 1;
  }

  // ---------- UI ----------
  function hideOverlays() { ['win', 'fail', 'pause', 'twistCard', 'journey'].forEach(id => $(id).classList.add('hidden')); }
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1600); }
  let coinShown = SAVE.coins;
  function updateCoins(anim) { if (!anim) coinShown = SAVE.coins; $('coinTxt').textContent = fmt(coinShown); }
  function bumpCoin() { const p = $('coinPill'); p.classList.add('bump'); setTimeout(() => p.classList.remove('bump'), 140); }
  function flyCoins(fromEl, amount) {
    const a = fromEl.getBoundingClientRect(), b = $('coinPill').getBoundingClientRect(), n = clamp(Math.ceil(amount / 6), 4, 12), start = SAVE.coins - amount;
    coinShown = start; updateCoins(true);
    for (let i = 0; i < n; i++) {
      const el = document.createElement('i'); el.className = 'coin flyCoin';
      const sx = a.left + a.width / 2 - 11 + rr(-24, 24), sy = a.top + a.height / 2 - 11 + rr(-10, 10);
      el.style.left = sx + 'px'; el.style.top = sy + 'px'; document.body.appendChild(el);
      setTimeout(() => { el.style.transform = `translate(${b.left + 10 - sx}px, ${b.top + b.height / 2 - 11 - sy}px) scale(.85)`; }, 30 + i * 60);
      setTimeout(() => { el.remove(); coinShown = Math.round(start + amount * (i + 1) / n); updateCoins(true); bumpCoin(); if (audioOn) audio.sfx(1320 + i * 45, .07, 'triangle', .04, 1760 + i * 45); }, 820 + i * 60);
    }
  }
  const lifeSvg = lost => `<svg viewBox="0 0 20 24" class="${lost ? 'lost' : ''}"><path d="M10 1 L19 8 L10 23 L1 8 Z" fill="${lost ? '#4a5070' : '#8ae8ff'}"/><path d="M10 1 L19 8 L10 23 Z" fill="${lost ? '#343a58' : '#5a9cff'}"/><path d="M1 8 L19 8 L10 1 Z" fill="${lost ? '#6a7090' : '#e0faff'}"/>${lost ? '<path d="M5 5 L10 11 L7.5 14 L12 20" stroke="#fff" stroke-width="1.3" fill="none"/>' : ''}<path d="M10 1 L19 8 L10 23 L1 8 Z" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1"/></svg>`;
  function updateHud() {
    if (!G || G.attract) return; const L = G.L;
    $('lvlNum').textContent = L.boss ? '♛ BOSS · ' + G.n : 'LEVEL ' + G.n; $('lvlNum').classList.toggle('boss', L.boss);
    $('lvlChap').textContent = L.boss ? L.name : chapterName(L);
    $('lives').innerHTML = [0, 1, 2].map(i => lifeSvg(i >= G.lives)).join('');
    $('chips').innerHTML = L.tw.map(k => `<span class="chip" style="background:${TW[k].col}">${TW[k].icon} ${TW[k].name}</span>`).join('');
    updateCoins();
  }
  function bumpLives() { const s = $('lives').children[G.lives]; if (s) { s.style.transform = 'scale(1.5)'; setTimeout(() => { s.style.transform = ''; }, 200); } }
  function syncUi() {
    const s = G && !G.attract && !menuOpen && G.phase === 'answer' && !paused && !G.hold ? 1 : 0;
    if (s !== syncUi.s) { syncUi.s = s; $('replayBtn').classList.toggle('hidden', !s); }
  }
  const skinCanv = [];
  function buildSkins() {
    const box = $('skins'); box.innerHTML = '';
    SKINS.forEach((s, i) => {
      const b = document.createElement('button'); b.className = 'skin'; const c = mk(108, 108); skinCanv[i] = c; b.appendChild(c);
      const nm = document.createElement('b'); nm.textContent = s.short; b.appendChild(nm); b.appendChild(document.createElement('small'));
      b.onclick = () => skinClick(i); box.appendChild(b);
    });
  }
  function updateSkins() {
    [...$('skins').children].forEach((b, i) => {
      const own = SAVE.skins.includes(i); b.classList.toggle('on', SAVE.skin === i); b.classList.toggle('locked', !own);
      b.querySelector('small').innerHTML = SAVE.skin === i ? 'EQUIPPED' : own ? 'OWNED' : `<i class="coin"></i> ${fmt(SKINS[i].price)}`;
      const x = skinCanv[i].getContext('2d'); x.clearRect(0, 0, 108, 108);
      if (SPR.pad[i][5]) { x.globalCompositeOperation = 'lighter'; x.drawImage(glowOf(HUES[[5, 1, 3, 7][i]]), -6, -6, 120, 120); x.globalCompositeOperation = 'source-over'; x.drawImage(SPR.pad[i][[5, 1, 3, 7][i]], 6, 6, 96, 96); }
    });
  }
  function skinClick(i) {
    ensureAudio(); const s = SKINS[i];
    if (SAVE.skins.includes(i)) { SAVE.skin = i; }
    else if (SAVE.coins >= s.price) { SAVE.coins -= s.price; SAVE.skins.push(i); SAVE.skin = i; toast('Unlocked ' + s.name + '!'); updateCoins(); bumpCoin(); }
    else toast('Need ' + fmt(s.price - SAVE.coins) + ' more coins · preview');
    [0, 2, 4, 7].forEach((k, j) => setTimeout(() => chimeRaw(NOTE_SETS[8][k], .8, i), j * 150));
    saveNow(); updateSkins();
  }
  function updateMenu() {
    const p = SAVE.prog && SAVE.prog.n === SAVE.level ? SAVE.prog : null;
    $('startBtn').firstChild.textContent = p ? 'CONTINUE' : 'PLAY';
    $('startSub').textContent = 'LEVEL ' + SAVE.level + (p ? ' · PHRASE ' + (p.round + 1) : ' · ' + CHAPTERS[curChap()].name.toUpperCase());
    const stars = Object.values(SAVE.stars).reduce((a, b) => a + b, 0);
    $('bestMenu').innerHTML = `★ <b>${stars}</b> &nbsp;·&nbsp; BEST STREAK <b>${SAVE.bestStreak}</b>`;
    $('goalDot').classList.toggle('on', GOALS.some(goalReady));
    updateSkins(); updateCoins();
  }
  const thumbs = {};
  function renderGoals() {
    $('goalList').innerHTML = GOALS.map(g => {
      const [a, b] = g.prog(), done = SAVE.goals[g.id] === 'claimed', ready = a >= b && !done;
      return `<div class="goal"><div class="gi"><b>${g.name}</b><small>${g.desc} · ${fmt(Math.min(a, b))}/${fmt(b)}</small><div class="bar"><i style="width:${Math.min(100, a / b * 100)}%"></i></div></div><button data-g="${g.id}" ${ready ? '' : 'disabled'}>${done ? '✓ DONE' : '<i class="coin"></i> ' + g.reward}</button></div>`;
    }).join('');
    [...$('goalList').querySelectorAll('button[data-g]')].forEach(b => { b.onclick = () => claimGoal(b.dataset.g, b); });
  }
  function claimGoal(id, btn) { const g = GOALS.find(x => x.id === id); if (!g || !goalReady(g)) return; SAVE.goals[id] = 'claimed'; SAVE.coins += g.reward; saveNow(); flyCoins(btn, g.reward); toast('+' + g.reward + ' coins · ' + g.name); renderGoals(); updateMenu(); }
  function openJourney() {
    ensureAudio(); uiClick();
    const grid = $('chapGrid'); grid.innerHTML = '';
    CHAPTERS.forEach((c, i) => {
      const first = i * 10 + 1, open = SAVE.best >= first || i === 0;
      const d = document.createElement('div'); d.className = 'chap' + (open ? '' : ' lock') + (curChap() === i ? ' cur' : '');
      if (!thumbs[i]) thumbs[i] = paintBackdrop(i, 240, 160, 1);
      const cc = mk(240, 160); cc.getContext('2d').drawImage(thumbs[i], 0, 0); d.appendChild(cc);
      const lab = document.createElement('div'); lab.textContent = open ? c.name : 'LOCKED · LV ' + first; d.appendChild(lab); grid.appendChild(d);
    });
    renderGoals(); $('journey').classList.remove('hidden');
  }
  function showTwistCard(k) {
    const tw = TW[k]; G.hold = true;
    const ic = $('twIcon'); ic.textContent = tw.icon; ic.style.background = `radial-gradient(circle at 35% 30%, #fff, ${tw.col} 55%, ${shade(tw.col, -.4)})`; ic.style.boxShadow = `0 0 0 4px rgba(255,255,255,.35), 0 0 36px ${tw.col}`;
    $('twName').textContent = tw.name; $('twText').textContent = tw.text; $('twistCard').classList.remove('hidden');
    $('twOk').onclick = () => {
      if (!SAVE.seen.includes(k)) SAVE.seen.push(k); saveNow(); $('twistCard').classList.add('hidden'); uiClick();
      const more = G.L.tw.filter(q => !SAVE.seen.includes(q)); if (more.length) showTwistCard(more[0]); else { G.hold = false; G.pt = Math.min(G.pt, .4); if (G.banner) G.banner.t = Math.min(G.banner.t, .4); }
    };
  }
  function showWin() {
    const r = G.res, L = G.L;
    $('winTag').textContent = chapterName(L) + (L.boss ? ' · ' + L.name : '');
    $('winTitle').textContent = L.boss ? 'SONG MASTERED!' : 'LEVEL ' + G.n + ' CLEAR!'; $('winTitle').classList.toggle('gold', L.boss || r.stars === 3);
    [...$('stars').children].forEach((s, i) => { s.classList.remove('on'); void s.offsetWidth; if (i < r.stars) s.classList.add('on'); });
    $('newBest').style.display = r.newBest ? '' : 'none';
    const acc = Math.round(100 * G.hits / Math.max(1, G.hits + G.mistakes));
    $('winStats').innerHTML = [['Notes', G.hits], ['Accuracy', acc + '%'], ['Streak', SAVE.streak], ['Replays', G.replays]].map(([a, b]) => `<div>${a}<b>${b}</b></div>`).join('');
    $('goalToast').textContent = r.goals.length ? '✦ Goal complete: ' + r.goals.map(g => g.name).join(', ') + ' · claim it in Journey' : '';
    $('winCoins').textContent = '+0'; $('win').classList.remove('hidden');
    coinShown = SAVE.coins - r.coins; updateCoins(true);
    for (let i = 1; i <= 20; i++) setTimeout(() => { $('winCoins').textContent = '+' + Math.round(r.coins * i / 20); }, 350 + i * 30);
    setTimeout(() => flyCoins($('winCoins'), r.coins), 1050);
    if (r.stars === 3 && audioOn) [0, 4, 7, 12].forEach((s, i) => setTimeout(() => chimeRaw(s + 12, .5, SAVE.skin), 400 + i * 260));
    if (AUTO) setTimeout(() => { if (!$('win').classList.contains('hidden')) nextLevel(); }, 1600);
  }
  function showFail() {
    $('failTag').textContent = (G.L.boss ? 'BOSS SONG · ' : '') + 'LEVEL ' + G.n;
    $('failStats').innerHTML = [['Phrase', (G.round + 1) + ' / ' + G.L.lens.length], ['Notes', G.hits], ['Mistakes', G.mistakes], ['Replays', G.replays]].map(([a, b]) => `<div>${a}<b>${b}</b></div>`).join('');
    $('mendCost').textContent = MEND_COST; $('mendBtn').disabled = SAVE.coins < MEND_COST;
    $('fail').classList.remove('hidden');
    if (AUTO) setTimeout(() => { if (!$('fail').classList.contains('hidden')) $('retryBtn').click(); }, 1600);
  }
  function nextLevel() { ensureAudio(); uiClick(); startLevel(SAVE.level, false); }
  function startGame() { ensureAudio(); uiClick(); menuOpen = false; $('menu').classList.add('hidden'); $('hud').classList.remove('hidden'); startLevel(SAVE.level, true); }
  function toMenu() { paused = false; hideOverlays(); menuOpen = true; $('menu').classList.remove('hidden'); $('hud').classList.add('hidden'); startDemo(); updateMenu(); }
  const VOLS = [[1, 'LOUD'], [.6, 'MEDIUM'], [.3, 'SOFT'], [0, 'OFF']];
  const volLabel = () => 'CHIMES: ' + (VOLS.find(v => v[0] === SAVE.vol) || VOLS[0])[1];
  function pause() {
    if (!G || G.attract || menuOpen || paused || G.hold) return;
    if (G.phase === 'levelWin' || G.phase === 'shatter') return;
    paused = true; $('pauseSub').textContent = (G.L.boss ? 'Boss song' : 'Level ' + G.n) + ' · ' + chapterName(G.L) + ' · phrase ' + (G.round + 1) + '/' + G.L.lens.length;
    $('volBtn').textContent = volLabel(); $('pause').classList.remove('hidden');
  }
  function resume() {
    if (!paused) return; paused = false; $('pause').classList.add('hidden'); last = performance.now();
    if (['show', 'tuning', 'move'].includes(G.phase) || (G.phase === 'answer' && hasTw(G.L, 'rhythm'))) beginRound(true);
  }
  $('startBtn').onclick = startGame;
  $('nextBtn').onclick = nextLevel;
  $('winMenu').onclick = () => { uiClick(); toMenu(); };
  $('failMenu').onclick = () => { uiClick(); toMenu(); };
  $('retryBtn').onclick = () => { uiClick(); SAVE.prog = null; startLevel(G.n, false); };
  $('mendBtn').onclick = () => {
    if (SAVE.coins < MEND_COST) return; SAVE.coins -= MEND_COST; updateCoins(); uiClick();
    G.lives = 1; G.shatter = 0; G.cracks = G.cracks.slice(0, 2); hideOverlays(); updateHud();
    sparkle(LY.cx, LY.cy, { n: 30, colors: ['#ffffff', '#8ae8ff', '#c8b0ff'], speed: 220, gravity: 0, size: 6, life: 1 }); FX.ring(LY.cx, LY.cy, { r0: LY.orbR * 2, r1: LY.orbR * .8, color: '#bff4ff', width: 5, life: .5 });
    sfx(660, .5, 'sine', .06, 1320); beginRound(true);
  };
  $('resumeBtn').onclick = () => { uiClick(); resume(); };
  $('restartBtn').onclick = () => { uiClick(); paused = false; SAVE.prog = null; startLevel(G.n, false); };
  $('pMenuBtn').onclick = () => { uiClick(); saveProg(); toMenu(); };
  $('volBtn').onclick = () => { const i = VOLS.findIndex(v => v[0] === SAVE.vol); SAVE.vol = VOLS[(i + 1) % VOLS.length][0]; saveNow(); $('volBtn').textContent = volLabel(); if (G) chimeRaw(7, 1, SAVE.skin); };
  $('pauseBtn').onclick = () => { uiClick(); pause(); };
  $('replayBtn').onclick = e => { e.stopPropagation(); replay(); };
  $('journeyBtn').onclick = openJourney;
  $('jClose').onclick = $('jX').onclick = () => { uiClick(); $('journey').classList.add('hidden'); updateMenu(); };
  cv.addEventListener('pointerdown', e => {
    if (!G || menuOpen || paused || G.attract || G.hold) return;
    e.preventDefault(); ensureAudio();
    if (G.phase === 'intro' && G.pt > .5) { G.pt = G.introDur; return; }
    const pid = hitPad(e.clientX, e.clientY); if (pid >= 0) tapPid(pid, false);
  });
  addEventListener('keydown', e => {
    if (e.repeat) return;
    if (menuOpen) { if ((e.code === 'Enter' || e.code === 'Space') && $('journey').classList.contains('hidden')) { e.preventDefault(); startGame(); } return; }
    if (e.code === 'Escape' || e.code === 'KeyP') { paused ? resume() : pause(); return; }
    if (!$('win').classList.contains('hidden')) { if (e.code === 'Enter' || e.code === 'Space') nextLevel(); return; }
    if (paused || !G) return;
    const d = parseInt(e.key, 10); if (d >= 1 && d <= G.L.N) { ensureAudio(); tapPid(padAtSlot(d - 1), false); }
    if (e.code === 'Space' || e.code === 'KeyR') { e.preventDefault(); replay(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  addEventListener('resize', resize);

  // ---------- test hook ----------
  window.__ec = {
    state: () => G && ({ phase: G.phase, level: G.n, round: G.round, rounds: G.L.lens.length, lives: G.lives, N: G.L.N, twists: G.L.tw.slice(), boss: G.L.boss, name: G.L.name, attract: G.attract, menu: menuOpen, paused, hold: G.hold,
      coins: SAVE.coins, expected: G.ans ? G.ans.E.slice(G.ans.idx).map(s => s.p.slice()) : null, idx: G.ans ? G.ans.idx : 0, len: G.ans ? G.ans.E.length : 0, chapter: chapterName(G.L), skin: SAVE.skin, streak: SAVE.streak,
      mistakes: G.mistakes, replays: G.replays, status: G.status, save: JSON.parse(JSON.stringify(SAVE)) }),
    start: startGame,
    level: n => { menuOpen = false; hideOverlays(); $('menu').classList.add('hidden'); $('hud').classList.remove('hidden'); SAVE.level = n; SAVE.best = Math.max(SAVE.best, n); SAVE.prog = null; saveNow(); startLevel(n, false); },
    autopilot: (on = true, err = 0) => { AUTO = on ? { err } : null; if (G && !G.attract) { G.bot = AUTO ? { err, q: null, t: 0 } : null; if (G.bot && G.phase === 'answer') botPlan(); if (G.hold && AUTO) { hideOverlays(); G.hold = false; } } },
    coins: n => { SAVE.coins += n; saveNow(); updateMenu(); },
    unlockAll: () => { SAVE.skins = [0, 1, 2, 3]; saveNow(); updateMenu(); },
    skin: i => { if (!SAVE.skins.includes(i)) SAVE.skins.push(i); SAVE.skin = i; saveNow(); updateMenu(); },
    winNow: () => { if (G && !G.attract) { G.round = G.L.lens.length - 1; levelWin(); } },
    failNow: () => { if (G && !G.attract) { G.lives = 1; if (!G.ans) G.ans = newAnswer(G.L, G.round); G.phase = 'answer'; mistake(0, 'wrong'); } },
    gen: genLevel, verifyLevel,
    verify: (a = 1, b = 200) => {
      const errors = [], st = { N: {}, tw: {}, boss: 0, maxLen: 0, avgLen: 0, combos: 0 };
      for (let n = a; n <= b; n++) { let L; try { L = genLevel(n); } catch (e) { errors.push(n + ': throw ' + e.message); continue; } const e = verifyLevel(L); if (e.length) errors.push(n + ': ' + e.join(',')); st.N[L.N] = (st.N[L.N] || 0) + 1; L.tw.forEach(k => { st.tw[k] = (st.tw[k] || 0) + 1; }); if (L.tw.length > 1) st.combos++; if (L.boss) st.boss++; const fl = L.lens[L.lens.length - 1]; st.maxLen = Math.max(st.maxLen, fl); st.avgLen += fl / (b - a + 1); }
      st.avgLen = +st.avgLen.toFixed(2); return { ok: !errors.length, errors: errors.slice(0, 20), stats: st };
    },
    padXY: pid => { const p = padPos(pid); return { x: p.x, y: p.y }; },
    tap: pid => tapPid(pid, false), replay, pause, resume, menu: toMenu,
    fps: () => FPS
  };

  // ---------- boot ----------
  let fpsAcc = 0, fpsN = 0;
  function loop(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    if (dt > 0) { fpsAcc += dt; fpsN++; if (fpsAcc > .5) { FPS = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; } }
    if (!paused) update(dt);
    render(); syncUi();
    requestAnimationFrame(loop);
  }
  buildSkins(); updateCoins(); resize();
  loadArt().then(() => { startDemo(); resize(); updateMenu(); last = performance.now(); requestAnimationFrame(loop); });
})();
</script>
