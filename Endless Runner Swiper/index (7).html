<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b120c">
<title>Ruins Run</title>
<style>
  :root {
    --sand: #f3d9a4;
    --gold: #ffc23d;
    --ember: #ff7a2f;
    --moss: #3f6b3a;
    --night: #1b120c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--night);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--sand);
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: max(12px, env(safe-area-inset-top)) 16px 0;
    pointer-events: none;
    font-weight: bold; letter-spacing: 1px;
    text-shadow: 0 2px 0 #000a;
  }
  .hud .score { font-size: 28px; color: #fff4dc; }
  .hud .coins { font-size: 20px; color: var(--gold); }
  .hud .coins::before { content: "◆ "; }
  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse at center, #1b120ccc 0%, #1b120cf2 70%);
    transition: opacity .3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 {
    font-size: clamp(42px, 12vw, 76px); line-height: .95;
    color: var(--gold);
    text-shadow: 0 4px 0 #8a3b12, 0 10px 24px #000;
    letter-spacing: 3px;
  }
  .overlay h1 small { display: block; font-size: .38em; color: var(--sand); letter-spacing: 8px; margin-top: 8px; text-shadow: none; }
  .overlay p { max-width: 340px; line-height: 1.5; opacity: .9; }
  .overlay .stats { font-size: 20px; color: #fff4dc; }
  .overlay .stats b { color: var(--gold); }
  .btn {
    border: none; cursor: pointer;
    padding: 16px 44px; border-radius: 6px;
    font-family: inherit; font-weight: bold; font-size: 22px; letter-spacing: 3px;
    color: var(--night);
    background: linear-gradient(#ffd66b, #f29a1d);
    box-shadow: 0 5px 0 #8a3b12, 0 10px 20px #0008;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a3b12; }
  .keys { font-size: 13px; opacity: .6; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="score" id="score">0</div>
  <div class="coins" id="coins">0</div>
</div>

<div class="overlay" id="menu">
  <h1>RUINS<br>RUN<small>ESCAPE THE TEMPLE</small></h1>
  <p>Swipe <b>left / right</b> to switch lanes, <b>up</b> to jump over stones, <b>down</b> to slide under beams. Grab the golden relics!</p>
  <div class="stats" id="bestMenu"></div>
  <button class="btn" id="startBtn">RUN</button>
  <div class="keys">Keyboard: ← → ↑ ↓ / WASD</div>
</div>

<div class="overlay hidden" id="over">
  <h1>CAUGHT!</h1>
  <div class="stats">Distance <b id="finalScore">0</b></div>
  <div class="stats">Relics <b id="finalCoins">0</b></div>
  <div class="stats" id="bestOver"></div>
  <button class="btn" id="againBtn">AGAIN</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---------- storage ----------
  const BEST_KEY = 'ruins_run_best';
  const loadBest = () => { try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; } };
  const saveBest = v => { try { localStorage.setItem(BEST_KEY, v); } catch (e) {} };
  let best = loadBest();

  // ---------- audio: procedural music + sound effects ----------
  const audio = GameAudio({
    bpm: 116, scale: 'phrygian', root: 50, prog: [0, 1, 0, 6], seed: 13,
    waves: { lead: 'sawtooth', bass: 'triangle', arp: 'triangle' },
    arp: true, arpEvery: 2, arpOct: 1, leadCutoff: 1600, leadOct: 1, drums: 'busy', bassPattern: [0, 3, 6, 8, 11], volume: 0.14,
    btnBg: 'rgba(27,18,12,.6)', btnColor: '#ffc23d'
  });
  function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    audio.sfx(freq, dur, type, vol, slide ? Math.max(40, freq + slide) : 0);
  }

  // ---------- view / projection ----------
  let W, H, DPR, cx, horizon, focal, laneW, roadHalf;
  const CAM_H = 2.8;      // camera height (world units)
  const PLAYER_Z = 2.6;   // distance from camera to player
  const FAR = 70;
  const NEAR = 0.5;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    horizon = H * 0.3;
    focal = (H * 0.84 - horizon) * PLAYER_Z / CAM_H;
    const screenHalf = Math.min(W * 0.46, H * 0.36);
    roadHalf = screenHalf * PLAYER_Z / focal;
    laneW = roadHalf * 2 / 3;
  }
  window.addEventListener('resize', resize);
  resize();

  const proj = (x, y, z) => {
    const s = focal / z;
    return { x: cx + x * s, y: horizon + (CAM_H - y) * s, s };
  };

  // ---------- game state ----------
  let state = 'menu';
  let speed, dist, coins, objects, spawnZ, t, shake;
  let player;
  let particles = [];

  function reset() {
    speed = 11; dist = 0; coins = 0; t = 0; shake = 0;
    objects = []; particles = [];
    spawnZ = 26;
    player = { lane: 0, x: 0, y: 0, vy: 0, slide: 0, run: 0, dead: false };
  }
  reset();

  const laneX = l => l * laneW;

  // Obstacles: stone (jump), beam (slide), wall (switch lane), relic (collect)
  function spawnRow(z) {
    const lanes = [-1, 0, 1];
    const free = lanes[Math.floor(Math.random() * 3)];
    const difficulty = Math.min(1, dist / 1500);
    for (const l of lanes) {
      if (l === free) continue;
      const r = Math.random();
      if (r < 0.35 - difficulty * 0.1) continue;
      let type;
      const k = Math.random();
      if (k < 0.38) type = 'stone';
      else if (k < 0.7) type = 'beam';
      else type = 'wall';
      objects.push({ type, lane: l, z });
    }
    // relics along the free lane, sometimes in an arc over a stone
    const n = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      objects.push({ type: 'relic', lane: free, z: z + 2 + i * 1.6, y: 0.5, taken: false });
    }
  }

  function crash() {
    if (player.dead) return;
    player.dead = true;
    shake = 14;
    beep(140, 0.5, 'sawtooth', 0.1, -100);
    if (navigator.vibrate) try { navigator.vibrate(150); } catch (e) {}
    for (let i = 0; i < 26; i++) {
      particles.push({
        x: cx + (Math.random() - .5) * 20, y: H * 0.8,
        vx: (Math.random() - .5) * 420, vy: -Math.random() * 420,
        life: 1, col: Math.random() < .5 ? '#ffc23d' : '#c9a46a', r: 3 + Math.random() * 4
      });
    }
    setTimeout(gameOver, 700);
  }

  function gameOver() {
    state = 'over';
    const s = Math.floor(dist);
    if (s > best) { best = s; saveBest(best); }
    $('finalScore').textContent = s + ' m';
    $('finalCoins').textContent = coins;
    $('bestOver').innerHTML = 'Best <b>' + best + ' m</b>';
    $('over').classList.remove('hidden');
  }

  function start() {
    reset();
    state = 'play';
    $('menu').classList.add('hidden');
    $('over').classList.add('hidden');
    audio.start();
    beep(440, 0.12, 'triangle', 0.08, 300);
  }

  // ---------- input ----------
  function act(dir) {
    if (state !== 'play' || player.dead) return;
    if (dir === 'left' && player.lane > -1) { player.lane--; beep(330, 0.06, 'triangle'); }
    if (dir === 'right' && player.lane < 1) { player.lane++; beep(330, 0.06, 'triangle'); }
    if (dir === 'up' && player.y <= 0.001) { player.vy = 7.2; player.slide = 0; beep(520, 0.12, 'square', 0.05, 260); }
    if (dir === 'down') {
      if (player.y > 0.001) player.vy = -12;
      player.slide = 0.7;
      beep(200, 0.1, 'triangle', 0.06, -80);
    }
  }

  let sx = 0, sy = 0, swiping = false;
  canvas.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; swiping = true; });
  canvas.addEventListener('pointermove', e => {
    if (!swiping) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.hypot(dx, dy) > 28) {
      swiping = false;
      if (Math.abs(dx) > Math.abs(dy)) act(dx > 0 ? 'right' : 'left');
      else act(dy > 0 ? 'down' : 'up');
    }
  });
  window.addEventListener('pointerup', () => { swiping = false; });
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (state !== 'play' && (k === 'Enter' || k === ' ')) { start(); return; }
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') act('left');
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') act('right');
    else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') act('up');
    else if (k === 'ArrowDown' || k === 's' || k === 'S') act('down');
    else return;
    e.preventDefault();
  });
  $('startBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);
  $('bestMenu').innerHTML = best ? 'Best <b>' + best + ' m</b>' : '';

  // ---------- update ----------
  function update(dt) {
    t += dt;
    if (state === 'play' && !player.dead) {
      speed = Math.min(30, 11 + dist / 120);
      const dz = speed * dt;
      dist += dz;

      // player physics
      player.x += (laneX(player.lane) - player.x) * Math.min(1, dt * 16);
      player.vy -= 22 * dt;
      player.y += player.vy * dt;
      if (player.y < 0) { player.y = 0; player.vy = 0; }
      if (player.slide > 0) player.slide -= dt;
      player.run += dt * speed * 0.9;

      // move world
      for (const o of objects) o.z -= dz;
      spawnZ -= dz;
      while (spawnZ < FAR) {
        spawnRow(spawnZ);
        spawnZ += Math.max(9, 15 - dist / 300) + Math.random() * 4;
      }

      // collisions
      const pLane = Math.round(player.x / laneW);
      const height = player.slide > 0 ? 0.55 : 1.25;
      for (const o of objects) {
        if (Math.abs(o.z - PLAYER_Z) > 0.45) continue;
        if (o.lane !== pLane || Math.abs(player.x - laneX(o.lane)) > laneW * 0.55) continue;
        if (o.type === 'relic') {
          if (!o.taken) {
            o.taken = true; coins++;
            beep(880 + (coins % 5) * 80, 0.08, 'sine', 0.07);
            const p = proj(laneX(o.lane), o.y, o.z);
            for (let i = 0; i < 8; i++) particles.push({ x: p.x, y: p.y, vx: (Math.random() - .5) * 200, vy: -Math.random() * 200, life: .6, col: '#ffe08a', r: 2.5 });
          }
        } else if (o.type === 'stone') {
          if (player.y < 0.62) crash();
        } else if (o.type === 'beam') {
          if (player.y + height > 0.85) crash();
        } else if (o.type === 'wall') {
          crash();
        }
      }
      objects = objects.filter(o => o.z > NEAR && !(o.type === 'relic' && o.taken));
    }
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    if (shake > 0) shake = Math.max(0, shake - dt * 30);
  }

  // ---------- render ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, '#2a1640');
    g.addColorStop(0.55, '#b4452f');
    g.addColorStop(1, '#ffb45a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, horizon + 2);
    // sun
    const sunR = Math.min(W, H) * 0.11;
    const sg = ctx.createRadialGradient(cx, horizon - sunR * 0.3, 0, cx, horizon - sunR * 0.3, sunR * 2.4);
    sg.addColorStop(0, '#fff2b0'); sg.addColorStop(0.35, '#ffcf6699'); sg.addColorStop(1, '#ffcf6600');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, horizon);
    ctx.fillStyle = '#fff0b8';
    ctx.beginPath(); ctx.arc(cx, horizon - sunR * 0.3, sunR, 0, Math.PI * 2); ctx.fill();
    // distant temple and mountains
    const off = (dist * 0.4) % W;
    ctx.fillStyle = '#5b2a2e';
    ctx.beginPath(); ctx.moveTo(0, horizon);
    for (let x = 0; x <= W + 40; x += 40) {
      const h = 40 + Math.sin((x + off) * 0.012) * 22 + Math.sin((x + off) * 0.031) * 12;
      ctx.lineTo(x, horizon - h * (H / 800));
    }
    ctx.lineTo(W, horizon); ctx.fill();
    // stepped pyramid
    ctx.fillStyle = '#3d1c24';
    const pw = Math.min(W, H) * 0.42, ph = pw * 0.12;
    for (let i = 0; i < 5; i++) {
      const w = pw * (1 - i * 0.17);
      ctx.fillRect(cx - w / 2, horizon - ph * (i + 1), w, ph + 1);
    }
    ctx.fillRect(cx - pw * 0.08, horizon - ph * 6.2, pw * 0.16, ph * 1.3);
    // jungle line
    ctx.fillStyle = '#22301d';
    ctx.beginPath(); ctx.moveTo(0, horizon + 2);
    for (let x = 0; x <= W + 20; x += 18) {
      ctx.lineTo(x, horizon - 6 - Math.abs(Math.sin((x + off * 2) * 0.09)) * 14);
    }
    ctx.lineTo(W, horizon + 2); ctx.fill();
  }

  function drawGround() {
    // jungle floor
    const g = ctx.createLinearGradient(0, horizon, 0, H);
    g.addColorStop(0, '#1f2e1a'); g.addColorStop(1, '#2f4a25');
    ctx.fillStyle = g;
    ctx.fillRect(0, horizon, W, H - horizon);

    // road segments
    const seg = 2;
    let z = FAR - ((FAR + dist) % seg);
    while (z > NEAR) {
      const z2 = Math.max(NEAR, z - seg);
      const a = proj(-roadHalf, 0, z), b = proj(roadHalf, 0, z);
      const c = proj(roadHalf, 0, z2), d = proj(-roadHalf, 0, z2);
      const fog = Math.min(1, z / FAR);
      const even = Math.floor((z - seg / 2 + dist) / seg) % 2 === 0;
      const base = even ? [196, 160, 106] : [176, 140, 90];
      const col = base.map((v, i) => Math.round(v * (1 - fog * 0.55) + [90, 50, 40][i] * fog * 0.55));
      ctx.fillStyle = 'rgb(' + col.join(',') + ')';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.fill();
      // brick seams
      ctx.strokeStyle = 'rgba(70,40,20,' + (0.35 * (1 - fog)) + ')';
      ctx.lineWidth = Math.max(1, focal / z * 0.03);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      z = z2;
    }
    // lane dividers
    ctx.strokeStyle = 'rgba(80,45,20,0.35)';
    for (const lx of [-laneW / 2, laneW / 2]) {
      const p1 = proj(lx, 0, FAR), p2 = proj(lx, 0, NEAR);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }
    // road edges (stone curbs)
    for (const side of [-1, 1]) {
      const p1 = proj(side * roadHalf, 0, FAR), p2 = proj(side * roadHalf, 0, NEAR);
      const p3 = proj(side * (roadHalf + 0.25), 0, NEAR), p4 = proj(side * (roadHalf + 0.25), 0, FAR);
      ctx.fillStyle = '#6e5238';
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.fill();
    }
  }

  function box(x, y0, y1, z, hw, depth, front, top, side) {
    // simple 3D box: front face at z, back at z+depth
    const f0 = proj(x - hw, y0, z), f1 = proj(x + hw, y1, z);
    const b0 = proj(x - hw, y1, z + depth), b1 = proj(x + hw, y1, z + depth);
    // top
    ctx.fillStyle = top;
    ctx.beginPath(); ctx.moveTo(f0.x, f1.y); ctx.lineTo(f1.x, f1.y); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b0.x, b0.y); ctx.fill();
    // side facing center
    const bb0 = proj(x - hw, y0, z + depth), bb1 = proj(x + hw, y0, z + depth);
    ctx.fillStyle = side;
    if (x > 0.01) { ctx.beginPath(); ctx.moveTo(f0.x, f0.y); ctx.lineTo(f0.x, f1.y); ctx.lineTo(b0.x, b0.y); ctx.lineTo(bb0.x, bb0.y); ctx.fill(); }
    else if (x < -0.01) { ctx.beginPath(); ctx.moveTo(f1.x, f0.y); ctx.lineTo(f1.x, f1.y); ctx.lineTo(b1.x, b1.y); ctx.lineTo(bb1.x, bb1.y); ctx.fill(); }
    // front
    ctx.fillStyle = front;
    ctx.fillRect(f0.x, f1.y, f1.x - f0.x, f0.y - f1.y);
    return { x: f0.x, y: f1.y, w: f1.x - f0.x, h: f0.y - f1.y };
  }

  function drawObject(o) {
    const x = laneX(o.lane);
    const hw = laneW * 0.42;
    const s = focal / o.z;
    if (o.type === 'stone') {
      const r = box(x, 0, 0.5, o.z, hw, 0.6, '#8a7a66', '#b3a48c', '#6a5c4c');
      ctx.fillStyle = 'rgba(40,30,20,.35)';
      ctx.fillRect(r.x + r.w * 0.1, r.y + r.h * 0.45, r.w * 0.8, Math.max(1, s * 0.03));
    } else if (o.type === 'beam') {
      // two posts + wooden beam
      const pw = 0.08;
      box(x - hw + pw, 0, 1.6, o.z, pw, 0.15, '#5a3a22', '#7a5434', '#432a18');
      box(x + hw - pw, 0, 1.6, o.z, pw, 0.15, '#5a3a22', '#7a5434', '#432a18');
      const r = box(x, 0.88, 1.5, o.z, hw, 0.25, '#9c6a3a', '#c48b4f', '#6e4826');
      // carved glyph
      ctx.fillStyle = '#ffc23d';
      ctx.beginPath(); ctx.arc(r.x + r.w / 2, r.y + r.h / 2, r.h * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#6e4826';
      ctx.beginPath(); ctx.arc(r.x + r.w / 2, r.y + r.h / 2, r.h * 0.1, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'wall') {
      const r = box(x, 0, 1.9, o.z, hw, 0.8, '#5e6b52', '#7c8a6c', '#46513c');
      // moss + carved face
      ctx.fillStyle = '#3f6b3a';
      ctx.fillRect(r.x, r.y, r.w, r.h * 0.08);
      ctx.fillStyle = 'rgba(25,30,20,.55)';
      const ex = r.w * 0.16;
      ctx.fillRect(r.x + r.w * 0.25 - ex / 2, r.y + r.h * 0.3, ex, ex * 0.7);
      ctx.fillRect(r.x + r.w * 0.75 - ex / 2, r.y + r.h * 0.3, ex, ex * 0.7);
      ctx.fillRect(r.x + r.w * 0.3, r.y + r.h * 0.6, r.w * 0.4, ex * 0.5);
    } else if (o.type === 'relic') {
      const bob = Math.sin(t * 5 + o.z) * 0.08;
      const p = proj(x, o.y + bob, o.z);
      const r = 0.18 * s;
      const spin = Math.abs(Math.cos(t * 4 + o.z));
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(0.35 + spin * 0.65, 1);
      ctx.fillStyle = '#ffc23d';
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.8, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 0.8, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff3b5';
      ctx.beginPath(); ctx.moveTo(0, -r * 0.6); ctx.lineTo(r * 0.35, 0); ctx.lineTo(0, r * 0.2); ctx.lineTo(-r * 0.35, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function drawPillars() {
    // repeating ruined pillars and torches on both sides
    const spacing = 7;
    const first = Math.ceil(dist / spacing) * spacing;
    const list = [];
    for (let wz = first; wz - dist < FAR; wz += spacing) list.push(wz - dist);
    list.reverse();
    return list;
  }

  function drawSide(z, i) {
    for (const side of [-1, 1]) {
      const x = side * (roadHalf + 0.9);
      const broken = ((Math.floor((z + dist) / 7) + (side > 0 ? 1 : 0)) % 3) === 0;
      const h = broken ? 1.4 : 3.2;
      box(x, 0, h, z, 0.35, 0.5, '#7d6a52', '#9c8667', '#5b4b39');
      if (!broken) {
        // torch flame
        const p = proj(x - side * 0.36, 2.2, z);
        const s = focal / z;
        const fl = 0.12 * s * (1 + Math.sin(t * 20 + z) * 0.15);
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, fl * 4);
        g.addColorStop(0, '#ffdd88cc'); g.addColorStop(1, '#ff7a2f00');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, fl * 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb347';
        ctx.beginPath(); ctx.ellipse(p.x, p.y, fl * 0.6, fl, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        // vines on broken pillar
        const p = proj(x, h, z);
        const s = focal / z;
        ctx.fillStyle = '#3f6b3a';
        ctx.beginPath(); ctx.ellipse(p.x, p.y, 0.45 * s, 0.18 * s, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawPlayer() {
    const p = proj(player.x, player.y, PLAYER_Z);
    const s = focal / PLAYER_Z;
    const sliding = player.slide > 0 && player.y < 0.05;
    // shadow
    const sh = proj(player.x, 0, PLAYER_Z);
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(sh.x, sh.y, 0.3 * s * (1 - Math.min(.5, player.y * .3)), 0.07 * s, 0, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.translate(p.x, p.y);
    const u = s / 115; // 1 world unit = 115 drawing units
    ctx.scale(u, u);
    if (player.dead) ctx.rotate(-0.6);

    if (sliding) {
      // sliding pose: low and stretched
      ctx.fillStyle = '#4a3020';
      ctx.fillRect(-36, -14, 30, 12); // legs forward
      ctx.fillStyle = '#c87a3a';
      ctx.beginPath(); ctx.ellipse(4, -26, 26, 16, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f0c49a';
      ctx.beginPath(); ctx.arc(24, -44, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7a4a22';
      ctx.fillRect(10, -56, 30, 6);
      ctx.fillRect(16, -66, 18, 12);
    } else {
      const leg = Math.sin(player.run * 2.2) * (player.y > 0.01 ? 0.3 : 1);
      // legs
      ctx.fillStyle = '#4a3020';
      ctx.save(); ctx.translate(-8, -48); ctx.rotate(leg * 0.6); ctx.fillRect(-6, 0, 12, 48); ctx.restore();
      ctx.save(); ctx.translate(8, -48); ctx.rotate(-leg * 0.6); ctx.fillRect(-6, 0, 12, 48); ctx.restore();
      // backpack
      ctx.fillStyle = '#6b8a3a';
      ctx.fillRect(-20, -100, 40, 40);
      // body
      ctx.fillStyle = '#c87a3a';
      ctx.fillRect(-18, -98, 36, 54);
      ctx.fillStyle = '#8a4d22';
      ctx.fillRect(-18, -56, 36, 8);
      // arms
      ctx.fillStyle = '#f0c49a';
      ctx.save(); ctx.translate(-20, -92); ctx.rotate(-leg * 0.8); ctx.fillRect(-5, 0, 10, 36); ctx.restore();
      ctx.save(); ctx.translate(20, -92); ctx.rotate(leg * 0.8); ctx.fillRect(-5, 0, 10, 36); ctx.restore();
      // head (seen from behind)
      ctx.fillStyle = '#5a3a24';
      ctx.beginPath(); ctx.arc(0, -114, 15, 0, Math.PI * 2); ctx.fill();
      // hat
      ctx.fillStyle = '#7a4a22';
      ctx.beginPath(); ctx.ellipse(0, -124, 28, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-15, -142, 30, 18);
      ctx.fillStyle = '#3a2412';
      ctx.fillRect(-15, -130, 30, 4);
    }
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawSky();
    drawGround();

    // gather drawables: side pillars + objects, sort far -> near
    const items = [];
    for (const z of drawPillars()) if (z > NEAR + 0.3) items.push({ z: z, side: true });
    for (const o of objects) items.push({ z: o.z, o });
    items.sort((a, b) => b.z - a.z);
    let playerDrawn = false;
    for (const it of items) {
      if (!playerDrawn && it.z < PLAYER_Z - 0.3) { drawPlayer(); playerDrawn = true; }
      if (it.side) drawSide(it.z); else drawObject(it.o);
    }
    if (!playerDrawn) drawPlayer();

    // fog near horizon
    const fg = ctx.createLinearGradient(0, horizon - 2, 0, horizon + H * 0.12);
    fg.addColorStop(0, 'rgba(255,170,90,.45)'); fg.addColorStop(1, 'rgba(255,170,90,0)');
    ctx.fillStyle = fg; ctx.fillRect(0, horizon - 2, W, H * 0.12);

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // vignette
    const vg = ctx.createRadialGradient(cx, H * 0.6, Math.min(W, H) * 0.3, cx, H * 0.6, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,5,0,.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.restore();

    $('score').textContent = Math.floor(dist) + ' m';
    $('coins').textContent = coins;
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000));
    last = now;
    if (state === 'menu') { dist += dt * 6; }
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
