<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d1b4e">
<title>Jelly Stack</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2d1b4e;
    font-family: "Arial Rounded MT Bold", "Nunito", "Segoe UI", sans-serif; color: #fff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; }
  .hud b { font-size: 50px; text-shadow: 0 4px 0 #ff4fa3; }
  .hud div { font-size: 16px; color: #8affc1; min-height: 20px; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;
    background: #2d1b4ed9; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  h1 { font-size: clamp(46px, 14vw, 84px); line-height: .9; }
  h1 span { display: inline-block; animation: wob 1.2s ease-in-out infinite; }
  h1 span:nth-child(2n) { animation-delay: .15s; color: #ff4fa3; } h1 span:nth-child(3n) { animation-delay: .3s; color: #8affc1; } h1 span:nth-child(5n) { color: #ffd84f; }
  @keyframes wob { 0%,100% { transform: scale(1,1); } 30% { transform: scale(1.15,.85); } 60% { transform: scale(.92,1.08); } }
  p { max-width: 300px; font-size: 16px; line-height: 1.5; color: #d9c8ff; }
  .stat { font-size: 20px; } .stat b { color: #ffd84f; }
  .btn { border: none; background: #8affc1; color: #2d1b4e; font: inherit; font-size: 24px; padding: 14px 46px; border-radius: 22px; cursor: pointer;
    box-shadow: inset 0 -6px 0 #3fcf88, 0 8px 20px #0005; }
  .btn:active { transform: scale(.95, 1.05); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b id="score"></b><div id="note"></div></div>

<div class="overlay" id="menu">
  <h1><span>J</span><span>E</span><span>L</span><span>L</span><span>Y</span><br><span>S</span><span>T</span><span>A</span><span>C</span><span>K</span></h1>
  <p>Tap to drop the jelly. It wobbles but it won't be trimmed — every sloppy drop shifts the tower's balance. Too much lean and the whole thing slops over!</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">WOBBLE!</button>
</div>
<div class="overlay hidden" id="over">
  <h1><span>S</span><span>P</span><span>L</span><span>O</span><span>S</span><span>H</span></h1>
  <div class="stat">JELLIES <b id="finalScore">0</b></div>
  <div class="stat">BEST <b id="bestOver">0</b></div>
  <button class="btn" id="againBtn">AGAIN</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const audio = GameAudio({
    bpm: 116, scale: 'pentaMajor', root: 62, prog: [0, 3, 2, 4], seed: 208,
    waves: { lead: 'sine', bass: 'sine', arp: 'triangle' },
    arp: true, arpEvery: 1, arpOct: 1, arpCutoff: 2000, leadOct: 1, leadDensity: 0.4, drums: 'soft', swing: 0.12, bassPattern: [0, 3, 8, 11], volume: 0.18,
    btnBg: 'rgba(255,79,163,.4)'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'jelly_stack_best';
  let best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const showBest = () => { $('bestMenu').innerHTML = best ? 'BEST <b>' + best + '</b>' : ''; }; showBest();

  let W, H, DPR, S, LW, LH;
  const JH = 38;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    S = Math.min(W / 400, H / 700); LW = W / S; LH = H / S;
  }
  addEventListener('resize', resize); resize();
  const COLS = ['#ff4fa3', '#8affc1', '#ffd84f', '#6fc7ff', '#c78bff', '#ff8a5c'];

  // stack[i] = { x, w, col, d (wobble offset), v (wobble velocity), sq (squash) }
  let state = 'menu', stack, cur, drop, camY, t = 0, topple = null, note = '', noteT = 0, combo = 0, drips = [];
  function reset() {
    stack = [{ x: 0, w: 170, col: '#ffffff', d: 0, v: 0, sq: 0, plate: true }];
    camY = 0; topple = null; combo = 0; drop = null; drips = [];
    spawn();
  }
  function spawn() {
    const n = stack.length, from = n % 2 ? -1 : 1;
    const w = Math.max(70, 140 - n * 1.5 + (Math.random() - 0.5) * 30);
    cur = { x: from * (LW / 2 + w / 2), w, col: COLS[n % COLS.length], dir: -from, speed: 150 + Math.min(230, n * 8) };
  }
  reset();
  const topY = () => stack.length * JH - (JH - 16);     // plate is thinner

  function start() { reset(); state = 'play'; audio.start(); $('menu').classList.add('hidden'); $('over').classList.add('hidden'); }
  function end() {
    if (state !== 'play') return;
    state = 'over';
    const s = stack.length - 1; if (s > best) { best = s; try { localStorage.setItem(KEY, best); } catch (e) {} }
    $('finalScore').textContent = s; $('bestOver').textContent = best; showBest();
    setTimeout(() => $('over').classList.remove('hidden'), 1300);
  }
  function release() {
    if (state !== 'play' || !cur || drop || topple) return;
    drop = Object.assign(cur, { y: topY() + 70, vy: 0 }); cur = null;
  }
  canvas.addEventListener('pointerdown', release);
  addEventListener('keydown', e => {
    if (e.key !== ' ' && e.key !== 'Enter') return; e.preventDefault();
    if (state === 'play') release(); else if (state === 'menu' || !$('over').classList.contains('hidden')) start();
  });
  $('startBtn').onclick = start; $('againBtn').onclick = start;

  function unstable() {
    for (let i = stack.length - 1; i >= 1; i--) {
      let m = 0, mx = 0;
      for (let j = i; j < stack.length; j++) { m += stack[j].w; mx += stack[j].w * stack[j].x; }
      const com = mx / m, b = stack[i - 1];
      if (Math.abs(com - b.x) > b.w / 2) return { i, side: Math.sign(com - b.x) };
    }
    return null;
  }

  function update(dt) {
    t += dt;
    if (cur) {
      cur.x += cur.dir * cur.speed * dt;
      const lim = LW / 2 - cur.w / 2 + 30;
      if (cur.x > lim) { cur.x = lim; cur.dir = -1; } else if (cur.x < -lim) { cur.x = -lim; cur.dir = 1; }
    }
    if (drop) {
      drop.vy -= 1600 * dt; drop.y += drop.vy * dt;
      if (drop.y <= topY()) {
        const top = stack[stack.length - 1], off = drop.x - top.x;
        const piece = { x: drop.x, w: drop.w, col: drop.col, d: 0, v: 0, sq: 0.35 };
        if (Math.abs(off) < 5) { piece.x = top.x; combo++; note = combo > 1 ? 'PERFECT ×' + combo : 'PERFECT'; noteT = 1; }
        else { combo = 0; piece.v = Math.sign(off) * Math.min(260, Math.abs(off) * 6); }
        stack.push(piece); drop = null;
        audio.sfx(220 + Math.min(20, stack.length) * 18, 0.25, 'sine', 0.09, combo ? 880 : 140);
        for (let i = 0; i < 6; i++) drips.push({ x: piece.x + (Math.random() - .5) * piece.w, y: topY(), vx: (Math.random() - .5) * 120, vy: Math.random() * 120, life: 0.6, col: piece.col });
        if (Math.abs(off) > (top.w / 2 + piece.w / 2) * 0.85) {
          topple = { i: stack.length - 1, side: Math.sign(off), ang: 0, av: 0, px: top.x + Math.sign(off) * top.w / 2, py: (stack.length - 1) * JH - (JH - 16) };
          audio.sfx(300, 0.8, 'sine', 0.08, 60);
        } else {
          const u = unstable();
          if (u) { const b = stack[u.i - 1]; topple = { i: u.i, side: u.side, ang: 0, av: 0, px: b.x + u.side * b.w / 2, py: u.i * JH - (JH - 16) }; audio.sfx(300, 0.8, 'sine', 0.08, 60); }
          else spawn();
        }
      }
    }
    // jelly wobble: each block springs back towards the one below
    for (let i = 1; i < stack.length; i++) {
      const s = stack[i], below = stack[i - 1].d;
      const a = -(s.d - below) * 160 - s.v * 4;
      s.v += a * dt; s.d += s.v * dt;
      s.sq = Math.max(0, s.sq - dt * 1.6);
    }
    if (topple) { topple.av += 3 * dt; topple.ang += topple.av * dt; if (topple.ang > 1.3) end(); }
    const target = Math.max(0, topY() - LH * 0.45);
    camY += (target - camY) * Math.min(1, dt * 3);
    noteT = Math.max(0, noteT - dt);
    for (const d of drips) { d.x += d.vx * dt; d.y -= d.vy * dt; d.vy -= 400 * dt; d.life -= dt; }
    drips = drips.filter(d => d.life > 0);
  }

  const sy = y => LH * 0.86 - (y - camY);
  function jelly(x, yBottom, w, col, skew, sq) {
    const h = JH * (1 - sq * 0.5), ww = w * (1 + sq * 0.3), top = sy(yBottom) - h;
    ctx.save();
    ctx.translate(x, sy(yBottom));
    ctx.transform(1, 0, -skew / h, 1, 0, 0);
    ctx.translate(-x, -sy(yBottom));
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = col;
    const r = 12;
    ctx.beginPath();
    ctx.moveTo(x - ww / 2 + r, top); ctx.lineTo(x + ww / 2 - r, top); ctx.quadraticCurveTo(x + ww / 2, top, x + ww / 2, top + r);
    ctx.lineTo(x + ww / 2, sy(yBottom)); ctx.lineTo(x - ww / 2, sy(yBottom)); ctx.lineTo(x - ww / 2, top + r); ctx.quadraticCurveTo(x - ww / 2, top, x - ww / 2 + r, top);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(x - ww * 0.25, top + 9, ww * 0.16, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(x + ww / 2 - 9, top + 10, 4, h - 18);
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(x - ww / 2, sy(yBottom) - 6, ww, 6);
    ctx.restore();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2d1b4e'); g.addColorStop(1, '#5b2d7a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.scale(S, S);
    // floating bubbles
    for (let i = 0; i < 24; i++) {
      const x = (i * 77.7) % LW, y = LH - ((i * 113 + t * (14 + i % 5 * 6)) % (LH + 40));
      ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 5 + i % 4 * 4, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.save(); ctx.translate(LW / 2, 0);
    // plate
    const pY = sy(0);
    ctx.fillStyle = '#e9e4f5'; ctx.beginPath(); ctx.ellipse(0, pY - 8, 120, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, pY - 12, 110, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d0c6ea'; ctx.fillRect(-30, pY - 4, 60, 30);
    for (let i = 1; i < stack.length; i++) {
      if (topple && i >= topple.i) continue;
      const s = stack[i];
      jelly(s.x + s.d, i * JH - (JH - 16), s.w, s.col, s.d - stack[i - 1].d, s.sq);
    }
    if (topple) {
      ctx.save(); ctx.translate(topple.px, sy(topple.py)); ctx.rotate(topple.side * topple.ang); ctx.translate(-topple.px, -sy(topple.py));
      for (let i = topple.i; i < stack.length; i++) jelly(stack[i].x, i * JH - (JH - 16), stack[i].w, stack[i].col, 0, 0);
      ctx.restore();
    }
    if (cur && state === 'play') { jelly(cur.x, topY() + 70, cur.w, cur.col, Math.sin(t * 8) * 4, 0); ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(cur.x - cur.w / 2, sy(topY()) - 3, cur.w, 3); }
    if (drop) jelly(drop.x, drop.y, drop.w, drop.col, 0, 0);
    for (const d of drips) { ctx.globalAlpha = Math.max(0, d.life * 1.6); ctx.fillStyle = d.col; ctx.beginPath(); ctx.arc(d.x, sy(d.y), 4, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.restore();
    $('score').textContent = state === 'menu' ? '' : stack.length - 1;
    $('note').textContent = noteT > 0 ? note : '';
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
