<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06140c">
<title>Free Kick</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06140c; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .sp { font-style: italic; font-weight: 900; }
  #menu { background: radial-gradient(ellipse at 50% 46%, rgba(3,16,9,0) 0%, rgba(3,16,9,.42) 52%, rgba(2,10,6,.9) 100%); }
  .titlebox { display: flex; flex-direction: column; align-items: center; }
  .title { font-size: clamp(44px, min(15.5vw, 11.5vh), 112px); line-height: .84; font-style: italic; font-weight: 900; letter-spacing: -1px; transform: skew(-7deg) rotate(-3deg);
    background: linear-gradient(180deg, #ffffff 0%, #f2ffd0 30%, #b8f43e 58%, #34b23e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #08381a) drop-shadow(0 0 26px rgba(170,255,80,.45)); padding: 0 .12em; }
  .title span { display: block; font-size: 1.08em; background: linear-gradient(180deg, #fffbe0 0%, #ffe46a 38%, #ffad1a 70%, #c8600a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 #5a2404); }
  .tag { margin-top: 10px; font-size: 12px; font-weight: 900; letter-spacing: .5em; color: #e8ffd8; text-shadow: 0 2px 6px #000; }
  .shop { width: min(330px, 92vw); padding: 10px 12px 12px; border-radius: 18px; background: linear-gradient(160deg, rgba(20,60,34,.82), rgba(6,24,14,.9)); border: 1px solid rgba(190,255,140,.28);
    box-shadow: 0 14px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 6px; }
  .tabs button { flex: 1; border: none; border-radius: 10px; padding: 7px 0; font: italic 900 13px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 2px; color: #bfe8b0; background: rgba(0,0,0,.32); cursor: pointer; }
  .tabs button.on { color: #10300c; background: linear-gradient(180deg, #e8ff8a, #9be03a); box-shadow: 0 3px 0 #2e6a12; }
  .row { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .arrow { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 2px solid rgba(200,255,150,.55); background: rgba(0,0,0,.35); color: #e8ffc8; font-size: 17px; font-weight: 900; cursor: pointer; }
  .card { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .card canvas { width: 132px; height: 132px; display: block; }
  .nm { font: italic 900 19px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 1px; color: #fff; text-shadow: 0 2px 0 #062a10; margin-top: -2px; }
  .stats { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; margin: 6px 0 2px; font-size: 10px; font-weight: 900; letter-spacing: 1.5px; color: #bfe0b0; text-align: left; }
  .bar { height: 7px; border-radius: 4px; background: rgba(0,0,0,.45); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #7ad83a, #e8ff6a); }
  .buy { margin-top: 8px; width: 100%; border: none; border-radius: 12px; padding: 9px 0; font: italic 900 16px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 2px; cursor: pointer; color: #2a1a00;
    background: linear-gradient(180deg, #fff3a0, #ffc21a 60%, #e0860a); box-shadow: 0 4px 0 #7a3a04; }
  .buy.eq { color: #d8ffd0; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 2px rgba(160,255,120,.5); }
  .buy.no { color: #ffd8c8; background: rgba(60,10,10,.55); box-shadow: inset 0 0 0 2px rgba(255,120,100,.4); }
  .coins { font: italic 900 18px "Avenir Next", "Trebuchet MS", sans-serif; color: #ffe46a; text-shadow: 0 2px 0 #4a2a00, 0 0 12px rgba(255,200,40,.5); }
  .btn { white-space: nowrap; border: none; padding: 13px 64px; border-radius: 40px; font: italic 900 30px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 5px; color: #0c2a06; cursor: pointer;
    background: linear-gradient(180deg, #f6ffb0 0%, #c4f43a 45%, #5cc21e 100%); box-shadow: 0 6px 0 #1e5a0a, 0 0 30px rgba(190,255,70,.5), inset 0 2px 0 rgba(255,255,255,.7); animation: pulse 1.5s ease-in-out infinite; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1e5a0a; }
  .btn2 { border: 2px solid rgba(220,255,190,.6); padding: 8px 30px; border-radius: 30px; background: rgba(0,0,0,.35); color: #e8ffd8; font: italic 900 15px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 3px; cursor: pointer; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #1e5a0a, 0 0 50px rgba(200,255,90,.85), inset 0 2px 0 rgba(255,255,255,.7); } }
  .hint { font-size: 12px; letter-spacing: .5px; color: #d8f0d0; max-width: 520px; text-shadow: 0 1px 3px #000; line-height: 1.45; }
  .stat { font-size: 14px; color: #e8f8e0; text-shadow: 0 1px 3px #000; } .stat b { color: #e8ff6a; }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(10,40,22,.66), rgba(2,10,6,.93)); }
  #againBtn { padding: 12px 44px; font-size: 26px; letter-spacing: 4px; }
  #over h2 { font: italic 900 clamp(48px, 13vw, 92px) "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 2px; transform: skew(-7deg) rotate(-2deg); line-height: .9;
    background: linear-gradient(180deg, #ffffff, #c8f45a 60%, #3aa83a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #08381a) drop-shadow(0 0 22px rgba(160,255,80,.4)); padding: 0 .1em; }
  #overScore { font: italic 900 54px "Avenir Next", "Trebuchet MS", sans-serif; color: #fff; text-shadow: 0 4px 0 #0a3014, 0 0 24px rgba(200,255,120,.5); }
  #newBest { font: italic 900 17px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 4px; color: #3a1a00; background: linear-gradient(90deg, #fff07a, #ffb21a); padding: 6px 18px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 0 24px rgba(255,210,60,.8); animation: nb .7s ease-in-out infinite alternate; }
  @keyframes nb { to { transform: rotate(-3deg) scale(1.08); } }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 26px; font-size: 14px; color: #cfe8c8; text-align: left; } .grid b { color: #fff; float: right; margin-left: 14px; }
  #unlockMsg { color: #ffe46a; font-weight: 800; }
  #pause { background: rgba(2,12,6,.74); font: italic 900 38px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 8px; color: #e8ff8a; }
  #pauseBtn { position: fixed; z-index: 9; top: max(10px, env(safe-area-inset-top)); right: 10px; width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(0,0,0,.38); color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; display: none; }
  @media (max-height: 700px) and (min-height: 521px) { .title { font-size: 58px; } .card canvas { width: 104px; height: 104px; } .overlay { gap: 8px; } .hint { display: none; } }
  @media (max-height: 520px) {
    .overlay { gap: 6px; padding: 8px 16px; } .title { font-size: 44px; } .tag { font-size: 9px; margin-top: 4px; } .hint { display: none; }
    .shop { padding: 6px 10px 8px; width: 300px; } .card canvas { width: 76px; height: 76px; } .nm { font-size: 15px; } .stats { margin: 3px 0 0; gap: 2px 8px; } .buy { margin-top: 5px; padding: 6px 0; font-size: 14px; } .tabs button { padding: 5px 0; font-size: 11px; }
    .btn { padding: 9px 46px; font-size: 22px; } .arrow { width: 32px; height: 32px; font-size: 14px; }
    #over h2 { font-size: 40px; } #overScore { font-size: 34px; } .grid { font-size: 12px; gap: 3px 20px; } #newBest { font-size: 13px; padding: 4px 12px; }
  }
  @media (max-height: 520px) and (min-width: 600px) { #menu { flex-direction: row; flex-wrap: wrap; align-content: center; column-gap: 28px; } #menu .titlebox { width: 100%; } #menu .side { display: flex; flex-direction: column; gap: 8px; align-items: center; } }
  .side { display: contents; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button id="pauseBtn" aria-label="Pause">II</button>
<div class="overlay" id="menu">
  <div class="titlebox"><div class="title">FREE<span>KICK</span></div><div class="tag">CURVE · DIP · SCORE</div></div>
  <div class="shop">
    <div class="tabs"><button data-tab="ball" class="on">BALL</button><button data-tab="boot">BOOTS</button><button data-tab="kit">KIT</button></div>
    <div class="row"><button class="arrow" id="prevItem">◀</button>
      <div class="card"><canvas id="itemPrev" width="264" height="264"></canvas><div class="nm" id="itemName">CLASSIC</div><div class="stats" id="itemStats"></div></div>
      <button class="arrow" id="nextItem">▶</button></div>
    <button class="buy eq" id="buyBtn">EQUIPPED</button>
  </div>
  <div class="side">
    <div class="coins" id="coinsMenu">● 0</div>
    <div class="stat" id="bestMenu"></div>
    <button class="btn" id="startBtn">PLAY</button>
    <div class="hint">Swipe from the ball toward the goal · longer swipe = higher · faster swipe = harder shot · curve your swipe to bend it around the wall</div>
  </div>
</div>
<div class="overlay hidden" id="over">
  <h2>FULL TIME</h2>
  <div id="overScore">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <div id="unlockMsg" class="hint"></div>
  <button class="btn" id="againBtn">PLAY AGAIN</button>
  <button class="btn2" id="menuBtn">MENU</button>
</div>
<div class="overlay hidden" id="pause">PAUSED<div class="hint">tap to continue</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);

    ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2 + out * W * .7, cy); const s = 1 + (1 - inK) * .9; ctx.scale(s, s); ctx.rotate(-.045);
    if (bn.kind === 'cup' && SPR.trophy) { const ts = 92 * sc * (1 + Math.sin(t * 6) * .04); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(glow('#ffd23a'), -ts * 1.1, -bh / 2 - ts * 1.25, ts * 2.2, ts * 2.2); ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(SPR.trophy, -ts / 2, -bh / 2 - ts * .95, ts, ts); }
    ctx.save(); ctx.transform(1, 0, -.22, 1, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-bw / 2 + 6, -bh / 2 + 7, bw, bh);
    const gr = ctx.createLinearGradient(0, -bh / 2, 0, bh / 2); gr.addColorStop(0, c0); gr.addColorStop(.5, c1); gr.addColorStop(1, c2); ctx.fillStyle = gr; ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-bw / 2, -bh / 2, bw, bh * .12); ctx.fillStyle = c2; ctx.fillRect(-bw / 2 - 12 * sc, -bh / 2, 7 * sc, bh); ctx.fillRect(bw / 2 + 5 * sc, -bh / 2, 7 * sc, bh);
    const sh = (G.t * 1.4) % 3 - 1; ctx.globalCompositeOperation = 'lighter'; const sg = ctx.createLinearGradient(sh * bw - 40, 0, sh * bw + 40, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.35)'); sg.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = sg; ctx.fillRect(-bw / 2, -bh / 2, bw, bh); ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
    txt(bn.a, 0, 2, size, tc, 'center', '900', tc === '#ffffff' ? 'rgba(0,0,0,.45)' : 'rgba(255,255,255,.55)');
    if (bn.b) { const ss = Math.round(Math.min(13 * sc, W * .9 / Math.max(8, bn.b.length * .58))); ctx.font = 'italic 800 ' + ss + 'px ' + TF; const w2 = ctx.measureText(bn.b).width + 26; ctx.fillStyle = 'rgba(0,12,4,.78)'; rrect(-w2 / 2, bh / 2 + 6, w2, ss + 12, (ss + 12) / 2); ctx.fill(); txt(bn.b, 0, bh / 2 + 6 + (ss + 12) / 2, ss, '#ffffff', 'center', '800', null); }
    ctx.restore();
  }
  function drawCoins() {
    if (!G.coinT) return; const [tx, ty] = G.coinT;
    for (const c of G.coinsFly) { if (c.t < 0) continue; const k = ease(clamp(c.t / .85, 0, 1)), x = lerp(c.x, tx, k), y = lerp(c.y, ty, k) - Math.sin(k * Math.PI) * 70, s = 18 * (1 - k * .35); ctx.drawImage(COIN, x - s / 2, y - s / 2, s, s); }
  }
  function drawTutorial() {
    const S = G.S, bp = pj(S.bx, BALL_R, S.bz), gp = pj(-HW * .7, BAR * .8, 0), T = 2.2, t = (G.t % T) / 1.3, k = clamp(t, 0, 1);
    const P = q => { const mx = bp.x + (gp.x - bp.x) * .5 + 60, my = bp.y + (gp.y - bp.y) * .5, u = 1 - q; return [u * u * bp.x + 2 * u * q * mx + q * q * (bp.x + (gp.x - bp.x) * .55), u * u * (bp.y + 10) + 2 * u * q * my + q * q * (bp.y + (gp.y - bp.y) * .55)]; };
    ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(230,255,180,.7)'; ctx.lineWidth = 6; ctx.beginPath(); for (let i = 0; i <= 24; i++) { const q = P(i / 24 * k); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); } if (k > .02) ctx.stroke();
    const [hx, hy] = P(k), a = t > 1.25 ? 0 : 1; ctx.globalAlpha = a * .95; if (SPR.hand) ctx.drawImage(SPR.hand, hx - 14, hy - 4, 52, 52); ctx.globalAlpha = 1;
    const y = H * .64; panel(W / 2 - 150, y - 22, 300, 52, 14);
    txt('SWIPE UP TO SHOOT', W / 2, y - 5, 18, '#e8ff8a', 'center'); txt('curve the swipe to bend it · longer = higher', W / 2, y + 16, 11, '#ffffff', 'center', '800', null, false);
  }

  // ---------- menu & shop ----------
  let tab = 'ball', paused = false, last = performance.now(), fps = 60, fpsN = 0, fpsT = 0;
  const sel = { ball: SAVE.ball, boot: SAVE.boot, kit: SAVE.kit };
  const menuOpen = () => !$('menu').classList.contains('hidden');
  function updateMenu() {
    $('bestMenu').innerHTML = SAVE.best ? 'BEST <b>' + fmt(SAVE.best) + '</b> · STAGE <b>' + SAVE.bestStage + '</b>' + (SAVE.cups ? ' · CUPS <b>' + SAVE.cups + '</b>' : '') : 'Bend it round the wall. Beat the keeper.';
    $('coinsMenu').textContent = '● ' + fmt(SAVE.coins); drawShop();
  }
  function drawShop() {
    const arr = GEAR[tab], i = sel[tab], it = arr[i], own = SAVE.own[tab].includes(i), eq = SAVE[tab] === i;
    $('itemName').textContent = (own ? '' : '🔒 ') + it.name;
    const bar = (l, v, lo, hi) => `<span>${l}</span><div class="bar"><i style="width:${clamp((v - lo) / (hi - lo), .06, 1) * 100}%"></i></div>`;
    $('itemStats').innerHTML = tab === 'kit' ? bar('COINS +' + Math.round((it.coin - 1) * 100) + '%', it.coin, .95, 1.32) : bar('POWER', it.pow, .9, 1.16) + bar('CURVE', it.cur, .9, 1.24) + bar('CONTROL', it.ctl, .9, 1.32);
    const b = $('buyBtn'); b.className = 'buy' + (eq ? ' eq' : !own && SAVE.coins < it.price ? ' no' : '');
    b.textContent = eq ? 'EQUIPPED' : own ? 'EQUIP' : '● ' + fmt(it.price) + (SAVE.coins >= it.price ? '  BUY' : '');
    $('coinsMenu').textContent = '● ' + fmt(SAVE.coins);
  }
  function drawItemPreview(time) {
    const c = $('itemPrev'), g = c.getContext('2d'), w = c.width, h = c.height, own = SAVE.own[tab].includes(sel[tab]); g.clearRect(0, 0, w, h);
    const gr = g.createRadialGradient(w / 2, h * .48, 4, w / 2, h * .48, w * .5); gr.addColorStop(0, 'rgba(200,255,120,.35)'); gr.addColorStop(1, 'rgba(200,255,120,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.save(); if (!own) g.filter = 'grayscale(1) brightness(.6)';
    if (tab === 'ball') { const spr = SPR['ball' + sel.ball], r = w * .3, y = h * .46 - Math.abs(Math.sin(time * 2.6)) * h * .08; g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(w / 2, h * .82, r * .9, r * .2, 0, 0, TAU); g.fill(); if (spr) { g.save(); g.translate(w / 2, y); g.rotate(time * 2); g.drawImage(spr, -r, -r, r * 2, r * 2); g.restore(); g.drawImage(SPR.ballShade, w / 2 - r, y - r, r * 2, r * 2); } }
    else if (tab === 'boot') { const b = BOOTS[sel.boot], spr = SPR['boot' + sel.boot]; g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 14; i++) { const k = i / 14, x = w * (.08 + k * .5), y = h * (.62 - k * .18) + Math.sin(time * 8 + i) * 3; g.globalAlpha = k * .5; g.fillStyle = b.trail === 'rainbow' ? `hsl(${(time * 200 + i * 25) % 360},100%,60%)` : b.tc; g.beginPath(); g.arc(x, y, 4 + k * 10, 0, TAU); g.fill(); } g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; if (spr) { g.save(); g.translate(w * .55, h * .5 + Math.sin(time * 3) * 4); g.rotate(-.2); g.drawImage(spr, -w * .4, -w * .21, w * .8, w * .42); g.restore(); } }
    else { const spr = SPR['kit' + sel.kit]; if (spr) { const s = w * .8; g.save(); g.translate(w / 2, h / 2); g.rotate(Math.sin(time * 1.5) * .05); g.drawImage(spr, -s / 2, -s / 2, s, s); g.restore(); } }
    g.restore();
    if (!own) { g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.arc(w - 34, 34, 22, 0, TAU); g.fill(); g.font = '22px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🔒', w - 34, 36); }
  }
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); drawShop(); }));
  $('prevItem').onclick = () => { sel[tab] = (sel[tab] + GEAR[tab].length - 1) % GEAR[tab].length; drawShop(); };
  $('nextItem').onclick = () => { sel[tab] = (sel[tab] + 1) % GEAR[tab].length; drawShop(); };
  $('buyBtn').onclick = () => {
    const i = sel[tab], it = GEAR[tab][i], own = SAVE.own[tab].includes(i);
    if (!own) { if (SAVE.coins < it.price) { const b = $('buyBtn'); b.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 220 }); return; } SAVE.coins -= it.price; SAVE.own[tab].push(i); try { audio.sfx(880, .12, 'triangle', .06, 1320); } catch (e) {} }
    SAVE[tab] = i; saveNow(); if (G && G.attract) G.coinShow = SAVE.coins; updateMenu();
  };
  function start() {
    audio.start(); audioOn = true;
    $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('pause').classList.add('hidden'); $('pauseBtn').style.display = 'block';
    paused = false; FX.clear(); newRun(false);
  }
  $('startBtn').onclick = start; $('againBtn').onclick = start;
  $('menuBtn').onclick = () => { $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); $('pauseBtn').style.display = 'none'; newRun(true); updateMenu(); };
  function gameOver() {
    G.over = true; const sc = Math.floor(G.score), prev = SAVE.best, nb = sc > prev; if (nb) SAVE.best = sc; SAVE.bestStage = Math.max(SAVE.bestStage, G.stage); SAVE.cups += G.cups; saveNow();
    $('overScore').textContent = fmt(sc); $('newBest').style.display = nb ? 'block' : 'none';
    const acc = G.shots ? Math.round(G.goals / G.shots * 100) : 0;
    $('overStats').innerHTML = [['Stage', G.stage], ['Goals', G.goals + ' / ' + G.shots], ['Top bins', G.tops], ['Targets', G.targets], ['Best streak', G.bestStreak], ['Cups', G.cups], ['Accuracy', acc + '%'], ['Coins', '+' + fmt(G.coinsRun)]].map(([a, b]) => '<div>' + a + '<b>' + b + '</b></div>').join('');
    const next = ['ball', 'boot', 'kit'].flatMap(k => GEAR[k].map((it, i) => ({ k, it, i }))).filter(o => !SAVE.own[o.k].includes(o.i)).sort((a, b) => a.it.price - b.it.price)[0];
    $('unlockMsg').textContent = next ? (SAVE.coins >= next.it.price ? 'You can buy the ' + next.it.name + ' ' + (next.k === 'boot' ? 'boots' : next.k) + ' now!' : 'Next unlock: ' + next.it.name + ' ' + (next.k === 'boot' ? 'boots' : next.k) + ' · ● ' + fmt(next.it.price - SAVE.coins) + ' to go') : 'Every item collected — legend!';
    $('over').classList.remove('hidden'); $('pauseBtn').style.display = 'none'; updateMenu();
    sfx(392, .3, 'triangle', .06); setTimeout(() => sfx(330, .5, 'triangle', .06), 260);
  }
  function pause() { if (!G || G.attract || G.over || paused) return; paused = true; $('pause').classList.remove('hidden'); if (G.swipe) { G.swipe = null; G.preview = null; } }
  function resume() { paused = false; $('pause').classList.add('hidden'); last = performance.now(); }
  $('pause').addEventListener('pointerdown', e => { e.preventDefault(); resume(); });
  $('pauseBtn').addEventListener('pointerdown', e => e.stopPropagation());
  $('pauseBtn').onclick = e => { e.stopPropagation(); pause(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  addEventListener('keydown', e => { if (e.code === 'Enter' && menuOpen()) start(); else if (e.code === 'Escape' || e.code === 'KeyP') { if (paused) resume(); else pause(); } else if (paused) resume(); });
  addEventListener('resize', resize);

  window.__fk = {
    G: () => G, B, K, SAVE, start, pause, resume, stat,
    state: () => ({ mode: G.mode, stage: G.stage, att: G.att, score: G.score, lives: G.lives, goals: G.goals, shots: G.shots, coins: SAVE.coins, theme: G.S.theme.id, tod: G.S.tod, final: G.S.final, pen: G.S.pen, wall: G.S.wallN, over: G.over, fps: Math.round(fps), banner: G.banner && G.banner.a }),
    autopilot: v => { G.autopilot = v; }, lives: n => { G.lives = n; },
    setStage: n => { G.stage = n - 1; G.lives = Math.max(G.lives, 3); G.mode = 'aim'; G.banner = null; G.bannerQ = []; nextStage(); },
    coins: n => { SAVE.coins += n; saveNow(); updateMenu(); }, unlockAll: () => { for (const k of ['ball', 'boot', 'kit']) SAVE.own[k] = GEAR[k].map((_, i) => i); saveNow(); updateMenu(); },
    shoot: (tx, ty, speed = 26, c = 0) => { if (G.mode === 'aim') kickOff(makeShot([tx, ty, 0], speed, c, (speed - 15) / 18, false)); }, bot: () => { if (G.mode === 'aim') kickOff(botShot(.05)); },
    ballScreen: () => { const p = proj(G.S.bx, BALL_R, G.S.bz); return [p.x, p.y]; }, toScreen: (x, y, z) => { const p = proj(x, y, z); return [p.x, p.y]; }, fps: () => fps, equip: (k, i) => { if (!SAVE.own[k].includes(i)) SAVE.own[k].push(i); SAVE[k] = i; sel[k] = i; saveNow(); updateMenu(); }, tab: t => { tab = t; drawShop(); }
  };
  resize(); newRun(true); updateMenu();
  (function loop(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; fpsN++; fpsT += dt; if (fpsT >= 1) { fps = fpsN / fpsT; fpsN = 0; fpsT = 0; }
    if (!paused && G && !G.over) update(dt); render(); if (menuOpen()) drawItemPreview(now / 1000);
    requestAnimationFrame(loop);
  })(last);
})();
</script>
