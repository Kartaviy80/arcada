<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1410">
<title>Sword Forge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1410;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; color: #f4e6d4;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
  .top .coins { font-size: 32px; font-weight: 900; color: #ffd86a; -webkit-text-stroke: 1.5px #3a2010; text-shadow: 0 3px 0 #3a2010, 0 0 18px rgba(255,170,60,.55); }
  .top .ps { font-size: 13px; font-weight: 800; color: #f4e2c8; background: rgba(20,12,8,.72); display: inline-block; padding: 2px 12px; border-radius: 12px; margin-top: 2px; }
  .top .boost { font-size: 13px; font-weight: 900; color: #2a1a04; background: linear-gradient(#fff2a0, #f0b02a); display: inline-block; padding: 2px 10px; border-radius: 12px; margin-left: 6px; }
  .act { position: fixed; z-index: 4; border: 3px solid #ffe8c0; border-radius: 18px; font: inherit; font-weight: 900; cursor: pointer; line-height: 1.1; text-align: center; }
  .act small { display: block; font-size: 11px; font-weight: 800; opacity: .9; }
  #enh { color: #fff; font-size: 17px; padding: 8px 10px; background: linear-gradient(#5ad8ff, #2a6ae8); box-shadow: 0 5px 0 #0a2a7a, 0 0 20px rgba(90,180,255,.45); }
  #sell { color: #3a2004; font-size: 15px; padding: 8px 10px; background: linear-gradient(#ffe27a, #f0a01a); box-shadow: 0 5px 0 #7a4a04; }
  .act:disabled { filter: grayscale(.85) brightness(.75); }
  .act:active:not(:disabled) { transform: translateY(3px); }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; height: 42%; background: linear-gradient(#3e2c22, #1e140e); border-top: 5px solid #b8864a; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 26px rgba(0,0,0,.5); display: flex; flex-direction: column; z-index: 3; }
  @media (min-aspect-ratio: 1/1) { .panel { left: auto; top: 0; width: min(420px, 40%); height: 100%; border-radius: 22px 0 0 22px; border-top: 0; border-left: 5px solid #b8864a; } }
  .tabs { display: flex; gap: 6px; padding: 10px 10px 6px; }
  .tabs button { flex: 1; border: 0; border-radius: 12px; padding: 9px 4px; font: inherit; font-size: 14px; font-weight: 900; color: #e0c4a0; background: #4e382a; cursor: pointer; }
  .tabs button.on { background: linear-gradient(#e8b06a, #a8642a); color: #fff; box-shadow: 0 3px 0 #5a2e0a; }
  .tabs .mode { flex: 0 0 64px; background: #120a06; color: #ffd86a; }
  .list { flex: 1; overflow-y: auto; padding: 4px 10px 80px; -webkit-overflow-scrolling: touch; }
  .card { display: flex; align-items: center; gap: 10px; background: linear-gradient(#56402e, #44302a); border: 2px solid #76563a; border-radius: 16px; padding: 8px; margin-bottom: 8px; box-shadow: 0 3px 0 #140c08; }
  .card canvas { width: 58px; height: 58px; flex: 0 0 58px; border-radius: 12px; background: radial-gradient(circle at 45% 40%, #8a6a4a, #2a1a10); }
  .card .info { flex: 1; min-width: 0; }
  .card .nm { font-weight: 900; font-size: 15px; color: #fff; } .card .nm small { font-weight: 800; color: #ffc88a; font-size: 13px; }
  .card .ds { font-size: 12px; color: #dcc0a0; line-height: 1.3; }
  .card .bar { height: 5px; background: #24160e; border-radius: 3px; margin-top: 4px; overflow: hidden; } .card .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd86a, #ff7a2a); }
  .card button { flex: 0 0 auto; min-width: 86px; border: 0; border-radius: 12px; padding: 8px 6px; font: inherit; font-weight: 900; font-size: 13px; color: #3a2004; background: linear-gradient(#ffe27a, #e8a02a); box-shadow: 0 3px 0 #7a4a04; cursor: pointer; line-height: 1.15; }
  .card button:disabled { background: #5e4a3a; box-shadow: 0 3px 0 #24160e; color: #a8907a; }
  .card button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #7a4a04; }
  .card.locked { opacity: .5; filter: grayscale(.8); }
  .prest { text-align: center; padding: 10px 8px; }
  .prest h3 { font-size: 22px; color: #ffd86a; } .prest p { font-size: 14px; line-height: 1.5; margin: 8px 0; color: #ecd8c0; }
  .prest .big { font-size: 40px; font-weight: 900; color: #ffd86a; text-shadow: 0 0 16px rgba(255,190,60,.5); }
  .prest button { border: 0; border-radius: 16px; padding: 12px 26px; font: inherit; font-size: 16px; font-weight: 900; color: #3a2004; background: linear-gradient(#ffe27a, #e8a02a); box-shadow: 0 4px 0 #7a4a04; cursor: pointer; }
  .prest button:disabled { background: #5e4a3a; box-shadow: 0 4px 0 #24160e; color: #a8907a; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: radial-gradient(ellipse at 50% 35%, rgba(110,60,30,.96), rgba(14,8,6,.98)); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 240px; height: 240px; }
  h1 { font-size: clamp(44px, 13.5vw, 72px); font-weight: 900; line-height: .95; color: #e8f0ff; -webkit-text-stroke: 3px #2a3448; text-shadow: 0 5px 0 #2a3448, 0 0 30px rgba(255,170,60,.7); }
  .overlay p { max-width: 320px; font-size: 15px; line-height: 1.55; color: #f0dcc4; }
  .overlay .stat b { color: #ffd86a; }
  .btn { border: 4px solid #ffe8c0; background: linear-gradient(#ffb04a, #c8501a); color: #fff; font: inherit; font-size: 21px; font-weight: 900; letter-spacing: 3px; padding: 14px 46px; border-radius: 40px; cursor: pointer; box-shadow: 0 6px 0 #5a1e04, 0 0 26px rgba(255,140,40,.5); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><div class="coins" id="coins">0</div><div><span class="ps" id="ps">0 / sec</span><span class="boost" id="boost" style="display:none">x7 ROYAL ORDER</span></div></div>
<button class="act" id="sell">SELL<small id="sellT">🪙 0</small></button>
<button class="act" id="enh">⚒ ENHANCE<small id="enhT">95% · 🪙 10</small></button>
<div class="panel" id="panel">
  <div class="tabs"><button class="on" data-t="smiths">Smiths</button><button data-t="upg">Upgrades</button><button data-t="legend">🏆 Legend</button><button class="mode" id="mode">x1</button></div>
  <div class="list" id="list"></div>
</div>
<div class="overlay" id="menu">
  <canvas id="logo" width="480" height="480"></canvas>
  <h1>SWORD<br>FORGE</h1>
  <p><b>How far can a blade be pushed?</b> Hammer the steel until it glows, then risk an enhancement: +1, +2… +50 and beyond. Hire smiths, sell masterpieces, and forge a legend.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">FORGE</button>
</div>
<div class="overlay hidden" id="away">
  <canvas id="awayArt" width="480" height="480"></canvas>
  <h1>WELCOME<br>BACK!</h1>
  <p id="awayTxt"></p>
  <button class="btn" id="awayBtn">COLLECT</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {

// ---------- idle core: big-number formatting, geometric prices, saves and offline earnings ----------
const Idle = (() => {
  const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td', 'Qad', 'Qid', 'Sxd', 'Spd', 'Ocd', 'Nod', 'Vg'];
  // past the named suffixes: aa, ab, ac … zz
  const letters = i => String.fromCharCode(97 + Math.floor(i / 26) % 26) + String.fromCharCode(97 + i % 26);
  function fmt(n, dec = 2) {
    if (!isFinite(n)) return '∞';
    if (n < 0) return '-' + fmt(-n, dec);
    if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n).toString();
    const e = Math.floor(Math.log10(n) / 3), v = n / Math.pow(10, e * 3);
    const s = e < SUF.length ? SUF[e] : letters(e - SUF.length);
    return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(dec)) + s;
  }
  function fmtTime(s) { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return h ? h + 'h ' + m + 'm' : m ? m + 'm ' + x + 's' : x + 's'; }
  // price of buying n more when `owned` are owned: base * g^owned * (g^n - 1) / (g - 1)
  const cost = (base, g, owned, n = 1) => base * Math.pow(g, owned) * (Math.pow(g, n) - 1) / (g - 1);
  // how many can be afforded with `money`
  function maxAfford(base, g, owned, money) { const c0 = base * Math.pow(g, owned); if (money < c0) return 0; return Math.max(1, Math.floor(Math.log(money * (g - 1) / c0 + 1) / Math.log(g))); }
  // milestone multiplier: x2 at 10, 25, 50, 100, then every 100
  function milestone(owned) { let m = 1; for (const k of [10, 25, 50]) if (owned >= k) m *= 2; if (owned >= 100) m *= Math.pow(2, Math.floor(owned / 100)); return m; }
  function nextMilestone(owned) { for (const k of [10, 25, 50, 100]) if (owned < k) return k; return (Math.floor(owned / 100) + 1) * 100; }
  function load(key, defaults) { let s = null; try { s = JSON.parse(localStorage.getItem(key)); } catch (e) {} return Object.assign(JSON.parse(JSON.stringify(defaults)), s || {}); }
  function save(key, state) { state.seen = Date.now(); try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }
  // seconds since the last save, capped (default 8 hours)
  function away(state, cap = 8 * 3600) { if (!state.seen) return 0; return Math.min(cap, Math.max(0, (Date.now() - state.seen) / 1000)); }
  return { fmt, fmtTime, cost, maxAfford, milestone, nextMilestone, load, save, away };
})();

      const drop = S.sword >= 5 && Math.random() < (.5 - lvl('oil') * .1); if (drop) S.sword--;
      FX.burst(sw.x + sw.len * .4, sw.y - 10, { n: 26, colors: ['#5a5a5a', '#8a8a8a', '#3a3a3a'], speed: 140, size: 14, gravity: -60, life: 1.2 }); FX.shake(9, .3);
      FX.text(sceneR.w / 2, sceneR.h * .24, drop ? 'CRACKED! -1' : 'FAILED', { color: '#ff6a5a', size: 32, stroke: '#3a0a04', life: 1.4 });
      audio.sfx(140, .4, 'sawtooth', .06, 60); audio.sfx(70, .3, 'square', .04, 40);
    }
    store(); renderList(false); updateButtons();
  }
  function sell() {
    if (S.sword < 1) return; const v = sellValue(S.sword), sw = SWORD(); earn(v); S.swords++;
    FX.text(sceneR.w / 2, sceneR.h * .24, 'SOLD +' + fmt(v), { color: '#ffd86a', size: 32, stroke: '#3a1a04', life: 1.5 }); FX.burst(sw.x + sw.len * .4, sw.y, { n: 40, colors: ['#ffe27a', '#fff6c0', '#e8a01a'], shape: 'circle', speed: 400, size: 7, gravity: 600 });
    S.sword = 0; S.heat = 0; [523, 784, 1046].forEach((f, k) => setTimeout(() => audio.sfx(f, .15, 'square', .05), k * 60)); store(); renderList(false); updateButtons();
  }
  $('enh').onclick = enhance; $('sell').onclick = sell;
  [$('enh'), $('sell')].forEach(b => b.addEventListener('pointerdown', e => e.stopPropagation()));
  function updateButtons() {
    const c = enhCost(S.sword); $('enhT').textContent = Math.round(chance() * 100) + '% · 🪙 ' + fmt(c); $('enh').disabled = S.coins < c || !S.started;
    $('sellT').textContent = S.sword ? '🪙 ' + fmt(sellValue(S.sword)) : 'need +1'; $('sell').disabled = S.sword < 1 || !S.started;
  }
  canvas.addEventListener('pointerdown', e => {
    if (!S.started) return;
    const x = e.clientX, y = e.clientY;
    if (letter && Math.hypot(x - letter.x, y - letter.y) < 46) return openLetter();
    if (Math.abs(x - ax) < 150 * u && y > ay - 110 * u && y < ay + 60 * u) strike(x, y);
  });
  function openLetter() {
    const g = letter; letter = null; const tx = Math.max(130, Math.min(sceneR.w - 130, g.x));
    if (Math.random() < .55) { order = 20; FX.text(tx, g.y, 'ROYAL ORDER x7!', { color: '#ffd86a', size: 30, stroke: '#5a0a0a', life: 1.4 }); }
    else { const v = Math.max(60, cps() * 600 + tapValue() * 50); earn(v); FX.text(tx, g.y, "KING'S PURSE +" + fmt(v), { color: '#ffd86a', size: 26, stroke: '#5a0a0a', life: 1.5 }); }
    FX.burst(g.x, g.y, { n: 44, colors: ['#ffe27a', '#fff6c0', '#e8303a'], shape: 'star', speed: 420, size: 9, gravity: 220, glow: 1 }); FX.flash('#fff0c0', .3);
    [784, 988, 1175, 1568].forEach((f, k) => setTimeout(() => audio.sfx(f, .2, 'square', .05), k * 70));
  }
  function priceN(base, g, own) { if (mode === 'max') { const n = Math.max(1, maxAfford(base, g, own, S.coins)); return [n, cost(base, g, own, n)]; } return [mode, cost(base, g, own, mode)]; }
  function hire(s) { const [n, c] = priceN(s.base, 1.15, owned(s.id)); if (S.coins < c) return; S.coins -= c; const b = owned(s.id); S.staff[s.id] = b + n; if (milestone(b + n) > milestone(b)) { FX.text(sceneR.w / 2, sceneR.h * .3, s.name + ' x2!', { color: '#7affc8', size: 28, stroke: '#0a3a2a', life: 1.4 }); audio.sfx(1046, .3, 'square', .05); } audio.sfx(660, .08, 'square', .05, 990); store(); renderList(true); }
  function buyUpg(u2) { const c = cost(u2.base, u2.g, lvl(u2.id), 1); if (S.coins < c || (u2.max && lvl(u2.id) >= u2.max)) return; S.coins -= c; S.upg[u2.id] = lvl(u2.id) + 1; audio.sfx(880, .12, 'square', .05, 1320); store(); renderList(true); }
  function legend() {
    const n = renownAvail(); if (n <= 0) return;
    S.renown += n; S.prestiges++; S.coins = 0; S.staff = {}; S.sword = 0; S.heat = 0; S.upg = { night: lvl('night') }; FX.flash('#ffffff', .8);
    FX.burst(sceneR.w / 2, sceneR.h / 2, { n: 90, colors: ['#ffd86a', '#ffffff', '#ff8a2a'], shape: 'star', speed: 600, size: 12, gravity: 100, life: 1.6, glow: 1 });
    [523, 659, 784, 1046, 1318].forEach((f, k) => setTimeout(() => audio.sfx(f, .3, 'square', .05), k * 110)); store(); renderList(true); updateButtons();
  }
  const store = () => Idle.save(KEY, S);

  // ---------- panel ----------
  let tab = 'smiths', rows = [];
  document.querySelectorAll('.tabs [data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('.tabs [data-t]').forEach(x => x.classList.toggle('on', x === b)); renderList(true); audio.sfx(700, .04, 'triangle', .03); });
  $('mode').onclick = () => { mode = mode === 1 ? 10 : mode === 10 ? 'max' : 1; $('mode').textContent = mode === 'max' ? 'MAX' : 'x' + mode; renderList(true); };
  function iconCanvas(id) { const c = document.createElement('canvas'); c.width = 116; c.height = 116; if (SPR) c.getContext('2d').drawImage(SPR[id], 6, 6, 104, 104); return c; }
  function renderList(full) {
    const L = $('list');
    if (full) {
      L.innerHTML = ''; rows = [];
      if (tab === 'smiths') {
        let shownLocked = false;
        for (const s of SMITHS) {
          const unlocked = owned(s.id) > 0 || S.total >= s.base * .5 || s === SMITHS[0];
          if (!unlocked) { if (shownLocked) break; shownLocked = true; }
          const el = document.createElement('div'); el.className = 'card' + (unlocked ? '' : ' locked');
          el.innerHTML = '<div class="info"><div class="nm"></div><div class="ds"></div><div class="bar"><i></i></div></div><button></button>';
          el.prepend(iconCanvas(s.id)); el.querySelector('button').onclick = () => hire(s); L.appendChild(el); rows.push({ el, s, kind: 'smith', unlocked });
        }
      } else if (tab === 'upg') {
        for (const u2 of UPG) { const el = document.createElement('div'); el.className = 'card'; el.innerHTML = '<div class="info"><div class="nm"></div><div class="ds"></div></div><button></button>'; el.prepend(iconCanvas(u2.id)); el.querySelector('button').onclick = () => buyUpg(u2); L.appendChild(el); rows.push({ el, u: u2, kind: 'upg' }); }
      } else {
        const el = document.createElement('div'); el.className = 'prest';
        el.innerHTML = '<h3>🏆 Hall of Legends 🏆</h3><div class="big" id="pRen"></div><p id="pTxt"></p><button id="pBtn">HANG UP THE HAMMER</button><p style="font-size:12px;opacity:.75">Retire this forge and start a new one as a legend. Each point of renown makes everything 10% stronger and swords sell for 10% more — forever. You keep your Night Furnace.</p>';
        L.appendChild(el); $('pBtn').onclick = legend; rows.push({ el, kind: 'legend' });
      }
    }
    for (const r of rows) {
      const btn = r.el.querySelector('button');
      if (r.kind === 'smith') {
        const s = r.s, own = owned(s.id), [n, c] = priceN(s.base, 1.15, own), nm = r.el.querySelector('.nm'), ds = r.el.querySelector('.ds');
        if (!r.unlocked) { nm.textContent = '???'; ds.textContent = 'Earn ' + fmt(s.base * .5) + ' gold to meet them'; btn.textContent = '🔒'; btn.disabled = true; continue; }
        nm.innerHTML = s.name + ' <small>' + own + '</small>'; ds.textContent = s.desc + ' · ' + fmt(unitCps(s)) + '/s each';
        const nm2 = nextMilestone(own), prev = own >= 100 ? Math.floor(own / 100) * 100 : ([0, 10, 25, 50].filter(k => k <= own).pop() || 0); r.el.querySelector('.bar i').style.width = Math.min(100, (own - prev) / (nm2 - prev) * 100) + '%';
        btn.innerHTML = 'HIRE' + (mode === 1 ? '' : ' ' + n) + '<br>🪙 ' + fmt(c); btn.disabled = S.coins < c;
      } else if (r.kind === 'upg') {
        const u2 = r.u, l = lvl(u2.id), c = cost(u2.base, u2.g, l, 1), maxed = u2.max && l >= u2.max; r.el.querySelector('.nm').innerHTML = u2.name + ' <small>Lv ' + l + '</small>'; r.el.querySelector('.ds').textContent = u2.desc(l);
        btn.innerHTML = maxed ? 'MAX' : 'UPGRADE<br>🪙 ' + fmt(c); btn.disabled = maxed || S.coins < c;
      } else { const n = renownAvail(); $('pRen').textContent = '🏆 ' + S.renown + (n > 0 ? '  (+' + n + ')' : ''); $('pTxt').innerHTML = 'Best blade: <b>+' + S.best + '</b> · sold <b>' + S.swords + '</b><br>Lifetime gold: <b>' + fmt(S.life) + '</b><br>' + (n > 0 ? 'Retire now for <b>' + n + '</b> renown (+' + n * 10 + '% forever).' : 'Next renown at ' + fmt(Math.pow(S.renown + 1, 2) * 1e6) + ' lifetime.'); btn.disabled = n <= 0; }
    }
  }
  window.__sf = { state: () => S, cps, tapValue, chance, strike: () => strike(ax, ay), enhance, sell, hire: i => hire(SMITHS[i]), buyUpg: i => buyUpg(UPG[i]), give: v => earn(v), setSword: n => { S.sword = n; }, letter: () => letter, spawnLetter: () => { letterT = 0; }, openLetter, legend, anvil: () => ({ x: ax, y: ay }) };

  // ---------- start, offline ----------
  function begin() { if (!SPR) return; S.started = true; $('menu').classList.add('hidden'); audio.start(); resize(); renderList(true); updateButtons(); store(); }
  $('startBtn').onclick = () => {
    const away = Idle.away(S), rate = Math.min(1, .5 + lvl('night') * .1), earned = S.seen && S.started ? cps() * away * rate : 0;
    if (earned > 1 && away > 30) { earn(earned); $('awayTxt').innerHTML = 'You were away for <b>' + Idle.fmtTime(away) + '</b>.<br>Your smiths forged and sold blades worth <b>🪙 ' + fmt(earned) + '</b>!'; $('menu').classList.add('hidden'); $('away').classList.remove('hidden'); audio.start(); }
    else begin();
  };
  $('awayBtn').onclick = () => { $('away').classList.add('hidden'); begin(); FX.burst(sceneR.w / 2, sceneR.h / 2, { n: 50, colors: ['#ffe27a', '#fff6c0'], shape: 'circle', speed: 500, size: 8, gravity: 500, life: 1.4 }); audio.sfx(988, .3, 'square', .05); };
  $('bestMenu').innerHTML = S.life > 0 ? 'Best blade <b>+' + S.best + '</b> · earned <b>' + fmt(S.life) + '</b>' + (S.renown ? ' · 🏆 ' + S.renown : '') : '';
  addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !S.started) { e.preventDefault(); $('startBtn').click(); } });
  addEventListener('visibilitychange', () => { if (document.hidden) store(); });

  // ---------- loop ----------
  let saveT = 0, uiT = 0;
  function update(dt) {
    t += dt; FX.update(dt); swing = Math.max(0, swing - dt * 6); glowT = Math.max(0, glowT - dt * 1.5);
    const fx = sceneR.w * .2, fy = ay - 30 * u;
    if (Math.random() < dt * 18) fireP.push({ x: fx + (Math.random() - .5) * 60 * u, y: fy + 30 * u, vx: (Math.random() - .5) * 20, vy: -30 - Math.random() * 50, life: 1 });
    for (const p of fireP) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * .9; } fireP = fireP.filter(p => p.life > 0);
    if (!S.started) return;
    order = Math.max(0, order - dt);
    S.heat = Math.max(0, S.heat - dt * (.05 * Math.pow(.88, lvl('bellows'))));
    earn(cps() * dt);
    letterT -= dt; if (letterT <= 0 && !letter) { letter = { x: sceneR.w * (.2 + Math.random() * .6), y: -40, vy: 40 + Math.random() * 20, ph: Math.random() * 6 }; letterT = 40 + Math.random() * 40; audio.sfx(1568, .2, 'sine', .04, 2093); }
    if (letter) { letter.y += letter.vy * dt; letter.ph += dt; letter.x += Math.sin(letter.ph * 2) * 30 * dt; if (letter.y > ay - 40 * u) letter = null; }
    saveT += dt; if (saveT > 5) { saveT = 0; store(); }
    uiT += dt; if (uiT > .2) { uiT = 0; $('coins').textContent = '🪙 ' + fmt(S.coins); $('ps').textContent = fmt(cps()) + ' / sec · blade x' + fmt(swordMult()); $('boost').style.display = order > 0 ? 'inline-block' : 'none'; if (order > 0) $('boost').textContent = 'x7 ROYAL ORDER ' + Math.ceil(order) + 's'; renderList(false); updateButtons(); }
  }
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (BG) ctx.drawImage(BG, 0, 0, W, H);
    if (!SPR) return;
    const [ox, oy] = FX.offset(); ctx.translate(ox, oy);
    drawForge(); drawSmiths();
    // anvil, blade and the hammer swinging in from the right
    const aw = 230 * u, ah = aw * .6; ctx.drawImage(SPR.anvil, ax - aw / 2, ay - ah * .26, aw, ah);
    const sw = SWORD(); drawSword(ctx, sw.x, sw.y, sw.len, S.sword, S.heat, glowT);
    const L = swordLook(S.sword); ctx.textAlign = 'center'; ctx.font = '900 ' + Math.round(20 * Math.max(.9, u)) + 'px sans-serif'; ctx.lineWidth = 5; ctx.strokeStyle = '#1a0e08';
    const title = L.name + (S.sword ? ' +' + S.sword : ''), ty = ay - 150 * u; ctx.strokeText(title, ax, ty); ctx.fillStyle = S.sword >= 10 ? '#ffd86a' : '#fff'; ctx.fillText(title, ax, ty);
    // heat gauge
    const gw = 150 * u, gx = ax - gw / 2, gy = ty + 10; ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.roundRect(gx, gy, gw, 9, 5); ctx.fill(); const hg = ctx.createLinearGradient(gx, 0, gx + gw, 0); hg.addColorStop(0, '#ffd24a'); hg.addColorStop(1, '#ff3a1a'); ctx.fillStyle = hg; ctx.beginPath(); ctx.roundRect(gx, gy, Math.max(9, gw * S.heat), 9, 5); ctx.fill();
    ctx.font = '800 11px sans-serif'; ctx.fillStyle = '#ffe8c8'; ctx.fillText('HEAT ' + Math.round(S.heat * 100) + '%  ·  tap to strike', ax, gy + 22);
    // the hammer pivots at the smith's grip: raised high at rest, down on the blade when it strikes
    const hs = 110 * u, rot = .5 - swing * 1.1 + (swing > 0 ? 0 : Math.sin(t * 2) * .04);
    ctx.save(); ctx.translate(ax + 150 * u, ay - 10 * u); ctx.rotate(rot); ctx.drawImage(SPR.hammer, -hs * .72, -hs * .86, hs, hs); ctx.restore();
    if (letter) { const z = 54; ctx.save(); ctx.translate(letter.x, letter.y); ctx.rotate(Math.sin(letter.ph * 2) * .25); ctx.shadowColor = '#ffd86a'; ctx.shadowBlur = 22 + Math.sin(t * 10) * 8; ctx.drawImage(SPR.letter, -z / 2, -z / 2, z, z); ctx.restore(); }
    FX.draw(ctx);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); FX.drawFlash(ctx, W, H);
  }
  function drawLogo(cv) {
    const g = cv.getContext('2d'); g.clearRect(0, 0, 480, 480);
    const glow = g.createRadialGradient(240, 240, 10, 240, 240, 240); glow.addColorStop(0, 'rgba(255,190,100,.7)'); glow.addColorStop(1, 'rgba(255,120,40,0)'); g.fillStyle = glow; g.fillRect(0, 0, 480, 480);
    g.drawImage(SPR.anvil, 40, 250, 400, 240);
    g.save(); g.translate(240, 200); g.rotate(-.5); drawSword(g, -150, 0, 330, 34, .2, .6); g.restore();
    g.drawImage(SPR.hammer, 300, 190, 150, 150); g.drawImage(SPR.dwarf, 10, 300, 130, 130);
  }

  resize();
  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
