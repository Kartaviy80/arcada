<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a2450">
<title>Letter Wheel</title>
<style>
  :root { --f: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif; --ink: #3a2a5a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2a2450; color: #fff; font-family: var(--f); font-weight: 800;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; font-weight: 900; cursor: pointer; border: none; color: inherit; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }

  /* ---------- coin pill ---------- */
  #coinsTop { position: fixed; z-index: 35; top: max(12px, env(safe-area-inset-top)); right: 12px; height: 38px; min-width: 96px; padding: 0 14px 0 6px;
    display: flex; align-items: center; gap: 7px; border-radius: 20px; font-size: 19px; color: #fff; letter-spacing: .5px;
    background: linear-gradient(180deg, rgba(40,30,80,.72), rgba(20,14,46,.78)); border: 2px solid rgba(255,230,160,.55);
    box-shadow: 0 3px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25); text-shadow: 0 2px 2px rgba(0,0,0,.5); transition: transform .12s; }
  #coinsTop.bump { transform: scale(1.12); }
  .coin { display: inline-block; width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 38% 32%, #fff7c4 0 12%, #ffd84a 34%, #f0a316 72%, #b86e08 100%); box-shadow: inset 0 -2px 0 rgba(120,60,0,.55), 0 1px 2px rgba(0,0,0,.4); position: relative; }
  .coin::after { content: "★"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #c87a0a; text-shadow: 0 1px 0 #fff3b0; }

  /* ---------- buttons ---------- */
  .btn { position: relative; border: 3px solid #fff4c8; padding: 12px 54px 14px; border-radius: 40px; font-size: 28px; letter-spacing: 4px; color: #fff;
    background: linear-gradient(180deg, #ffe07a 0%, #ffab35 48%, #f37a1c 100%); text-shadow: 0 2px 0 #b2500c, 0 0 8px rgba(160,60,0,.4);
    box-shadow: 0 7px 0 #a9480e, 0 12px 24px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6); animation: pulse 1.8s ease-in-out infinite; }
  #nextBtn { white-space: nowrap; letter-spacing: 3px; padding-left: 34px; padding-right: 34px; }
  .btn small { display: block; font-size: 13px; letter-spacing: 3px; margin-top: 2px; color: #fff8e0; text-shadow: 0 1px 0 #b2500c; }
  .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #a9480e, inset 0 2px 0 rgba(255,255,255,.6); }
  .btn.green { background: linear-gradient(180deg, #b6f27a 0%, #5fd04a 48%, #2fa63a 100%); text-shadow: 0 2px 0 #1d6a24; box-shadow: 0 7px 0 #1f7a2c, 0 12px 24px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); border-color: #eaffd0; }
  .btn.green:active { box-shadow: 0 2px 0 #1f7a2c; }
  @keyframes pulse { 50% { filter: brightness(1.08); transform: scale(1.03); } }
  .btn2 { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; border-radius: 22px; font-size: 15px; letter-spacing: 2px; color: #fff;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.1)); border: 2px solid rgba(255,255,255,.55);
    box-shadow: 0 4px 0 rgba(0,0,0,.25), 0 6px 16px rgba(0,0,0,.2); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .btn2:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .btn2 svg { width: 18px; height: 18px; }
  .link { background: none; color: #8a7aa8; font-size: 14px; letter-spacing: 3px; padding: 6px 14px; }

  /* ---------- menu ---------- */
  #menu { justify-content: space-between; background: linear-gradient(180deg, rgba(14,10,40,.55) 0%, rgba(14,10,40,0) 24%, rgba(14,10,40,0) 62%, rgba(14,10,40,.62) 100%); }
  .mtop, .mbot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .mtop { padding-top: 48px; } .mbot { padding-bottom: 44px; }
  .logo { display: flex; flex-direction: column; align-items: center; }
  .tiles { display: flex; gap: 5px; }
  .tiles b { width: 44px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; color: #4a2f17; border-radius: 10px;
    background: linear-gradient(180deg, #fffdf6, #f1dcb2); box-shadow: inset 0 -4px 0 #c99a5a, inset 0 2px 0 #fff, 0 5px 0 #8a5a24, 0 8px 14px rgba(0,0,0,.4); animation: bob 2.4s ease-in-out infinite; }
  .tiles b:nth-child(2) { animation-delay: .12s; } .tiles b:nth-child(3) { animation-delay: .24s; } .tiles b:nth-child(4) { animation-delay: .36s; } .tiles b:nth-child(5) { animation-delay: .48s; } .tiles b:nth-child(6) { animation-delay: .6s; }
  @keyframes bob { 0%, 70%, 100% { transform: translateY(0); } 35% { transform: translateY(-7px); } }
  .wheelword { font-size: clamp(58px, 17vw, 96px); line-height: .95; font-weight: 900; letter-spacing: 6px; margin-top: 4px;
    background: linear-gradient(180deg, #fffbe8 0%, #ffe27a 34%, #ff9a2e 66%, #e2541c 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #7a2a10) drop-shadow(0 0 18px rgba(255,170,80,.55)); }
  .tag { font-size: 12px; letter-spacing: 6px; color: #fff3dc; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
  .chap { font-size: 14px; letter-spacing: 3px; color: #ffe9b0; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .stats { font-size: 12px; letter-spacing: 1px; color: #f4eeff; text-shadow: 0 1px 3px #000; opacity: .9; }
  .stats b { color: #ffd86a; }

  /* ---------- panels ---------- */
  .dim { background: radial-gradient(ellipse at 50% 40%, rgba(30,20,70,.55), rgba(8,6,24,.88)); }
  .card { position: relative; width: min(92vw, 380px); padding: 22px 20px 16px; border-radius: 28px; color: var(--ink);
    background: linear-gradient(180deg, #ffffff 0%, #f4efff 60%, #e9e0fb 100%); border: 3px solid #fff;
    box-shadow: 0 10px 0 #b9a8e0, 0 24px 50px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .card h2, .ptitle { font-size: 34px; letter-spacing: 3px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #6a3aa8, 0 0 14px rgba(140,90,255,.4); }
  .ribbon { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); padding: 8px 34px; font-size: 20px; letter-spacing: 3px; white-space: nowrap; color: #fff;
    background: linear-gradient(180deg, #ff8ab0, #e8407a); border-radius: 10px; box-shadow: 0 4px 0 #9a1a48, 0 8px 16px rgba(0,0,0,.3); text-shadow: 0 2px 0 #9a1a48; }
  .wl { margin-top: 10px; font-size: 13px; letter-spacing: 4px; color: #8a7aa8; }
  .wt { font-size: 38px; letter-spacing: 2px; font-weight: 900; background: linear-gradient(180deg, #ffbe3a, #f06a1a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 #fff) drop-shadow(0 3px 0 rgba(160,60,0,.35)); }
  .stars { display: flex; gap: 6px; align-items: flex-end; height: 70px; }
  .stars i { width: 60px; height: 60px; display: block; transform: scale(0); background: no-repeat center/contain; }
  .stars i:nth-child(2) { width: 72px; height: 72px; }
  .stars i.on { animation: starIn .5s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  .stars i.off { animation: starIn .4s ease-out forwards; filter: grayscale(1) brightness(.8) opacity(.35); }
  @keyframes starIn { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
  .wrows { width: 100%; display: flex; flex-direction: column; gap: 5px; font-size: 15px; }
  .wrows div { display: flex; justify-content: space-between; padding: 6px 12px; border-radius: 12px; background: rgba(120,90,200,.09); }
  .wrows div.ok b { color: #2a9a4a; } .wrows div.no b { color: #b8a8cc; }
  .wcoins { display: flex; align-items: center; gap: 8px; font-size: 30px; color: #e8901a; font-weight: 900; text-shadow: 0 2px 0 #fff3c8; }
  .wchap { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12px; letter-spacing: 2px; color: #7a6a98; }
  .bar { height: 10px; border-radius: 6px; background: rgba(90,60,160,.15); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.2); }
  .bar i { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #7ad8ff, #8a6aff); transition: width .8s cubic-bezier(.3, 1.3, .5, 1); }
  .chapdone { font-size: 13px; letter-spacing: 1px; color: #fff; background: linear-gradient(90deg, #8a6aff, #e05aa8); padding: 6px 14px; border-radius: 12px; }
  .pbtns { display: flex; flex-direction: column; gap: 14px; align-items: center; margin-top: 6px; }
  .pbtns .btn { min-width: 230px; font-size: 22px; padding: 10px 30px 12px; animation: none; }
  .ptxt { font-size: 15px; color: #6a5a88; }

  /* ---------- map & shop ---------- */
  .sheet { justify-content: flex-start; padding-top: max(16px, env(safe-area-inset-top)); background: radial-gradient(ellipse at 50% 0%, #3a2a80, #1a1240 55%, #0c0820); }
  .phead { width: min(94vw, 760px); display: flex; align-items: center; gap: 14px; min-height: 44px; padding-right: 110px; }
  .x { width: 44px; height: 44px; border-radius: 50%; font-size: 20px; color: #fff; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.4); flex: none; }
  .scroll { width: min(94vw, 760px); flex: 1; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 8px 4px 70px; }
  .mapList { position: relative; display: flex; flex-direction: column; gap: 16px; }
  .mapList::before { content: ""; position: absolute; left: 50%; top: 20px; bottom: 20px; border-left: 4px dotted rgba(255,230,160,.35); }
  .cc { position: relative; display: flex; gap: 12px; align-items: center; width: 88%; padding: 8px; border-radius: 20px; text-align: left;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); border: 2px solid rgba(255,255,255,.25); box-shadow: 0 6px 16px rgba(0,0,0,.35); }
  .cc:nth-child(even) { align-self: flex-end; flex-direction: row-reverse; text-align: right; }
  .cc canvas { width: 46%; max-width: 220px; aspect-ratio: 16/9; border-radius: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.4); flex: none; }
  .cc .ci { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .cc .cn { font-size: 11px; letter-spacing: 3px; color: #c8b8ff; }
  .cc .ct { font-size: 19px; letter-spacing: 1px; color: #fff; }
  .cc .cl { font-size: 12px; color: #e0d8f8; opacity: .8; }
  .cc .cs { font-size: 13px; color: #ffd86a; }
  .cc.cur { border-color: #ffd86a; box-shadow: 0 0 0 3px rgba(255,216,106,.35), 0 6px 18px rgba(0,0,0,.4); }
  .cc.cur::after { content: "YOU ARE HERE"; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: 2px; padding: 3px 10px; border-radius: 8px; background: #ffd86a; color: #5a3a00; }
  .cc.lock { filter: saturate(.25) brightness(.65); }
  .tabs { display: flex; gap: 8px; margin: 4px 0 2px; }
  .tabs button { padding: 9px 22px; border-radius: 18px; font-size: 14px; letter-spacing: 2px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.3); }
  .tabs button.on { background: linear-gradient(180deg, #ffe07a, #f39a2a); color: #5a2a00; border-color: #fff4c8; }
  .shopGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .sc { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 8px 12px; border-radius: 18px; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05)); border: 2px solid rgba(255,255,255,.22); }
  .sc.eq { border-color: #7aff9a; box-shadow: 0 0 0 3px rgba(122,255,154,.25); }
  .sc canvas { width: 100%; max-width: 170px; aspect-ratio: 17/11; }
  .sc .sn { font-size: 13px; letter-spacing: 2px; }
  .sc button { min-width: 110px; padding: 7px 12px; border-radius: 14px; font-size: 13px; letter-spacing: 1px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    background: linear-gradient(180deg, #ffe07a, #f39a2a); color: #5a2a00; box-shadow: 0 3px 0 #a9480e; }
  .sc button.own { background: linear-gradient(180deg, #8ae8ff, #3a9ae8); color: #fff; box-shadow: 0 3px 0 #1a5a9a; }
  .sc button.on { background: #2aa84a; color: #fff; box-shadow: 0 3px 0 #146a2a; }
  .sc button.poor { filter: grayscale(.7); opacity: .7; }
  .sc button .coin { width: 16px; height: 16px; } .sc button .coin::after { font-size: 9px; }

  @media (orientation: landscape) and (min-aspect-ratio: 21/20) {
    #menu { align-items: flex-start; padding-left: max(28px, env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(14,10,40,.62) 0%, rgba(14,10,40,.35) 40%, rgba(14,10,40,0) 52%); }
    .mtop, .mbot { width: 46%; } .mtop { padding-top: 4px; } .mbot { padding-bottom: 0; }
  }
  @media (max-height: 700px) and (min-height: 521px) {
    .tiles b { width: 38px; height: 42px; font-size: 26px; } .wheelword { font-size: 60px; } .btn { padding: 10px 46px 12px; font-size: 24px; }
    .stars { height: 58px; } .stars i { width: 50px; height: 50px; } .stars i:nth-child(2) { width: 60px; height: 60px; } .card { gap: 6px; padding: 18px 18px 10px; } .wt { font-size: 30px; }
    .dim { padding-top: 58px; } .wrows { font-size: 14px; gap: 4px; } .wrows div { padding: 4px 12px; } .wl { letter-spacing: 2px; font-size: 12px; } .wcoins { font-size: 26px; } .stats { display: none; } .ribbon { font-size: 17px; padding: 6px 26px; top: -18px; }
  }
  @media (max-width: 400px) { .row { gap: 7px; } .btn2 { padding: 8px 11px; font-size: 13px; letter-spacing: 1px; gap: 5px; } .btn2 svg { width: 15px; height: 15px; } }
  @media (max-height: 520px) {
    .overlay { gap: 6px; } .mtop, .mbot { gap: 6px; }
    .tiles b { width: 30px; height: 33px; font-size: 20px; border-radius: 7px; } .wheelword { font-size: 44px; letter-spacing: 4px; } .tag { font-size: 10px; letter-spacing: 4px; }
    .btn { padding: 7px 36px 9px; font-size: 20px; } .btn small { font-size: 11px; } .btn2 { padding: 7px 12px; font-size: 13px; } .stats { display: none; }
    .card { flex-direction: row; flex-wrap: wrap; justify-content: center; width: min(94vw, 640px); padding: 12px 16px 10px; gap: 6px 14px; }
    .card .wrows { width: 46%; } .card .wt { font-size: 28px; } .stars { height: 48px; } .stars i { width: 42px; height: 42px; } .stars i:nth-child(2) { width: 48px; height: 48px; }
    .wrows div { padding: 3px 10px; font-size: 13px; } .wcoins { font-size: 24px; } .card h2, .ptitle { font-size: 26px; }
    .pbtns { flex-direction: row; } .pbtns .btn { min-width: 0; font-size: 17px; padding: 8px 20px 10px; }
    .wl { margin-top: 0; width: 100%; } .wchap { width: 60%; }
    .ribbon { top: -18px; font-size: 15px; padding: 5px 22px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div id="safe"></div>
<div id="coinsTop"><span class="coin"></span><span id="coinNum">0</span></div>

<div class="overlay" id="menu">
  <div class="mtop">
    <div class="logo"><div class="tiles"><b>L</b><b>E</b><b>T</b><b>T</b><b>E</b><b>R</b></div><div class="wheelword">WHEEL</div></div>
    <div class="tag">SWIPE · SPELL · DISCOVER</div>
  </div>
  <div class="mbot">
    <div class="chap" id="menuChap">CHAPTER 1 · DAWN PEAKS</div>
    <button class="btn" id="startBtn">PLAY<small id="startLvl">LEVEL 1</small></button>
    <div class="row">
      <button class="btn2" id="mapBtn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>MAP</button>
      <button class="btn2" id="shopBtn"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3a9 9 0 0 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1-.8-1.4-.8-2.3 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.6" fill="#e8507a"/><circle cx="10" cy="7" r="1.6" fill="#ffc83a"/><circle cx="15" cy="7.2" r="1.6" fill="#3ac8ff"/></svg>SKINS</button>
      <button class="btn2" id="sfxBtn">SFX ON</button>
    </div>
    <div class="stats" id="menuStats"></div>
  </div>
</div>

<div class="overlay hidden dim" id="win">
  <div class="card">
    <div class="ribbon" id="winRibbon">LEVEL COMPLETE</div>
    <div class="wl" id="winLvl">LEVEL 1</div>
    <div class="wt" id="winTitle">SPLENDID!</div>
    <div class="stars" id="winStars"><i></i><i></i><i></i></div>
    <div class="wrows" id="winRows"></div>
    <div class="wcoins"><span class="coin"></span><span id="winCoins">+0</span></div>
    <div class="chapdone" id="winChapDone">CHAPTER COMPLETE</div>
    <div class="wchap"><span id="winChap">DAWN PEAKS</span><div class="bar"><i id="winBar"></i></div><span id="winProg">1/10</span></div>
    <button class="btn green" id="nextBtn">NEXT</button>
    <button class="link" id="winHome">HOME</button>
  </div>
</div>

<div class="overlay hidden dim" id="fail">
  <div class="card">
    <div class="ribbon" style="background:linear-gradient(180deg,#ffb04a,#f0602a);box-shadow:0 4px 0 #a0360c">TIME'S UP!</div>
    <div class="wl" id="failLvl">LEVEL 5</div>
    <div class="ptxt" id="failTxt">You found 3 of 6 words.</div>
    <div class="pbtns">
      <button class="btn green" id="moreBtn">+30 SEC</button>
      <button class="btn" id="retryBtn">RETRY</button>
    </div>
    <button class="link" id="failHome">HOME</button>
  </div>
</div>

<div class="overlay hidden dim" id="pause">
  <div class="card">
    <div class="ribbon" style="background:linear-gradient(180deg,#a88aff,#6a4ae0);box-shadow:0 4px 0 #3a2a90">PAUSED</div>
    <div class="wl" id="pauseLvl">LEVEL 1</div>
    <div class="pbtns">
      <button class="btn green" id="resumeBtn">RESUME</button>
      <button class="btn" id="restartBtn">RESTART</button>
    </div>
    <div class="row"><button class="link" id="pauseSfx">SFX ON</button><button class="link" id="pauseHome">HOME</button></div>
  </div>
</div>

<div class="overlay hidden sheet" id="map">
  <div class="phead"><button class="x" id="mapClose">✕</button><div class="ptitle">JOURNEY</div></div>
  <div class="scroll" id="mapScroll"><div class="mapList" id="mapList"></div></div>
</div>

<div class="overlay hidden sheet" id="shop">
  <div class="phead"><button class="x" id="shopClose">✕</button><div class="ptitle">SKINS</div></div>
  <div class="tabs"><button id="tabTiles" class="on">TILES</button><button id="tabWheels">WHEELS</button></div>
  <div class="scroll"><div class="shopGrid" id="shopGrid"></div></div>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;

    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;

  }
  function stopMusic() {

    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';

    e.stopPropagation(); e.preventDefault();

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();

    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();

    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`

    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {

        init();

        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();

        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },

// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};

// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }

  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {

      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }
        else if (p.shape === 'heart') { ctx.rotate(p.rot * .2); heart(ctx, p.size); }
        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }

        ctx.restore(); ctx.shadowBlur = 0;

        ctx.restore();
      }

    },
    drawFlash(ctx, W, H) { if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  };
})();

    if (!owned.includes(i)) { if (SAVE.coins < list[i].price) { bumpCoins(true); return; } SAVE.coins -= list[i].price; coinShow = SAVE.coins; updateCoinPill(); owned.push(i); if (audioOn) { audio.sfx(880, .2, 'triangle', .05); setTimeout(() => audio.sfx(1320, .3, 'triangle', .05), 120); } }
    if (tiles) SAVE.tile = i; else SAVE.wheel = i; saveNow(); renderShop(); updateMenu();
  }
  $('shopBtn').onclick = openShop; $('shopClose').onclick = () => { $('shop').classList.add('hidden'); updateMenu(); };
  $('tabTiles').onclick = () => { shopTab = 'tiles'; renderShop(); }; $('tabWheels').onclick = () => { shopTab = 'wheels'; renderShop(); };

  // ---------- main loop ----------
  let last = performance.now(), fps = 60, fpsN = 0, fpsT = 0;
  function frame(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    fpsN++; fpsT += dt; if (fpsT >= 1) { fps = fpsN / fpsT; fpsN = 0; fpsT = 0; }
    if (!paused) update(dt); else { T += dt; ambUpdate(dt * .3); }
    for (let i = TOPP.length - 1; i >= 0; i--) { const p = TOPP[i]; p.life -= dt; p.vy += 400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life <= 0) TOPP.splice(i, 1); }
    render();
    if (TOPP.length) { fxDirty = true; for (const p of TOPP) { fctx.globalAlpha = Math.min(1, p.life * 2); fctx.fillStyle = p.c; fctx.fillRect(p.x - 3, p.y - 3, 6, 6); } fctx.globalAlpha = 1; }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);

  // ---------- test hook ----------
  function validateLevels(a, b) {
    const out = { ok: 0, bad: [], ms: 0, samples: [] }, t0 = performance.now();
    for (let n = a; n <= b; n++) {
      let lv; try { lv = genLevel(n); } catch (e) { out.bad.push(n + ': ' + e.message); continue; }
      const grid = {}; lv.cells.forEach(c => grid[c.x + ',' + c.y] = c.ch); let ok = lv.words.length >= 3;
      for (const w of lv.words) {
        if (!WordKit.isWord(w.w) || WordKit.rank(w.w) < 0 || !okWord(w.w) || !WordKit.canForm(w.w, lv.letters.join(''))) ok = false;
        for (let i = 0; i < w.w.length; i++) if (grid[(w.x + (w.d ? 0 : i)) + ',' + (w.y + (w.d ? i : 0))] !== w.w[i]) ok = false;
      }
      const set = new Set(lv.words.map(w => w.x + ',' + w.y + ',' + w.d + ',' + w.w));
      for (let d = 0; d < 2; d++) for (const c of lv.cells) { if (grid[(c.x - (d ? 0 : 1)) + ',' + (c.y - (d ? 1 : 0))]) continue; let s = '', x = c.x, y = c.y; while (grid[x + ',' + y]) { s += grid[x + ',' + y]; d ? y++ : x++; } if (s.length > 1 && !set.has(c.x + ',' + c.y + ',' + d + ',' + s)) ok = false; }
      if (lv.golden && (!isValid(lv.golden) || !WordKit.canForm(lv.golden, lv.base))) ok = false;
      if (ok) out.ok++; else out.bad.push(n);
      if ([1, 2, 5, 10, 15, 40, 100, 150, 200, 300].includes(n)) out.samples.push(`${n}: [${lv.letters.join('').toUpperCase()}] ${lv.cols}x${lv.rows} ${lv.challenge || ''} ${lv.words.map(w => w.w).join(',')}${lv.golden ? ' golden=' + lv.golden : ''}${lv.time ? ' time=' + lv.time : ''}`);
    }
    out.ms = Math.round(performance.now() - t0); return out;
  }
  window.__lw = {
    G: () => G, save: () => SAVE, start, fps: () => fps, bgMs: () => BG && BG.ms, gen: genLevel, check: validateLevels,
    state: () => G && { n: G.n, attract: G.attract, state: G.state, challenge: G.lv.challenge, words: G.words.map(w => w.w), found: G.words.filter(w => w.found).map(w => w.w), letters: G.letters.map(l => l.ch).join(''), bonus: [...G.bonus], hints: G.hints, coins: SAVE.coins, timeLeft: G.timeLeft, golden: G.golden, goldenFound: G.goldenFound, goal: G.goal, paused, chapter: chapterName(chapterOf(G.n)), win: !$('win').classList.contains('hidden'), fail: !$('fail').classList.contains('hidden') },
    level: n => { ['win', 'fail', 'pause', 'map', 'shop', 'menu'].forEach(id => $(id).classList.add('hidden')); paused = false; menuHole = null; if (!audioOn) { audio.start(); audioOn = true; } SAVE.cur = null; SAVE.level = n; newGame(n, false, false); },
    autopilot: v => { G.autopilot = v; G.bot = null; },
    letterXY: i => letterXY(i), letterOf: ch => G.letters.findIndex(l => l.ch === ch), cellXY: k => cellXY(G.cells.get(k)), layout: () => JSON.parse(JSON.stringify(L)),
    path: w => mapWord(w), coins: n => { SAVE.coins += n; coinShow = SAVE.coins; updateCoinPill(); saveNow(); }, unlockAll: () => { SAVE.tiles = TILE_SKINS.map((s, i) => i); SAVE.wheels = WHEEL_SKINS.map((s, i) => i); saveNow(); },
    skin: (t, w) => { SAVE.tile = t; SAVE.wheel = w; saveNow(); }, renderOnce: () => render(), dbg: DBG, timeLeft: s => { G.timeLeft = s; }, pause, resume, showMenu, openMap, openShop
  };

  // ---------- boot ----------
  resize();
  HAND = mk(100, 120);
  loadSprites({ hand: svgDoc('<path d="M40 10 c6 0 10 4 10 10 v36 c2-4 7-5 10-4 c4 1 6 4 6 8 c2-4 7-5 10-3 c4 2 5 5 5 9 c2-3 6-4 9-2 c3 2 4 5 4 9 v22 c0 18-12 31-30 31 h-9 c-14 0-22-8-28-20 l-13-25 c-2-5 0-9 5-10 c4-1 8 1 10 5 l6 10 v-66 c0-6 4-10 10-10z" fill="#ffffff" stroke="#3a2a5a" stroke-width="4" stroke-linejoin="round"/><path d="M60 60 v18 M76 66 v14 M91 74 v10" stroke="#c8bce0" stroke-width="3" stroke-linecap="round"/>', '0 0 110 130') }, [100, 120]).then(r => { HAND = r.hand; });
  loadAllSprites();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
