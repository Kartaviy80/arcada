<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Zombie Siege</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  #menu { background: radial-gradient(ellipse at 50% 42%, rgba(5,7,12,0), rgba(5,7,12,.55) 55%, rgba(5,7,12,.92) 100%); }
  .logo { position: relative; transform: rotate(-3deg); }
  .title { font-family: Impact, "Arial Black", "Avenir Next Condensed", sans-serif; font-size: clamp(64px, 19vw, 132px); line-height: .84; letter-spacing: 2px;
    background: linear-gradient(180deg, #fff4e4 0%, #ffb08a 26%, #e8281a 56%, #5a0404 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #2a0000) drop-shadow(0 0 26px rgba(255,40,20,.55)); }
  .title span { display: block; font-size: .62em; letter-spacing: .32em; margin-left: .3em; background: linear-gradient(180deg, #f0f2f4, #a8b0bc 55%, #3a424c); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #0a0c10); }
  .drip { position: absolute; top: 44%; width: 7px; border-radius: 0 0 6px 6px; background: linear-gradient(#c8140a, #6a0202); animation: drip 4s ease-in infinite; transform-origin: top; }
  .drip::after { content: ''; position: absolute; bottom: -5px; left: -2px; width: 11px; height: 11px; border-radius: 50%; background: #8a0606; }
  @keyframes drip { 0% { height: 0; opacity: 1; } 70% { height: var(--h); opacity: 1; } 100% { height: var(--h); opacity: 0; } }
  .tag { font-size: 13px; letter-spacing: 8px; font-weight: 800; color: #ffcfb8; text-shadow: 0 0 10px #ff3a1a; }
  .heroes { display: flex; align-items: center; gap: 10px; }
  .heroes canvas { width: 120px; height: 120px; }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,140,110,.6); background: rgba(255,60,30,.1); color: #fff; font-size: 20px; font-weight: 900; cursor: pointer; }
  .skin { font-size: 15px; font-weight: 900; letter-spacing: 4px; color: #ffb08a; min-height: 20px; } .skin.lock { color: #8890a8; }
  .stat { font-size: 14px; letter-spacing: 1px; color: #e8dcd8; } .stat b { color: #ffd04a; }
  .btn { border: 2px solid #ff8a6a; padding: 14px 58px; border-radius: 8px; font-family: Impact, "Arial Black", sans-serif; font-size: 26px; letter-spacing: 7px; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #e0301e, #7a0a06); box-shadow: 0 6px 0 #3a0302, 0 0 28px rgba(255,40,20,.5); text-shadow: 0 2px 0 #3a0302; animation: pulse 1.6s ease-in-out infinite; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #3a0302, 0 0 28px rgba(255,40,20,.5); }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #3a0302, 0 0 46px rgba(255,60,30,.85); } }
  .hint { font-size: 12px; letter-spacing: 1px; color: #b8a8a4; max-width: 520px; }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(60,0,0,.75), rgba(5,4,6,.95)); }
  #over h2 { font-family: Impact, "Arial Black", sans-serif; font-size: clamp(58px, 16vw, 104px); letter-spacing: 4px; color: #e8201a; text-shadow: 0 4px 0 #3a0000, 0 0 40px rgba(255,20,10,.7); transform: rotate(-2deg); }
  #overScore { font-size: 54px; font-weight: 900; text-shadow: 0 0 20px rgba(255,120,80,.6); }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #2a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,220,80,.8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; font-size: 14px; color: #d8c8c4; text-align: left; } .grid b { color: #fff; float: right; margin-left: 12px; }
  #pause { background: rgba(5,6,10,.7); font-family: Impact, "Arial Black", sans-serif; font-size: 34px; letter-spacing: 8px; }
  #cards { background: radial-gradient(ellipse at 50% 50%, rgba(20,6,4,.7), rgba(4,4,8,.9)); }
  #cards h3 { font-family: Impact, "Arial Black", sans-serif; font-size: 34px; letter-spacing: 5px; color: #ffd04a; text-shadow: 0 3px 0 #4a2a00, 0 0 22px rgba(255,180,40,.5); }
  #cards .csub { font-size: 13px; letter-spacing: 5px; color: #d8c8c4; margin: -6px 0 16px; }
  .cardrow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .card { position: relative; width: 152px; padding: 16px 12px 12px; border-radius: 10px; border: 2px solid rgba(255,255,255,.12); background: linear-gradient(180deg, #2a2420, #14100e); box-shadow: 0 8px 0 #050404, 0 0 0 1px #000, 0 0 24px rgba(0,0,0,.6); cursor: pointer; transition: transform .15s; overflow: hidden; }
  .card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--c); box-shadow: 0 0 16px var(--c); }
  .card:hover, .card:active { transform: translateY(-4px) scale(1.04); }
  .card img { width: 66px; height: 66px; display: block; margin: 2px auto 0; }
  .card .nm { font-family: Impact, "Arial Black", sans-serif; font-size: 18px; letter-spacing: 1px; margin: 6px 0 4px; color: var(--c); }
  .card .ds { font-size: 12px; color: #d8ccc8; line-height: 1.35; }
  .card .lv { font-size: 10px; color: #8a7e7a; margin-top: 8px; letter-spacing: 2px; display: flex; gap: 4px; justify-content: center; }
  .card .lv i { width: 10px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); }
  .card .lv i.on { background: var(--c); } .card .lv i.nx { background: #fff; animation: blink .6s infinite alternate; }
  @keyframes blink { from { opacity: .3; } to { opacity: 1; } }
  @media (max-width: 420px) { #cards h3 { font-size: 27px; letter-spacing: 3px; } .card { width: 146px; } }
  @media (max-height: 520px) {
    .overlay { gap: 6px; padding: 8px 16px; } .title { font-size: 54px; } .tag { font-size: 10px; letter-spacing: 4px; } .drip { display: none; }
    .heroes canvas { width: 72px; height: 72px; } .arrow { width: 34px; height: 34px; font-size: 15px; } .btn { padding: 9px 40px; font-size: 20px; } .hint { display: none; }
    #over h2 { font-size: 44px; } #overScore { font-size: 34px; } .grid { font-size: 12px; gap: 3px 18px; }
    .card { width: 132px; padding: 10px 8px 8px; } .card img { width: 42px; height: 42px; } #cards h3 { font-size: 24px; } #cards .csub { margin: -4px 0 8px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="overlay" id="menu">
  <div class="tag">☣ HOLD THE NIGHT ☣</div>
  <div class="logo"><div class="title">ZOMBIE<span>SIEGE</span></div>
    <i class="drip" style="left:14%;--h:34px;animation-delay:.2s"></i><i class="drip" style="left:37%;--h:22px;animation-delay:1.4s"></i><i class="drip" style="left:58%;--h:40px;animation-delay:2.1s"></i><i class="drip" style="left:83%;--h:26px;animation-delay:.9s"></i></div>
  <div class="heroes"><button class="arrow" id="prevHero">◀</button><canvas id="heroPrev" width="240" height="240"></canvas><button class="arrow" id="nextHero">▶</button></div>
  <div class="skin" id="skinName"></div>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">SURVIVE</button>
  <div class="hint">Left stick moves · aim is automatic (or use the right stick / mouse) · ROLL dodges · GRENADE clears crowds · WASD + mouse on desktop</div>
</div>
<div class="overlay hidden" id="cards"><h3 id="cardsTitle">NIGHT SURVIVED</h3><div class="csub">PICK A PERK</div><div class="cardrow" id="cardRow"></div></div>
<div class="overlay hidden" id="over">
  <h2>YOU DIED</h2>
  <div id="overScore">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <button class="btn" id="againBtn">AGAIN</button>
  <div class="hint" id="unlockMsg"></div>
</div>
<div class="overlay hidden" id="pause">PAUSED<div class="hint">tap to continue</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {

  // ---------- perks between nights ----------

  const ICONS = {};

      case 'speed': L(() => { x.moveTo(-34, -30); x.lineTo(-6, 0); x.lineTo(-34, 30); }, S, 10); L(() => { x.moveTo(4, -30); x.lineTo(32, 0); x.lineTo(4, 30); }, S, 10); break;

  function showCards() {
    if (G.attract) { nextNight(); return; }
    const pool = PERKS.filter(c => c.ok ? c.ok() : c.lv() < c.max), pk = []; while (pk.length < 3 && pool.length) pk.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);

      el.onclick = () => { c.go(); $('cards').classList.add('hidden'); ctl.setEnabled(true); paused = false; last = performance.now(); sfx(523, .15, 'square', .05, 784); nextNight(); }; $('cardRow').appendChild(el); });
    $('cardsTitle').textContent = 'NIGHT ' + G.night + ' SURVIVED'; G.banner = null; $('cards').classList.remove('hidden'); ctl.setEnabled(false); paused = true;
  }
  // ---------- menu, game over, loop ----------
  let paused = false, last = performance.now();
  function start() {
    audio.start(); audioOn = true; if (!flameHum) flameHum = audio.hum('sawtooth', 380);
    $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('cards').classList.add('hidden'); $('pause').classList.add('hidden');
    paused = false; ctl.setEnabled(true); FX.clear(); newRun(false);
  }
  $('startBtn').onclick = start; $('againBtn').onclick = start;
  function gameOver() {
    const sc = Math.floor(G.score), prev = SAVE.best, nb = sc > prev; if (nb) SAVE.best = sc; SAVE.kills += G.kills; SAVE.bestNight = Math.max(SAVE.bestNight, G.night - 1); saveNow();
    $('overScore').textContent = fmt(sc); $('newBest').style.display = nb ? 'block' : 'none';
    $('overStats').innerHTML = [['Night', G.night], ['Kills', fmt(G.kills)], ['Best streak', G.bestCombo], ['Bosses', G.bosses]].map(([a, b]) => '<div>' + a + '<b>' + b + '</b></div>').join('');
    const un = SKINS.filter(s => s.need > prev && s.need <= SAVE.best).map(s => s.name); $('unlockMsg').textContent = un.length ? 'NEW SURVIVOR UNLOCKED: ' + un.join(', ') : 'Best: ' + fmt(SAVE.best) + ' · Night ' + SAVE.bestNight;
    $('over').classList.remove('hidden'); ctl.setEnabled(false); if (flameHum) flameHum.set(60, 0); updateMenu();
  }
  let prevSkin = SAVE.skin;

    g.globalAlpha = locked ? .35 : 1; g.drawImage(SHADE, -50, -44, 110, 110);

  }
  $('prevHero').onclick = () => { prevSkin = (prevSkin + SKINS.length - 1) % SKINS.length; drawPreview(); };
  $('nextHero').onclick = () => { prevSkin = (prevSkin + 1) % SKINS.length; drawPreview(); };
  addEventListener('keydown', e => { if (e.code === 'Enter' && !$('menu').classList.contains('hidden')) start(); else if (e.code === 'Escape' && !paused) pause(); else if (paused && $('cards').classList.contains('hidden') && $('pause').classList.contains('hidden') === false) resume(); });
