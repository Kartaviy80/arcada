<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c2116">
<title>Tank Wars</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1c2116; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px 16px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  #menu { background: radial-gradient(ellipse at 50% 42%, rgba(20,26,14,.15), rgba(12,15,8,.55) 55%, rgba(6,8,4,.92) 100%); }
  .tag { font-size: 13px; letter-spacing: 6px; font-weight: 800; color: #ffd27a; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .title { font-size: clamp(64px, 19vw, 124px); font-weight: 900; line-height: .82; letter-spacing: 2px; font-style: italic; transform: skewX(-8deg);
    background: linear-gradient(180deg, #fffbe6 0%, #ffe08a 30%, #ffae2a 56%, #c4481a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #3a1806) drop-shadow(0 0 26px rgba(255,150,40,.5)); }
  .title span { display: block; background: linear-gradient(180deg, #ffffff 0%, #d4dde6 38%, #7d8b9a 62%, #39424e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #0e1218) drop-shadow(0 0 22px rgba(160,200,255,.3)); }
  .stripe { width: min(300px, 70vw); height: 8px; border-radius: 4px; background: repeating-linear-gradient(-45deg, #ffc02a 0 10px, #16180f 10px 20px); box-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .hangar { display: flex; align-items: center; gap: 8px; }
  .hangar canvas { width: 210px; height: 150px; }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,214,120,.75); background: rgba(30,36,22,.6); color: #ffd678; font-size: 18px; font-weight: 900; cursor: pointer; }
  .skin { font-size: 17px; font-weight: 900; letter-spacing: 3px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.7); min-height: 20px; } .skin.lock { color: #b8c0a8; }
  .perk { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #9fe07a; text-shadow: 0 1px 4px rgba(0,0,0,.8); min-height: 15px; margin-top: -6px; } .perk.lock { color: #e8a060; }
  .stat { font-size: 14px; color: #fff; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,.8); } .stat b { color: #ffd84a; }
  .btn { border: 0; padding: 16px 58px; border-radius: 14px; font: inherit; font-size: 25px; font-weight: 900; letter-spacing: 6px; color: #fff; cursor: pointer; text-shadow: 0 2px 0 rgba(90,30,0,.6);
    background: linear-gradient(180deg, #ffc65a, #f07a1e 60%, #c8501a); box-shadow: 0 0 0 3px #ffe6a8 inset, 0 7px 0 #6a2808, 0 14px 30px rgba(0,0,0,.45); animation: bob 1.4s ease-in-out infinite; }
  .btn2 { border: 2px solid rgba(255,214,120,.6); padding: 9px 30px; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 900; letter-spacing: 4px; color: #ffd678; background: rgba(30,36,22,.65); cursor: pointer; }
  @keyframes bob { 50% { transform: translateY(-3px) scale(1.03); } }
  .hint { font-size: 12px; color: #e4ead8; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(50,16,6,.6), rgba(8,8,6,.93)); }
  #over h2 { font-size: clamp(38px, 11vw, 70px); font-weight: 900; font-style: italic; color: #ff9a3a; line-height: .95; text-shadow: 0 4px 0 #4a1404, 0 0 26px rgba(255,120,40,.7); }
  #overScore { font-size: 56px; font-weight: 900; text-shadow: 0 0 20px rgba(255,200,90,.7); }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #2a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; border-radius: 8px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,220,80,.8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 24px; font-size: 14px; color: #dfe4d4; text-align: left; } .grid b { color: #fff; float: right; margin-left: 12px; }
  #pause { background: rgba(8,10,6,.62); } .ptitle { font-size: 34px; font-weight: 900; letter-spacing: 8px; color: #ffd678; text-shadow: 0 3px 0 #3a1806; }
  #pauseBtn { position: fixed; z-index: 5; left: 10px; top: max(10px, env(safe-area-inset-top)); width: 40px; height: 40px; border-radius: 12px; border: 2px solid rgba(255,214,120,.55);
    background: rgba(20,24,14,.55); color: #ffd678; font: 900 15px sans-serif; letter-spacing: 1px; cursor: pointer; }
  #pauseBtn.hidden { display: none; }
  #garage { background: radial-gradient(ellipse at 50% 35%, rgba(30,40,20,.72), rgba(6,8,4,.95)); gap: 10px; }
  .gClear { font-size: clamp(34px, 9vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 2px; transform: skewX(-6deg);
    background: linear-gradient(180deg, #ffffff, #ffe08a 45%, #ff9a2a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #3a1806); }
  .gStats { font-size: 13px; color: #dfe6cf; letter-spacing: 1px; } .gStats b { color: #ffd84a; }
  .gHead { font-size: 13px; font-weight: 900; letter-spacing: 5px; color: #9fe07a; margin-top: 4px; }
  .cards { display: flex; gap: 12px; justify-content: center; width: 100%; max-width: 760px; }
  .card { flex: 1 1 0; max-width: 232px; min-width: 0; border: 0; border-radius: 16px; padding: 14px 12px 14px; cursor: pointer; color: #fff; font: inherit; text-align: center;
    background: linear-gradient(180deg, rgba(64,74,50,.96), rgba(22,26,18,.97)); box-shadow: 0 0 0 2px rgba(255,200,80,.5) inset, 0 10px 24px rgba(0,0,0,.55);
    display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .12s; animation: cardIn .5s backwards; }
  .card.rare { box-shadow: 0 0 0 2px rgba(120,220,255,.75) inset, 0 0 22px rgba(90,200,255,.35), 0 10px 24px rgba(0,0,0,.55); }
  .card:nth-child(2) { animation-delay: .08s; } .card:nth-child(3) { animation-delay: .16s; }
  .card:hover, .card:focus { transform: translateY(-4px) scale(1.03); outline: none; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(26px) scale(.9); } }
  .card svg { width: 66px; height: 66px; flex: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
  .card .tx { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
  .card .nm { font-weight: 900; font-size: 15px; letter-spacing: 1px; color: #ffd860; } .card.rare .nm { color: #8ae0ff; }
  .card .ds { font-size: 12.5px; color: #d8e0c8; line-height: 1.25; }
  .card .lv { display: flex; gap: 3px; } .lv i { width: 11px; height: 6px; border-radius: 2px; background: rgba(255,255,255,.16); } .lv i.on { background: #ffc83a; box-shadow: 0 0 6px #ffc83a; } .lv i.nw { background: #9fe07a; box-shadow: 0 0 8px #9fe07a; }
  @media (max-width: 600px) {
    .cards { flex-direction: column; max-width: 380px; gap: 9px; }
    .card { flex-direction: row; text-align: left; max-width: none; padding: 10px 14px; gap: 12px; }
    .card .tx { align-items: flex-start; } .card svg { width: 54px; height: 54px; } .gHead { letter-spacing: 2px; }
  }
  @media (max-height: 520px) {
    .overlay { gap: 5px; padding: 8px 16px; }
    .title { font-size: 48px; } .tag { font-size: 10px; letter-spacing: 4px; } .stripe { height: 5px; }
    .hangar canvas { width: 126px; height: 90px; } .arrow { width: 34px; height: 34px; font-size: 14px; }
    .btn { padding: 9px 40px; font-size: 19px; } .hint { display: none; } .stat, .skin { font-size: 12px; } .perk { font-size: 10px; margin-top: -3px; }
    #over h2 { font-size: 34px; } #overScore { font-size: 34px; } .grid { font-size: 12px; gap: 2px 18px; } #newBest { font-size: 12px; padding: 3px 10px; }
    .gClear { font-size: 30px; } .gStats, .gHead { font-size: 11px; } .card { padding: 8px 10px; gap: 4px; } .card svg { width: 40px; height: 40px; } .card .ds { font-size: 11px; } .card .nm { font-size: 13px; }
    #garage .hint { display: block; font-size: 10px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button id="pauseBtn" class="hidden" aria-label="Pause">II</button>
<div class="overlay" id="menu">
  <div class="tag">★ ARMORED ASSAULT ★</div>
  <div class="title">TANK<span>WARS</span></div>
  <div class="stripe"></div>
  <div class="hangar"><button class="arrow" id="prevTank" aria-label="Previous tank">◀</button><canvas id="tankPrev" width="420" height="300"></canvas><button class="arrow" id="nextTank" aria-label="Next tank">▶</button></div>
  <div class="skin" id="skinName"></div>
  <div class="perk" id="skinPerk"></div>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">DEPLOY</button>
  <div class="hint">Drag to drive · turret fires by itself · WASD + Space (MG) · E (mine) · Q (strike)</div>
</div>
<div class="overlay hidden" id="garage">
  <div class="gClear" id="gClear">STAGE CLEAR</div>
  <div class="gStats" id="gStats"></div>
  <div class="gHead">GARAGE · CHOOSE ONE UPGRADE</div>
  <div class="cards" id="cards"></div>
  <div class="hint" id="gNext"></div>
</div>
<div class="overlay hidden" id="over">
  <h2 id="overTitle">TANK DESTROYED</h2>
  <div id="overScore">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <button class="btn" id="againBtn">REDEPLOY</button>
  <button class="btn2" id="menuBtn">MENU</button>
  <div class="hint" id="unlockMsg"></div>
</div>
<div class="overlay hidden" id="pause"><div class="ptitle">PAUSED</div><div class="hint">tap to continue</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
