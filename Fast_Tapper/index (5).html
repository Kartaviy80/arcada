<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3aa8f0">
<title>Rocket Tap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #3aa8f0;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; color: #fff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse at 50% 35%, rgba(40,70,160,.94), rgba(6,8,30,.97)); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 250px; height: 250px; }
  h1 { font-size: clamp(42px, 13vw, 70px); font-weight: 900; letter-spacing: 2px; line-height: .95; color: #fff;
    -webkit-text-stroke: 3px #e8402a; text-shadow: 0 5px 0 #8a1a0a, 0 0 30px #ff9a4a; }
  p { max-width: 320px; font-size: 15px; line-height: 1.55; color: #d8e4ff; }
  .stat { font-size: 17px; font-weight: 800; color: #d8e4ff; } .stat b { color: #ffd24a; }
  .big { font-size: 42px; font-weight: 900; color: #ffd24a; text-shadow: 0 0 20px #ff9a2a; }
  .btn { border: 4px solid #fff; background: linear-gradient(#ff7a4a, #d8301a); color: #fff; font: inherit; font-size: 21px; font-weight: 900; letter-spacing: 4px; padding: 14px 50px; border-radius: 40px; cursor: pointer;
    box-shadow: 0 6px 0 #7a1a08, 0 12px 24px rgba(0,0,0,.4); text-shadow: 0 2px 0 #7a1a08; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px) scale(1.03); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay" id="menu">
  <canvas id="logo" width="500" height="500"></canvas>
  <h1>ROCKET<br>TAP</h1>
  <p><b>Fuel up — fast!</b> You have six seconds: tap as quickly as you can to pump fuel. Then launch, catch stars and fuel cans on the way up, and pass the mission altitude.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">COUNTDOWN</button>
</div>
<div class="overlay hidden" id="result">
  <canvas id="resArt" width="500" height="500"></canvas>
  <h1 id="resTitle">MISSION<br>COMPLETE</h1>
  <div class="stat" id="resLine">Mission 1</div>
  <div class="big" id="resAlt">0 m</div>
  <button class="btn" id="resBtn">NEXT MISSION</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = o.n || 14;
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }
        else if (p.shape === 'heart') { ctx.rotate(p.rot * .2); heart(ctx, p.size); }
        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * (.4 + k * .6), 0, TAU); ctx.fill(); }
        ctx.restore(); ctx.shadowBlur = 0;
      }
      for (const t of texts) {
        const age = t.max - t.life, pop = age < .18 ? 1 + Math.sin(age / .18 * Math.PI) * .45 : 1, a = Math.min(1, t.life / t.max * 2.2);
        ctx.save(); ctx.globalAlpha = a; ctx.translate(t.x, t.y); ctx.scale(pop, pop); if (t.wobble) ctx.rotate(Math.sin(age * 20) * t.wobble);
        ctx.font = t.font + t.size + 'px "Avenir Next", "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, t.size * .16); ctx.strokeStyle = t.stroke; ctx.strokeText(t.str, 0, 0); ctx.fillStyle = t.c; ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },
    drawFlash(ctx, W, H) { if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  };
})();
/*FX-END*/
(() => {
  const audio = GameAudio({
    bpm: 132, scale: 'lydian', root: 55, prog: [0, 4, 1, 5], seed: 806,
    waves: { lead: 'sawtooth', bass: 'triangle', arp: 'square', pad: 'sine' },
    pad: true, arp: true, arpEvery: 1, arpOct: 2, arpCutoff: 2400, leadOct: 1, leadCutoff: 2000, leadDensity: 0.32, drums: true, bassPattern: [0, 4, 8, 12], volume: 0.15,
    btnBg: 'rgba(255,255,255,.2)', btnColor: '#fff'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'rocket_tap';
  let save = { stage: 1, best: 0 }; try { save = Object.assign(save, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
  $('bestMenu').innerHTML = save.best ? 'Highest flight <b>' + fmtAlt(save.best) + '</b> · mission <b>' + save.stage + '</b>' : '';
  function fmtAlt(m) { return m >= 10000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m'; }

  // ---------- endless missions ----------
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const altOf = taps => 140 * Math.pow(taps, 1.12);
  function mission(n) {
    // taps worth of altitude: rises quickly at first, then slowly toward ~7 taps a second, so stars and cans matter more later
    const r = rng(n * 313), need = 14 + 30 * (1 - Math.exp(-(n - 1) / 14)) + r() * 2 + Math.log(n) * 1.5;
    return { target: Math.round(altOf(need) / 10) * 10, stars: Math.min(14, 4 + Math.floor(n / 2)), rocket: Math.floor(r() * 4), planet: Math.floor(r() * 360) };
  }

  // ---------- art ----------
  const lg = (id, stops, x2 = 0, y2 = 1) => '<linearGradient id="' + id + '" x1="0" y1="0" x2="' + x2 + '" y2="' + y2 + '">' + stops.map(([o, c]) => '<stop offset="' + o + '" stop-color="' + c + '"/>').join('') + '</linearGradient>';
  const rg = (id, stops, cx = '40%', cy = '35%', r = '70%') => '<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '">' + stops.map(([o, c]) => '<stop offset="' + o + '" stop-color="' + c + '"/>').join('') + '</radialGradient>';
  const PAINT = [['#f4f6fa', '#e8303a'], ['#f4f6fa', '#2a6ad8'], ['#ffe24a', '#2a2a34'], ['#e8f8ff', '#8a3ad8']];
  function rocketSVG(k) {
    const [body, trim] = PAINT[k];
    return svgDoc('<defs>' + lg('b', [[0, shade(body, -.35)], [.35, body], [.6, '#ffffff'], [1, shade(body, -.45)]], 1, 0) + lg('t', [[0, shade(trim, -.3)], [.4, trim], [.7, shade(trim, .3)], [1, shade(trim, -.4)]], 1, 0) +

      '<circle cx="60" cy="122" r="7" fill="url(#w)" stroke="#1a1a2a" stroke-width="2"/>' +

  }
  const STAR = svgDoc('<defs>' + rg('s', [[0, '#fffbd0'], [.5, '#ffd21a'], [1, '#e88a00']]) + '</defs><path d="M50 4L62 36L96 37L69 58L79 92L50 72L21 92L31 58L4 37L38 36Z" fill="url(#s)" stroke="#a85a00" stroke-width="3" stroke-linejoin="round"/><ellipse cx="42" cy="34" rx="8" ry="5" fill="#fff" opacity=".7"/><circle cx="42" cy="50" r="3.4" fill="#5a2a00"/><circle cx="58" cy="50" r="3.4" fill="#5a2a00"/><path d="M42 62q8 6 16 0" stroke="#5a2a00" stroke-width="3" fill="none" stroke-linecap="round"/>');
  const CAN = svgDoc('<defs>' + lg('c', [[0, '#8a1a0a'], [.3, '#ff5a3a'], [.6, '#ff9a7a'], [1, '#8a1a0a']], 1, 0) + '</defs><rect x="22" y="18" width="56" height="74" rx="10" fill="url(#c)" stroke="#3a0a04" stroke-width="3"/><rect x="40" y="6" width="20" height="14" rx="3" fill="#c8d4e0" stroke="#3a444e" stroke-width="2.4"/><path d="M50 36L38 60H50L44 80L64 52H52L58 36Z" fill="#ffe24a" stroke="#8a5a00" stroke-width="2"/>');
  let SPR = null;
  Promise.all([loadSprites({ r0: rocketSVG(0), r1: rocketSVG(1), r2: rocketSVG(2), r3: rocketSVG(3) }, [120, 214]), loadSprites({ star: STAR, can: CAN }, 100)]).then(([a, b]) => { SPR = Object.assign({}, a, b); art($('logo'), 0); });

  // ---------- state ----------
  let W, H, DPR, M = null, phase = 'menu', t = 0, stage = 1, taps = 0, fuelT = 0, rate = [], alt = 0, peak = 0, flightT = 0, flightDur = 0, bonus = 0, items = [], shake = 0, countdown = 0, clouds = [], stars = [];
  function resize() {

    clouds = Array.from({ length: 14 }, (_, i) => ({ x: Math.random() * W, y: i * 260 + Math.random() * 120, s: .6 + Math.random() * .9 }));
    stars = Array.from({ length: 160 }, () => ({ x: Math.random() * W, y: Math.random() * H, b: Math.random() }));
  }
  addEventListener('resize', resize);

  // ---------- flow ----------
  function startMission(n) {
    stage = n; M = mission(n); taps = 0; fuelT = 6; rate = []; alt = 0; peak = 0; bonus = 0; items = []; flightT = 0; countdown = 3; phase = 'count'; FX.clear();
    for (const o of ['menu', 'result']) $(o).classList.add('hidden');
  }
  $('startBtn').onclick = () => { if (!SPR) return; audio.start(); startMission(save.stage); };
  $('resBtn').onclick = () => startMission(save.stage);
  addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (phase === 'menu') $('startBtn').click(); else tap(W / 2, H / 2); } });
  canvas.addEventListener('pointerdown', e => tap(e.clientX, e.clientY));
  function tap(x, y) {
    if (phase === 'fuel') {
      taps++; rate.push(t); shake = 1;
      FX.burst(x, y, { n: 4, colors: ['#ffe24a', '#ffffff'], shape: 'spark', speed: 260, size: 6, gravity: 0, life: .2 });
      FX.text(x, y - 20, '+1', { color: '#ffe24a', size: 22, stroke: '#7a1a08', rise: 90, life: .5 });
      audio.sfx(300 + Math.min(40, taps) * 18, .05, 'square', .04);
      // little puffs at the nozzle
      FX.burst(W / 2, rocketY() + rocketH() * .5, { n: 3, colors: ['#ffffff', '#e8eef4'], speed: 120, size: 12, gravity: -20, life: .7 });
    } else if (phase === 'flight') {
      let hit = null; for (const it of items) if (!it.got && Math.hypot(x - it.x, y - it.sy) < 40) hit = it;
      if (hit) {
        hit.got = true; const add = hit.kind === 'can' ? .1 : .05; bonus += add; peak = (altOf(taps)) * (1 + bonus);
        FX.burst(x, y, { n: 18, colors: hit.kind === 'can' ? ['#ff5a3a', '#ffe24a'] : ['#ffe24a', '#fff6b0'], shape: 'star', speed: 320, size: 8, gravity: 200, glow: 1 });
        FX.text(x, y - 20, '+' + Math.round(add * 100) + '% ALT', { color: '#ffe24a', size: 24, stroke: '#3a1a00' });
        audio.sfx(hit.kind === 'can' ? 520 : 880, .12, 'square', .05, 1320);
      }
    }
  }
  const rocketH = () => Math.min(H * .3, 230), rocketY = () => phase === 'flight' || phase === 'done' ? H * .5 : H * .74 - rocketH() * .5;
  function launch() {
    phase = 'flight'; peak = altOf(taps); flightT = 0; flightDur = 4.5 + Math.min(4, peak / M.target * 2);
    FX.burst(W / 2, H * .84, { n: 60, colors: ['#ffffff', '#e8eef4', '#c8d4e0'], speed: 500, size: 22, gravity: -40, life: 1.6, drag: .95 }); FX.shake(16, .8); FX.flash('#ffe8a0', .5);
    audio.sfx(60, 1.6, 'sawtooth', .12, 30); audio.sfx(120, 1.2, 'square', .05, 50);
    // stars and fuel cans placed along the way up, in screen space they drift down
    for (let i = 0; i < M.stars; i++) items.push({ kind: Math.random() < .25 ? 'can' : 'star', x: W * (.15 + Math.random() * .7), t0: .6 + i * (flightDur - 1.2) / M.stars, got: false, sy: -100 });
  }
  function finish() {
    phase = 'done'; const ok = alt >= M.target;
    if (ok) save.stage = stage + 1; save.best = Math.max(save.best, Math.round(alt)); store();
    if (ok) { FX.burst(W / 2, H * .4, { n: 90, colors: ['#ff4a6a', '#ffe24a', '#7af0ff', '#ffffff', '#7ae04a'], shape: 'square', speed: 620, size: 10, gravity: 300, life: 1.6 }); [523, 659, 784, 1046, 1318].forEach((f, k) => setTimeout(() => audio.sfx(f, .3, 'square', .05), k * 110)); }
    else audio.sfx(300, .8, 'sawtooth', .05, 100);
    setTimeout(() => {
      $('resTitle').innerHTML = ok ? 'MISSION<br>COMPLETE' : 'NOT HIGH<br>ENOUGH'; $('resLine').innerHTML = 'Mission <b>' + stage + '</b> · target <b>' + fmtAlt(M.target) + '</b> · ' + taps + ' taps';
      $('resAlt').textContent = fmtAlt(alt); $('resBtn').textContent = ok ? 'NEXT MISSION' : 'TRY AGAIN'; art($('resArt'), ok ? 1 : 2); $('result').classList.remove('hidden');
    }, 1200);
  }
  window.__rt = { phase: () => phase, stage: () => stage, alt: () => alt, target: () => M && M.target, taps: () => taps, items: () => items.filter(i => !i.got && i.sy > 60 && i.sy < H - 60).map(i => ({ x: i.x, y: i.sy })), mission };

  // ---------- update ----------
  function update(dt) {
    t += dt; FX.update(dt); shake = Math.max(0, shake - dt * 6);
    if (phase === 'count') { const before = Math.ceil(countdown); countdown -= dt; if (Math.ceil(countdown) !== before && countdown > 0) audio.sfx(660, .12, 'square', .05); if (countdown <= 0) { phase = 'fuel'; audio.sfx(1320, .25, 'square', .06); } }
    else if (phase === 'fuel') { fuelT -= dt; rate = rate.filter(x => t - x < 1); if (fuelT <= 0) launch(); }
    else if (phase === 'flight') {
      flightT += dt; const k = Math.min(1, flightT / flightDur); alt = peak * (1 - Math.pow(1 - k, 2.2));
      for (const it of items) { const rel = (flightT - it.t0) / 1.8; it.sy = -60 + rel * (H + 120); }
      if (Math.random() < .9) FX.burst(W / 2 + (Math.random() - .5) * 10, H * .5 + rocketH() * .55, { n: 1, colors: ['#ffffff', '#e8eef4'], speed: 60, size: 10 + Math.random() * 8, gravity: 300, life: .8, drag: .97 });
      if (k >= 1) finish();
    }
  }

  // ---------- render ----------
  function skyAt(a) {
    // colours from the ground up into space
    const k = Math.min(1, a / Math.max(4000, M ? M.target * 1.2 : 4000));
    const lerp = (c1, c2, u) => c1.map((v, i) => Math.round(v + (c2[i] - v) * u));
    const stops = [[0, [90, 190, 250], [200, 240, 255]], [.35, [40, 110, 220], [140, 200, 250]], [.7, [16, 24, 80], [60, 60, 140]], [1, [4, 4, 16], [14, 10, 40]]];

  }
  function drawRocket(x, y, h, power) {
    const w = h * 120 / 214, jit = phase === 'fuel' ? (Math.random() - .5) * shake * 6 : phase === 'flight' ? (Math.random() - .5) * 2 : 0;
    // flame
    if (power > 0) {
      const fl = h * (.25 + power * .55) * (1 + Math.sin(t * 40) * .08), fx = x + jit, fy = y + h * .48;
      for (const [c, s] of [['rgba(255,120,30,.6)', 1], ['rgba(255,200,60,.85)', .7], ['rgba(255,255,230,.95)', .4]]) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(fx - w * .2 * s, fy); ctx.quadraticCurveTo(fx, fy + fl * s * 1.2, fx + w * .2 * s, fy); ctx.fill(); }
      const gl = ctx.createRadialGradient(fx, fy + fl * .3, 0, fx, fy + fl * .3, fl); gl.addColorStop(0, 'rgba(255,200,80,.45)'); gl.addColorStop(1, 'rgba(255,200,80,0)'); ctx.fillStyle = gl; ctx.fillRect(fx - fl, fy - fl * .7, fl * 2, fl * 2);
    }

  }
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const [ox, oy] = FX.offset(); ctx.translate(ox, oy);
    const [top, bot, k] = skyAt(alt), sg = ctx.createLinearGradient(0, 0, 0, H); sg.addColorStop(0, 'rgb(' + top + ')'); sg.addColorStop(1, 'rgb(' + bot + ')'); ctx.fillStyle = sg; ctx.fillRect(-20, -20, W + 40, H + 40);
    // stars fade in with height, streaking during flight
    if (k > .3) for (const s of stars) { const y = (s.y + alt * .02 * (.4 + s.b)) % H; ctx.fillStyle = 'rgba(255,255,255,' + (k - .3) * (.3 + s.b * .7) + ')'; ctx.fillRect(s.x, y, 1.6, phase === 'flight' ? 1.6 + 6 * s.b : 1.6); }
    // a big generated planet near the top of the climb
    if (M && k > .55) { const pr = Math.min(W, H) * .5, px = W * .8, py = H * .2 + (1 - k) * H, pg = ctx.createRadialGradient(px - pr * .3, py - pr * .3, pr * .1, px, py, pr); pg.addColorStop(0, 'hsl(' + M.planet + ',80%,72%)'); pg.addColorStop(.7, 'hsl(' + M.planet + ',60%,40%)'); pg.addColorStop(1, 'hsl(' + M.planet + ',60%,18%)'); ctx.globalAlpha = Math.min(1, (k - .55) * 3); ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, pr, 0, 7); ctx.fill(); ctx.strokeStyle = 'hsla(' + ((M.planet + 40) % 360) + ',80%,80%,.6)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(px, py, pr * 1.5, pr * .25, -.3, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
    // clouds scroll past in the lower sky
    if (k < .6) for (const c of clouds) { const y = (c.y + alt * .9) % (14 * 260) - 260, a = Math.max(0, 1 - k * 1.8); if (y < -100 || y > H + 100) continue; ctx.fillStyle = 'rgba(255,255,255,' + a * .9 + ')'; ctx.beginPath(); for (const [dx, dy, r] of [[0, 0, 40], [44, -14, 32], [84, 0, 36], [-36, 8, 28]]) { ctx.moveTo(c.x + dx * c.s + r * c.s, y + dy * c.s); ctx.arc(c.x + dx * c.s, y + dy * c.s, r * c.s, 0, 7); } ctx.fill(); }
    if (!SPR || !M || phase === 'menu') { FX.draw(ctx); return; }
    // the launch site sinks away as we climb
    const groundY = H * .84 + alt * .8;
    if (groundY < H + 300) {
      ctx.fillStyle = '#5aa83a'; ctx.fillRect(-20, groundY, W + 40, H); ctx.fillStyle = '#7ac84a'; ctx.fillRect(-20, groundY, W + 40, 8);
      ctx.fillStyle = '#8a96a2'; ctx.fillRect(W / 2 - 90, groundY - 14, 180, 16); ctx.fillStyle = '#5a646e'; ctx.fillRect(W / 2 - 90, groundY, 180, 8);
      // gantry tower
      const gx = W / 2 + rocketH() * .55, gh = rocketH() * 1.2; ctx.strokeStyle = '#e8402a'; ctx.lineWidth = 4; ctx.strokeRect(gx, groundY - 14 - gh, 26, gh); ctx.lineWidth = 2; for (let y = groundY - 14 - gh; y < groundY - 14; y += 20) { ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx + 26, y + 20); ctx.moveTo(gx + 26, y); ctx.lineTo(gx, y + 20); ctx.stroke(); }
      if (phase !== 'flight' && phase !== 'done') { ctx.strokeStyle = '#5a646e'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(gx, groundY - 14 - gh * .6); ctx.lineTo(W / 2 + 16, groundY - 14 - gh * .6); ctx.stroke(); }
    }
    // target line during flight
    if (phase === 'flight' || phase === 'done') {
      const ty = H * .5 - (M.target - alt) * .6; if (ty > -20 && ty < H + 20) { ctx.setLineDash([12, 8]); ctx.strokeStyle = '#ffe24a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(W, ty); ctx.stroke(); ctx.setLineDash([]); ctx.font = '900 16px sans-serif'; ctx.fillStyle = '#ffe24a'; ctx.textAlign = 'left'; ctx.fillText('MISSION ' + fmtAlt(M.target), 12, ty - 8); }
      for (const it of items) if (!it.got && it.sy > -60 && it.sy < H + 60) { const z = it.kind === 'can' ? 52 : 46; ctx.save(); ctx.translate(it.x, it.sy); ctx.rotate(Math.sin(t * 3 + it.x) * .2); ctx.shadowColor = '#ffe24a'; ctx.shadowBlur = 16; ctx.drawImage(SPR[it.kind], -z / 2, -z / 2, z, z); ctx.restore(); }
    }
    const rh = rocketH(), ry = phase === 'flight' || phase === 'done' ? H * .5 : Math.min(H * .84 - 14 - rh * .5 + alt * .8, H * .74);
    drawRocket(W / 2, ry, rh, phase === 'fuel' ? Math.min(1, rate.length / 10) * .5 : phase === 'flight' ? Math.max(.25, 1 - flightT / flightDur) : 0);
    FX.draw(ctx);
    // HUD
    const label = (txt, x, y, size, col, align = 'center', stroke = '#0a1a4a') => { ctx.font = '900 ' + size + 'px "Avenir Next", sans-serif'; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, size * .2); ctx.strokeStyle = stroke; ctx.strokeText(txt, x, y); ctx.fillStyle = col; ctx.fillText(txt, x, y); };
    label('MISSION ' + stage, 16, 24, 17, '#ffe24a', 'left');
    label('TARGET ' + fmtAlt(M.target), W - 16, 24, 15, '#ffffff', 'right');
    if (phase === 'count') { label(Math.ceil(countdown), W / 2, H * .38, 120, '#ffffff', 'center', '#e8402a'); label('GET READY TO TAP!', W / 2, H * .38 + 80, 24, '#ffe24a'); }
    if (phase === 'fuel') {
      label('TAP! TAP! TAP!', W / 2, H * .14, 40 + Math.sin(t * 16) * 3, '#ffffff', 'center', '#e8402a');
      label(fuelT.toFixed(1) + 's', W / 2, H * .14 + 46, 24, '#ffe24a');
      // pressure gauge
      const gx = W / 2, gy = H * .38, gr = Math.min(W * .3, 110), kk = Math.min(1, altOf(taps) / (M.target * 1.25));
      ctx.fillStyle = 'rgba(10,20,50,.6)'; ctx.beginPath(); ctx.arc(gx, gy, gr + 10, Math.PI, 0); ctx.fill();
      for (let i = 0; i <= 20; i++) { const a = Math.PI + i / 20 * Math.PI, c = i < 12 ? '#7ae04a' : i < 16 ? '#ffe24a' : '#ff4a3a'; ctx.strokeStyle = c; ctx.lineWidth = i % 5 ? 2 : 4; ctx.beginPath(); ctx.moveTo(gx + Math.cos(a) * gr * .8, gy + Math.sin(a) * gr * .8); ctx.lineTo(gx + Math.cos(a) * gr, gy + Math.sin(a) * gr); ctx.stroke(); }
      const ta = Math.PI + Math.min(1, M.target / (M.target * 1.25)) * Math.PI; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(gx + Math.cos(ta) * gr * .7, gy + Math.sin(ta) * gr * .7); ctx.lineTo(gx + Math.cos(ta) * (gr + 10), gy + Math.sin(ta) * (gr + 10)); ctx.stroke();
      const na = Math.PI + kk * Math.PI + Math.sin(t * 50) * .02 * shake; ctx.strokeStyle = '#ff4a3a'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + Math.cos(na) * gr * .85, gy + Math.sin(na) * gr * .85); ctx.stroke(); ctx.fillStyle = '#c8d4e0'; ctx.beginPath(); ctx.arc(gx, gy, 9, 0, 7); ctx.fill();
      label(taps + ' taps · ' + rate.length + '/s', W / 2, gy + 26, 18, '#ffffff');
    }
    if (phase === 'flight' || phase === 'done') { label(fmtAlt(alt), W / 2, 64, 40, alt >= M.target ? '#7ae04a' : '#ffffff'); if (bonus) label('+' + Math.round(bonus * 100) + '% bonus', W / 2, 98, 16, '#ffe24a'); }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); FX.drawFlash(ctx, W, H);
  }
  function art(cv, mode) {
    const g = cv.getContext('2d'); g.clearRect(0, 0, 500, 500);
    const glow = g.createRadialGradient(250, 250, 20, 250, 250, 250); glow.addColorStop(0, mode === 2 ? 'rgba(160,160,200,.4)' : 'rgba(255,180,90,.5)'); glow.addColorStop(1, 'rgba(255,180,90,0)'); g.fillStyle = glow; g.fillRect(0, 0, 500, 500);
    for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(255,255,255,' + (.3 + (i % 3) * .2) + ')'; g.fillRect((i * 97) % 500, (i * 53) % 500, 2, 2); }
    g.save(); g.translate(250, 230); g.rotate(mode === 2 ? .5 : .25);
    if (mode !== 2) for (const [c, s] of [['rgba(255,120,30,.7)', 1], ['rgba(255,200,60,.9)', .7], ['rgba(255,255,230,1)', .4]]) { g.fillStyle = c; g.beginPath(); g.moveTo(-40 * s, 110); g.quadraticCurveTo(0, 110 + 180 * s, 40 * s, 110); g.fill(); }
    g.drawImage(SPR['r' + (mode === 1 ? 1 : 0)], -67, -120, 134, 240); g.restore();
    g.drawImage(SPR.star, 380, 80, 80, 80); g.drawImage(SPR.star, 60, 330, 60, 60); g.drawImage(SPR.can, 70, 90, 70, 70);
  }

  resize();
  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
