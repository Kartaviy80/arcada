<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4e4c4">
<title>Market Balance</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f4e4c4;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; color: #4a2e14;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(52px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; }
  .hud b { font-size: 24px; font-weight: 900; letter-spacing: 3px; color: #c0462a; text-shadow: 0 2px 0 #fff8e8; }
  .hud div { font-size: 13px; font-weight: 700; color: #8a6a44; margin-top: 2px; letter-spacing: 1px; }
  .tools { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 10px; right: 64px; display: flex; justify-content: center; }
  .tools button { padding: 10px 18px; border-radius: 14px; border: 3px solid #fff8e8; background: #d8603a; color: #fff; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 #8a3418; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse at 50% 40%, #fffaf0f2, #f0d8acf2); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 230px; height: 230px; }
  h1 { font-size: clamp(36px, 10.5vw, 58px); font-weight: 900; letter-spacing: 3px; color: #d8603a; line-height: 1.05; text-shadow: 0 3px 0 #fff, 0 6px 0 #8a3418, 0 10px 18px #0003; }
  p { max-width: 310px; font-size: 15px; line-height: 1.6; color: #6a4a24; }
  .stat { font-size: 16px; color: #6a4a24; font-weight: 700; } .stat b { color: #c0462a; }
  .stars { font-size: 42px; letter-spacing: 6px; color: #ffc21a; text-shadow: 0 3px 0 #a86a10; } .stars i { color: #e8d4ae; text-shadow: none; font-style: normal; }
  .btn { border: 4px solid #fff; background: linear-gradient(#f08a5a, #c8462a); color: #fff; font: inherit; font-size: 19px; font-weight: 900; letter-spacing: 4px; padding: 13px 46px; border-radius: 40px; cursor: pointer; box-shadow: 0 5px 0 #8a3418, 0 10px 20px #8a341855; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #8a3418; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b id="level">STALL 1</b><div id="sub">Hang every item and level the beam</div></div>
<div class="tools"><button id="reset">⟳ Clear</button></div>

<div class="overlay" id="menu">
  <canvas id="logo" width="460" height="460"></canvas>
  <h1>MARKET<br>BALANCE</h1>
  <p><b>Level the scale with everything in the basket.</b> Drag each item onto a peg. Weight × distance must match on both sides — a 2 on peg 3 balances a 3 on peg 2.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">OPEN STALL</button>
</div>
<div class="overlay hidden" id="win">
  <canvas id="winArt" width="460" height="460"></canvas>
  <h1>BALANCED!</h1>
  <div class="stars" id="stars">★★★</div>
  <div class="stat">Stall <b id="winLevel">1</b> · <b id="winMoves">0</b> moves</div>
  <button class="btn" id="nextBtn">NEXT</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
(() => {
  const audio = GameAudio({
    bpm: 104, scale: 'major', root: 60, prog: [0, 3, 4, 0], seed: 705,
    waves: { lead: 'triangle', bass: 'triangle', arp: 'sine', pad: 'sine' },
    pad: true, arp: true, arpEvery: 2, arpOct: 1, arpCutoff: 2200, leadOct: 1, leadDensity: 0.32, drums: 'soft', bassPattern: [0, 8, 12], swing: 0.16, volume: 0.16,
    btnBg: 'rgba(255,255,255,.7)', btnColor: '#d8603a'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'balance_scale_level';
  let level = 1; try { level = +localStorage.getItem(KEY) || 1; } catch (e) {}
  $('bestMenu').innerHTML = level > 1 ? 'Continue from stall <b>' + level + '</b>' : '';

  // ---------- puzzle generator ----------
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const FRUIT = [[1, 'berry'], [2, 'apple'], [3, 'pear'], [5, 'pumpkin'], [7, 'melon']];
  // a beam: { R pegs per side, items placed by peg -> item }, the sub beam hangs from main peg `hang`
  function generate(lv) {
    for (let tries = 0; tries < 3000; tries++) {
      const rnd = rng(lv * 9173 + tries * 31), R = lv < 3 ? 3 : lv < 7 ? 4 : 5, mobile = lv >= 7;
      const nItems = Math.min(6, 1 + Math.ceil(lv / 2)), items = [];
      const pool = lv < 4 ? FRUIT.slice(0, 3) : FRUIT;
      for (let i = 0; i < nItems; i++) { const [m, k] = pool[Math.floor(rnd() * pool.length)]; items.push({ m, k, id: i }); }
      const beams = [{ R, fixed: {}, sol: {} }];
      if (mobile) beams.push({ R: 3, fixed: {}, sol: {}, hang: (rnd() < .5 ? -1 : 1) * (2 + Math.floor(rnd() * (R - 2))) });
      const pegs = b => { const out = []; for (let p = -beams[b].R; p <= beams[b].R; p++) if (p) out.push(p); return out; };
      // drop the items on random free pegs (the hidden solution)
      let ok = true;
      for (const it of items) {
        const b = mobile && rnd() < .45 ? 1 : 0, free = pegs(b).filter(p => beams[b].sol[p] == null && !(b === 0 && mobile && p === beams[1].hang));
        if (!free.length) { ok = false; break; }
        beams[b].sol[free[Math.floor(rnd() * free.length)]] = it.id;
      }
      if (!ok) continue;
      const subMass = () => mobile ? Object.values(beams[1].sol).reduce((s, id) => s + items[id].m, 0) + Object.values(beams[1].fixed).reduce((s, m) => s + m, 0) : 0;
      const torque = b => Object.entries(beams[b].sol).reduce((s, [p, id]) => s + p * items[id].m, 0) + Object.entries(beams[b].fixed).reduce((s, [p, m]) => s + p * m, 0) + (b === 0 && mobile ? beams[1].hang * subMass() : 0);
      // cancel each beam's torque with a brass counterweight
      const cancel = b => {
        const T = torque(b); if (T === 0) return beams[b].R > 0 && rnd() < .5;
        const opts = [];
        for (const p of pegs(b)) { if (beams[b].sol[p] != null || beams[b].fixed[p] != null || (b === 0 && mobile && p === beams[1].hang)) continue; if ((-T) % p === 0) { const m = -T / p; if (m >= 1 && m <= 9) opts.push([p, m]); } }
        if (!opts.length) return false;
        const [p, m] = opts[Math.floor(rnd() * opts.length)]; beams[b].fixed[p] = m; return true;
      };
      if (mobile && !cancel(1)) continue;
      if (mobile && Object.keys(beams[1].sol).length === 0) continue;
      if (torque(0) === 0) continue;
      if (!cancel(0)) continue;
      // the counterweight on the main beam must leave the starting scale tilted
      return { items, beams, mobile };
    }
  }

  // ---------- art ----------
  const lg = (id, stops, x2 = 0, y2 = 1) => '<linearGradient id="' + id + '" x1="0" y1="0" x2="' + x2 + '" y2="' + y2 + '">' + stops.map(([o, c]) => '<stop offset="' + o + '" stop-color="' + c + '"/>').join('') + '</linearGradient>';
  const rg = (id, stops, cx = '40%', cy = '35%', r = '70%') => '<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '">' + stops.map(([o, c]) => '<stop offset="' + o + '" stop-color="' + c + '"/>').join('') + '</radialGradient>';
  const ART = {
    berry: svgDoc('<defs>' + rg('b', [[0, '#ff8a8a'], [.6, '#e8202a'], [1, '#8a0a10']]) + '</defs>' +
      '<path d="M50 96Q20 80 18 50Q18 30 50 30Q82 30 82 50Q80 80 50 96Z" fill="url(#b)" stroke="#6a0a0a" stroke-width="2"/>' +
      Array.from({ length: 16 }, (_, i) => { const x = 30 + (i % 4) * 13 + (Math.floor(i / 4) % 2) * 6, y = 44 + Math.floor(i / 4) * 12; return '<ellipse cx="' + x + '" cy="' + y + '" rx="1.6" ry="2.6" fill="#ffe08a"/>'; }).join('') +
      '<path d="M30 32Q40 18 50 30Q60 16 72 32Q62 26 50 36Q38 26 30 32Z" fill="#3a9a2a" stroke="#1a5a10" stroke-width="1.6"/><path d="M50 30V12" stroke="#2a6a1a" stroke-width="4" stroke-linecap="round"/>' +
      '<ellipse cx="36" cy="46" rx="6" ry="10" fill="#fff" opacity=".35" transform="rotate(20 36 46)"/>'),
    apple: svgDoc('<defs>' + rg('a', [[0, '#ffb070'], [.5, '#e83a2a'], [1, '#8a1408']]) + '</defs>' +
      '<path d="M50 30Q28 18 16 40Q8 66 30 88Q40 98 50 90Q60 98 70 88Q92 66 84 40Q72 18 50 30Z" fill="url(#a)" stroke="#6a0e04" stroke-width="2"/>' +
      '<path d="M50 32Q52 18 58 10" stroke="#5a3010" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M56 18Q72 6 82 16Q70 26 56 18Z" fill="#4aa83a" stroke="#1a5a10" stroke-width="1.5"/>' +
      '<ellipse cx="32" cy="44" rx="7" ry="12" fill="#fff" opacity=".4" transform="rotate(25 32 44)"/><path d="M60 70q10-4 14-14" stroke="#ffd06a" stroke-width="2" fill="none" opacity=".6"/>'),
    pear: svgDoc('<defs>' + rg('p', [[0, '#fff2a0'], [.6, '#b8d03a'], [1, '#5a7a10']]) + '</defs>' +
      '<path d="M50 14Q62 14 62 34Q62 46 74 60Q86 78 70 92Q50 102 30 92Q14 78 26 60Q38 46 38 34Q38 14 50 14Z" fill="url(#p)" stroke="#4a5a0a" stroke-width="2"/>' +
      '<path d="M50 16Q50 6 46 2" stroke="#5a3010" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M52 10Q66 0 74 8Q64 16 52 10Z" fill="#4aa83a" stroke="#1a5a10" stroke-width="1.4"/>' +
      Array.from({ length: 12 }, (_, i) => '<circle cx="' + (32 + (i * 37) % 38) + '" cy="' + (52 + (i * 23) % 36) + '" r="1" fill="#7a6a10" opacity=".6"/>').join('') +
      '<ellipse cx="40" cy="64" rx="6" ry="12" fill="#fff" opacity=".35" transform="rotate(15 40 64)"/>'),
    pumpkin: svgDoc('<defs>' + rg('k', [[0, '#ffd08a'], [.55, '#f0861a'], [1, '#a84a08']]) + '</defs>' +
      '<ellipse cx="30" cy="62" rx="22" ry="30" fill="url(#k)" stroke="#7a3a04" stroke-width="2"/><ellipse cx="70" cy="62" rx="22" ry="30" fill="url(#k)" stroke="#7a3a04" stroke-width="2"/>' +
      '<ellipse cx="50" cy="62" rx="22" ry="32" fill="url(#k)" stroke="#7a3a04" stroke-width="2"/>' +
      '<path d="M50 32Q46 16 56 8" stroke="#5a6a1a" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M58 22q14-8 18 4" stroke="#4a8a2a" stroke-width="2.4" fill="none"/>' +
      '<ellipse cx="42" cy="50" rx="5" ry="14" fill="#fff" opacity=".3"/>'),
    melon: svgDoc('<defs>' + rg('m', [[0, '#9ae87a'], [.6, '#2a8a2a'], [1, '#0e4a10']]) + '<clipPath id="mc"><ellipse cx="50" cy="56" rx="44" ry="38"/></clipPath></defs>' +

    g.drawImage(SPR.brass, 300, 340, 90, 90); g.drawImage(SPR.pear, 80, 330, 90, 90);
  }

  resize();
  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
