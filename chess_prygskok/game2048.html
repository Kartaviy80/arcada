<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2048</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Clear+Sans:wght@700&family=Inter:wght@600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#faf8ef;font-family:'Inter',system-ui,sans-serif;color:#776e65;touch-action:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:420px;margin:0 auto;padding:max(env(safe-area-inset-top),8px) 12px max(env(safe-area-inset-bottom),8px)}
.header{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding:4px 0}
.logo{font-size:28px;font-weight:800;color:#776e65}
.score-box{background:#bbada0;color:#fff;border-radius:8px;padding:6px 14px;text-align:center}
.score-box .label{font-size:10px;text-transform:uppercase;opacity:.85}
.score-box .val{font-size:18px;font-weight:800}
.status{text-align:center;font-size:13px;font-weight:600;padding:6px 0;color:#8f7a66;flex-shrink:0;min-height:22px}
.status.win{color:#f67c5f;font-size:15px;font-weight:800}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#board{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;width:min(92vw,calc(100dvh - 170px));aspect-ratio:1;background:#bbada0;border-radius:10px;padding:8px}
.cell{background:rgba(238,228,218,.35);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(18px,7vw,32px)}
.t2{background:#eee4da;color:#776e65}.t4{background:#ede0c8;color:#776e65}
.t8{background:#f2b179;color:#f9f6f2}.t16{background:#f59563;color:#f9f6f2}
.t32{background:#f67c5f;color:#f9f6f2}.t64{background:#f65e3b;color:#f9f6f2}
.t128{background:#edcf72;color:#f9f6f2;font-size:clamp(16px,6vw,28px)}
.t256{background:#edcc61;color:#f9f6f2;font-size:clamp(16px,6vw,28px)}
.t512{background:#edc850;color:#f9f6f2;font-size:clamp(16px,6vw,28px)}
.t1024{background:#edc53f;color:#f9f6f2;font-size:clamp(14px,5vw,24px)}
.t2048{background:#edc22e;color:#f9f6f2;font-size:clamp(14px,5vw,24px)}
.controls{display:flex;gap:8px;justify-content:center;padding:8px 0 4px;flex-shrink:0}
button{font-family:inherit;background:#8f7a66;color:#f9f6f2;border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;min-height:42px}
button:active{transform:scale(.96)}
#btnMusic.active{background:#f2b179}
.hint{text-align:center;font-size:11px;color:#bbada0;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">2048</div>
    <div class="score-box"><div class="label">Score</div><div class="val" id="score">0</div></div>
  </div>
  <div class="status" id="status">Swipe to play</div>
  <div class="board-wrap"><div id="board"></div></div>
  <div class="controls">
    <button id="btnMusic" onclick="toggleMusic()">♪ Music</button>
    <button onclick="newGame()">New</button>
  </div>
  <div class="hint">Swipe or use arrows</div>
</div>
<script>
let grid,score,over,won;
const boardEl=document.getElementById('board');

let audioCtx=null,musicNodes=[],musicOn=false,musicTimer=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function stopMusic(){musicNodes.forEach(n=>{try{n.stop()}catch(e){}try{n.disconnect()}catch(e){}});musicNodes=[];if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function startMusic(){
  const ctx=ensureAudio();stopMusic();
  const m=ctx.createGain();m.gain.value=0.06;m.connect(ctx.destination);
  function tone(f,t,d){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.045,t+.5);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(m);o.start(t);o.stop(t+d+.05);musicNodes.push(o)}
  function loop(){const t=ctx.currentTime+.05;tone(261.63,t,3);tone(329.63,t+.5,2.5);tone(392,t+1.2,2);tone(523.25,t+2,2)}
  loop();musicTimer=setInterval(loop,4000);
}
function toggleMusic(){musicOn=!musicOn;document.getElementById('btnMusic').classList.toggle('active',musicOn);if(musicOn)startMusic();else stopMusic()}

function newGame(){
  grid=Array.from({length:4},()=>Array(4).fill(0));score=0;over=false;won=false;
  add();add();render();document.getElementById('status').textContent='Swipe to play';document.getElementById('status').className='status';
}
function add(){
  const empty=[];
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])empty.push([r,c]);
  if(!empty.length)return;
  const[r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}
function render(){
  boardEl.innerHTML='';
  document.getElementById('score').textContent=score;
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const cell=document.createElement('div');cell.className='cell';
    const v=grid[r][c];
    if(v){cell.textContent=v;cell.classList.add('t'+Math.min(v,2048))}
    boardEl.appendChild(cell);
  }
}
function slide(row){
  const arr=row.filter(x=>x);const out=[];
  for(let i=0;i<arr.length;i++){
    if(i<arr.length-1&&arr[i]===arr[i+1]){out.push(arr[i]*2);score+=arr[i]*2;if(arr[i]*2===2048)won=true;i++}
    else out.push(arr[i]);
  }
  while(out.length<4)out.push(0);return out;
}
function move(dir){
  if(over)return false;
  const prev=grid.map(r=>r.slice());
  if(dir==='L')grid=grid.map(r=>slide(r));
  if(dir==='R')grid=grid.map(r=>slide(r.reverse()).reverse());
  if(dir==='U'){const t=[[],[],[],[]];for(let c=0;c<4;c++){const col=slide([grid[0][c],grid[1][c],grid[2][c],grid[3][c]]);for(let r=0;r<4;r++)t[r][c]=col[r]}grid=t}
  if(dir==='D'){const t=[[],[],[],[]];for(let c=0;c<4;c++){const col=slide([grid[3][c],grid[2][c],grid[1][c],grid[0][c]]);for(let r=0;r<4;r++)t[3-r][c]=col[r]}grid=t}
  const changed=JSON.stringify(prev)!==JSON.stringify(grid);
  if(changed){add();render();if(won){document.getElementById('status').textContent='You reached 2048!';document.getElementById('status').className='status win'}
  if(!canMove()){over=true;document.getElementById('status').textContent='Game over';document.getElementById('status').className='status win'}}
  return changed;
}
function canMove(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(!grid[r][c])return true;
    if(c<3&&grid[r][c]===grid[r][c+1])return true;
    if(r<3&&grid[r][c]===grid[r+1][c])return true;
  }return false;
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){e.preventDefault();move('L')}
  if(e.key==='ArrowRight'){e.preventDefault();move('R')}
  if(e.key==='ArrowUp'){e.preventDefault();move('U')}
  if(e.key==='ArrowDown'){e.preventDefault();move('D')}
});
let sx,sy;
boardEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
boardEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'R':'L');else move(dy>0?'D':'U');
},{passive:true});
newGame();
</script>
</body>
</html>
