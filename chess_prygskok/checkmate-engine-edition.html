<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d13"><title>CHECKMATE — ENGINE EDITION</title>
<style>
:root{--bg:#080c12;--accent:#70f5dc;--text:#f3f7f6;--muted:#9aabb8;--light:#e4e5dc;--dark:#557b77}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 78% 5%,#245b62 0,transparent 30%),radial-gradient(ellipse at 8% 90%,#1c3043 0,transparent 35%),linear-gradient(145deg,#131b26,#080c12 62%,#10232a);color:var(--text);font-family:system-ui,sans-serif;display:flex;justify-content:center}#app{width:min(100%,560px);min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid #ffffff20}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#a2ffed,#32c9b4);color:#061a1a;display:grid;place-items:center;font-size:26px}.title{font-weight:900;letter-spacing:.14em}.subtitle{font-size:9px;color:var(--accent);letter-spacing:.16em;margin-top:4px}.pill{font-size:9px;color:var(--accent);border:1px solid #55f0d244;border-radius:7px;padding:7px}.player,.status,.engine{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #ffffff18;border-radius:13px;background:#ffffff08}.avatar{width:36px;height:36px;border-radius:10px;background:#dce7e1;color:#17211f;display:grid;place-items:center;font-size:24px}.avatar.dark{background:#26313d;color:#eef7f6}.info{flex:1;min-width:0}.name{font-size:11px;font-weight:900;letter-spacing:.07em}.sub{font-size:10px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.led{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px #55f0d2}#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;overflow:hidden;border-radius:12px;border:5px solid #1c2b32;box-shadow:0 22px 48px #000a,0 0 0 1px #70f5dc55,0 0 38px #70f5dc10;touch-action:manipulation}.sq{position:relative;display:grid;place-items:center;min-width:0;min-height:0;user-select:none}.light{background:linear-gradient(145deg,#e7e8df,#cfd8d0)}.dark{background:linear-gradient(145deg,#648b84,#466d68)}.selected{box-shadow:inset 0 0 0 3px var(--accent)}.last{box-shadow:inset 0 0 0 3px #f5df7588}.check{background:#d74760!important}.piece{font-family:"DejaVu Sans","Segoe UI Symbol",serif;font-size:clamp(31px,9.6vw,57px);line-height:1;z-index:1;filter:drop-shadow(0 3px 2px #0005);transform:translateY(-1px)}.white{color:#fffdf5;text-shadow:0 1px 1px #253a38,0 0 3px #253a38}.black{color:#172d2b;text-shadow:0 1px 0 #dce9dfaa}.coord{position:absolute;font-size:8px;font-weight:900;left:3px;bottom:3px;opacity:.8}.light .coord{color:#526a68}.dark .coord{color:#f3eadc}.dotmove{position:absolute;width:23%;height:23%;border-radius:50%;background:#10201966}.capture{position:absolute;inset:4%;border:3px solid #13231d66;border-radius:50%}.status{border-left:3px solid var(--accent)}.stitle{font-size:11px;font-weight:900}.stext,.detail{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}.engine{padding:10px}.detail{flex:1}.eval{font-size:12px;color:var(--accent);font-weight:900}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.btn{border:1px solid #ffffff24;border-radius:10px;background:#ffffff08;color:var(--text);font:inherit;font-size:10px;font-weight:850;min-height:42px}.primary{background:var(--accent);color:#071a19;border-color:var(--accent)}button:disabled{opacity:.4}.footer{font-size:8px;color:#647987;text-align:center;letter-spacing:.15em;margin-top:auto}@media(max-height:720px){#app{gap:6px;padding:8px}.player,.status,.engine{padding:7px}.avatar{width:30px;height:30px}.btn{min-height:35px}.footer{display:none}}
</style></head><body><main id="app"><header class="top"><div class="brand"><div class="logo">♞</div><div><div class="title">CHECKMATE</div><div class="subtitle">ENGINE EDITION · STOCKFISH</div></div></div><div class="pill" id="engineState">STARTING</div></header>
<section class="player"><div class="avatar dark">♚</div><div class="info"><div class="name">STOCKFISH · ENGINE</div><div class="sub" id="engineStatus">Loading engine…</div></div><div class="led"></div></section><div id="board"></div>
<section class="player"><div class="avatar">♘</div><div class="info"><div class="name">YOU · WHITE</div><div class="sub" id="playerStatus">Your move</div></div><div class="led"></div></section>
<section class="status"><div style="font-size:20px" id="statusIcon">♟</div><div class="info"><div class="stitle" id="statusTitle">Your move</div><div class="stext" id="statusText">Tap a piece to see legal moves.</div></div></section>
<section class="engine"><div>⌘</div><div class="detail"><b style="color:var(--text);letter-spacing:.08em">STOCKFISH ANALYSIS</b><div id="analysis">Waiting for first move</div></div><div class="eval" id="eval">—</div></section>
<div class="controls"><button class="btn" id="undo">↶ UNDO</button><button class="btn primary" id="new">＋ NEW GAME</button><button class="btn" id="flip">⇅ FLIP BOARD</button></div><div class="footer">LOCAL PLAY · FULL CHESS ENGINE · INTERNET REQUIRED</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script>
(()=>{const $=x=>document.getElementById(x),files='abcdefgh',glyph={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};let g,sel=null,moves=[],flip=false,last=null,worker=null,ready=false,failed=false,busy=false,searchTimer,waitTimer;
function status(t,s,i='♟'){$('statusTitle').textContent=t;$('statusText').textContent=s;$('statusIcon').textContent=i}
function render(){let b=$('board');b.innerHTML='';let matrix=g.board();for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){let r=flip?7-vr:vr,c=flip?7-vc:vc,n=files[c]+(8-r),p=matrix[r][c],e=document.createElement('div');e.className='sq '+((r+c)%2===0?'light':'dark');if(sel===n)e.classList.add('selected');if(last&&(last.from===n||last.to===n))e.classList.add('last');if(p&&p.type==='k'&&p.color===g.turn()&&g.in_check())e.classList.add('check');let opts=moves.filter(m=>m.to===n);if(opts.length){let d=document.createElement('span');d.className=p?'capture':'dotmove';e.appendChild(d)}if(p){let q=document.createElement('span');q.className='piece '+(p.color==='w'?'white':'black');q.textContent=glyph[p.color+p.type];e.appendChild(q)}if(vc===0){let q=document.createElement('span');q.className='coord';q.textContent=8-r;e.appendChild(q)}if(vr===7){let q=document.createElement('span');q.className='coord';q.style.cssText='left:auto;right:3px;top:3px;bottom:auto';q.textContent=files[c];e.appendChild(q)}e.onclick=()=>tap(n);b.appendChild(e)}$('undo').disabled=!g.history().length||busy;$('playerStatus').textContent=g.game_over()?result():busy?'Engine is thinking…':g.turn()==='w'?'Your move':'Engine turn'}
function result(){if(g.in_checkmate())return g.turn()==='w'?'Checkmate — Stockfish wins':'Checkmate — you win';if(g.in_stalemate())return'Draw by stalemate';if(g.in_draw())return'Draw';return'Game over'}
function refresh(){if(g.game_over())status(result(),'Start a new game to play again.','🏁');else if(busy)status('Stockfish is thinking',ready?'Searching variations at depth 16…':'Loading the engine…','⌘');else if(g.turn()==='w')status(g.in_check()?'Check! Your move':'Your move',g.in_check()?'Your king is in check.':'Tap a white piece to show legal moves.',g.in_check()?'⚠':'♟');else status('Stockfish to move','Calculating a response…','⌘')}
function tap(n){if(busy||g.game_over()||g.turn()!=='w')return;let p=g.get(n);if(sel){let cand=moves.filter(m=>m.to===n);if(cand.length){if(cand.some(m=>m.flags.includes('p'))){let choice=prompt('Promotion: q=queen, r=rook, b=bishop, n=knight','q')||'q';move(sel,n,['q','r','b','n'].includes(choice.toLowerCase())?choice.toLowerCase():'q');return}move(sel,n);return}if(p&&p.color==='w'){select(n);return}sel=null;moves=[];render();refresh();return}if(p&&p.color==='w')select(n)}
function select(n){sel=n;moves=g.moves({square:n,verbose:true});render();status('Piece selected',moves.length?'Choose a highlighted destination.':'No legal moves for this piece.','♘')}
function move(from,to,promotion='q'){let m=g.move({from,to,promotion});if(!m)return;last={from:m.from,to:m.to};sel=null;moves=[];render();if(g.game_over()){refresh();return}if(g.turn()==='b'){busy=true;render();refresh();askEngine()}else refresh()}
function askEngine(){if(!ready){let k=0;clearTimeout(waitTimer);const poll=()=>{if(g.game_over()||g.turn()!=='b'){busy=false;render();return}if(ready){search();return}if(failed||k++>80){engineFallback();return}waitTimer=setTimeout(poll,250)};poll()}else search()}
function engineFallback(){if(!g||g.game_over()||g.turn()!=='b')return;clearTimeout(searchTimer);busy=true;$('engineState').textContent='LOCAL AI';$('engineStatus').textContent='Local move search';$('analysis').textContent='Built-in fallback is choosing a legal move';setTimeout(()=>{if(!busy||g.game_over()||g.turn()!=='b')return;const all=g.moves({verbose:true});if(!all.length){busy=false;render();refresh();return}const value={p:100,n:320,b:330,r:500,q:900,k:20000};let best=[],bestScore=-Infinity;for(const m of all){let score=(m.captured?value[m.captured]*1.1:0)+(m.promotion?value[m.promotion]:0)+(m.flags.includes('c')?30:0)+(Math.random()*18);g.move({from:m.from,to:m.to,promotion:m.promotion||'q'});if(g.in_checkmate())score+=100000;else if(g.in_check())score+=45;g.undo();if(score>bestScore){bestScore=score;best=[m]}else if(score===bestScore)best.push(m)}const m=best[Math.floor(Math.random()*best.length)];const made=g.move({from:m.from,to:m.to,promotion:m.promotion||'q'});busy=false;if(made){last={from:made.from,to:made.to};sel=null;moves=[]}render();refresh();$('engineStatus').textContent='Playing · local fallback'},500)}
function search(){if(!worker||!ready||g.turn()!=='b'||g.game_over())return;busy=true;render();refresh();$('engineStatus').textContent='Calculating…';$('analysis').textContent='Searching candidate moves…';$('eval').textContent='…';worker.postMessage('stop');worker.postMessage('ucinewgame');worker.postMessage('position fen '+g.fen());worker.postMessage('go depth 16');clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(busy){worker.postMessage('stop');engineFallback()}},12000)}
function init(){try{const workerSource="importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');";const workerUrl=URL.createObjectURL(new Blob([workerSource],{type:'application/javascript'}));worker=new Worker(workerUrl);setTimeout(()=>URL.revokeObjectURL(workerUrl),10000);worker.onmessage=e=>{let s=typeof e.data==='string'?e.data:'';if(s==='uciok'){worker.postMessage('isready');return}if(s==='readyok'){ready=true;$('engineState').textContent='ENGINE READY';$('engineStatus').textContent='Ready · Stockfish';$('analysis').textContent='Ready for analysis';if(!busy)status('Engine ready','You play White. Stockfish will calculate Black’s replies.','♞');return}if(s.startsWith('info depth ')){let d=s.match(/\bdepth\s+(\d+)/),cp=s.match(/\bscore cp (-?\d+)/),mate=s.match(/\bscore mate (-?\d+)/);$('analysis').textContent='Depth '+(d?d[1]:'…')+' · '+(mate?'Mate in '+mate[1]:cp?'Evaluation '+(Number(cp[1])/100).toFixed(2):'Evaluating…');if(cp)$('eval').textContent=(Number(cp[1])>0?'+':'')+(Number(cp[1])/100).toFixed(2);else if(mate)$('eval').textContent='M'+mate[1];if(busy)$('engineStatus').textContent='Thinking · depth '+(d?d[1]:'…')}if(s.startsWith('bestmove ')){clearTimeout(searchTimer);if(!busy||g.game_over())return;let u=s.split(/\s+/)[1];busy=false;if(!u||u==='(none)'){render();refresh();return}let m=g.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'});if(m){last={from:m.from,to:m.to};sel=null;moves=[];render();refresh()}else{render();status('Engine move error','The returned move was invalid. Start a new game.','⚠')}$('engineStatus').textContent='Ready · Stockfish'}};worker.onerror=()=>{failed=true;engineFallback();};worker.postMessage('uci')}catch(e){failed=true}}
function newGame(){clearTimeout(searchTimer);clearTimeout(waitTimer);if(worker)worker.postMessage('stop');g=new Chess();sel=null;moves=[];last=null;busy=false;$('eval').textContent='—';$('analysis').textContent=ready?'Ready for analysis':'Loading engine…';render();refresh()}
$('new').onclick=newGame;$('undo').onclick=()=>{if(busy)return;g.undo();if(g.turn()==='b')g.undo();last=null;sel=null;moves=[];render();refresh()};$('flip').onclick=()=>{flip=!flip;render()};if(window.Chess){newGame();init()}else{status('Chess rules failed to load','Check internet and reload.','⚠');$('engineState').textContent='LOAD ERROR'}
})();
</script>
<audio id="bgMusic" loop preload="auto">
  <source src="./mixkit-finding-myself-993.mp3" type="audio/mpeg">
</audio>

<script>
(() => {
  const music = document.getElementById('bgMusic');
  music.volume = 0.15;

  // Запуск музыки после первого действия пользователя
  const startMusic = () => {
    music.play().catch(() => {});
  };

  document.addEventListener('pointerdown', startMusic, { once: true });
  document.addEventListener('keydown', startMusic, { once: true });
})();
</script>
</body></html>
