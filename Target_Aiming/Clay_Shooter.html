<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e2814">
<title>Clay Shooter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1e2814; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .serif { font-family: Georgia, "Times New Roman", serif; font-weight: 900; }
  #menu { justify-content: space-between; padding: max(16px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(10,12,6,.62) 0%, rgba(10,12,6,0) 24%, rgba(10,12,6,0) 40%, rgba(10,10,6,.72) 62%, rgba(8,8,4,.94) 100%); }
  .mtop, .mbot { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 100%; }
  .mbot { max-width: 520px; }
  .mtop { margin-top: 26px; }
  @media (max-width: 560px) { #menuHint { display: none; } }
  @media (max-width: 400px) { .tag { letter-spacing: 3px; font-size: 10px; } }
  .tag { font-size: 11px; letter-spacing: 6px; color: #ffd9a0; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
  .title { font-size: clamp(56px, 17vw, 118px); line-height: .84; letter-spacing: 3px;
    background: linear-gradient(180deg, #fff8e8 0%, #ffd48a 30%, #ff8a1e 60%, #a8380a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #3a1404) drop-shadow(0 0 26px rgba(255,130,30,.5)); }
  .title span { display: block; font-size: .43em; letter-spacing: .3em; padding-left: .3em; margin-top: 6px;
    background: linear-gradient(180deg, #ffffff, #efe6cf 55%, #a8987a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #1e1408); }
  .panel { width: 100%; background: linear-gradient(180deg, rgba(46,34,20,.78), rgba(18,13,8,.86)); border: 1px solid rgba(255,210,140,.28); border-radius: 18px;
    padding: 9px 12px 11px; box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,230,180,.16); display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .gunrow { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; }
  .gunrow canvas { width: min(310px, 66vw); aspect-ratio: 720 / 230; height: auto; }
  .arrow { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,214,150,.7); background: rgba(40,26,12,.7); color: #ffe0a8; font-size: 17px; font-weight: 900; cursor: pointer; }
  .gunname { font-size: 19px; letter-spacing: 3px; color: #ffd27a; text-shadow: 0 2px 3px #000; line-height: 1; }
  .gunsub { font-size: 10.5px; letter-spacing: 1.5px; color: #d8c8a8; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 18px; font-size: 10px; letter-spacing: 1px; color: #f0e6d0; width: 100%; max-width: 360px; }
  .stats span { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .stats b { flex: 0 0 70px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.5); position: relative; overflow: hidden; }
  .stats b i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: linear-gradient(90deg, #ffc04a, #ff6a1a); }
  .stats em { font-style: normal; color: #ffd27a; font-weight: 900; }
  .buy { border: 2px solid #ffc04a; background: rgba(70,40,10,.75); color: #ffe08a; font: inherit; font-size: 13px; font-weight: 900; padding: 5px 18px; border-radius: 20px; cursor: pointer; letter-spacing: 1px; }
  .shells { display: flex; gap: 6px; justify-content: center; width: 100%; }
  .shell { flex: 1 1 0; max-width: 104px; border: 1.5px solid rgba(255,220,160,.28); background: rgba(0,0,0,.32); border-radius: 10px; padding: 4px 2px 3px; color: #f0e0c0;
    font: inherit; font-size: 8.5px; letter-spacing: .6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.15; }
  .shell canvas { width: 44px; height: 17px; }
  .shell.on { border-color: #ffd27a; background: rgba(255,160,50,.24); box-shadow: 0 0 12px rgba(255,170,70,.35); }
  .shell.lock { opacity: .62; }
  .shell small { color: #ffd27a; font-weight: 900; font-size: 9px; }
  .stat { font-size: 13px; color: #f4ecd8; text-shadow: 0 1px 3px #000; } .stat b { color: #ffc04a; }
  .btn { border: 3px solid #ffe2b0; padding: 11px 58px; border-radius: 40px; font-size: 26px; letter-spacing: 6px; color: #3a1404; cursor: pointer;
    background: linear-gradient(180deg, #ffe7a8, #ffa83a 52%, #d8601a); box-shadow: 0 6px 0 #6a2a08, 0 0 26px rgba(255,150,50,.5); animation: pulse 1.6s ease-in-out infinite; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #6a2a08; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #6a2a08, 0 0 44px rgba(255,170,70,.85); } }
  .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .chip { border: 1px solid rgba(255,220,160,.45); background: rgba(0,0,0,.4); color: #f0e0c0; font: inherit; font-size: 11px; letter-spacing: 1.5px; padding: 6px 12px; border-radius: 14px; cursor: pointer; }
  .chip b { color: #ffc04a; }
  .hint { font-size: 11.5px; letter-spacing: .5px; color: #e8dcc4; max-width: 470px; text-shadow: 0 1px 3px #000; }
  .coins { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 14px; z-index: 11; font-size: 18px; font-weight: 900; color: #ffd27a; text-shadow: 0 2px 3px #000; }
  .coins i { display: inline-block; width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff4b0, #ffc030 50%, #a86a08); vertical-align: -1px; margin-right: 5px; box-shadow: 0 0 6px rgba(255,200,60,.6); }
  #pauseBtn { position: fixed; z-index: 9; left: 10px; top: max(10px, env(safe-area-inset-top)); width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid rgba(255,230,190,.55);
    background: rgba(20,14,8,.45); color: #ffe6b8; font-size: 13px; font-weight: 900; letter-spacing: 1px; cursor: pointer; display: none; }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(50,30,12,.8), rgba(10,8,4,.95)); }
  #over h2 { font-size: clamp(40px, 11vw, 80px); letter-spacing: 3px; color: #ffc86a; text-shadow: 0 4px 0 #4a1e06, 0 0 30px rgba(255,150,60,.55); line-height: 1; }
  #overScore { font-size: 56px; color: #fff; text-shadow: 0 0 22px rgba(255,200,120,.6); line-height: 1; }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #3a1004; background: linear-gradient(90deg, #ffe84a, #ffa02a); padding: 5px 16px; border-radius: 4px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,200,80,.8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 24px; font-size: 14px; color: #e8dcc4; text-align: left; } .grid b { color: #fff; float: right; margin-left: 12px; }
  #pause { background: rgba(10,8,4,.72); font-size: 34px; letter-spacing: 8px; color: #ffd27a; }
  @media (max-height: 700px) and (min-height: 521px) {
    .title { font-size: clamp(46px, 13vw, 80px); } .gunrow canvas { width: min(250px, 58vw); } .hint { display: none; } .panel { gap: 3px; padding: 7px 10px 9px; }
    .btn { padding: 9px 50px; font-size: 23px; } .mbot { gap: 6px; }
  }
  @media (max-height: 520px) {
    #menu { flex-direction: row; justify-content: space-around; align-items: center; padding: 8px 60px 8px 16px; }
    .mtop { width: auto; flex: 0 1 40%; } .mbot { flex: 0 1 56%; gap: 5px; }
    .title { font-size: clamp(38px, 8vw, 64px); } .tag { font-size: 9px; letter-spacing: 3px; }
    .gunrow canvas { width: min(210px, 30vw); } .arrow { width: 32px; height: 32px; font-size: 14px; } .gunname { font-size: 15px; } .gunsub { display: none; }
    .panel { gap: 3px; padding: 6px 10px 7px; } .stats { gap: 1px 14px; font-size: 9px; } .shell canvas { display: none; } .shell { padding: 3px 2px; }
    .btn { padding: 7px 40px; font-size: 19px; } .hint { display: none; } .stat { font-size: 11px; }
    #over { gap: 6px; } #over h2 { font-size: 32px; } #overScore { font-size: 34px; } .grid { font-size: 12px; gap: 2px 18px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="coins" id="coinsTop"></div>
<button id="pauseBtn" aria-label="Pause">II</button>
<div class="overlay" id="menu">
  <div class="mtop">
    <div class="tag">◉ THE ENDLESS CHAMPIONSHIP ◉</div>
    <div class="title serif">CLAY<span>SHOOTER</span></div>
  </div>
  <div class="mbot">
    <div class="panel">
      <div class="gunrow"><button class="arrow" id="prevGun" aria-label="Previous gun">◀</button><canvas id="gunPrev" width="720" height="230"></canvas><button class="arrow" id="nextGun" aria-label="Next gun">▶</button></div>
      <div class="gunname serif" id="gunName"></div>
      <div class="gunsub" id="gunSub"></div>
      <div class="stats" id="gunStats"></div>
      <button class="buy" id="buyBtn"></button>
      <div class="shells" id="shellRow"></div>
    </div>
    <div class="stat" id="bestMenu"></div>
    <button class="btn serif" id="startBtn">PULL!</button>
    <div class="row"><button class="chip" id="assistBtn"></button></div>
    <div class="hint" id="menuHint">Hold anywhere to call PULL · drag to swing ahead of the clay · release to fire. Pellets take time to arrive — lead the target!</div>
  </div>
</div>
<div class="overlay hidden" id="over">
  <h2 class="serif" id="overTitle">OUT OF LIVES</h2>
  <div id="overScore" class="serif">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <div class="hint" id="coinMsg"></div>
  <div class="row"><button class="btn serif" id="againBtn">AGAIN</button><button class="chip" id="menuBtn">MENU</button></div>
</div>
<div class="overlay hidden serif" id="pause">PAUSED<div class="hint">tap to continue</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');

    if (!own) { g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.roundRect ? g.roundRect(500, 168, 200, 50, 25) : g.rect(500, 168, 200, 50); g.fill(); g.fillStyle = '#ffd27a'; g.font = '900 28px Georgia'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🔒 ' + fmt(gd.price), 600, 194); }
    $('gunName').textContent = gd.name; $('gunSub').textContent = gd.sub;
    const st = (n, v, extra) => `<span>${n}${extra ? ' <em>' + extra + '</em>' : ''}<b><i style="width:${Math.round(clamp(v, .06, 1) * 100)}%"></i></b></span>`;
    $('gunStats').innerHTML = st('PATTERN', gd.spread / .064) + st('VELOCITY', (gd.speed - 70) / 70) + st('RELOAD', (1.6 - gd.reload / (gd.cap / 2)) / 1.2) + st('RANGE', gd.range / 62) + `<span>SHELLS <em>${gd.cap}${gd.type === 'semi' ? ' · SEMI-AUTO' : gd.type === 'sxs' ? ' · SIDE-BY-SIDE' : ' · OVER/UNDER'}</em></span>`;
    $('buyBtn').textContent = own ? (SAVE.gun === prevGun ? '✓ EQUIPPED' : 'EQUIP') : 'BUY · ' + fmt(gd.price) + ' ●'; $('buyBtn').style.opacity = own || SAVE.coins >= gd.price ? 1 : .5;
    $('coinsTop').innerHTML = '<i></i>' + fmt(SAVE.coins);
  }
  function buildShellRow() {
    const row = $('shellRow'); row.innerHTML = '';
    SHELLS.forEach((s, i) => {
      const b = document.createElement('button'), own = SAVE.shellsOwned.includes(i);
      b.className = 'shell' + (SAVE.shell === i ? ' on' : '') + (own ? '' : ' lock');
      const cvs = mk(88, 34); cvs.getContext('2d').drawImage(shellSpr(i), 4, 3, 80, 28);
      b.appendChild(cvs); const n = document.createElement('div'); n.textContent = s.short; b.appendChild(n);
      const p = document.createElement('small'); p.textContent = own ? (SAVE.shell === i ? '✓ LOADED' : s.desc) : fmt(s.price) + ' ●'; b.appendChild(p);
      b.title = s.name + ' — ' + s.desc;
      b.onclick = () => { if (SAVE.shellsOwned.includes(i)) SAVE.shell = i; else if (SAVE.coins >= s.price) { SAVE.coins -= s.price; SAVE.shellsOwned.push(i); SAVE.shell = i; if (audioOn) audio.sfx(880, .2, 'triangle', .06, 1320); } else { b.animate && b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 200 }); return; } saveNow(); buildShellRow(); drawGunPreview(); };
      row.appendChild(b);
    });
  }
  $('prevGun').onclick = () => { prevGun = (prevGun + GUNS.length - 1) % GUNS.length; drawGunPreview(); };
  $('nextGun').onclick = () => { prevGun = (prevGun + 1) % GUNS.length; drawGunPreview(); };
  $('buyBtn').onclick = () => { const g = GUNS[prevGun]; if (SAVE.owned.includes(prevGun)) SAVE.gun = prevGun; else if (SAVE.coins >= g.price) { SAVE.coins -= g.price; SAVE.owned.push(prevGun); SAVE.gun = prevGun; if (audioOn) { audio.sfx(660, .15, 'triangle', .06, 990); later(120, () => audio.sfx(990, .3, 'triangle', .06, 1320)); } } else return; saveNow(); loadGunFP(SAVE.gun); if (G && G.attract) G.shells = ST().cap; drawGunPreview(); };
  const paintAssist = () => { $('assistBtn').innerHTML = SAVE.assist ? 'AIM ASSIST: <b>ON</b>' : 'AIM ASSIST: <b>OFF</b> · +25% SCORE'; };
  $('assistBtn').onclick = () => { SAVE.assist = !SAVE.assist; saveNow(); paintAssist(); };
  function updateMenu() { $('bestMenu').innerHTML = SAVE.best ? 'BEST <b>' + fmt(SAVE.best) + '</b> · STAGE <b>' + SAVE.bestStage + '</b> · SMOKED <b>' + fmt(SAVE.smoked) + '</b>' : 'Trap · Skeet · Sporting — an endless championship'; paintAssist(); buildShellRow(); drawGunPreview(); }
  function start() {
    audio.start(); audioOn = true;
    $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('pause').classList.add('hidden'); $('coinsTop').style.display = 'none'; $('pauseBtn').style.display = 'block';
    paused = false; FX.clear(); loadGunFP(SAVE.gun); SAVE.runs++; saveNow(); newRun(false);
    G.cross.x = G.cross.tx = W / 2; G.cross.y = G.cross.ty = HY * .8;
  }
  $('startBtn').onclick = start; $('againBtn').onclick = start;
  function toMenu() { $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); $('coinsTop').style.display = ''; $('pauseBtn').style.display = 'none'; paused = false; $('pause').classList.add('hidden'); FX.clear(); newRun(true); updateMenu(); }
  $('menuBtn').onclick = toMenu;
  function gameOver() {
    G.state = 'over'; const sc = Math.floor(G.score), nb = sc > SAVE.best; if (nb) SAVE.best = sc;
    SAVE.bestStage = Math.max(SAVE.bestStage, G.stage); const bonus = Math.floor(sc / 100); SAVE.coins += bonus; G.coinsRun += bonus; saveNow();
    $('overTitle').textContent = G.stage >= 10 ? 'WHAT A RUN!' : 'OUT OF LIVES';
    $('overScore').textContent = fmt(sc); $('newBest').style.display = nb ? 'block' : 'none';
    const acc = G.fired ? Math.round(G.broken / G.fired * 100) : 0;
    $('overStats').innerHTML = [['Stage', G.stage], ['Clays', G.broken + ' / ' + G.launched], ['Accuracy', acc + '%'], ['Smoked', G.smoked], ['Best streak', G.bestStreak], ['Doubles', G.doubles], ['Golden', G.goldens], ['No-birds hit', G.nobirdHits]].map(([a, b]) => '<div>' + a + '<b>' + b + '</b></div>').join('');
    $('coinMsg').textContent = '+' + fmt(G.coinsRun) + ' coins this run · ' + fmt(SAVE.coins) + ' total';
    $('over').classList.remove('hidden'); $('coinsTop').style.display = ''; $('pauseBtn').style.display = 'none'; updateMenu();
    if (audioOn) { audio.sfx(392, .4, 'triangle', .05, 370); later(260, () => audio.sfx(311, .7, 'triangle', .05, 280)); }
  }
  function pause() { if (!G || G.attract || paused || G.state === 'over') return; paused = true; $('pause').classList.remove('hidden'); G.aim.on = false; }
  function resume() { if (!paused) return; paused = false; $('pause').classList.add('hidden'); last = performance.now(); }
  $('pause').addEventListener('pointerdown', e => { e.stopPropagation(); resume(); });
  $('pauseBtn').addEventListener('pointerdown', e => e.stopPropagation());
  $('pauseBtn').addEventListener('click', e => { e.stopPropagation(); pause(); });
  addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // =====================================================================
  //  BOOT, LOOP, TEST HOOK
  // =====================================================================
  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const cs = getComputedStyle($('safe')); SAFE_T = parseFloat(cs.paddingTop) || 0; SAFE_B = parseFloat(cs.paddingBottom) || 0;
    U = clamp(Math.min(W, H) / 420, .8, 1.3); layoutView();
    if (G && G.st && artReady) buildScene(G.st);
    if (G) { G.cross.tx = clamp(G.cross.tx, 8, W - 8); G.cross.ty = clamp(G.cross.ty, 14, H - 14); }
  }
  let rT = 0; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(resize, 120); });
  let last = performance.now(), fpsN = 0, fpsT = 0, fpsVal = 60;
  window.__cs = {
    G: () => G, start, toMenu,
    info: () => G && { state: G.state, stage: G.stage, type: G.st && G.st.type, biome: G.st && BIOMES[G.st.biome].name, score: G.score, stScore: G.stScore, target: G.st && G.st.target, rival: G.rivalScore, lives: G.lives, clays: clays.length, shells: G.shells, broken: G.broken, launched: G.launched, fired: G.fired, station: G.station, stations: G.st && G.st.stations.length, attract: G.attract, cross: { x: G.cross.x, y: G.cross.y } },
    autopilot: v => { G.autopilot = v; G.aim.on = false; },
    setStage: n => { clays = []; shots = []; wparts = []; G.banner = null; G.fadeTo = null; startStage(n, false); },
    coins: n => { SAVE.coins += n; saveNow(); updateMenu(); },
    gun: i => { if (!SAVE.owned.includes(i)) SAVE.owned.push(i); SAVE.gun = i; saveNow(); loadGunFP(i); prevGun = i; drawGunPreview(); },
    shell: i => { if (!SAVE.shellsOwned.includes(i)) SAVE.shellsOwned.push(i); SAVE.shell = i; saveNow(); buildShellRow(); },
    lives: n => { G.lives = n; },
    win: () => { G.stScore = Math.max(G.stScore, G.st.target + 1) ; G.rivalScore = Math.min(G.rivalScore, G.stScore - 1); clays = []; endStage(); },
    lose: () => { G.stScore = 0; G.rivalScore = 1e6; clays = []; endStage(); },
    lead: () => { const c = clays.find(o => o.alive && o.type !== 'nobird' && proj(o.p)); if (!c) return null; const q = proj(leadPoint(c, ST().speed)); return q && { x: q.x, y: q.y, t: c.t, kind: c.kind }; },
    fps: () => fpsVal, bench: n => { const t0 = performance.now(); for (let i = 0; i < n; i++) { update(1 / 60); render(); } return (performance.now() - t0) / n; }, save: () => JSON.parse(JSON.stringify(SAVE)), pause, resume, paused: () => paused
  };
  resize();
  loadArt().then(() => { newRun(true); updateMenu(); });
  updateMenu();
  (function loop(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    fpsN++; fpsT += dt; if (fpsT >= 1) { fpsVal = fpsN / fpsT; fpsN = 0; fpsT = 0; }
    if (!paused && artReady) update(dt);
    render();
    requestAnimationFrame(loop);
  })(last);
})();
</script>
