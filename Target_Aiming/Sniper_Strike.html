<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1018">
<title>Sniper Strike</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1018; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .mono { font-family: "Eurostile", "Bank Gothic", "Avenir Next Condensed", "Arial Narrow", sans-serif; font-weight: 900; letter-spacing: 4px; }
  #menu { background: radial-gradient(circle at 50% 42%, rgba(0,0,0,0) 0 30%, rgba(4,8,12,.6) 55%, rgba(2,4,8,.95) 75%); }
  .title { font-size: clamp(50px, 14vw, 104px); line-height: .9; font-style: italic;
    background: linear-gradient(180deg, #ffffff 0%, #c8e8ff 35%, #4aa8e8 60%, #1a3a6a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #04101e) drop-shadow(0 0 20px rgba(80,180,255,.5)); }
  .title span { display: block; background: linear-gradient(180deg, #fff4e0, #ff9a4a 50%, #c83a0a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #2a0800) drop-shadow(0 0 22px rgba(255,120,40,.5)); }
  .tag { font-size: 12px; letter-spacing: 8px; color: #9ad0ff; }
  .gear { display: flex; align-items: center; gap: 10px; }
  .gear canvas { width: 240px; height: 96px; }
  .arrow { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(140,200,255,.5); background: rgba(10,30,50,.7); color: #fff; font-size: 18px; font-weight: 900; cursor: pointer; }
  .rname { font-size: 16px; color: #ffd27a; min-height: 20px; }
  .rstats { display: flex; gap: 12px; font-size: 10.5px; letter-spacing: 1px; color: #c8d8e8; flex-wrap: wrap; justify-content: center; }
  .rstats b { display: inline-block; width: 40px; height: 5px; background: rgba(255,255,255,.12); margin-left: 4px; vertical-align: middle; position: relative; }
  .rstats b i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #4aa8ff, #8affff); }
  .buy { border: 2px solid #4aa8ff; background: rgba(10,30,60,.7); color: #c8e8ff; font: inherit; font-weight: 900; padding: 6px 16px; border-radius: 3px; cursor: pointer; letter-spacing: 1px; }
  .stat { font-size: 13px; color: #d8e4f0; } .stat b { color: #ffd27a; }
  .btn { border: 2px solid #8affff; padding: 13px 52px; font-size: 22px; color: #e8ffff; cursor: pointer; background: linear-gradient(180deg, rgba(40,140,220,.55), rgba(10,40,80,.85)); box-shadow: 0 0 22px rgba(80,200,255,.5), inset 0 0 18px rgba(120,220,255,.3); clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 40px rgba(80,200,255,.9), inset 0 0 26px rgba(120,220,255,.5); } }
  .hint { font-size: 12px; letter-spacing: 1px; color: #a8b8c8; max-width: 500px; }
  .coins { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 14px; z-index: 11; font-size: 17px; font-weight: 900; color: #ffd27a; }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(40,10,10,.8), rgba(4,6,10,.95)); }
  #over h2 { font-size: clamp(36px, 10vw, 70px); color: #ff6a4a; text-shadow: 0 0 26px rgba(255,80,40,.6); }
  #overScore { font-size: 52px; color: #fff; }
  #newBest { font-size: 15px; font-weight: 900; letter-spacing: 4px; color: #2a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; transform: rotate(-3deg); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; font-size: 14px; color: #c8d4e0; text-align: left; } .grid b { color: #fff; float: right; margin-left: 12px; }
  #pause { background: rgba(4,6,10,.75); font-size: 30px; color: #8affff; }
  #brief { background: rgba(2,6,12,.82); }
  #brief .card { border: 1px solid rgba(120,200,255,.5); background: linear-gradient(180deg, rgba(20,40,70,.9), rgba(8,16,30,.95)); padding: 18px 22px; max-width: 420px; box-shadow: 0 0 30px rgba(60,160,255,.25); }
  #brief h3 { font-size: 26px; color: #ffd27a; } #brief .obj { font-size: 15px; color: #e8f4ff; margin: 8px 0 14px; line-height: 1.4; } #brief .meta { font-size: 12px; color: #8ab0d0; letter-spacing: 2px; }
  @media (max-height: 520px) { .overlay { gap: 5px; padding: 8px 16px; } .title { font-size: 40px; } .title span { display: inline; margin-left: 10px; } .gear canvas { width: 180px; height: 72px; } .btn { padding: 8px 40px; font-size: 18px; } .hint { display: none; } #over h2 { font-size: 32px; } #overScore { font-size: 32px; } .grid { font-size: 12px; gap: 3px 18px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="coins" id="coinsTop"></div>
<div class="overlay" id="menu">
  <div class="tag mono">◎ ROBOT INVASION ◎</div>
  <div class="title mono">SNIPER<span>STRIKE</span></div>
  <div class="gear"><button class="arrow" id="prevR">◀</button><canvas id="rPrev" width="480" height="192"></canvas><button class="arrow" id="nextR">▶</button></div>
  <div class="rname mono" id="rName"></div>
  <div class="rstats" id="rStats"></div>
  <button class="buy" id="buyBtn"></button>
  <div class="stat" id="bestMenu"></div>
  <button class="btn mono" id="startBtn">DEPLOY</button>
  <div class="hint">Drag to aim · SCOPE to zoom · hold BREATH to steady · FIRE · aim above far targets (bullet drop) and into the wind · hit the glowing cores</div>
</div>
<div class="overlay hidden" id="brief"><div class="card"><div class="meta mono" id="bMeta"></div><h3 class="mono" id="bTitle"></h3><div class="obj" id="bObj"></div><button class="btn mono" id="goBtn">GO</button></div></div>
<div class="overlay hidden" id="over">
  <h2 class="mono">MISSION FAILED</h2>
  <div id="overScore" class="mono">0</div>
  <div id="newBest">NEW RECORD!</div>
  <div class="grid" id="overStats"></div>
  <button class="btn mono" id="againBtn">REDEPLOY</button>
  <div class="hint" id="coinMsg"></div>
</div>
<div class="overlay hidden mono" id="pause">PAUSED<div class="hint">tap to continue</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {

    if (dragId == null) { dragId = e.pointerId; PTR.set(e.pointerId, [x, y]); }
  });
  cv.addEventListener('pointermove', e => {
    if (!G || e.pointerId !== dragId) return; const p = PTR.get(e.pointerId); if (!p) return; const dx = e.clientX - p[0], dy = e.clientY - p[1]; p[0] = e.clientX; p[1] = e.clientY;
    if (G.state !== 'play' || G.bcam) return; const f = FB * G.zoom; G.yaw += dx / f * SENS; G.pitch -= dy / f * SENS; G.dragDist = (G.dragDist || 0) + Math.hypot(dx, dy);
  });
  const up = e => { if (e.pointerId === dragId) { dragId = null; PTR.delete(e.pointerId); } if (e.pointerId === breathId) { breathId = null; if (G) G.holding = false; } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  const KEYS = {};
  addEventListener('keydown', e => {
    if (e.code === 'Enter' && !$('menu').classList.contains('hidden')) return start();
    if (e.code === 'Enter' && !$('brief').classList.contains('hidden')) return $('goBtn').onclick();
    if (!G || G.attract) return; if (paused) { resume(); return; }
    if (e.code === 'Escape' || e.code === 'KeyP') return pause();
    if (G.state !== 'play') return;
    if (e.code === 'Space') { e.preventDefault(); fire(); } else if (e.code === 'KeyZ' || e.code === 'KeyE') scopeCycle(); else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') G.holding = G.shaky <= 0; else KEYS[e.code] = true;
  });
  addEventListener('keyup', e => { KEYS[e.code] = false; if (G && (e.code === 'ShiftLeft' || e.code === 'ShiftRight')) G.holding = false; });
  function keyAim(dt) { if (!G || G.attract || G.state !== 'play' || G.bcam) return; const k = dt * .6 / G.zoom; if (KEYS.ArrowLeft || KEYS.KeyA) G.yaw -= k; if (KEYS.ArrowRight || KEYS.KeyD) G.yaw += k; if (KEYS.ArrowUp || KEYS.KeyW) G.pitch += k; if (KEYS.ArrowDown || KEYS.KeyS) G.pitch -= k; }

  // ---------- menu, shop, run flow ----------
  let paused = false, last = performance.now(), prevR = SAVE.rifle;
  function drawRiflePreview() {
    const g = $('rPrev').getContext('2d'), r = RIFLES[prevR]; g.clearRect(0, 0, 480, 192);
    const gr = g.createRadialGradient(240, 96, 10, 240, 96, 230); gr.addColorStop(0, hexA(r.accent, .28)); gr.addColorStop(1, hexA(r.accent, 0)); g.fillStyle = gr; g.fillRect(0, 0, 480, 192);
    g.globalAlpha = SAVE.owned.includes(prevR) ? 1 : .5; drawRifleSide(g, r, 248, 110, 1.04, 0, false); g.globalAlpha = 1;
    $('rName').textContent = r.name + (r.comp ? '  ◆' : '');
    const st = (n, v) => `<span>${n}<b><i style="width:${Math.round(clamp(v, .05, 1) * 100)}%"></i></b></span>`;
    $('rStats').innerHTML = st('VELOCITY', r.speed / 1100) + st('ZOOM', r.zooms[r.zooms.length - 1] / 14) + st('STEADY', r.steady / .75) + st('POWER', r.dmg / 4) + (r.comp ? '<span style="color:#8affff">◆ BALLISTIC COMPUTER</span>' : '');
    const own = SAVE.owned.includes(prevR); $('buyBtn').textContent = own ? (SAVE.rifle === prevR ? '✓ EQUIPPED' : 'EQUIP') : 'BUY · ' + fmt(r.price) + ' ●'; $('buyBtn').style.opacity = own || SAVE.coins >= r.price ? 1 : .5;
    $('coinsTop').textContent = '● ' + fmt(SAVE.coins);
  }
  $('prevR').onclick = () => { prevR = (prevR + RIFLES.length - 1) % RIFLES.length; drawRiflePreview(); };
  $('nextR').onclick = () => { prevR = (prevR + 1) % RIFLES.length; drawRiflePreview(); };
  $('buyBtn').onclick = () => { const r = RIFLES[prevR]; if (SAVE.owned.includes(prevR)) SAVE.rifle = prevR; else if (SAVE.coins >= r.price) { SAVE.coins -= r.price; SAVE.owned.push(prevR); SAVE.rifle = prevR; if (audioOn) audio.sfx(880, .2, 'triangle', .06, 1320); } saveNow(); drawRiflePreview(); };
  function updateMenu() { $('bestMenu').innerHTML = SAVE.best ? 'BEST <b>' + fmt(SAVE.best) + '</b> · MISSION <b>' + SAVE.bestStage + '</b> · CORE SHOTS <b>' + SAVE.cores + '</b>' : 'Hold the rooftop. Stop the machines.'; drawRiflePreview(); }
  function newRun(attract) {
    G = { attract, autopilot: false, t: 0, stage: 0, score: 0, armor: 3, coins: 0, kills: 0, shots: 0, hits: 0, cores: 0, streak: 0, bestStreak: 0, longest: 0, missions: 0,
      yaw: 0, pitch: -.3, zoomI: 0, zoom: 1, sway: { x: 0, y: 0, nx: 0, ny: 0, ph: 0 }, kick: { x: 0, y: 0 }, breath: 1, holding: false, shaky: 0, ammo: 5, boltT: 0, reloadT: 0,
      robots: [], bullets: [], parts: [], missiles: [], trucks: [], pops: [], bolts: [], lights: [], cracks: [], clouds: [], rain: [], hurt: 0, state: 'play', bcam: null, slow: 1, slowT: 0, lastBcam: -99, m: null, shake: 0, wind: 0, windNow: 0 };
    nextMission();
  }
  function start() {
    audio.start(); audioOn = true; $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('pause').classList.add('hidden'); $('coinsTop').style.display = 'none';
    paused = false; FX.clear(); newRun(false);
  }
  $('startBtn').onclick = start; $('againBtn').onclick = start;
  function gameOver() {
    const sc = Math.floor(G.score), nb = sc > SAVE.best; if (nb) SAVE.best = sc; SAVE.bestStage = Math.max(SAVE.bestStage, G.stage); const earned = G.coins + Math.floor(sc / 100); SAVE.coins += earned; saveNow();
    $('overScore').textContent = fmt(sc); $('newBest').style.display = nb ? 'block' : 'none';
    $('overStats').innerHTML = [['Missions', G.missions], ['Kills', G.kills], ['Accuracy', (G.shots ? Math.round(G.hits / G.shots * 100) : 0) + '%'], ['Core shots', G.cores], ['Longest', Math.round(G.longest) + ' m'], ['Best streak', G.bestStreak]].map(([a, b]) => '<div>' + a + '<b>' + b + '</b></div>').join('');
    $('coinMsg').textContent = (G.why ? G.why + ' · ' : '') + '+' + fmt(earned) + ' coins · total ' + fmt(SAVE.coins);
    $('over').classList.remove('hidden'); $('coinsTop').style.display = ''; updateMenu();
  }
  $('over').addEventListener('pointerdown', e => { if (e.target.id === 'over') { $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); newRun(true); } });
  function pause() { if (!G || G.attract || paused || G.state === 'over') return; paused = true; $('pause').classList.remove('hidden'); G.holding = false; dragId = null; }
  function resume() { paused = false; $('pause').classList.add('hidden'); last = performance.now(); }
  $('pause').addEventListener('pointerdown', resume);
  addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.__ss = { G: () => G, start, autopilot: v => { G.autopilot = v; G.bot = null; }, go: () => $('goBtn').onclick(), setStage: n => { G.stage = n - 1; G.armor = 3; nextMission(); }, coins: n => { SAVE.coins += n; saveNow(); drawRiflePreview(); }, rifle: i => { if (!SAVE.owned.includes(i)) SAVE.owned.push(i); SAVE.rifle = i; G.ammo = RIFLES[i].mag; }, armor: n => { G.armor = n; }, fire, scope: scopeCycle, aimAt: r => { const s = solveAim(r); if (s) { G.yaw = s.yaw; G.pitch = s.pitch; } return s; } };
  resize(); newRun(true); updateMenu();
  (function loop(now) { const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; if (!paused) { keyAim(dt); update(dt); } render(); requestAnimationFrame(loop); })(last);
})();
</script>
