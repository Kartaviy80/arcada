<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Battleship</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#0b1520;font-family:'Rajdhani',system-ui,sans-serif;color:#c8d6e5;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:420px;margin:0 auto;padding:max(env(safe-area-inset-top),6px) 8px max(env(safe-area-inset-bottom),6px)}
.header{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding:2px 0}
.logo{font-size:16px;font-weight:700;letter-spacing:2px;color:#48dbfb}
.stat{background:#132535;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700}
.status{text-align:center;font-size:12px;font-weight:700;padding:3px 0;color:#8395a7;flex-shrink:0;min-height:18px}
.status.win{color:#1dd1a1;font-size:14px}.status.lose{color:#ff6b6b;font-size:14px}
.grids{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;justify-content:center}
.grid-label{font-size:11px;font-weight:700;color:#576574;text-align:center}
.grid{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:2px;width:min(92vw,42dvh);aspect-ratio:1;margin:0 auto;background:#0a1929;border-radius:6px;padding:3px}
.cell{background:#1a3a52;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,3vw,14px);cursor:pointer}
.cell:active{opacity:.8}
.cell.ship{background:#0abde3}
.cell.hit{background:#ee5a24}.cell.miss{background:#576574}
.cell.sunk{background:#b33939}
.controls{display:flex;gap:6px;justify-content:center;padding:4px 0 2px;flex-shrink:0}
button{font-family:inherit;background:#132535;border:1px solid #1a3a52;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;color:#c8d6e5;min-height:38px;cursor:pointer}
button:active{transform:scale(.96)}
#btnMusic.active{border-color:#48dbfb;color:#48dbfb}
.hint{text-align:center;font-size:10px;color:#576574;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="stat">You 🚢 <span id="youLeft">4</span></div>
    <div class="logo">BATTLESHIP</div>
    <div class="stat">Bot 🚢 <span id="botLeft">4</span></div>
  </div>
  <div class="status" id="status">Tap enemy grid to fire</div>
  <div class="grids">
    <div>
      <div class="grid-label">ENEMY</div>
      <div class="grid" id="enemy"></div>
    </div>
    <div>
      <div class="grid-label">YOUR FLEET</div>
      <div class="grid" id="yours"></div>
    </div>
  </div>
  <div class="controls">
    <button id="btnMusic" onclick="toggleMusic()">♪ Music</button>
    <button onclick="newGame()">New</button>
  </div>
  <div class="hint">Ships: 4,3,3,2 · First to sink all wins</div>
</div>
<script>
const N=8,SHIPS=[4,3,3,2];
let youBoard,botBoard,youShips,botShips,turn,over,youHits,botHits;
const enemyEl=document.getElementById('enemy'),yoursEl=document.getElementById('yours'),st=document.getElementById('status');

let audioCtx=null,musicNodes=[],musicOn=false,musicTimer=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function stopMusic(){musicNodes.forEach(n=>{try{n.stop()}catch(e){}try{n.disconnect()}catch(e){}});musicNodes=[];if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function startMusic(){
  const ctx=ensureAudio();stopMusic();
  const m=ctx.createGain();m.gain.value=0.05;m.connect(ctx.destination);
  function tone(f,t,d){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.035,t+.5);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(m);o.start(t);o.stop(t+d+.05);musicNodes.push(o)}
  function L(){const t=ctx.currentTime+.05;tone(146.83,t,3);tone(174.61,t+.7,2.5);tone(220,t+1.5,2);tone(293.66,t+2.5,1.5)}
  L();musicTimer=setInterval(L,4500);
}
function toggleMusic(){musicOn=!musicOn;document.getElementById('btnMusic').classList.toggle('active',musicOn);if(musicOn)startMusic();else stopMusic()}

function emptyBoard(){return Array.from({length:N},()=>Array(N).fill(0))}
// 0 water, 1 ship, 2 hit, 3 miss, 4 sunk
function placeShips(){
  const b=emptyBoard();const ships=[];
  for(const len of SHIPS){
    let ok=false,tries=0;
    while(!ok&&tries++<200){
      const horiz=Math.random()<0.5;
      const r=Math.floor(Math.random()*(horiz?N:N-len+1));
      const c=Math.floor(Math.random()*(horiz?N-len+1:N));
      ok=true;const cells=[];
      for(let i=0;i<len;i++){
        const rr=horiz?r:r+i,cc=horiz?c+i:c;
        if(b[rr][cc]){ok=false;break}
        cells.push([rr,cc]);
      }
      if(ok){cells.forEach(([rr,cc])=>b[rr][cc]=1);ships.push(cells)}
    }
  }
  return {board:b,ships};
}
function newGame(){
  const y=placeShips(),bt=placeShips();
  youBoard=y.board;youShips=y.ships;
  botBoard=bt.board;botShips=bt.ships;
  turn=1;over=false;youHits=new Set();botHits=new Set();
  document.getElementById('youLeft').textContent=SHIPS.length;
  document.getElementById('botLeft').textContent=SHIPS.length;
  st.textContent='Tap enemy grid to fire';st.className='status';
  render();
}
function shipsLeft(ships,board){
  return ships.filter(s=>s.some(([r,c])=>board[r][c]===1||board[r][c]===2)).length;
  // actually count unsunk
}
function checkSunk(ships,board){
  let left=0;
  for(const s of ships){
    const allHit=s.every(([r,c])=>board[r][c]===2||board[r][c]===4);
    if(allHit)s.forEach(([r,c])=>board[r][c]=4);
    else left++;
  }
  return left;
}
function render(){
  enemyEl.innerHTML='';yoursEl.innerHTML='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    // enemy (hidden ships)
    const e=document.createElement('div');e.className='cell';
    const ev=botBoard[r][c];
    if(ev===2)e.classList.add('hit'),e.textContent='💥';
    else if(ev===3)e.classList.add('miss'),e.textContent='·';
    else if(ev===4)e.classList.add('sunk'),e.textContent='💀';
    else if(!over&&turn===1)e.onclick=()=>fire(r,c);
    enemyEl.appendChild(e);
    // yours
    const y=document.createElement('div');y.className='cell';
    const yv=youBoard[r][c];
    if(yv===1)y.classList.add('ship');
    else if(yv===2)y.classList.add('hit'),y.textContent='💥';
    else if(yv===3)y.classList.add('miss'),y.textContent='·';
    else if(yv===4)y.classList.add('sunk'),y.textContent='💀';
    yoursEl.appendChild(y);
  }
  document.getElementById('botLeft').textContent=checkSunk(botShips,botBoard);
  document.getElementById('youLeft').textContent=checkSunk(youShips,youBoard);
}
function fire(r,c){
  if(over||turn!==1)return;
  if(botBoard[r][c]>=2)return;
  if(botBoard[r][c]===1){botBoard[r][c]=2;st.textContent='Hit!'}
  else{botBoard[r][c]=3;st.textContent='Miss'}
  const left=checkSunk(botShips,botBoard);
  document.getElementById('botLeft').textContent=left;
  if(left===0){over=true;st.textContent='You win! 🎉';st.className='status win';render();return}
  turn=2;render();
  setTimeout(botFire,500);
}
function botFire(){
  if(over)return;
  let r,c,tries=0;
  // prefer adjacent to hits
  const candidates=[];
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    if(youBoard[i][j]===2){
      for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
        const nr=i+dr,nc=j+dc;
        if(nr>=0&&nr<N&&nc>=0&&nc<N&&youBoard[nr][nc]<2)candidates.push([nr,nc]);
      }
    }
  }
  if(candidates.length){[r,c]=candidates[Math.floor(Math.random()*candidates.length)]}
  else{
    do{r=Math.floor(Math.random()*N);c=Math.floor(Math.random()*N)}
    while(youBoard[r][c]>=2&&tries++<100);
  }
  if(youBoard[r][c]===1){youBoard[r][c]=2;st.textContent='Bot hit your ship!'}
  else{youBoard[r][c]=3;st.textContent='Bot missed'}
  const left=checkSunk(youShips,youBoard);
  document.getElementById('youLeft').textContent=left;
  if(left===0){over=true;st.textContent='Bot wins!';st.className='status lose';render();return}
  turn=1;render();
}
newGame();
</script>
</body>
</html>
