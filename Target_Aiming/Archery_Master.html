<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a3a2a">
<title>Archery Master</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #6ab0e0; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .serif { font-family: "Trajan Pro", Cinzel, Georgia, "Times New Roman", serif; font-weight: 900; }
  #menu { background: linear-gradient(180deg, rgba(10,30,20,.15), rgba(10,30,20,.35) 55%, rgba(6,18,12,.85)); }
  .title { font-size: clamp(50px, 14.5vw, 108px); line-height: .9; letter-spacing: 3px;
    background: linear-gradient(180deg, #ffffff 0%, #fff2c0 30%, #e8b03a 60%, #8a5a10 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #3a2406) drop-shadow(0 0 22px rgba(255,210,100,.5)); }
  .title span { display: block; font-size: .62em; letter-spacing: .3em; background: linear-gradient(180deg, #f4fff4, #a8e8a8 50%, #2a7a3a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #0a2a10); }
  .tag { font-size: 13px; letter-spacing: 7px; color: #fff4d8; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  .gear { display: flex; align-items: center; gap: 10px; }
  .gear canvas { width: 150px; height: 120px; }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,240,200,.7); background: rgba(40,60,30,.55); color: #fff; font-size: 20px; font-weight: 900; cursor: pointer; }
  .bowname { font-size: 17px; letter-spacing: 4px; color: #ffe08a; text-shadow: 0 2px 4px #000; min-height: 22px; }
  .bowstats { display: flex; gap: 14px; font-size: 11px; letter-spacing: 1px; color: #f0f4e8; text-shadow: 0 1px 2px #000; }
  .bowstats b { display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.4); margin-left: 4px; vertical-align: middle; position: relative; overflow: hidden; }
  .bowstats b i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ffd04a, #ff8a2a); }
  .buy { border: 2px solid #ffd04a; background: rgba(60,40,10,.7); color: #ffe08a; font: inherit; font-weight: 900; padding: 6px 16px; border-radius: 20px; cursor: pointer; letter-spacing: 1px; }
  .stat { font-size: 14px; color: #f4f8ec; text-shadow: 0 1px 3px #000; } .stat b { color: #ffd04a; }
  .btn { border: 3px solid #fff2c0; padding: 13px 56px; border-radius: 40px; font-size: 24px; letter-spacing: 6px; color: #3a2006; cursor: pointer;
    background: linear-gradient(180deg, #fff0a0, #f0b030 55%, #c87a10); box-shadow: 0 6px 0 #6a3a06, 0 0 26px rgba(255,200,60,.5); animation: pulse 1.6s ease-in-out infinite; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #6a3a06; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #6a3a06, 0 0 44px rgba(255,220,90,.85); } }
  .hint { font-size: 12px; letter-spacing: 1px; color: #e8f0e0; max-width: 480px; text-shadow: 0 1px 3px #000; }
  .coins { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 14px; z-index: 11; font-size: 18px; font-weight: 900; color: #ffe08a; text-shadow: 0 2px 3px #000; }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(30,50,20,.75), rgba(8,14,6,.94)); }
  #over h2 { font-size: clamp(40px, 11vw, 78px); letter-spacing: 3px; color: #ffe08a; text-shadow: 0 4px 0 #4a2a06, 0 0 30px rgba(255,200,80,.55); }
  #overScore { font-size: 54px; color: #fff; text-shadow: 0 0 20px rgba(255,230,140,.6); }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #3a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; border-radius: 4px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,220,80,.8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; font-size: 14px; color: #e0e8d8; text-align: left; } .grid b { color: #fff; float: right; margin-left: 12px; }
  #pause { background: rgba(8,14,6,.7); font-size: 34px; letter-spacing: 8px; color: #ffe08a; }
  @media (max-height: 700px) and (min-height: 521px) { .title { font-size: 52px; } .gear canvas { width: 120px; height: 96px; } .overlay { gap: 8px; } }
  @media (max-height: 520px) {
    .overlay { gap: 5px; padding: 8px 16px; } .title { font-size: 40px; } .title span { display: inline; margin-left: 10px; } .tag { font-size: 10px; letter-spacing: 4px; }
    .gear canvas { width: 96px; height: 72px; } .arrow { width: 34px; height: 34px; font-size: 15px; } .btn { padding: 8px 40px; font-size: 19px; } .hint { display: none; }
    #over h2 { font-size: 34px; } #overScore { font-size: 32px; } .grid { font-size: 12px; gap: 3px 18px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="coins" id="coinsTop"></div>
<div class="overlay" id="menu">
  <div class="tag">➶ THE ENDLESS TOURNAMENT ➶</div>
  <div class="title serif">ARCHERY<span>MASTER</span></div>
  <div class="gear"><button class="arrow" id="prevBow">◀</button><canvas id="bowPrev" width="300" height="240"></canvas><button class="arrow" id="nextBow">▶</button></div>
  <div class="bowname serif" id="bowName"></div>
  <div class="bowstats" id="bowStats"></div>
  <button class="buy" id="buyBtn"></button>
  <div class="stat" id="bestMenu"></div>
  <button class="btn serif" id="startBtn">SHOOT</button>
  <div class="hint">Drag back anywhere to draw the bow, aim, release to loose · mind the wind · hit the gold for a BULLSEYE</div>
</div>
<div class="overlay hidden" id="over">
  <h2 class="serif">OUT OF HEARTS</h2>
  <div id="overScore" class="serif">0</div>
  <div id="newBest">NEW RECORD!</div>
  <div class="grid" id="overStats"></div>
  <button class="btn serif" id="againBtn">AGAIN</button>
  <div class="hint" id="coinMsg"></div>
</div>
<div class="overlay hidden serif" id="pause">PAUSED<div class="hint">tap to continue</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);

    for (const p of pops) { const a = p.t < .2 ? p.t / .2 : Math.max(0, 1 - (p.t - 1) / .6), s = (p.big ? 34 : 26) * sc * (p.t < .2 ? 1.4 - p.t * 2 : 1); ctx.globalAlpha = a; txt(p.s, clamp(w2x(p.x), 120, W - 120), clamp(w2y(p.y) - p.t * 30, 120, H - 160), Math.round(s), p.col, 'center'); ctx.globalAlpha = 1; }
    const bn = G.banner; if (bn) { const t = bn.t, a = t < .25 ? t / .25 : t > 2.1 ? Math.max(0, (2.6 - t) / .5) : 1, s = t < .25 ? 1.4 - t / .25 * .4 : 1; ctx.globalAlpha = a; ctx.save(); ctx.translate(W / 2, H * .3); ctx.scale(s, s); txt(bn.a, 0, 0, Math.round(Math.min(46 * sc, W / (bn.a.length * .66))), bn.col, 'center'); if (bn.b) txt(bn.b, 0, 34 * sc, Math.round(Math.min(14 * sc, W / (bn.b.length * .6))), '#fff', 'center', AV, '800'); ctx.restore(); ctx.globalAlpha = 1; }
    if (G.tut >= 0 && G.state === 'aim' && !G.aim.on) { const t = (G.tut % 2.2) / 2.2, sx = W * .62, sy = H * .55, ex = sx - 110 * sc, ey = sy + 70 * sc, k = Math.min(1, t * 1.6), x = lerp(sx, ex, k), y = lerp(sy, ey, k); ctx.globalAlpha = t < .85 ? .9 : (1 - t) / .15 * .9; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(x, y); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 16 * sc, 0, TAU); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(x, y, 9 * sc, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; txt('DRAG BACK · AIM · RELEASE', W / 2, H * .45, Math.round(18 * sc), '#ffe08a', 'center'); }
  }
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!G || !GRASS) { ctx.fillStyle = '#6ab0e0'; ctx.fillRect(0, 0, W, H); return; }
    const [ox, oy] = FX.offset(); VX = W / 2 + ox; VY = H / 2 + oy;
    drawWorld();
    // drifting leaves show the wind everywhere on screen
    ctx.fillStyle = TH.leaf; for (let i = 0; i < 18; i++) { const sp = 20 + G.wind * 26, x = ((((i * 211 + G.t * sp) % (W + 80)) + W + 80) % (W + 80)) - 40, y = (i * 97 + Math.sin(G.t + i) * 30 + G.t * 14) % H; ctx.globalAlpha = .7; ctx.save(); ctx.translate(x, y); ctx.rotate(G.t * 2 + i); ctx.beginPath(); ctx.ellipse(0, 0, 5 * U, 2.4 * U, 0, 0, TAU); ctx.fill(); ctx.restore(); } ctx.globalAlpha = 1;
    if (G.slow < .6) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 0, W, H * .07); ctx.fillRect(0, H * .93, W, H * .07); }
    if (G.flash > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = G.flash * .35; ctx.fillStyle = '#ffe8a0'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .4, W / 2, H / 2, Math.hypot(W, H) / 2); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.35)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    if (!G.attract) drawHUD();
    FX.draw(ctx);
  }

  // ---------- menu & shop ----------
  let paused = false, last = performance.now(), prevBow = SAVE.bow;
  function drawBowPreview() {
    const g = $('bowPrev').getContext('2d'), b = BOWS[prevBow]; g.clearRect(0, 0, 300, 240);
    const gr = g.createRadialGradient(150, 120, 10, 150, 120, 130); gr.addColorStop(0, 'rgba(255,240,180,.4)'); gr.addColorStop(1, 'rgba(255,240,180,0)'); g.fillStyle = gr; g.fillRect(0, 0, 300, 240);
    g.globalAlpha = SAVE.owned.includes(prevBow) ? 1 : .55; drawBow(g, 190, 120, .35, .55, b, 150, true); g.globalAlpha = 1;
    $('bowName').textContent = b.name;
    const st = (n, v) => `<span>${n}<b><i style="width:${Math.round(v * 100)}%"></i></b></span>`;
    $('bowStats').innerHTML = st('POWER', (b.power - 40) / 40) + st('STEADY', b.steady) + st('SIGHT', b.sight / .46);
    const own = SAVE.owned.includes(prevBow); $('buyBtn').textContent = own ? (SAVE.bow === prevBow ? '✓ EQUIPPED' : 'EQUIP') : 'BUY · ' + fmt(b.price) + ' ●'; $('buyBtn').style.opacity = own || SAVE.coins >= b.price ? 1 : .5;
    $('coinsTop').textContent = '● ' + fmt(SAVE.coins);
  }
  $('prevBow').onclick = () => { prevBow = (prevBow + BOWS.length - 1) % BOWS.length; drawBowPreview(); };
  $('nextBow').onclick = () => { prevBow = (prevBow + 1) % BOWS.length; drawBowPreview(); };
  $('buyBtn').onclick = () => { const b = BOWS[prevBow]; if (SAVE.owned.includes(prevBow)) SAVE.bow = prevBow; else if (SAVE.coins >= b.price) { SAVE.coins -= b.price; SAVE.owned.push(prevBow); SAVE.bow = prevBow; if (audioOn) audio.sfx(880, .2, 'triangle', .06, 1320); } saveNow(); drawBowPreview(); };
  function updateMenu() { $('bestMenu').innerHTML = SAVE.best ? 'BEST <b>' + fmt(SAVE.best) + '</b> · STAGE <b>' + SAVE.bestStage + '</b> · BULLSEYES <b>' + SAVE.bulls + '</b>' : 'Wind, distance, one arrow at a time.'; drawBowPreview(); }
  function start() {
    audio.start(); audioOn = true; $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('pause').classList.add('hidden'); $('coinsTop').style.display = 'none';
    paused = false; FX.clear(); newRun(false); cam.x = aimCam().x; cam.y = aimCam().y; cam.s = aimCam().s;
  }
  $('startBtn').onclick = start; $('againBtn').onclick = start;
  function gameOver() {
    const sc = Math.floor(G.score), prev = SAVE.best, nb = sc > prev; if (nb) SAVE.best = sc; SAVE.bestStage = Math.max(SAVE.bestStage, G.stage); const earned = G.coins + Math.floor(sc / 50); SAVE.coins += earned; saveNow();
    $('overScore').textContent = fmt(sc); $('newBest').style.display = nb ? 'block' : 'none';
    $('overStats').innerHTML = [['Stage', G.stage], ['Hits', G.hits + ' / ' + G.shots], ['Bullseyes', G.bulls], ['Perfect 10s', G.best10]].map(([a, b]) => '<div>' + a + '<b>' + b + '</b></div>').join('');
    $('coinMsg').textContent = '+' + fmt(earned) + ' coins · total ' + fmt(SAVE.coins);
    $('over').classList.remove('hidden'); $('coinsTop').style.display = ''; updateMenu();
  }
  $('over').addEventListener('pointerdown', e => { if (e.target.id === 'over') { $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); newRun(true); } });
  addEventListener('keydown', e => { if (e.code === 'Enter' && !$('menu').classList.contains('hidden')) start(); else if (e.code === 'Escape' && !paused) pause(); else if (paused) resume(); });
  function pause() { if (!G || G.attract || paused || G.state === 'over') return; paused = true; $('pause').classList.remove('hidden'); if (G.aim) G.aim.on = false; }
  function resume() { paused = false; $('pause').classList.add('hidden'); last = performance.now(); }
  $('pause').addEventListener('pointerdown', resume);
  addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.__am = { G: () => G, start, autopilot: v => { G.autopilot = v; G.bot = null; }, setStage: n => { G.stage = n - 1; G.hearts = Math.max(G.hearts, 3); nextStage(); }, coins: n => { SAVE.coins += n; saveNow(); drawBowPreview(); }, bow: i => { if (!SAVE.owned.includes(i)) SAVE.owned.push(i); SAVE.bow = i; }, hearts: n => { G.hearts = n; } };
  resize(); newRun(true); cam.x = aimCam().x; cam.y = aimCam().y; cam.s = aimCam().s; updateMenu();
  (function loop(now) { const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; if (!paused) update(dt); render(); requestAnimationFrame(loop); })(last);
})();
</script>
