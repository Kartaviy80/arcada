<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c120c">
<title>Mine Cart</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1c120c;
    font-family: "Rockwell", "Courier New", serif; color: #f4dfb6;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none;
    font-size: 22px; font-weight: bold; text-shadow: 0 2px 0 #000; }
  .hud .g { color: #5fe0c4; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: #1c120cd9; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .sign { width: min(360px, 100%); background: linear-gradient(#a8703f, #8a5a32); border: 6px solid #5a3a20; border-radius: 6px; padding: 24px 20px;
    text-align: center; display: flex; flex-direction: column; gap: 12px; position: relative; box-shadow: 0 16px 40px #000c;
    background-image: repeating-linear-gradient(0deg, transparent 0 22px, #00000018 22px 24px), linear-gradient(#a8703f, #8a5a32); }
  .sign::before, .sign::after { content: ""; position: absolute; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: #3a2412; }
  .sign::before { left: 10px; } .sign::after { right: 10px; }
  h1 { font-size: clamp(36px, 11vw, 56px); color: #ffe7a8; text-shadow: 0 3px 0 #5a3a20, 0 6px 10px #0008; letter-spacing: 2px; line-height: 1; }
  p { font-size: 15px; line-height: 1.5; color: #fff3d6; }
  .stat { font-size: 18px; color: #fff3d6; } .stat b { color: #ffe7a8; }
  .btn { border: 3px solid #3a2412; background: #f2b33d; color: #3a2412; font: inherit; font-weight: bold; font-size: 22px; padding: 12px; cursor: pointer;
    border-radius: 4px; box-shadow: 0 5px 0 #3a2412; letter-spacing: 2px; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #3a2412; }
  small { color: #e6c99a; font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div id="score">0 m</div><div class="g" id="gems">◆ 0</div></div>

<div class="overlay" id="menu"><div class="sign">
  <h1>MINE<br>CART</h1>
  <p><b>Tap</b> to hop over rocks and gaps.<br><b>Swipe up / down</b> to switch between the upper and lower rails.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">ALL ABOARD!</button>
  <small>Keyboard: Space jump · ↑ ↓ switch rail</small>
</div></div>
<div class="overlay hidden" id="over"><div class="sign">
  <h1>DERAILED!</h1>
  <div class="stat">Distance <b id="finalScore">0</b></div>
  <div class="stat">Gems <b id="finalGems">0</b></div>
  <div class="stat">Best <b id="bestOver">0</b></div>
  <button class="btn" id="againBtn">RIDE AGAIN</button>
</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const audio = GameAudio({
    bpm: 108, scale: 'dorian', root: 52, prog: [0, 6, 5, 6], seed: 64,
    waves: { lead: 'triangle', bass: 'triangle', arp: 'square' },
    arp: true, arpEvery: 2, arpCutoff: 900, leadOct: 1, leadDensity: 0.3, drums: 'busy', bassPattern: [0, 3, 8, 11], swing: 0.12, volume: 0.15,
    btnBg: 'rgba(242,179,61,.3)'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'mine_cart_best';
  let best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const showBest = () => { $('bestMenu').innerHTML = best ? 'Best <b>' + best + ' m</b>' : ''; }; showBest();

  let W, H, DPR, S, LW, LH, TY;
  const TILE = 40, G = 1900;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    S = Math.min(W / 420, H / 480); LW = W / S; LH = H / S;
    TY = [LH * 0.47, LH * 0.47 + 150];
  }
  addEventListener('resize', resize); resize();
  const hash = n => { const x = Math.sin(n * 63.7) * 43758.5; return x - Math.floor(x); };
  const CX = () => Math.min(LW * 0.26, 140);

  // rails[track][i] = { solid, rock, gem }
  let state = 'menu', rails, gen, cam, speed, cart, gems, t = 0, shake = 0, deadT = 0, sparks = [];
  function reset() {
    rails = [[], []]; gen = 0; cam = 0; speed = 250; gems = 0; sparks = [];
    cart = { y: TY[1], vy: 0, ground: 1, dead: false, rot: 0 };
    for (let i = 0; i < 12; i++) push({}, {});
  }
  function push(a, b) {
    rails[0][gen] = Object.assign({ solid: true, rock: false, gem: false }, a);
    rails[1][gen] = Object.assign({ solid: true, rock: false, gem: false }, b);
    gen++;
  }
  function chunk() {
    const diff = Math.min(1, cam / 40000);
    const r = Math.random();
    const run = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < run; i++) push({ gem: Math.random() < 0.3 }, { gem: Math.random() < 0.2 });
    if (r < 0.3) {
      // long broken stretch on one rail — use the other one
      const broken = Math.random() < 0.5 ? 0 : 1, len = 5 + Math.floor(Math.random() * 4);
      for (let i = 0; i < len; i++) {
        const a = { solid: broken !== 0, gem: broken !== 0 && i % 2 === 0 }, b = { solid: broken !== 1, gem: broken !== 1 && i % 2 === 0 };
        push(a, b);
      }
    } else {
      // short hazards on both rails (always jumpable)
      for (const tr of [0, 1]) {
        const start = gen - run + 1 + Math.floor(Math.random() * (run - 2));
        if (Math.random() < 0.55 + diff * 0.3) {
          if (Math.random() < 0.5) { rails[tr][start].solid = false; if (Math.random() < diff) rails[tr][start + 1].solid = false; }
          else rails[tr][start].rock = true;
          rails[tr][start].gem = false;
        }
      }
    }
  }
  reset();
  const score = () => Math.floor(cam / 20);

  function start() {
    reset(); state = 'play'; audio.start();
    $('menu').classList.add('hidden'); $('over').classList.add('hidden');
    audio.sfx(300, 0.2, 'square', 0.05, 600);
  }
  function crash() {
    if (cart.dead) return;
    cart.dead = true; deadT = 1.1; shake = 12; cart.vy = -400;
    audio.sfx(140, 0.6, 'sawtooth', 0.1, 40);
    if (navigator.vibrate) try { navigator.vibrate(160); } catch (e) {}
  }
  function gameOver() {
    state = 'over';
    const s = score(); if (s > best) { best = s; try { localStorage.setItem(KEY, best); } catch (e) {} }
    $('finalScore').textContent = s + ' m'; $('finalGems').textContent = gems; $('bestOver').textContent = best + ' m'; showBest();
    $('over').classList.remove('hidden');
  }
  function jump() {
    if (state !== 'play' || cart.dead || cart.ground < 0) return;
    cart.vy = -640; cart.ground = -1; audio.sfx(420, 0.12, 'square', 0.05, 700);
  }
  function switchRail(dir) {
    if (state !== 'play' || cart.dead || cart.ground < 0) return;
    if (dir < 0 && cart.ground === 1) { cart.vy = -Math.sqrt(2 * G * (TY[1] - TY[0] + 45)); cart.ground = -1; audio.sfx(350, 0.25, 'triangle', 0.06, 900); }
    else if (dir > 0 && cart.ground === 0) { cart.vy = -260; cart.ground = -1; cart.drop = true; audio.sfx(600, 0.25, 'triangle', 0.06, 250); }
  }

  let sy = 0, down = false, used = false;
  canvas.addEventListener('pointerdown', e => { sy = e.clientY; down = true; used = false; });
  canvas.addEventListener('pointermove', e => {
    if (!down || used) return;
    const dy = e.clientY - sy;
    if (Math.abs(dy) > 26) { used = true; switchRail(dy < 0 ? -1 : 1); }
  });
  canvas.addEventListener('pointerup', () => { if (down && !used) jump(); down = false; });
  addEventListener('keydown', e => {
    if (state !== 'play' && (e.key === 'Enter' || e.key === ' ')) { start(); e.preventDefault(); return; }
    if (e.repeat) return;
    if (e.key === ' ') { jump(); e.preventDefault(); }
    else if (e.key === 'ArrowUp' || e.key === 'w') { switchRail(-1); e.preventDefault(); }
    else if (e.key === 'ArrowDown' || e.key === 's') { switchRail(1); e.preventDefault(); }
  });
  $('startBtn').onclick = start; $('againBtn').onclick = start;

  const solidAt = (tr, x) => { const c = rails[tr][Math.floor(x / TILE)]; return !!(c && c.solid); };

  function update(dt) {
    t += dt;
    if (state === 'menu') cam += 100 * dt;
    while (gen * TILE < cam + LW + 400) chunk();
    if (state === 'play') {
      const x = cam + CX();
      if (!cart.dead) {
        speed = Math.min(560, 250 + cam / 100);
        cam += speed * dt;
        const prevY = cart.y;
        if (cart.ground >= 0) {
          if (!solidAt(cart.ground, x)) { cart.ground = -1; cart.vy = 0; }
          else cart.y = TY[cart.ground];
        }
        if (cart.ground < 0) {
          cart.vy += G * dt; cart.y += cart.vy * dt;
          if (cart.vy > 0) {
            for (const tr of [0, 1]) {
              if (cart.drop && tr === 0) continue;
              if (prevY <= TY[tr] + 2 && cart.y >= TY[tr] && solidAt(tr, x)) {
                cart.y = TY[tr]; cart.vy = 0; cart.ground = tr; cart.drop = false;
                audio.sfx(110, 0.08, 'triangle', 0.06);
                for (let i = 0; i < 6; i++) sparks.push({ x: x - 10 + Math.random() * 20, y: cart.y, vx: (Math.random() - .5) * 160, vy: -Math.random() * 160, life: 0.4 });
                break;
              }
            }
            if (cart.drop && cart.y > TY[0] + 30) cart.drop = false;
          }
          if (cart.y > LH + 60) crash();
        }
        cart.rot = cart.ground < 0 ? Math.max(-0.35, Math.min(0.35, cart.vy / 1500)) : 0;
        // rocks and gems
        for (const tr of [0, 1]) {
          const i0 = Math.floor((x - 18) / TILE), i1 = Math.floor((x + 18) / TILE);
          for (let i = i0; i <= i1; i++) {
            const cell = rails[tr][i]; if (!cell) continue;
            const cx = i * TILE + TILE / 2;
            if (cell.rock && Math.abs(cx - x) < 28 && cart.y > TY[tr] - 26 && cart.y < TY[tr] + 6) crash();
            if (cell.gem && Math.abs(cx - x) < 26 && Math.abs(cart.y - 30 - (TY[tr] - 40)) < 30) { cell.gem = false; gems++; audio.sfx(1500 + (gems % 4) * 200, 0.08, 'sine', 0.06); }
          }
        }
        if (cart.ground >= 0 && Math.random() < dt * 20) sparks.push({ x: x - 16, y: cart.y, vx: -100 - Math.random() * 100, vy: -Math.random() * 60, life: 0.25 });
      } else {
        cart.vy += G * dt; cart.y += cart.vy * dt; cart.rot += dt * 8;
        deadT -= dt; if (deadT <= 0 && state === 'play') gameOver();
      }
    }
    for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 600 * dt; s.life -= dt; }
    sparks = sparks.filter(s => s.life > 0);
    shake = Math.max(0, shake - dt * 30);
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#1c120c'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.scale(S, S);
    if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    // cave layers
    for (const [par, col, top, amp] of [[0.2, '#2a1b12', 0.08, 40], [0.45, '#36241a', 0.02, 30]]) {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(0, 0);
      for (let x = 0; x <= LW + 30; x += 30) { const wx = x + cam * par; ctx.lineTo(x, LH * top + Math.abs(Math.sin(wx * 0.013)) * amp + (hash(Math.floor(wx / 30)) * 30)); }
      ctx.lineTo(LW, 0); ctx.fill();
    }
    // stalactites & crystals
    const off = cam * 0.45;
    for (let i = Math.floor(off / 90) - 1; i * 90 - off < LW + 90; i++) {
      const x = i * 90 - off, h = hash(i + 3);
      ctx.fillStyle = '#3e2a1e';
      ctx.beginPath(); ctx.moveTo(x, LH * 0.05); ctx.lineTo(x + 10, LH * 0.05 + 30 + h * 50); ctx.lineTo(x + 20, LH * 0.05); ctx.fill();
      if (h > 0.6) { ctx.fillStyle = h > 0.8 ? '#5fe0c4aa' : '#b98cffaa'; ctx.beginPath(); ctx.moveTo(x + 40, LH * 0.3); ctx.lineTo(x + 48, LH * 0.3 - 26); ctx.lineTo(x + 56, LH * 0.3); ctx.fill(); }
    }
    // torches on back wall
    for (let i = Math.floor(off / 260) - 1; i * 260 - off < LW + 260; i++) {
      const x = i * 260 - off + 130, y = TY[0] - 90;
      const gl = ctx.createRadialGradient(x, y, 0, x, y, 90);
      gl.addColorStop(0, '#ffb34766'); gl.addColorStop(1, '#ffb34700');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, 90, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5a3a20'; ctx.fillRect(x - 2, y, 4, 16);
      ctx.fillStyle = '#ffcf5a'; ctx.beginPath(); ctx.ellipse(x, y - 4, 5, 9 + Math.sin(t * 20 + i) * 2, 0, 0, Math.PI * 2); ctx.fill();
    }
    // ground below lower rail
    ctx.fillStyle = '#2a1b12'; ctx.fillRect(0, TY[1] + 10, LW, LH);
    ctx.save(); ctx.translate(-cam, 0);
    const i0 = Math.floor(cam / TILE) - 1, i1 = Math.ceil((cam + LW) / TILE) + 1;
    for (let i = i0; i <= i1; i++) {
      for (const tr of [0, 1]) {
        const cell = rails[tr][i]; if (!cell) continue;
        const x = i * TILE, y = TY[tr];
        if (cell.solid) {
          if (tr === 0 && i % 3 === 0) { ctx.fillStyle = '#5a3a20'; ctx.fillRect(x + 4, y + 6, 8, TY[1] - y); ctx.fillStyle = '#4a2e18'; ctx.save(); ctx.translate(x + 8, y + 10); ctx.rotate(0.6); ctx.fillRect(0, 0, 6, 70); ctx.restore(); }
          ctx.fillStyle = '#6b4526'; for (let k = 0; k < 2; k++) ctx.fillRect(x + 4 + k * 20, y + 2, 12, 7);
          ctx.fillStyle = '#9aa3ad'; ctx.fillRect(x, y - 1, TILE, 4);
          ctx.fillStyle = '#d7dee6'; ctx.fillRect(x, y - 1, TILE, 1);
        } else if (tr === 1) {
          ctx.fillStyle = '#0d0805'; ctx.fillRect(x, y + 10, TILE, LH);
        }
        if (cell.rock) {
          ctx.fillStyle = '#6e6259'; ctx.beginPath(); ctx.moveTo(x + 6, y); ctx.lineTo(x + 12, y - 22); ctx.lineTo(x + 26, y - 26); ctx.lineTo(x + 36, y); ctx.fill();
          ctx.fillStyle = '#8a7d72'; ctx.beginPath(); ctx.moveTo(x + 12, y - 22); ctx.lineTo(x + 26, y - 26); ctx.lineTo(x + 22, y - 12); ctx.fill();
        }
        if (cell.gem) {
          const gx = x + TILE / 2, gy = y - 40 + Math.sin(t * 4 + i) * 3;
          ctx.fillStyle = '#5fe0c444'; ctx.beginPath(); ctx.arc(gx, gy, 13, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#5fe0c4'; ctx.beginPath(); ctx.moveTo(gx, gy - 9); ctx.lineTo(gx + 7, gy - 2); ctx.lineTo(gx, gy + 9); ctx.lineTo(gx - 7, gy - 2); ctx.fill();
          ctx.fillStyle = '#d6fff6'; ctx.beginPath(); ctx.moveTo(gx, gy - 9); ctx.lineTo(gx + 3, gy - 2); ctx.lineTo(gx - 3, gy - 2); ctx.fill();
        }
      }
    }
    // cart
    const x = cam + CX();
    ctx.save(); ctx.translate(x, cart.y); ctx.rotate(cart.rot);
    const lamp = ctx.createRadialGradient(20, -30, 0, 60, -20, 160);
    lamp.addColorStop(0, '#fff2b866'); lamp.addColorStop(1, '#fff2b800');
    ctx.fillStyle = lamp; ctx.beginPath(); ctx.moveTo(20, -32); ctx.lineTo(220, -110); ctx.lineTo(220, 60); ctx.closePath(); ctx.fill();
    // miner
    ctx.fillStyle = '#3b6ea5'; ctx.fillRect(-8, -48, 16, 18);
    ctx.fillStyle = '#f2c29b'; ctx.beginPath(); ctx.arc(0, -56, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f2b33d'; ctx.beginPath(); ctx.arc(0, -59, 10, Math.PI, 0); ctx.fill(); ctx.fillRect(-11, -60, 22, 3);
    ctx.fillStyle = '#fff6c8'; ctx.fillRect(4, -66, 6, 5);
    ctx.fillStyle = '#5a3a20'; ctx.fillRect(4, -55, 7, 2);
    // cart body
    ctx.fillStyle = '#7a4f2c'; ctx.beginPath(); ctx.moveTo(-24, -36); ctx.lineTo(24, -36); ctx.lineTo(20, -8); ctx.lineTo(-20, -8); ctx.fill();
    ctx.fillStyle = '#9aa3ad'; ctx.fillRect(-25, -38, 50, 5); ctx.fillRect(-20, -22, 40, 3);
    ctx.fillStyle = '#2b2b2b';
    for (const wx of [-13, 13]) { ctx.beginPath(); ctx.arc(wx, -5, 6, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#9aa3ad';
    for (const wx of [-13, 13]) { ctx.save(); ctx.translate(wx, -5); ctx.rotate(cam / 6); ctx.fillRect(-1, -5, 2, 10); ctx.restore(); }
    ctx.restore();
    for (const s of sparks) { ctx.globalAlpha = Math.max(0, s.life * 3); ctx.fillStyle = '#ffd36b'; ctx.fillRect(s.x, s.y, 2, 2); }
    ctx.globalAlpha = 1;
    ctx.restore();
    // darkness vignette
    const vg = ctx.createRadialGradient(CX() + 60, LH * 0.5, 80, CX() + 60, LH * 0.5, Math.max(LW, LH) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.75)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, LW, LH);
    ctx.restore();
    $('score').textContent = score() + ' m'; $('gems').textContent = '◆ ' + gems;
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
