<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Simon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#111827;font-family:'Outfit',system-ui,sans-serif;color:#f3f4f6;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:420px;margin:0 auto;padding:max(env(safe-area-inset-top),8px) 10px max(env(safe-area-inset-bottom),8px)}
.header{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding:4px 0}
.logo{font-size:20px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat{background:#1f2937;border-radius:12px;padding:6px 14px;font-size:13px;font-weight:700}
.status{text-align:center;font-size:14px;font-weight:700;padding:8px 0;color:#9ca3af;flex-shrink:0;min-height:28px}
.status.go{color:#34d399}.status.lose{color:#f87171}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#pad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;width:min(80vw,calc(100dvh - 200px));aspect-ratio:1;max-width:320px}
.btn{border:none;border-radius:20px;cursor:pointer;transition:filter .1s,transform .1s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.btn:active,.btn.lit{filter:brightness(1.45);transform:scale(.97)}
.b0{background:#22c55e}.b1{background:#ef4444}.b2{background:#eab308}.b3{background:#3b82f6}
.controls{display:flex;gap:8px;justify-content:center;padding:8px 0 4px;flex-shrink:0}
button.ctrl{font-family:inherit;background:#1f2937;border:1px solid #374151;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;color:#f3f4f6;min-height:42px}
button.ctrl:active{transform:scale(.96)}
#btnMusic.active{background:#7c3aed;border-color:#a78bfa}
.hint{text-align:center;font-size:11px;color:#6b7280;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="stat">Level <span id="level">0</span></div>
    <div class="logo">SIMON</div>
    <div class="stat">Best <span id="best">0</span></div>
  </div>
  <div class="status" id="status">Press Start</div>
  <div class="board-wrap">
    <div id="pad">
      <button class="btn b0" data-i="0"></button>
      <button class="btn b1" data-i="1"></button>
      <button class="btn b2" data-i="2"></button>
      <button class="btn b3" data-i="3"></button>
    </div>
  </div>
  <div class="controls">
    <button class="ctrl" id="btnMusic" onclick="toggleMusic()">♪ Music</button>
    <button class="ctrl" onclick="startGame()">Start</button>
  </div>
  <div class="hint">Repeat the color sequence</div>
</div>
<script>
const freqs=[329.63,261.63,220,164.81];
let seq=[],player=[],playing=false,level=0,best=+(localStorage.getItem('simonBest')||0);
document.getElementById('best').textContent=best;
const statusEl=document.getElementById('status');
const btns=[...document.querySelectorAll('.btn')];

let audioCtx=null,musicNodes=[],musicOn=false,musicTimer=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function stopMusic(){musicNodes.forEach(n=>{try{n.stop()}catch(e){}try{n.disconnect()}catch(e){}});musicNodes=[];if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function startMusic(){
  const ctx=ensureAudio();stopMusic();
  const m=ctx.createGain();m.gain.value=0.05;m.connect(ctx.destination);
  function tone(f,t,d){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.035,t+.4);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(m);o.start(t);o.stop(t+d+.05);musicNodes.push(o)}
  function L(){const t=ctx.currentTime+.05;tone(392,t,2.2);tone(494,t+.5,2);tone(587,t+1.2,1.8);tone(784,t+2,1.5)}
  L();musicTimer=setInterval(L,4000);
}
function toggleMusic(){musicOn=!musicOn;document.getElementById('btnMusic').classList.toggle('active',musicOn);if(musicOn)startMusic();else stopMusic()}

function beep(i,dur=0.35){
  const ctx=ensureAudio();
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';o.frequency.value=freqs[i];
  g.gain.setValueAtTime(0.15,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
  o.connect(g);g.connect(ctx.destination);
  o.start();o.stop(ctx.currentTime+dur);
}
function light(i,on){btns[i].classList.toggle('lit',on)}
async function playSeq(){
  playing=true;statusEl.textContent='Watch...';statusEl.className='status';
  await wait(400);
  for(const i of seq){
    light(i,true);beep(i);await wait(450);light(i,false);await wait(180);
  }
  player=[];playing=false;statusEl.textContent='Your turn';statusEl.className='status go';
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function startGame(){
  seq=[];level=0;document.getElementById('level').textContent=0;
  nextRound();
}
async function nextRound(){
  seq.push(Math.floor(Math.random()*4));
  level=seq.length;document.getElementById('level').textContent=level;
  await playSeq();
}
btns.forEach(b=>{
  b.addEventListener('click',()=>{
    if(playing||!seq.length)return;
    const i=+b.dataset.i;
    light(i,true);beep(i,0.25);setTimeout(()=>light(i,false),200);
    player.push(i);
    const idx=player.length-1;
    if(player[idx]!==seq[idx]){
      statusEl.textContent='Wrong! Try again';statusEl.className='status lose';
      if(level-1>best){best=level-1;localStorage.setItem('simonBest',best);document.getElementById('best').textContent=best}
      seq=[];playing=true;return;
    }
    if(player.length===seq.length){
      statusEl.textContent='Good!';statusEl.className='status go';
      if(level>best){best=level;localStorage.setItem('simonBest',best);document.getElementById('best').textContent=best}
      setTimeout(nextRound,700);
    }
  });
});
</script>
</body>
</html>
