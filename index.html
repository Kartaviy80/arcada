<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a6f8f">
<title>Reef Dash</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a4f6f;
    font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif; color: #fff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; }
  .bubble { background: #ffffff2a; border: 2px solid #ffffff55; border-radius: 22px; padding: 4px 14px; font-weight: bold; font-size: 20px; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; background: radial-gradient(circle at 50% 30%, #1fb6c9cc, #063a55f0 75%); transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  h1 { font-size: clamp(46px, 13vw, 82px); line-height: .9; color: #ffd166; text-shadow: 0 5px 0 #ef476f, 0 10px 18px #0006; transform: rotate(-4deg); }
  h1 span { color: #fff; }
  p { max-width: 320px; line-height: 1.5; font-size: 16px; }
  .stats { display: flex; gap: 12px; }
  .stats div { background: #ffffff22; border-radius: 16px; padding: 8px 16px; } .stats small { display: block; font-size: 12px; opacity: .8; } .stats b { font-size: 24px; color: #ffd166; }
  .btn { border: none; cursor: pointer; font: inherit; font-weight: bold; font-size: 24px; color: #063a55; padding: 12px 50px;
    border-radius: 40px; background: #ffd166; box-shadow: 0 6px 0 #e09f1f; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #e09f1f; }
  small.k { opacity: .7; font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="bubble" id="score">0</div><div class="bubble" id="pearls">⚪ 0</div></div>

<div class="overlay" id="menu">
  <h1>REEF<br><span>DASH</span></h1>
  <p><b>Swipe up / down</b> (or tap above / below the fish) to swim between three depths. Dodge jellyfish, hooks and hungry sharks — collect pearls!</p>
  <div class="stats"><div><small>BEST</small><b id="bestMenu">0</b></div></div>
  <button class="btn" id="startBtn">SWIM!</button>
  <small class="k">Keyboard: ↑ ↓</small>
</div>
<div class="overlay hidden" id="over">
  <h1>GULP!</h1>
  <div class="stats">
    <div><small>SCORE</small><b id="finalScore">0</b></div>
    <div><small>PEARLS</small><b id="finalPearls">0</b></div>
    <div><small>BEST</small><b id="bestOver">0</b></div>
  </div>
  <button class="btn" id="againBtn">AGAIN</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const audio = GameAudio({
    bpm: 86, scale: 'lydian', root: 60, prog: [0, 1, 5, 4], seed: 45,
    waves: { lead: 'sine', bass: 'sine', arp: 'sine', pad: 'triangle' },
    pad: true, arp: true, arpEvery: 1, arpOct: 1, leadOct: 1, leadDensity: 0.22, drums: false, bassPattern: [0, 10], volume: 0.2,
    btnBg: 'rgba(255,255,255,.22)'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'reef_dash_best';
  let best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  $('bestMenu').textContent = best;

  let W, H, DPR, S, LW, LH, LANE_GAP = 95;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    S = Math.min(W / 420, H / 480); LW = W / S; LH = H / S;
  }
  addEventListener('resize', resize); resize();
  const laneY = l => LH * 0.52 + l * LANE_GAP;
  const hash = n => { const x = Math.sin(n * 45.164) * 43758.5453; return x - Math.floor(x); };
  const FX = () => Math.min(LW * 0.25, 130);

  let state = 'menu', cam, speed, fish, objs, nextX, pearls, t = 0, shake = 0, deadT = 0, bubbles = [], fx = [];
  for (let i = 0; i < 30; i++) bubbles.push({ x: Math.random() * 900, y: Math.random() * 900, r: 1.5 + Math.random() * 4, v: 20 + Math.random() * 40 });
  function reset() {
    cam = 0; speed = 230; objs = []; nextX = 600; pearls = 0; fx = [];
    fish = { lane: 0, y: laneY(0), dead: false, wiggle: 0 };
  }
  reset();
  const score = () => Math.floor(cam / 15) + pearls * 5;

  function spawn() {
    const diff = Math.min(1, cam / 30000);
    const free = Math.floor(Math.random() * 3) - 1;
    const r = Math.random();
    if (r < 0.12 + diff * 0.1 && cam > 1500) {
      // shark: warns on the right then charges along its lane
      const lane = Math.floor(Math.random() * 3) - 1;
      objs.push({ type: 'shark', lane, x: nextX + 300, warn: 1.2, charging: false });
      nextX += 420;
      return;
    }
    for (const l of [-1, 0, 1]) {
      if (l === free) continue;
      if (Math.random() < 0.45 - diff * 0.2) continue;
      const type = l === -1 && Math.random() < 0.5 ? 'hook' : l === 1 && Math.random() < 0.5 ? 'urchin' : 'jelly';
      objs.push({ type, lane: l, x: nextX + Math.random() * 30, ph: Math.random() * 6 });
    }
    for (let i = 0; i < 4; i++) objs.push({ type: 'pearl', lane: free, x: nextX + 70 + i * 34 });
    nextX += Math.max(190, 300 - cam / 200) + Math.random() * 90;
  }

  function start() {
    reset(); state = 'play'; audio.start();
    $('menu').classList.add('hidden'); $('over').classList.add('hidden');
    audio.sfx(400, 0.2, 'sine', 0.07, 800);
  }
  function die() {
    if (fish.dead) return;
    fish.dead = true; deadT = 1.1; shake = 10;
    audio.sfx(300, 0.5, 'triangle', 0.09, 70);
    if (navigator.vibrate) try { navigator.vibrate(130); } catch (e) {}
    for (let i = 0; i < 16; i++) fx.push({ x: cam + FX(), y: fish.y, vx: (Math.random() - .5) * 200, vy: -Math.random() * 200, r: 2 + Math.random() * 5, life: 1.2 });
  }
  function gameOver() {
    state = 'over';
    const s = score(); if (s > best) { best = s; try { localStorage.setItem(KEY, best); } catch (e) {} }
    $('finalScore').textContent = s; $('finalPearls').textContent = pearls; $('bestOver').textContent = best; $('bestMenu').textContent = best;
    $('over').classList.remove('hidden');
  }
  function move(d) {
    if (state !== 'play' || fish.dead) return;
    const n = Math.max(-1, Math.min(1, fish.lane + d));
    if (n === fish.lane) return;
    fish.lane = n; audio.sfx(d < 0 ? 620 : 420, 0.1, 'sine', 0.06, d < 0 ? 900 : 300);
    for (let i = 0; i < 4; i++) fx.push({ x: cam + FX() - 20, y: fish.y, vx: -60 - Math.random() * 60, vy: -Math.random() * 60, r: 2 + Math.random() * 3, life: 0.8 });
  }

  let sy = 0, down = false, used = false;
  canvas.addEventListener('pointerdown', e => { sy = e.clientY; down = true; used = false; });
  canvas.addEventListener('pointermove', e => {
    if (!down || used) return;
    const dy = e.clientY - sy;
    if (Math.abs(dy) > 22) { used = true; move(dy > 0 ? 1 : -1); }
  });
  canvas.addEventListener('pointerup', e => {
    if (down && !used) move(e.clientY / S < fish.y ? -1 : 1);
    down = false;
  });
  addEventListener('keydown', e => {
    if (state !== 'play' && (e.key === 'Enter' || e.key === ' ')) { start(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp' || e.key === 'w') { move(-1); e.preventDefault(); }
    else if (e.key === 'ArrowDown' || e.key === 's') { move(1); e.preventDefault(); }
  });
  $('startBtn').onclick = start; $('againBtn').onclick = start;

  function update(dt) {
    t += dt;
    for (const b of bubbles) { b.y -= b.v * dt; b.x -= (state === 'play' ? speed * 0.2 : 20) * dt; if (b.y < -10) { b.y = LH + 10; } if (b.x < -10) b.x += LW + 20; }
    if (state === 'menu') cam += 80 * dt;
    fish.y += (laneY(fish.lane) - fish.y) * Math.min(1, dt * 12);
    if (state === 'play') {
      if (!fish.dead) {
        speed = Math.min(520, 230 + cam / 110);
        cam += speed * dt;
        while (nextX < cam + LW + 300) spawn();
        const fxw = cam + FX();
        for (const o of objs) {
          if (o.type === 'shark') {
            if (o.x - cam < LW + 40 && !o.charging) { o.warn -= dt; if (o.warn <= 0) { o.charging = true; audio.sfx(160, 0.4, 'sawtooth', 0.05, 90); } else o.x = cam + LW + 40; }
            if (o.charging) o.x -= speed * 1.3 * dt;
          }
          const oy = laneY(o.lane) + (o.type === 'jelly' ? Math.sin(t * 3 + o.ph) * 12 : 0);
          const dx = o.x - fxw, dy = oy - fish.y;
          if (o.type === 'pearl') { if (!o.taken && Math.abs(dx) < 24 && Math.abs(dy) < 30) { o.taken = true; pearls++; audio.sfx(1100 + (pearls % 5) * 120, 0.08, 'sine', 0.06); } }
          else {
            const rx = o.type === 'shark' ? 52 : 22, ry = o.type === 'hook' ? 40 : 24;
            if (Math.abs(dx) < rx && Math.abs(dy) < ry) die();
          }
        }
        objs = objs.filter(o => o.x > cam - 150 && !o.taken);
      } else { deadT -= dt; if (deadT <= 0 && state === 'play') gameOver(); }
    }
    for (const p of fx) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    fx = fx.filter(p => p.life > 0);
    shake = Math.max(0, shake - dt * 30);
  }

  function drawFish(x, y) {
    ctx.save(); ctx.translate(x, y);
    if (fish.dead) { ctx.rotate(Math.PI); ctx.globalAlpha = Math.max(0.3, deadT); }
    const sw = Math.sin(t * 12) * 0.25;
    // tail
    ctx.fillStyle = '#ef476f';
    ctx.save(); ctx.translate(-20, 0); ctx.rotate(sw);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-16, -13); ctx.lineTo(-12, 0); ctx.lineTo(-16, 13); ctx.closePath(); ctx.fill(); ctx.restore();
    // body
    ctx.fillStyle = '#ff8c42'; ctx.beginPath(); ctx.ellipse(0, 0, 24, 16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-4, 0, 4, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9, 0, 3.5, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ef476f'; ctx.beginPath(); ctx.moveTo(-6, -14); ctx.quadraticCurveTo(2, -26, 10, -14); ctx.fill();
    // eye
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(15, -4, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#073b4c'; ctx.beginPath(); ctx.arc(16.5, -4, fish.dead ? 1 : 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawObj(o) {
    const x = o.x, y = laneY(o.lane);
    if (o.type === 'jelly') {
      const yy = y + Math.sin(t * 3 + o.ph) * 12, pulse = 1 + Math.sin(t * 6 + o.ph) * 0.08;
      ctx.strokeStyle = '#f7a8d8aa'; ctx.lineWidth = 2;
      for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(x + k * 6, yy); ctx.quadraticCurveTo(x + k * 6 + Math.sin(t * 5 + k) * 6, yy + 18, x + k * 6, yy + 32); ctx.stroke(); }
      ctx.fillStyle = '#f7a8d8dd'; ctx.beginPath(); ctx.ellipse(x, yy, 20 * pulse, 16, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#ffffff88'; ctx.beginPath(); ctx.ellipse(x - 6, yy - 8, 5, 3, -0.5, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'hook') {
      ctx.strokeStyle = '#ffffff99'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, -10); ctx.lineTo(x, y - 18); ctx.stroke();
      ctx.strokeStyle = '#c0c8d0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y - 20); ctx.lineTo(x, y + 10); ctx.arc(x - 10, y + 10, 10, 0, Math.PI * 0.9); ctx.stroke();
      ctx.fillStyle = '#ef476f'; ctx.beginPath(); ctx.arc(x, y - 30, 7, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'urchin') {
      ctx.strokeStyle = '#3d2c5e'; ctx.lineWidth = 2.5;
      for (let k = 0; k < 14; k++) { const a = k / 14 * Math.PI * 2 + t * 0.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * 24, y + Math.sin(a) * 24); ctx.stroke(); }
      ctx.fillStyle = '#5b3f8c'; ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'pearl') {
      ctx.fillStyle = '#ffffff33'; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fdf6e3'; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - 2, y - 2, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'shark') {
      if (!o.charging) {
        const sx = cam + LW - 30;
        ctx.fillStyle = 'rgba(239,71,111,' + (0.5 + 0.5 * Math.sin(t * 20)) + ')';
        ctx.beginPath(); ctx.arc(sx, y, 18, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('!', sx, y + 9);
        return;
      }
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = '#6c8a9e';
      ctx.beginPath(); ctx.moveTo(-58, 0); ctx.quadraticCurveTo(-10, -30, 50, -6); ctx.lineTo(56, 2); ctx.quadraticCurveTo(10, 22, -58, 0); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, -16); ctx.lineTo(8, -40); ctx.lineTo(16, -12); ctx.fill();
      ctx.beginPath(); ctx.moveTo(56, -2); ctx.lineTo(76, -22 + Math.sin(t * 14) * 4); ctx.lineTo(70, 0); ctx.lineTo(76, 18 + Math.sin(t * 14) * 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#dfe7ec'; ctx.beginPath(); ctx.moveTo(-56, 2); ctx.quadraticCurveTo(0, 18, 50, 2); ctx.quadraticCurveTo(0, 8, -56, 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-36, -6, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-37, -6, 2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2ec4d6'); g.addColorStop(0.5, '#0a6f8f'); g.addColorStop(1, '#063a55');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.scale(S, S);
    if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    // light rays
    for (let i = 0; i < 6; i++) {
      const x = ((i * 160 - cam * 0.1) % (LW + 200) + LW + 200) % (LW + 200) - 100;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + 0.03 * Math.sin(t + i)) + ')';
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 50, 0); ctx.lineTo(x - 60, LH); ctx.lineTo(x - 140, LH); ctx.fill();
    }
    // far reef silhouettes
    ctx.fillStyle = '#08506b';
    ctx.beginPath(); ctx.moveTo(0, LH);
    for (let x = 0; x <= LW + 20; x += 20) ctx.lineTo(x, LH - 60 - Math.abs(Math.sin((x + cam * 0.25) * 0.01)) * 60 - Math.sin((x + cam * 0.25) * 0.05) * 8);
    ctx.lineTo(LW, LH); ctx.fill();
    // seabed with coral and seaweed
    ctx.fillStyle = '#e9c891'; ctx.fillRect(0, LH - 26, LW, 30);
    const step = 70, off = cam * 0.9;
    for (let i = Math.floor(off / step) - 1; i * step - off < LW + step; i++) {
      const x = i * step - off, h = hash(i);
      if (h < 0.4) {
        ctx.strokeStyle = '#2a9d5c'; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x, LH - 24);
        for (let k = 1; k <= 5; k++) ctx.lineTo(x + Math.sin(t * 2 + k + i) * 6, LH - 24 - k * 14);
        ctx.stroke();
      } else if (h < 0.7) {
        ctx.fillStyle = ['#ef476f', '#ff8c42', '#9b5de5'][((i % 3) + 3) % 3];
        for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(x + k * 10 - 10, LH - 30 - (k % 2) * 12, 9, 0, Math.PI * 2); ctx.fill(); }
      } else {
        ctx.fillStyle = '#c99b6b'; ctx.beginPath(); ctx.ellipse(x, LH - 24, 16, 9, 0, Math.PI, 0); ctx.fill();
      }
    }
    // lane guides (soft)
    for (const l of [-1, 0, 1]) { ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fillRect(0, laneY(l) - 30, LW, 60); }
    ctx.save(); ctx.translate(-cam, 0);
    for (const o of objs) if (o.x > cam - 100 && o.x < cam + LW + 120 || o.type === 'shark') drawObj(o);
    drawFish(cam + FX(), fish.y);
    for (const p of fx) { ctx.globalAlpha = Math.max(0, p.life); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke(); }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.2;
    for (const b of bubbles) { ctx.beginPath(); ctx.arc(((b.x % LW) + LW) % LW, b.y, b.r, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
    $('score').textContent = score(); $('pearls').textContent = '⚪ ' + pearls;
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
