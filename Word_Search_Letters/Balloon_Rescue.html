<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4fb2ff">
<title>Balloon Rescue</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #7cc8ff; color: #fff;
    font-family: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif; font-weight: 800;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  button { font: inherit; font-weight: 900; cursor: pointer; border: none; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 18px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay.hidden .card { transform: translateY(30px) scale(.92); }
  .dim { background: radial-gradient(ellipse at 50% 45%, rgba(20,50,110,.35), rgba(8,20,54,.78)); }
  #menu { justify-content: space-between; padding: max(58px, calc(env(safe-area-inset-top) + 50px)) 18px max(70px, calc(env(safe-area-inset-bottom) + 66px));
    background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(30,80,160,0) 24%, rgba(20,50,110,0) 46%, rgba(14,34,84,.86) 60%, rgba(10,22,58,.96) 72%); }
  .mtop, .mbot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tag { font-size: 12px; letter-spacing: 4px; color: #fff; text-shadow: 0 2px 4px rgba(10,40,90,.7); }
  .title { font-weight: 900; line-height: .84; letter-spacing: 1px; font-size: clamp(50px, 15vw, 108px); }
  .title .t1, .title .t2 { display: block; }
  .title b { display: inline-block; animation: bob 2.6s ease-in-out infinite; -webkit-background-clip: text; background-clip: text; color: transparent; }
  .title .t1 b { background-image: linear-gradient(180deg, #fffbd0 0%, #ffd54a 38%, #ff8a2a 70%, #ff4f5e 100%); filter: drop-shadow(0 3px 0 #b8321c) drop-shadow(0 7px 0 rgba(60,20,40,.28)); }
  .title .t2 b { font-size: .8em; letter-spacing: .08em; background-image: linear-gradient(180deg, #ffffff 0%, #c8f2ff 40%, #49b4ff 75%, #1f6fd8 100%); filter: drop-shadow(0 3px 0 #123f8a) drop-shadow(0 7px 0 rgba(10,30,70,.3)); }
  .title b:nth-child(2) { animation-delay: -.3s; } .title b:nth-child(3) { animation-delay: -.6s; } .title b:nth-child(4) { animation-delay: -.9s; }
  .title b:nth-child(5) { animation-delay: -1.2s; } .title b:nth-child(6) { animation-delay: -1.5s; } .title b:nth-child(7) { animation-delay: -1.8s; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-2deg); } }
  .mstats { font-size: 14px; color: #e8f4ff; text-shadow: 0 1px 3px #000; letter-spacing: 1px; } .mstats b { color: #ffd54a; }
  .btn { border-radius: 999px; padding: 13px 50px; font-size: 25px; letter-spacing: 3px; color: #fff; min-width: 220px;
    background: linear-gradient(180deg, #ffe066, #ffa42e 52%, #f2621e); text-shadow: 0 2px 0 rgba(150,50,0,.55);
    box-shadow: 0 6px 0 #b23f0c, 0 12px 26px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.7); animation: pulse 1.8s ease-in-out infinite; }
  .btn small { display: block; font-size: 12px; letter-spacing: 2px; opacity: .92; margin-top: 1px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b23f0c, inset 0 2px 0 rgba(255,255,255,.7); }
  @keyframes pulse { 50% { filter: brightness(1.08); box-shadow: 0 6px 0 #b23f0c, 0 12px 34px rgba(255,170,60,.55), inset 0 2px 0 rgba(255,255,255,.7); } }
  .sbtn { border-radius: 16px; padding: 9px 18px; font-size: 15px; letter-spacing: 2px; color: #fff; background: linear-gradient(180deg, #7fd8ff, #2e8fe8);
    box-shadow: 0 4px 0 #1a56a6, 0 8px 16px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.55); text-shadow: 0 1px 0 rgba(10,50,110,.6); }
  .sbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1a56a6; }
  .sbtn.alt { background: linear-gradient(180deg, #c6f27a, #4fbf3a); box-shadow: 0 4px 0 #2a7a1e, 0 8px 16px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.55); }
  .mrow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .quest { font-size: 13px; color: #fff3c4; letter-spacing: .5px; text-shadow: 0 1px 2px rgba(0,0,0,.6); max-width: 360px; }
  .quest i { font-style: normal; color: #ffd54a; }
  #coinsTop { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 12; padding: 6px 14px 6px 10px; border-radius: 20px;
    background: rgba(12,30,72,.55); font-size: 18px; color: #ffe27a; text-shadow: 0 1px 2px #000; transition: opacity .3s; }
  #coinsTop.hidden { opacity: 0; pointer-events: none; }
  .card { position: relative; background: linear-gradient(180deg, #ffffff, #e9f4ff); color: #24406a; border-radius: 26px; padding: 20px 20px 18px;
    width: min(92vw, 410px); max-height: calc(100vh - 24px); overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 10px;
    box-shadow: 0 8px 0 rgba(30,70,140,.35), 0 22px 50px rgba(0,0,0,.4), inset 0 -3px 0 rgba(120,160,220,.25); transition: transform .35s cubic-bezier(.2,1.4,.4,1); }
  .card.wide { width: min(94vw, 760px); }
  .card h2 { font-size: clamp(30px, 9vw, 44px); line-height: 1; letter-spacing: 1px; -webkit-background-clip: text; background-clip: text; color: transparent;
    background-image: linear-gradient(180deg, #ffd54a, #ff8a2a 60%, #ff4f5e); filter: drop-shadow(0 3px 0 #b8321c); }
  .card h2.blue { background-image: linear-gradient(180deg, #8fe0ff, #2e8fe8 70%); filter: drop-shadow(0 3px 0 #123f8a); }
  .card .btn { min-width: 0; width: 100%; max-width: 300px; }
  .card .sbtn { min-width: 160px; }
  .chead { width: 100%; display: flex; align-items: center; justify-content: center; position: relative; padding: 0 34px; }
  .chead h2 { font-size: clamp(26px, 8vw, 44px); }
  .x { position: absolute; right: -6px; top: -6px; width: 38px; height: 38px; border-radius: 50%; color: #fff; font-size: 18px; background: linear-gradient(180deg, #ff8a8a, #e8404a); box-shadow: 0 3px 0 #a01e2a; }
  .msub { font-size: 14px; color: #5a76a0; letter-spacing: .5px; }
  .clue { font-size: 13px; letter-spacing: 3px; color: #2e8fe8; }
  .stars { display: flex; gap: 6px; align-items: flex-end; justify-content: center; height: 70px; }
  .stars i { width: 52px; height: 52px; background: #cfdcec; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .stars i:nth-child(2) { width: 68px; height: 68px; margin-bottom: 8px; }
  .stars i.on { background: linear-gradient(180deg, #fff7a8, #ffcc2a 48%, #f08a0a); animation: starIn .55s cubic-bezier(.2,1.8,.4,1) backwards; }
  .stars i.on:nth-child(2) { animation-delay: .25s; } .stars i.on:nth-child(3) { animation-delay: .5s; }
  @keyframes starIn { from { transform: scale(0) rotate(-90deg); } }
  .wtiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 100%; }
  .wtiles span { width: 28px; height: 34px; line-height: 34px; border-radius: 7px; font-size: 20px; color: #d0451b; background: linear-gradient(180deg, #fffdf4, #ffe2a0); box-shadow: 0 3px 0 #d79a3a; }
  .wtiles span.miss { color: #a10f1f; background: linear-gradient(180deg, #ffe0e0, #ff9a9a); box-shadow: 0 3px 0 #c84a4a; }
  .wtiles span.gap { width: 12px; background: none; box-shadow: none; }
  .rows { display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; font-size: 15px; width: 100%; max-width: 300px; text-align: left; color: #4a6690; }
  .rows b { text-align: right; color: #24406a; } .rows .tot { color: #d0451b; font-size: 18px; border-top: 2px dashed #c8d8ee; padding-top: 4px; }
  .next { font-size: 13px; color: #2e9a46; letter-spacing: 1px; }
  .colA, .colB { display: flex; flex-direction: column; align-items: center; gap: 9px; width: 100%; }
  .hearts { font-size: 26px; color: #ff4f6a; letter-spacing: 4px; } .hearts s { text-decoration: none; color: #cbd6e6; }
  .big { font-size: 52px; color: #2e8fe8; line-height: 1; }
  #newBest { font-size: 15px; letter-spacing: 3px; color: #6a2a00; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 14px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 0 18px rgba(255,200,60,.8); }
  .tabs { display: flex; gap: 6px; background: #d8e8fa; padding: 4px; border-radius: 14px; }
  .tabs button { padding: 7px 14px; border-radius: 10px; font-size: 13px; letter-spacing: 1px; color: #4a6690; background: none; }
  .tabs button.on { background: #fff; color: #d0451b; box-shadow: 0 2px 0 #b8cbe4; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
  .item { background: #fff; border-radius: 16px; padding: 6px 6px 8px; box-shadow: 0 3px 0 #b8cbe4, 0 6px 12px rgba(40,80,140,.12); display: flex; flex-direction: column; align-items: center; gap: 3px; border: 3px solid transparent; }
  .item.eq { border-color: #4fbf3a; }
  .item canvas { width: 100%; max-width: 120px; aspect-ratio: 1; display: block; border-radius: 12px; background: linear-gradient(180deg, #bfe6ff, #eaf7ff); }
  .item .nm { font-size: 12px; letter-spacing: 1px; color: #24406a; }
  .item button { font-size: 12px; padding: 5px 10px; border-radius: 10px; color: #fff; background: linear-gradient(180deg, #ffd04a, #f08a1a); box-shadow: 0 2px 0 #b25a0c; min-width: 84px; }
  .item button.own { background: linear-gradient(180deg, #7fd8ff, #2e8fe8); box-shadow: 0 2px 0 #1a56a6; }
  .item button.on { background: linear-gradient(180deg, #a8ec7a, #3faf34); box-shadow: 0 2px 0 #2a7a1e; }
  .item button.poor { filter: grayscale(.7); opacity: .7; }
  #mapCv { width: 100%; height: min(62vh, 520px); border-radius: 18px; display: block; }
  #shop, #map { z-index: 14; }
  #toast { position: fixed; left: 50%; top: 18%; z-index: 30; transform: translate(-50%, -20px); opacity: 0; transition: all .35s; pointer-events: none; padding: 10px 18px; border-radius: 16px;
    background: linear-gradient(180deg, #fff, #e9f4ff); color: #24406a; font-size: 15px; box-shadow: 0 5px 0 rgba(30,70,140,.35), 0 10px 26px rgba(0,0,0,.3); white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (min-aspect-ratio: 5/4) { .grid { grid-template-columns: repeat(6, 1fr); }
    #menu { padding-left: 32vw; background: linear-gradient(90deg, rgba(10,22,58,0) 22%, rgba(12,28,70,.5) 42%, rgba(10,22,58,.82) 70%, rgba(10,22,58,.9)); } }
  @media (max-height: 700px) and (min-height: 521px) { .title { font-size: clamp(44px, 12vw, 84px); } .mbot { gap: 8px; } .btn { padding: 11px 44px; font-size: 22px; } }
  @media (max-height: 520px) {
    .overlay { gap: 6px; padding: 8px 14px; }
    #menu { padding: 10px 16px 10px; }
    .mtop, .mbot { gap: 5px; } .tag { font-size: 10px; letter-spacing: 3px; }
    .title { font-size: 44px; } .title .t1, .title .t2 { display: inline; } .title .t2 b { font-size: 1em; } .title .t2 { margin-left: 12px; }
    .btn { padding: 8px 36px; font-size: 19px; } .sbtn { padding: 6px 14px; font-size: 13px; }
    .card { padding: 12px 16px; gap: 6px; max-height: calc(100vh - 16px); } .card h2 { font-size: 28px; }
    .card.split { flex-direction: row; width: min(94vw, 680px); align-items: center; gap: 18px; }
    .stars { height: 54px; } .stars i { width: 40px; height: 40px; } .stars i:nth-child(2) { width: 52px; height: 52px; }
    .rows { font-size: 13px; gap: 2px 16px; } .big { font-size: 36px; } .hearts { font-size: 20px; }
    .wtiles span { width: 24px; height: 28px; line-height: 28px; font-size: 16px; }
    #mapCv { height: calc(100vh - 110px); } .grid { gap: 6px; } .item canvas { max-width: 86px; }
  }
  @media (max-height: 520px) and (min-aspect-ratio: 5/4) { #menu { padding-left: 30vw; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="coinsTop">● 0</div>
<div class="overlay" id="menu">
  <div class="mtop">
    <div class="tag">✦ A HANGMAN SKY ADVENTURE ✦</div>
    <h1 class="title"><span class="t1"><b>B</b><b>A</b><b>L</b><b>L</b><b>O</b><b>O</b><b>N</b></span><span class="t2"><b>R</b><b>E</b><b>S</b><b>C</b><b>U</b><b>E</b></span></h1>
  </div>
  <div class="mbot">
    <div class="mstats" id="menuStats"></div>
    <button class="btn" id="startBtn">PLAY</button>
    <div class="mrow"><button class="sbtn" id="mapBtn">◉ MAP</button><button class="sbtn alt" id="shopBtn">✦ WARDROBE</button></div>
    <div class="quest" id="menuQuest"></div>
  </div>
</div>
<div class="overlay hidden dim" id="shop"><div class="card wide">
  <div class="chead"><h2 class="blue">WARDROBE</h2><button class="x" id="shopX">✕</button></div>
  <div class="msub" id="shopCoins" style="color:#d08a10;font-size:16px"></div>
  <div class="tabs" id="tabs"><button data-t="b" class="on">BALLOONS</button><button data-t="k">BASKETS</button><button data-t="c">FRIENDS</button></div>
  <div class="grid" id="shopGrid"></div>
</div></div>
<div class="overlay hidden dim" id="map"><div class="card wide">
  <div class="chead"><h2 class="blue" id="mapTitle">WORLD TOUR</h2><button class="x" id="mapX">✕</button></div>
  <canvas id="mapCv"></canvas>
  <div class="msub" id="mapSub"></div>
</div></div>
<div class="overlay hidden dim" id="pause"><div class="card">
  <h2 class="blue">PAUSED</h2><div class="msub" id="pauseInfo"></div>
  <button class="btn" id="resumeBtn">RESUME</button><button class="sbtn" id="quitBtn">MENU</button>
</div></div>
<div class="overlay hidden dim" id="win"><div class="card split">
  <div class="colA"><h2 id="winTitle">RESCUED!</h2><div class="stars" id="winStars"><i></i><i></i><i></i></div><div class="clue" id="winClue"></div><div class="wtiles" id="winWord"></div></div>
  <div class="colB"><div class="rows" id="winRows"></div><div class="quest" id="winQuest" style="color:#b0600a;text-shadow:none"></div><div class="next" id="winNext"></div><button class="btn" id="nextBtn">NEXT</button></div>
</div></div>
<div class="overlay hidden dim" id="fail"><div class="card">
  <h2>SPLASH!</h2><div class="msub">The word was</div><div class="wtiles" id="failWord"></div>
  <div class="hearts" id="failHearts"></div><div class="msub" id="failTip"></div>
  <button class="btn" id="retryBtn">TRY AGAIN</button><button class="sbtn" id="failMenu">MENU</button>
</div></div>
<div class="overlay hidden dim" id="over"><div class="card">
  <h2>OUT OF HEARTS</h2><div class="big" id="overScore">0</div><div id="newBest">NEW BEST!</div>
  <div class="rows" id="overStats"></div>
  <button class="btn" id="contBtn">CONTINUE</button><button class="sbtn" id="restartBtn">RESTART</button>
</div></div>
<div id="toast"></div>
<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {

      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;

  }

    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}

  btn.addEventListener('pointerup', e => e.stopPropagation());

    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();

    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`

        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};

// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};

// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }
        else if (p.shape === 'heart') { ctx.rotate(p.rot * .2); heart(ctx, p.size); }
        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * (.4 + k * .6), 0, TAU); ctx.fill(); }
        ctx.restore(); ctx.shadowBlur = 0;
      }
      for (const t of texts) {
        const age = t.max - t.life, pop = age < .18 ? 1 + Math.sin(age / .18 * Math.PI) * .45 : 1, a = Math.min(1, t.life / t.max * 2.2);
        ctx.save(); ctx.globalAlpha = a; ctx.translate(t.x, t.y); ctx.scale(pop, pop); if (t.wobble) ctx.rotate(Math.sin(age * 20) * t.wobble);
        ctx.font = t.font + t.size + 'px "Avenir Next", "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, t.size * .16); ctx.strokeStyle = t.stroke; ctx.strokeText(t.str, 0, 0); ctx.fillStyle = t.c; ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },
    drawFlash(ctx, W, H) { if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  };
})();

    if (mapTravel && ready) {
      const k = clamp((performance.now() - mapTravel.t0) / 1900, 0, 1), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, [x0, y0] = pos[mapTravel.from], [x1, y1] = pos[mapTravel.to];
      const x = lerp(x0, x1, e), y = lerp(y0, y1, e) - Math.sin(e * Math.PI) * R * 1.5 - R * 2.3 + Math.sin(t * 3) * 3;
      g.strokeStyle = 'rgba(60,50,70,.7)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y + R * .9); g.lineTo(x, y + R * 1.6); g.stroke();
      [[-.5, 0, 1], [.5, 0, 4], [0, -.45, 2]].forEach(([dx, dy, c]) => drawBalloonSprite(g, SAVE.eq.b, c, x + dx * R, y + dy * R, R * 1.1));
      g.fillStyle = '#8a5a2a'; rrect(g, x - R * .35, y + R * 1.55, R * .7, R * .45, R * .1); g.fill();
      if (performance.now() - mapTravel.t0 > 2600) { endTravel(); return; }
    }
    $('mapTitle').textContent = mapTravel ? 'NEXT STOP' : 'WORLD TOUR ' + lap;
    $('mapSub').textContent = mapTravel ? 'Flying to ' + DESTS[mapTravel.to].name + ' · 5 new levels await!' : 'Level ' + L + ' · ' + DESTS[cur].name + ' · every 5th level is special: golden balloons, phrases, storms and sky pirates';
    requestAnimationFrame(drawMap);
  }
  $('mapBtn').onclick = () => { show('map'); mapOpen = true; requestAnimationFrame(drawMap); };
  $('mapX').onclick = () => { if (mapTravel) return endTravel(); hide('map'); mapOpen = false; };

  // ---------- test hook ----------
  window.__br = {
    G: () => G, SAVE, LY: () => LY, gen: genLevel, botPick: () => G && botPick(G), botFor: g => botPick(g), start, toMenu, guess, hint: useHint, tapGolden: () => G && G.goldens[0] && tapGolden(G.goldens[0]),
    autopilot: v => { AUTO = !!v; }, coins: n => { SAVE.coins += n; coinShown = SAVE.coins; saveNow(); updateMenu(); },
    unlockAll: () => { for (const k in SHOP) SAVE.owned[k] = SHOP[k].map((_, i) => i); saveNow(); },
    equip: (k, i) => { if (!SAVE.owned[k].includes(i)) SAVE.owned[k].push(i); SAVE.eq[k] = i; saveNow(); },
    level: (n, a = 0) => { OVERLAYS.forEach(hide); mapOpen = false; $('coinsTop').classList.add('hidden'); audioOn = true; paused = false; FX.clear(); SAVE.cur = null; SAVE.hearts = Math.max(1, SAVE.hearts); startLevel(n, a); },
    skipEnter: () => { if (G && G.state === 'enter') G.st = 99; },
    keyRect: ch => LY.keys.find(k => k.ch === ch), hintRect: id => LY.hints.find(h => h.id === id),
    state: () => G && { level: G.level, kind: G.kind, state: G.state, words: G.words, alive: aliveN(), total: G.total, guessed: [...G.guessed].join(''), wrong: G.wrong.join(''), hearts: SAVE.hearts, coins: SAVE.coins, attract: G.attract, paused, overlay: OVERLAYS.filter(id => !$(id).classList.contains('hidden')) },
    fps: 0
  };

  // ---------- boot ----------
  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1); BS = Math.min(DPR, 1.5); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const cs = getComputedStyle($('safe')); SAFE_T = parseFloat(cs.paddingTop) || 0; SAFE_B = parseFloat(cs.paddingBottom) || 0;
    BG_KEY = ''; SKY_KEY = ''; if (G) layout();
  }
  addEventListener('resize', resize);
  let last = performance.now(), fN = 0, fT = 0;
  resize(); startDemo(); updateMenu();
  loadArt().then(() => { if (!$('shop').classList.contains('hidden')) buildShop(); });
  (function loop(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!paused) update(dt);
    render();
    fN++; fT += dt; if (fT >= 1) { window.__br.fps = Math.round(fN / fT); fN = 0; fT = 0; }
    requestAnimationFrame(loop);
  })(last);
/*GAME-END*/
})();
</script>
