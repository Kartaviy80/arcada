<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a8d870">
<title>Merge Garden</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #a8d870;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #3a2a14;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(440px, 96vw); display: flex; gap: 8px; pointer-events: none; }
  .chip { background: #fffaf0; border-radius: 16px; padding: 4px 12px; font-weight: bold; font-size: 17px; box-shadow: 0 3px 0 #6b8a3a; }
  .chip.grow { flex: 1; text-align: center; }
  .bar { height: 6px; border-radius: 3px; background: #e0e8d0; margin-top: 2px; overflow: hidden; } .bar i { display: block; height: 100%; background: #f2b33d; width: 0; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: #3a5a1c88; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card { width: min(360px, 100%); background: #fffaf0; border-radius: 26px; padding: 24px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; border: 5px solid #7cb342; box-shadow: 0 14px 40px #0005; }
  .card canvas { width: 100%; height: auto; }
  h1 { font-size: clamp(38px, 11vw, 52px); color: #4c8a1c; line-height: 1; }
  p { font-size: 15px; line-height: 1.5; }
  .stat { font-size: 18px; } .stat b { color: #e07a1c; }
  .btn { border: none; background: #f2b33d; color: #3a2a14; font: inherit; font-weight: bold; font-size: 21px; padding: 13px; border-radius: 18px; cursor: pointer; box-shadow: 0 5px 0 #b07a1c; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b07a1c; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="chip">🪙 <span id="coins">0</span></div>
  <div class="chip grow">Garden lv <span id="lvl">1</span><div class="bar"><i id="xp"></i></div></div>
  <div class="chip">⚡ <span id="energy">0</span></div>
</div>

<div class="overlay" id="menu"><div class="card">
  <canvas id="logo" width="640" height="130"></canvas>
  <h1>Merge Garden</h1>
  <p>Tap the <b>seed bag</b> to plant seeds (costs ⚡). <b>Drag</b> a plant onto an identical one to grow it: seed → sprout → bud → tulip → bush → sapling → apple tree → golden tree. Drag plants onto the <b>orders</b> to earn coins, or onto the crate to sell.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">Start gardening</button>
</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
(() => {
  const audio = GameAudio({
    bpm: 100, scale: 'major', root: 67, prog: [0, 3, 1, 4], seed: 408,
    waves: { lead: 'triangle', bass: 'triangle', arp: 'sine', pad: 'sine' },
    pad: true, arp: true, arpEvery: 2, arpOct: 1, leadDensity: 0.3, drums: 'soft', swing: 0.12, bassPattern: [0, 4, 8, 12], volume: 0.17,
    btnBg: 'rgba(58,90,28,.5)'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'merge_garden_best';
  let best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  if (best) document.getElementById('bestMenu').innerHTML = 'Most coins <b>' + best + '</b>';

  // ---------- plant artwork: 8 growth stages ----------
  const SH = '<filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#2a3a10" flood-opacity=".4"/></filter>';
  const leafG = '<linearGradient id="lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9be05a"/><stop offset="1" stop-color="#3c8a1c"/></linearGradient>';
  const soil = '<ellipse cx="50" cy="84" rx="30" ry="9" fill="#7a4a24"/><ellipse cx="50" cy="82" rx="26" ry="6" fill="#9a6034"/>';
  const crown = (cx, cy, r, a, b, c) => '<radialGradient id="cr" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="' + a + '"/><stop offset=".55" stop-color="' + b + '"/><stop offset="1" stop-color="' + c + '"/></radialGradient>' +
    '</defs><g filter="url(#s)"><rect x="' + (cx - 5) + '" y="' + (cy + r * 0.4) + '" width="10" height="' + (86 - cy - r * 0.4) + '" rx="3" fill="#7a4a24"/>' +
    [[-0.55, 0.15, 0.6], [0.55, 0.15, 0.6], [0, -0.35, 0.7], [0, 0.1, 0.75]].map(([dx, dy, s]) => '<circle cx="' + (cx + dx * r) + '" cy="' + (cy + dy * r) + '" r="' + r * s + '" fill="url(#cr)"/>').join('');
  const PLANTS = [
    { name: 'Seed', svg: svgDoc('<defs>' + SH + '<radialGradient id="g" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#e8c08a"/><stop offset=".6" stop-color="#a0683c"/><stop offset="1" stop-color="#5a3414"/></radialGradient></defs>' +
      '<g filter="url(#s)"><ellipse cx="50" cy="56" rx="18" ry="26" fill="url(#g)" transform="rotate(20 50 56)"/><path d="M42 40 C 48 52, 50 66, 56 76" stroke="#5a3414" stroke-width="2" fill="none" opacity=".5"/></g>' +
      '<ellipse cx="44" cy="44" rx="5" ry="9" fill="#fff" opacity=".45" transform="rotate(20 44 44)"/>') },
    { name: 'Sprout', svg: svgDoc('<defs>' + SH + leafG + '</defs><g filter="url(#s)">' + soil +
      '<path d="M50 82 C 50 70, 50 60, 50 50" stroke="#4c9a2c" stroke-width="4" fill="none"/>' +
      '<path d="M50 54 C 36 54, 24 44, 22 32 C 36 30, 48 40, 50 54 Z" fill="url(#lf)"/><path d="M50 50 C 62 48, 74 38, 78 26 C 62 24, 52 36, 50 50 Z" fill="url(#lf)"/></g>') },
    { name: 'Bud', svg: svgDoc('<defs>' + SH + leafG + '<radialGradient id="b" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffd0e0"/><stop offset=".6" stop-color="#ff7aa8"/><stop offset="1" stop-color="#c03a6a"/></radialGradient></defs><g filter="url(#s)">' + soil +
      '<path d="M50 82 C 50 66, 48 50, 50 36" stroke="#4c9a2c" stroke-width="4" fill="none"/>' +
      '<path d="M50 70 C 36 70, 28 60, 26 52 C 38 50, 48 58, 50 70 Z" fill="url(#lf)"/>' +
      '<path d="M50 16 C 62 24, 64 38, 50 44 C 36 38, 38 24, 50 16 Z" fill="url(#b)"/><path d="M42 38 C 44 44, 56 44, 58 38 C 56 46, 44 46, 42 38 Z" fill="#4c9a2c"/></g>') },
    { name: 'Tulip', svg: svgDoc('<defs>' + SH + leafG + '<linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a6a"/><stop offset="1" stop-color="#c01a2a"/></linearGradient></defs><g filter="url(#s)">' + soil +
      '<path d="M50 82 C 50 66, 50 52, 50 40" stroke="#4c9a2c" stroke-width="4" fill="none"/>' +
      '<path d="M50 76 C 30 70, 22 52, 26 40 C 40 46, 48 60, 50 76 Z M50 72 C 66 66, 76 52, 74 42 C 62 46, 52 58, 50 72 Z" fill="url(#lf)"/>' +
      '<path d="M32 18 L 40 26 L 50 12 L 60 26 L 68 18 C 72 32, 66 44, 50 44 C 34 44, 28 32, 32 18 Z" fill="url(#p)"/><path d="M50 12 L 44 30 C 46 38, 54 38, 56 30 Z" fill="#ff9a8a" opacity=".6"/></g>') },
    { name: 'Bush', svg: svgDoc('<defs>' + SH + crown(50, 52, 30, '#b8f07a', '#5cb030', '#2c6a12') + '</g>' +
      [[30, 46], [62, 36], [70, 60], [44, 66], [52, 46]].map(([x, y]) => '<circle cx="' + x + '" cy="' + y + '" r="4.5" fill="#ff7aa8"/><circle cx="' + x + '" cy="' + y + '" r="1.8" fill="#ffe680"/>').join('')) },
    { name: 'Sapling', svg: svgDoc('<defs>' + SH + crown(50, 40, 26, '#c8f08a', '#6ac03a', '#2c6a12') + '</g>' + '<ellipse cx="50" cy="88" rx="22" ry="5" fill="#7a4a24" opacity=".5"/>') },
    { name: 'Apple tree', svg: svgDoc('<defs>' + SH + crown(50, 38, 32, '#b8f07a', '#4caa2a', '#1c5a0a') + '</g>' +
      [[30, 34], [64, 26], [72, 48], [44, 52], [52, 30], [36, 50]].map(([x, y]) => '<circle cx="' + x + '" cy="' + y + '" r="5.5" fill="#e0302a"/><circle cx="' + (x - 1.5) + '" cy="' + (y - 2) + '" r="1.6" fill="#fff" opacity=".7"/>').join('')) },
    { name: 'Golden tree', svg: svgDoc('<defs>' + SH + '<radialGradient id="aura"><stop offset="0" stop-color="#fff2a0" stop-opacity=".9"/><stop offset="1" stop-color="#fff2a0" stop-opacity="0"/></radialGradient>' +
      crown(50, 38, 32, '#fffbd0', '#ffd23f', '#b07a00').replace('</defs>', '</defs><circle cx="50" cy="44" r="50" fill="url(#aura)"/>') + '</g>' +
      [[30, 34], [64, 26], [72, 48], [44, 52], [52, 30]].map(([x, y]) => '<path d="M' + x + ' ' + (y - 5) + ' l1.5 3.5 l3.5 1.5 l-3.5 1.5 l-1.5 3.5 l-1.5 -3.5 l-3.5 -1.5 l3.5 -1.5 Z" fill="#fff"/>').join('')) }
  ];
  const bagSVG = svgDoc('<defs>' + SH + '<linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c890"/><stop offset="1" stop-color="#b08048"/></linearGradient></defs><g filter="url(#s)">' +
    '<path d="M28 34 C 20 50, 16 74, 24 86 C 40 94, 60 94, 76 86 C 84 74, 80 50, 72 34 Z" fill="url(#b)"/>' +
    '<path d="M30 34 C 36 26, 40 18, 34 12 L 66 12 C 60 18, 64 26, 70 34 Z" fill="#c8a068"/><path d="M30 34 L 70 34" stroke="#7a4a24" stroke-width="4"/>' +
    '<ellipse cx="50" cy="64" rx="14" ry="12" fill="#7cb342"/><path d="M50 56 C 44 62, 44 68, 50 72 C 56 68, 56 62, 50 56 Z" fill="#c8f08a"/></g>' +
    '<circle cx="36" cy="24" r="4" fill="#a0683c"/><circle cx="58" cy="20" r="3.5" fill="#a0683c"/>');
  const crateSVG = svgDoc('<defs>' + SH + '</defs><g filter="url(#s)"><rect x="14" y="30" width="72" height="56" rx="4" fill="#c98a4a"/><path d="M14 44 H86 M14 72 H86" stroke="#8a5428" stroke-width="3"/>' +
    '<rect x="14" y="30" width="72" height="56" rx="4" fill="none" stroke="#8a5428" stroke-width="3"/><circle cx="50" cy="58" r="13" fill="#ffd23f" stroke="#b07a00" stroke-width="3"/><text x="50" y="64" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a5a00" font-family="Arial">$</text></g>');
  const tileSVG = svgDoc('<rect x="2" y="2" width="96" height="96" rx="14" fill="#8fc25a"/><rect x="2" y="2" width="96" height="96" rx="14" fill="none" stroke="#6b9a3a" stroke-width="2"/>' +
    '<path d="M18 80 l3 -8 l3 8 M64 26 l3 -8 l3 8 M76 70 l2 -6 l2 6" stroke="#5c8a2c" stroke-width="2" fill="none"/>');

  let SPR = null;
  const defs = { bag: bagSVG, crate: crateSVG, tile: tileSVG }; PLANTS.forEach((p, i) => defs['p' + i] = p.svg);
  loadSprites(defs, 160).then(s => { SPR = s; const lc = $('logo').getContext('2d'); PLANTS.forEach((p, i) => lc.drawImage(SPR['p' + i], i * 78 + 4, 10, 110, 110)); });

  const C = 6, R = 7, BAG = [R - 1, 0];
  let W, H, DPR, cell, bx, by, orderY, orderH;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    orderH = Math.min(110, H * 0.14);
    cell = Math.min(W * 0.96 / C, (H - orderH - 110) / R, 84);
    bx = (W - cell * C) / 2; orderY = Math.max(54, 40 + (H - orderH - cell * R - 110) / 2); by = orderY + orderH + 14;
  }
  addEventListener('resize', resize); resize();

  let state = 'menu', grid, coins, energy, lvl, xp, orders, t = 0, drag = null, parts = [], regen = 0, floats = [];
  const xpNeed = () => 60 + lvl * 50;
  function newOrder() {
    const maxT = Math.min(7, 2 + Math.floor(lvl / 2) + 1);
    const tier = 2 + Math.floor(Math.random() * (maxT - 1));
    return { tier: Math.min(7, tier), reward: Math.round(Math.pow(2, tier) * 3), bob: Math.random() * 6 };
  }
  function start() {
    if (!SPR) return;
    grid = [...Array(R)].map(() => Array(C).fill(null));
    grid[BAG[0]][BAG[1]] = { bag: true };
    for (let i = 0; i < 4; i++) spawn();
    coins = 0; energy = 30; lvl = 1; xp = 0; orders = [newOrder(), newOrder(), newOrder()]; parts = []; floats = [];
    state = 'play'; audio.start();
    $('menu').classList.add('hidden');
  }
  $('startBtn').onclick = start;
  function freeCells() { const f = []; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (!grid[r][c]) f.push([r, c]); return f; }
  function spawn() {
    const f = freeCells(); if (!f.length) return false;
    // seeds land near the bag
    f.sort((a, b) => (Math.abs(a[0] - BAG[0]) + Math.abs(a[1] - BAG[1])) - (Math.abs(b[0] - BAG[0]) + Math.abs(b[1] - BAG[1])));
    const [r, c] = f[Math.floor(Math.random() * Math.min(3, f.length))];
    grid[r][c] = { tier: 0, pop: 1, fromBag: 1 };
    return true;
  }
  function burst(x, y, col, n = 10) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 240, vy: -Math.random() * 240, life: 0.7, col }); }
  function cellAt(x, y) { const c = Math.floor((x - bx) / cell), r = Math.floor((y - by) / cell); return r >= 0 && r < R && c >= 0 && c < C ? [r, c] : null; }
  function orderAt(x, y) {
    if (y < orderY || y > orderY + orderH) return -1;
    const ow = (W - 24) / 4; for (let i = 0; i < 3; i++) { const ox = 12 + i * (ow + 4); if (x >= ox && x <= ox + ow) return i; }
    return x >= 12 + 3 * (ow + 4) ? 3 : -1;   // 3 = sell crate
  }
  function addXp(n) { xp += n; while (xp >= xpNeed()) { xp -= xpNeed(); lvl++; energy = Math.min(60, energy + 15); floats.push({ txt: 'Garden level ' + lvl + '!', x: W / 2, y: by + R * cell / 2, life: 1.6 }); [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => audio.sfx(f, 0.25, 'triangle', 0.07), i * 100)); } }

  canvas.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    const cl = cellAt(e.clientX, e.clientY); if (!cl) return;
    const it = grid[cl[0]][cl[1]]; if (!it) return;
    if (it.bag) {
      if (energy <= 0) { floats.push({ txt: 'No energy', x: e.clientX, y: e.clientY - 20, life: 0.8 }); audio.sfx(160, 0.1, 'square', 0.04); return; }
      if (spawn()) { energy--; it.pop = 1; audio.sfx(660, 0.08, 'sine', 0.05, 990); } else { floats.push({ txt: 'No space!', x: e.clientX, y: e.clientY - 20, life: 0.8 }); checkStuck(); }
      return;
    }
    drag = { from: cl, item: it, x: e.clientX, y: e.clientY };
    grid[cl[0]][cl[1]] = null;
  });
  addEventListener('pointermove', e => { if (drag) { drag.x = e.clientX; drag.y = e.clientY; } });
  addEventListener('pointerup', e => {
    if (!drag) return;
    const it = drag.item, [fr, fc] = drag.from;
    const oi = orderAt(e.clientX, e.clientY);
    const cl = cellAt(e.clientX, e.clientY);
    if (oi >= 0 && oi < 3 && orders[oi].tier === it.tier) {
      coins += orders[oi].reward; addXp(orders[oi].reward);
      floats.push({ txt: '+' + orders[oi].reward + ' 🪙', x: e.clientX, y: e.clientY - 20, life: 1.2 });
      burst(e.clientX, e.clientY, '#ffd23f', 16); orders[oi] = newOrder();
      audio.sfx(988, 0.15, 'triangle', 0.08, 1318);
    } else if (oi === 3) {
      const v = it.tier + 1; coins += v; addXp(v);
      floats.push({ txt: '+' + v + ' 🪙', x: e.clientX, y: e.clientY - 20, life: 1 }); audio.sfx(700, 0.1, 'square', 0.05);
    } else if (cl && !(cl[0] === fr && cl[1] === fc)) {
      const tgt = grid[cl[0]][cl[1]];
      if (!tgt) grid[cl[0]][cl[1]] = it;
      else if (!tgt.bag && tgt.tier === it.tier && it.tier < PLANTS.length - 1) {
        tgt.tier++; tgt.pop = 1; addXp(tgt.tier * 2);
        burst(bx + (cl[1] + 0.5) * cell, by + (cl[0] + 0.5) * cell, tgt.tier >= 4 ? '#7cb342' : '#ff7aa8');
        audio.sfx(392 * Math.pow(2, tgt.tier / 5), 0.25, 'triangle', 0.08, 784 * Math.pow(2, tgt.tier / 5));
      } else if (!tgt.bag) { grid[cl[0]][cl[1]] = it; grid[fr][fc] = tgt; }      // swap places
      else grid[fr][fc] = it;
    } else grid[fr][fc] = it;
    drag = null;
    saveBest();
    checkStuck();
  });

  // merge gardens are endless: a full plot is only a nudge to merge or sell
  function checkStuck() {
    if (freeCells().length) return;
    floats.push({ txt: 'Plot full — merge or sell!', x: W / 2, y: by + R * cell / 2, life: 1.4 });
  }
  function saveBest() { if (coins > best) { best = coins; try { localStorage.setItem(KEY, best); } catch (e) {} } }

  function update(dt) {
    t += dt;
    if (state === 'play') { regen += dt; if (regen > 3) { regen = 0; if (energy < 30) energy++; } }
    if (grid) for (const row of grid) for (const it of row) if (it && it.pop) it.pop = Math.max(0, it.pop - dt * 3);
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const f of floats) { f.y -= 40 * dt; f.life -= dt; }
    floats = floats.filter(f => f.life > 0);
  }

  function render() {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#c8eaff'); g.addColorStop(0.3, '#b8e08a'); g.addColorStop(1, '#7cb342');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // picket fence
    ctx.fillStyle = '#fffaf0';
    for (let x = 0; x < W; x += 22) { ctx.fillRect(x, H * 0.22, 14, 60); ctx.beginPath(); ctx.moveTo(x, H * 0.22); ctx.lineTo(x + 7, H * 0.22 - 10); ctx.lineTo(x + 14, H * 0.22); ctx.fill(); }
    ctx.fillRect(0, H * 0.22 + 14, W, 6); ctx.fillRect(0, H * 0.22 + 40, W, 6);
    if (!SPR || !grid) return;
    // orders board
    const ow = (W - 24) / 4;
    for (let i = 0; i < 4; i++) {
      const ox = 12 + i * (ow + 4), hov = drag && orderAt(drag.x, drag.y) === i;
      ctx.fillStyle = i === 3 ? '#e8d0a8' : '#fffaf0'; ctx.strokeStyle = hov ? '#f2b33d' : '#6b8a3a'; ctx.lineWidth = hov ? 4 : 2;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(ox, orderY, ow, orderH, 14) : ctx.rect(ox, orderY, ow, orderH); ctx.fill(); ctx.stroke();
      const isz = Math.min(ow, orderH) * 0.62;
      if (i < 3) {
        const o = orders[i];
        ctx.drawImage(SPR['p' + o.tier], ox + ow / 2 - isz / 2, orderY + 4 + Math.sin(t * 2 + o.bob) * 2, isz, isz);
        ctx.fillStyle = '#3a2a14'; ctx.font = 'bold ' + Math.round(orderH * 0.17) + 'px Trebuchet MS, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('🪙 ' + o.reward, ox + ow / 2, orderY + orderH - 8);
      } else {
        ctx.drawImage(SPR.crate, ox + ow / 2 - isz / 2, orderY + 4, isz, isz);
        ctx.fillStyle = '#3a2a14'; ctx.font = 'bold ' + Math.round(orderH * 0.15) + 'px Trebuchet MS, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('SELL', ox + ow / 2, orderY + orderH - 8);
      }
    }
    // garden plot
    ctx.fillStyle = '#6b4a24'; ctx.fillRect(bx - 8, by - 8, C * cell + 16, R * cell + 16);
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      ctx.drawImage(SPR.tile, bx + c * cell + 2, by + r * cell + 2, cell - 4, cell - 4);
      const it = grid[r][c]; if (!it) continue;
      const s = 1 + Math.sin((it.pop || 0) * Math.PI) * 0.25, sz = cell * 0.92 * s;
      const x = bx + (c + 0.5) * cell, y = by + (r + 0.5) * cell;
      if (it.bag) { ctx.drawImage(SPR.bag, x - sz / 2, y - sz / 2, sz, sz); ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.round(cell * 0.2) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('⚡1', x, y + cell * 0.44); continue; }
      const sameAsDrag = drag && drag.item.tier === it.tier && it.tier < PLANTS.length - 1;
      if (sameAsDrag) { ctx.fillStyle = 'rgba(255,240,120,' + (0.35 + Math.sin(t * 8) * 0.2) + ')'; ctx.fillRect(bx + c * cell + 2, by + r * cell + 2, cell - 4, cell - 4); }
      ctx.save(); ctx.translate(x, y + cell * 0.44); ctx.rotate(Math.sin(t * 1.5 + r + c) * 0.04); ctx.drawImage(SPR['p' + it.tier], -sz / 2, -sz * 0.94, sz, sz); ctx.restore();
    }
    if (drag) { const sz = cell * 1.1; ctx.globalAlpha = 0.95; ctx.drawImage(SPR['p' + drag.item.tier], drag.x - sz / 2, drag.y - sz * 0.7, sz, sz); ctx.globalAlpha = 1; }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life * 1.4); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 2); ctx.font = 'bold 20px Trebuchet MS, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(f.txt, f.x, f.y); ctx.fillStyle = '#3a2a14'; ctx.fillText(f.txt, f.x, f.y); }
    ctx.globalAlpha = 1;
    $('coins').textContent = coins; $('energy').textContent = energy; $('lvl').textContent = lvl; $('xp').style.width = (xp / xpNeed() * 100) + '%';
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
