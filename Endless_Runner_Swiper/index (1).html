<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d2b53">
<title>Highway Swipe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1d2b53;
    font-family: "Courier New", Courier, monospace; font-weight: bold; color: #fff1e8; text-transform: uppercase;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between;
    pointer-events: none; font-size: 18px; text-shadow: 2px 2px 0 #000; }
  .hud span { color: #ffec27; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: 24px; text-align: center; background: #1d2b53e6; transition: opacity .2s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  h1 { font-size: clamp(34px, 11vw, 64px); line-height: 1; color: #ff004d; text-shadow: 4px 4px 0 #000, -2px -2px 0 #ffa300; letter-spacing: 2px; }
  h1 span { color: #29adff; text-shadow: 4px 4px 0 #000, -2px -2px 0 #fff1e8; }
  p { max-width: 330px; font-size: 13px; line-height: 1.7; color: #c2c3c7; }
  .blink { animation: b 1s steps(2) infinite; } @keyframes b { 50% { opacity: 0; } }
  .row { font-size: 18px; } .row span { color: #ffec27; }
  .btn { border: 4px solid #000; background: #ffec27; color: #000; font: inherit; font-size: 20px; padding: 12px 34px; cursor: pointer;
    box-shadow: 6px 6px 0 #000; text-transform: uppercase; }
  .btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 #000; }
  small { font-size: 11px; color: #83769c; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div>SCORE <span id="score">0</span></div><div>NITRO <span id="nitro">■■■</span></div></div>

<div class="overlay" id="menu">
  <h1>HIGHWAY<br><span>SWIPE</span></h1>
  <p>Swipe ← → to change lanes.<br>Swipe ↑ for NITRO (double points).<br>Pass cars close for bonus!</p>
  <div class="row">HI-SCORE <span id="bestMenu">0</span></div>
  <button class="btn" id="startBtn">START</button>
  <div class="blink" style="font-size:12px">INSERT COIN</div>
  <small>KEYS: ← → ↑</small>
</div>
<div class="overlay hidden" id="over">
  <h1>CRASH!</h1>
  <div class="row">SCORE <span id="finalScore">0</span></div>
  <div class="row">HI-SCORE <span id="bestOver">0</span></div>
  <button class="btn" id="againBtn">CONTINUE?</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const audio = GameAudio({
    bpm: 140, scale: 'major', root: 60, prog: [0, 4, 5, 3], seed: 58,
    waves: { lead: 'square', bass: 'triangle', arp: 'square' },
    arp: true, arpEvery: 1, arpOct: 0, arpCutoff: 4000, leadCutoff: 5000, leadOct: 1, drums: 'busy', bassPattern: [0, 4, 8, 12], volume: 0.11,
    btnBg: '#000a', btnColor: '#ffec27'
  });
  // PICO-8 inspired palette
  const P = { black: '#000000', navy: '#1d2b53', purple: '#7e2553', green: '#008751', brown: '#ab5236', dgray: '#5f574f', lgray: '#c2c3c7',
    white: '#fff1e8', red: '#ff004d', orange: '#ffa300', yellow: '#ffec27', lime: '#00e436', blue: '#29adff', lav: '#83769c', pink: '#ff77a8', peach: '#ffccaa' };
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const buf = document.createElement('canvas'), b = buf.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'highway_swipe_best';
  let best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  $('bestMenu').textContent = best;

  let W, H, BW, BH, ROADX;
  const LANE = 26, LANES = 4;
  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W; canvas.height = H;
    BW = 180; BH = Math.round(180 * H / W);
    if (BH < 260) { BH = 260; BW = Math.round(260 * W / H); }
    buf.width = BW; buf.height = BH;
    ROADX = Math.round(BW / 2 - LANE * LANES / 2);
  }
  addEventListener('resize', resize); resize();
  const laneCX = l => ROADX + l * LANE + LANE / 2;
  const hash = n => { const x = Math.sin(n * 91.3) * 43758.5; return x - Math.floor(x); };

  let state = 'menu', dist, speed, car, traffic, nextSpawn, score, nitro, boost, t = 0, shake = 0, deadT = 0, pops = [], debris = [];
  function reset() {
    dist = 0; speed = 90; traffic = []; nextSpawn = 40; score = 0; nitro = 3; boost = 0; pops = []; debris = [];
    car = { lane: 1, x: laneCX(1), y: 0, dead: false };
  }
  reset();
  const CAR_Y = () => BH - 46;

  const COLORS = [P.blue, P.lime, P.orange, P.pink, P.white, P.lav, P.yellow];
  function spawn() {
    const diff = Math.min(1, dist / 20000);
    const n = 1 + (Math.random() < 0.35 + diff * 0.35 ? 1 : 0) + (Math.random() < diff * 0.3 ? 1 : 0);
    const lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, Math.min(3, n));
    for (const l of lanes) {
      const truck = Math.random() < 0.25;
      traffic.push({ lane: l, y: -40 - Math.random() * 30, h: truck ? 34 : 20, truck, col: COLORS[Math.floor(Math.random() * COLORS.length)], v: 0.35 + Math.random() * 0.25, passed: false });
    }
  }

  function start() {
    reset(); state = 'play'; audio.start();
    $('menu').classList.add('hidden'); $('over').classList.add('hidden');
    audio.sfx(440, 0.1, 'square', 0.06); setTimeout(() => audio.sfx(880, 0.15, 'square', 0.06), 120);
  }
  function crash() {
    if (car.dead) return;
    car.dead = true; deadT = 1.2; shake = 6;
    audio.sfx(120, 0.6, 'sawtooth', 0.12, 30);
    if (navigator.vibrate) try { navigator.vibrate(200); } catch (e) {}
    for (let i = 0; i < 30; i++) debris.push({ x: car.x, y: CAR_Y() + 10, vx: (Math.random() - .5) * 90, vy: (Math.random() - .5) * 90, life: 1, c: [P.red, P.orange, P.yellow, P.dgray][i % 4] });
  }
  function gameOver() {
    state = 'over';
    const s = Math.floor(score); if (s > best) { best = s; try { localStorage.setItem(KEY, best); } catch (e) {} }
    $('finalScore').textContent = s; $('bestOver').textContent = best; $('bestMenu').textContent = best;
    $('over').classList.remove('hidden');
  }
  function steer(d) {
    if (state !== 'play' || car.dead) return;
    const n = Math.max(0, Math.min(LANES - 1, car.lane + d));
    if (n !== car.lane) { car.lane = n; audio.sfx(300, 0.05, 'square', 0.04, 350); }
  }
  function useNitro() {
    if (state !== 'play' || car.dead || boost > 0 || nitro < 1) return;
    nitro--; boost = 2.5; audio.sfx(200, 0.5, 'sawtooth', 0.06, 900);
  }

  let sx = 0, sy = 0, down = false, used = false;
  canvas.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; down = true; used = false; });
  canvas.addEventListener('pointermove', e => {
    if (!down || used) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.hypot(dx, dy) > 24) { used = true; if (Math.abs(dx) > Math.abs(dy)) steer(dx > 0 ? 1 : -1); else if (dy < 0) useNitro(); }
  });
  canvas.addEventListener('pointerup', e => { if (down && !used) steer(e.clientX > W / 2 ? 1 : -1); down = false; });
  addEventListener('keydown', e => {
    if (state !== 'play' && (e.key === 'Enter' || e.key === ' ')) { start(); e.preventDefault(); return; }
    if (e.key === 'ArrowLeft' || e.key === 'a') steer(-1);
    else if (e.key === 'ArrowRight' || e.key === 'd') steer(1);
    else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') { useNitro(); e.preventDefault(); }
  });
  $('startBtn').onclick = start; $('againBtn').onclick = start;

  function update(dt) {
    t += dt;
    if (state === 'menu') { dist += 60 * dt; car.x = laneCX(1); }
    if (state === 'play') {
      if (!car.dead) {
        speed = Math.min(230, 90 + dist / 90) * (boost > 0 ? 1.5 : 1);
        boost = Math.max(0, boost - dt);
        dist += speed * dt;
        score += speed * dt / 10 * (boost > 0 ? 2 : 1);
        if (Math.floor(dist / 2500) > Math.floor((dist - speed * dt) / 2500) && nitro < 3) { nitro++; pops.push({ x: BW / 2, y: BH / 2, txt: '+NITRO', c: P.blue, life: 1 }); }
        car.x += (laneCX(car.lane) - car.x) * Math.min(1, dt * 14);
        nextSpawn -= speed * dt;
        if (nextSpawn <= 0) { spawn(); nextSpawn = Math.max(46, 95 - dist / 400) + Math.random() * 40; }
        const cy = CAR_Y();
        for (const o of traffic) {
          o.y += speed * (1 - o.v) * dt;
          const ox = laneCX(o.lane);
          if (Math.abs(ox - car.x) < 13 && o.y + o.h > cy + 2 && o.y < cy + 20 - 2) crash();
          if (!o.passed && o.y > cy + 22) {
            o.passed = true;
            if (Math.abs(ox - car.x) < LANE + 4 && !car.dead) { const bonus = 10 * (boost > 0 ? 2 : 1); score += bonus; pops.push({ x: ox, y: cy, txt: 'CLOSE +' + bonus, c: P.yellow, life: 0.8 }); audio.sfx(990, 0.06, 'square', 0.04); }
          }
        }
        traffic = traffic.filter(o => o.y < BH + 40);
      } else { deadT -= dt; if (deadT <= 0 && state === 'play') gameOver(); }
    }
    for (const p of pops) { p.y -= 20 * dt; p.life -= dt; }
    pops = pops.filter(p => p.life > 0);
    for (const d of debris) { d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= 0.96; d.vy *= 0.96; d.life -= dt * 0.8; }
    debris = debris.filter(d => d.life > 0);
    shake = Math.max(0, shake - dt * 20);
  }

  function rect(c, x, y, w, h) { b.fillStyle = c; b.fillRect(Math.round(x), Math.round(y), w, h); }
  function drawCar(x, y, col, truck, player) {
    x = Math.round(x - 7); y = Math.round(y);
    const h = truck ? 34 : 20;
    rect('#0006', x + 1, y + 2, 14, h);
    if (truck) {
      rect(col, x, y + 10, 14, 24); rect(P.dgray, x, y + 9, 14, 1);
      rect(P.lgray, x + 1, y, 12, 9); rect(P.navy, x + 2, y + 1, 10, 3);
    } else {
      rect(col, x, y, 14, 20);
      rect(P.navy, x + 2, y + (player ? 4 : 12), 10, 4);
      rect(P.navy, x + 2, y + (player ? 13 : 4), 10, 2);
      rect(P.black, x - 1, y + 3, 1, 4); rect(P.black, x + 14, y + 3, 1, 4); rect(P.black, x - 1, y + 14, 1, 4); rect(P.black, x + 14, y + 14, 1, 4);
      if (player) { rect(P.white, x + 6, y, 2, 20); rect(P.yellow, x + 1, y, 2, 1); rect(P.yellow, x + 11, y, 2, 1); }
      else { rect(P.red, x + 1, y + 19, 2, 1); rect(P.red, x + 11, y + 19, 2, 1); }
    }
  }

  function render() {
    // roadside
    rect('#e4a672', 0, 0, BW, BH);
    const off = dist % 64;
    for (let i = -1; i < BH / 16 + 2; i++) {
      const wy = Math.floor((dist / 16)) - i;
      for (const side of [0, 1]) {
        const h = hash(wy * 2 + side);
        const y = i * 16 + (dist % 16);
        const x = side ? ROADX + LANE * LANES + 10 + h * (BW - ROADX - LANE * LANES - 24) : 6 + h * (ROADX - 24);
        if (h < 0.25) { rect(P.green, x, y, 3, 10); rect(P.green, x - 3, y + 3, 3, 2); rect(P.green, x - 3, y + 1, 1, 2); rect(P.green, x + 3, y + 5, 3, 2); rect(P.green, x + 5, y + 2, 1, 3); }
        else if (h < 0.35) { rect(P.brown, x, y + 4, 6, 4); rect('#c97a52', x + 1, y + 4, 4, 1); }
        else if (h < 0.6) { rect('#d38a5a', x, y, 2, 1); }
      }
    }
    // road
    rect(P.dgray, ROADX - 4, 0, LANE * LANES + 8, BH);
    rect('#4a4440', ROADX, 0, LANE * LANES, BH);
    rect(P.white, ROADX - 3, 0, 1, BH); rect(P.white, ROADX + LANE * LANES + 2, 0, 1, BH);
    for (let l = 1; l < LANES; l++) {
      for (let y = (dist % 20) - 20; y < BH; y += 20) rect(l === 2 ? P.yellow : P.lgray, ROADX + l * LANE - 1, y, 2, 10);
    }
    for (const o of traffic) drawCar(laneCX(o.lane), o.y, o.col, o.truck, false);
    if (!car.dead || Math.floor(t * 10) % 2) {
      const cy = CAR_Y();
      if (boost > 0 && !car.dead) { rect(Math.random() < 0.5 ? P.orange : P.yellow, car.x - 5, cy + 20, 3, 4 + Math.random() * 6); rect(Math.random() < 0.5 ? P.orange : P.yellow, car.x + 2, cy + 20, 3, 4 + Math.random() * 6); }
      drawCar(car.x, cy, P.red, false, true);
    }
    for (const d of debris) if (d.life > 0) rect(d.c, d.x, d.y, 2, 2);
    b.font = '8px monospace'; b.textAlign = 'center';
    for (const p of pops) { b.fillStyle = '#000'; b.fillText(p.txt, Math.round(p.x) + 1, Math.round(p.y) + 1); b.fillStyle = p.c; b.fillText(p.txt, Math.round(p.x), Math.round(p.y)); }
    if (boost > 0) { for (let i = 0; i < 6; i++) rect('#fff1e855', Math.random() * BW, Math.random() * BH, 1, 10); }

    ctx.imageSmoothingEnabled = false;
    const sx = shake ? Math.round((Math.random() - .5) * shake) * 3 : 0;
    ctx.fillStyle = P.navy; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(buf, sx, 0, W, H);
    $('score').textContent = Math.floor(score);
    $('nitro').textContent = '■'.repeat(nitro) + '□'.repeat(3 - nitro);
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
