<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a0e14">
<title>Dragon Nest</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2a0e14;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; color: #ffe8d8;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
  .top .coins { font-size: 32px; font-weight: 900; color: #ffd24a; -webkit-text-stroke: 1.5px #5a1a08; text-shadow: 0 3px 0 #5a1a08, 0 0 20px rgba(255,140,40,.7); }
  .top .ps { font-size: 13px; font-weight: 800; color: #ffe8c8; background: rgba(60,14,10,.72); display: inline-block; padding: 2px 12px; border-radius: 12px; margin-top: 2px; }
  .top .boost { font-size: 13px; font-weight: 900; color: #fff; background: linear-gradient(#ff7a3a, #c8200a); display: inline-block; padding: 2px 10px; border-radius: 12px; margin-left: 6px; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; height: 45%; background: linear-gradient(#4a1c1c, #24090c); border-top: 5px solid #e8902a; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(255,90,30,.3); display: flex; flex-direction: column; z-index: 3; }
  @media (min-aspect-ratio: 1/1) { .panel { left: auto; top: 0; width: min(420px, 40%); height: 100%; border-radius: 22px 0 0 22px; border-top: 0; border-left: 5px solid #e8902a; } }
  .tabs { display: flex; gap: 6px; padding: 10px 10px 6px; }
  .tabs button { flex: 1; border: 0; border-radius: 12px; padding: 9px 4px; font: inherit; font-size: 14px; font-weight: 900; color: #f0b890; background: #5e2622; cursor: pointer; }
  .tabs button.on { background: linear-gradient(#ffb04a, #e8501a); color: #fff; box-shadow: 0 3px 0 #8a2a08, 0 0 14px rgba(255,120,40,.45); }
  .tabs .mode { flex: 0 0 64px; background: #160406; color: #ffd24a; }
  .list { flex: 1; overflow-y: auto; padding: 4px 10px 80px; -webkit-overflow-scrolling: touch; }
  .card { display: flex; align-items: center; gap: 10px; background: linear-gradient(#5e2a26, #46201c); border: 2px solid #7e3e30; border-radius: 16px; padding: 8px; margin-bottom: 8px; box-shadow: 0 3px 0 #1a0606; }
  .card.egg { background: linear-gradient(#6a4a1a, #4a3010); border-color: #ffd24a; }
  .card canvas { width: 58px; height: 58px; flex: 0 0 58px; border-radius: 12px; background: radial-gradient(circle at 45% 40%, #8a4a3a, #2a0e0c); }
  .card .info { flex: 1; min-width: 0; }
  .card .nm { font-weight: 900; font-size: 15px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .card .nm small { font-weight: 800; color: #ffb88a; font-size: 12px; }
  .card .ds { font-size: 12px; color: #e8c0a8; line-height: 1.3; }
  .card .rar { font-size: 10px; font-weight: 900; letter-spacing: 1px; padding: 1px 6px; border-radius: 6px; margin-right: 4px; color: #fff; }
  .card .bar { height: 5px; background: #2a0e0c; border-radius: 3px; margin-top: 4px; overflow: hidden; } .card .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd24a, #ff6a2a); }
  .card button { flex: 0 0 auto; min-width: 86px; border: 0; border-radius: 12px; padding: 8px 6px; font: inherit; font-weight: 900; font-size: 13px; color: #4a1a04; background: linear-gradient(#ffe27a, #f0a01a); box-shadow: 0 3px 0 #8a4a04; cursor: pointer; line-height: 1.15; }
  .card button:disabled { background: #6e4038; box-shadow: 0 3px 0 #2a0e0c; color: #b08a7a; }
  .card button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #8a4a04; }
  .prest { text-align: center; padding: 10px 8px; }
  .prest h3 { font-size: 22px; color: #ffb04a; } .prest p { font-size: 14px; line-height: 1.5; margin: 8px 0; color: #f0d0c0; }
  .prest .big { font-size: 40px; font-weight: 900; color: #ff9a4a; text-shadow: 0 0 16px rgba(255,120,40,.6); }
  .prest button { border: 0; border-radius: 16px; padding: 12px 26px; font: inherit; font-size: 16px; font-weight: 900; color: #4a1a04; background: linear-gradient(#ffe27a, #f0a01a); box-shadow: 0 4px 0 #8a4a04; cursor: pointer; }
  .prest button:disabled { background: #6e4038; box-shadow: 0 4px 0 #2a0e0c; color: #b08a7a; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: radial-gradient(ellipse at 50% 30%, rgba(140,50,30,.96), rgba(24,4,8,.98)); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 240px; height: 240px; }
  h1 { font-size: clamp(44px, 13.5vw, 72px); font-weight: 900; line-height: .95; color: #ffd24a; -webkit-text-stroke: 3px #5a1404; text-shadow: 0 5px 0 #5a1404, 0 0 34px rgba(255,120,40,.8); }
  .overlay p { max-width: 320px; font-size: 15px; line-height: 1.55; color: #ffe0d0; }
  .overlay .stat b { color: #ffd24a; }
  .btn { border: 4px solid #ffe8c8; background: linear-gradient(#ffb04a, #e8401a); color: #fff; font: inherit; font-size: 21px; font-weight: 900; letter-spacing: 3px; padding: 14px 46px; border-radius: 40px; cursor: pointer; box-shadow: 0 6px 0 #6a1404, 0 0 30px rgba(255,110,40,.5); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><div class="coins" id="coins">0</div><div><span class="ps" id="ps">0 / sec</span><span class="boost" id="boost" style="display:none">x7 DRAGON RAGE</span></div></div>
<div class="panel" id="panel">
  <div class="tabs"><button class="on" data-t="dragons">Dragons</button><button data-t="upg">Upgrades</button><button data-t="soul">🐉 Ascend</button><button class="mode" id="mode">x1</button></div>
  <div class="list" id="list"></div>
</div>
<div class="overlay" id="menu">
  <canvas id="logo" width="480" height="480"></canvas>
  <h1>DRAGON<br>NEST</h1>
  <p><b>Every egg is a surprise.</b> Warm eggs until they hatch into dragons of fire, frost, storm and starlight — each one unique. Feed them, grow your golden hoard and chase the mythic ones.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">HATCH</button>
</div>
<div class="overlay hidden" id="away">
  <canvas id="awayArt" width="480" height="480"></canvas>
  <h1>WELCOME<br>BACK!</h1>
  <p id="awayTxt"></p>
  <button class="btn" id="awayBtn">COLLECT</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }

// ---------- idle core: big-number formatting, geometric prices, saves and offline earnings ----------
const Idle = (() => {
  const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td', 'Qad', 'Qid', 'Sxd', 'Spd', 'Ocd', 'Nod', 'Vg'];
  // past the named suffixes: aa, ab, ac … zz
  const letters = i => String.fromCharCode(97 + Math.floor(i / 26) % 26) + String.fromCharCode(97 + i % 26);
  function fmt(n, dec = 2) {
    if (!isFinite(n)) return '∞';
    if (n < 0) return '-' + fmt(-n, dec);
    if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n).toString();
    const e = Math.floor(Math.log10(n) / 3), v = n / Math.pow(10, e * 3);
    const s = e < SUF.length ? SUF[e] : letters(e - SUF.length);
    return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(dec)) + s;
  }
  function fmtTime(s) { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return h ? h + 'h ' + m + 'm' : m ? m + 'm ' + x + 's' : x + 's'; }
  // price of buying n more when `owned` are owned: base * g^owned * (g^n - 1) / (g - 1)
  const cost = (base, g, owned, n = 1) => base * Math.pow(g, owned) * (Math.pow(g, n) - 1) / (g - 1);
  // how many can be afforded with `money`
  function maxAfford(base, g, owned, money) { const c0 = base * Math.pow(g, owned); if (money < c0) return 0; return Math.max(1, Math.floor(Math.log(money * (g - 1) / c0 + 1) / Math.log(g))); }
  // milestone multiplier: x2 at 10, 25, 50, 100, then every 100
  function milestone(owned) { let m = 1; for (const k of [10, 25, 50]) if (owned >= k) m *= 2; if (owned >= 100) m *= Math.pow(2, Math.floor(owned / 100)); return m; }
  function nextMilestone(owned) { for (const k of [10, 25, 50, 100]) if (owned < k) return k; return (Math.floor(owned / 100) + 1) * 100; }
  function load(key, defaults) { let s = null; try { s = JSON.parse(localStorage.getItem(key)); } catch (e) {} return Object.assign(JSON.parse(JSON.stringify(defaults)), s || {}); }
  function save(key, state) { state.seen = Date.now(); try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }
  // seconds since the last save, capped (default 8 hours)
  function away(state, cap = 8 * 3600) { if (!state.seen) return 0; return Math.min(cap, Math.max(0, (Date.now() - state.seen) / 1000)); }
  return { fmt, fmtTime, cost, maxAfford, milestone, nextMilestone, load, save, away };
})();

  function buyUpg(u2) { const c = cost(u2.base, u2.g, lvl(u2.id), 1); if (S.coins < c || (u2.max && lvl(u2.id) >= u2.max)) return; S.coins -= c; S.upg[u2.id] = lvl(u2.id) + 1; audio.sfx(880, .12, 'square', .05, 1320); store(); renderList(true); }
  function ascend() {
    const n = soulsAvail(); if (n <= 0) return;
    S.souls += n; S.prestiges++; S.gen++; S.coins = 0; S.dragons = []; S.egg = { seed: S.gen * 1000 + 1, warm: 0 }; S.upg = { embers: lvl('embers') }; FX.flash('#ffffff', .8);
    FX.burst(sceneR.w / 2, sceneR.h / 2, { n: 90, colors: ['#ffe24a', '#ff7a2a', '#ffffff'], shape: 'star', speed: 600, size: 12, gravity: 100, life: 1.6, glow: 1 });
    [523, 659, 784, 1046, 1318].forEach((f, k) => setTimeout(() => audio.sfx(f, .3, 'square', .05), k * 110)); store(); renderList(true);
  }
  const store = () => Idle.save(KEY, S);

  // ---------- panel ----------
  let tab = 'dragons', rows = [];
  document.querySelectorAll('.tabs [data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('.tabs [data-t]').forEach(x => x.classList.toggle('on', x === b)); renderList(true); audio.sfx(660, .04, 'triangle', .03); });
  $('mode').onclick = () => { mode = mode === 1 ? 10 : mode === 10 ? 'max' : 1; $('mode').textContent = mode === 'max' ? 'MAX' : 'x' + mode; renderList(false); };
  function iconCanvas(img, wide) { const c = document.createElement('canvas'); c.width = 116; c.height = 116; if (img) { const g = c.getContext('2d'); if (wide) g.drawImage(img, -14, 4, 144, 120); else g.drawImage(img, 6, 6, 104, 104); } return c; }
  function renderList(full) {
    const L = $('list');
    if (full) {
      L.innerHTML = ''; rows = [];
      if (tab === 'dragons') {
        const el = document.createElement('div'); el.className = 'card egg'; el.innerHTML = '<div class="info"><div class="nm"></div><div class="ds"></div></div><button></button>'; el.prepend(iconCanvas(S.egg ? eggSprite() : SPR && SPR.mystery)); el.querySelector('button').onclick = buyEgg; L.appendChild(el); rows.push({ el, kind: 'egg' });
        for (let i = S.dragons.length - 1; i >= 0; i--) {
          const e = document.createElement('div'); e.className = 'card'; e.innerHTML = '<div class="info"><div class="nm"></div><div class="ds"></div><div class="bar"><i></i></div></div><button></button>';
          e.prepend(iconCanvas(dragonSprites(i).a, true)); e.querySelector('button').onclick = () => feed(i); L.appendChild(e); rows.push({ el: e, kind: 'dragon', i });
        }
      } else if (tab === 'upg') {
        for (const u2 of UPG) { const el = document.createElement('div'); el.className = 'card'; el.innerHTML = '<div class="info"><div class="nm"></div><div class="ds"></div></div><button></button>'; el.prepend(iconCanvas(SPR && SPR[u2.id])); el.querySelector('button').onclick = () => buyUpg(u2); L.appendChild(el); rows.push({ el, u: u2, kind: 'upg' }); }
      } else {
        const el = document.createElement('div'); el.className = 'prest';
        el.innerHTML = '<h3>🐉 Dragon Souls 🐉</h3><div class="big" id="pSouls"></div><p id="pTxt"></p><button id="pBtn">ASCEND YOUR DRAGONS</button><p style="font-size:12px;opacity:.75">Your dragons rise to the stars and leave their souls behind. Each soul makes everything 10% stronger — forever. A new clutch of never-seen dragons awaits. You keep Warm Embers.</p>';
        L.appendChild(el); $('pBtn').onclick = ascend; rows.push({ el, kind: 'soul' });
      }
    }
    for (const r of rows) {
      const btn = r.el.querySelector('button');
      if (r.kind === 'egg') {
        const i = S.dragons.length, c = eggCost(i);
        if (S.egg) { r.el.querySelector('.nm').innerHTML = 'Warming egg <small>#' + (i + 1) + '</small>'; r.el.querySelector('.ds').textContent = 'Tap the nest to hatch it · ' + Math.floor(S.egg.warm) + ' / ' + warmNeed(i) + ' warmth'; btn.innerHTML = 'IN THE<br>NEST'; btn.disabled = true; }
        else { r.el.querySelector('.nm').innerHTML = 'Mystery Egg <small>#' + (i + 1) + '</small>'; r.el.querySelector('.ds').textContent = 'Earns ' + fmt(baseRate(i) * mult()) + '+/s · could be anything!'; btn.innerHTML = 'BUY EGG<br>🪙 ' + fmt(c); btn.disabled = S.coins < c; }
      } else if (r.kind === 'dragon') {
        const i = r.i, d = S.dragons[i], [n, c] = priceN(feedBase(i), 1.12, d.l - 1), nm2 = nextMilestone(d.l), prev = d.l >= 100 ? Math.floor(d.l / 100) * 100 : ([0, 10, 25, 50].filter(q => q <= d.l).pop() || 0);
        r.el.querySelector('.nm').innerHTML = nameOf(i); r.el.querySelector('.ds').innerHTML = '<span class="rar" style="background:' + RAR[d.r].col + '">' + RAR[d.r].name + '</span>Lv ' + d.l + ' · ' + fmt(dragonRate(i)) + '/s';
        r.el.querySelector('.bar i').style.width = Math.min(100, (d.l - prev) / (nm2 - prev) * 100) + '%';
        btn.innerHTML = 'FEED' + (mode === 1 ? '' : ' +' + n) + '<br>🪙 ' + fmt(c); btn.disabled = S.coins < c;
      } else if (r.kind === 'upg') {
        const u2 = r.u, l = lvl(u2.id), c = cost(u2.base, u2.g, l, 1), maxed = u2.max && l >= u2.max; r.el.querySelector('.nm').innerHTML = u2.name + ' <small>Lv ' + l + '</small>'; r.el.querySelector('.ds').textContent = u2.desc(l);
        btn.innerHTML = maxed ? 'MAX' : 'UPGRADE<br>🪙 ' + fmt(c); btn.disabled = maxed || S.coins < c;
      } else { const n = soulsAvail(); $('pSouls').textContent = '🔥 ' + S.souls + (n > 0 ? '  (+' + n + ')' : ''); $('pTxt').innerHTML = 'Clutch #' + S.gen + ' · ' + S.dragons.length + ' dragons<br>Lifetime gold: <b>' + fmt(S.life) + '</b><br>' + (n > 0 ? 'Ascend now for <b>' + n + '</b> soul' + (n > 1 ? 's' : '') + ' (+' + n * 10 + '% forever).' : 'Next soul at ' + fmt(Math.pow(S.souls + 1, 2) * 1e6) + ' lifetime.'); btn.disabled = n <= 0; }
    }
  }
  window.__dn = { state: () => S, cps, tapValue, tap: () => { const E = EGGPOS(); tap(E.x, E.y); }, buyEgg, feed, buyUpg: i => buyUpg(UPG[i]), give: v => earn(v), hatchNow: () => { if (S.egg) warm(1e9); }, goblin: () => goblin, spawnGoblin: () => { gobT = 0; }, catchGoblin, ascend, egg: EGGPOS };

  // ---------- start, offline ----------
  function begin() { if (!SPR) return; S.started = true; $('menu').classList.add('hidden'); audio.start(); resize(); renderList(true); store(); }
  $('startBtn').onclick = () => {
    const away = Idle.away(S), rate = Math.min(1, .5 + lvl('embers') * .1), earned = S.seen && S.started ? cps() * away * rate : 0;
    if (S.egg && away > 30 && lvl('embers')) S.egg.warm = Math.min(warmNeed(S.dragons.length) - 1, S.egg.warm + away * lvl('embers') * .6);
    if (earned > 1 && away > 30) { earn(earned); $('awayTxt').innerHTML = 'You were away for <b>' + Idle.fmtTime(away) + '</b>.<br>Your ' + S.dragons.length + ' dragon' + (S.dragons.length > 1 ? 's' : '') + ' brought home <b>🪙 ' + fmt(earned) + '</b> for the hoard!'; $('menu').classList.add('hidden'); $('away').classList.remove('hidden'); audio.start(); }
    else begin();
  };
  $('awayBtn').onclick = () => { $('away').classList.add('hidden'); begin(); FX.burst(sceneR.w / 2, sceneR.h / 2, { n: 50, colors: ['#ffe24a', '#fff6b0'], shape: 'circle', speed: 500, size: 8, gravity: 500, life: 1.4 }); audio.sfx(988, .3, 'square', .05); };
  $('bestMenu').innerHTML = S.life > 0 ? '<b>' + S.dragons.length + '</b> dragons · hoard <b>' + fmt(S.life) + '</b>' + (S.souls ? ' · 🔥 ' + S.souls : '') : '';
  addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !S.started) { e.preventDefault(); $('startBtn').click(); } });
  addEventListener('visibilitychange', () => { if (document.hidden) store(); });

  // ---------- loop ----------
  let saveT = 0, uiT = 0, embers = [];
  function update(dt) {
    t += dt; FX.update(dt); wob = Math.max(0, wob - dt * 4);
    for (const s of sparks) s.life -= dt; sparks = sparks.filter(s => s.life > 0);
    if (Math.random() < dt * 6) embers.push({ x: Math.random() * sceneR.w, y: sceneR.h + 5, vy: -(20 + Math.random() * 40), life: 6, p: Math.random() * 6 });
    for (const e of embers) { e.y += e.vy * dt; e.x += Math.sin(t + e.p) * 10 * dt; e.life -= dt; } embers = embers.filter(e => e.life > 0);
    if (!S.started) return;
    rage = Math.max(0, rage - dt);
    earn(cps() * dt);
    if (S.egg && lvl('embers')) warm(lvl('embers') * .6 * dt);
    gobT -= dt; if (gobT <= 0 && !goblin) { const dir = Math.random() < .5 ? 1 : -1; goblin = { x: dir > 0 ? -40 : sceneR.w + 40, y: by - 26 * u, vx: dir * (70 + Math.random() * 30) * u }; gobT = (40 + Math.random() * 40); audio.sfx(160, .3, 'square', .03, 120); }
    if (goblin) { goblin.x += goblin.vx * dt; if (goblin.x < -60 || goblin.x > sceneR.w + 60) goblin = null; }
    saveT += dt; if (saveT > 5) { saveT = 0; store(); }
    uiT += dt; if (uiT > .2) { uiT = 0; $('coins').textContent = '🪙 ' + fmt(S.coins); $('ps').textContent = fmt(cps()) + ' / sec'; $('boost').style.display = rage > 0 ? 'inline-block' : 'none'; if (rage > 0) $('boost').textContent = 'x7 DRAGON RAGE ' + Math.ceil(rage) + 's'; renderList(false); }
  }
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (BG) ctx.drawImage(BG, 0, 0, W, H);
    for (const e of embers) { ctx.globalAlpha = Math.min(1, e.life / 2) * .8; ctx.fillStyle = '#ffb04a'; ctx.fillRect(e.x, e.y, 2, 2); } ctx.globalAlpha = 1;
    if (!SPR) return;
    const [ox, oy] = FX.offset(); ctx.translate(ox, oy);
    if (rage > 0) { const g = ctx.createRadialGradient(bx, by, 0, bx, by, sceneR.w * .6); g.addColorStop(0, 'rgba(255,90,30,.35)'); g.addColorStop(1, 'rgba(255,90,30,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, sceneR.w, sceneR.h); }
    drawDragons(); drawHoard(); drawNest();
    for (const s of sparks) { ctx.globalAlpha = s.life / .6; ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.PI / 4); ctx.fillRect(-1, -4, 2, 8); ctx.fillRect(-4, -1, 8, 2); ctx.restore(); } ctx.globalAlpha = 1;
    if (goblin) { const z = 52 * u, hop = Math.abs(Math.sin(t * 12)) * 5; ctx.save(); ctx.translate(goblin.x, goblin.y - hop); if (goblin.vx < 0) ctx.scale(-1, 1); ctx.shadowColor = '#ffe24a'; ctx.shadowBlur = 20; ctx.drawImage(SPR.goblin, -z / 2, -z / 2, z, z); ctx.restore(); }
    FX.draw(ctx);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); FX.drawFlash(ctx, W, H);
  }
  function logoArt() {
    // three sample dragons around an egg on the title and welcome-back cards
    const seeds = [[3, 3], [17, 1], [29, 4]];
    loadSprites(Object.fromEntries(seeds.map(([s, r], i) => ['d' + i, dragonSVG(s, r, i % 2)]).concat([['egg', eggSVG(5)]])), [300, 250]).then(D => {
      for (const id of ['logo', 'awayArt']) {
        const g = $(id).getContext('2d'); g.clearRect(0, 0, 480, 480);
        const glow = g.createRadialGradient(240, 250, 10, 240, 250, 240); glow.addColorStop(0, 'rgba(255,190,90,.6)'); glow.addColorStop(1, 'rgba(255,120,40,0)'); g.fillStyle = glow; g.fillRect(0, 0, 480, 480);
        g.drawImage(SPR.nest, 80, 330, 320, 80); g.drawImage(D.egg, 175, 230, 130, 108); g.drawImage(SPR.nest, 80, 365, 320, 70);
        g.drawImage(D.d0, 10, 60, 250, 208); g.save(); g.translate(470, 120); g.scale(-1, 1); g.drawImage(D.d1, 0, 0, 220, 183); g.restore(); g.drawImage(D.d2, 250, 250, 200, 166);
      }
    });
  }

  resize();
  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
