<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#efe6d8">
<title>Pixel Paint</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #efe6d8;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #4a3a2a;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: none; align-items: center; white-space: nowrap; }
  .hud .t { font-size: 20px; font-weight: bold; }
  .hud .bar { width: 120px; height: 10px; border-radius: 5px; background: #d8ccb8; overflow: hidden; } .hud .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff7a59, #ffd23f, #4ad08a); }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: #4a3a2a77; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card { width: min(350px, 100%); background: #fffaf2; border-radius: 22px; padding: 24px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 40px #0004; border: 3px solid #4a3a2a; }
  .card canvas { width: 160px; height: 160px; margin: 0 auto; image-rendering: pixelated; border: 6px solid #8a5a34; border-radius: 4px; box-shadow: 0 6px 0 #5a3a20; }
  h1 { font-size: clamp(38px, 11vw, 52px); line-height: 1; color: #ff5a5a; text-shadow: 3px 3px 0 #ffd23f; }
  p { font-size: 15px; line-height: 1.5; }
  .stat b { color: #ff5a5a; }
  .btn { border: 3px solid #4a3a2a; background: #4ad08a; color: #fff; font: inherit; font-weight: bold; font-size: 20px; padding: 12px; border-radius: 16px; cursor: pointer; box-shadow: 0 5px 0 #4a3a2a; text-shadow: 0 2px 0 #2a8a5a; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #4a3a2a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span class="t" id="title">Mushroom</span><div class="bar"><i id="prog"></i></div><span id="pct">0%</span></div>

<div class="overlay" id="menu"><div class="card">
  <canvas id="logo" width="16" height="16"></canvas>
  <h1>Pixel Paint</h1>
  <p>Pick a colour from the palette, then <b>tap or drag</b> over the squares with its number. Fill every square to reveal the picture!</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">Start painting</button>
</div></div>
<div class="overlay hidden" id="done"><div class="card">
  <canvas id="finished" width="16" height="16"></canvas>
  <h1 id="doneTitle">Done!</h1>
  <div class="stat" id="doneText"></div>
  <button class="btn" id="nextBtn">Next picture</button>
</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const audio = GameAudio({
    bpm: 96, scale: 'pentaMajor', root: 64, prog: [0, 3, 1, 4], seed: 509,
    waves: { lead: 'triangle', bass: 'sine', arp: 'sine', pad: 'sine' },
    pad: true, arp: true, arpEvery: 2, arpOct: 1, leadOct: 1, leadDensity: 0.28, drums: 'soft', swing: 0.15, bassPattern: [0, 8], volume: 0.18,
    btnBg: 'rgba(74,58,42,.35)', btnColor: '#fffaf2'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'pixel_paint_picture';
  let pic = 0; try { pic = +localStorage.getItem(KEY) || 0; } catch (e) {}

  // ---------- hand-made 16x16 pictures ('.' is the background colour) ----------
  const PICS = [
    { name: 'Mushroom', pal: { '.': '#cfefff', r: '#e23b3b', w: '#ffffff', s: '#f3dcb0', k: '#3a2a2a', g: '#5cb030' }, rows: [
      '................', '.....rrrrrr.....', '...rrwwrrrrrr...', '..rrwwwwrrwwrr..', '.rrrwwwwrrwwwrr.', '.rrrrwwrrrrwwrr.', 'rrwwrrrrrwwrrrrr', 'rwwwwrrrrwwwrrrr',
      'rwwwwrrrrrwrrwwr', '.rrrrrrrrrrrrrr.', '....sssssssss...', '....sskssksss...', '....sssssssss...', '....ssssssss....', 'gggggssssssggggg', 'gggggggggggggggg'] },
    { name: 'Kitty', pal: { '.': '#ffe9c8', o: '#ff9a3a', d: '#c8641a', w: '#ffffff', k: '#2a2020', p: '#ff8aa8', g: '#5ad06a' }, rows: [
      '................', '..o.........o...', '.ooo.......ooo..', '.opoo.....oopo..', '.oooooooooooooo.', '.oooooooooooooo.', '.oogkoooooogkoo.', '.oogkoooooogkoo.',
      '.ooooooppoooooo.', '.owwwoooooowwwo.', '.owwwwwkkwwwwwo.', '..owwwkwwkwwwo..', '...oowwwwwwoo...', '....oooooooo....', '.....dddddd.....', '................'] },
    { name: 'Ice Cream', pal: { '.': '#e8f4ff', p: '#ff9ac8', w: '#ffffff', r: '#e0202a', c: '#7a4a2a', y: '#f0c070', x: '#c08a40' }, rows: [
      '................', '.......rr.......', '......pppp......', '....pppppppp....', '...ppwppppppp...', '...pppppppppp...', '....pppppppp....', '...cccccccccc...',
      '...cccccccccc...', '....yyxyyxyy....', '....yxyyxyyx....', '.....yyxyyxy....', '.....xyyxyy.....', '......yxyyx.....', '.......yyx......', '.......xy.......'] },
    { name: 'Rocket', pal: { '.': '#1a2040', r: '#e23b3b', w: '#e8eef4', b: '#4a5a7a', c: '#5ad0ff', o: '#ff8a20', y: '#ffe04a', s: '#ffffff' }, rows: [
      's......rr.....s.', '......rrrr......', '.....wwwwww.....', '..s..wwwwww.....', '.....wwbbww.....', '.....wbccbw..s..', '.....wbccbw.....', '.....wwbbww.....',
      '.....wwwwww.....', '....rwwwwwwr....', '...rrwwwwwwrr...', '...rr.wwww.rr...', '.......oo.......', '..s...oyyo......', '.......yy....s..', '........o.......'] },
    { name: 'Whale', pal: { '.': '#bfe8ff', b: '#3a7ad0', l: '#c8e0f8', k: '#1a2a40', w: '#ffffff', d: '#1a5aa0' }, rows: [
      '................', '.........ww.w...', '..........ww....', '...bbbbb...w....', '.bbbbbbbbb......', 'bbbbbbbbbbb...bb', 'bbkbbbbbbbbb.bbb', 'bbbbbbbbbbbbbbb.',
      'llllbbbbbbbbbbb.', '.lllllllbbbbbb..', '..llllllllbbb...', '................', 'dddddddddddddddd', 'dwddddddddwddddd', 'dddddwdddddddwdd', 'dddddddddddddddd'] },
    { name: 'Cactus', pal: { '.': '#fff0d0', g: '#3aa04a', h: '#6ad06a', f: '#ff5a9a', t: '#c8643a', c: '#8a3a1a' }, rows: [
      '.......ff.......', '.......gg.......', '......ghgg......', '......ghgg..f...', '..f...ghgg.ggg..', '.ggg..ghgg.ghg..', '.ghg..ghgg.ghg..', '.ghggggggggggg..',
      '..gggggggggggg..', '......ghgg......', '......ghgg......', '....tttttttt....', '....tcccccct....', '.....tttttt.....', '.....tttttt.....', '................'] }
  ];
  // normalise rows to exactly 16 characters
  PICS.forEach(p => p.rows = p.rows.map(r => (r + '................').slice(0, 16)));

  let W, H, DPR, N = 16, cell, bx, by, swY, swS, grid, painted, keys, sel = 0, state = 'menu', t = 0, drag = false, flashes = [], revealT = 0, pops = [];
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    swS = Math.min(56, (W - 20) / 8.6);
    cell = Math.min((W - 40) / N, (H - 170 - swS * 1.6) / N);
    bx = (W - cell * N) / 2; by = 70 + (H - 150 - swS * 1.6 - cell * N) / 2;
    swY = by + cell * N + 30;
  }
  addEventListener('resize', resize); resize();
  function load() {
    const P = PICS[pic % PICS.length];
    keys = Object.keys(P.pal);
    grid = []; for (const row of P.rows) for (const ch of row) grid.push(keys.indexOf(ch));
    painted = new Uint8Array(N * N); sel = 0; revealT = 0; flashes = []; pops = [];
    $('title').textContent = P.name; hud();
  }
  const colorOf = k => PICS[pic % PICS.length].pal[keys[k]];
  function hud() { const n = painted.reduce((a, b) => a + b, 0); $('prog').style.width = (n / (N * N) * 100) + '%'; $('pct').textContent = Math.floor(n / (N * N) * 100) + '%'; }
  function start() { load(); state = 'play'; audio.start(); $('menu').classList.add('hidden'); $('done').classList.add('hidden'); }
  $('startBtn').onclick = start;
  $('nextBtn').onclick = () => { pic++; try { localStorage.setItem(KEY, pic); } catch (e) {} start(); };
  function drawThumb(cv, idx) { const P = PICS[idx % PICS.length], c = cv.getContext('2d'); P.rows.forEach((row, r) => [...row].forEach((ch, x) => { c.fillStyle = P.pal[ch]; c.fillRect(x, r, 1, 1); })); }
  drawThumb($('logo'), pic);
  $('bestMenu').innerHTML = pic ? 'Pictures finished: <b>' + pic + '</b>' : '';

  const remaining = k => { let n = 0; for (let i = 0; i < N * N; i++) if (grid[i] === k && !painted[i]) n++; return n; };
  function paintAt(x, y) {
    const c = Math.floor((x - bx) / cell), r = Math.floor((y - by) / cell);
    if (r < 0 || r >= N || c < 0 || c >= N) return false;
    const i = r * N + c;
    if (painted[i]) return true;
    if (grid[i] === sel) {
      painted[i] = 1; flashes.push({ i, t: 0 });
      audio.sfx(523 * Math.pow(2, (sel % 7) / 7), 0.05, 'sine', 0.035);
      hud();
      if (!remaining(sel)) { audio.sfx(988, 0.25, 'triangle', 0.06, 1318); const nx = keys.findIndex((_, k) => remaining(k)); if (nx >= 0) sel = nx; }
      if (painted.every(v => v)) finish();
    } else if (!drag) { flashes.push({ i, t: 0, bad: true }); audio.sfx(160, 0.08, 'square', 0.03); }
    return true;
  }
  function finish() {
    state = 'done'; revealT = 0.001;
    for (let k = 0; k < 60; k++) pops.push({ x: bx + Math.random() * cell * N, y: by + cell * N, vx: (Math.random() - .5) * 300, vy: -200 - Math.random() * 400, life: 1.6, c: colorOf(Math.floor(Math.random() * keys.length)) });
    [523, 659, 784, 1046, 1318].forEach((f, k) => setTimeout(() => audio.sfx(f, 0.35, 'triangle', 0.07), k * 110));
    const fc = $('finished'); fc.getContext('2d').clearRect(0, 0, 16, 16); drawThumb(fc, pic);
    $('doneTitle').textContent = PICS[pic % PICS.length].name + '!'; $('doneText').innerHTML = 'Picture <b>' + (pic + 1) + '</b> finished';
    setTimeout(() => $('done').classList.remove('hidden'), 1800);
  }
  canvas.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    // palette swatches
    if (e.clientY >= swY - swS * 0.2 && e.clientY <= swY + swS * 1.3) {
      const total = keys.length * swS + (keys.length - 1) * 6, k = Math.floor((e.clientX - (W - total) / 2) / (swS + 6));
      if (k >= 0 && k < keys.length) { sel = k; audio.sfx(660, 0.06, 'sine', 0.04); }
      return;
    }
    if (paintAt(e.clientX, e.clientY)) drag = true;
  });
  addEventListener('pointermove', e => { if (drag && state === 'play') { drag = 'move'; paintAt(e.clientX, e.clientY); } });
  addEventListener('pointerup', () => { drag = false; });
  addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && state === 'menu') { e.preventDefault(); start(); } const n = +e.key; if (n >= 1 && keys && n <= keys.length) sel = n - 1; });

  function update(dt) { t += dt; if (revealT) revealT += dt; for (const f of flashes) f.t += dt * 3; flashes = flashes.filter(f => f.t < 1); for (const p of pops) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0); }
  function lum(hex) { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 0.3 + ((n >> 8) & 255) * 0.59 + (n & 255) * 0.11) / 255; }
  function render() {
    // studio wall + wooden easel frame
    ctx.fillStyle = '#efe6d8'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(160,130,100,.08)'; for (let x = 0; x < W; x += 24) ctx.fillRect(x, 0, 12, H);
    if (!grid) return;
    const fw = cell * N;
    ctx.fillStyle = '#5a3a20'; ctx.fillRect(W / 2 - 8, by + fw, 16, H); ctx.fillRect(bx + fw * 0.15, by + fw, 10, H); ctx.fillRect(bx + fw * 0.85 - 10, by + fw, 10, H);
    ctx.fillStyle = '#8a5a34'; ctx.fillRect(bx - 14, by - 14, fw + 28, fw + 28);
    ctx.fillStyle = '#a8744a'; ctx.fillRect(bx - 14, by - 14, fw + 28, 6);
    ctx.fillStyle = '#fff'; ctx.fillRect(bx - 2, by - 2, fw + 4, fw + 4);
    const fmap = new Map(flashes.map(f => [f.i, f]));
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const i = r * N + c, k = grid[i], x = bx + c * cell, y = by + r * cell, f = fmap.get(i);
      if (painted[i]) {
        const col = colorOf(k);
        let s = 1; if (f && !f.bad) s = 1 + Math.sin(f.t * Math.PI) * 0.25;
        const g = revealT ? 0 : 0.5;
        ctx.fillStyle = col; ctx.fillRect(x + cell / 2 - cell * s / 2 - g, y + cell / 2 - cell * s / 2 - g, cell * s + 2 * g, cell * s + 2 * g);
        if (!revealT && cell > 12) { ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x, y, cell, cell * 0.18); ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(x, y + cell * 0.82, cell, cell * 0.18); }
      } else {
        const hl = k === sel;
        const v = Math.round(lum(colorOf(k)) * 50 + 195);
        ctx.fillStyle = hl ? 'rgb(' + (v - 30) + ',' + (v - 30) + ',' + (v - 10) + ')' : 'rgb(' + v + ',' + v + ',' + v + ')';
        ctx.fillRect(x + 0.5, y + 0.5, cell - 1, cell - 1);
        if (f && f.bad) { ctx.fillStyle = 'rgba(255,60,60,' + (1 - f.t) * 0.6 + ')'; ctx.fillRect(x, y, cell, cell); }
        if (cell > 13) { ctx.fillStyle = hl ? '#2a1a0a' : '#9a8a7a'; ctx.font = (hl ? 'bold ' : '') + Math.round(cell * 0.5) + 'px Trebuchet MS, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(k + 1, x + cell / 2, y + cell / 2 + 1); }
      }
    }
    if (revealT) { ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, 0.6 - revealT) + ')'; ctx.fillRect(bx, by, fw, fw); }
    // palette: paint blobs on a wooden palette
    const total = keys.length * swS + (keys.length - 1) * 6, px = (W - total) / 2;
    ctx.fillStyle = '#d8b07a'; ctx.beginPath(); ctx.ellipse(W / 2, swY + swS * 0.55, total / 2 + 30, swS * 0.95, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#efe6d8'; ctx.beginPath(); ctx.ellipse(W / 2 + total / 2 + 8, swY + swS * 0.7, 12, 9, 0, 0, Math.PI * 2); ctx.fill();
    for (let k = 0; k < keys.length; k++) {
      const x = px + k * (swS + 6) + swS / 2, y = swY + swS / 2 - (k === sel ? 8 : 0), left = remaining(k), col = colorOf(k);
      ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x + 2, y + 4, swS * 0.42, swS * 0.38, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, swS * 0.42, swS * 0.38, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(x - swS * 0.14, y - swS * 0.14, swS * 0.12, swS * 0.07, -0.5, 0, Math.PI * 2); ctx.fill();
      if (k === sel) { ctx.strokeStyle = '#4a3a2a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x, y, swS * 0.48, swS * 0.44, 0, 0, Math.PI * 2); ctx.stroke(); }
      ctx.fillStyle = lum(col) > 0.6 ? '#2a1a0a' : '#fff'; ctx.font = 'bold ' + Math.round(swS * 0.34) + 'px Trebuchet MS, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(left ? k + 1 : '✓', x, y + 1);
    }
    for (const p of pops) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 7, 7); }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
