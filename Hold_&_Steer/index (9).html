<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03243a">
<title>Shark Frenzy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #021626;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; color: #e8f8ff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); text-align: center; transition: opacity .45s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  #menu { background: linear-gradient(180deg, rgba(1,12,26,.72) 0%, rgba(1,12,26,.12) 30%, rgba(1,12,26,.12) 58%, rgba(1,10,22,.88) 100%); }
  .title { font-size: clamp(54px, 15.5vw, 112px); font-weight: 900; font-style: italic; line-height: .84; letter-spacing: 1px;
    background: linear-gradient(180deg, #ffffff 0%, #d4f8ff 28%, #4cd2f6 58%, #0b6aa8 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 2.5px #02182c; filter: drop-shadow(0 5px 0 #02182c) drop-shadow(0 0 24px rgba(70,210,255,.6)); transform: rotate(-4deg); }
  .title span { display: block; font-size: 1.08em; background: linear-gradient(180deg, #fff7c8 0%, #ffd23c 38%, #ff7b18 72%, #c42c08 100%);
    -webkit-background-clip: text; background-clip: text; }
  .tag { font-size: 13px; font-weight: 900; letter-spacing: 5px; color: #9fe6ff; text-shadow: 0 2px 6px rgba(0,0,0,.8); margin-top: 2px; }
  .card { width: min(380px, 94vw); background: linear-gradient(180deg, rgba(8,46,76,.95), rgba(3,22,42,.97)); border: 2px solid rgba(120,220,255,.32);
    border-radius: 22px; padding: 8px 10px 12px; box-shadow: 0 12px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.16); }
  .sel { display: flex; align-items: center; gap: 4px; }
  .arrow { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(140,230,255,.45); background: rgba(10,64,96,.75);
    color: #c8f6ff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .arrow svg { width: 18px; height: 18px; }
  .arrow:active { transform: scale(.92); }
  #prev { flex: 1; min-width: 0; height: 118px; }
  .sname { font-size: 22px; font-weight: 900; letter-spacing: 2px; color: #fff; text-transform: uppercase; text-shadow: 0 2px 0 #02182c; }
  .sdesc { font-size: 12px; color: #8fd0ea; font-weight: 700; min-height: 15px; }
  .lock { color: #ffcf5a; font-weight: 900; font-size: 13px; }
  .stats { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 8px; font-size: 10.5px; font-weight: 900; letter-spacing: 1px; color: #8fd0ea; text-align: left; margin-top: 7px; align-items: center; }
  .stats i { display: block; height: 7px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  .stats i b { display: block; height: 100%; background: linear-gradient(90deg, #2ab8f0, #c8f8ff); border-radius: 4px; }
  .best { font-size: 14px; font-weight: 800; color: #bfe8ff; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
  .best b { color: #ffd84a; }
  .btn { border: 3px solid #fff4c8; background: linear-gradient(180deg, #ffe46a 0%, #ffaa1e 52%, #ff6400 100%); color: #4a1400; font: inherit;
    font-size: 26px; font-weight: 900; letter-spacing: 4px; padding: 13px 58px; border-radius: 40px; cursor: pointer;
    box-shadow: 0 6px 0 #8a2e00, 0 0 34px rgba(255,170,40,.65); animation: pulse 1.6s ease-in-out infinite; text-shadow: 0 1px 0 rgba(255,255,255,.55); }
  .btn:disabled { filter: grayscale(.8) brightness(.7); animation: none; }
  .btn:active { transform: translateY(3px) scale(.98); box-shadow: 0 3px 0 #8a2e00, 0 0 24px rgba(255,170,40,.5); }
  @keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 6px 0 #8a2e00, 0 0 56px rgba(255,196,70,.95); } }
  .btn2 { border: 2px solid rgba(160,230,255,.5); background: rgba(6,44,70,.8); color: #c8f2ff; font: inherit; font-size: 15px; font-weight: 900;
    letter-spacing: 3px; padding: 9px 30px; border-radius: 30px; cursor: pointer; }
  .hint { font-size: 12px; color: #8fc8e0; font-weight: 700; text-shadow: 0 1px 3px #000; }
  #over { background: radial-gradient(ellipse 90% 70% at 50% 45%, rgba(4,30,54,.82), rgba(1,8,18,.96)); }
  .gtitle { font-size: clamp(40px, 11vw, 70px); font-weight: 900; font-style: italic; line-height: .9;
    background: linear-gradient(180deg, #ffffff, #ff9a8a 45%, #e8203a); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 2px #2a0410; filter: drop-shadow(0 4px 0 #2a0410) drop-shadow(0 0 20px rgba(255,60,80,.55)); }
  .newbest { display: none; font-size: 15px; font-weight: 900; letter-spacing: 3px; color: #4a1a00; background: linear-gradient(#fff28a, #ffb21a);
    padding: 5px 16px; border-radius: 20px; box-shadow: 0 0 24px rgba(255,210,60,.8); animation: pulse 1s ease-in-out infinite; }
  .bigscore { font-size: clamp(48px, 14vw, 76px); font-weight: 900; color: #fff; text-shadow: 0 4px 0 #02182c, 0 0 26px rgba(80,220,255,.6); line-height: 1; }
  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(380px, 92vw); margin: 4px 0; }
  .statgrid div { background: rgba(10,60,96,.55); border: 1px solid rgba(140,220,255,.25); border-radius: 14px; padding: 7px 4px; }
  .statgrid b { display: block; font-size: 20px; color: #fff; }
  .statgrid span { font-size: 10px; font-weight: 900; letter-spacing: 1.5px; color: #8fd0ea; }
  .unlock { display: none; font-size: 14px; font-weight: 900; color: #fff; background: linear-gradient(90deg, #0a8ab8, #2ad0a0); padding: 7px 14px; border-radius: 14px; box-shadow: 0 0 20px rgba(60,230,200,.5); }
  #pause { background: rgba(1,10,22,.6); }
  #pause .gtitle { background: linear-gradient(180deg, #fff, #8fe8ff 50%, #2a9ad8); -webkit-background-clip: text; background-clip: text; -webkit-text-stroke: 2px #021a30; filter: drop-shadow(0 4px 0 #021a30); }
  @media (max-height: 660px) { .title { font-size: clamp(44px, 12vw, 76px); } #prev { height: 92px; } .card { padding: 6px 10px 9px; } .btn { padding: 10px 50px; font-size: 22px; } .overlay { gap: 7px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay" id="menu">
  <div class="title">SHARK<span>FRENZY</span></div>
  <div class="tag">EAT · GROW · FRENZY</div>
  <div class="card">
    <div class="sel">
      <button class="arrow" id="prevSp" aria-label="Previous shark"><svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <canvas id="prev"></canvas>
      <button class="arrow" id="nextSp" aria-label="Next shark"><svg viewBox="0 0 24 24"><path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="sname" id="spName">Reef Shark</div>
    <div class="sdesc" id="spDesc"></div>
    <div class="stats" id="spStats"></div>
  </div>
  <div class="best" id="bestMenu"></div>
  <button class="btn" id="startBtn" disabled>LOADING</button>
  <div class="hint">Hold &amp; steer · Double-tap for BOOST BITE · Keys: arrows + Space</div>
</div>
<div class="overlay hidden" id="over">
  <div class="gtitle" id="goTitle">SHARK DOWN</div>
  <div class="newbest" id="newBest">NEW BEST!</div>
  <div class="bigscore" id="goScore">0</div>
  <div class="best" id="goBest"></div>
  <div class="statgrid" id="goStats"></div>
  <div class="unlock" id="goUnlock"></div>
  <button class="btn" id="againBtn">PLAY AGAIN</button>
  <button class="btn2" id="menuBtn">MENU</button>
</div>
<div class="overlay hidden" id="pause">
  <div class="gtitle">PAUSED</div>
  <div class="best">Tap anywhere to resume</div>
</div>
<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {

window.__sf2 = {
  state() {
    const s = shark; if (!s || !G) return { mode };
    const [mx, my] = mouthPos(); let food = null, bd = 1e9;
    for (const sc of schools) for (const f of sc.fish) { const d = Math.hypot(f.x - mx, f.y - my); if (d < bd) { bd = d; food = [f.x, f.y]; } }
    for (const e of ents) if (['tuna', 'turtle', 'seal', 'diver', 'gull', 'sailor', 'gold', 'angler'].includes(e.t) && (DEF[e.t].mass <= s.power)) { const d = Math.hypot(e.x - mx, e.y - my); if (d < bd) { bd = d; food = [e.x, e.y]; } }
    const sp = toScreen(s.x, s.y), fs = food ? toScreen(food[0], food[1]) : null;
    return { mode, stage: G.stage, score: Math.floor(G.score), hp: s.hp, maxHp: s.maxHp, level: s.level, x: s.x, y: s.y, sx: sp[0], sy: sp[1], food: fs, foodDist: bd, fps, ents: ents.length,
      fish: schools.reduce((a, b) => a + b.fish.length, 0), boss: boss ? { t: boss.t, hp: boss.hp, maxHp: boss.maxHp } : null, goal: G.goal, frenzy: G.frenzyT, best: SAVE.best, air: s.air, biome: world && world.bk, eaten: G.eaten, W, H, ms: perfMs, combo: G.combo, mult: G.mult, frenzies: G.frenzies, maxCombo: G.maxCombo, frz: G.frz };
  },
  async forceStage(n) { $('menu').classList.add('hidden'); $('over').classList.add('hidden'); await newRun(n); return true; },
  god(on = true) { if (G) G.god = on; }, setHP(v) { shark.hp = v; }, frenzy() { startFrenzy(); }, kill() { shark.hp = 0; die(); }, clear() { stageClear(); },
  boss() { if (!boss) spawnBoss(); }, explode() { const c = Math.cos(shark.ang); explode(shark.x + c * 180, shark.y - 40, 1, true); },
  power(k) { G[k + 'T'] = 10; }, mine() { const c = Math.cos(shark.ang); return mk('mine', shark.x + c * 260, shark.y, { ax: shark.x + c * 260, ay: world.fy(shark.x), len: world.fy(shark.x) - shark.y }); },
  tp(x, y) { if (x == null) { x = world.trenchX; y = world.fy(x) - 220; } shark.x = x; shark.y = y; shark.vx = 0; shark.vy = 0; cam.x = x; cam.y = y; },
  killBoss() { if (boss) { boss.hp = 0; bossKill(); } },
  save: () => JSON.parse(JSON.stringify(SAVE)), prof(on) { if (on) PROF = { _t: 0 }; else { const r = PROF; PROF = null; return r; } }, timeScale: v => { slowT = 999; slowK = v; }
};
