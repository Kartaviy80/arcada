<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c2a44">
<title>Water Sort</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1c2a44;
    font-family: "Avenir Next", "Segoe UI", sans-serif; color: #eaf2ff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; }
  .hud b { font-size: 28px; font-weight: 600; letter-spacing: 2px; }
  .hud div { font-size: 12px; letter-spacing: 3px; opacity: .6; }
  .tools { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 12px; }
  .tools button { width: 58px; height: 58px; border-radius: 18px; border: 2px solid #ffffff33; background: #ffffff18; color: #fff; font-size: 24px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); position: relative; }
  .tools button:active { transform: scale(.94); }
  .tools button small { position: absolute; right: -4px; top: -6px; background: #ff7a59; border-radius: 10px; font-size: 11px; padding: 1px 6px; }
  .tools button:disabled { opacity: .35; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: #101a2ce0; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 220px; height: 150px; }
  h1 { font-size: clamp(38px, 11vw, 60px); font-weight: 700; letter-spacing: 2px; background: linear-gradient(90deg, #ff5a7a, #ffb03a, #5ae08a, #5ab8ff, #b07aff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { max-width: 310px; font-size: 15px; line-height: 1.6; color: #b8c8e8; }
  .stat { letter-spacing: 2px; } .stat b { color: #5ae0c8; }
  .btn { border: none; background: linear-gradient(90deg, #5ab8ff, #b07aff); color: #fff; font: inherit; font-weight: 600; font-size: 18px; letter-spacing: 2px; padding: 15px 46px; border-radius: 40px; cursor: pointer; box-shadow: 0 10px 30px #5ab8ff44; }
  .btn:active { transform: scale(.96); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b id="level">LEVEL 1</b><div id="moves">0 MOVES</div></div>
<div class="tools"><button id="undo" title="Undo">↶</button><button id="restart" title="Restart">⟳</button><button id="addTube" title="Extra tube">＋<small>1</small></button></div>

<div class="overlay" id="menu">
  <canvas id="logo" width="440" height="300"></canvas>
  <h1>Water Sort</h1>
  <p><b>Tap</b> a tube, then tap another to pour. Liquid only pours onto the same colour or into an empty tube. Sort every colour into its own tube!</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">PLAY</button>
</div>
<div class="overlay hidden" id="win">
  <h1>Sorted!</h1>
  <div class="stat">Solved in <b id="winMoves">0</b> moves</div>
  <button class="btn" id="nextBtn">NEXT LEVEL</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SORT-ENGINE-START*/
// ---------- sort engine: containers holding stacks of colours ----------
// tubes[i] is an array bottom → top. A move takes the top run of one colour
// and drops as much of it as fits onto a tube that is empty or has the same colour on top.
const SortPuzzle = (opts) => {
  const cap = opts.cap, single = !!opts.single;
  let tubes = [], history = [];
  const top = t => t[t.length - 1];
  const topRun = t => { let n = 0; for (let i = t.length - 1; i >= 0 && t[i] === top(t); i--) n++; return n; };

  function generate(colors, empty, extraTubes = 0) {
    // shuffle a full set of pieces until no tube starts finished
    for (let tries = 0; tries < 200; tries++) {
      const all = [];
      for (let c = 0; c < colors; c++) for (let k = 0; k < cap; k++) all.push(c);
      for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
      tubes = [];
      for (let c = 0; c < colors; c++) tubes.push(all.slice(c * cap, c * cap + cap));
      for (let e = 0; e < empty + extraTubes; e++) tubes.push([]);
      if (!tubes.some(t => t.length === cap && t.every(v => v === t[0]))) break;
    }
    history = [];
    return api;
  }

  const api = {
    get tubes() { return tubes; },
    get cap() { return cap; },
    generate,
    load(t) { tubes = t.map(x => x.slice()); history = []; return api; },
    topRun,
    canMove(from, to) {
      if (from === to) return false;
      const a = tubes[from], b = tubes[to];
      if (!a || !b || !a.length || b.length >= cap) return false;
      return !b.length || top(b) === top(a);
    },
    // returns how many pieces moved
    move(from, to) {
      if (!api.canMove(from, to)) return 0;
      const a = tubes[from], b = tubes[to];
      const n = single ? 1 : Math.min(topRun(a), cap - b.length);
      for (let i = 0; i < n; i++) b.push(a.pop());
      history.push([from, to, n]);
      return n;
    },
    undo() {
      const h = history.pop(); if (!h) return null;
      const [from, to, n] = h;
      for (let i = 0; i < n; i++) tubes[from].push(tubes[to].pop());
      return h;
    },
    get moves() { return history.length; },
    complete(i) { const t = tubes[i]; return t.length === cap && t.every(v => v === t[0]); },
    solved() { return tubes.every(t => !t.length || (t.length === cap && t.every(v => v === t[0]))); },
    addTube() { tubes.push([]); },
    stuck() {
      for (let i = 0; i < tubes.length; i++) for (let j = 0; j < tubes.length; j++) {
        if (!api.canMove(i, j)) continue;
        // moving a whole uniform tube into an empty one changes nothing
        if (!tubes[j].length && topRun(tubes[i]) === tubes[i].length) continue;
        return false;
      }
      return true;
    }
  };
  return api;
};
/*SORT-ENGINE-END*/
(() => {
  const audio = GameAudio({
    bpm: 82, scale: 'lydian', root: 60, prog: [0, 4, 1, 5], seed: 501,
    waves: { lead: 'sine', bass: 'sine', arp: 'triangle', pad: 'sine' },
    pad: true, arp: true, arpEvery: 2, arpOct: 1, leadOct: 1, leadDensity: 0.22, drums: false, bassPattern: [0, 8], volume: 0.2,
    btnBg: 'rgba(255,255,255,.12)'
  });
  const canvas = document.getElementById('c'); let ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'water_sort_level';
  let level = 1; try { level = +localStorage.getItem(KEY) || 1; } catch (e) {}
  $('bestMenu').innerHTML = level > 1 ? 'Continue from level <b>' + level + '</b>' : '';

  const LIQ = ['#ff3d6e', '#ff9a2e', '#ffe14a', '#4ee07a', '#2ec8ff', '#3a6bff', '#a35bff', '#ff6ad5', '#8a5a3a', '#9aa4b8', '#1fbfa0', '#c8f04a'];
  const CAP = 4;
  let W, H, DPR, tw, th, layout = [];
  let pz, sel = -1, anim = null, t = 0, extraUsed = false, splash = [], wave = 0, state = 'menu', done = new Set();

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    doLayout();
  }
  function doLayout() {
    if (!pz) return;
    const n = pz.tubes.length, rows = n > 7 ? 2 : 1, perRow = Math.ceil(n / rows);
    tw = Math.min(64, (W - 30) / perRow * 0.72); th = tw * 3.6;
    const gap = Math.min(tw * 0.6, (W - perRow * tw) / (perRow + 1));
    const availH = H - 200, rowH = Math.min(th + 50, availH / rows);
    th = Math.min(th, rowH - 40);
    layout = [];
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / perRow), inRow = Math.min(perRow, n - r * perRow), k = i - r * perRow;
      const total = inRow * tw + (inRow - 1) * gap;
      layout.push({ x: (W - total) / 2 + k * (tw + gap), y: 110 + (availH - rows * rowH) / 2 + r * rowH + 20 });
    }
  }
  addEventListener('resize', resize); resize();

  function load() {
    const colors = Math.min(LIQ.length, 3 + Math.floor((level - 1) / 2));
    pz = SortPuzzle({ cap: CAP }).generate(colors, 2);
    sel = -1; anim = null; extraUsed = false; done = new Set();
    $('addTube').disabled = false; $('addTube').querySelector('small').textContent = '1';
    doLayout(); hud();
  }
  function hud() { $('level').textContent = 'LEVEL ' + level; $('moves').textContent = pz.moves + ' MOVES'; $('undo').disabled = !pz.moves; }
  function start() { load(); state = 'play'; audio.start(); $('menu').classList.add('hidden'); $('win').classList.add('hidden'); }
  $('startBtn').onclick = start;
  $('nextBtn').onclick = () => { level++; try { localStorage.setItem(KEY, level); } catch (e) {} start(); };
  $('undo').onclick = () => { if (state !== 'play' || anim) return; if (pz.undo()) { audio.sfx(300, 0.1, 'sine', 0.05, 200); sel = -1; recheckDone(); hud(); } };
  $('restart').onclick = () => { if (state === 'play' && !anim) { while (pz.undo()); sel = -1; done = new Set(); hud(); } };
  $('addTube').onclick = () => { if (state !== 'play' || extraUsed || anim) return; extraUsed = true; pz.addTube(); doLayout(); $('addTube').disabled = true; $('addTube').querySelector('small').textContent = '0'; audio.sfx(660, 0.2, 'triangle', 0.06, 990); };
  function recheckDone() { done = new Set(pz.tubes.map((_, i) => i).filter(i => pz.complete(i))); }

  function tubeAt(x, y) {
    for (let i = 0; i < layout.length; i++) { const L = layout[i]; if (x >= L.x - 8 && x <= L.x + tw + 8 && y >= L.y - 30 && y <= L.y + th + 10) return i; }
    return -1;
  }
  canvas.addEventListener('pointerdown', e => {
    if (state !== 'play' || anim) return;
    const i = tubeAt(e.clientX, e.clientY);
    if (i < 0) { sel = -1; return; }
    if (sel < 0) { if (pz.tubes[i].length && !pz.complete(i)) { sel = i; audio.sfx(520, 0.06, 'sine', 0.05); } return; }
    if (i === sel) { sel = -1; return; }
    if (pz.canMove(sel, i)) {
      const color = pz.tubes[sel][pz.tubes[sel].length - 1];
      const n = pz.move(sel, i);
      anim = { from: sel, to: i, n, color, t: 0, dur: 0.95 };
      sel = -1; hud();
      audio.sfx(240, 0.6, 'sine', 0.035, 520);
    } else {
      layout[i].shake = 0.3; audio.sfx(160, 0.12, 'square', 0.04);
      if (pz.tubes[i].length && !pz.complete(i)) sel = i; else sel = -1;
    }
  });
  addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && state === 'menu') { e.preventDefault(); start(); } });

  function update(dt) {
    t += dt; wave += dt;
    if (anim) {
      anim.t += dt;
      if (anim.t >= anim.dur) {
        const to = anim.to; anim = null;
        if (pz.complete(to) && !done.has(to)) {
          done.add(to);
          const L = layout[to];
          for (let k = 0; k < 24; k++) splash.push({ x: L.x + tw / 2, y: L.y, vx: (Math.random() - .5) * 260, vy: -Math.random() * 260, life: 1, col: LIQ[pz.tubes[to][0]] });
          audio.sfx(784, 0.4, 'triangle', 0.08, 1568);
        }
        if (pz.solved()) {
          state = 'won'; $('winMoves').textContent = pz.moves;
          [523, 659, 784, 1046].forEach((f, k) => setTimeout(() => audio.sfx(f, 0.3, 'sine', 0.08), k * 110));
          setTimeout(() => $('win').classList.remove('hidden'), 700);
        }
      }
    }
    for (const L of layout) if (L.shake) L.shake = Math.max(0, L.shake - dt);
    for (const s of splash) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt; s.life -= dt; }
    splash = splash.filter(s => s.life > 0);
  }

  // ---------- drawing ----------
  function tubePath(x, y, w, h) {
    const r = w / 2;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x, y + h - r); ctx.arc(x + r, y + h - r, r, Math.PI, 0, true); ctx.lineTo(x + w, y); ctx.closePath();
  }
  // levels: array of {color, amount (0..1 of a segment)}
  function drawTube(x, y, levels, opts = {}) {
    const w = tw, h = th, seg = (h - 10) / CAP;
    ctx.save();
    // glass back
    tubePath(x, y, w, h);
    const gb = ctx.createLinearGradient(x, 0, x + w, 0);
    gb.addColorStop(0, 'rgba(255,255,255,.10)'); gb.addColorStop(0.5, 'rgba(255,255,255,.03)'); gb.addColorStop(1, 'rgba(255,255,255,.12)');
    ctx.fillStyle = gb; ctx.fill();
    // liquid
    ctx.save(); tubePath(x + 3, y, w - 6, h - 3); ctx.clip();
    let fill = 0;
    for (let i = 0; i < levels.length; i++) {
      const L = levels[i]; if (L.amount <= 0) continue;
      const hh = seg * L.amount, yb = y + h - 3 - fill - hh;
      const col = LIQ[L.color];
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, shade(col, -0.25)); g.addColorStop(0.35, shade(col, 0.15)); g.addColorStop(0.7, col); g.addColorStop(1, shade(col, -0.35));
      ctx.fillStyle = g; ctx.fillRect(x, yb, w, hh + 1);
      // meniscus on the top layer
      if (i === levels.length - 1 || levels.slice(i + 1).every(l => l.amount <= 0)) {
        ctx.fillStyle = shade(col, 0.35);
        ctx.beginPath(); ctx.ellipse(x + w / 2, yb + 1, w / 2 - 3, 3 + Math.sin(wave * 3 + x) * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      }
      // a few bubbles
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      for (let b = 0; b < 2; b++) { const by = yb + hh - ((wave * 14 + b * 23 + x) % Math.max(4, hh)); ctx.beginPath(); ctx.arc(x + w * (0.3 + b * 0.35), by, 1.6, 0, Math.PI * 2); ctx.fill(); }
      fill += hh;
    }
    ctx.restore();
    // glass front: rim, outline, highlights
    tubePath(x, y, w, h);
    ctx.lineWidth = 2.5; ctx.strokeStyle = opts.done ? 'rgba(255,230,140,.95)' : 'rgba(220,235,255,.75)'; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x + w * 0.16, y + 10, w * 0.1, h - w * 0.8);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x + w * 0.72, y + 16, w * 0.06, h - w);
    ctx.fillStyle = 'rgba(220,235,255,.85)'; ctx.beginPath(); ctx.ellipse(x + w / 2, y, w / 2 + 3, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(28,42,68,.9)'; ctx.beginPath(); ctx.ellipse(x + w / 2, y, w / 2 - 1, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    if (opts.done) { ctx.fillStyle = '#ffe68c'; ctx.font = 'bold ' + Math.round(w * 0.4) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('✓', x + w / 2, y - 12); }
    ctx.restore();
  }
  const levelsOf = (tube) => tube.map(c => ({ color: c, amount: 1 }));

  function render() {
    const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#24365a'); bg.addColorStop(1, '#0f1a2e');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    // soft bokeh lights
    for (let i = 0; i < 12; i++) {
      const x = (i * 197.3) % W, y = (i * 113.7 + Math.sin(t * 0.3 + i) * 20) % H, r = 40 + (i % 4) * 25;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, LIQ[i % LIQ.length] + '22'); g.addColorStop(1, LIQ[i % LIQ.length] + '00');
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
    if (!pz) return;
    // wooden rack
    const rows = [...new Set(layout.map(L => L.y))];
    for (const ry of rows) { ctx.fillStyle = '#5a3a24'; ctx.fillRect(16, ry + th + 6, W - 32, 12); ctx.fillStyle = '#7a5434'; ctx.fillRect(16, ry + th + 6, W - 32, 4); }
    pz.tubes.forEach((tube, i) => {
      if (anim && (i === anim.from)) return;
      const L = layout[i]; let x = L.x, y = L.y;
      if (i === sel) y -= 22;
      if (L.shake) x += Math.sin(L.shake * 60) * 5;
      let lv = levelsOf(tube);
      if (anim && i === anim.to) {
        const k = Math.max(0, Math.min(1, (anim.t - 0.3) / 0.5));
        lv = levelsOf(tube.slice(0, tube.length - anim.n));
        for (let m = 0; m < anim.n; m++) lv.push({ color: anim.color, amount: Math.max(0, Math.min(1, k * anim.n - m)) });
      }
      drawTube(x, y, lv, { done: done.has(i) && !(anim && anim.to === i) });
    });
    if (anim) {
      // source tube flies over, tilts and pours
      const A = layout[anim.from], B = layout[anim.to];
      const p = anim.t / anim.dur;
      const move = Math.min(1, p / 0.3), back = Math.max(0, (p - 0.8) / 0.2);
      const side = B.x > A.x ? -1 : 1;
      const px = B.x + side * tw * 0.9, py = B.y - th * 0.55;
      const e = move * move * (3 - 2 * move);
      let x = A.x + (px - A.x) * e, y = A.y + (py - A.y) * e;
      if (back > 0) { x = px + (A.x - px) * back; y = py + (A.y - py) * back; }
      const tilt = (back > 0 ? 1 - back : e) * side * -1.15;
      const tube = pz.tubes[anim.from];
      const k = Math.max(0, Math.min(1, (anim.t - 0.3) / 0.5));
      const lv = levelsOf(tube); for (let m = 0; m < anim.n; m++) lv.push({ color: anim.color, amount: Math.max(0, Math.min(1, (1 - k) * anim.n - (anim.n - 1 - m))) });
      ctx.save(); ctx.translate(x + tw / 2, y); ctx.rotate(tilt); drawTube(-tw / 2, 0, lv); ctx.restore();
      if (k > 0 && k < 1) {
        // the stream from the lip into the target
        const lipX = x + tw / 2, lipY = y + 2;
        ctx.strokeStyle = LIQ[anim.color]; ctx.lineWidth = Math.max(3, tw * 0.12); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(lipX, lipY); ctx.quadraticCurveTo(lipX - side * 6, lipY + 20, B.x + tw / 2, B.y + th - 20 - (pz.tubes[anim.to].length - anim.n + k * anim.n) * (th - 10) / CAP); ctx.stroke();
      }
    }
    for (const s of splash) { ctx.globalAlpha = Math.max(0, s.life); ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(s.x, s.y, 3.5, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
  }

  // menu logo: three tubes drawn with the same routine
  (function logo() {
    const main = ctx; ctx = $('logo').getContext('2d'); tw = 54; th = 200;
    [[[0, 4, 0, 4]], [[2, 6, 2]], [[3, 3, 5, 3]]].forEach(([tube], i) => drawTube(70 + i * 120, 70, levelsOf(tube)));
    ctx = main;
  })();

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
    return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
