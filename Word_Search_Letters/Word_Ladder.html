<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3a7ac8">
<title>Word Ladder</title>
<style>
  :root { --f: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif; --ink: #3a2a1a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #6ab4ec; color: #fff; font-family: var(--f); font-weight: 800;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; font-weight: 900; cursor: pointer; border: none; color: inherit; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }

  #coinsTop { position: fixed; z-index: 35; top: max(12px, env(safe-area-inset-top)); right: 12px; height: 38px; min-width: 96px; padding: 0 14px 0 6px;
    display: flex; align-items: center; gap: 7px; border-radius: 20px; font-size: 19px; color: #fff;
    background: linear-gradient(180deg, rgba(30,50,100,.72), rgba(14,24,60,.8)); border: 2px solid rgba(255,230,160,.6);
    box-shadow: 0 3px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25); text-shadow: 0 2px 2px rgba(0,0,0,.5); transition: transform .12s; }
  #coinsTop.bump { transform: scale(1.14); }
  .coin { display: inline-block; width: 26px; height: 26px; border-radius: 50%; flex: none; position: relative;
    background: radial-gradient(circle at 38% 32%, #fff7c4 0 12%, #ffd84a 34%, #f0a316 72%, #b86e08 100%); box-shadow: inset 0 -2px 0 rgba(120,60,0,.55), 0 1px 2px rgba(0,0,0,.4); }
  .coin::after { content: "\2605"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #c87a0a; text-shadow: 0 1px 0 #fff3b0; }
  .flycoin { position: fixed; z-index: 60; width: 24px; height: 24px; pointer-events: none; transition: transform .75s cubic-bezier(.5,-0.3,.6,1), opacity .2s .65s; }

  .btn { position: relative; border: 3px solid #fff4c8; padding: 12px 54px 14px; border-radius: 40px; font-size: 28px; letter-spacing: 4px; color: #fff;
    background: linear-gradient(180deg, #ffe07a 0%, #ffab35 48%, #f37a1c 100%); text-shadow: 0 2px 0 #b2500c, 0 0 8px rgba(160,60,0,.4);
    box-shadow: 0 7px 0 #a9480e, 0 12px 24px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6); animation: pulse 1.8s ease-in-out infinite; white-space: nowrap; }
  .btn small { display: block; font-size: 13px; letter-spacing: 3px; margin-top: 2px; color: #fff8e0; text-shadow: 0 1px 0 #b2500c; }
  .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #a9480e, inset 0 2px 0 rgba(255,255,255,.6); }
  .btn.green { background: linear-gradient(180deg, #b6f27a 0%, #5fd04a 48%, #2fa63a 100%); text-shadow: 0 2px 0 #1d6a24; box-shadow: 0 7px 0 #1f7a2c, 0 12px 24px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); border-color: #eaffd0; }
  .btn.green small { text-shadow: 0 1px 0 #1d6a24; }
  .btn.green:active { box-shadow: 0 2px 0 #1f7a2c; }
  .btn.blue { background: linear-gradient(180deg, #9ae0ff 0%, #4aa8f0 50%, #2a6ad0 100%); text-shadow: 0 2px 0 #1a3a8a; box-shadow: 0 7px 0 #1a3a8a, 0 12px 24px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); border-color: #e0f4ff; }
  @keyframes pulse { 50% { filter: brightness(1.08); transform: scale(1.03); } }
  .btn2 { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; border-radius: 22px; font-size: 15px; letter-spacing: 2px; color: #fff;
    background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,.1)); border: 2px solid rgba(255,255,255,.6);
    box-shadow: 0 4px 0 rgba(0,0,0,.25), 0 6px 16px rgba(0,0,0,.2); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); text-shadow: 0 1px 2px rgba(0,0,0,.5); position: relative; }
  .btn2:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .btn2 svg { width: 18px; height: 18px; }
  .badge { position: absolute; top: -7px; right: -7px; min-width: 22px; height: 22px; border-radius: 11px; background: #ff4a5a; color: #fff; font-size: 12px; line-height: 22px; padding: 0 5px; box-shadow: 0 2px 4px rgba(0,0,0,.4); letter-spacing: 0; }
  .badge:empty { display: none; }
  .link { background: none; color: #8a7a98; font-size: 14px; letter-spacing: 3px; padding: 6px 14px; }

  #menu { justify-content: space-between; background: linear-gradient(180deg, rgba(10,24,60,.5) 0%, rgba(10,24,60,0) 26%, rgba(10,24,60,0) 60%, rgba(8,16,40,.66) 100%); }
  .mtop, .mbot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .mtop { padding-top: 40px; } .mbot { padding-bottom: 46px; }
  .tag { font-size: 12px; letter-spacing: 6px; color: #fff3dc; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
  .tiles { display: flex; gap: 6px; }
  .tiles b { width: 48px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 33px; font-weight: 900; color: #4a2a10; border-radius: 11px;
    background: linear-gradient(180deg, #fff3d6, #f0c88a 55%, #d89a52); box-shadow: inset 0 -4px 0 #b07436, inset 0 2px 0 #fff, 0 5px 0 #6a3e14, 0 8px 14px rgba(0,0,0,.4); animation: bob 2.6s ease-in-out infinite; }
  .tiles b:nth-child(2) { animation-delay: .12s; } .tiles b:nth-child(3) { animation-delay: .24s; } .tiles b:nth-child(4) { animation-delay: .36s; }
  .tiles b.g { background: linear-gradient(180deg, #fff6c8, #ffd04a 55%, #f0921a); box-shadow: inset 0 -4px 0 #c86a0a, inset 0 2px 0 #fff, 0 5px 0 #8a4a06, 0 8px 14px rgba(0,0,0,.4); color: #5a2a00; }
  @keyframes bob { 0%, 70%, 100% { transform: translateY(0); } 35% { transform: translateY(-7px); } }
  .title { font-size: clamp(56px, 16vw, 96px); line-height: .95; font-weight: 900; letter-spacing: 7px; margin-top: 6px;
    background: linear-gradient(180deg, #ffffff 0%, #fff0a8 32%, #ffb84a 64%, #e8641c 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #7a3410) drop-shadow(0 0 18px rgba(255,190,90,.55)); }
  .chap { font-size: 14px; letter-spacing: 3px; color: #fff4d0; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
  .dots { display: flex; gap: 6px; } .dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.28); box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
  .dots i.on { background: radial-gradient(circle at 35% 30%, #fff8c0, #ffc83a 60%, #d8840a); box-shadow: 0 0 8px rgba(255,200,80,.8); }
  .dots i.cur { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .stats { font-size: 12px; letter-spacing: 1px; color: #f4f6ff; text-shadow: 0 1px 3px #000; opacity: .92; }
  .stats b { color: #ffd86a; }

  .dim { background: radial-gradient(ellipse at 50% 40%, rgba(20,34,80,.55), rgba(6,10,30,.88)); }
  .card { position: relative; width: min(92vw, 390px); padding: 26px 20px 14px; border-radius: 28px; color: var(--ink);
    background: linear-gradient(180deg, #fffdf6 0%, #fbf1dc 60%, #f3e2bf 100%); border: 3px solid #fff;
    box-shadow: 0 10px 0 #c8a46a, 0 24px 50px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .ribbon { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); padding: 8px 34px; font-size: 19px; letter-spacing: 3px; white-space: nowrap; color: #fff;
    background: linear-gradient(180deg, #6ac0ff, #2a7ad8); border-radius: 10px; box-shadow: 0 4px 0 #14468a, 0 8px 16px rgba(0,0,0,.3); text-shadow: 0 2px 0 #14468a; }
  .ribbon.red { background: linear-gradient(180deg, #ff8a7a, #e0443a); box-shadow: 0 4px 0 #8a1a14, 0 8px 16px rgba(0,0,0,.3); text-shadow: 0 2px 0 #8a1a14; }
  .wt { font-size: clamp(26px, 8vw, 36px); white-space: nowrap; letter-spacing: 2px; font-weight: 900; background: linear-gradient(180deg, #ffbe3a, #f06a1a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 #fff) drop-shadow(0 3px 0 rgba(160,60,0,.4)); }
  .stars { display: flex; gap: 6px; align-items: flex-end; height: 70px; }
  .stars i { width: 60px; height: 60px; display: block; transform: scale(0); background: no-repeat center/contain; }
  .stars i:nth-child(2) { width: 72px; height: 72px; }
  .stars i.on { animation: starIn .5s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  .stars i.off { animation: starIn .4s ease-out forwards; filter: grayscale(1) brightness(.85) opacity(.35); }
  @keyframes starIn { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
  .newbest { font-size: 14px; letter-spacing: 3px; color: #fff; background: linear-gradient(90deg, #ff6a8a, #ff9a3a); padding: 5px 14px; border-radius: 8px; transform: rotate(-2deg); box-shadow: 0 3px 0 #a83a3a; }
  .pathc { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 3px; max-width: 100%; }
  .pathc span { font-size: 13px; letter-spacing: 1px; padding: 4px 7px; border-radius: 7px; background: linear-gradient(180deg, #fff, #f1dcb0); color: #5a3410; box-shadow: 0 2px 0 #c8a06a; }
  .pathc span.s { background: linear-gradient(180deg, #e2f4ff, #9ad0f8); color: #0e3a6a; box-shadow: 0 2px 0 #4a8ac8; }
  .pathc span.g { background: linear-gradient(180deg, #fff3c4, #ffc84a); color: #5a2a00; box-shadow: 0 2px 0 #c8800a; }
  .pathc span.w { background: linear-gradient(180deg, #f3e6ff, #c9a2ff); color: #2a0e5a; box-shadow: 0 2px 0 #7a4ad8; }
  .pathc em { font-style: normal; color: #b89a6a; font-size: 11px; }
  .wrows { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 14px; }
  .wrows div { display: flex; justify-content: space-between; padding: 6px 11px; border-radius: 11px; background: rgba(160,110,40,.1); color: #7a5a3a; }
  .wrows b { color: #3a2a1a; }
  .wcoins { display: flex; align-items: center; gap: 8px; font-size: 30px; color: #e8901a; font-weight: 900; text-shadow: 0 2px 0 #fff3c8; }
  .pbtns { display: flex; flex-direction: column; gap: 14px; align-items: center; margin-top: 4px; }
  .pbtns .btn { min-width: 230px; font-size: 21px; padding: 10px 30px 12px; animation: none; }
  .ptxt { font-size: 15px; color: #7a5a3a; max-width: 300px; }
  .ptitle { font-size: 30px; letter-spacing: 3px; color: #fff; text-shadow: 0 3px 0 #1a4a8a, 0 0 14px rgba(90,160,255,.4); }

  .sheet { justify-content: flex-start; background: radial-gradient(ellipse at 50% 0%, #3a6ac8, #1a2e6a 55%, #0c1434); }
  .phead { width: min(94vw, 760px); display: flex; align-items: center; gap: 14px; min-height: 44px; padding-right: 110px; }
  .x { width: 44px; height: 44px; border-radius: 50%; font-size: 20px; color: #fff; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.4); flex: none; }
  .scroll { width: min(94vw, 760px); flex: 1; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 8px 4px 70px; }
  .tabs { display: flex; gap: 8px; margin: 2px 0; }
  .tabs button { padding: 9px 22px; border-radius: 18px; font-size: 14px; letter-spacing: 2px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.3); }
  .tabs button.on { background: linear-gradient(180deg, #ffe07a, #f39a2a); color: #5a2a00; border-color: #fff4c8; }
  .shopGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .sc { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 8px 12px; border-radius: 18px; background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.05)); border: 2px solid rgba(255,255,255,.22); }
  .sc.eq { border-color: #7aff9a; box-shadow: 0 0 0 3px rgba(122,255,154,.25); }
  .sc canvas { width: 100%; max-width: 170px; aspect-ratio: 1/1; }
  .sc .sn { font-size: 13px; letter-spacing: 2px; }
  .sc .sd { font-size: 11px; color: #c8d8ff; font-weight: 700; min-height: 14px; }
  .sc button { min-width: 116px; padding: 7px 12px; border-radius: 14px; font-size: 13px; letter-spacing: 1px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    background: linear-gradient(180deg, #ffe07a, #f39a2a); color: #5a2a00; box-shadow: 0 3px 0 #a9480e; }
  .sc button.own { background: linear-gradient(180deg, #8ae8ff, #3a9ae8); color: #fff; box-shadow: 0 3px 0 #1a5a9a; }
  .sc button.on { background: #2aa84a; color: #fff; box-shadow: 0 3px 0 #146a2a; }
  .sc button.poor { filter: grayscale(.7); opacity: .7; }
  .sc button .coin { width: 16px; height: 16px; } .sc button .coin::after { font-size: 9px; }
  .qlist { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 560px; margin: 0 auto; }
  .q { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 14px 16px; border-radius: 18px; text-align: left;
    background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06)); border: 2px solid rgba(255,255,255,.25); }
  .q .qt { font-size: 16px; } .q .qr { display: flex; align-items: center; gap: 5px; color: #ffd86a; font-size: 16px; }
  .q .bar { grid-column: 1 / 3; height: 12px; border-radius: 7px; background: rgba(0,0,0,.3); overflow: hidden; }
  .q .bar i { display: block; height: 100%; border-radius: 7px; background: linear-gradient(90deg, #7affb0, #2ad08a); }
  .q .qp { grid-column: 1 / 3; font-size: 12px; color: #c8d8ff; }
  .qstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 18px; }
  .qstats div { padding: 10px; border-radius: 14px; background: rgba(0,0,0,.22); font-size: 12px; letter-spacing: 1px; color: #c8d8ff; }
  .qstats b { display: block; font-size: 24px; color: #fff; }
  .qh { font-size: 13px; letter-spacing: 4px; color: #c8d8ff; margin: 6px 0; text-align: left; }

  @media (orientation: landscape) and (min-aspect-ratio: 21/20) {
    #menu { align-items: flex-start; padding-left: max(28px, env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(10,20,50,.66) 0%, rgba(10,20,50,.35) 38%, rgba(10,20,50,0) 52%); }
    .mtop, .mbot { width: 44%; } .mtop { padding-top: 6px; } .mbot { padding-bottom: 0; }
  }
  @media (max-height: 700px) and (min-height: 521px) {
    .tiles b { width: 42px; height: 46px; font-size: 28px; } .title { font-size: 62px; } .btn { padding: 10px 46px 12px; font-size: 24px; }
    .stars { height: 58px; } .stars i { width: 50px; height: 50px; } .stars i:nth-child(2) { width: 60px; height: 60px; } .card { gap: 6px; padding: 22px 18px 10px; } .wt { font-size: 30px; }
    .mtop { padding-top: 24px; } .mbot { padding-bottom: 36px; } .tag { display: none; }
  }
  @media (max-width: 400px) { .row { gap: 7px; } .btn2 { padding: 8px 12px; font-size: 13px; letter-spacing: 1px; gap: 5px; } }
  @media (max-height: 520px) {
    .overlay { gap: 6px; } .mtop, .mbot { gap: 6px; } .mtop { padding-top: 0; } .mbot { padding-bottom: 0; }
    .tiles b { width: 34px; height: 36px; font-size: 22px; border-radius: 8px; } .title { font-size: 42px; letter-spacing: 4px; margin-top: 2px; } .tag { font-size: 10px; letter-spacing: 4px; }
    .btn { padding: 7px 36px 8px; font-size: 21px; } .btn small { font-size: 11px; } .btn2 { padding: 7px 14px; font-size: 13px; }
    .card { width: min(94vw, 640px); padding: 18px 16px 8px; gap: 5px; display: grid; grid-template-columns: 1fr 1fr; align-items: center; justify-items: center; }
    .card > .wt, .card > .stars, .card > .newbest, .card > .ptxt { grid-column: 1; } .card > .pathc, .card > .wrows, .card > .wcoins { grid-column: 2; }
    .card > .btn, .card > .link, .card > .pbtns { grid-column: 1 / 3; }
    .stars { height: 44px; } .stars i { width: 38px; height: 38px; } .stars i:nth-child(2) { width: 46px; height: 46px; } .wt { font-size: 24px; } .wcoins { font-size: 22px; }
    .wrows { font-size: 12px; } .wrows div { padding: 3px 9px; } .pathc span { font-size: 11px; padding: 2px 5px; }
    .pbtns { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 10px; } .pbtns .btn { min-width: 0; font-size: 16px; padding: 7px 20px 8px; }
    .ptitle { font-size: 22px; } .phead { min-height: 36px; } .x { width: 36px; height: 36px; font-size: 16px; }
    .sc canvas { max-width: 110px; } .scroll { padding-bottom: 50px; }
    .q { padding: 8px 12px; } .qstats { margin-top: 8px; } .qstats b { font-size: 18px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="coinsTop"><span class="coin"></span><span id="coinsVal">0</span></div>

<div class="overlay" id="menu">
  <div class="mtop">
    <div class="tag">LEWIS CARROLL'S DOUBLETS</div>
    <div class="tiles"><b>W</b><b>O</b><b>R</b><b class="g">D</b></div>
    <div class="title">LADDER</div>
    <div class="chap" id="chapName">CHAPTER 1 · SUNNY MEADOW</div>
    <div class="dots" id="chapDots"></div>
  </div>
  <div class="mbot">
    <button class="btn" id="startBtn">PLAY<small id="startLv">LEVEL 1</small></button>
    <div class="row">
      <button class="btn2" id="shopBtn"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.4 11.2a2 2 0 0 1-2 1.8H8.4a2 2 0 0 1-2-1.8z" fill="#ffd86a" stroke="#fff" stroke-width="1.6"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="#fff" stroke-width="2"/></svg>SHOP</button>
      <button class="btn2" id="questBtn"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17l-6 3.3 1.3-6.7-5-4.6 6.8-.8z" fill="#ffd86a" stroke="#fff" stroke-width="1.4"/></svg>QUESTS<span class="badge" id="questBadge"></span></button>
    </div>
    <div class="stats" id="menuStats"></div>
  </div>
</div>

<div class="overlay sheet hidden" id="shop">
  <div class="phead"><button class="x" id="shopX">&#10005;</button><div class="ptitle">SHOP</div></div>
  <div class="tabs"><button id="tabC" class="on">CLIMBERS</button><button id="tabL">LADDERS</button></div>
  <div class="scroll"><div class="shopGrid" id="shopGrid"></div></div>
</div>

<div class="overlay sheet hidden" id="quests">
  <div class="phead"><button class="x" id="questX">&#10005;</button><div class="ptitle">QUESTS</div></div>
  <div class="scroll"><div class="qlist"><div class="qh">MINI CHALLENGES</div><div id="qlist" class="qlist"></div><div class="qh">YOUR CLIMBS</div><div class="qstats" id="qstats"></div></div></div>
</div>

<div class="overlay dim hidden" id="win">
  <div class="card">
    <div class="ribbon" id="winRibbon">LEVEL 1</div>
    <div class="wt" id="winTitle">SUMMIT!</div>
    <div class="stars" id="winStars"><i></i><i></i><i></i></div>
    <div class="newbest" id="newBest">NEW BEST!</div>
    <div class="pathc" id="winPath"></div>
    <div class="wrows" id="winRows"></div>
    <div class="wcoins"><span class="coin"></span><span id="winCoins">+0</span></div>
    <button class="btn green" id="nextBtn">NEXT<small id="nextLv">LEVEL 2</small></button>
    <button class="link" id="winMenu">MENU</button>
  </div>
</div>

<div class="overlay dim hidden" id="fail">
  <div class="card">
    <div class="ribbon red">OUT OF TIME</div>
    <div class="wt">SO CLOSE!</div>
    <div class="ptxt" id="failTxt">The clock ran out before you reached the top.</div>
    <div class="pbtns">
      <button class="btn blue" id="moreTime">+25s<small id="moreCost">30 COINS</small></button>
      <button class="btn green" id="retryBtn">RETRY</button>
    </div>
    <button class="link" id="failMenu">MENU</button>
  </div>
</div>

<div class="overlay dim hidden" id="pause">
  <div class="card">
    <div class="ribbon">PAUSED</div>
    <div class="ptxt" id="pauseTxt"></div>
    <div class="pbtns">
      <button class="btn green" id="resumeBtn">RESUME</button>
      <button class="btn blue" id="restartBtn">RESTART</button>
    </div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }
        else if (p.shape === 'heart') { ctx.rotate(p.rot * .2); heart(ctx, p.size); }
        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * (.4 + k * .6), 0, TAU); ctx.fill(); }
        ctx.restore(); ctx.shadowBlur = 0;
      }
      for (const t of texts) {
        const age = t.max - t.life, pop = age < .18 ? 1 + Math.sin(age / .18 * Math.PI) * .45 : 1, a = Math.min(1, t.life / t.max * 2.2);
        ctx.save(); ctx.globalAlpha = a; ctx.translate(t.x, t.y); ctx.scale(pop, pop); if (t.wobble) ctx.rotate(Math.sin(age * 20) * t.wobble);
        ctx.font = t.font + t.size + 'px "Avenir Next", "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, t.size * .16); ctx.strokeStyle = t.stroke; ctx.strokeText(t.str, 0, 0); ctx.fillStyle = t.c; ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },
    drawFlash(ctx, W, H) { if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  };
})();
/*FX-END*/

    equip: (c, l) => { if (c != null) SAVE.climber = c; if (l != null) SAVE.ladder = l; saveNow(); },
    state: () => ({ n: G.n, state: G.state, chain: G.chain.slice(), par: G.P.par, goal: G.P.goal, start: G.P.start, special: G.P.special, way: G.P.way, lock: G.P.lock, ban: G.P.ban, sel: G.sel, coins: SAVE.coins, paused, attract: G.attract, level: SAVE.level, timeLeft: G.timeLeft, free: SAVE.free }),
    layout: () => LY, timeLeft: v => { if (v != null) G.timeLeft = v; return G.timeLeft; }, tryMove: (s, ch) => tryMove(s, ch, 'test'),
    bench: n => { const t = { world: 0, vig: 0, fx: 0, ui: 0 }; for (let i = 0; i < n; i++) { let a = performance.now(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawWorld(); let b2 = performance.now(); t.world += b2 - a; ctx.drawImage(VIG, 0, 0, W, H); a = performance.now(); t.vig += a - b2; FX.draw(ctx); b2 = performance.now(); t.fx += b2 - a; if (!G.attract) drawUI(); a = performance.now(); t.ui += a - b2; } ctx.getImageData(0, 0, 1, 1); for (const k in t) t[k] = +(t[k] / n).toFixed(2); return t; },
    skipIntro: () => { if (G.state === 'intro') { G.state = 'play'; G.introT = 2.3; } }
  };

  // ---------- boot ----------
  let last = performance.now(), fpsN = 0, fpsT = 0, FPS = 60;
  ensureQuests(); showCoins(true);
  resize();
  loadArt().then(() => { newGame(true, demoLevel()); updateMenu(); });
  (function loop(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    fpsN++; fpsT += dt; if (fpsT >= 1) { FPS = fpsN / fpsT; fpsN = 0; fpsT = 0; }
    if (!paused && ready && G) update(dt);
    render(); coinsTick();
    requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
