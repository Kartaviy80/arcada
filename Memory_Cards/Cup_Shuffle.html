<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c0c26">
<title>Cup Shuffle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --gold: #ffd66a; --cream: #fff3d6; --plum: #1c0c26; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1c0c26; color: #fff;
    font-family: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif; font-weight: 800;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; font-weight: 900; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay.hidden * { pointer-events: none !important; }
  /* ---------- menu ---------- */
  #menu { justify-content: space-between; padding: max(22px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(16,6,24,.86) 0%, rgba(16,6,24,.42) 24%, rgba(16,6,24,0) 36%, rgba(16,6,24,0) 60%, rgba(16,6,24,.6) 75%, rgba(16,6,24,.94) 100%); }
  .mtop, .mbot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tag { font-size: 11px; letter-spacing: 4px; white-space: nowrap; color: #ffe6b8; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
  .title { font-size: clamp(54px, 16vw, 108px); font-weight: 900; line-height: .84; letter-spacing: 2px; font-style: italic;
    background: linear-gradient(180deg, #fffbe8 0%, #ffe48e 32%, #f2a830 62%, #a8560e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #4a1630) drop-shadow(0 0 24px rgba(255,190,90,.45)); padding: 0 10px; }
  .title span { display: block; font-size: .74em; letter-spacing: .04em;
    background: linear-gradient(180deg, #ffe0f0 0%, #ff7aa6 40%, #d8205a 72%, #6a0a2a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .btn { border: 3px solid #fff1c4; padding: 13px 44px; border-radius: 40px; font-size: 23px; letter-spacing: 3px; color: #4a1630; cursor: pointer;
    background: linear-gradient(180deg, #fff6c0, #ffc844 50%, #e8901c); box-shadow: 0 6px 0 #7a3a0c, 0 0 28px rgba(255,200,80,.5); animation: pulse 1.6s ease-in-out infinite; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7a3a0c; }
  .btn small { display: block; font-size: 12px; letter-spacing: 2px; opacity: .8; margin-top: 1px; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #7a3a0c, 0 0 46px rgba(255,220,90,.85); } }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .sbtn { border: 2px solid rgba(255,214,130,.75); background: linear-gradient(180deg, rgba(70,26,86,.9), rgba(36,12,48,.9)); color: #ffe8b0; font-size: 14px; letter-spacing: 2px;
    padding: 10px 18px; border-radius: 22px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.45); }
  .sbtn:active { transform: translateY(2px); }
  .stat { max-width: min(520px, calc(100vw - 110px)); font-size: 13px; color: #f6ead8; text-shadow: 0 1px 3px #000; letter-spacing: .5px; } .stat b { color: var(--gold); }
  .coins { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 14px; z-index: 11; font-size: 18px; font-weight: 900; color: #ffe08a; text-shadow: 0 2px 3px #000; display: flex; align-items: center; gap: 6px; }
  .coin { display: inline-block; width: 20px; height: 20px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #fff8c0, #ffc838 45%, #b8720c); box-shadow: inset 0 0 0 2px #e8a020, 0 1px 2px rgba(0,0,0,.5); }
  /* ---------- hud ---------- */
  #hud { position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none; }
  #hud.hidden, #boosters.hidden { display: none; }
  .grp { position: absolute; top: max(10px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 8px; }
  #lgrp { left: 12px; align-items: flex-start; } #rgrp { right: 12px; align-items: flex-end; }
  .chip { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 13px; border-radius: 20px; pointer-events: auto; white-space: nowrap;
    background: linear-gradient(180deg, rgba(44,16,58,.86), rgba(20,6,28,.86)); border: 2px solid rgba(255,214,130,.55); box-shadow: 0 4px 12px rgba(0,0,0,.35);
    color: var(--cream); font-size: 17px; font-weight: 900; }
  #pauseBtn { width: 42px; padding: 0; justify-content: center; cursor: pointer; }
  #pauseBtn i { display: block; width: 5px; height: 15px; background: var(--cream); border-radius: 2px; margin: 0 2px; }
  #lvl { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); flex-direction: column; height: auto; padding: 5px 18px 6px; gap: 0; line-height: 1.1; }
  #lvl b { font-size: 19px; letter-spacing: 2px; color: var(--gold); } #lvl span { font-size: 10.5px; letter-spacing: 1.5px; color: #f0dcc0; text-transform: uppercase; }
  #hearts { height: 34px; padding: 0 10px; font-size: 20px; gap: 3px; }
  #hearts i { font-style: normal; color: #ff3a5a; text-shadow: 0 0 8px rgba(255,60,90,.6); transition: transform .3s; } #hearts i.off { color: rgba(255,255,255,.16); text-shadow: none; transform: scale(.8); }
  #streak { height: 34px; padding: 0 11px; font-size: 14px; letter-spacing: 1px; }
  #streak.hot { border-color: #ff9a3a; color: #ffd08a; box-shadow: 0 0 16px rgba(255,140,40,.55); }
  #coinBox.bump { animation: bump .25s; } @keyframes bump { 50% { transform: scale(1.14); } }
  #bossBar { position: absolute; left: 50%; transform: translateX(-50%); top: calc(max(8px, env(safe-area-inset-top)) + 96px); height: 32px; font-size: 12px; letter-spacing: 1px; color: #ffd6e4; border-color: rgba(255,120,160,.75); padding: 0 12px; }
  #bossBar.hidden { display: none; }
  .pip { width: 16px; height: 13px; display: inline-block; background: linear-gradient(180deg, #4a2a5a, #2a1236); border-radius: 2px 2px 3px 3px; position: relative; margin-left: 2px; box-shadow: inset 0 -3px 0 #c8285a; }
  .pip::after { content: ''; position: absolute; left: -4px; right: -4px; bottom: -2px; height: 3px; background: #2a1236; border-radius: 2px; }
  .pip.off { opacity: .22; box-shadow: none; }
  #boosters { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: max(26px, calc(env(safe-area-inset-bottom) + 18px)); display: flex; gap: 22px; }
  .boost { width: 66px; height: 66px; border-radius: 50%; border: 3px solid #ffe6a8; position: relative; cursor: pointer; color: #fff;
    background: radial-gradient(circle at 35% 30%, #9a6ae8, #3a1a6a 72%); box-shadow: 0 5px 0 #1e0a3a, 0 0 18px rgba(160,120,255,.45); transition: filter .2s, transform .15s; }
  .boost#xrayBtn { background: radial-gradient(circle at 35% 30%, #5ad8e8, #0a4a6a 72%); box-shadow: 0 5px 0 #062236, 0 0 18px rgba(90,220,255,.45); }
  .boost svg { width: 34px; height: 34px; display: block; margin: auto; pointer-events: none; }
  .boost em { position: absolute; right: -6px; top: -6px; min-width: 25px; height: 25px; padding: 0 5px; border-radius: 13px; background: #e8285a; border: 2px solid #fff; font-style: normal; font-size: 13px; line-height: 21px; color: #fff; }
  .boost em.buy { background: #6a4a10; font-size: 11px; }
  .boost small { position: absolute; bottom: -19px; left: 50%; transform: translateX(-50%); font-size: 10.5px; letter-spacing: 1.5px; white-space: nowrap; color: #ffe6a8; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
  .boost.off { filter: grayscale(.85) brightness(.6); }
  .boost.ready { animation: ready 1.1s ease-in-out infinite; }
  .boost:active { transform: translateY(3px); }
  @keyframes ready { 50% { box-shadow: 0 5px 0 #1e0a3a, 0 0 34px rgba(255,240,160,.95); } }
  /* ---------- panels ---------- */
  .dim { background: radial-gradient(ellipse at 50% 45%, rgba(40,14,52,.72), rgba(10,4,16,.93)); }
  .panel { position: relative; width: 100%; max-width: 520px; max-height: 100%; overflow: auto; padding: 18px 16px 18px; border-radius: 24px;
    background: linear-gradient(180deg, rgba(60,22,76,.97), rgba(26,10,36,.98)); border: 2px solid rgba(255,210,120,.6);
    box-shadow: 0 22px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.16); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .panel h2 { font-size: clamp(30px, 8vw, 44px); letter-spacing: 2px; line-height: 1; font-style: italic; color: var(--gold); text-shadow: 0 4px 0 #4a1630, 0 0 24px rgba(255,190,90,.5); }
  .panel h3 { font-size: 13px; letter-spacing: 4px; color: #ffbfd6; }
  .x { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,214,130,.6); background: rgba(0,0,0,.3); color: var(--cream); font-size: 18px; cursor: pointer; }
  .stars { display: flex; gap: 6px; align-items: flex-end; height: 70px; }
  .stars i { font-style: normal; font-size: 54px; line-height: 1; color: rgba(255,255,255,.14); text-shadow: 0 3px 0 rgba(0,0,0,.4); }
  .stars i:nth-child(2) { font-size: 66px; }
  .stars i.on { color: #ffd84a; text-shadow: 0 3px 0 #9a5a08, 0 0 22px rgba(255,190,40,.9); animation: starpop .55s cubic-bezier(.3,1.9,.5,1) both; }
  @keyframes starpop { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: scale(1) rotate(0); } }
  .lines { width: 100%; max-width: 330px; display: flex; flex-direction: column; gap: 5px; font-size: 15px; color: #f2e2cc; }
  .lines div { display: flex; justify-content: space-between; padding: 4px 10px; border-radius: 10px; background: rgba(0,0,0,.22); }
  .lines div b { color: var(--gold); } .lines div.tot { background: rgba(255,200,80,.16); font-size: 18px; }
  .badge { font-size: 15px; font-weight: 900; letter-spacing: 4px; color: #3a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,220,80,.8); }
  .goals { width: 100%; max-width: 330px; display: flex; flex-direction: column; gap: 5px; font-size: 13px; text-align: left; }
  .goals div { display: flex; justify-content: space-between; gap: 10px; padding: 5px 10px; border-radius: 10px; background: rgba(0,0,0,.25); color: #e8dccc; }
  .goals div.done { color: #9affb0; background: rgba(40,140,70,.25); } .goals b { color: var(--gold); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .tab { border: 2px solid rgba(255,214,130,.45); background: rgba(0,0,0,.25); color: #ffe8b0; padding: 7px 13px; border-radius: 16px; font-size: 13px; letter-spacing: 1.5px; cursor: pointer; }
  .tab.on { background: linear-gradient(180deg, #ffe48e, #e8a030); color: #4a1630; border-color: #fff1c4; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 9px; width: 100%; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px 8px; border-radius: 16px; background: rgba(0,0,0,.28); border: 2px solid transparent; cursor: pointer; }
  .item.eq { border-color: #ffd66a; background: rgba(255,200,80,.14); box-shadow: 0 0 14px rgba(255,200,80,.3); }
  .item canvas { width: 86px; height: 72px; }
  .item .nm { font-size: 11.5px; letter-spacing: .5px; color: #fff1dc; }
  .item .pr { font-size: 11.5px; color: var(--gold); display: flex; align-items: center; gap: 4px; } .item .pr .coin { width: 13px; height: 13px; }
  .item.lock { opacity: .62; } .item.shake { animation: shake .35s; } @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .chlist { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .ch { display: flex; align-items: center; gap: 12px; padding: 7px; border-radius: 16px; background: rgba(0,0,0,.28); text-align: left; border: 2px solid transparent; }
  .ch.cur { border-color: #ffd66a; box-shadow: 0 0 16px rgba(255,200,80,.3); } .ch.lock { opacity: .5; filter: grayscale(.6); }
  .ch canvas { width: 112px; height: 64px; border-radius: 10px; flex: none; }
  .ch .t { font-size: 16px; color: var(--cream); } .ch .s { font-size: 11.5px; color: #e0c8b8; letter-spacing: .5px; margin-top: 2px; } .ch .st { font-size: 11.5px; color: var(--gold); margin-top: 3px; letter-spacing: 1px; }
  #pause h2 { font-size: 40px; }
  .resRow { flex-direction: column; align-items: center; }
  #toast { position: fixed; z-index: 30; left: 50%; bottom: max(118px, calc(env(safe-area-inset-bottom) + 110px)); transform: translate(-50%, -20px); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
    background: linear-gradient(180deg, rgba(70,26,86,.96), rgba(36,12,48,.96)); border: 2px solid #ffd66a; border-radius: 18px; padding: 10px 18px; font-size: 15px; color: var(--cream); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.5); white-space: nowrap; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); } #toast b { color: var(--gold); }
  @media (min-aspect-ratio: 1/1) {
    .grp { flex-direction: row; } #rgrp { flex-direction: row-reverse; } #hearts, #streak { height: 40px; }
    #bossBar { top: calc(max(8px, env(safe-area-inset-top)) + 56px); }
  }
  @media (max-height: 700px) and (min-height: 521px) { .title { font-size: 64px; } .mtop, .mbot { gap: 8px; } }
  @media (max-height: 520px) {
    #menu { padding: 10px 16px; } .mtop, .mbot { gap: 6px; } .title { font-size: 40px; } .title span { display: inline; margin-left: 12px; } .tag { font-size: 10px; letter-spacing: 4px; }
    .btn { padding: 8px 34px; font-size: 19px; } .sbtn { padding: 7px 14px; font-size: 12px; } .stat { font-size: 11px; }
    #boosters { left: max(12px, env(safe-area-inset-left)); top: 50%; bottom: auto; transform: translateY(-50%); flex-direction: column; gap: 30px; }
    .boost { width: 56px; height: 56px; } .boost svg { width: 28px; height: 28px; }
    .panel { padding: 10px 14px; gap: 6px; border-radius: 18px; } .panel h2 { font-size: 28px; } .stars { height: 46px; } .stars i { font-size: 38px; } .stars i:nth-child(2) { font-size: 46px; }
    .lines { font-size: 12.5px; gap: 3px; } .lines div { padding: 2px 10px; } .lines div.tot { font-size: 14px; }
    #toast { bottom: 16px; } .mbot { flex-direction: row; flex-wrap: wrap; justify-content: center; } .mbot .stat { flex-basis: 100%; } .mbot .btn small { display: inline; margin-left: 8px; }
    #resGoals { display: none; } .resRow { flex-direction: row; align-items: center; } .badge { font-size: 12px; padding: 3px 12px; } .ch canvas { width: 80px; height: 46px; } .ch { padding: 4px; } .chlist { gap: 5px; } .item canvas { width: 70px; height: 58px; } .grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="coins" id="coinsTop"><i class="coin"></i><span id="coinsTopN">0</span></div>

<div id="hud" class="hidden">
  <div class="grp" id="lgrp">
    <button class="chip" id="pauseBtn" aria-label="Pause"><i></i><i></i></button>
    <div class="chip" id="hearts"></div>
  </div>
  <div class="chip" id="lvl"><b id="lvlNum">LEVEL 1</b><span id="lvlSub">Street Corner</span></div>
  <div class="chip hidden" id="bossBar"></div>
  <div class="grp" id="rgrp">
    <div class="chip" id="coinBox"><i class="coin"></i><span id="coinNum">0</span></div>
    <div class="chip" id="streak">STREAK ×1</div>
  </div>
</div>
<div id="boosters" class="hidden">
  <button class="boost" id="slowBtn" aria-label="Slow-mo booster"><svg viewBox="0 0 24 24"><path d="M6 2h12v2.2c0 3-2.4 5.1-4.4 6.6v2.4c2 1.5 4.4 3.6 4.4 6.6V22H6v-2.2c0-3 2.4-5.1 4.4-6.6v-2.4C8.4 9.3 6 7.2 6 4.2z" fill="#fff"/><path d="M8.6 19.6c.4-1.8 1.9-2.9 3.4-3.9 1.5 1 3 2.1 3.4 3.9zM9 6h6c-.6 1.3-1.8 2.3-3 3.2C10.8 8.3 9.6 7.3 9 6z" fill="#ffc83a"/></svg><em id="slowN">2</em><small>SLOW-MO</small></button>
  <button class="boost" id="xrayBtn" aria-label="X-ray peek booster"><svg viewBox="0 0 24 24"><path d="M1 12s4.2-7 11-7 11 7 11 7-4.2 7-11 7S1 12 1 12z" fill="#fff"/><circle cx="12" cy="12" r="4.4" fill="#2ab8f0"/><circle cx="12" cy="12" r="1.9" fill="#0a1a2a"/><circle cx="13.6" cy="10.4" r="1" fill="#fff"/></svg><em id="xrayN">2</em><small>X-RAY</small></button>
</div>

<div class="overlay" id="menu">
  <div class="mtop" id="mtop">
    <div class="tag">✦ EYES ON THE BALL ✦</div>
    <div class="title">CUP<span>SHUFFLE</span></div>
  </div>
  <div class="mbot" id="mbot">
    <button class="btn" id="startBtn">PLAY</button>
    <div class="row"><button class="sbtn" id="shopBtn">COLLECTION</button><button class="sbtn" id="mapBtn">CHAPTERS</button></div>
    <div class="stat" id="bestMenu"></div>
  </div>
</div>

<div class="overlay hidden dim" id="res">
  <div class="panel">
    <h3 id="resSub">WELL SPOTTED</h3>
    <h2 id="resTitle">LEVEL CLEAR!</h2>
    <div class="stars" id="resStars"><i>★</i><i>★</i><i>★</i></div>
    <div class="badge" id="resBest">NEW BEST!</div>
    <div class="lines" id="resLines"></div>
    <div class="goals" id="resGoals"></div>
    <div class="row resRow"><button class="btn" id="nextBtn">NEXT</button>
    <button class="sbtn" id="resMenuBtn">MENU</button></div>
  </div>
</div>

<div class="overlay hidden dim" id="over">
  <div class="panel">
    <h3>THE CURTAIN FALLS</h3>
    <h2>SHOW'S OVER</h2>
    <div class="badge" id="overBest">NEW BEST!</div>
    <div class="lines" id="overLines"></div>
    <button class="btn" id="retryBtn">TRY AGAIN</button>
    <button class="sbtn" id="overMenuBtn">MENU</button>
  </div>
</div>

<div class="overlay hidden dim" id="pause">
  <div class="panel">
    <h2>PAUSED</h2>
    <h3>RUN GOALS</h3>
    <div class="goals" id="pauseGoals"></div>
    <button class="btn" id="resumeBtn">RESUME</button>
    <button class="sbtn" id="pauseMenuBtn">MENU</button>
  </div>
</div>

<div class="overlay hidden dim" id="shop">
  <div class="panel" style="max-width:600px">
    <button class="x" id="shopX">✕</button>
    <h2>COLLECTION</h2>
    <div class="stat" id="shopCoins"></div>
    <div class="tabs" id="shopTabs"></div>
    <div class="grid" id="shopGrid"></div>
  </div>
</div>

<div class="overlay hidden dim" id="map">
  <div class="panel">
    <button class="x" id="mapX">✕</button>
    <h2>CHAPTERS</h2>
    <h3 id="mapAct">ACT I</h3>
    <div class="chlist" id="mapList"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {

      const out = { levels: 0, rounds: 0, fails: [], twists: {}, minD: 9, maxV: 0, maxMoves: 0, maxTotal: 0, cups: {} };
      for (let L = a; L <= b; L++) { out.levels++; for (let s = 0; s < roundsOf(L); s++) for (let at = 0; at < 3; at++) { const d = genRound(L, at, s), v = verifyRound(d); out.rounds++;
        if (!v.ok) out.fails.push([L, s, at, v.errs.join(';')]); out.minD = Math.min(out.minD, v.minD); out.maxV = Math.max(out.maxV, v.maxV); out.maxMoves = Math.max(out.maxMoves, v.moves); out.maxTotal = Math.max(out.maxTotal, v.total);
        d.tw.forEach(t => out.twists[t] = (out.twists[t] || 0) + 1); out.cups[d.n] = (out.cups[d.n] || 0) + 1; } }
      return out;
    },
    simulate: (L, show = 0, attempt = 0) => {
      const saved = G; G = newG(L, attempt, show, false); G.sim = true; layoutBoard(); G.phase = 'shuffle'; G.t = 0;
      let maxStep = 0, frames = 0; let prev = G.cups.map(c => proj(c.x, c.z));
      while (G.phase === 'shuffle' && frames < 60 * 180) { stepShuffle(1 / 60); frames++;
        G.cups.forEach((c, i) => { const p = proj(c.x, c.z), cw = S * CW; maxStep = Math.max(maxStep, Math.hypot(p[0] - prev[i][0], p[1] - prev[i][1] - c.h) / cw); prev[i] = [p[0], p[1] - c.h]; }); }
      const ans = G.cups.filter(c => c.ball === 1).map(c => c.slot).sort((a, b) => a - b), exp = G.def.answer.slice().sort((a, b) => a - b);
      G = saved; layoutBoard();
      return { ok: ans.join() === exp.join(), maxStep: +maxStep.toFixed(3), frames, ans, exp };
    }
  };

  // ---------- boot ----------
  resize(); addEventListener('resize', resize);
  startRound(DEMO[0], 1, 0, true); updateMenu();
  if (SAVE.tut === 0) { /* first visit */ }
  (function loop(now) {
    const raw = Math.max(0, (now - last) / 1000); last = now; fpsN++; fpsT += raw; if (fpsT >= 1) { fps = fpsN / fpsT; fpsN = 0; fpsT = 0; }
    if (!paused) { let rem = Math.min(.05, raw) * TSCALE; while (rem > 0) { const s = Math.min(rem, 1 / 50); update(s); rem -= s; } }
    render(); hudTick();
    if (BOT.on) { BOT.ui += Math.min(.05, raw); if (BOT.ui > 1.2) { if (shown('res')) { BOT.ui = 0; $('nextBtn').click(); } else if (shown('over')) { BOT.ui = 0; $('retryBtn').click(); } } }
    requestAnimationFrame(loop);
  })(last);
})();
</script>
