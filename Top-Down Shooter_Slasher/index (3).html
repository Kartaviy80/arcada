<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0612">
<title>Survivor Horde</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0612; color: #f2e8d8;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 11px; padding: 22px 16px; text-align: center; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .serif { font-family: "Palatino Linotype", "Book Antiqua", Palatino, "DejaVu Serif", Georgia, serif; }
  #menu { background: radial-gradient(ellipse at 50% 46%, rgba(16,4,24,.05), rgba(8,2,14,.55) 55%, rgba(6,0,10,.9) 100%); }
  .tag { font-size: 12px; letter-spacing: 6px; font-weight: 800; color: #d8b8ff; text-shadow: 0 2px 8px #000; }
  .title { font-size: clamp(50px, 15vw, 104px); font-weight: 900; line-height: .9; letter-spacing: 3px;
    background: linear-gradient(180deg, #fffaf0 0%, #f4e4c4 40%, #c89a68 66%, #6a3a1e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #1e0610) drop-shadow(0 0 20px rgba(255,70,90,.45)); }
  .title span { display: block; font-size: 1.12em; letter-spacing: 6px; background: linear-gradient(180deg, #ffe0e4 0%, #ff5468 38%, #c0102c 66%, #50000e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #200006) drop-shadow(0 0 26px rgba(255,30,60,.6)); }
  .heroSel { display: flex; align-items: center; gap: 10px; }
  .heroSel canvas { width: 140px; height: 140px; }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,220,170,.6); background: rgba(40,16,50,.6); color: #ffe2a8; font-size: 18px; font-weight: 900; cursor: pointer; }
  .hname { font-size: 19px; font-weight: 900; letter-spacing: 3px; color: #ffe2a8; text-shadow: 0 2px 8px #000; min-height: 22px; }
  .hname small { display: block; font-size: 11px; letter-spacing: 4px; color: #c8a8e8; margin-top: 2px; }
  .hname.lock { color: #9a8aa8; }
  .hdesc { font-size: 12.5px; color: #e0d4f0; max-width: 330px; min-height: 30px; line-height: 1.35; text-shadow: 0 1px 4px #000; }
  .hdesc b { color: #ffc84a; }
  .stat { font-size: 13px; letter-spacing: 1px; color: #e8dcf4; text-shadow: 0 2px 6px #000; } .stat b { color: #ffc84a; }
  .btn { border: 0; padding: 15px 56px; border-radius: 14px; font: inherit; font-size: 22px; font-weight: 900; letter-spacing: 5px; color: #fff; cursor: pointer; text-shadow: 0 2px 0 #5a0414;
    background: linear-gradient(180deg, #ff6474, #d01c38 52%, #820a20); box-shadow: 0 0 0 3px #ffc84a inset, 0 0 0 5px #4a0812 inset, 0 7px 0 #3a0610, 0 12px 30px rgba(220,20,60,.45); animation: bob 1.4s ease-in-out infinite; }
  .btn.alt { background: linear-gradient(180deg, #5a4a80, #2a1a4a); box-shadow: 0 0 0 2px #b8a0e8 inset, 0 5px 0 #140a24; animation: none; font-size: 15px; padding: 11px 26px; letter-spacing: 3px; text-shadow: none; }
  .btn:disabled { filter: grayscale(.85) brightness(.6); animation: none; cursor: default; }
  @keyframes bob { 50% { transform: translateY(-3px) scale(1.03); } }
  .hint { font-size: 12px; color: #c8bcd8; letter-spacing: 1px; text-shadow: 0 1px 4px #000; max-width: 340px; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  /* level up */
  #lvl { z-index: 12; background: radial-gradient(ellipse at 50% 40%, rgba(50,24,90,.6), rgba(6,2,12,.88)); }
  .lvTitle { font-size: clamp(40px, 11vw, 66px); font-weight: 900; font-style: italic; letter-spacing: 2px; background: linear-gradient(180deg, #fff, #ffe08a 45%, #ff9a2a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #5a2a04) drop-shadow(0 0 18px rgba(255,200,80,.7)); animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .lvSub { font-size: 12px; letter-spacing: 5px; color: #d8c8f0; font-weight: 800; }
  #cards { display: flex; flex-direction: column; gap: 10px; width: min(440px, 100%); }
  .card { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 14px; border: 2px solid #6a5a8a; color: #fff; font: inherit; text-align: left; cursor: pointer;
    background: linear-gradient(180deg, rgba(54,38,84,.97), rgba(22,14,38,.97)); box-shadow: 0 5px 0 rgba(0,0,0,.45), 0 0 22px rgba(120,80,200,.25);
    opacity: 0; transform: translateY(24px) scale(.94); animation: cardIn .38s cubic-bezier(.2,1.5,.4,1) forwards; }
  .card:nth-child(2) { animation-delay: .07s; } .card:nth-child(3) { animation-delay: .14s; } .card:nth-child(4) { animation-delay: .21s; }
  @keyframes cardIn { to { opacity: 1; transform: none; } }
  .card:hover, .card:focus-visible { border-color: #ffc84a; outline: none; box-shadow: 0 5px 0 rgba(0,0,0,.45), 0 0 28px rgba(255,200,80,.45); }
  .card:active { transform: translateY(3px); }
  .card .ic { width: 62px; height: 62px; flex: none; border-radius: 12px; background: radial-gradient(circle at 50% 38%, #54406e, #1a1028); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14); }
  .card .cn { font-size: 17px; font-weight: 900; letter-spacing: .5px; }
  .card .cn small { color: #ffc84a; font-size: 12px; margin-left: 6px; letter-spacing: 1px; }
  .card .cd { font-size: 12.5px; color: #dcd0ec; margin-top: 3px; line-height: 1.3; }
  .card .pips { margin-top: 5px; display: flex; gap: 3px; }
  .card .pips i { width: 12px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.16); }
  .card .pips i.on { background: #ffc84a; box-shadow: 0 0 6px #ffc84a; }
  .card .badge { position: absolute; top: -9px; right: 12px; font-size: 10px; font-weight: 900; letter-spacing: 2px; padding: 3px 8px; border-radius: 6px; background: #ffc84a; color: #3a1a04; }
  .card.pas .badge { background: #8ad8ff; color: #04203a; }
  .card.evo { border-color: #ffc84a; background: linear-gradient(180deg, rgba(120,50,20,.97), rgba(50,14,10,.97)); box-shadow: 0 5px 0 rgba(0,0,0,.45), 0 0 34px rgba(255,170,60,.65); }
  .card.evo .badge { background: linear-gradient(90deg, #ff4a6a, #ffc84a); color: #fff; }
  .card .key { position: absolute; bottom: 6px; right: 10px; font-size: 10px; color: rgba(255,255,255,.3); font-weight: 800; }
  @media (orientation: landscape) and (min-width: 700px) {
    #cards { flex-direction: row; width: min(920px, 96vw); align-items: stretch; }
    .card { flex: 1; flex-direction: column; text-align: center; padding: 18px 12px 16px; }
    .card .ic { width: 84px; height: 84px; } .card .pips { justify-content: center; }
  }
  /* chest */
  #chest { z-index: 13; background: radial-gradient(ellipse at 50% 52%, rgba(110,70,10,.55), rgba(6,2,12,.92) 70%); }
  #chest h3 { font-size: clamp(30px, 9vw, 52px); font-weight: 900; letter-spacing: 3px; background: linear-gradient(180deg, #fff6d0, #ffc84a 50%, #c86a10); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #4a1a04) drop-shadow(0 0 18px rgba(255,190,60,.7)); }
  #chestCv { width: min(440px, 94vw); height: min(300px, 46vh); }
  #chestList { min-height: 44px; font-size: 14px; font-weight: 800; color: #ffe8b8; line-height: 1.5; text-shadow: 0 2px 6px #000; }
  #chestList span { color: #ffc84a; }
  /* game over */
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(70,0,18,.62), rgba(6,2,10,.94)); }
  #over h2 { font-size: clamp(34px, 9.5vw, 62px); font-weight: 900; color: #ff4a5a; letter-spacing: 2px; text-shadow: 0 4px 0 #3a0008, 0 0 26px rgba(255,40,70,.7); }
  #overTime { font-size: 66px; font-weight: 900; color: #fff; letter-spacing: 2px; text-shadow: 0 0 24px rgba(255,190,110,.65); line-height: 1; }
  .sub { font-size: 11px; letter-spacing: 5px; color: #c8a8c8; font-weight: 800; }
  #newBest { font-size: 15px; font-weight: 900; letter-spacing: 4px; color: #2a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; border-radius: 8px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,220,80,.8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 26px; font-size: 14px; color: #dccce8; text-align: left; }
  .grid b { color: #fff; float: right; margin-left: 14px; }
  .grid div { white-space: nowrap; } .grid .wide { grid-column: span 2; text-align: center; color: #ffc84a; } .grid .wide b { float: none; margin-left: 8px; }
  #overBuild { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 360px; }
  #overBuild canvas { width: 34px; height: 34px; border-radius: 8px; background: rgba(60,40,90,.6); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18); }
  #unlockMsg { color: #ffc84a; font-weight: 800; }
  /* pause */
  #pause { z-index: 14; background: rgba(8,2,16,.72); }
  #pause .big { font-size: 40px; font-weight: 900; letter-spacing: 8px; color: #ffe2a8; text-shadow: 0 0 20px rgba(255,180,90,.5); }
  #pauseBuild { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 380px; }
  #pauseBuild canvas { width: 38px; height: 38px; border-radius: 8px; background: rgba(60,40,90,.6); }
  #pauseBtn { position: fixed; z-index: 9; top: calc(env(safe-area-inset-top) + 24px); right: 10px; width: 38px; height: 38px; border-radius: 10px; border: 2px solid rgba(255,230,190,.45);
    background: rgba(12,4,20,.6); color: #ffe2a8; font-weight: 900; font-size: 13px; letter-spacing: 1px; cursor: pointer; display: none; }
  @media (max-height: 520px) {
    .overlay { gap: 5px; padding: 8px 16px; }
    .title { font-size: 40px; } .title span { display: inline; margin-left: 10px; font-size: 1em; } .tag { font-size: 10px; letter-spacing: 4px; }
    .heroSel canvas { width: 84px; height: 84px; } .arrow { width: 34px; height: 34px; font-size: 14px; }
    .hname { font-size: 15px; } .hname small { display: inline; margin-left: 8px; } .hdesc { font-size: 11px; min-height: 0; } .stat { font-size: 11px; }
    .btn { padding: 9px 40px; font-size: 18px; } .hint { display: none; }
    .lvTitle { font-size: 30px; } .lvSub { display: none; }
    #cards { flex-direction: row; width: min(860px, 98vw); align-items: stretch; }
    .card { flex: 1; flex-direction: column; text-align: center; padding: 10px 8px; gap: 6px; } .card .ic { width: 48px; height: 48px; } .card .cn { font-size: 14px; } .card .cd { font-size: 11px; } .card .pips { justify-content: center; }
    #chestCv { height: 50vh; } #chest h3 { font-size: 26px; }
    #over h2 { font-size: 30px; } #overTime { font-size: 40px; } .grid { font-size: 11.5px; gap: 2px 18px; } #newBest { font-size: 11px; padding: 3px 10px; } #overBuild canvas { width: 26px; height: 26px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button id="pauseBtn" aria-label="Pause">II</button>
<div class="overlay" id="menu">
  <div class="tag">✝ ENDLESS GOTHIC HORDE ✝</div>
  <div class="title serif">SURVIVOR<span>HORDE</span></div>
  <div class="heroSel"><button class="arrow" id="prevHero" aria-label="Previous hero">◀</button><canvas id="heroPrev" width="280" height="280"></canvas><button class="arrow" id="nextHero" aria-label="Next hero">▶</button></div>
  <div class="hname" id="heroName"></div>
  <div class="hdesc" id="heroDesc"></div>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">SURVIVE</button>
  <div class="hint">Move only — your weapons strike on their own. Level up, evolve, outlast the night.</div>
</div>
<div class="overlay hidden" id="lvl">
  <div class="lvTitle" id="lvTitle">LEVEL UP!</div>
  <div class="lvSub" id="lvSub">CHOOSE A BLESSING</div>
  <div id="cards"></div>
</div>
<div class="overlay hidden" id="chest">
  <h3 class="serif">TREASURE!</h3>
  <canvas id="chestCv" width="880" height="600"></canvas>
  <div id="chestList"></div>
  <button class="btn" id="chestBtn">COLLECT</button>
</div>
<div class="overlay hidden" id="over">
  <h2 class="serif" id="overTitle">YOU HAVE FALLEN</h2>
  <div class="sub">SURVIVED</div>
  <div id="overTime">00:00</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <div id="overBuild"></div>
  <div class="hint" id="unlockMsg"></div>
  <div class="row"><button class="btn" id="againBtn">RISE AGAIN</button><button class="btn alt" id="menuBtn">MENU</button></div>
</div>
<div class="overlay hidden" id="pause">
  <div class="big serif">PAUSED</div>
  <div id="pauseBuild"></div>
  <div class="hint">tap anywhere to continue</div>
  <button class="btn alt" id="quitBtn">QUIT RUN</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);

    updateEnemies(dt);

    updateProjs(dt); updateZones(dt); updateGems(dt); updateItems(dt);
