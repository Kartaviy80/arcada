<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#161b22">
<title>Mech Assault</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #161b22; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  #menu { background: radial-gradient(ellipse at 50% 46%, rgba(10,13,18,.42) 0%, rgba(9,11,16,.66) 55%, rgba(4,6,10,.94) 100%); }
  .tag { font-size: 12px; letter-spacing: 6px; font-weight: 800; color: #ffcf6a; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .title { font-size: clamp(58px, 18vw, 116px); font-weight: 900; line-height: .84; letter-spacing: 3px; font-style: italic; transform: skewX(-8deg);
    background: linear-gradient(180deg, #ffffff 0%, #e2e9f0 38%, #8e9cab 60%, #4a5868 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #11161c) drop-shadow(0 0 24px rgba(150,180,210,.35)); }
  .title span { display: block; font-size: .7em; letter-spacing: 5px; background: linear-gradient(180deg, #fff6c8 0%, #ffcf4a 34%, #ff7a1a 64%, #c42a0a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #4a1004) drop-shadow(0 0 26px rgba(255,120,30,.65)); }
  .stripe { width: min(300px, 70vw); height: 8px; border-radius: 4px; background: repeating-linear-gradient(-45deg, #ffb02a 0 10px, #15181c 10px 20px); box-shadow: 0 0 14px rgba(255,160,40,.35); }
  .hangar { display: flex; align-items: center; gap: 10px; }
  .hangar canvas { width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(14,17,23,.96) 0%, rgba(14,17,23,.9) 50%, rgba(14,17,23,0) 71%); }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,190,90,.75); background: rgba(30,36,44,.6); color: #ffd27a; font-size: 18px; font-weight: 900; cursor: pointer; }
  .skin { font-size: 15px; font-weight: 900; letter-spacing: 3px; color: #ffd27a; text-shadow: 0 2px 6px rgba(0,0,0,.7); min-height: 20px; } .skin.lock { color: #9aa6b4; }
  .stat { font-size: 14px; letter-spacing: 1px; color: #e4ecf4; text-shadow: 0 2px 6px rgba(0,0,0,.8); } .stat b { color: #ffcf4a; }
  .btn { border: 0; padding: 16px 58px; border-radius: 14px; font: inherit; font-size: 24px; font-weight: 900; letter-spacing: 6px; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #ffc24a 0%, #ff7a1a 55%, #d8460a 100%); text-shadow: 0 2px 0 #7a2004;
    box-shadow: 0 0 0 3px #2a1206, 0 0 0 5px #ffcf6a, 0 8px 0 5px #5a1a04, 0 16px 30px rgba(0,0,0,.5); animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px) scale(1.03); } }
  .sbtn { border: 2px solid #ffb02a; padding: 9px 16px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 900; letter-spacing: 1px; color: #ffe2a8; cursor: pointer; background: linear-gradient(180deg, #2c343e, #1a1f26); box-shadow: 0 4px 0 #0a0d10; }
  .sbtn:disabled { opacity: .4; cursor: default; }
  .hint { font-size: 12px; letter-spacing: 1px; color: #b8c4d2; text-shadow: 0 1px 4px rgba(0,0,0,.8); max-width: 520px; }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(60,14,6,.6), rgba(8,8,12,.94)); }
  #over h2 { font-size: clamp(40px, 11vw, 74px); font-weight: 900; font-style: italic; color: #ff8a3a; text-shadow: 0 4px 0 #4a1004, 0 0 26px rgba(255,100,30,.7); line-height: .95; }
  #overScore { font-size: 56px; font-weight: 900; text-shadow: 0 0 22px rgba(255,180,80,.7); }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #2a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; border-radius: 8px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,220,80,.8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; font-size: 14px; color: #c8d2de; text-align: left; } .grid b { color: #fff; float: right; margin-left: 12px; }
  .brow { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #pause { background: rgba(8,10,14,.7); font-size: 34px; font-weight: 900; letter-spacing: 8px; color: #ffcf6a; }
  #pauseBtn { position: fixed; z-index: 6; width: 38px; height: 38px; border-radius: 10px; border: 2px solid rgba(255,200,110,.7); background: rgba(14,18,24,.6); color: #ffd27a; font-weight: 900; font-size: 15px; letter-spacing: -1px; cursor: pointer; }
  #pauseBtn.hidden { display: none; }
  #shop { background: radial-gradient(ellipse at 50% 28%, rgba(34,40,50,.94), rgba(8,10,14,.98)); gap: 10px; justify-content: center; overflow-y: auto; }
  .shopSub { font-size: 13px; font-weight: 900; letter-spacing: 5px; color: #7affa8; text-shadow: 0 0 12px rgba(80,255,150,.5); }
  #shop h3 { font-size: clamp(30px, 8.5vw, 48px); font-weight: 900; font-style: italic; letter-spacing: 2px; color: #ffcf4a; text-shadow: 0 4px 0 #4a2004, 0 0 22px rgba(255,170,40,.5); line-height: 1; }
  .salv { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 900; color: #ffe8a8; background: rgba(0,0,0,.45); border: 2px solid #5a4a2a; padding: 4px 16px; border-radius: 20px; }
  .salv svg { width: 24px; height: 24px; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 10px; width: min(460px, 100%); }
  .card { position: relative; display: grid; grid-template-columns: 54px 1fr auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; color: #fff; font: inherit; text-align: left; cursor: pointer;
    background: linear-gradient(180deg, #2e3744, #1b2129); border: 2px solid #46546a; box-shadow: 0 5px 0 #0a0d12, inset 0 1px 0 rgba(255,255,255,.14); transition: transform .12s; }
  .card:active { transform: scale(.97); }
  .card .ic svg { width: 54px; height: 54px; display: block; }
  .card .nm { font-size: 15px; font-weight: 900; letter-spacing: 1px; }
  .card .ds { font-size: 12px; color: #b4c0ce; line-height: 1.3; margin-top: 2px; }
  .card .lv { display: flex; gap: 3px; margin-top: 5px; } .card .lv i { width: 10px; height: 5px; border-radius: 2px; background: #3a4452; } .card .lv i.on { background: #ffcf4a; box-shadow: 0 0 6px #ffb02a; }
  .card .pr { font-size: 16px; font-weight: 900; color: #ffcf4a; background: rgba(0,0,0,.4); padding: 7px 10px; border-radius: 10px; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .card .pr svg { width: 16px; height: 16px; }
  .card.weapon { border-color: #ff8a3a; background: linear-gradient(180deg, #4a2e22, #24181a); }
  .card.weapon .nm { color: #ffb47a; }
  .card.cant .pr { color: #ff6a5a; } .card.cant { filter: saturate(.5); }
  .card.bought { opacity: .4; pointer-events: none; } .card.bought .pr { color: #7affa8; }
  .shopRow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .armorline { font-size: 13px; color: #c8d4e2; letter-spacing: 1px; } .armorline b { color: #7affa8; }
  #contBtn { padding: 13px 40px; font-size: 20px; letter-spacing: 4px; }
  @media (min-width: 700px) and (min-aspect-ratio: 1/1) {
    .cards { grid-template-columns: repeat(3, 1fr); width: min(820px, 100%); }
    .card { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 16px 12px 12px; gap: 6px; }
    .card .ic svg { width: 64px; height: 64px; } .card .lv { justify-content: center; }
  }
  @media (max-width: 400px) { .tag { font-size: 11px; letter-spacing: 3px; } }
  @media (max-height: 520px) {
    .overlay { gap: 6px; padding: 8px 16px; }
    .title { font-size: 46px; } .tag { font-size: 10px; letter-spacing: 4px; } .stripe { height: 5px; }
    .hangar canvas { width: 84px; height: 84px; } .arrow { width: 34px; height: 34px; font-size: 14px; }
    .btn { padding: 10px 40px; font-size: 19px; } .hint { display: none; } .stat, .skin { font-size: 12px; }
    #over h2 { font-size: 34px; } #overScore { font-size: 34px; } .grid { font-size: 12px; gap: 2px 18px; } #newBest { font-size: 12px; padding: 3px 10px; }
    #shop { gap: 5px; } #shop h3 { font-size: 26px; } .shopSub { font-size: 10px; } .salv { font-size: 16px; padding: 2px 12px; }
    .card { padding: 8px 8px 6px; gap: 2px; } .card .ic svg { width: 38px; height: 38px; } .card .ds { font-size: 11px; } .card .pr { padding: 4px 8px; font-size: 14px; }
    .sbtn { padding: 6px 12px; font-size: 12px; } #contBtn { padding: 8px 30px; font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button id="pauseBtn" class="hidden" aria-label="Pause">II</button>
<div class="overlay" id="menu">
  <div class="tag">◆ HEAVY ARMOR WARFARE ◆</div>
  <div class="title">MECH<span>ASSAULT</span></div>
  <div class="stripe"></div>
  <div class="hangar"><button class="arrow" id="prevSkin">◀</button><canvas id="mechPrev" width="320" height="320"></canvas><button class="arrow" id="nextSkin">▶</button></div>
  <div class="skin" id="skinName"></div>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">DEPLOY</button>
  <div class="hint">Drag left side / WASD to walk · torso auto-aims &amp; fires (mouse aims on desktop) · SPACE missiles · E shield · Q stomp</div>
</div>
<div class="overlay hidden" id="shop">
  <div class="shopSub" id="shopSub">STAGE 1 COMPLETE</div>
  <h3>SALVAGE DEPOT</h3>
  <div class="salv" id="salv"></div>
  <div class="cards" id="cards"></div>
  <div class="shopRow"><button class="sbtn" id="repairBtn">REPAIR</button><button class="sbtn" id="rerollBtn">REROLL</button></div>
  <div class="armorline" id="armorLine"></div>
  <button class="btn" id="contBtn">NEXT MISSION ▶</button>
</div>
<div class="overlay hidden" id="over">
  <h2 id="overTitle">MECH DESTROYED</h2>
  <div id="overScore">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <div class="brow"><button class="btn" id="againBtn">REDEPLOY</button><button class="sbtn" id="menuBtn">HANGAR</button></div>
  <div class="hint" id="unlockMsg"></div>
</div>
<div class="overlay hidden" id="pause">PAUSED<div class="hint">tap to continue</div><button class="sbtn" id="quitBtn">QUIT TO HANGAR</button></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {

    if (G.spotted > .3 && G.night && !G.clear) hudText('⚠ SPOTTED!', W / 2, H * .25 + (port ? 60 * s : 0), Math.round(18 * s), Math.sin(t * 14) > 0 ? '#ff4a2a' : '#ffe08a');
    if (P.alive && P.hp < P.st.maxHp * .3 && !G.clear) hudText('ARMOR CRITICAL', W / 2, H * .68, Math.round(15 * s), Math.sin(t * 8) > 0 ? '#ff5a3a' : '#ffffff');
    if (G.obj === 'boss' && !G.boss && G.bossDue > 0 && !G.clear) hudText('BOSS INBOUND ' + Math.ceil(G.bossDue), W / 2, H * .6, Math.round(16 * s), '#ff8a5a');
    // controls
    const B = ctl.button.bind(ctl), bm = B('missile'), bs = B('shield'), bk = B('stomp');
    bm.cool = P.cdM; bm.coolMax = 9; bm.count = P.st.missiles; bs.cool = P.cdS; bs.coolMax = P.st.shieldCd + P.st.shieldDur; bk.cool = P.cdT; bk.coolMax = 7;
    for (const b of ctl.buttons) b.hidden = !P.alive || G.clear;
    ctl.draw(ctx, { color: '#ffcf6a', hint: G.tut >= 0 });
    const S2 = clamp(Math.min(W, H) / 420, .75, 1.25);
    for (const b of ctl.buttons) {
      if (b.hidden) continue; const ready = !(b.cool > 0), y = b.y + (b.down ? 3 * S2 : 0);
      ctx.globalAlpha = ready ? 1 : .55; btnIcon(b.id, b.x, y - b.r * .14, b.r * .9);
      ctx.font = '900 ' + Math.round(b.r * .24) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)'; const lb = b.id === 'missile' ? 'MISSILES' : b.id.toUpperCase(); ctx.strokeText(lb, b.x, y + b.r * .56); ctx.fillStyle = '#fff'; ctx.fillText(lb, b.x, y + b.r * .56);
      if (!ready) { ctx.globalAlpha = 1; hudText(Math.ceil(b.cool) + '', b.x, y - b.r * .1, Math.round(b.r * .5), '#ffffff'); }
      ctx.globalAlpha = 1;
    }
    if (P.shield > 0) hudText('SHIELD ' + P.shield.toFixed(1) + 's', bs.x, bs.y - bs.r - 12 * s, Math.round(11 * s), '#7ae8ff');
    // first-run tutorial
    if (G.tut >= 0 && P.alive) {
      const a = Math.min(1, G.tut * 2) * (G.tutMove > 1.2 ? Math.max(0, 1 - (G.tut - 6) * .5) : 1), p = .5 + Math.sin(t * 5) * .5; ctx.globalAlpha = a;
      if (ctl.mouse.used && !ctl.touchUsed) hudText('WASD WALK · MOUSE AIMS (CLICK TO FIRE) · SPACE MISSILES · E SHIELD · Q STOMP', W / 2, H * .74, Math.round(Math.min(13 * s, W / 52)), '#ffe08a');
      else { const S = clamp(Math.min(W, H) / 420, .75, 1.25); hudText('DRAG TO WALK', W * .22, H - 120 * S - 84 * S - p * 6, Math.round(17 * s), '#ffffff'); hudText('TAP ABILITIES', bm.x - bm.r * 1.4, bk.y - bk.r - 22 * s - p * 6, Math.round(14 * s), '#ffcf6a'); }
      hudText('YOUR TORSO AUTO-AIMS AND FIRES', W / 2, H * .62, Math.round(14 * s), '#ffffff');
      ctx.globalAlpha = 1;
    }
  }

  // ---------- salvage depot (between stages) ----------
  const UPGS = [
    { id: 'dmg', name: 'HEAVY ROUNDS', desc: '+22% weapon damage', cost: 45, max: 12 },
    { id: 'armor', name: 'REACTIVE ARMOR', desc: '+45 max armor (and repairs it)', cost: 40, max: 12 },
    { id: 'missiles', name: 'MISSILE RACKS', desc: '+2 missiles per salvo', cost: 50, max: 8 },
    { id: 'speed', name: 'SERVO MOTORS', desc: '+9% walking speed', cost: 35, max: 6 },
    { id: 'rate', name: 'AUTOLOADER', desc: '+14% fire rate', cost: 45, max: 10 },
    { id: 'cool', name: 'HEAT SINKS', desc: '-20% weapon heat', cost: 35, max: 6 },
    { id: 'shield', name: 'DOME CAPACITOR', desc: 'Longer shield, faster recharge', cost: 40, max: 6 },
    { id: 'stomp', name: 'HYDRAULIC LEGS', desc: 'Bigger, harder stomp shockwave', cost: 40, max: 6 },
    { id: 'magnet', name: 'SALVAGE MAGNET', desc: '+50% pickup range', cost: 25, max: 4 }
  ];
  const WDESC = { chain: ['Rapid tracer fire, ejects brass', 30], plasma: ['Heavy bolts with splash damage', 80], laser: ['Continuous beam that melts armor', 90], flak: ['Shotgun bursts that air-burst', 70] };
  const GEAR_SVG = SVG.gear[0];
  const ICONS = {
    dmg: `<defs>${lg('b', [[0, '#fff2b0'], [.5, '#e8a83a'], [1, '#8a5a10']], 1, 0)}</defs>${[14, 28, 42].map(x => `<path d="M${x} 54V26Q${x} 12 ${x + 6} 8Q${x + 12} 12 ${x + 12} 26V54Z" fill="url(#b)" stroke="#3a2004" stroke-width="2"/><rect x="${x}" y="46" width="12" height="8" fill="#c8901a" stroke="#3a2004" stroke-width="2"/>`).join('')}`,
    armor: `<defs>${lg('b', [[0, '#e8eef4'], [1, '#5a6a7a']], 1, 1)}</defs><path d="M32 6L54 14V32Q54 48 32 58Q10 48 10 32V14Z" fill="url(#b)" stroke="#1a2028" stroke-width="3"/><path d="M32 20V44M20 32H44" stroke="#2ac86a" stroke-width="7" stroke-linecap="round"/>`,
    missiles: `<g transform="rotate(-35 32 32)">${[22, 42].map(x => `<path d="M${x - 5} 50V20L${x} 8L${x + 5} 20V50L${x + 9} 58H${x - 9}Z" fill="#e8ecf0" stroke="#2a2e36" stroke-width="2"/><path d="M${x - 5} 20L${x} 8L${x + 5} 20Z" fill="#ff4a2a"/><path d="M${x - 3} 58L${x} 64L${x + 3} 58Z" fill="#ffb02a"/>`).join('')}</g>`,
    speed: `${[0, 1, 2].map(i => `<path d="M${10 + i * 14} 14L${26 + i * 14} 32L${10 + i * 14} 50" fill="none" stroke="${['#ffe08a', '#ffb02a', '#ff6a2a'][i]}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}`,
    rate: `<path d="M32 8A24 24 0 1 1 10 22" fill="none" stroke="#ffb02a" stroke-width="6" stroke-linecap="round"/><path d="M4 12L12 26L22 16Z" fill="#ffb02a"/><path d="M26 44V28Q26 20 32 18Q38 20 38 28V44Z" fill="#ffd27a" stroke="#3a2004" stroke-width="2"/>`,
    cool: `<g stroke="#7ae8ff" stroke-width="5" stroke-linecap="round">${[0, 60, 120].map(a => `<path d="M32 6V58M32 14L25 8M32 14L39 8M32 50L25 56M32 50L39 56" transform="rotate(${a} 32 32)"/>`).join('')}</g>`,
    shield: `<path d="M32 6L54 18V46L32 58L10 46V18Z" fill="rgba(90,200,255,.25)" stroke="#7ae8ff" stroke-width="4"/><path d="M18 42A14 14 0 0 1 46 42Z" fill="#aef4ff"/>`,
    stomp: `<path d="M24 6H40V26H50L32 44L14 26H24Z" fill="#ffcf4a" stroke="#3a2004" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="32" cy="52" rx="24" ry="6" fill="none" stroke="#ffb02a" stroke-width="4"/><ellipse cx="32" cy="52" rx="12" ry="3" fill="none" stroke="#fff" stroke-width="3"/>`,
    magnet: `<path d="M14 8V34A18 18 0 0 0 50 34V8H40V34A8 8 0 0 1 24 34V8Z" fill="#e8402a" stroke="#3a0a04" stroke-width="2.5"/><rect x="14" y="8" width="10" height="9" fill="#e8ecf0"/><rect x="40" y="8" width="10" height="9" fill="#e8ecf0"/>`
  };
  const svgI = (body, vb = '0 0 64 64') => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">${body}</svg>`;
  const wIcon = k => svgI(`<g transform="rotate(-24 35 35) translate(0 22)">${WPN_SVG[k]}</g>`, '0 0 70 70');
  const gearIco = () => GEAR_SVG;
  let offers = [], rerolls = 0;
  const upCost = u => Math.round(u.cost * (1 + G.up[u.id] * .5) * (1 + G.stage * .03));
  const wCost = k => Math.round(WDESC[k][1] * (1 + G.stage * .03));
  const repCost = () => Math.round(14 + G.stage * 3);
  function rollOffers() {
    const pool = UPGS.filter(u => G.up[u.id] < u.max).sort(() => Math.random() - .5);
    offers = [];
    if (Math.random() < .65 || G.stage === 1) { const ws = Object.keys(WEAPONS).filter(k => k !== G.weapon && k !== 'chain'); offers.push({ w: pick(ws.length ? ws : ['chain']) }); }
    while (offers.length < 3 && pool.length) offers.push({ u: pool.shift() });
  }
  function openShop() {
    G.shopOpen = true; ctl.setEnabled(false); rerolls = 0; rollOffers(); renderShop();
    $('shopSub').textContent = 'STAGE ' + G.stage + ' COMPLETE' + ((G.stage + 1) % 5 === 0 ? ' · BOSS NEXT' : '');
    $('shop').classList.remove('hidden'); $('pauseBtn').classList.add('hidden'); servoHum.set(60, 0); laserHum.set(100, 0);
  }
  function renderShop() {
    $('salv').innerHTML = gearIco() + '<span>' + fmt(G.salvage) + '</span>';
    const el = $('cards'); el.innerHTML = '';
    offers.forEach((o, i) => {
      const b = document.createElement('button'), cost = o.w ? wCost(o.w) : upCost(o.u), can = G.salvage >= cost;
      b.className = 'card' + (o.w ? ' weapon' : '') + (o.bought ? ' bought' : !can ? ' cant' : '');
      const lv = o.u ? '<div class="lv">' + Array.from({ length: Math.min(o.u.max, 12) }, (_, k) => `<i class="${k < G.up[o.u.id] ? 'on' : ''}"></i>`).join('') + '</div>' : '<div class="lv"><i class="on" style="width:auto;height:auto;padding:1px 6px;font-size:10px;font-style:normal;color:#2a1004">WEAPON SWAP</i></div>';
      b.innerHTML = `<div class="ic">${o.w ? wIcon(o.w) : svgI(ICONS[o.u.id])}</div><div><div class="nm">${o.w ? WEAPONS[o.w].name : o.u.name}</div><div class="ds">${o.w ? WDESC[o.w][0] : o.u.desc}</div>${lv}</div><div class="pr">${o.bought ? 'INSTALLED' : gearIco() + cost}</div>`;
      b.onclick = () => buy(i); el.appendChild(b);
    });
    const rc = repCost(), full = P.hp >= P.st.maxHp - .5;
    $('repairBtn').textContent = full ? 'ARMOR FULL' : 'REPAIR +25% · ' + rc; $('repairBtn').disabled = full || G.salvage < rc;
    const rcost = 15 + rerolls * 10; $('rerollBtn').textContent = 'REROLL · ' + rcost; $('rerollBtn').disabled = G.salvage < rcost;
    $('armorLine').innerHTML = 'ARMOR <b>' + Math.ceil(P.hp) + ' / ' + P.st.maxHp + '</b> · ' + WEAPONS[G.weapon].name + ' · MISSILES <b>' + P.st.missiles + '</b>';
  }
  function buy(i) {
    const o = offers[i]; if (!o || o.bought) return; const cost = o.w ? wCost(o.w) : upCost(o.u);
    if (G.salvage < cost) { if (audioOn) sfx(160, .15, 'square', .04, 90); return; }
    G.salvage -= cost; o.bought = true;
    if (o.w) G.weapon = o.w; else { const pm = P.st.maxHp; G.up[o.u.id]++; derive(); if (o.u.id === 'armor') P.hp += P.st.maxHp - pm; }
    if (audioOn) [660, 880, 1320].forEach((f, k) => setTimeout(() => sfx(f, .12, 'square', .04), k * 60));
    renderShop();
  }
  $('repairBtn').onclick = () => { const c = repCost(); if (G.salvage < c || P.hp >= P.st.maxHp) return; G.salvage -= c; P.hp = Math.min(P.st.maxHp, P.hp + P.st.maxHp * .25); if (audioOn) sfx(523, .15, 'square', .04, 1046); renderShop(); };
  $('rerollBtn').onclick = () => { const c = 15 + rerolls * 10; if (G.salvage < c) return; G.salvage -= c; rerolls++; rollOffers(); if (audioOn) sfx(400, .1, 'square', .03, 800); renderShop(); };
  $('contBtn').onclick = () => { $('shop').classList.add('hidden'); G.shopOpen = false; ctl.setEnabled(true); ctl.clear(); $('pauseBtn').classList.remove('hidden'); startStage(G.stage + 1); last = performance.now(); };

  // ---------- menu, flow, pause ----------
  let prevSkin = SAVE.skin;
  function drawPreview(tt) {
    if (!SPR) return; const c = $('mechPrev'), g = c.getContext('2d'), sk = SKINS[prevSkin], locked = sk.need > SAVE.best;
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 320, 320);
    const old = ctx; ctx = g;
    const a = -Math.PI / 2 + Math.sin(tt * .6) * .5, m = { x: 160, y: 168, legA: a, torA: a + Math.sin(tt * 1.3) * .35, phase: tt * 4, walk: .5, recoil: [0, 0], flash: 0 };
    drawMech(m, { torso: 'torso' + prevSkin, foot: 'foot' + prevSkin, hip: 'hip' + prevSkin, leg: shade(sk.b, .1), wpnL: 'w_chain', wpnR: 'w_chain' }, 1.55);
    ctx = old;
    if (locked) { g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(14,16,22,.8)'; g.fillRect(0, 0, 320, 320); }
    g.globalCompositeOperation = 'destination-over';
    const gr = g.createRadialGradient(160, 180, 10, 160, 180, 150); gr.addColorStop(0, locked ? 'rgba(140,150,170,.3)' : 'rgba(255,190,90,.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 320, 320);
    g.strokeStyle = locked ? 'rgba(150,160,180,.4)' : 'rgba(255,190,90,.7)'; g.lineWidth = 3; g.setLineDash([14, 10]); g.lineDashOffset = -tt * 20; g.beginPath(); g.ellipse(160, 180, 128, 128, 0, 0, TAU); g.stroke(); g.setLineDash([]);
    g.globalCompositeOperation = 'source-over';
  }
  function updateSkinLabel() { const s = SKINS[prevSkin], locked = s.need > SAVE.best; $('skinName').textContent = locked ? '🔒 ' + s.name + ' · BEST ' + fmt(s.need) : s.name; $('skinName').className = 'skin' + (locked ? ' lock' : ''); if (!locked) { SAVE.skin = prevSkin; saveNow(); } }
  function updateMenu() { $('bestMenu').innerHTML = SAVE.best ? 'BEST <b>' + fmt(SAVE.best) + '</b> · STAGE <b>' + SAVE.bestStage + '</b> · BOSSES <b>' + SAVE.bosses + '</b>' : 'Endless war zones · a boss every 5 stages'; updateSkinLabel(); }
  $('prevSkin').onclick = () => { prevSkin = (prevSkin + SKINS.length - 1) % SKINS.length; updateSkinLabel(); };
  $('nextSkin').onclick = () => { prevSkin = (prevSkin + 1) % SKINS.length; updateSkinLabel(); };
  function start() {
    if (!SPR) return; audio.start(); audioOn = true;
    for (const id of ['menu', 'over', 'shop', 'pause']) $(id).classList.add('hidden');
    paused = false; newRun(false); $('pauseBtn').classList.remove('hidden'); ctl.setEnabled(true); ctl.clear(); hpGhost = 1; last = performance.now();
  }
  function toMenu() { for (const id of ['over', 'shop', 'pause']) $(id).classList.add('hidden'); $('menu').classList.remove('hidden'); $('pauseBtn').classList.add('hidden'); paused = false; newRun(true); updateMenu(); servoHum.set(60, 0); laserHum.set(100, 0); }
  $('startBtn').onclick = start; $('againBtn').onclick = start; $('menuBtn').onclick = toMenu;
  function gameOver() {
    const sc = Math.floor(G.score), prev = SAVE.best, nb = sc > prev; if (nb) SAVE.best = sc; SAVE.kills += G.kills; SAVE.runs++; SAVE.bestStage = Math.max(SAVE.bestStage, G.stage); saveNow();
    $('overTitle').textContent = G.failed ? 'MISSION FAILED' : 'MECH DESTROYED';
    $('overScore').textContent = fmt(sc); $('newBest').style.display = nb ? 'block' : 'none';
    $('overStats').innerHTML = [['Stage', G.stage], ['Kills', G.kills], ['Bosses', G.bosses], ['Salvage', G.salvTotal], ['Best streak', 'x' + G.bestCombo], ['Weapon', WEAPONS[G.weapon].name.split(' ')[0]]].map(([a, b]) => '<div>' + a + '<b>' + b + '</b></div>').join('');
    const un = SKINS.filter(s => s.need > prev && s.need <= SAVE.best).map(s => s.name); $('unlockMsg').textContent = un.length ? 'NEW MECH UNLOCKED: ' + un.join(', ') : 'Best: ' + fmt(SAVE.best) + ' · next mech at ' + fmt((SKINS.find(s => s.need > SAVE.best) || { need: SAVE.best }).need);
    $('over').classList.remove('hidden'); $('pauseBtn').classList.add('hidden'); updateMenu();
    servoHum.set(60, 0); laserHum.set(100, 0);
  }
  function pause() { if (!G || G.attract || G.over || paused || G.shopOpen) return; paused = true; $('pause').classList.remove('hidden'); ctl.clear(); servoHum.set(60, 0); laserHum.set(100, 0); }
  function resume() { if (!paused) return; paused = false; $('pause').classList.add('hidden'); last = performance.now(); ctl.clear(); }
  $('pause').addEventListener('pointerdown', e => { if (e.target.id !== 'quitBtn') resume(); });
  $('quitBtn').onclick = e => { e.stopPropagation(); toMenu(); };
  $('pauseBtn').addEventListener('pointerdown', e => e.stopPropagation());
  $('pauseBtn').onclick = e => { e.stopPropagation(); pause(); };
  addEventListener('keydown', e => {
    if ((e.code === 'Enter' || e.code === 'Space') && !$('menu').classList.contains('hidden')) { e.preventDefault(); start(); return; }
    if (e.code === 'Escape' || e.code === 'KeyP') { if (paused) resume(); else pause(); return; }
    if (paused) resume();
  });
  addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // ---------- test hook ----------
  let fps = 60, last = performance.now();
  window.__ma = {
    G: () => G, P: () => P, start, fps: () => fps, enemies: () => enemies.length, parts: () => parts.length,
    autopilot: v => { G.autopilot = v; }, god: v => { G.god = v; }, setStage: (n, obj) => { G.forceObj = obj; $('shop').classList.add('hidden'); G.shopOpen = false; ctl.setEnabled(true); startStage(n); },
    spawn: (k, n = 1, elite) => { for (let i = 0; i < n; i++) spawn(k, P.x + rand(-300, 300), P.y - 260 + rand(-80, 80), { aggro: true, elite }); },
    salvage: n => { G.salvage += n; }, shop: () => { stageClear(); G.clearT = 9; }, buy: i => buy(i), cont: () => $('contBtn').click(), weapon: k => { G.weapon = k; },
    clear: () => stageClear(), boss: () => spawnBoss(), die: () => { G.god = false; P.shield = 0; P.drop = 0; G.clear = false; hurt(99999, P.x, P.y); }, up: (id, n = 1) => { G.up[id] += n; derive(); }, offers: () => offers, pause, resume, times: () => TT, dbg: DBG
  };

  let fpsAcc = 0, fpsN = 0, drewFrozen = false; const TT = { u: 0, r: 0 };
  (function loop(now) {
    const rdt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    fpsAcc += rdt; fpsN++; if (fpsAcc > .5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
    const t0 = performance.now(), frozen = paused || (G && G.shopOpen); if (!frozen) update(rdt); const t1 = performance.now(); if (!frozen || !drewFrozen) render(); drewFrozen = frozen; const t2 = performance.now(); TT.u = TT.u * .95 + (t1 - t0) * .05; TT.r = TT.r * .95 + (t2 - t1) * .05;
    if (!$('menu').classList.contains('hidden')) drawPreview(now / 1000);
    requestAnimationFrame(loop);
  })(last);
  sprReady.then(() => { updateMenu(); if (!G) newRun(true); });
})();
