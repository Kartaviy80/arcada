<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eeeeee">
<title>Spike Bounce</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #eeeeee;
    font-family: "Helvetica Neue", Arial, sans-serif; color: #555;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 14px; padding: 24px 24px max(60px, env(safe-area-inset-bottom));
    text-align: center; transition: opacity .25s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  h1 { font-size: clamp(34px, 10vw, 54px); font-weight: 800; letter-spacing: -1px; color: #444; }
  p { max-width: 280px; font-size: 15px; line-height: 1.5; }
  .stat { font-size: 16px; font-weight: 700; letter-spacing: 2px; } .stat b { color: #ff5d73; }
  .btn { border: none; background: #444; color: #fff; font: inherit; font-weight: 800; font-size: 18px; letter-spacing: 3px; padding: 16px 50px; border-radius: 12px; cursor: pointer; }
  .btn:active { transform: scale(.96); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="overlay" id="menu">
  <h1>SPIKE BOUNCE</h1>
  <p><b>Tap</b> to flap. Bounce off the walls to score — the spikes move every time you touch a wall.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">PLAY</button>
</div>
<div class="overlay hidden" id="over">
  <h1>OUCH</h1>
  <div class="stat">SCORE <b id="finalScore">0</b> · BEST <b id="bestOver">0</b></div>
  <div class="stat">CANDY <b id="finalCandy">0</b></div>
  <button class="btn" id="againBtn">RETRY</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const audio = GameAudio({
    bpm: 118, scale: 'pentaMajor', root: 64, prog: [0, 2, 3, 1], seed: 309,
    waves: { lead: 'square', bass: 'triangle', arp: 'triangle' },
    arp: true, arpEvery: 2, arpOct: 1, leadCutoff: 1800, leadOct: 1, leadDensity: 0.35, drums: true, bassPattern: [0, 6, 8, 14], volume: 0.12,
    btnBg: 'rgba(68,68,68,.25)', btnColor: '#444'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'spike_bounce_best';
  let best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const showBest = () => { $('bestMenu').innerHTML = best ? 'BEST <b>' + best + '</b>' : ''; }; showBest();

  const AW = 360, AH = 600, SLOTS = 11, BAND = 46, R = 15;
  let W, H, DPR, S, ox, oy;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    S = Math.min(W / (AW + 20), H / (AH + 40)); ox = (W / S - AW) / 2; oy = (H / S - AH) / 2;
  }
  addEventListener('resize', resize); resize();
  const THEMES = [['#eeeeee', '#555'], ['#ffe3e8', '#e05a73'], ['#e3f3ff', '#3f7fbf'], ['#e6ffe8', '#3f9a52'], ['#fff3d9', '#c98a1c'], ['#efe3ff', '#7a4fbf'], ['#2b2b2b', '#ddd']];

  let state = 'menu', b, spikes, score, candy, candyItem, t = 0, bits = [], squash = 0, flash = 0;
  const slotH = (AH - BAND * 2) / SLOTS;
  function reset() {
    b = { x: AW / 2, y: AH / 2, vx: 170, vy: 0, dead: false };
    spikes = { l: new Array(SLOTS).fill(false), r: new Array(SLOTS).fill(false) };
    score = 0; candy = 0; bits = []; candyItem = null; flash = 0;
  }
  reset();
  function respike(side) {
    const arr = spikes[side]; arr.fill(false);
    const n = Math.min(SLOTS - 4, 2 + Math.floor(score / 4));
    let placed = 0;
    while (placed < n) { const k = Math.floor(Math.random() * SLOTS); if (!arr[k]) { arr[k] = true; placed++; } }
    // always leave a 3-slot opening somewhere
    const open = Math.floor(Math.random() * (SLOTS - 2));
    arr[open] = arr[open + 1] = arr[open + 2] = false;
  }
  function placeCandy() { candyItem = { x: AW * (0.25 + Math.random() * 0.5), y: BAND + 40 + Math.random() * (AH - BAND * 2 - 80) }; }

  function start() { reset(); state = 'play'; audio.start(); $('menu').classList.add('hidden'); $('over').classList.add('hidden'); respike('r'); flap(); }
  function flap() {
    if (state !== 'play' || b.dead) return;
    b.vy = -400; squash = 0.2;
    audio.sfx(600, 0.06, 'triangle', 0.05, 900);
  }
  function die() {
    if (b.dead) return;
    b.dead = true; flash = 0.25;
    audio.sfx(200, 0.5, 'sawtooth', 0.09, 50);
    if (navigator.vibrate) try { navigator.vibrate(120); } catch (e) {}
    for (let i = 0; i < 20; i++) bits.push({ x: b.x, y: b.y, vx: (Math.random() - .5) * 400, vy: (Math.random() - .5) * 400, life: 0.8 });
    if (score > best) { best = score; try { localStorage.setItem(KEY, best); } catch (e) {} }
    $('finalScore').textContent = score; $('bestOver').textContent = best; $('finalCandy').textContent = candy; showBest();
    setTimeout(() => { state = 'over'; $('over').classList.remove('hidden'); }, 700);
  }
  canvas.addEventListener('pointerdown', () => { if (state === 'play') flap(); });
  addEventListener('keydown', e => {
    if (e.key !== ' ' && e.key !== 'ArrowUp' && e.key !== 'Enter') return; e.preventDefault();
    if (state === 'play') flap(); else if (state === 'menu' || !$('over').classList.contains('hidden')) start();
  });
  $('startBtn').onclick = start; $('againBtn').onclick = start;

  const slotOf = y => Math.floor((y - BAND) / slotH);
  function hitsWall(arr) {
    for (const yy of [b.y - R + 4, b.y, b.y + R - 4]) { const k = slotOf(yy); if (k >= 0 && k < SLOTS && arr[k]) return true; }
    return false;
  }

  function update(dt) {
    t += dt;
    if (state === 'menu') { b.y = AH / 2 + Math.sin(t * 3) * 20; b.x = AW / 2; return; }
    if (state !== 'play' || b.dead) { for (const p of bits) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; } bits = bits.filter(p => p.life > 0); flash = Math.max(0, flash - dt); return; }
    b.vy = Math.min(650, b.vy + 1300 * dt);
    b.x += b.vx * dt; b.y += b.vy * dt;
    squash = Math.max(0, squash - dt);
    if (b.y - R < BAND - 2 || b.y + R > AH - BAND + 2) die();
    if (b.x + R > AW) {
      if (hitsWall(spikes.r)) return die();
      b.x = AW - R; b.vx = -Math.abs(b.vx) * 1.0; score++; respike('l'); spikes.r.fill(false); bounceFx();
    } else if (b.x - R < 0) {
      if (hitsWall(spikes.l)) return die();
      b.x = R; b.vx = Math.abs(b.vx); score++; respike('r'); spikes.l.fill(false); bounceFx();
    }
    if (candyItem && Math.hypot(candyItem.x - b.x, candyItem.y - b.y) < R + 12) { candy++; candyItem = null; audio.sfx(1320, 0.12, 'sine', 0.06, 1760); }
  }
  function bounceFx() {
    audio.sfx(330 + (score % 8) * 40, 0.1, 'square', 0.05);
    b.vx = Math.sign(b.vx) * Math.min(260, 170 + score * 3);
    if (!candyItem && score % 3 === 0) placeCandy();
  }

  function spikeRow(x, y0, dir, n, arr) {
    for (let k = 0; k < n; k++) {
      if (arr && !arr[k]) continue;
      const y = y0 + k * slotH;
      ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x + dir * 22, y + slotH / 2); ctx.lineTo(x, y + slotH - 4); ctx.fill();
    }
  }

  function render() {
    const theme = THEMES[Math.floor(score / 5) % THEMES.length];
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = theme[0]; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.scale(S, S); ctx.translate(ox, oy);
    // big score disc
    ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.beginPath(); ctx.arc(AW / 2, AH / 2, 90, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = theme[0] === '#2b2b2b' ? '#555' : theme[0]; ctx.font = '800 80px Helvetica Neue, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillText(String(score).padStart(2, '0'), AW / 2, AH / 2 + 4);
    // walls & spikes
    ctx.fillStyle = theme[1];
    ctx.fillRect(-12, 0, 12, AH); ctx.fillRect(AW, 0, 12, AH);
    ctx.fillRect(-12, 0, AW + 24, BAND - 22); ctx.fillRect(-12, AH - BAND + 22, AW + 24, BAND - 22);
    const topN = Math.floor(AW / 30);
    for (let k = 0; k < topN; k++) { const x = k * (AW / topN); ctx.beginPath(); ctx.moveTo(x + 3, BAND - 22); ctx.lineTo(x + AW / topN / 2, BAND); ctx.lineTo(x + AW / topN - 3, BAND - 22); ctx.fill(); ctx.beginPath(); ctx.moveTo(x + 3, AH - BAND + 22); ctx.lineTo(x + AW / topN / 2, AH - BAND); ctx.lineTo(x + AW / topN - 3, AH - BAND + 22); ctx.fill(); }
    spikeRow(0, BAND, 1, SLOTS, spikes.l);
    spikeRow(AW, BAND, -1, SLOTS, spikes.r);
    if (candyItem) {
      const c = candyItem; ctx.save(); ctx.translate(c.x, c.y + Math.sin(t * 4) * 3); ctx.rotate(t);
      ctx.fillStyle = '#ff5d73'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, 1.2); ctx.lineTo(0, 0); ctx.fill(); ctx.beginPath(); ctx.arc(0, 0, 9, 2.1, 3.3); ctx.lineTo(0, 0); ctx.fill(); ctx.beginPath(); ctx.arc(0, 0, 9, 4.2, 5.4); ctx.lineTo(0, 0); ctx.fill();
      ctx.restore();
    }
    // bird
    if (!b.dead) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.scale(Math.sign(b.vx) || 1, 1); ctx.rotate(Math.max(-0.4, Math.min(0.5, b.vy / 900)));
      ctx.scale(1 + squash * 0.6, 1 - squash * 0.6);
      ctx.fillStyle = '#ff5d73'; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(R - 2, -3); ctx.lineTo(R + 9, 1); ctx.lineTo(R - 2, 5); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5, -5, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(7, -5, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e04761'; ctx.beginPath(); ctx.ellipse(-4, 4, 8, 5, squash > 0 ? -0.8 : 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    for (const p of bits) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = '#ff5d73'; ctx.fillRect(p.x, p.y, 5, 5); }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash * 3 + ')'; ctx.fillRect(0, 0, W, H); }
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
