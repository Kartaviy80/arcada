<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1240">
<title>Magic Tree</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1240;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; color: #f2e8ff;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
  .top .coins { font-size: 32px; font-weight: 900; color: #fff; -webkit-text-stroke: 1.5px #4a1a7a; text-shadow: 0 3px 0 #4a1a7a, 0 0 22px rgba(220,160,255,.8); }
  .top .ps { font-size: 13px; font-weight: 800; color: #f2e0ff; background: rgba(40,16,80,.72); display: inline-block; padding: 2px 12px; border-radius: 12px; margin-top: 2px; }
  .top .boost { font-size: 13px; font-weight: 900; color: #3a2a04; background: linear-gradient(#fff2a0, #ffc83a); display: inline-block; padding: 2px 10px; border-radius: 12px; margin-left: 6px; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; height: 45%; background: linear-gradient(#34205a, #1c1036); border-top: 5px solid #c88aff; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(160,90,255,.35); display: flex; flex-direction: column; z-index: 3; }
  @media (min-aspect-ratio: 1/1) { .panel { left: auto; top: 0; width: min(420px, 40%); height: 100%; border-radius: 22px 0 0 22px; border-top: 0; border-left: 5px solid #c88aff; } }
  .tabs { display: flex; gap: 6px; padding: 10px 10px 6px; }
  .tabs button { flex: 1; border: 0; border-radius: 12px; padding: 9px 4px; font: inherit; font-size: 14px; font-weight: 900; color: #d8c0ff; background: #46306e; cursor: pointer; }
  .tabs button.on { background: linear-gradient(#e0a8ff, #a05ae8); color: #fff; box-shadow: 0 3px 0 #5a2a9a, 0 0 14px rgba(200,140,255,.5); }
  .tabs .mode { flex: 0 0 64px; background: #120a24; color: #ffd8ff; }
  .list { flex: 1; overflow-y: auto; padding: 4px 10px 80px; -webkit-overflow-scrolling: touch; }
  .card { display: flex; align-items: center; gap: 10px; background: linear-gradient(#4a3274, #3a2660); border: 2px solid #6a4a9a; border-radius: 16px; padding: 8px; margin-bottom: 8px; box-shadow: 0 3px 0 #140a28; }
  .card.grow { background: linear-gradient(#3a6a4a, #24483a); border-color: #7ae8a0; }
  .card canvas { width: 58px; height: 58px; flex: 0 0 58px; border-radius: 12px; background: radial-gradient(circle at 45% 40%, #6a4aa0, #241440); }
  .card .info { flex: 1; min-width: 0; }
  .card .nm { font-weight: 900; font-size: 15px; color: #fff; } .card .nm small { font-weight: 800; color: #e8b0ff; font-size: 13px; }
  .card .ds { font-size: 12px; color: #d0bce8; line-height: 1.3; }
  .card .bar { height: 5px; background: #241440; border-radius: 3px; margin-top: 4px; overflow: hidden; } .card .bar i { display: block; height: 100%; background: linear-gradient(90deg, #7affc8, #e0a8ff); }
  .card button { flex: 0 0 auto; min-width: 86px; border: 0; border-radius: 12px; padding: 8px 6px; font: inherit; font-weight: 900; font-size: 13px; color: #0a3a28; background: linear-gradient(#a8ffd8, #3ad89a); box-shadow: 0 3px 0 #0a6a4a, 0 0 12px rgba(120,255,200,.35); cursor: pointer; line-height: 1.15; }
  .card button:disabled { background: #5a4a74; box-shadow: 0 3px 0 #241440; color: #a898c0; }
  .card button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0a6a4a; }
  .card.locked { opacity: .5; filter: grayscale(.7); }
  .prest { text-align: center; padding: 10px 8px; }
  .prest h3 { font-size: 22px; color: #a8ffd8; } .prest p { font-size: 14px; line-height: 1.5; margin: 8px 0; color: #e0d0f4; }
  .prest .big { font-size: 40px; font-weight: 900; color: #a8ffd8; text-shadow: 0 0 16px rgba(120,255,200,.6); }
  .prest button { border: 0; border-radius: 16px; padding: 12px 26px; font: inherit; font-size: 16px; font-weight: 900; color: #0a3a28; background: linear-gradient(#a8ffd8, #3ad89a); box-shadow: 0 4px 0 #0a6a4a; cursor: pointer; }
  .prest button:disabled { background: #5a4a74; box-shadow: 0 4px 0 #241440; color: #a898c0; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: radial-gradient(ellipse at 50% 30%, rgba(90,50,160,.96), rgba(12,6,30,.98)); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 240px; height: 240px; }
  h1 { font-size: clamp(44px, 13.5vw, 72px); font-weight: 900; line-height: .95; color: #fff; -webkit-text-stroke: 3px #5a2a9a; text-shadow: 0 5px 0 #3a1a6a, 0 0 34px rgba(220,160,255,.9); }
  .overlay p { max-width: 320px; font-size: 15px; line-height: 1.55; color: #e8dcff; }
  .overlay .stat b { color: #a8ffd8; }
  .btn { border: 4px solid #f2e0ff; background: linear-gradient(#e0a8ff, #9a4ae8); color: #fff; font: inherit; font-size: 21px; font-weight: 900; letter-spacing: 3px; padding: 14px 46px; border-radius: 40px; cursor: pointer; box-shadow: 0 6px 0 #4a1a7a, 0 0 30px rgba(200,140,255,.6); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><div class="coins" id="coins">0</div><div><span class="ps" id="ps">0 / sec</span><span class="boost" id="boost" style="display:none">x7 STARFALL</span></div></div>
<div class="panel" id="panel">
  <div class="tabs"><button class="on" data-t="spirits">Spirits</button><button data-t="magic">Magic</button><button data-t="seed">🌱 Rebirth</button><button class="mode" id="mode">x1</button></div>
  <div class="list" id="list"></div>
</div>
<div class="overlay" id="menu">
  <canvas id="logo" width="480" height="480"></canvas>
  <h1>MAGIC<br>TREE</h1>
  <p><b>Grow a tree that never stops growing.</b> Pick its glowing fruit, invite fireflies, owls and unicorns to live in its branches, and plant ever stranger trees from its magic seeds.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">GROW</button>
</div>
<div class="overlay hidden" id="away">
  <canvas id="awayArt" width="480" height="480"></canvas>
  <h1>WELCOME<br>BACK!</h1>
  <p id="awayTxt"></p>
  <button class="btn" id="awayBtn">COLLECT</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }

// ---------- idle core: big-number formatting, geometric prices, saves and offline earnings ----------
const Idle = (() => {
  const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td', 'Qad', 'Qid', 'Sxd', 'Spd', 'Ocd', 'Nod', 'Vg'];
  // past the named suffixes: aa, ab, ac … zz
  const letters = i => String.fromCharCode(97 + Math.floor(i / 26) % 26) + String.fromCharCode(97 + i % 26);
  function fmt(n, dec = 2) {
    if (!isFinite(n)) return '∞';
    if (n < 0) return '-' + fmt(-n, dec);
    if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n).toString();
    const e = Math.floor(Math.log10(n) / 3), v = n / Math.pow(10, e * 3);
    const s = e < SUF.length ? SUF[e] : letters(e - SUF.length);
    return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(dec)) + s;
  }
  function fmtTime(s) { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return h ? h + 'h ' + m + 'm' : m ? m + 'm ' + x + 's' : x + 's'; }
  // price of buying n more when `owned` are owned: base * g^owned * (g^n - 1) / (g - 1)
  const cost = (base, g, owned, n = 1) => base * Math.pow(g, owned) * (Math.pow(g, n) - 1) / (g - 1);
  // how many can be afforded with `money`
  function maxAfford(base, g, owned, money) { const c0 = base * Math.pow(g, owned); if (money < c0) return 0; return Math.max(1, Math.floor(Math.log(money * (g - 1) / c0 + 1) / Math.log(g))); }
  // milestone multiplier: x2 at 10, 25, 50, 100, then every 100
  function milestone(owned) { let m = 1; for (const k of [10, 25, 50]) if (owned >= k) m *= 2; if (owned >= 100) m *= Math.pow(2, Math.floor(owned / 100)); return m; }
  function nextMilestone(owned) { for (const k of [10, 25, 50, 100]) if (owned < k) return k; return (Math.floor(owned / 100) + 1) * 100; }
  function load(key, defaults) { let s = null; try { s = JSON.parse(localStorage.getItem(key)); } catch (e) {} return Object.assign(JSON.parse(JSON.stringify(defaults)), s || {}); }
  function save(key, state) { state.seen = Date.now(); try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }
  // seconds since the last save, capped (default 8 hours)
  function away(state, cap = 8 * 3600) { if (!state.seen) return 0; return Math.min(cap, Math.max(0, (Date.now() - state.seen) / 1000)); }
  return { fmt, fmtTime, cost, maxAfford, milestone, nextMilestone, load, save, away };
})();

        r.el.querySelector('.ds').textContent = 'Everything x1.25' + (slotsN() < 20 ? ', +1 fruit' : '') + (S.grow % 3 === 2 && tree.depth < 8 ? ', new branches' : '') + ' · now x' + fmt(Math.pow(1.25, S.grow));
        btn.innerHTML = 'GROW<br>✦ ' + fmt(c); btn.disabled = S.coins < c;
      } else if (r.kind === 'upg') {
        const u2 = r.u, l = lvl(u2.id), c = cost(u2.base, u2.g, l, 1), maxed = u2.max && l >= u2.max; r.el.querySelector('.nm').innerHTML = u2.name + ' <small>Lv ' + l + '</small>'; r.el.querySelector('.ds').textContent = u2.desc(l);
        btn.innerHTML = maxed ? 'MAX' : 'BREW<br>✦ ' + fmt(c); btn.disabled = maxed || S.coins < c;
      } else { const n = seedsAvail(); $('pSeeds').textContent = '🌱 ' + S.seeds + (n > 0 ? '  (+' + n + ')' : ''); $('pTxt').innerHTML = 'Tree #' + S.tree + ': <b>' + tree.sp.name + '</b><br>Lifetime mana: <b>' + fmt(S.life) + '</b><br>' + (n > 0 ? 'Plant now to gain <b>' + n + '</b> seed' + (n > 1 ? 's' : '') + ' (+' + n * 10 + '% forever).' : 'Next seed at ' + fmt(Math.pow(S.seeds + 1, 2) * 1e6) + ' lifetime.'); btn.disabled = n <= 0; }
    }
  }
  window.__mt = { state: () => S, cps, tapValue, fruitValue, buySpirit: i => buySpirit(SPIRITS[i]), buyUpg: i => buyUpg(UPG[i]), grow: growTree, give: v => earn(v), ripenAll: () => slots.forEach(f => f.ripe = 1), slots: () => slots.map(f => ({ x: f.x + skewK() * (f.y - by), y: f.y, ripe: f.ripe })), tree: () => tree, wish: () => wish, spawnWish: () => { wishT = 0; }, catchWish, rebirth };

  // ---------- start, offline ----------
  function begin() { if (!SPR) return; S.started = true; $('menu').classList.add('hidden'); audio.start(); resize(); renderList(true); store(); }
  $('startBtn').onclick = () => {
    const away = Idle.away(S), rate = Math.min(1, .5 + lvl('roots') * .1), earned = S.seen && S.started ? cps() * away * rate : 0;
    if (away > 30) slots.forEach(f => f.ripe = Math.min(1, f.ripe + away / ripenTime(lvl('soil'))));
    if (earned > 1 && away > 30) { earn(earned); $('awayTxt').innerHTML = 'You were away for <b>' + Idle.fmtTime(away) + '</b>.<br>Your forest spirits gathered <b>✦ ' + fmt(earned) + '</b> mana — and the fruit is ripe!'; $('menu').classList.add('hidden'); $('away').classList.remove('hidden'); audio.start(); }
    else begin();
  };
  $('awayBtn').onclick = () => { $('away').classList.add('hidden'); begin(); FX.burst(sceneR.w / 2, sceneR.h / 2, { n: 50, colors: ['#fff6a0', '#a8ffd8', '#e0a8ff'], shape: 'star', speed: 500, size: 10, gravity: 200, life: 1.4, glow: 1 }); audio.sfx(1175, .3, 'sine', .05); };
  $('bestMenu').innerHTML = S.life > 0 ? 'Tree #' + S.tree + ' · Lv <b>' + S.grow + '</b> · mana <b>' + fmt(S.life) + '</b>' + (S.seeds ? ' · 🌱 ' + S.seeds : '') : '';
  addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !S.started) { e.preventDefault(); $('startBtn').click(); } });
  addEventListener('visibilitychange', () => { if (document.hidden) store(); });

  // ---------- loop ----------
  let saveT = 0, uiT = 0;
  function update(dt) {
    t += dt; FX.update(dt); sway = Math.max(0, sway - dt * 1.5);
    for (const l of leaves) { l.vy = Math.min(60, l.vy + 30 * dt); l.x += (l.vx + Math.sin(t * 3 + l.r) * 30) * dt; l.y += l.vy * dt; l.r += l.vr * dt; l.life -= dt; } leaves = leaves.filter(l => l.life > 0 && l.y < by + 30);
    // fireflies drift around the canopy
    const nf = Math.min(24, owned('firefly') ? 3 + owned('firefly') : 0), c = tree.canopy;
    while (flies.length < nf) flies.push({ x: c.x + (Math.random() - .5) * c.rx * 2, y: c.y + (Math.random() - .5) * c.ry * 2, a: Math.random() * 6, p: Math.random() * 6 });
    if (flies.length > nf) flies.length = nf;
    for (const f of flies) { f.a += (Math.random() - .5) * 3 * dt; f.x += Math.cos(f.a) * 18 * dt; f.y += Math.sin(f.a) * 14 * dt; if (((f.x - c.x) / (c.rx * 1.25)) ** 2 + ((f.y - c.y) / (c.ry * 1.3)) ** 2 > 1) f.a = Math.atan2(c.y - f.y, c.x - f.x); }
    if (!S.started) return;
    star = Math.max(0, star - dt);
    earn(cps() * dt);
    const rt = ripenTime(lvl('soil'));
    for (const f of slots) if (f.ripe < 1) { f.ripe += dt / rt; if (f.ripe >= 1) { f.ripe = 1; f.gold = Math.random() < .05; } }
    wishT -= dt; if (wishT <= 0 && !wish) { const dir = Math.random() < .5 ? 1 : -1; wish = { x: dir > 0 ? -50 : sceneR.w + 50, y: 70 + Math.random() * sceneR.h * .25, vx: dir * (80 + Math.random() * 40), vy: 12 }; wishT = (40 + Math.random() * 40) * Math.pow(.85, lvl('well')); audio.sfx(2093, .3, 'sine', .04, 2637); }
    if (wish) { wish.x += wish.vx * dt; wish.y += wish.vy * dt; if (Math.random() < .6) FX.burst(wish.x - Math.sign(wish.vx) * 16, wish.y, { n: 1, colors: ['#fff6a0', '#ffffff', '#e0a8ff'], shape: 'star', speed: 30, size: 5, gravity: 30, life: .9 }); if (wish.x < -80 || wish.x > sceneR.w + 80) wish = null; }
    saveT += dt; if (saveT > 5) { saveT = 0; store(); }
    uiT += dt; if (uiT > .2) { uiT = 0; $('coins').textContent = '✦ ' + fmt(S.coins); $('ps').textContent = fmt(cps()) + ' / sec'; $('boost').style.display = star > 0 ? 'inline-block' : 'none'; if (star > 0) $('boost').textContent = 'x7 STARFALL ' + Math.ceil(star) + 's'; renderList(false); }
  }
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (BG) ctx.drawImage(BG, 0, 0, W, H);
    // twinkling stars on top of the painted sky
    for (let i = 0; i < 30; i++) { const r = rng(i * 7 + 3), x = r() * sceneR.w, y = r() * sceneR.h * .55, a = Math.max(0, Math.sin(t * (1 + r() * 2) + i)); ctx.globalAlpha = a * .9; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 1.2, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (!SPR || !TREE) return;
    const [ox, oy] = FX.offset(); ctx.translate(ox, oy);
    if (star > 0) { const g = ctx.createRadialGradient(tree.canopy.x, tree.canopy.y, 0, tree.canopy.x, tree.canopy.y, tree.canopy.rx * 1.6); g.addColorStop(0, 'rgba(255,240,170,.35)'); g.addColorStop(1, 'rgba(255,240,170,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, sceneR.w, sceneR.h); }
    drawSpirits(false); drawTree(); drawFlies(); drawSpirits(true);
    for (const l of leaves) { ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.r); ctx.globalAlpha = Math.min(1, l.life); ctx.fillStyle = l.c; ctx.beginPath(); ctx.ellipse(0, 0, 5 * u, 2.4 * u, 0, 0, 7); ctx.fill(); ctx.restore(); } ctx.globalAlpha = 1;
    if (wish) { const z = 56; ctx.save(); ctx.translate(wish.x, wish.y); if (wish.vx < 0) ctx.scale(-1, 1); ctx.shadowColor = '#fff6a0'; ctx.shadowBlur = 24 + Math.sin(t * 10) * 8; ctx.drawImage(SPR.star, -z * .7, -z / 2, z, z); ctx.restore(); }
    FX.draw(ctx);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); FX.drawFlash(ctx, W, H);
  }
  function drawLogo(cv) {
    const g = cv.getContext('2d'); g.clearRect(0, 0, 480, 480);
    const glow = g.createRadialGradient(240, 220, 10, 240, 220, 240); glow.addColorStop(0, 'rgba(230,190,255,.7)'); glow.addColorStop(1, 'rgba(230,190,255,0)'); g.fillStyle = glow; g.fillRect(0, 0, 480, 480);
    // a little hand-placed tree for the title
    g.fillStyle = '#2a8a6a'; g.beginPath(); g.ellipse(240, 440, 180, 30, 0, Math.PI, 0); g.fill();
    g.strokeStyle = '#5a3418'; g.lineCap = 'round';
    const br = (x, y, a, l, w, d) => { const x2 = x + Math.sin(a) * l, y2 = y - Math.cos(a) * l; g.lineWidth = w; g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke(); if (d < 5) { br(x2, y2, a - .45, l * .76, w * .68, d + 1); br(x2, y2, a + .42, l * .74, w * .68, d + 1); } else for (let k = 0; k < 3; k++) { const gr = g.createRadialGradient(x2 - 4, y2 - 4, 2, x2, y2, 22); gr.addColorStop(0, '#d8ffb0'); gr.addColorStop(.5, '#5ac87a'); gr.addColorStop(1, '#1a6a4a'); g.fillStyle = gr; g.beginPath(); g.arc(x2 + (k - 1) * 9, y2 + (k % 2) * 6, 18, 0, 7); g.fill(); } };
    br(240, 430, 0, 110, 30, 0);
    [[160, 200], [300, 150], [230, 240], [340, 250], [130, 280]].forEach(([x, y], i) => { g.globalCompositeOperation = 'lighter'; g.drawImage(GLOW, x - 30, y - 30, 60, 60); g.globalCompositeOperation = 'source-over'; g.drawImage(SPR[['apple', 'goldfruit', 'plum', 'peach', 'pear'][i]], x - 20, y - 20, 40, 40); });
    g.drawImage(SPR.owl, 210, 260, 60, 60); g.drawImage(SPR.unicorn, 20, 330, 120, 120); g.drawImage(SPR.pixie, 360, 90, 80, 80); g.drawImage(SPR.star, 40, 40, 90, 90);
  }

  resize();
  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
