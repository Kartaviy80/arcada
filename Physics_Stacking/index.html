<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#87c4ff">
<title>Tower Stack</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87c4ff;
    font-family: "Helvetica Neue", "Segoe UI", Arial, sans-serif; color: #fff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(18px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; }
  .hud b { font-size: 64px; font-weight: 800; text-shadow: 0 4px 14px #0004; }
  .hud div { font-size: 14px; letter-spacing: 3px; opacity: .9; min-height: 18px; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: 24px; text-align: center; background: linear-gradient(#0000, #0006); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  h1 { font-size: clamp(44px, 13vw, 80px); font-weight: 900; letter-spacing: -2px; line-height: .9; text-shadow: 0 6px 20px #0005; }
  p { max-width: 300px; font-size: 16px; line-height: 1.5; text-shadow: 0 2px 6px #0006; }
  .stat { font-size: 18px; letter-spacing: 2px; } .stat b { font-size: 26px; }
  .btn { border: none; background: #fff; color: #2b5d9c; font: inherit; font-weight: 800; font-size: 20px; letter-spacing: 3px; padding: 16px 48px;
    border-radius: 999px; cursor: pointer; box-shadow: 0 10px 30px #0004; }
  .btn:active { transform: scale(.96); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b id="score">0</b><div id="combo"></div></div>

<div class="overlay" id="menu">
  <h1>TOWER<br>STACK</h1>
  <p>Tap to drop each floor. Whatever hangs over the edge gets sliced off. Land it <b>perfectly</b> to keep your width!</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">BUILD</button>
</div>
<div class="overlay hidden" id="over">
  <h1>TOPPED<br>OUT</h1>
  <div class="stat">FLOORS <b id="finalScore">0</b></div>
  <div class="stat">BEST <b id="bestOver">0</b></div>
  <button class="btn" id="againBtn">AGAIN</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const audio = GameAudio({
    bpm: 108, scale: 'major', root: 62, prog: [0, 4, 5, 3], seed: 201,
    waves: { lead: 'triangle', bass: 'sine', arp: 'sine', pad: 'sine' },
    pad: true, arp: true, arpEvery: 2, arpOct: 1, leadDensity: 0.3, drums: 'soft', volume: 0.17,
    btnBg: 'rgba(255,255,255,.3)'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'tower_stack_best';
  let best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const showBest = () => { $('bestMenu').innerHTML = best ? 'BEST <b>' + best + '</b>' : ''; }; showBest();

  let W, H, DPR, S, LW, LH;
  const BH = 34, BASE_W = 220;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    S = Math.min(W / 400, H / 680); LW = W / S; LH = H / S;
  }
  addEventListener('resize', resize); resize();

  let state = 'menu', blocks, cur, camY, combo, pieces, t = 0, flash = 0, popTxt = '', popT = 0;
  function reset() {
    blocks = [{ x: 0, w: BASE_W, y: 0 }];
    for (let i = 1; i < 4; i++) blocks.push({ x: 0, w: BASE_W, y: i * BH, base: true });
    combo = 0; pieces = []; camY = 0;
    newBlock();
  }
  function newBlock() {
    const top = blocks[blocks.length - 1];
    const from = blocks.length % 2 ? -1 : 1;
    cur = { x: from * (LW / 2 + top.w / 2), w: top.w, y: top.y + BH, dir: -from, speed: 170 + Math.min(260, (blocks.length - 4) * 7) };
  }
  reset();
  const floors = () => blocks.length - 4;

  function start() {
    reset(); state = 'play'; audio.start();
    $('menu').classList.add('hidden'); $('over').classList.add('hidden');
  }
  function gameOver() {
    state = 'over';
    const s = floors(); if (s > best) { best = s; try { localStorage.setItem(KEY, best); } catch (e) {} }
    $('finalScore').textContent = s; $('bestOver').textContent = best; showBest();
    setTimeout(() => $('over').classList.remove('hidden'), 700);
  }
  const NOTES = [0, 2, 4, 5, 7, 9, 11, 12];
  function drop() {
    if (state !== 'play' || !cur) return;
    const top = blocks[blocks.length - 1];
    const d = cur.x - top.x;
    if (Math.abs(d) < 5) {
      combo++;
      cur.x = top.x;
      if (combo >= 3) cur.w = Math.min(BASE_W, cur.w + 10);
      flash = 0.3; popTxt = combo > 1 ? 'PERFECT ×' + combo : 'PERFECT'; popT = 1;
      audio.sfx(440 * Math.pow(2, NOTES[Math.min(7, combo - 1)] / 12), 0.25, 'sine', 0.09);
      blocks.push({ x: cur.x, w: cur.w, y: cur.y });
    } else {
      combo = 0;
      const overlap = cur.w - Math.abs(d);
      if (overlap <= 0) {
        pieces.push({ x: cur.x, w: cur.w, y: cur.y, vx: cur.dir * 60, vy: 0, rot: 0, vr: cur.dir * 2 });
        cur = null; audio.sfx(160, 0.5, 'sawtooth', 0.08, 50); gameOver(); return;
      }
      const nx = top.x + d / 2;
      const cutW = Math.abs(d), cutX = d > 0 ? nx + overlap / 2 + cutW / 2 : nx - overlap / 2 - cutW / 2;
      pieces.push({ x: cutX, w: cutW, y: cur.y, vx: Math.sign(d) * 80, vy: 0, rot: 0, vr: Math.sign(d) * 3 });
      blocks.push({ x: nx, w: overlap, y: cur.y });
      audio.sfx(260, 0.12, 'triangle', 0.07, 180);
    }
    newBlock();
  }

  canvas.addEventListener('pointerdown', drop);
  addEventListener('keydown', e => {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    e.preventDefault();
    if (state !== 'play') { if (state === 'menu' || !$('over').classList.contains('hidden')) start(); } else drop();
  });
  $('startBtn').onclick = start; $('againBtn').onclick = start;

  function update(dt) {
    t += dt;
    if (cur && state === 'play') {
      cur.x += cur.dir * cur.speed * dt;
      const lim = LW / 2 + 10;
      if (cur.x > lim) { cur.x = lim; cur.dir = -1; } else if (cur.x < -lim) { cur.x = -lim; cur.dir = 1; }
    }
    const topY = blocks[blocks.length - 1].y;
    const target = Math.max(0, topY - LH * 0.42);
    camY += (target - camY) * Math.min(1, dt * 4);
    for (const p of pieces) { p.vy -= 1400 * dt; p.y += p.vy * dt; p.x += p.vx * dt; p.rot += p.vr * dt; }
    pieces = pieces.filter(p => p.y > camY - 300);
    flash = Math.max(0, flash - dt); popT = Math.max(0, popT - dt);
  }

  // block colour cycles with height
  const hue = i => (205 + i * 9) % 360;
  function drawBlock(b, i, alpha = 1) {
    const sx = LW / 2 + b.x - b.w / 2, sy = LH * 0.88 - (b.y - camY) - BH;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'hsl(' + hue(i) + ',55%,62%)'; ctx.fillRect(sx, sy, b.w, BH);
    ctx.fillStyle = 'hsl(' + hue(i) + ',60%,72%)'; ctx.fillRect(sx, sy, b.w, 5);
    ctx.fillStyle = 'hsl(' + hue(i) + ',45%,48%)'; ctx.fillRect(sx, sy + BH - 4, b.w, 4);
    // windows
    const lit = (t * 0.3 + i) % 3 < 1.5;
    for (let wx = sx + 10; wx < sx + b.w - 14; wx += 20) {
      ctx.fillStyle = (Math.floor(wx + i * 7) % 3 === 0 && lit) ? '#fff6c4' : 'hsla(' + hue(i) + ',50%,30%,.55)';
      ctx.fillRect(wx, sy + 11, 10, 14);
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // sky darkens as the tower rises: day → dusk → night → space
    const k = Math.min(1, camY / 3000);
    const top = 'hsl(' + (210 + k * 30) + ',' + (75 - k * 30) + '%,' + (70 - k * 62) + '%)';
    const bot = 'hsl(' + (200 - k * 170) + ',' + (80 - k * 10) + '%,' + (85 - k * 45) + '%)';
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.scale(S, S);
    // stars at altitude
    if (k > 0.4) for (let i = 0; i < 60; i++) { ctx.fillStyle = 'rgba(255,255,255,' + ((k - 0.4) * 1.6 * (0.4 + 0.6 * Math.abs(Math.sin(t + i)))) + ')'; ctx.fillRect((i * 97.3) % LW, (i * 53.7 + camY * 0.05) % LH, 2, 2); }
    // clouds drifting past
    for (let i = 0; i < 6; i++) {
      const cy = LH - ((i * 420 - camY * 0.6) % 2600 + 2600) % 2600 + 200, cx = ((i * 173 + t * (8 + i * 3)) % (LW + 200)) - 100;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.7 - k * 0.5) + ')';
      for (let j = 0; j < 4; j++) { ctx.beginPath(); ctx.arc(cx + j * 24, cy + (j % 2) * 6, 20 + (j % 2) * 8, 0, Math.PI * 2); ctx.fill(); }
    }
    // city skyline at the bottom
    const groundY = LH * 0.88 + camY;
    if (groundY < LH + 200) {
      for (let i = 0; i < 16; i++) {
        const bw = 30 + (i * 37) % 40, bh = 60 + (i * 71) % 140, bx = (i * 61) % (LW + 60) - 30;
        ctx.fillStyle = 'hsla(220,30%,35%,.6)'; ctx.fillRect(bx, groundY - bh, bw, bh);
      }
      ctx.fillStyle = '#4b6b4f'; ctx.fillRect(0, groundY, LW, 400);
    }
    blocks.forEach((b, i) => drawBlock(b, i));
    if (cur && state === 'play') drawBlock(cur, blocks.length);
    for (const p of pieces) {
      const sx = LW / 2 + p.x, sy = LH * 0.88 - (p.y - camY) - BH / 2;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(p.rot);
      ctx.fillStyle = 'hsl(' + hue(blocks.length) + ',55%,62%)'; ctx.fillRect(-p.w / 2, -BH / 2, p.w, BH);
      ctx.restore();
    }
    if (flash > 0) {
      const tb = blocks[blocks.length - 1], sx = LW / 2 + tb.x - tb.w / 2, sy = LH * 0.88 - (tb.y - camY) - BH;
      ctx.strokeStyle = 'rgba(255,255,255,' + flash * 3 + ')'; ctx.lineWidth = 4;
      ctx.strokeRect(sx - (0.3 - flash) * 40, sy - (0.3 - flash) * 40, tb.w + (0.3 - flash) * 80, BH + (0.3 - flash) * 80);
    }
    ctx.restore();
    $('score').textContent = state === 'menu' ? '' : floors();
    $('combo').textContent = popT > 0 ? popTxt : '';
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
