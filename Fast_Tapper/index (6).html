<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08031a">
<title>Neon Tiles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #08031a;
    font-family: "Avenir Next", "Segoe UI", sans-serif; color: #fff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(60,10,90,.94), rgba(4,2,14,.97)); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 250px; height: 250px; }
  h1 { font-size: clamp(44px, 13.5vw, 74px); font-weight: 900; letter-spacing: 4px; line-height: .95; color: #fff;
    text-shadow: 0 0 6px #fff, 0 0 18px #ff2ad8, 0 0 40px #ff2ad8, 0 0 70px #7a2aff; }
  p { max-width: 320px; font-size: 15px; line-height: 1.6; color: #d8c8ff; }
  .stat { font-size: 17px; font-weight: 800; color: #d8c8ff; } .stat b { color: #2af0ff; }
  .big { font-size: 46px; font-weight: 900; color: #2af0ff; text-shadow: 0 0 18px #2af0ff; }
  .btn { border: 3px solid #ff2ad8; background: rgba(40,0,50,.6); color: #fff; font: inherit; font-size: 21px; font-weight: 900; letter-spacing: 6px; padding: 14px 50px; border-radius: 12px; cursor: pointer;
    box-shadow: 0 0 16px #ff2ad8, inset 0 0 16px #ff2ad8; text-shadow: 0 0 10px #ff2ad8; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 30px #ff2ad8, inset 0 0 24px #ff2ad8; transform: scale(1.04); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay" id="menu">
  <canvas id="logo" width="500" height="500"></canvas>
  <h1>NEON<br>TILES</h1>
  <p><b>Play the song with your fingers.</b> Tap the glowing tiles as they reach the line — every tile is a note. Hold the long ones. Miss a tile or tap an empty lane and the song stops.</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">PLAY</button>
</div>
<div class="overlay hidden" id="clear">
  <canvas id="clearArt" width="500" height="500"></canvas>
  <h1>TRACK<br>CLEAR</h1>
  <div class="stat">Track <b id="clrStage">1</b> · accuracy <b id="clrAcc">0%</b></div>
  <div class="big" id="clrScore">0</div>
  <button class="btn" id="nextBtn">NEXT TRACK</button>
</div>
<div class="overlay hidden" id="over">
  <h1>SONG<br>STOPPED</h1>
  <div class="big" id="ovScore">0</div>
  <div class="stat" id="ovBest">Best: 0</div>
  <button class="btn" id="againBtn">REPLAY</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = o.n || 14;
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }
        else if (p.shape === 'star') { ctx.rotate(p.rot); star(ctx, p.size); }
        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }
        else if (p.shape === 'heart') { ctx.rotate(p.rot * .2); heart(ctx, p.size); }
        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * (.4 + k * .6), 0, TAU); ctx.fill(); }
        ctx.restore(); ctx.shadowBlur = 0;
      }
      for (const t of texts) {
        const age = t.max - t.life, pop = age < .18 ? 1 + Math.sin(age / .18 * Math.PI) * .45 : 1, a = Math.min(1, t.life / t.max * 2.2);
        ctx.save(); ctx.globalAlpha = a; ctx.translate(t.x, t.y); ctx.scale(pop, pop); if (t.wobble) ctx.rotate(Math.sin(age * 20) * t.wobble);
        ctx.font = t.font + t.size + 'px "Avenir Next", "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, t.size * .16); ctx.strokeStyle = t.stroke; ctx.strokeText(t.str, 0, 0); ctx.fillStyle = t.c; ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },
    drawFlash(ctx, W, H) { if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  };
})();
/*FX-END*/
(() => {
  // the tiles themselves are the music, so the background track is only a quiet pad and beat
  const audio = GameAudio({
    bpm: 120, scale: 'minor', root: 45, prog: [0, 5, 3, 4], seed: 807,
    waves: { lead: 'sine', bass: 'triangle', arp: 'sine', pad: 'sawtooth' },
    pad: true, arp: false, leadDensity: 0, drums: 'soft', bassPattern: [0, 8], volume: 0.09,
    btnBg: 'rgba(255,42,216,.15)', btnColor: '#ff2ad8'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'neon_tiles';
  let save = { stage: 1, best: 0 }; try { save = Object.assign(save, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
  $('bestMenu').innerHTML = save.best ? 'Best score <b>' + save.best + '</b> · track <b>' + save.stage + '</b>' : '';

  // ---------- endless tracks: a seeded melody generator per track ----------
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const SCALES = [[0, 2, 3, 5, 7, 8, 10], [0, 2, 4, 7, 9], [0, 3, 5, 7, 10], [0, 2, 4, 5, 7, 9, 11], [0, 2, 3, 5, 7, 9, 10]];
  const NAMES = ['Midnight', 'Neon', 'Electric', 'Velvet', 'Crystal', 'Laser', 'Cosmic', 'Retro', 'Pixel', 'Ultra', 'Chrome', 'Static'];
  const NAMES2 = ['Drive', 'Pulse', 'Dreams', 'Runner', 'Skyline', 'Heart', 'Waves', 'Arcade', 'Rain', 'Echo', 'Lights', 'Rush'];
  function track(n) {
    const r = rng(n * 1291 + 5), sc = SCALES[Math.floor(r() * SCALES.length)], root = 57 + Math.floor(r() * 7);
    const lanes = 4, rows = Math.min(160, 40 + n * 6), speed = Math.min(8.5, 2.6 + n * .22), notes = [];
    // a melody that walks the scale with occasional leaps, phrased in 4-row bars
    let deg = Math.floor(sc.length / 2), lane = Math.floor(r() * lanes), motif = Array.from({ length: 4 }, () => Math.floor(r() * 5) - 2);
    for (let i = 0; i < rows; i++) {
      if (i % 16 === 0) motif = Array.from({ length: 4 }, () => Math.floor(r() * 5) - 2);
      deg += motif[i % 4] + (r() < .15 ? (r() < .5 ? -3 : 3) : 0); deg = Math.max(0, Math.min(sc.length * 2 - 1, deg));
      const midi = root + sc[deg % sc.length] + 12 * Math.floor(deg / sc.length) - 12;
      let nl; do { nl = Math.floor(r() * lanes); } while (nl === lane && r() < .7); lane = nl;
      const long = n >= 3 && r() < Math.min(.22, .06 + n * .01) ? 2 + Math.floor(r() * 2) : 1;
      const chord = n >= 5 && r() < Math.min(.18, .03 + n * .008) && long === 1;
      notes.push({ row: i, lane, midi, len: long, chord });
      if (long > 1) i += long - 1;
    }
    return { name: NAMES[Math.floor(r() * NAMES.length)] + ' ' + NAMES2[Math.floor(r() * NAMES2.length)], notes, lanes, speed, hue: Math.floor(r() * 360) };
  }

  // ---------- state ----------
  let W, H, DPR, T = null, tiles = [], phase = 'menu', t = 0, stage = 1, score = 0, shown = 0, combo = 0, best = 0, pos = 0, hitLine = 0, laneW = 0, rowH = 0, hits = 0, perfect = 0, flashLane = [], holds = {}, endT = 0, grid = 0, beat = 0, fail = null;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; canvas.width = W * DPR; canvas.height = H * DPR;
    const pw = Math.min(W, 520); laneW = pw / 4; rowH = Math.min(H / 4.2, laneW * 1.55); hitLine = H - rowH * .9;
  }
  addEventListener('resize', resize);
  const X0 = () => (W - laneW * 4) / 2;
  const tileY = r => hitLine - (r - pos) * rowH; // row r's bottom edge

  // ---------- flow ----------
  function startStage(n) {
    stage = n; T = track(n); tiles = []; for (const nt of T.notes) { tiles.push({ ...nt, hit: false, held: 0 }); if (nt.chord) tiles.push({ ...nt, lane: (nt.lane + 2) % 4, midi: nt.midi + 4, chord: false, hit: false, held: 0 }); }
    pos = -3.2; combo = 0; hits = 0; perfect = 0; flashLane = [0, 0, 0, 0]; holds = {}; endT = 0; fail = null; FX.clear(); phase = 'play';
    resize(); for (const o of ['menu', 'clear', 'over']) $(o).classList.add('hidden');
  }
  $('startBtn').onclick = () => { score = 0; shown = 0; audio.start(); startStage(save.stage); };
  $('againBtn').onclick = () => { score = 0; shown = 0; startStage(save.stage); };
  $('nextBtn').onclick = () => startStage(stage + 1);
  addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && phase === 'menu') { e.preventDefault(); $('startBtn').click(); return; } const k = 'dfjk'.indexOf(e.key.toLowerCase()); if (k >= 0 && !e.repeat) press(k, 'key' + k); });
  addEventListener('keyup', e => { const k = 'dfjk'.indexOf(e.key.toLowerCase()); if (k >= 0) release('key' + k); });

  // tile notes: a bright plucked synth voiced by the tile's pitch
  let actx = null;
  function note(midi, dur = .35, vol = .12) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const f = 440 * Math.pow(2, (midi - 69) / 12), now = actx.currentTime, g = actx.createGain(), o1 = actx.createOscillator(), o2 = actx.createOscillator(), flt = actx.createBiquadFilter();
      o1.type = 'triangle'; o2.type = 'sawtooth'; o1.frequency.value = f; o2.frequency.value = f * 2.003; flt.type = 'lowpass'; flt.frequency.setValueAtTime(f * 8, now); flt.frequency.exponentialRampToValueAtTime(f * 1.5, now + dur);
      const g2 = actx.createGain(); g2.gain.value = .25; o2.connect(g2); g2.connect(flt); o1.connect(flt); flt.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(vol, now + .008); g.gain.exponentialRampToValueAtTime(.001, now + dur);
      o1.start(now); o2.start(now); o1.stop(now + dur + .05); o2.stop(now + dur + .05);
    } catch (e) {}
  }
  const ptrs = {};
  canvas.addEventListener('pointerdown', e => { const lane = Math.floor((e.clientX - X0()) / laneW); if (lane >= 0 && lane < 4) { ptrs[e.pointerId] = 'p' + e.pointerId; press(lane, 'p' + e.pointerId, e.clientX, e.clientY); } });
  addEventListener('pointerup', e => release('p' + e.pointerId)); addEventListener('pointercancel', e => release('p' + e.pointerId));
  function press(lane, id, x, y) {
    if (phase !== 'play') return;
    flashLane[lane] = 1;
    if (pos < -.6) return; // nothing to hit yet during the count-in
    // the lowest unhit tile in this lane that is near the hit line
    let best = null;
    for (const tl of tiles) { if (tl.hit || tl.lane !== lane) continue; const bot = tileY(tl.row), top = bot - rowH * tl.len; if (bot > hitLine - rowH * 2.2 && top < H) { if (!best || tl.row < best.row) best = tl; } }
    if (!best) { return lose(lane, 'Wrong lane!'); }
    // tapping too early (tile still far above) counts as a miss
    const bot = tileY(best.row); if (bot < hitLine - rowH * 1.9) return lose(lane, 'Too early!');
    best.hit = true; hits++; combo++;
    const acc = Math.abs(bot - hitLine) / rowH, perf = acc < .45; if (perf) perfect++;
    const mult = 1 + Math.min(4, Math.floor(combo / 20)), pts = (perf ? 3 : 2) * mult; score += pts;
    note(best.midi, best.len > 1 ? .9 : .4);
    const cx = X0() + (lane + .5) * laneW, cy = Math.min(hitLine, bot) - rowH * .5;
    FX.burst(cx, cy, { n: perf ? 14 : 8, colors: ['hsl(' + ((T.hue + lane * 40) % 360) + ',100%,65%)', '#ffffff'], shape: 'spark', speed: 380, size: 6, gravity: 0, life: .35, glow: 1 });
    FX.ring(cx, cy, { color: 'hsl(' + ((T.hue + lane * 40) % 360) + ',100%,70%)', r0: laneW * .2, r1: laneW * .7, width: 4, life: .3 });
    FX.text(cx, cy - 30, perf ? 'PERFECT' : 'GOOD', { color: perf ? '#2af0ff' : '#ffe24a', size: 18, stroke: '#08031a', rise: 50, life: .5 });
    if (combo % 25 === 0) { FX.text(W / 2, H * .3, combo + ' COMBO!', { color: '#ff2ad8', size: 44, stroke: '#ffffff', wobble: .06, life: 1 }); FX.flash('#ff2ad8', .15); }
    if (best.len > 1) holds[id] = best;
  }
  function release(id) { const tl = holds[id]; if (!tl) return; delete holds[id]; }
  function lose(lane, why) {
    if (phase !== 'play') return; phase = 'fail'; fail = { lane, t: 0, why }; endT = 0;
    FX.shake(12, .4); FX.flash('#ff2a4a', .45); audio.sfx(110, .6, 'sawtooth', .08, 55); note(40, .8, .1);
    save.best = Math.max(save.best, score); store();
    setTimeout(() => { $('ovScore').textContent = score; $('ovBest').textContent = why + ' · best ' + save.best + ' · track ' + stage; $('over').classList.remove('hidden'); }, 1300);
  }
  function stageClear() {
    phase = 'clearing'; const acc = Math.round(perfect / Math.max(1, hits) * 100), bonus = acc * 5; score += bonus;
    save.stage = stage + 1; save.best = Math.max(save.best, score); store();
    FX.burst(W / 2, H * .45, { n: 100, colors: ['#ff2ad8', '#2af0ff', '#ffe24a', '#ffffff', '#7a2aff'], shape: 'spark', speed: 700, size: 8, gravity: 0, life: 1.4, glow: 1 });
    [0, 4, 7, 12, 16].forEach((s, k) => setTimeout(() => note(T.notes[0].midi + s, .5, .1), k * 110));
    setTimeout(() => { $('clrStage').textContent = stage; $('clrAcc').textContent = acc + '%'; $('clrScore').textContent = score; $('clear').classList.remove('hidden'); }, 1200);
  }
  window.__nt = { phase: () => phase, stage: () => stage, score: () => score, track, next: () => { const c = tiles.filter(tl => !tl.hit).sort((a, b) => a.row - b.row); return c.slice(0, 4).map(tl => ({ lane: tl.lane, y: tileY(tl.row), row: tl.row })); }, press: l => press(l, 'bot'), hitLine: () => hitLine, rowH: () => rowH };

  // ---------- update ----------
  function update(dt) {
    t += dt; FX.update(dt); shown += (score - shown) * Math.min(1, dt * 12); if (Math.abs(score - shown) < .5) shown = score;
    for (let i = 0; i < 4; i++) flashLane[i] = Math.max(0, flashLane[i] - dt * 5);
    if (phase === 'fail' && fail) { fail.t += dt; return; }
    if (phase !== 'play' && phase !== 'clearing') return;
    const speed = T.speed * (1 + Math.min(.25, Math.max(0, pos) / T.notes.length * .25)); // a gentle ramp inside each track
    pos += speed * dt; beat += dt * speed;
    for (const [id, tl] of Object.entries(holds)) { tl.held = Math.min(tl.len, tl.held + speed * dt); if (Math.random() < .5) FX.burst(X0() + (tl.lane + .5) * laneW, hitLine - rowH * .2, { n: 1, colors: ['#ffffff', 'hsl(' + T.hue + ',100%,70%)'], speed: 200, size: 4, gravity: 0, dir: -Math.PI / 2, spread: 1, life: .3 }); if (tl.held >= tl.len) { score += 4; delete holds[id]; } }
    if (phase === 'play') {
      for (const tl of tiles) if (!tl.hit && tileY(tl.row) - rowH > hitLine + rowH * .25) { // passed the line entirely
        tl.hit = true; return lose(tl.lane, 'Missed a tile!');
      }
      if (tiles.every(tl => tl.hit)) stageClear();
    }
  }

  // ---------- render ----------
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const [ox, oy] = FX.offset(); ctx.translate(ox, oy);
    const hue = T ? T.hue : 290;
    // synthwave backdrop: gradient sky, striped sun, perspective grid scrolling with the beat
    const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#08031a'); bg.addColorStop(.5, 'hsl(' + ((hue + 280) % 360) + ',70%,14%)'); bg.addColorStop(1, '#08031a'); ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
    for (let i = 0; i < 60; i++) { ctx.fillStyle = 'rgba(255,255,255,' + (.2 + .5 * Math.abs(Math.sin(t + i))) + ')'; ctx.fillRect((i * 97.3) % W, (i * 31.7) % (H * .4), 1.5, 1.5); }
    const sy = H * .38, sr = Math.min(W, H) * .22, sun = ctx.createLinearGradient(0, sy - sr, 0, sy + sr); sun.addColorStop(0, '#ffe24a'); sun.addColorStop(.5, '#ff6a3a'); sun.addColorStop(1, '#ff2ad8');
    ctx.save(); ctx.shadowColor = '#ff6a3a'; ctx.shadowBlur = 40; ctx.fillStyle = sun; ctx.beginPath(); ctx.arc(W / 2, sy, sr, Math.PI, 0); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#08031a'; for (let k = 0; k < 6; k++) ctx.fillRect(W / 2 - sr, sy - sr * .55 + k * sr * .12, sr * 2, 2 + k * 1.6);
    // mountains
    ctx.fillStyle = 'hsl(' + ((hue + 260) % 360) + ',60%,10%)'; ctx.beginPath(); ctx.moveTo(0, sy); for (let x = 0; x <= W; x += 30) ctx.lineTo(x, sy - 30 - 40 * Math.abs(Math.sin(x * .013 + 1))); ctx.lineTo(W, sy); ctx.fill();
    ctx.strokeStyle = 'rgba(255,42,216,.32)'; ctx.lineWidth = 1.5;
    for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 20, sy); ctx.lineTo(W / 2 + i * W * .18, H); ctx.stroke(); }
    for (let k = 0; k < 14; k++) { const u = ((k + (beat * .5) % 1) / 14), y = sy + (H - sy) * u * u; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    if (!T || phase === 'menu') { FX.draw(ctx); return; }
    // lanes: dark glass panel
    const x0 = X0(); ctx.fillStyle = 'rgba(8,3,26,.62)'; ctx.fillRect(x0, 0, laneW * 4, H);
    for (let i = 0; i <= 4; i++) { ctx.strokeStyle = 'hsla(' + ((hue + i * 40) % 360) + ',100%,65%,.4)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x0 + i * laneW, 0); ctx.lineTo(x0 + i * laneW, H); ctx.stroke(); }
    for (let i = 0; i < 4; i++) if (flashLane[i]) { const g = ctx.createLinearGradient(0, hitLine, 0, 0); g.addColorStop(0, 'hsla(' + ((hue + i * 40) % 360) + ',100%,65%,' + flashLane[i] * .5 + ')'); g.addColorStop(1, 'hsla(0,0%,100%,0)'); ctx.fillStyle = g; ctx.fillRect(x0 + i * laneW, 0, laneW, hitLine); }
    // tiles
    for (const tl of tiles) {
      const bot = tileY(tl.row), top = bot - rowH * tl.len; if (bot < -10 || top > H + 10) continue;
      const x = x0 + tl.lane * laneW + 4, w = laneW - 8, col = 'hsl(' + ((hue + tl.lane * 40) % 360) + ',100%,62%)';
      if (tl.hit && !(tl.len > 1 && tl.held < tl.len && Object.values(holds).includes(tl))) {
        if (bot - rowH * tl.len < H) { ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(x, top, w, bot - top); }
        continue;
      }
      ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 18;
      const g = ctx.createLinearGradient(x, top, x + w, bot); g.addColorStop(0, 'rgba(20,6,40,.95)'); g.addColorStop(1, 'rgba(40,10,70,.95)'); ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, top + 3, w, bot - top - 6, 10); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.roundRect(x + 6, top + 8, w - 12, 8, 4); ctx.fill();
      if (tl.len > 1) {
        // hold bar fills as you hold
        const fill = (tl.held / tl.len) * (bot - top - 6); ctx.fillStyle = col; ctx.globalAlpha = .55; ctx.fillRect(x + w / 2 - 6, bot - 3 - fill, 12, fill); ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + w / 2, top + 20); ctx.lineTo(x + w / 2, bot - 20); ctx.stroke();
      }
      // musical note glyph
      ctx.fillStyle = col; ctx.font = '900 ' + Math.min(w * .45, 34) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(tl.len > 1 ? '♫' : '♪', x + w / 2, bot - rowH * .5);
    }
    // the hit line
    ctx.save(); ctx.shadowColor = '#2af0ff'; ctx.shadowBlur = 16; ctx.strokeStyle = '#2af0ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, hitLine); ctx.lineTo(x0 + laneW * 4, hitLine); ctx.stroke(); ctx.restore();
    if (fail) { const a = Math.max(0, .7 - fail.t * .3) * (Math.sin(fail.t * 20) > 0 ? 1 : .5); ctx.fillStyle = 'rgba(255,42,74,' + a + ')'; ctx.fillRect(x0 + fail.lane * laneW, 0, laneW, H); }
    FX.draw(ctx);
    // HUD
    const label = (txt, x, y, size, col, align = 'center') => { ctx.save(); ctx.font = '900 ' + size + 'px "Avenir Next", sans-serif'; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.fillStyle = col; ctx.fillText(txt, x, y); ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.globalAlpha = .7; ctx.fillText(txt, x, y); ctx.restore(); };
    label(Math.round(shown).toLocaleString(), W / 2, 40, 42, '#ff2ad8');
    label('TRACK ' + stage + ' · ' + T.name, W / 2, 76, 14, '#2af0ff');
    const k = Math.min(1, hits / tiles.length); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(x0, 90, laneW * 4, 4); ctx.fillStyle = '#2af0ff'; ctx.fillRect(x0, 90, laneW * 4 * k, 4);
    if (combo >= 5) label(combo + ' combo' + (combo >= 20 ? '  x' + (1 + Math.min(4, Math.floor(combo / 20))) : ''), W / 2, 112, 16, '#ffe24a');
    if (pos < 0 && phase === 'play') label(Math.ceil(-pos / T.speed * 1.0) > 0 ? 'GET READY' : '', W / 2, H * .5, 30, '#ffe24a');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); FX.drawFlash(ctx, W, H);
  }
  function art(cv, mode) {
    const g = cv.getContext('2d'), c = 250;
    const sun = g.createLinearGradient(0, 120, 0, 340); sun.addColorStop(0, '#ffe24a'); sun.addColorStop(.5, '#ff6a3a'); sun.addColorStop(1, '#ff2ad8');
    g.shadowColor = '#ff6a3a'; g.shadowBlur = 40; g.fillStyle = sun; g.beginPath(); g.arc(c, 300, 140, Math.PI, 0); g.fill(); g.shadowBlur = 0; g.fillStyle = '#08031a'; for (let k = 0; k < 6; k++) g.fillRect(c - 140, 220 + k * 14, 280, 3 + k * 2);
    g.strokeStyle = 'rgba(255,42,216,.5)'; g.lineWidth = 2; for (let i = -8; i <= 8; i++) { g.beginPath(); g.moveTo(c + i * 14, 300); g.lineTo(c + i * 60, 500); g.stroke(); } for (let k = 0; k < 7; k++) { const y = 300 + k * k * 4.4; g.beginPath(); g.moveTo(0, y); g.lineTo(500, y); g.stroke(); }
    const cols = ['#ff2ad8', '#7a2aff', '#2af0ff', '#ffe24a'];
    for (let i = 0; i < 4; i++) { const x = 70 + i * 92, y = 60 + ((i * 53) % 120) + (mode ? 30 : 0); g.shadowColor = cols[i]; g.shadowBlur = 20; g.fillStyle = 'rgba(20,6,40,.9)'; g.beginPath(); g.roundRect(x, y, 80, 120, 12); g.fill(); g.strokeStyle = cols[i]; g.lineWidth = 4; g.stroke(); g.shadowBlur = 0; g.fillStyle = cols[i]; g.font = '900 48px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('♪', x + 40, y + 62); }
  }
  art($('logo'), 0); art($('clearArt'), 1);

  resize();
  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
