<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<title>2048</title>
<style>
:root{--bg:#101522;--panel:#1a2233;--text:#f5f7ff;--muted:#9ba8c2;--accent:#9d8cff;--gap:clamp(5px,1.6vw,10px);--board:#252e42}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
body{height:100dvh}
button{font:inherit;border:0;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100dvh;width:100%;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);overflow:hidden}
.shell{width:min(100%,470px);max-height:100%;display:flex;flex-direction:column;gap:clamp(8px,1.7vh,14px);justify-content:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:clamp(40px,10vw,52px);height:clamp(40px,10vw,52px);border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#c7baff,#8273ed);color:#19182e;font-weight:950;font-size:clamp(21px,6vw,29px);box-shadow:0 7px 22px #7668e533}
h1{font-size:clamp(23px,6.5vw,34px);line-height:1;margin:0;letter-spacing:-1.2px}
.subtitle{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.08em;text-transform:uppercase}
.scorebox{background:var(--panel);border:1px solid #ffffff0c;border-radius:12px;padding:7px 12px;min-width:76px;text-align:center}
.scorebox small{display:block;color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.score{font-size:21px;font-weight:850;font-variant-numeric:tabular-nums;line-height:1.2}
.board{width:min(100%, calc(100dvh - 255px));width:min(100%, 54dvh);aspect-ratio:1;align-self:center;background:var(--board);padding:var(--gap);border-radius:16px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:var(--gap);box-shadow:0 18px 45px #0004;touch-action:none;user-select:none}
.cell{min-width:0;min-height:0;border-radius:9px;background:#353f55;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,7vw,35px);font-weight:850;letter-spacing:-1px;color:#f8f7ff;transition:background .08s;position:relative}
.cell[data-v="2"]{background:#e9e5dc;color:#35384a}.cell[data-v="4"]{background:#d9d1ff;color:#3a315b}.cell[data-v="8"]{background:#a99aff;color:#fff}.cell[data-v="16"]{background:#8978ed;color:#fff}.cell[data-v="32"]{background:#7060d9;color:#fff}.cell[data-v="64"]{background:#5145b4;color:#fff}.cell[data-v="128"]{background:#f0c76e;color:#302746;font-size:clamp(18px,5.8vw,29px)}.cell[data-v="256"]{background:#edb94e;color:#302746;font-size:clamp(18px,5.8vw,29px)}.cell[data-v="512"]{background:#e99a55;color:#fff;font-size:clamp(18px,5.8vw,29px)}.cell[data-v="1024"],.cell[data-v="2048"]{background:linear-gradient(135deg,#ffdc86,#ff9f68);color:#2d2341;font-size:clamp(15px,4.8vw,25px);box-shadow:inset 0 0 0 2px #fff6}
.cell.empty{background:#353f55}
.actions{display:grid;grid-template-columns:1fr 1.2fr;gap:9px}
.action{min-height:46px;border-radius:13px;background:#29344a;color:var(--text);font-weight:750;font-size:14px;border:1px solid #ffffff0b}
.action.primary{background:var(--accent);color:#19172f}
.hint{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:11px;padding:0 2px}
.best{white-space:nowrap;font-variant-numeric:tabular-nums}
.overlay{position:absolute;inset:0;background:#101522c9;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;border-radius:16px;z-index:3}
.overlay.show{display:flex}
.overcard{background:#202a3d;border:1px solid #ffffff18;border-radius:18px;padding:24px;text-align:center;width:80%;box-shadow:0 20px 50px #0007}
.overcard strong{display:block;font-size:28px;margin-bottom:6px}.overcard p{color:var(--muted);font-size:13px;margin:0 0 18px}
.board-wrap{position:relative;width:100%;display:flex;justify-content:center}
@media (max-height:650px){.shell{gap:7px}.board{width:min(100%,48dvh);padding:6px;gap:6px}.cell{border-radius:7px}.logo{width:37px;height:37px}.subtitle{display:none}.action{min-height:40px}.hint{font-size:10px}}
@media (max-height:520px) and (orientation:landscape){.shell{width:min(100%,760px);display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:20px}.top,.hint,.actions{grid-column:2}.board-wrap{grid-column:1;grid-row:1 / span 3}.board{width:min(48vw, calc(100dvh - 28px));}.top{align-self:end}.actions{align-self:start}}
</style>
</head>
<body>
<div class="app">
 <main class="shell">
  <header class="top">
   <div class="brand"><div class="logo">2⁴</div><div><h1>2048</h1><div class="subtitle">Merge the numbers</div></div></div>
   <div class="scorebox"><small>Score</small><div class="score" id="score">0</div></div>
  </header>
  <div class="board-wrap">
   <div class="board" id="board" role="application" aria-label="2048 game board"></div>
   <div class="overlay" id="overlay"><div class="overcard"><strong id="overTitle">Game over</strong><p id="overText">Try again</p><button class="action primary" id="again">Play again</button></div></div>
  </div>
  <div class="actions"><button class="action" id="undo">↶ Undo</button><button class="action primary" id="restart">↻ New game</button></div>
  <div class="hint"><span>Swipe or use arrow keys</span><span class="best">Best <b id="best">0</b></span></div>
 </main>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), boardEl=$('board');
let grid,score=0,best=0,previous=null,over=false,won=false,touchStart=null;
try{best=Number(localStorage.getItem('arena2048best')||0)}catch(e){}
$('best').textContent=best;
function snapshot(){return {grid:grid.map(r=>r.slice()),score,over,won}}
function save(){previous=snapshot();$('undo').disabled=!previous}
function spawn(){let empty=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])empty.push([r,c]);if(!empty.length)return false;let [r,c]=empty[Math.floor(Math.random()*empty.length)];grid[r][c]=Math.random()<.9?2:4;return true}
function start(){grid=Array.from({length:4},()=>Array(4).fill(0));score=0;over=false;won=false;previous=null;spawn();spawn();$('overlay').classList.remove('show');$('undo').disabled=true;render()}
function render(){
 boardEl.innerHTML='';
 for(let r=0;r<4;r++)for(let c=0;c<4;c++){let v=grid[r][c],el=document.createElement('div');el.className='cell'+(!v?' empty':'');el.dataset.v=v||'';el.textContent=v||'';el.setAttribute('aria-label',v?String(v):'empty');boardEl.appendChild(el)}
 $('score').textContent=score;$('best').textContent=best;
}
function slide(line){let a=line.filter(Boolean),gain=0;for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;gain+=a[i];a.splice(i+1,1)}while(a.length<4)a.push(0);return {a,gain}}
function move(dir){
 if(over)return;let before=grid.map(r=>r.slice()),gain=0;
 for(let i=0;i<4;i++){
  let line=[];
  for(let j=0;j<4;j++){let r,c;if(dir==='left'){r=i;c=j}else if(dir==='right'){r=i;c=3-j}else if(dir==='up'){r=j;c=i}else{r=3-j;c=i}line.push(grid[r][c])}
  let result=slide(line);gain+=result.gain;
  for(let j=0;j<4;j++){let r,c;if(dir==='left'){r=i;c=j}else if(dir==='right'){r=i;c=3-j}else if(dir==='up'){r=j;c=i}else{r=3-j;c=i}grid[r][c]=result.a[j]}
 }
 if(before.every((row,r)=>row.every((v,c)=>v===grid[r][c])))return;
 previous={grid:before,score,over,won};$('undo').disabled=false;score+=gain;
 spawn();
 if(score>best){best=score;try{localStorage.setItem('arena2048best',String(best))}catch(e){}}
 if(!won&&grid.some(row=>row.includes(2048))){won=true;showOverlay('You win!','Keep going or start a new game.')}
 if(!canMove()){over=true;showOverlay('Game over','No moves left. Try again!')}
 render();
}
function canMove(){for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(!grid[r][c])return true;if(c<3&&grid[r][c]===grid[r][c+1])return true;if(r<3&&grid[r][c]===grid[r+1][c])return true}return false}
function showOverlay(title,desc){$('overTitle').textContent=title;$('overText').textContent=desc;$('overlay').classList.add('show')}
function undo(){if(!previous)return;grid=previous.grid.map(r=>r.slice());score=previous.score;over=previous.over;won=previous.won;previous=null;$('undo').disabled=true;$('overlay').classList.remove('show');render()}
$('restart').addEventListener('click',start);$('again').addEventListener('click',start);$('undo').addEventListener('click',undo);
document.addEventListener('keydown',e=>{let map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(map[e.key]){e.preventDefault();move(map[e.key])}else if(e.key.toLowerCase()==='z'&&(e.ctrlKey||e.metaKey)){undo()}});
boardEl.addEventListener('touchstart',e=>{if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
boardEl.addEventListener('touchend',e=>{if(!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});
let mouseStart=null;boardEl.addEventListener('mousedown',e=>{mouseStart={x:e.clientX,y:e.clientY}});boardEl.addEventListener('mouseup',e=>{if(!mouseStart)return;let dx=e.clientX-mouseStart.x,dy=e.clientY-mouseStart.y;mouseStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))>22)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
start();
})();
</script>
<audio id="bgMusic" loop preload="auto">
  <source src="./mixkit-relaxation-05-749.mp3" type="audio/mpeg">
</audio>

<script>
(() => {
  const music = document.getElementById('bgMusic');
  music.volume = 0.15;

  // Запуск музыки после первого действия пользователя
  const startMusic = () => {
    music.play().catch(() => {});
  };

  document.addEventListener('pointerdown', startMusic, { once: true });
  document.addEventListener('keydown', startMusic, { once: true });
})();
</script>
</body>
</html>
