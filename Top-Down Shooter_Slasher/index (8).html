<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1622">
<title>Viking Fury</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e1622; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .norse { font-family: "Trajan Pro", "Cinzel", Georgia, "Times New Roman", serif; font-weight: 900; }
  #menu { background: radial-gradient(ellipse at 50% 40%, rgba(10,20,34,0), rgba(10,18,30,.55) 60%, rgba(6,10,18,.92)); }
  .title { font-size: clamp(56px, 16vw, 118px); line-height: .88; letter-spacing: 4px;
    background: linear-gradient(180deg, #ffffff 0%, #d8e8f4 30%, #8aa8c0 55%, #3a5068 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #0a1018) drop-shadow(0 0 22px rgba(160,210,255,.45)); }
  .title span { display: block; background: linear-gradient(180deg, #fff2c8 0%, #ffb84a 40%, #e8501a 70%, #7a1a06 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #2a0800) drop-shadow(0 0 26px rgba(255,120,40,.55)); }
  .runes { font-size: 15px; letter-spacing: 10px; color: #8ac8ff; text-shadow: 0 0 12px #4aa8ff; }
  .heroes { display: flex; align-items: center; gap: 10px; }
  .heroes canvas { width: 128px; height: 128px; }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(180,210,240,.5); background: rgba(20,40,60,.6); color: #e8f4ff; font-size: 20px; font-weight: 900; cursor: pointer; }
  .skin { font-size: 16px; letter-spacing: 5px; color: #ffd27a; min-height: 20px; } .skin.lock { color: #8090a0; }
  .stat { font-size: 14px; color: #d8e4f0; } .stat b { color: #ffd27a; }
  .btn { border: 3px solid #ffd27a; padding: 13px 54px; border-radius: 4px; font-size: 25px; letter-spacing: 7px; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #d8401a, #8a1a06 70%, #5a0e02); box-shadow: 0 6px 0 #2a0600, 0 0 30px rgba(255,90,30,.5), inset 0 2px 0 rgba(255,220,160,.4); text-shadow: 0 2px 0 #3a0a00; animation: pulse 1.6s ease-in-out infinite; clip-path: polygon(6% 0, 94% 0, 100% 50%, 94% 100%, 6% 100%, 0 50%); }
  .btn:active { transform: translateY(4px); }
  @keyframes pulse { 50% { filter: brightness(1.18); } }
  .hint { font-size: 12px; letter-spacing: 1px; color: #b8c8d8; max-width: 520px; }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(40,10,10,.78), rgba(6,8,14,.95)); }
  #over h2 { font-size: clamp(42px, 12vw, 84px); letter-spacing: 4px; color: #ffd27a; text-shadow: 0 4px 0 #3a1a00, 0 0 34px rgba(255,180,60,.55); }
  #over .sub { font-size: 14px; letter-spacing: 6px; color: #c8d8e8; margin-top: -8px; }
  #overScore { font-size: 54px; color: #fff; text-shadow: 0 0 20px rgba(140,200,255,.6); }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #2a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; border-radius: 3px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,220,80,.8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; font-size: 14px; color: #c8d8e8; text-align: left; } .grid b { color: #fff; float: right; margin-left: 12px; }
  #pause { background: rgba(6,10,18,.72); font-size: 34px; letter-spacing: 8px; color: #d8e8f4; }
  #cards { background: radial-gradient(ellipse at 50% 50%, rgba(20,34,56,.8), rgba(4,8,14,.94)); }
  #cards h3 { font-size: 32px; letter-spacing: 6px; color: #8ac8ff; text-shadow: 0 0 22px rgba(80,170,255,.7), 0 3px 0 #0a1830; }
  #cards .csub { font-size: 12px; letter-spacing: 6px; color: #c8d8e8; margin: -4px 0 16px; }
  .cardrow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .card { position: relative; width: 142px; padding: 14px 10px 12px; border-radius: 40px 40px 12px 12px; cursor: pointer; transition: transform .18s; color: #e8f0f8;
    background: linear-gradient(180deg, #5a6672, #3a444e 40%, #262e36); border: 2px solid #1a2026; box-shadow: 0 10px 22px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.2), inset 0 -6px 0 rgba(0,0,0,.25); animation: rise .45s backwards; }
  .card:nth-child(2) { animation-delay: .07s; } .card:nth-child(3) { animation-delay: .14s; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  .card::after { content: ''; position: absolute; inset: 6px; border-radius: 34px 34px 8px 8px; border: 1px dashed rgba(0,0,0,.35); pointer-events: none; }
  .card:hover, .card:active { transform: translateY(-6px) scale(1.04); }
  .card img { width: 66px; height: 66px; display: block; margin: 4px auto 0; filter: drop-shadow(0 0 10px var(--c)); }
  .card .nm { font-size: 15px; letter-spacing: 1px; margin: 6px 0 4px; color: var(--c); text-shadow: 0 0 10px var(--c), 0 2px 0 #000; }
  .card .ds { font-size: 11.5px; color: #d8e2ec; line-height: 1.3; text-shadow: 0 1px 0 #000; }
  .card .lv { margin-top: 8px; display: flex; gap: 4px; justify-content: center; }
  .card .lv i { width: 9px; height: 9px; transform: rotate(45deg); background: rgba(0,0,0,.4); } .card .lv i.on { background: var(--c); box-shadow: 0 0 6px var(--c); } .card .lv i.nx { background: #fff; animation: blink .6s infinite alternate; }
  .card .lv span { font-size: 10px; letter-spacing: 2px; color: #a8b8c8; font-weight: 800; }
  @keyframes blink { from { opacity: .3; } to { opacity: 1; } }
  @media (max-width: 420px) { #cards h3 { font-size: 26px; letter-spacing: 3px; } .card { width: 134px; } }
  @media (max-height: 700px) and (min-height: 521px) { .title { font-size: 54px; } .heroes canvas { width: 96px; height: 96px; } .overlay { gap: 8px; } }
  @media (max-height: 520px) {
    .overlay { gap: 6px; padding: 8px 16px; } .title { font-size: 46px; } .runes { font-size: 11px; letter-spacing: 6px; }
    .heroes canvas { width: 70px; height: 70px; } .arrow { width: 34px; height: 34px; font-size: 15px; } .btn { padding: 8px 40px; font-size: 20px; } .hint { display: none; }
    #over h2 { font-size: 38px; } #overScore { font-size: 34px; } .grid { font-size: 12px; gap: 3px 18px; }
    .card { width: 126px; padding: 8px 8px 6px; } .card img { width: 40px; height: 40px; } .card .ds { font-size: 10.5px; } #cards h3 { font-size: 22px; } #cards .csub { margin: -4px 0 8px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="overlay" id="menu">
  <div class="runes">ᚠᚢᚱᛁᛟᚢᛊ · ᚾᛟᚱᛞ</div>
  <div class="title norse">VIKING<span>FURY</span></div>
  <div class="heroes"><button class="arrow" id="prevHero">◀</button><canvas id="heroPrev" width="256" height="256"></canvas><button class="arrow" id="nextHero">▶</button></div>
  <div class="skin norse" id="skinName"></div>
  <div class="stat" id="bestMenu"></div>
  <button class="btn norse" id="startBtn">RAID</button>
  <div class="hint">Left stick moves · your axe swings at anything in reach · CHARGE with the shield · THROW your axe · fill RAGE and go BERSERK · WASD + Space / E / Q on desktop</div>
</div>
<div class="overlay hidden" id="cards"><h3 class="norse" id="cardsTitle">THE GODS ANSWER</h3><div class="csub">CARVE A RUNE</div><div class="cardrow" id="cardRow"></div></div>
<div class="overlay hidden" id="over">
  <h2 class="norse">VALHALLA</h2>
  <div class="sub">YOU DIED WITH AXE IN HAND</div>
  <div id="overScore" class="norse">0</div>
  <div id="newBest">NEW SAGA!</div>
  <div class="grid" id="overStats"></div>
  <button class="btn norse" id="againBtn">RISE AGAIN</button>
  <div class="hint" id="unlockMsg"></div>
</div>
<div class="overlay hidden norse" id="pause">PAUSED<div class="hint">tap to continue</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag

  function gameOver() {
    const sc = Math.floor(G.score), prev = SAVE.best, nb = sc > prev; if (nb) SAVE.best = sc; SAVE.kills += G.kills; SAVE.bestStage = Math.max(SAVE.bestStage, G.stage - 1); saveNow();
    $('overScore').textContent = fmt(sc); $('newBest').style.display = nb ? 'block' : 'none';
    $('overStats').innerHTML = [['Raid', G.stage], ['Slain', fmt(G.kills)], ['Best streak', G.bestCombo], ['God-beasts', G.bosses]].map(([a, b]) => '<div>' + a + '<b>' + b + '</b></div>').join('');
    const un = SKINS.filter(s => s.need > prev && s.need <= SAVE.best).map(s => s.name); $('unlockMsg').textContent = un.length ? 'NEW HERO JOINS: ' + un.join(', ') : 'Best saga: ' + fmt(SAVE.best) + ' · raid ' + SAVE.bestStage;
    $('over').classList.remove('hidden'); ctl.setEnabled(false); updateMenu();
  }
  let prevSkin = SAVE.skin;
  function updateMenu() { $('bestMenu').innerHTML = SAVE.best ? 'BEST SAGA <b>' + fmt(SAVE.best) + '</b> · RAID <b>' + SAVE.bestStage + '</b>' : 'Earn your seat in Valhalla.'; drawPreview(); }
  function drawPreview() {
    const g = $('heroPrev').getContext('2d'); g.clearRect(0, 0, 256, 256); const s = SKINS[prevSkin], locked = s.need > SAVE.best, spr = SPR['hero' + prevSkin];
    const gr = g.createRadialGradient(128, 128, 10, 128, 128, 124); gr.addColorStop(0, 'rgba(160,210,255,.35)'); gr.addColorStop(1, 'rgba(160,210,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    g.save(); g.translate(128, 136); g.rotate(-Math.PI / 2); g.globalAlpha = locked ? .3 : 1; if (SPR.axe) { g.save(); g.translate(12, 20); g.rotate(.9); g.drawImage(SPR.axe, -8, -30, 120, 60); g.restore(); } if (spr) g.drawImage(spr, -112, -112, 224, 224); g.restore(); g.globalAlpha = 1;
    $('skinName').textContent = locked ? '🔒 ' + s.name + ' · ' + fmt(s.need) : s.name; $('skinName').className = 'skin norse' + (locked ? ' lock' : '');
    if (!locked) { SAVE.skin = prevSkin; saveNow(); }
  }
  $('prevHero').onclick = () => { prevSkin = (prevSkin + SKINS.length - 1) % SKINS.length; drawPreview(); };
  $('nextHero').onclick = () => { prevSkin = (prevSkin + 1) % SKINS.length; drawPreview(); };
  addEventListener('keydown', e => { if (e.code === 'Enter' && !$('menu').classList.contains('hidden')) start(); else if (e.code === 'Escape' && !paused) pause(); else if (paused && !$('pause').classList.contains('hidden')) resume(); });
  function pause() { if (!G || G.attract || G.over || paused) return; paused = true; $('pause').classList.remove('hidden'); ctl.clear(); }
  function resume() { if (!$('cards').classList.contains('hidden')) return; paused = false; $('pause').classList.add('hidden'); last = performance.now(); ctl.clear(); }
  $('pause').addEventListener('pointerdown', resume);
  addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.__vf = { G: () => G, P: () => P, UP, start, autopilot: v => { G.autopilot = v; }, god: v => { G.god = v; }, setStage: n => { G.stage = n - 1; foes = []; shots = []; G.boss = null; if (Math.floor((n - 1) / 5) !== G.realm) buildRealm(Math.floor((n - 1) / 5)); nextStage(); }, foes: () => foes.length, card: i => { const el = $('cardRow').children[i || 0]; if (el) el.click(); }, cards: () => showCards(), rage: () => { G.rage = 100; startBerserk(); }, realm: i => buildRealm(i) };
  newRun(true); updateMenu();
  (function loop(now) { const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; if (!paused) update(dt); render(); requestAnimationFrame(loop); })(last);
})();
</script>
