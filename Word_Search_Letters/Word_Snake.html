<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a6a3a">
<title>Word Snake</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #4e9e34; color: #fff;
    font-family: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  button { font-family: inherit; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  #menu { gap: 10px; background: linear-gradient(180deg, rgba(6,26,14,.62) 0%, rgba(6,26,14,.18) 34%, rgba(6,26,14,.22) 60%, rgba(4,16,8,.82) 100%); }
  .mcol { display: contents; }
  .tag { order: 1; font-size: 12px; font-weight: 800; letter-spacing: 6px; color: #fff6d0; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
  .title { order: 2; font-weight: 900; font-size: clamp(54px, 16vw, 104px); line-height: .84; letter-spacing: 1px;
    background: linear-gradient(180deg, #fffbe0 0%, #ffe45a 34%, #ff9a1e 70%, #d8580a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #5a2a06) drop-shadow(0 0 22px rgba(255,200,80,.45)); }
  .title span { display: block; background: linear-gradient(180deg, #f2ffe4 0%, #a6f27a 40%, #2fb04a 78%, #137a2c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 #08381a); }
  .card { order: 3; width: min(350px, 92vw); padding: 10px 12px 12px; border-radius: 22px; background: rgba(8,30,16,.6); border: 2px solid rgba(255,255,255,.16);
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .tabs { display: flex; gap: 6px; }
  .tabs button { flex: 1; font-weight: 900; font-size: 12px; letter-spacing: 2px; padding: 7px 0; border-radius: 12px; border: none; color: #d8f0d0; background: rgba(255,255,255,.09); cursor: pointer; }
  .tabs button.on { background: linear-gradient(180deg, #ffe76a, #f5a623); color: #4a2606; box-shadow: 0 3px 0 #9a5a0a; }
  .prev { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 6px; }
  .prev canvas { width: 230px; height: 104px; }
  .arr { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(255,240,200,.6); background: rgba(30,60,30,.6); color: #fff; font-size: 16px; font-weight: 900; cursor: pointer; }
  .iname { font-weight: 900; font-size: 16px; letter-spacing: 3px; color: #ffe27a; text-shadow: 0 2px 3px #000; margin: 2px 0 6px; }
  .buy { border: 2px solid #ffd04a; background: rgba(60,40,10,.7); color: #ffe08a; font-weight: 900; padding: 6px 18px; border-radius: 20px; cursor: pointer; letter-spacing: 1px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .chap { order: 4; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; letter-spacing: 2px; color: #eaf6e0; text-shadow: 0 1px 3px #000; }
  .chap div { display: flex; gap: 7px; }
  .chap i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; border: 2px solid rgba(255,255,255,.35); opacity: .45; }
  .chap i.on { opacity: 1; } .chap i.cur { box-shadow: 0 0 0 3px #ffe27a, 0 0 12px #ffe27a; }
  .stat { order: 5; font-size: 13px; color: #f4f8ec; text-shadow: 0 1px 3px #000; } .stat b { color: #ffd04a; }
  .btn { order: 6; border: 3px solid #fff2c0; padding: 10px 56px 9px; border-radius: 40px; font-size: 26px; font-weight: 900; letter-spacing: 6px; color: #3a2006; cursor: pointer; line-height: 1;
    background: linear-gradient(180deg, #fff3a0, #ffc23a 50%, #e8860e); box-shadow: 0 6px 0 #7a3e06, 0 0 26px rgba(255,200,60,.5); animation: pulse 1.6s ease-in-out infinite; }
  .btn small { display: block; font-size: 11px; letter-spacing: 3px; margin-top: 3px; color: #6a3a06; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7a3e06; }
  .btn2 { border: 3px solid rgba(255,255,255,.5); padding: 10px 24px; border-radius: 40px; font-size: 18px; font-weight: 900; letter-spacing: 3px; color: #eaffea; cursor: pointer;
    background: linear-gradient(180deg, #5ad06a, #2a8a3a); box-shadow: 0 5px 0 #145a22; }
  .btn2:active { transform: translateY(3px); box-shadow: 0 2px 0 #145a22; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #7a3e06, 0 0 44px rgba(255,220,90,.85); } }
  .hint { font-size: 12px; letter-spacing: 1px; color: #e8f0e0; max-width: 460px; text-shadow: 0 1px 3px #000; order: 7; }
  .coin { width: 20px; height: 20px; border-radius: 50%; display: inline-block; flex: none; background: radial-gradient(circle at 35% 30%, #fff8c0, #ffd23a 45%, #c88a10 100%);
    box-shadow: inset 0 -2px 0 rgba(120,60,0,.55), 0 1px 2px rgba(0,0,0,.4); }
  #coinsTop { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 14px; z-index: 11; display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 18px; color: #ffe27a;
    background: rgba(0,0,0,.38); padding: 5px 12px 5px 6px; border-radius: 20px; text-shadow: 0 1px 2px #000; }
  #pauseBtn { position: fixed; z-index: 6; width: 42px; height: 42px; border-radius: 14px; border: 2px solid rgba(255,255,255,.35); background: rgba(10,30,18,.55); cursor: pointer; display: none; }
  #pauseBtn::before, #pauseBtn::after { content: ''; position: absolute; top: 12px; width: 5px; height: 14px; border-radius: 2px; background: #fff; }
  #pauseBtn::before { left: 13px; } #pauseBtn::after { right: 13px; }
  #hints { position: fixed; z-index: 6; display: none; gap: 8px; }
  .hb { position: relative; overflow: visible; min-height: 0; border: none; border-radius: 16px; background: linear-gradient(180deg, #fffaf0, #ffe9b8 60%, #f5c86a); box-shadow: 0 4px 0 #a8742a, 0 6px 12px rgba(0,0,0,.3);
    color: #5a3410; font-weight: 900; font-size: 11px; letter-spacing: 1px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 3px 2px; min-width: 0; }
  .hb svg { width: 22px; height: 22px; flex: none; }
  .hb .p { font-size: 10px; color: #8a5a1a; display: flex; align-items: center; gap: 3px; } .hb .p .coin { width: 10px; height: 10px; }
  .hb:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8742a; }
  .hb.off { filter: grayscale(.85) brightness(.85); }
  .hb .free { position: absolute; top: -7px; right: -4px; background: #ff4a6a; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  #result, #over { background: radial-gradient(ellipse at 50% 40%, rgba(20,50,30,.72), rgba(4,12,8,.93)); gap: 10px; }
  .rtitle { font-weight: 900; font-size: clamp(30px, 9vw, 52px); color: #ffe27a; text-shadow: 0 4px 0 #6a3a06, 0 0 24px rgba(255,200,80,.5); letter-spacing: 2px; line-height: 1.05; }
  .rsub { font-size: 13px; font-weight: 800; letter-spacing: 4px; color: #bfe8b0; }
  .stars { display: flex; gap: 10px; align-items: flex-end; }
  .stars i { width: 52px; height: 50px; background: rgba(255,255,255,.14); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .stars i:nth-child(2) { width: 66px; height: 63px; }
  .stars i.on { background: linear-gradient(180deg, #fff8b0, #ffcc22 55%, #e8820a); animation: starpop .55s cubic-bezier(.3,1.8,.5,1) backwards; }
  .stars i.on:nth-child(2) { animation-delay: .25s; } .stars i.on:nth-child(3) { animation-delay: .5s; }
  @keyframes starpop { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: scale(1); } }
  .bigscore { font-size: 50px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(255,230,140,.6), 0 3px 0 rgba(0,0,0,.35); line-height: 1; }
  .newbest { font-size: 15px; font-weight: 900; letter-spacing: 4px; color: #3a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; border-radius: 4px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,220,80,.8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; font-size: 14px; color: #d8ead0; text-align: left; min-width: 260px; } .grid b { color: #fff; float: right; margin-left: 12px; }
  .reward { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 900; color: #ffe27a; text-shadow: 0 2px 3px #000; }
  .chal { font-size: 13px; font-weight: 800; color: #bfffc0; letter-spacing: 1px; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #pause { background: rgba(4,14,8,.74); gap: 16px; }
  #pause h2 { font-size: 40px; letter-spacing: 8px; color: #ffe27a; text-shadow: 0 3px 0 #6a3a06; }
  @media (max-height: 760px) and (min-height: 521px) { .title { font-size: clamp(48px, 13vw, 80px); } .prev canvas { width: 200px; height: 90px; } #menu { gap: 7px; } .hint { display: none; } }
  @media (max-height: 520px) {
    #menu { flex-direction: row; gap: 26px; padding: 10px 70px 10px 20px; }
    .mcol { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .title { font-size: 46px; } .tag { font-size: 10px; letter-spacing: 4px; } .hint { display: none; }
    .card { width: 300px; padding: 8px 10px 10px; } .prev canvas { width: 190px; height: 86px; } .btn { padding: 8px 40px 7px; font-size: 21px; }
    .hb svg { width: 17px; height: 17px; } .hb { font-size: 10px; padding: 1px 2px; border-radius: 13px; } .hb .p { font-size: 9px; }
    #result, #over { gap: 5px; padding: 8px; } .rtitle { font-size: 30px; } .bigscore { font-size: 32px; } .stars i { width: 34px; height: 33px; } .stars i:nth-child(2) { width: 42px; height: 40px; }
    .grid { font-size: 12px; gap: 2px 18px; } .reward { font-size: 17px; } .btn2 { padding: 7px 18px; font-size: 15px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="coinsTop"><span class="coin"></span><span id="coinsVal">0</span></div>
<button id="pauseBtn" aria-label="Pause"></button>
<div id="hints">
  <button class="hb" data-h="guide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#5ac8ff" stroke="#1e5a8a" stroke-width="2"/><path d="M12 5 L15 12 L12 19 L9 12Z" fill="#ff5a4a" stroke="#7a1a10" stroke-width="1"/><path d="M12 12 L15 12 L12 19 L9 12Z" fill="#fff"/></svg><b>GUIDE</b><span class="p"><i class="coin"></i>40</span></button>
  <button class="hb" data-h="clear"><svg viewBox="0 0 24 24"><path d="M5 7 H19 L17.5 20 Q17.3 21.5 15.8 21.5 H8.2 Q6.7 21.5 6.5 20Z" fill="#8ad0ff" stroke="#1e5a8a" stroke-width="1.6"/><rect x="3.5" y="4" width="17" height="3.4" rx="1.5" fill="#5aa8e0" stroke="#1e5a8a" stroke-width="1.4"/><path d="M10 10 V18 M14 10 V18" stroke="#1e5a8a" stroke-width="1.6"/></svg><b>CLEAR</b><span class="p"><i class="coin"></i>60</span></button>
  <button class="hb" data-h="slow"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8.5" fill="#fff" stroke="#6a3aa8" stroke-width="2.2"/><path d="M12 13 V8 M12 13 L15.5 15" stroke="#6a3aa8" stroke-width="2.2" stroke-linecap="round"/><rect x="9.5" y="1.5" width="5" height="3" rx="1" fill="#6a3aa8"/></svg><b>SLOW</b><span class="p"><i class="coin"></i>30</span></button>
  <button class="hb" data-h="shuffle"><svg viewBox="0 0 24 24"><path d="M3 7 H8 Q11 7 13 12 Q15 17 18 17 H21 M3 17 H8 Q11 17 13 12 Q15 7 18 7 H21" fill="none" stroke="#2a8a3a" stroke-width="2.4" stroke-linecap="round"/><path d="M18 4 L21.5 7 L18 10 M18 14 L21.5 17 L18 20" fill="none" stroke="#2a8a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><b>SHUFFLE</b><span class="p"><i class="coin"></i>20</span></button>
</div>
<div class="overlay" id="menu">
  <div class="mcol">
    <div class="tag">SWIPE · SLITHER · SPELL</div>
    <div class="title">WORD<span>SNAKE</span></div>
    <div class="chap"><div id="chapDots"></div><span id="chapName"></span></div>
    <div class="stat" id="stats"></div>
    <button class="btn" id="startBtn">PLAY<small id="playLvl">LEVEL 1</small></button>
  </div>
  <div class="card">
    <div class="tabs"><button data-t="skin" class="on">SKINS</button><button data-t="hat">HATS</button><button data-t="trail">TRAILS</button></div>
    <div class="prev"><button class="arr" id="pPrev">&#9664;</button><canvas id="prevCv" width="460" height="208"></canvas><button class="arr" id="pNext">&#9654;</button></div>
    <div class="iname" id="iName">MEADOW</div>
    <button class="buy" id="buyBtn">EQUIPPED</button>
  </div>
  <div class="hint">Swipe or use the arrow keys to steer. Eat the letters in order to spell the word at the top. Wrong letters and bumps cost half a heart.</div>
</div>
<div class="overlay hidden" id="result">
  <div class="rsub" id="rSub">GARDEN</div>
  <div class="rtitle" id="rTitle">LEVEL 1 CLEAR!</div>
  <div class="stars" id="rStars"><i></i><i></i><i></i></div>
  <div class="bigscore" id="rScore">0</div>
  <div class="newbest" id="rBest">NEW BEST!</div>
  <div class="grid" id="rStats"></div>
  <div class="chal" id="rChal"></div>
  <div class="reward"><span class="coin"></span><span id="rCoins">+0</span></div>
  <div class="row"><button class="btn2" id="rMenu">MENU</button><button class="btn" id="rNext" style="animation:none">NEXT<small id="rNextL">LEVEL 2</small></button></div>
</div>
<div class="overlay hidden" id="over">
  <div class="rsub" id="oSub">LEVEL 1</div>
  <div class="rtitle">OUT OF HEARTS</div>
  <div class="grid" id="oStats"></div>
  <div class="row"><button class="btn2" id="oCont">CONTINUE · <span class="coin" style="width:14px;height:14px;vertical-align:-1px"></span> 80</button></div>
  <div class="row"><button class="btn2" id="oMenu">MENU</button><button class="btn" id="oRetry" style="animation:none">RETRY</button></div>
</div>
<div class="overlay hidden" id="pause">
  <h2>PAUSED</h2>
  <button class="btn" id="pResume" style="animation:none">RESUME</button>
  <div class="row"><button class="btn2" id="pRestart">RESTART</button><button class="btn2" id="pMenu">MENU</button></div>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;

// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};

// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }

  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {

      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },

    draw(ctx) {

      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;

        if (p.shape === 'spark') { ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-p.size * 1.6, -p.size * .18, p.size * 3.2, p.size * .36); }

        else if (p.shape === 'square') { ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .7); }

        else if (p.shape === 'drop') { ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.quadraticCurveTo(p.size, 0, 0, p.size); ctx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.4); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * (.4 + k * .6), 0, TAU); ctx.fill(); }

        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },
    drawFlash(ctx, W, H) { if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }

})();
