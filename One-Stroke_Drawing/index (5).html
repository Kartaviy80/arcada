<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7ec8f0">
<title>Draw Bridge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #7ec8f0;
    font-family: "Avenir Next", "Segoe UI", sans-serif; color: #fff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; text-shadow: 0 2px 0 #2a6a9a, 0 3px 8px #0004; }
  .hud b { font-size: 24px; font-weight: 800; letter-spacing: 4px; } .hud div { font-size: 13px; letter-spacing: 2px; margin-top: 1px; font-weight: 600; }
  .tools { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 10px; right: 64px; display: flex; gap: 8px; align-items: center; justify-content: center; }
  .tools button { padding: 11px 13px; border-radius: 30px; border: 2px solid #fff; background: #2f7fb8; color: #fff; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 0 #1b4f78; white-space: nowrap; }
  .tools button:active { transform: translateY(2px); box-shadow: 0 2px 0 #1b4f78; }
  .tools #go { background: #ff8a2a; box-shadow: 0 4px 0 #a94e0c; padding: 11px 18px; font-size: 16px; letter-spacing: 2px; }
  .tools #go.stop { background: #e0485a; box-shadow: 0 4px 0 #8a1f2c; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: linear-gradient(#5fb2e6ee, #ffd9a0ee); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay canvas { width: 230px; height: 190px; }
  h1 { font-size: clamp(38px, 11vw, 60px); font-weight: 900; letter-spacing: 4px; color: #fff; text-shadow: 0 4px 0 #e06a1a, 0 7px 0 #8a3a0a, 0 10px 18px #0005; }
  p { max-width: 310px; font-size: 15px; line-height: 1.6; color: #1d3f5c; font-weight: 500; }
  .stat { color: #1d3f5c; font-weight: 600; } .stat b { color: #d8570a; }
  .stars { font-size: 46px; letter-spacing: 6px; color: #fff5; text-shadow: 0 3px 0 #0002; } .stars .on { color: #ffc61a; text-shadow: 0 3px 0 #c47a00, 0 0 14px #fff6; }
  .btn { border: 3px solid #fff; background: #ff8a2a; color: #fff; font: inherit; font-weight: 800; font-size: 18px; letter-spacing: 4px; padding: 13px 44px; border-radius: 40px; cursor: pointer; box-shadow: 0 5px 0 #a94e0c, 0 9px 18px #0004; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a94e0c; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b id="level">LEVEL 1</b><div id="name">First Bridge</div></div>
<div class="tools"><button id="undo">↶ Undo</button><button id="clear">✕ Clear</button><button id="go">GO ▶</button></div>

<div class="overlay" id="menu">
  <canvas id="logo" width="460" height="380"></canvas>
  <h1>DRAW BRIDGE</h1>
  <p><b>Help Pip the hamster roll home.</b> Draw ramps and bridges with your limited ink, then press GO. Avoid the spikes and the sea — less ink earns more stars!</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">PLAY</button>
</div>
<div class="overlay hidden" id="win">
  <h1>HOME!</h1>
  <div class="stars" id="stars"></div>
  <div class="stat">Level <b id="winLevel">1</b> · ink used <b id="winInk">0%</b></div>
  <button class="btn" id="nextBtn">NEXT</button>
</div>
<div class="overlay hidden" id="fail">
  <h1>OOPS!</h1>
  <div class="stat" id="failWhy">Pip took a tumble.</div>
  <button class="btn" id="retryBtn">TRY AGAIN</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*INK-START*/
// ---------- ink: freehand strokes that become solid walls ----------
// A stroke is a list of points; consecutive points form segments that circles bounce off.
const Ink = {
  // append a point only once the finger has moved far enough (keeps strokes light)
  add(stroke, x, y, minD = 6) {
    const p = stroke[stroke.length - 1];
    if (!p || Math.hypot(x - p.x, y - p.y) >= minD) { stroke.push({ x, y }); return true; }
    return false;
  },
  length(stroke) { let L = 0; for (let i = 1; i < stroke.length; i++) L += Math.hypot(stroke[i].x - stroke[i - 1].x, stroke[i].y - stroke[i - 1].y); return L; },
  segments(strokes) {
    const out = [];
    for (const s of strokes) for (let i = 1; i < s.length; i++) out.push({ ax: s[i - 1].x, ay: s[i - 1].y, bx: s[i].x, by: s[i].y });
    return out;
  },
  closest(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    const k = L ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L)) : 0;
    const x = ax + dx * k, y = ay + dy * k;
    return { x, y, d: Math.hypot(px - x, py - y) };
  },
  // push a circle out of every segment it overlaps; reflect its velocity with some bounce and friction
  collide(b, segs, r, bounce = 0.3, friction = 0.995, thick = 3) {
    let hit = false;
    for (const s of segs) {
      const c = Ink.closest(b.x, b.y, s.ax, s.ay, s.bx, s.by), min = r + thick;
      if (c.d < min) {
        let nx = b.x - c.x, ny = b.y - c.y, d = c.d;
        if (d < 1e-6) { nx = -(s.by - s.ay); ny = s.bx - s.ax; d = Math.hypot(nx, ny) || 1; }
        nx /= d; ny /= d;
        b.x = c.x + nx * min; b.y = c.y + ny * min;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= (1 + bounce) * vn * nx; b.vy -= (1 + bounce) * vn * ny; }
        b.vx *= friction; b.vy *= friction;
        hit = true;
      }
    }
    return hit;
  },
  // does segment p1-p2 cross segment p3-p4?
  cross(p1, p2, p3, p4) {
    const d = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
    const d1 = d(p3, p4, p1), d2 = d(p3, p4, p2), d3 = d(p1, p2, p3), d4 = d(p1, p2, p4);
    return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
  },
  // a smooth, tapered pen line
  draw(ctx, stroke, color, width, glow) {
    if (stroke.length < 2) return;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 12; }
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(stroke[0].x, stroke[0].y);
    for (let i = 1; i < stroke.length - 1; i++) { const mx = (stroke[i].x + stroke[i + 1].x) / 2, my = (stroke[i].y + stroke[i + 1].y) / 2; ctx.quadraticCurveTo(stroke[i].x, stroke[i].y, mx, my); }
    const l = stroke[stroke.length - 1]; ctx.lineTo(l.x, l.y); ctx.stroke();
    ctx.restore();
  }
};
/*INK-END*/
(() => {
  const audio = GameAudio({
    bpm: 118, scale: 'major', root: 62, prog: [0, 4, 5, 3], seed: 603,
    waves: { lead: 'square', bass: 'triangle', arp: 'triangle', pad: 'sine' },
    pad: false, arp: true, arpEvery: 2, arpOct: 1, arpCutoff: 2600, leadOct: 0, leadDensity: 0.4, leadCutoff: 2200, drums: true, bassPattern: [0, 4, 8, 12], volume: 0.16, swing: 0.12,
    btnBg: 'rgba(47,127,184,.85)', btnColor: '#fff'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'draw_bridge_level';
  let level = 1; try { level = +localStorage.getItem(KEY) || 1; } catch (e) {}
  $('bestMenu').innerHTML = level > 1 ? 'Continue from level <b>' + level + '</b>' : '';

  // ---------- handcrafted levels (world is 480 x 600, the sea starts at y = 560) ----------
  const R = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  const LEVELS = [
    { name: 'First Bridge', ball: [30, 236], goal: [420, 380], ground: [[[0, 250], [150, 300], [150, 600], [0, 600]], R(330, 380, 150, 220)], spikes: [], sol: [[[146, 301], [334, 381]]] },
    { name: 'Long Plank', ball: [28, 160], goal: [425, 440], ground: [[[0, 170], [130, 225], [130, 600], [0, 600]], R(215, 330, 50, 270), R(360, 440, 120, 160)], spikes: [], sol: [[[126, 227], [364, 441]]] },
    { name: 'Thorny Path', ball: [28, 220], goal: [452, 360], ground: [[[0, 230], [140, 285], [140, 600], [0, 600]], R(140, 360, 340, 240)], spikes: [[175, 380, 360]], sol: [[[136, 287], [420, 345]]] },
    { name: 'Sky Drop', ball: [80, 60], air: true, goal: [420, 420], ground: [R(340, 420, 140, 180), R(0, 560, 340, 40)], spikes: [[0, 340, 560]], sol: [[[40, 150], [344, 421]]] },
    { name: 'Under the Rock', ball: [26, 92], goal: [430, 520], ground: [[[0, 100], [190, 250], [190, 600], [0, 600]], R(290, 0, 34, 380), R(370, 520, 110, 80)], spikes: [], sol: [[[186, 253], [235, 430], [372, 518]]] },
    { name: 'Up and Over', ball: [26, 56], goal: [425, 165], ground: [[[0, 60], [180, 200], [180, 600], [0, 600]], R(320, 165, 160, 435), R(180, 560, 140, 40)], spikes: [[180, 320, 560]], sol: [[[176, 202], [324, 166]]] },
    { name: 'Spiky Pillar', ball: [28, 190], goal: [430, 420], ground: [[[0, 200], [130, 250], [130, 600], [0, 600]], R(210, 350, 60, 250), R(350, 420, 130, 180)], spikes: [[210, 270, 350]], sol: [[[126, 252], [275, 320], [354, 421]]] },
    { name: 'Low Ceiling', ball: [28, 180], goal: [440, 430], ground: [[[0, 190], [120, 240], [120, 600], [0, 600]], R(170, 0, 230, 215), R(380, 430, 100, 170)], spikes: [], sol: [[[116, 242], [384, 430]]] },
    { name: 'Turn Around', ball: [24, 70], goal: [60, 500], ground: [[[0, 80], [200, 140], [200, 230], [0, 230]], R(0, 500, 170, 100), R(170, 560, 310, 40)], spikes: [[170, 480, 560]], sol: [[[350, 150], [160, 482]]] },
    { name: 'Funnel', ball: [455, 70], goal: [420, 500], ground: [[[300, 150], [480, 90], [480, 200], [300, 200]], R(330, 500, 150, 100), R(0, 560, 330, 40)], spikes: [[0, 330, 560]], sol: [[[150, 220], [340, 498]]] },
    { name: 'Two Towers', ball: [26, 112], goal: [445, 450], ground: [[[0, 120], [110, 170], [110, 600], [0, 600]], R(190, 280, 40, 320), R(300, 380, 40, 220), R(410, 450, 70, 150)], spikes: [[190, 230, 280], [300, 340, 380]], sol: [[[106, 172], [260, 250], [420, 440]]] },
    { name: 'Leap of Faith', ball: [60, 40], air: true, goal: [440, 300], ground: [R(400, 300, 80, 300), R(0, 560, 400, 40)], spikes: [[0, 400, 560]], sol: [[[20, 190], [120, 320], [200, 400], [260, 415], [320, 395], [370, 345], [404, 300]]] }
  ];

    const sx = W * 0.82, sy = H * 0.12, sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 140); sg.addColorStop(0, 'rgba(255,250,210,1)'); sg.addColorStop(0.18, 'rgba(255,236,150,.95)'); sg.addColorStop(0.2, 'rgba(255,230,140,.5)'); sg.addColorStop(1, 'rgba(255,230,140,0)');
    ctx.fillStyle = sg; ctx.fillRect(sx - 140, sy - 140, 280, 280);
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(t * 0.05); ctx.fillStyle = 'rgba(255,245,190,.18)';
    for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-14, 200); ctx.lineTo(14, 200); ctx.fill(); }
    ctx.restore();
    for (const c of clouds) cloud(((c.x + t * c.v) % 1.3 - 0.15) * W, c.y * H, c.s * Math.max(0.7, S));
    // distant islands
    const sea = Y(560);
    ctx.fillStyle = '#8bb8c8'; ctx.beginPath(); ctx.moveTo(0, sea); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, sea - 30 - 26 * Math.abs(Math.sin(x * 0.006 + 1)) - 12 * Math.sin(x * 0.02)); ctx.lineTo(W, sea); ctx.fill();
    // seagulls
    ctx.strokeStyle = '#3a5068'; ctx.lineWidth = 1.8;
    for (let i = 0; i < 3; i++) { const x = ((t * 18 + i * 260) % (W + 100)) - 50, y = H * 0.2 + i * 30 + Math.sin(t + i) * 8, f = Math.sin(t * 6 + i) * 4; ctx.beginPath(); ctx.moveTo(x - 9, y - f); ctx.quadraticCurveTo(x - 4, y - 5, x, y); ctx.quadraticCurveTo(x + 4, y - 5, x + 9, y - f); ctx.stroke(); }
  }
  function seaFront() {
    const sea = Y(560), g = ctx.createLinearGradient(0, sea, 0, H); g.addColorStop(0, '#2fa6d0'); g.addColorStop(1, '#0f5a8a');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) ctx.lineTo(x, sea + Math.sin(x * 0.03 + t * 2) * 4); ctx.lineTo(W, H); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3; ctx.beginPath();
    for (let x = 0; x <= W; x += 10) ctx.lineTo(x, sea + Math.sin(x * 0.03 + t * 2) * 4); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (let i = 0; i < 26; i++) { const x = (i * 97 + t * 14 * (i % 3 + 1)) % W, y = sea + 14 + (i * 31) % Math.max(10, H - sea - 20); ctx.fillRect(x, y, 14 + (i % 4) * 5, 2); }
  }
  function drawStroke(s, live) {
    const pts = s.map(p => ({ x: X(p.x), y: Y(p.y) }));
    Ink.draw(ctx, pts, '#5a2e0a', 11 * S + 2);
    Ink.draw(ctx, pts, live ? '#ffc070' : '#ff9a3a', 7 * S + 1, live ? '#ffd080' : null);
    Ink.draw(ctx, pts.map(p => ({ x: p.x - 1, y: p.y - 1.5 })), 'rgba(255,240,200,.7)', 2);
  }
  function drawBall() {
    if (!ball || (ball.pop > 0.25) || ball.gone) return;
    const x = X(ball.x), y = Y(ball.y), r = BR * S, sc = ball.pop ? 1 + ball.pop * 2 : 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(2, r * 0.9, r * 0.8, r * 0.25, 0, 0, 6.29); ctx.fill();
    const bob = phase === 'roll' ? Math.sin(t * 22) * r * 0.06 : Math.sin(t * 3) * r * 0.03, tilt = Math.max(-0.4, Math.min(0.4, ball.vx * 0.0008));
    ctx.save(); ctx.rotate(tilt); ctx.drawImage(SPR.hamster, -r * 0.82, -r * 0.8 + bob, r * 1.64, r * 1.64); ctx.restore();
    ctx.save(); ctx.rotate(ball.a); ctx.drawImage(SPR.seam, -r, -r, r * 2, r * 2); ctx.restore();
    ctx.drawImage(SPR.shell, -r * 1.04, -r * 1.04, r * 2.08, r * 2.08);
    ctx.restore();
  }
  function inkBar() {
    const used = inkUsed(), f = Math.max(0, 1 - used / inkMax), w = Math.min(240, W * 0.55), x = W / 2 - w / 2, y = 72, h = 16;
    ctx.save();
    ctx.fillStyle = 'rgba(20,50,80,.35)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - 4, y - 4, w + 8, h + 8, 12) : ctx.rect(x - 4, y - 4, w + 8, h + 8); ctx.fill();
    const bw = Math.max(0, (w - 22) * f);
    if (bw > 0) {
      const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#ffe680'); g.addColorStop(0.5, '#ffc61a'); g.addColorStop(1, '#d88a00');
      ctx.fillStyle = '#ffb0b8'; ctx.fillRect(x, y, 8, h); ctx.fillStyle = '#c0c4cc'; ctx.fillRect(x + 8, y, 5, h);
      ctx.fillStyle = g; ctx.fillRect(x + 13, y, Math.max(0, bw - 13), h);
      ctx.fillStyle = 'rgba(160,90,0,.35)'; ctx.fillRect(x + 13, y + h / 3, Math.max(0, bw - 13), 1); ctx.fillRect(x + 13, y + 2 * h / 3, Math.max(0, bw - 13), 1);
      ctx.fillStyle = '#f2d2a2'; ctx.beginPath(); ctx.moveTo(x + bw, y); ctx.lineTo(x + bw + 18, y + h / 2); ctx.lineTo(x + bw, y + h); ctx.fill();
      ctx.fillStyle = '#3a2a1a'; ctx.beginPath(); ctx.moveTo(x + bw + 12, y + h * 0.33); ctx.lineTo(x + bw + 18, y + h / 2); ctx.lineTo(x + bw + 12, y + h * 0.67); ctx.fill();
    }
    ctx.fillStyle = '#fff'; ctx.font = '700 11px "Avenir Next", "Segoe UI", sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText('INK', x - 10, y + h / 2);
    ctx.textAlign = 'left'; ctx.fillText(Math.round(f * 100) + '%', x + w + 10, y + h / 2);
    ctx.restore();
  }
  function render() {
    background();
    if (!L || !SPR) return;
    ctx.drawImage(terrainCv, 0, 0, W, H);
    // goal nest
    const gx = X(L.goal[0]), gy = Y(L.goal[1]), gw = 66 * S, gh = gw * 150 / 180;
    const glow = ctx.createRadialGradient(gx, gy - 20 * S, 0, gx, gy - 20 * S, 46 * S); glow.addColorStop(0, 'rgba(255,240,150,' + (0.45 + 0.2 * Math.sin(t * 4)) + ')'); glow.addColorStop(1, 'rgba(255,240,150,0)');
    ctx.fillStyle = glow; ctx.fillRect(gx - 50 * S, gy - 70 * S, 100 * S, 100 * S);
    ctx.save(); ctx.translate(gx, gy + 3 * S); if (mirror) ctx.scale(-1, 1); ctx.drawImage(SPR.nest, -gw / 2, -gh * 0.92, gw, gh); ctx.restore();
    for (const s of strokes) drawStroke(s);
    if (cur) drawStroke(cur, true);
    // start marker
    if (phase === 'draw' && state === 'play') { ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 + 0.3 * Math.sin(t * 5)) + ')'; ctx.setLineDash([4, 5]); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X(ball.sx), Y(ball.sy), (BR + 10) * S, 0, 6.29); ctx.stroke(); ctx.setLineDash([]); }
    drawBall();
    seaFront();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5)); ctx.fillStyle = p.c; if (p.conf) { ctx.save(); ctx.translate(X(p.x), Y(p.y)); ctx.rotate(p.life * 8); ctx.fillRect(-4, -2, 8, 4); ctx.restore(); } else { ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 2.5, 0, 6.29); ctx.fill(); } }
    ctx.globalAlpha = 1;
    inkBar();
  }
  function logo() {
    const lc = $('logo').getContext('2d');
    const cliff = (pts, top) => { const g = lc.createLinearGradient(0, top, 0, 380); g.addColorStop(0, '#e6b26e'); g.addColorStop(1, '#8a5428'); lc.fillStyle = g; lc.beginPath(); pts.forEach((p, i) => i ? lc.lineTo(p[0], p[1]) : lc.moveTo(p[0], p[1])); lc.closePath(); lc.fill(); lc.strokeStyle = '#5a3010'; lc.lineWidth = 3; lc.stroke(); lc.strokeStyle = '#6cc040'; lc.lineWidth = 9; lc.lineCap = 'round'; lc.beginPath(); lc.moveTo(pts[0][0], pts[0][1] + 3); lc.lineTo(pts[1][0], pts[1][1] + 3); lc.stroke(); };
    cliff([[0, 150], [130, 200], [130, 380], [0, 380]], 150); cliff([[320, 250], [460, 250], [460, 380], [320, 380]], 250);
    const g = lc.createLinearGradient(0, 320, 0, 380); g.addColorStop(0, '#2fa6d0'); g.addColorStop(1, '#0f5a8a'); lc.fillStyle = g; lc.fillRect(130, 330, 190, 50);
    lc.strokeStyle = '#fff'; lc.lineWidth = 3; lc.beginPath(); for (let x = 130; x <= 320; x += 8) lc.lineTo(x, 330 + Math.sin(x * 0.1) * 3); lc.stroke();
    lc.lineCap = 'round'; lc.strokeStyle = '#5a2e0a'; lc.lineWidth = 15; lc.beginPath(); lc.moveTo(126, 203); lc.quadraticCurveTo(230, 262, 324, 252); lc.stroke();
    lc.strokeStyle = '#ff9a3a'; lc.lineWidth = 9; lc.stroke(); lc.strokeStyle = 'rgba(255,240,200,.8)'; lc.lineWidth = 2.5; lc.stroke();
    lc.drawImage(SPR.nest, 360, 172, 96, 80);
    const bx = 215, by = 205, r = 36;
    lc.drawImage(SPR.hamster, bx - r * 0.82, by - r * 0.8, r * 1.64, r * 1.64); lc.save(); lc.translate(bx, by); lc.rotate(0.6); lc.drawImage(SPR.seam, -r, -r, r * 2, r * 2); lc.restore(); lc.drawImage(SPR.shell, bx - r * 1.04, by - r * 1.04, r * 2.08, r * 2.08);
    lc.strokeStyle = 'rgba(255,255,255,.8)'; lc.lineWidth = 3; for (let i = 0; i < 3; i++) { lc.beginPath(); lc.moveTo(bx - 50 - i * 6, by - 14 + i * 14); lc.lineTo(bx - 76 - i * 10, by - 18 + i * 14); lc.stroke(); }
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
