<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd6ec">
<title>Candy Roll</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffd6ec;
    font-family: "Arial Rounded MT Bold", "Varela Round", "Nunito", "Segoe UI", sans-serif; color: #7a2e5c;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; gap: 10px; pointer-events: none; }
  .hud div { background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 0 #f59ac8; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px;
    text-align: center; background: #ffe9f5e6; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  h1 { font-size: clamp(46px, 14vw, 84px); line-height: .9; color: #ff5fa2;
    text-shadow: 0 4px 0 #fff, 0 8px 0 #7ad7c8, 0 14px 20px #c0508a55; }
  h1 span { color: #7ad7c8; text-shadow: 0 4px 0 #fff, 0 8px 0 #ff5fa2, 0 14px 20px #c0508a55; }
  p { max-width: 320px; line-height: 1.55; font-size: 16px; }
  .chips { display: flex; gap: 10px; }
  .chips div { background: #fff; border-radius: 18px; padding: 8px 14px; box-shadow: 0 4px 0 #f59ac8; } .chips small { display: block; font-size: 11px; opacity: .7; } .chips b { font-size: 22px; color: #ff5fa2; }
  .btn { border: none; cursor: pointer; font: inherit; font-weight: bold; font-size: 22px; color: #fff; padding: 14px 46px; border-radius: 40px;
    background: repeating-linear-gradient(-45deg, #ff5fa2 0 14px, #ff7fb6 14px 28px); box-shadow: 0 6px 0 #c0508a; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c0508a; }
  small.k { font-size: 12px; opacity: .65; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div id="score">0</div><div id="candy">🍬 0</div></div>

<div class="overlay" id="menu">
  <h1>CANDY<br><span>ROLL</span></h1>
  <p><b>Drag</b> left and right to keep the gumball on the twisty sugar road. <b>Tap</b> to hop over gumdrops. Don't roll off the edge!</p>
  <div class="chips"><div><small>BEST</small><b id="bestMenu">0</b></div></div>
  <button class="btn" id="startBtn">ROLL!</button>
  <small class="k">Keyboard: ← → · Space hop</small>
</div>
<div class="overlay hidden" id="over">
  <h1>OOPS!</h1>
  <div class="chips">
    <div><small>SCORE</small><b id="finalScore">0</b></div>
    <div><small>CANDY</small><b id="finalCandy">0</b></div>
    <div><small>BEST</small><b id="bestOver">0</b></div>
  </div>
  <button class="btn" id="againBtn">AGAIN!</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const audio = GameAudio({
    bpm: 118, scale: 'major', root: 65, prog: [0, 5, 3, 4], seed: 91,
    waves: { lead: 'sine', bass: 'triangle', arp: 'sine' },
    arp: true, arpEvery: 1, arpOct: 1, leadOct: 1, leadDensity: 0.35, drums: true, bassPattern: [0, 6, 8], volume: 0.17,
    btnBg: 'rgba(255,95,162,.5)'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'candy_roll_best';
  let best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  $('bestMenu').textContent = best;

  let W, H, DPR, cx, horizon, f;
  const CAM_H = 1.1, CAMZ = 2.2, DRAW = 110, RW = 1;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2; horizon = H * 0.38;
    f = Math.min((H * 0.86 - horizon) * CAMZ / CAM_H, W * 0.42 * CAMZ / RW);
  }
  addEventListener('resize', resize); resize();

  // track: per-segment curvature, generated in sections
  let curves = [], genSeg = 0;
  function genSection() {
    const diff = Math.min(1, genSeg / 4000);
    const straight = Math.random() < 0.3;
    const c = straight ? 0 : (Math.random() < 0.5 ? -1 : 1) * (0.0012 + Math.random() * (0.0018 + diff * 0.0015));
    const len = 40 + Math.floor(Math.random() * 50), ease = 15;
    for (let i = 0; i < len; i++) {
      const k = i < ease ? i / ease : i > len - ease ? (len - i) / ease : 1;
      curves[genSeg++] = c * k;
    }
  }
  const curveAt = i => { while (i >= genSeg) genSection(); return curves[i] || 0; };

  let state = 'menu', pos, speed, px, hop, hopV, objs, nextObj, candy, t = 0, bg = 0, dead = false, deadT = 0, fall = 0, sprinkles = [];
  function reset() {
    curves = []; genSeg = 0;
    for (let i = 0; i < 30; i++) curves[genSeg++] = 0;
    pos = 0; speed = 16; px = 0; hop = 0; hopV = 0; objs = []; nextObj = 40; candy = 0; dead = false; fall = 0; bg = 0; sprinkles = [];
  }
  reset();
  const score = () => Math.floor(pos) + candy * 20;

  function spawnAt(z) {
    const r = Math.random();
    if (r < 0.35) objs.push({ type: 'gum', z, x: (Math.random() - 0.5) * 1.4, col: ['#ff5fa2', '#7ad7c8', '#ffcf5a', '#9b8cff'][Math.floor(Math.random() * 4)] });
    else if (r < 0.6) objs.push({ type: 'pop', z, x: (Math.random() < 0.5 ? -1 : 1) * (0.25 + Math.random() * 0.5) });
    else { const x = (Math.random() - 0.5) * 1.2; for (let i = 0; i < 4; i++) objs.push({ type: 'candy', z: z + i * 2, x }); }
  }

  function start() {
    reset(); state = 'play'; audio.start();
    $('menu').classList.add('hidden'); $('over').classList.add('hidden');
    audio.sfx(660, 0.12, 'sine', 0.07); setTimeout(() => audio.sfx(990, 0.18, 'sine', 0.07), 110);
  }
  function lose() {
    if (dead) return;
    dead = true; deadT = 1.2;
    audio.sfx(700, 0.8, 'sine', 0.08, 120);
    if (navigator.vibrate) try { navigator.vibrate(120); } catch (e) {}
  }
  function gameOver() {
    state = 'over';
    const s = score(); if (s > best) { best = s; try { localStorage.setItem(KEY, best); } catch (e) {} }
    $('finalScore').textContent = s; $('finalCandy').textContent = candy; $('bestOver').textContent = best; $('bestMenu').textContent = best;
    $('over').classList.remove('hidden');
  }
  function jump() { if (state === 'play' && !dead && hop <= 0) { hopV = 3.4; hop = 0.001; audio.sfx(520, 0.15, 'sine', 0.06, 1040); } }

  // drag steering (relative), tap = hop
  let dragging = false, lastX = 0, startX = 0, startY = 0, downT = 0, moved = false;
  canvas.addEventListener('pointerdown', e => { dragging = true; lastX = startX = e.clientX; startY = e.clientY; downT = performance.now(); moved = false; });
  addEventListener('pointermove', e => {
    if (!dragging) return;
    if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) moved = true;
    if (state === 'play' && !dead) px += (e.clientX - lastX) / (f / CAMZ) * 1.3;
    lastX = e.clientX;
  });
  addEventListener('pointerup', () => { if (dragging && !moved && performance.now() - downT < 300) jump(); dragging = false; });
  const keys = {};
  addEventListener('keydown', e => {
    if (state !== 'play' && (e.key === 'Enter' || e.key === ' ')) { start(); e.preventDefault(); return; }
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'ArrowUp') { jump(); e.preventDefault(); }
  });
  addEventListener('keyup', e => { keys[e.key] = false; });
  $('startBtn').onclick = start; $('againBtn').onclick = start;

  function update(dt) {
    t += dt;
    if (state === 'menu') { pos += 8 * dt; }
    if (state === 'play') {
      if (!dead) {
        speed = Math.min(42, 16 + pos / 120);
        pos += speed * dt;
        const c = curveAt(Math.floor(pos + CAMZ));
        px -= c * speed * speed * 0.08 * dt;        // centrifugal drift on bends
        bg += c * speed * dt * 60;
        const kd = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
        px += kd * 2.4 * dt;
        if (hop > 0) { hopV -= 9 * dt; hop += hopV * dt; if (hop <= 0) { hop = 0; audio.sfx(200, 0.06, 'sine', 0.05); } }
        if (Math.abs(px) > RW + 0.05 && hop < 0.05) lose();
        while (nextObj < pos + DRAW) { spawnAt(nextObj); nextObj += Math.max(9, 18 - pos / 300) + Math.random() * 8; }
        const pz = pos + CAMZ;
        for (const o of objs) {
          if (o.taken || Math.abs(o.z - pz) > 0.5) continue;
          const dx = Math.abs(o.x - px);
          if (o.type === 'candy' && dx < 0.28) { o.taken = true; candy++; audio.sfx(1200 + (candy % 4) * 150, 0.08, 'sine', 0.06); for (let i = 0; i < 6; i++) sprinkles.push({ x: cx, y: H * 0.8, vx: (Math.random() - .5) * 300, vy: -Math.random() * 300, life: 0.6, c: ['#ff5fa2', '#7ad7c8', '#ffcf5a'][i % 3] }); }
          else if (o.type === 'gum' && dx < 0.3 && hop < 0.35) lose();
          else if (o.type === 'pop' && dx < 0.18) lose();
        }
        objs = objs.filter(o => o.z > pos && !o.taken);
      } else {
        fall += dt * 3;
        deadT -= dt; if (deadT <= 0 && state === 'play') gameOver();
      }
    }
    for (const s of sprinkles) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 600 * dt; s.life -= dt; }
    sprinkles = sprinkles.filter(s => s.life > 0);
  }

  function quad(c, x1, y1, w1, x2, y2, w2) {
    ctx.fillStyle = c; ctx.beginPath();
    ctx.moveTo(x1 - w1, y1); ctx.lineTo(x1 + w1, y1); ctx.lineTo(x2 + w2, y2); ctx.lineTo(x2 - w2, y2); ctx.closePath(); ctx.fill();
  }

  function render() {
    // sky
    const g = ctx.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, '#a8e6ff'); g.addColorStop(1, '#ffe0f0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon + 1);
    // cotton candy clouds
    for (let i = 0; i < 6; i++) {
      const x = ((i * 260 - bg * 0.3) % (W + 300) + W + 300) % (W + 300) - 150, y = horizon * (0.2 + (i % 3) * 0.18);
      ctx.fillStyle = i % 2 ? '#ffffffdd' : '#ffd1ecdd';
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(x + k * 26, y + (k % 2) * 6, 22 + (k % 2) * 8, 0, Math.PI * 2); ctx.fill(); }
    }
    // candy hills
    for (const [par, col, amp] of [[0.6, '#f7b6d8', 0.18], [1, '#b8eadf', 0.1]]) {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, horizon + 1);
      for (let x = 0; x <= W + 20; x += 20) { const wx = x + bg * par; ctx.lineTo(x, horizon - Math.abs(Math.sin(wx * 0.006)) * H * amp - Math.sin(wx * 0.02) * 6); }
      ctx.lineTo(W, horizon + 1); ctx.fill();
    }
    ctx.fillStyle = '#fff4e0'; ctx.fillRect(0, horizon, W, H - horizon);

    // project segments
    const base = Math.floor(pos), frac = pos - base;
    const camX = px * 0.75;
    let x = 0, dx = -curveAt(base) * frac;
    const P = [];
    for (let n = 0; n <= DRAW; n++) {
      const z = n - frac + 0.001;
      if (z > 0.3) {
        const s = f / z;
        P.push({ n, z, sx: cx + (x - camX) * s, sy: horizon + CAM_H * s, sw: RW * s, s, roadX: x });
      }
      x += dx; dx += curveAt(base + n);
    }
    for (let i = P.length - 2; i >= 0; i--) {
      const a = P[i], b2 = P[i + 1];
      const stripe = (base + a.n) % 4 < 2;
      quad(stripe ? '#fff4e0' : '#fde7d2', a.sx, a.sy, W * 3, b2.sx, b2.sy, W * 3);
      quad(stripe ? '#ff5fa2' : '#ffffff', a.sx, a.sy, a.sw * 1.16, b2.sx, b2.sy, b2.sw * 1.16);
      quad(stripe ? '#ffd0e6' : '#ffe2ef', a.sx, a.sy, a.sw, b2.sx, b2.sy, b2.sw);
      if (stripe) quad('#ffffffaa', a.sx, a.sy, a.sw * 0.03, b2.sx, b2.sy, b2.sw * 0.03);
    }
    // objects (far to near)
    const byZ = objs.slice().sort((p, q) => q.z - p.z);
    const ballZ = CAMZ;
    let ballDrawn = false;
    const drawBall = () => {
      const s = f / ballZ, r = 0.17 * s;
      const bx = cx + (px - camX) * s, by = horizon + CAM_H * s - r - hop * s * 0.25 + (dead ? fall * fall * 40 : 0);
      ctx.fillStyle = 'rgba(160,60,110,.2)'; ctx.beginPath(); ctx.ellipse(cx + (px - camX) * s, horizon + CAM_H * s, r * (1 - hop * 0.3), r * 0.25, 0, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.translate(bx, by); ctx.scale(dead ? Math.max(0.2, 1 - fall * 0.3) : 1, dead ? Math.max(0.2, 1 - fall * 0.3) : 1);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = '#ff5fa2'; ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.fillStyle = '#ffffff';
      const roll = (pos * 2.2) % 1;
      for (let k = -2; k < 3; k++) ctx.fillRect(-r, (k + roll) * r * 0.8 - r * 0.15, r * 2, r * 0.3);
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.4, r * 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    };
    for (const o of byZ) {
      const z = o.z - pos;
      if (!ballDrawn && z < ballZ) { drawBall(); ballDrawn = true; }
      if (z < 0.4 || z > DRAW) continue;
      // road x at this depth: interpolate from projected list
      const p = P.find(q => q.z >= z) || P[P.length - 1];
      const s = f / z;
      const ox = cx + (p.roadX + o.x - camX) * s, oy = horizon + CAM_H * s;
      if (o.type === 'gum') {
        const r = 0.16 * s;
        ctx.fillStyle = o.col; ctx.beginPath(); ctx.ellipse(ox, oy - r * 0.6, r, r * 0.9, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(ox - r, oy - r * 0.6, r * 2, r * 0.6);
        ctx.fillStyle = '#ffffff99'; ctx.beginPath(); ctx.arc(ox - r * 0.4, oy - r * 0.9, r * 0.18, 0, Math.PI * 2); ctx.fill();
      } else if (o.type === 'pop') {
        const r = 0.2 * s, hh = 0.75 * s;
        ctx.fillStyle = '#fff'; ctx.fillRect(ox - s * 0.02, oy - hh, s * 0.04, hh);
        ctx.fillStyle = '#7ad7c8'; ctx.beginPath(); ctx.arc(ox, oy - hh, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1, r * 0.18); ctx.beginPath();
        for (let a = 0; a < 12; a += 0.3) ctx.lineTo(ox + Math.cos(a) * r * a / 12, oy - hh + Math.sin(a) * r * a / 12);
        ctx.stroke();
      } else if (o.type === 'candy') {
        const r = 0.08 * s, y = oy - 0.2 * s + Math.sin(t * 5 + o.z) * 0.03 * s;
        ctx.save(); ctx.translate(ox, y); ctx.rotate(t * 2 + o.z);
        ctx.fillStyle = '#ffcf5a'; ctx.beginPath(); ctx.moveTo(-r * 2.2, -r * 0.7); ctx.lineTo(-r, 0); ctx.lineTo(-r * 2.2, r * 0.7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(r * 2.2, -r * 0.7); ctx.lineTo(r, 0); ctx.lineTo(r * 2.2, r * 0.7); ctx.fill();
        ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
    if (!ballDrawn) drawBall();
    for (const sp of sprinkles) { ctx.globalAlpha = Math.max(0, sp.life * 1.6); ctx.fillStyle = sp.c; ctx.fillRect(sp.x, sp.y, 6, 3); }
    ctx.globalAlpha = 1;
    $('score').textContent = state === 'menu' ? 'BEST ' + best : score(); $('candy').textContent = '🍬 ' + candy;
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
