<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1e2e">
<title>Jetpack Rush</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1e2e; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding-top: env(safe-area-inset-top); visibility: hidden; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; transition: opacity .35s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  #menu { background: radial-gradient(ellipse at 50% 45%, rgba(10,14,30,.1), rgba(8,10,22,.75) 80%); }
  .title { font-size: clamp(56px, 16vw, 110px); font-weight: 900; line-height: .86; letter-spacing: 1px; transform: rotate(-4deg);
    background: linear-gradient(180deg, #ffffff 0%, #fff3a0 35%, #ffb02a 65%, #e8501a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #4a1a04) drop-shadow(0 0 22px rgba(255,170,40,.6)); }
  .title span { display: block; background: linear-gradient(180deg, #ffffff 0%, #d8f8ff 35%, #5ad8ff 65%, #2a7ae8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 #0a2a5a) drop-shadow(0 0 22px rgba(90,200,255,.6)); }
  .tag { font-size: 13px; letter-spacing: 6px; font-weight: 800; color: #ffe8b0; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .hero { display: flex; align-items: center; gap: 10px; }
  .hero canvas { width: 130px; height: 130px; }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); background: rgba(255,255,255,.1); color: #fff; font-size: 20px; font-weight: 900; cursor: pointer; }
  .skin { font-size: 15px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 6px rgba(0,0,0,.6); min-height: 20px; } .skin.lock { color: #b8b8c8; }
  .stat { font-size: 14px; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,.7); } .stat b { color: #ffd84a; }
  .btn { border: 0; padding: 16px 56px; border-radius: 40px; font: inherit; font-size: 24px; font-weight: 900; letter-spacing: 5px; color: #3a1a04; cursor: pointer;
    background: linear-gradient(180deg, #fff27a, #ffb02a 60%, #ff7a1a); box-shadow: 0 0 0 4px #fff8d0 inset, 0 8px 0 #7a3004, 0 0 30px rgba(255,170,40,.6); animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px) scale(1.03); } }
  .hint { font-size: 12px; letter-spacing: 1px; color: #e0e8ff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  #over { background: radial-gradient(ellipse at 50% 40%, rgba(40,20,10,.6), rgba(8,10,22,.93)); }
  #over h2 { font-size: clamp(44px, 12vw, 78px); font-weight: 900; color: #ffb02a; text-shadow: 0 5px 0 #4a1a04, 0 0 24px rgba(255,170,40,.7); }
  #overScore { font-size: 56px; font-weight: 900; text-shadow: 0 0 20px rgba(90,200,255,.8); }
  #newBest { font-size: 16px; font-weight: 900; letter-spacing: 4px; color: #2a1004; background: linear-gradient(90deg, #ffe84a, #ffb02a); padding: 5px 16px; border-radius: 8px; transform: rotate(-3deg); box-shadow: 0 0 20px rgba(255,220,80,.8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; font-size: 14px; color: #dce4f8; text-align: left; } .grid b { color: #fff; float: right; margin-left: 12px; }
  #pause { background: rgba(8,10,22,.6); font-size: 30px; font-weight: 900; letter-spacing: 6px; }
  @media (max-height: 520px) {
    .overlay { gap: 6px; padding: 8px 16px; }
    .title { font-size: 50px; } .tag { font-size: 10px; letter-spacing: 4px; }
    .garage canvas, .hangar canvas, .hero canvas { height: 68px; width: auto; } .arrow { width: 34px; height: 34px; font-size: 15px; }
    .btn { padding: 10px 40px; font-size: 19px; } .hint { display: none; } .stat, .skin { font-size: 12px; }
    #over h2 { font-size: 38px; } #overScore { font-size: 36px; } .grid { font-size: 12px; gap: 3px 18px; } #newBest { font-size: 12px; padding: 3px 10px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div class="overlay" id="menu">
  <div class="tag">⚡ SECRET LAB ESCAPE ⚡</div>
  <div class="title">JETPACK<span>RUSH</span></div>
  <div class="hero"><button class="arrow" id="prevSkin">◀</button><canvas id="skinPrev" width="260" height="260"></canvas><button class="arrow" id="nextSkin">▶</button></div>
  <div class="skin" id="skinName"></div>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">FLY</button>
  <div class="hint">HOLD anywhere to fly up · release to fall · Space / ↑</div>
</div>
<div class="overlay hidden" id="over">
  <h2 id="overTitle">ZAPPED!</h2>
  <div id="overScore">0</div>
  <div id="newBest">NEW BEST!</div>
  <div class="grid" id="overStats"></div>
  <button class="btn" id="againBtn">FLY AGAIN</button>
  <div class="hint" id="unlockMsg"></div>
</div>
<div class="overlay hidden" id="pause">PAUSED<div class="hint">tap to continue</div></div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function makeNoise() {
    if (noiseBuf) return;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, vol, hp) {
    makeNoise();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    // filtered noise burst for explosions, crashes, splashes and whooshes; the filter can sweep to `to`
    boom(dur = 0.5, vol = 0.2, cutoff = 900, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime; makeNoise();
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
        if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
      } catch (e) {}
    },
    // a continuous voice (engines, wind, jets): call set(freq, vol) every frame, stop() to fade out
    hum(type = 'sawtooth', cutoff = 800) {
      let o = null, g = null;
      const make = () => {
        init();
        if (!ctx || o) return;
        try {
          o = ctx.createOscillator(); o.type = type;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
          g = ctx.createGain(); g.gain.value = 0;
          o.connect(f); f.connect(g); g.connect(sfxBus); o.start();
        } catch (e) { o = null; }
      };
      return {
        set(freq, vol) { make(); if (!o) return; const t = ctx.currentTime; o.frequency.setTargetAtTime(Math.max(20, freq), t, 0.05); g.gain.setTargetAtTime(vol, t, 0.08); },
        stop() { if (g) g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
      };
    }
  };
};
/*AUDIO-ENGINE-END*/
/*SPRITES-START*/
// ---------- sprites: detailed SVG artwork rasterised once into canvases ----------
// Each piece is authored as an SVG (gradients, highlights, shadows, glow) and
// drawn into an offscreen canvas at load time, so the game loop just blits images.
const loadSprites = (defs, px = 160) => Promise.all(Object.entries(defs).map(([name, svg]) => new Promise(done => {
  const img = new Image();
  const finish = ok => {
    const c = document.createElement('canvas');
    const w = Array.isArray(px) ? px[0] : px, h = Array.isArray(px) ? px[1] : px;
    c.width = w; c.height = h;
    if (ok) c.getContext('2d').drawImage(img, 0, 0, w, h);
    done([name, c]);
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}))).then(entries => Object.fromEntries(entries));

// small helpers for writing SVG
const svgDoc = (body, vb = '0 0 100 100') => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>';
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
};
/*SPRITES-END*/
/*FX-START*/
// ---------- juice: particles, popping text, shock rings, screen shake and flashes ----------
// Coordinates are screen pixels. Call FX.update(dt) every frame and FX.draw(ctx) after the scene.
const FX = (() => {
  let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, flashC = '#fff', flashA = 0;
  const TAU = Math.PI * 2;
  function star(ctx, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function heart(ctx, r) { ctx.beginPath(); ctx.moveTo(0, r * .7); ctx.bezierCurveTo(-r * 1.6, -r * .3, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .3, 0, r * .7); ctx.fill(); }
  return {
    // o: n, colors, speed, size, gravity, life, shape (circle|star|square|spark|heart|drop), dir, spread, drag
    burst(x, y, o = {}) {
      const n = Math.min(o.n || 14, Math.max(0, 1500 - parts.length));
      for (let i = 0; i < n; i++) {
        const a = o.dir != null ? o.dir + (Math.random() - .5) * (o.spread != null ? o.spread : TAU) : Math.random() * TAU, v = (o.speed || 240) * (.3 + Math.random() * .8), life = (o.life || .8) * (.6 + Math.random() * .6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity != null ? o.gravity : 600, life, max: life, size: (o.size || 6) * (.5 + Math.random() * .8), c: o.colors ? o.colors[i % o.colors.length] : '#fff', shape: o.shape || 'circle', rot: Math.random() * 6, vr: (Math.random() - .5) * 14, drag: o.drag || .985, glow: o.glow });
      }
    },
    // popping score text with an elastic scale-in
    text(x, y, str, o = {}) { if (texts.length > 40) texts.shift(); texts.push({ x, y, str: String(str), c: o.color || '#fff', stroke: o.stroke || 'rgba(0,0,0,.55)', size: o.size || 28, life: o.life || .9, max: o.life || .9, rise: o.rise != null ? o.rise : 70, font: o.font || '900 ', wobble: o.wobble || 0 }); },
    ring(x, y, o = {}) { rings.push({ x, y, r0: o.r0 || 6, r1: o.r1 || 70, c: o.color || '#fff', w: o.width || 6, life: o.life || .4, max: o.life || .4 }); },
    shake(a = 8, t = .25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
    flash(c = '#fff', a = .35) { flashC = c; flashA = Math.max(flashA, a); },
    offset() { if (shakeT <= 0) return [0, 0]; const k = shakeA * Math.min(1, shakeT * 4); return [(Math.random() - .5) * 2 * k, (Math.random() - .5) * 2 * k]; },
    clear() { parts = []; texts = []; rings = []; shakeT = 0; flashA = 0; },
    update(dt) {
      shakeT = Math.max(0, shakeT - dt); if (shakeT <= 0) shakeA = 0; flashA = Math.max(0, flashA - dt * 2.2);
      for (const p of parts) { p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const t of texts) { t.life -= dt; t.y -= t.rise * dt * (t.life / t.max); } texts = texts.filter(t => t.life > 0);
      for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
    },
    draw(ctx) {
      for (const r of rings) { const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke(); }
      for (const p of parts) {
        const k = p.life / p.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.c;
        if (p.glow) { ctx.shadowColor = p.c; ctx.shadowBlur = 10; }
        ctx.save(); ctx.translate(p.x, p.y);

    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.hypot(W, H) * .6); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,10,.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); FX.draw(ctx); FX.drawFlash(ctx, W, H); drawHUD(S);
  }
  function drawObs(o) {
    const sx = o.x - G.x + PX;
    if (o.type === 'zap') {
      const bx = sx + Math.cos(o.a) * o.len, by = o.y + Math.sin(o.a) * o.len; if (Math.max(sx, bx) < -60 || Math.min(sx, bx) > W + 60) return;
      ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,220,80,.25)'; ctx.lineWidth = 26 * U; ctx.beginPath(); ctx.moveTo(sx, o.y); ctx.lineTo(bx, by); ctx.stroke();
      // a jagged electric arc, re-rolled every frame
      for (const [col, lw] of [['rgba(255,200,60,.9)', 5 * U], ['#ffffff', 2 * U]]) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(sx, o.y); const n = Math.max(4, Math.floor(o.len / 18)); for (let i = 1; i < n; i++) { const t = i / n, nx = -Math.sin(o.a), ny = Math.cos(o.a), j = (Math.random() - .5) * 14 * U; ctx.lineTo(sx + (bx - sx) * t + nx * j, o.y + (by - o.y) * t + ny * j); } ctx.lineTo(bx, by); ctx.stroke(); }
      ctx.globalCompositeOperation = 'source-over'; ctx.lineCap = 'butt';
      const s = 40 * U; ctx.drawImage(SPR.node, sx - s / 2, o.y - s / 2, s, s); ctx.drawImage(SPR.node, bx - s / 2, by - s / 2, s, s);
    } else if (o.type === 'laser') {
      const t = o.t, firing = t > o.warm && t < o.warm + o.fire;
      // emitters on both screen edges
      for (const x of [14, W - 14]) { ctx.fillStyle = '#3a4252'; ctx.beginPath(); ctx.roundRect(x - 12, o.y - 16, 24, 32, 6); ctx.fill(); ctx.fillStyle = firing ? '#ffffff' : '#ff3a3a'; ctx.beginPath(); ctx.arc(x, o.y, 6, 0, 7); ctx.fill(); }
      if (!firing && t < o.warm) { const k = t / o.warm; ctx.strokeStyle = `rgba(255,60,60,${.25 + k * .5})`; ctx.lineWidth = 2 + k * 2; ctx.setLineDash([12, 10]); ctx.beginPath(); ctx.moveTo(26, o.y); ctx.lineTo(W - 26, o.y); ctx.stroke(); ctx.setLineDash([]); }
      if (firing) { const k = Math.min(1, (t - o.warm) * 8); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,40,80,${.35 * k})`; ctx.fillRect(0, o.y - 30 * U, W, 60 * U); ctx.fillStyle = `rgba(255,120,160,${.9 * k})`; ctx.fillRect(0, o.y - 10 * U, W, 20 * U); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, o.y - 3 * U, W, 6 * U); ctx.globalCompositeOperation = 'source-over'; }
    } else if (o.type === 'missile') {
      if (!o.live) { const s = 34 * U, blink = Math.sin(G.t * 20) > 0; ctx.globalAlpha = blink ? 1 : .5; ctx.drawImage(SPR.warn, W - s - 14, o.y - s / 2, s, s); ctx.globalAlpha = 1; return; }
      const w = 90 * U, h = w * .66; ctx.drawImage(SPR.missile, sx - w * .1, o.y - h / 2, w, h); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(FIRE, sx + w * .85, o.y - 14 * U, 30 * U + Math.random() * 12, 28 * U); ctx.globalCompositeOperation = 'source-over';
    }
  }
  function drawPilot(S) {
    if (!P.alive) return; const k = P.skin, s = 84 * U, onFloor = P.y >= FLOOR - 41;
    ctx.save(); ctx.translate(PX, P.y); ctx.rotate(P.tilt + (P.rocket > 0 ? -.1 : 0));
    if (P.rocket > 0) { const rw = 170 * U, rh = rw * 80 / 210; ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(FIRE, -rw * .5 - 60 * U - Math.random() * 20, -rh * .2 + 6 * U, 80 * U + Math.random() * 30, rh * .7); ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(SPR.ride, -rw * .5, -rh * .1 + 10 * U, rw, rh); }
    const img = SPR[(onFloor ? 'run' : 'fly') + k]; if (onFloor) { const step = Math.sin(P.run * 1.2) > 0; ctx.save(); if (step) ctx.scale(1, 1); ctx.drawImage(img, -s / 2, -s / 2 - (step ? 3 : 0), s, s); ctx.restore(); } else ctx.drawImage(img, -s / 2, -s / 2, s, s);
    ctx.restore();
    if (P.shield > 0) { const blink = P.shield < 3 ? (Math.sin(G.t * 20) > 0 ? 1 : .3) : 1; ctx.globalAlpha = .5 * blink; ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(glow('#5ac8ff', .7), PX - 60 * U, P.y - 60 * U, 120 * U, 120 * U); ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = `rgba(200,245,255,${.8 * blink})`; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(PX, P.y, 48 * U + Math.sin(G.t * 8) * 2, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
    if (P.magnet > 0) { ctx.strokeStyle = 'rgba(255,106,154,.5)'; ctx.lineWidth = 2; for (let i = 0; i < 3; i++) { const r = ((G.t * 120 + i * 60) % 180) * U; ctx.globalAlpha = 1 - r / (180 * U); ctx.beginPath(); ctx.arc(PX, P.y, r, 0, 7); ctx.stroke(); } ctx.globalAlpha = 1; }
  }
  function hudText(str, x, y, size, col, align = 'center', stroke = '#0a0c18') { ctx.font = '900 ' + size + 'px "Avenir Next", "Trebuchet MS", sans-serif'; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * .2); ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); ctx.fillStyle = col; ctx.fillText(str, x, y); }
  function drawHUD(S) {
    if (G.attract) return;
    const top = SAFE_T + 12, sc = Math.min(1.15, Math.max(.8, W / 420));
    hudText(Math.floor((G.x) / 10) + ' m', 16, top + 14 * sc, Math.round(28 * sc), '#ffffff', 'left');
    ctx.drawImage(SPR.coin, 16, top + 30 * sc, 20 * sc, 20 * sc); hudText(String(G.coins), 42 * sc, top + 40 * sc, Math.round(18 * sc), '#ffd23a', 'left');
    hudText(fmt(G.score), W - 16, top + 14 * sc, Math.round(24 * sc), '#ffe84a', 'right');
    const prog = clamp((G.x - G.stageX) / (STAGE_LEN(G.stage) * 10), 0, 1), bw = Math.min(W * .36, 200), bx = W / 2 - bw / 2;
    hudText('SECTOR ' + G.stage, W / 2, top + 6, Math.round(13 * sc), S.accent); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.roundRect(bx, top + 16, bw, 8, 4); ctx.fill(); ctx.fillStyle = S.accent; ctx.beginPath(); ctx.roundRect(bx, top + 16, Math.max(8, bw * prog), 8, 4); ctx.fill();
    const timers = [['shield', P.shield, 30, '#7ae8ff'], ['magnet', P.magnet, 10, '#ff6a9a'], ['rocket', P.rocket, 4.5, '#ffd23a']].filter(t => t[1] > 0);
    timers.forEach(([k, v, m, c], i) => { const x = 16 + i * 46 * sc, y = top + 62 * sc, s = 32 * sc; ctx.drawImage(SPR[k], x, y, s, s); ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, s / 2 + 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * v / m); ctx.stroke(); });
    if (G.combo > 1) hudText('x' + G.combo + ' CLOSE CALLS', W - 16, top + 40 * sc, Math.round(14 * sc), '#7ae8ff', 'right');
    if (G.banner) { const t = G.banner.t, a = t < .25 ? t / .25 : t > 2 ? Math.max(0, (2.4 - t) / .4) : 1; ctx.globalAlpha = a; hudText(G.banner.a, W / 2, H * .35, Math.round(42 * sc), G.banner.col || '#ffd23a'); if (G.banner.b) hudText(G.banner.b, W / 2, H * .35 + 36 * sc, Math.round(15 * sc), '#ffffff'); ctx.globalAlpha = 1; }
    if (G.tut >= 0) { const p = .5 + Math.sin(G.t * 6) * .5; ctx.globalAlpha = .7 + p * .3; hudText('HOLD TO FLY', W / 2, H * .55, Math.round(32 * sc), '#ffd23a'); hudText('release to fall · dodge zappers, lasers and missiles', W / 2, H * .55 + 34 * sc, Math.round(13 * sc), '#ffffff'); ctx.globalAlpha = 1; const hy = H * .55 + 80 * sc + Math.sin(G.t * 6) * 6; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(W / 2, hy, 16 * sc * (1 - p * .2), 0, 7); ctx.fill(); }
  }

  // ---------- flow ----------
  function start() { if (!SPR) return; audio.start(); audioOn = true; $('menu').classList.add('hidden'); $('over').classList.add('hidden'); newRun(false); }
  $('startBtn').onclick = start; $('againBtn').onclick = start;
  function gameOver() {
    const sc = Math.floor(G.score), prev = SAVE.best, nb = sc > prev; if (nb) SAVE.best = sc; SAVE.bestDist = Math.max(SAVE.bestDist, Math.floor(G.x / 10)); SAVE.coins += G.coins; saveNow();
    $('overScore').textContent = fmt(sc); $('newBest').style.display = nb ? 'block' : 'none';
    $('overStats').innerHTML = [['Distance', Math.floor(G.x / 10) + ' m'], ['Sector', G.stage], ['Coins', G.coins], ['Close calls', G.near]].map(([a, b]) => '<div>' + a + '<b>' + b + '</b></div>').join('');
    const un = SKINS.filter(s => s.need > prev && s.need <= SAVE.best).map(s => s.name); $('unlockMsg').textContent = un.length ? 'NEW PILOT UNLOCKED: ' + un.join(', ') : 'Best: ' + fmt(SAVE.best);
    $('over').classList.remove('hidden'); updateMenu(); if (audioOn) jet.set(60, 0);
  }
  let prevSkin = SAVE.skin;
  function updateMenu() { $('bestMenu').innerHTML = SAVE.best ? 'BEST <b>' + fmt(SAVE.best) + '</b> · <b>' + SAVE.bestDist + ' m</b> · SECTOR <b>' + SAVE.bestStage + '</b>' : 'Escape the lab · grab coins · never stop flying'; drawPreview(); }
  function drawPreview() {
    if (!SPR) return; const g = $('skinPrev').getContext('2d'); g.clearRect(0, 0, 260, 260); const s = SKINS[prevSkin], locked = s.need > SAVE.best;
    const gl = g.createRadialGradient(130, 130, 10, 130, 130, 130); gl.addColorStop(0, locked ? 'rgba(160,160,180,.25)' : 'rgba(255,190,80,.5)'); gl.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gl; g.fillRect(0, 0, 260, 260);
    g.globalAlpha = locked ? .35 : 1; g.drawImage(FIRE, 30, 150, 70, 90); g.drawImage(SPR['fly' + prevSkin], 20, 20, 220, 220); g.globalAlpha = 1;
    $('skinName').textContent = locked ? '🔒 ' + s.name + ' · score ' + fmt(s.need) : s.name; $('skinName').className = 'skin' + (locked ? ' lock' : '');
    if (!locked) { SAVE.skin = prevSkin; saveNow(); }
  }
  $('prevSkin').onclick = () => { prevSkin = (prevSkin + SKINS.length - 1) % SKINS.length; drawPreview(); };
  $('nextSkin').onclick = () => { prevSkin = (prevSkin + 1) % SKINS.length; drawPreview(); };
  updateMenu();
  function pause() { if (!G || G.attract || G.over || paused) return; paused = true; $('pause').classList.remove('hidden'); if (audioOn) jet.set(60, 0); }
  function resume() { paused = false; $('pause').classList.add('hidden'); last = performance.now(); ptrs.clear(); }
  $('pause').addEventListener('pointerdown', resume);
  addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.__jr = { G: () => G, P: () => P, start, autopilot: v => { G.autopilot = v; }, god: v => { G.god = v; }, setStage: n => { G.stage = n - 1; nextSector(); }, obs: () => obs.length, give: k => grab({ kind: k }) };

  let last = performance.now();
  (function loop(now) { const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; if (!paused) update(dt); render(); requestAnimationFrame(loop); })(last);
})();
</script>
