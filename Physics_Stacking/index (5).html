<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fd6e8">
<title>Ice Cream Tower</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #7fd6e8;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #fff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; font-weight: bold; }
  .hud b { font-size: 34px; text-shadow: 0 3px 0 #3aa2b8; }
  .hud span { font-size: 24px; }
  .meter { position: fixed; left: 50%; top: max(70px, calc(env(safe-area-inset-top) + 58px)); width: 160px; margin-left: -80px; height: 10px; border-radius: 6px; background: #ffffff55; pointer-events: none; overflow: hidden; }
  .meter i { position: absolute; top: 0; bottom: 0; width: 14px; margin-left: -7px; left: 50%; border-radius: 6px; background: #fff; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
    background: #ff8fb1e6; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  h1 { font-size: clamp(42px, 12vw, 70px); line-height: .95; text-shadow: 0 5px 0 #e0577f; transform: rotate(-3deg); }
  p { max-width: 310px; font-size: 16px; line-height: 1.5; }
  .stat { font-size: 20px; } .stat b { color: #fff36b; font-size: 26px; }
  .btn { border: 4px solid #fff; background: #ffd166; color: #e0577f; font: inherit; font-weight: bold; font-size: 22px; padding: 12px 40px; border-radius: 30px; cursor: pointer; box-shadow: 0 6px 0 #e0577f; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #e0577f; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b id="score">0</b><span id="lives">♥♥♥</span></div>
<div class="meter"><i id="tilt"></i></div>

<div class="overlay" id="menu">
  <h1>ICE CREAM<br>TOWER</h1>
  <p><b>Drag</b> the cone to catch the scoops. The taller the tower, the more it sways — move gently and keep it balanced!</p>
  <div class="stat" id="bestMenu"></div>
  <button class="btn" id="startBtn">SCOOP!</button>
</div>
<div class="overlay hidden" id="over">
  <h1 id="overTitle">MELTDOWN!</h1>
  <div class="stat">SCOOPS <b id="finalScore">0</b></div>
  <div class="stat">BEST <b id="bestOver">0</b></div>
  <button class="btn" id="againBtn">ONE MORE</button>
</div>

<script>
/*AUDIO-ENGINE-START*/
// ---------- audio: procedural background music + sound effects ----------
// Every note is synthesized with the Web Audio API at runtime, so the music
// needs no files, works offline and carries no copyright.
const GameAudio = (cfg) => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let timer = null, step = 0, nextT = 0, playing = false;
  let musicOn = true;
  try { musicOn = localStorage.getItem('music_off') !== '1'; } catch (e) {}

  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
    pentaMajor: [0, 2, 4, 7, 9], pentaMinor: [0, 3, 5, 7, 10],
    japanese: [0, 1, 5, 7, 8], phrygian: [0, 1, 3, 5, 7, 8, 10]
  };
  const scale = SCALES[cfg.scale] || SCALES.major;
  const root = cfg.root || 57;
  const bpm = cfg.bpm || 110;
  const prog = cfg.prog || [0, 5, 3, 4];
  const sixteenth = 60 / bpm / 4;

  // deterministic random so each game always plays "its" tune
  let seed = cfg.seed || 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const deg = (d, oct = 0) => {
    const n = scale.length;
    const o = Math.floor(d / n);
    return root + scale[((d % n) + n) % n] + 12 * (o + oct);
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // melody: two 2-bar phrases (A, B) arranged A A B A
  function phrase() {
    const notes = [];
    let d = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < 32; i++) {
      const strong = i % 4 === 0;
      if (rnd() < (strong ? 0.85 : (cfg.leadDensity || 0.35))) {
        d += Math.round((rnd() - 0.5) * 4);
        d = Math.max(0, Math.min(scale.length * 2, d));
        const len = strong && rnd() < 0.5 ? 2 : 1;
        notes.push({ i, d, len });
      }
    }
    return notes;
  }
  const A = phrase(), B = phrase();
  const song = [A, A, B, A];

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = cfg.volume || 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    } catch (e) { ctx = null; }
  }

  function voice(t, freq, dur, type, vol, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts.detune) o.detune.value = opts.detune;
    let node = o;
    if (opts.cutoff) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.cutoff; f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    const a = opts.attack || 0.008;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(opts.bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16);
    const i16 = s % 16;
    const chordDeg = prog[bar % prog.length];
    const w = cfg.waves || {};
    // bass
    const bassPat = cfg.bassPattern || [0, 8];
    if (bassPat.includes(i16)) voice(t, hz(deg(chordDeg, -2)), sixteenth * 3.5, w.bass || 'triangle', 0.5, { cutoff: 600 });
    // pad (chord) at bar start
    if (cfg.pad && i16 === 0) {
      for (const k of [0, 2, 4]) voice(t, hz(deg(chordDeg + k, -1)), sixteenth * 15, w.pad || 'sine', 0.12, { attack: 0.3, cutoff: 1400, detune: k * 3 });
    }
    // arpeggio
    if (cfg.arp && i16 % (cfg.arpEvery || 2) === 0) {
      const k = [0, 2, 4, 2][(i16 / (cfg.arpEvery || 2)) % 4];
      voice(t, hz(deg(chordDeg + k, cfg.arpOct || 0)), sixteenth * 1.6, w.arp || 'square', 0.1, { cutoff: cfg.arpCutoff || 2200 });
    }
    // lead melody
    const ph = song[Math.floor(bar / 2) % song.length];
    const pi = (bar % 2) * 16 + i16;
    for (const n of ph) if (n.i === pi) {
      voice(t, hz(deg(n.d, cfg.leadOct || 0)), sixteenth * (n.len * 2 + 0.5), w.lead || 'triangle', 0.22, { cutoff: cfg.leadCutoff || 3000 });
    }
    // drums
    if (cfg.drums) {
      if (i16 % 8 === 0 || (cfg.drums === 'busy' && i16 === 10)) kick(t);
      if (i16 % 8 === 4) noise(t, 0.14, 0.35, 1500);
      if (i16 % 2 === 0) noise(t, 0.04, cfg.drums === 'soft' ? 0.06 : 0.12, 7000);
    }
  }

  function scheduler() {
    if (!ctx || !playing) return;
    while (nextT < ctx.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sixteenth * (cfg.swing && step % 2 === 0 ? 1 + cfg.swing : cfg.swing ? 1 - cfg.swing : 1);
      step++;
    }
  }

  function startMusic() {
    if (!ctx || playing || !musicOn) return;
    playing = true;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(cfg.volume || 0.16, ctx.currentTime + 1.2);
    nextT = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 40);
  }
  function stopMusic() {
    playing = false;
    if (timer) clearInterval(timer);
    timer = null;
  }

  // mute button
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Toggle music');
  btn.style.cssText = 'position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));' +
    'width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:20px;line-height:42px;padding:0;' +
    'background:' + (cfg.btnBg || 'rgba(0,0,0,.35)') + ';color:' + (cfg.btnColor || '#fff') + ';backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);';
  const paint = () => { btn.textContent = musicOn ? '♪' : '✕'; btn.style.opacity = musicOn ? '1' : '.6'; };
  paint();
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    musicOn = !musicOn;
    try { localStorage.setItem('music_off', musicOn ? '0' : '1'); } catch (err) {}
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (musicOn) startMusic(); else stopMusic();
    paint();
  };
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('pointerup', e => e.stopPropagation());
  btn.addEventListener('click', toggle);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    // call from a user gesture (start button) — browsers only allow audio after one
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      startMusic();
    },
    sfx(freq, dur, type = 'sine', vol = 0.07, to = 0) {
      init();
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(sfxBus);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
  };
};
/*AUDIO-ENGINE-END*/
(() => {
  const audio = GameAudio({
    bpm: 124, scale: 'major', root: 64, prog: [0, 5, 1, 4], seed: 206,
    waves: { lead: 'square', bass: 'triangle', arp: 'sine' },
    arp: true, arpEvery: 1, arpOct: 1, leadCutoff: 2200, leadOct: 1, leadDensity: 0.32, drums: true, bassPattern: [0, 4, 8, 12], volume: 0.13,
    btnBg: 'rgba(224,87,127,.45)'
  });
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const KEY = 'ice_cream_tower_best';
  let best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const showBest = () => { $('bestMenu').innerHTML = best ? 'BEST <b>' + best + '</b>' : ''; }; showBest();

  let W, H, DPR, S, LW, LH;
  const R = 24, STEP = 30, LIMIT = 0.85;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    S = Math.min(W / 400, H / 700); LW = W / S; LH = H / S;
  }
  addEventListener('resize', resize); resize();
  const FLAV = ['#ffb3c7', '#fff1c1', '#8b5a3c', '#b7e4a7', '#c9b2ff', '#ffcf8a', '#ff8c8c'];

  let state = 'menu', cone, scoops, falling, theta, omega, lives, t = 0, spawnT, vSmooth, dropT = 0, melt = [];
  function reset() {
    cone = { x: 0, prev: 0 }; scoops = []; falling = []; theta = 0; omega = 0; lives = 3; spawnT = 0.5; vSmooth = 0; dropT = 0; melt = [];
  }
  reset();

  function start() { reset(); state = 'play'; audio.start(); $('menu').classList.add('hidden'); $('over').classList.add('hidden'); }
  function end(title) {
    if (state !== 'play') return;
    state = 'over';
    const s = scoops.length; if (s > best) { best = s; try { localStorage.setItem(KEY, best); } catch (e) {} }
    $('overTitle').textContent = title; $('finalScore').textContent = s; $('bestOver').textContent = best; showBest();
    setTimeout(() => $('over').classList.remove('hidden'), 1200);
  }

  let dragging = false, lastX = 0;
  canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; });
  addEventListener('pointermove', e => { if (dragging && state === 'play') { cone.x += (e.clientX - lastX) / S; lastX = e.clientX; } });
  addEventListener('pointerup', () => { dragging = false; });
  const keys = {};
  addEventListener('keydown', e => {
    if (state !== 'play' && (e.key === ' ' || e.key === 'Enter') && (state === 'menu' || !$('over').classList.contains('hidden'))) { start(); e.preventDefault(); return; }
    keys[e.key] = true;
  });
  addEventListener('keyup', e => { keys[e.key] = false; });
  $('startBtn').onclick = start; $('againBtn').onclick = start;

  const CONE_Y = () => LH * 0.82;
  // position of scoop i (0 = bottom) bending along the sway angle
  function scoopPos(i) {
    let x = cone.x, y = CONE_Y() - 34;
    const n = Math.max(1, scoops.length);
    for (let k = 0; k <= i; k++) { const a = theta * (k + 1) / n; x += Math.sin(a) * (k ? STEP : 0); y -= Math.cos(a) * (k ? STEP : 0); }
    return { x, y };
  }
  const topPos = () => scoops.length ? scoopPos(scoops.length - 1) : { x: cone.x, y: CONE_Y() - 30 };

  function update(dt) {
    t += dt;
    if (state === 'play') {
      const kd = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
      cone.x += kd * 340 * dt;
      cone.x = Math.max(-LW / 2 + 30, Math.min(LW / 2 - 30, cone.x));
      const v = (cone.x - cone.prev) / Math.max(dt, 0.001); cone.prev = cone.x;
      const acc = Math.max(-5000, Math.min(5000, (v - vSmooth) / Math.max(dt, 0.001)));
      vSmooth = v;
      // inverted pendulum: taller stack = more unstable, accelerating the cone tips the stack backwards
      const n = scoops.length;
      if (n > 0) {
        const alpha = (0.35 + n * 0.09) * Math.sin(theta) - acc * 0.0011 * Math.min(1, n / 3) - omega * 1.6;
        omega += alpha * dt; theta += omega * dt;
        if (Math.abs(theta) > LIMIT) {
          for (let i = 0; i < n; i++) { const p = scoopPos(i); melt.push({ x: p.x, y: p.y, vx: Math.sign(theta) * (60 + i * 25), vy: -60, c: scoops[i] }); }
          scoops = []; audio.sfx(400, 0.8, 'sawtooth', 0.07, 60); end('TOPPLED!');
        }
      } else { theta = 0; omega = 0; }
      spawnT -= dt;
      if (spawnT <= 0) {
        falling.push({ x: (Math.random() - 0.5) * (LW - 80), y: -30, c: FLAV[Math.floor(Math.random() * FLAV.length)], v: 170 + Math.min(220, n * 8) });
        spawnT = Math.max(0.8, 1.8 - n * 0.04);
      }
      const tp = topPos();
      for (const f of falling) {
        f.y += f.v * dt;
        if (!f.done && Math.abs(f.x - tp.x) < R * 1.6 && Math.abs(f.y - (tp.y - STEP)) < 18) {
          f.done = true; scoops.push(f.c);
          omega += (f.x - tp.x) * 0.012;   // off-centre catches kick the stack
          dropT = 0.2;
          audio.sfx(660 + Math.min(12, scoops.length) * 40, 0.12, 'sine', 0.08, 990);
        } else if (!f.done && f.y > LH + 40) {
          f.done = true; lives--; melt.push({ x: f.x, y: LH * 0.95, vx: 0, vy: 0, c: f.c, puddle: true });
          audio.sfx(240, 0.3, 'triangle', 0.06, 120);
          if (lives <= 0) end('MELTDOWN!');
        }
      }
      falling = falling.filter(f => !f.done);
    }
    for (const m of melt) { if (!m.puddle) { m.vy += 900 * dt; m.x += m.vx * dt; m.y += m.vy * dt; } m.life = (m.life || 2) - dt; }
    melt = melt.filter(m => m.life > 0);
    dropT = Math.max(0, dropT - dt);
  }

  function scoop(x, y, c, squash = 0) {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.ellipse(x, y, R * (1 + squash), R * (0.9 - squash), 0, 0, Math.PI * 2); ctx.fill();
    // drippy rim
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.arc(x + k * 9, y + R * 0.7, 6 + (k % 2 ? 2 : 0), 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(x - 8, y - 9, 7, 4, -0.5, 0, Math.PI * 2); ctx.fill();
    if (c === '#8b5a3c' || c === '#fff1c1') { ctx.fillStyle = c === '#8b5a3c' ? '#ffde59' : '#ff6b8b'; for (let k = 0; k < 4; k++) ctx.fillRect(x - 12 + k * 7, y - 4 + (k % 2) * 6, 4, 2); }
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#7fd6e8'); g.addColorStop(1, '#d6f6ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.scale(S, S);
    // sun & beach
    ctx.fillStyle = '#fff36b'; ctx.beginPath(); ctx.arc(LW * 0.82, LH * 0.14, 40, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4fb8d4'; ctx.fillRect(0, LH * 0.62, LW, LH * 0.1);
    ctx.fillStyle = '#ffffff99'; for (let i = 0; i < 8; i++) ctx.fillRect(((i * 70 + t * 25) % (LW + 40)) - 20, LH * 0.64 + (i % 3) * 10, 26, 2);
    ctx.fillStyle = '#ffe3a8'; ctx.fillRect(0, LH * 0.72, LW, LH);
    // umbrella
    ctx.fillStyle = '#fff'; ctx.fillRect(LW * 0.12, LH * 0.5, 3, LH * 0.25);
    ctx.fillStyle = '#ff8fb1'; ctx.beginPath(); ctx.arc(LW * 0.12 + 1, LH * 0.52, 50, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(LW * 0.12 + 1, LH * 0.52 - 50); ctx.lineTo(LW * 0.12 - 15, LH * 0.52); ctx.lineTo(LW * 0.12 + 17, LH * 0.52); ctx.fill();
    ctx.save(); ctx.translate(LW / 2, 0);
    for (const m of melt) if (m.puddle) { ctx.globalAlpha = Math.min(1, m.life); ctx.fillStyle = m.c; ctx.beginPath(); ctx.ellipse(m.x, m.y, 28, 8, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    // cone
    const cy = CONE_Y();
    ctx.fillStyle = '#e8a75b'; ctx.beginPath(); ctx.moveTo(cone.x - 26, cy - 34); ctx.lineTo(cone.x + 26, cy - 34); ctx.lineTo(cone.x, cy + 40); ctx.fill();
    ctx.strokeStyle = '#c4823b'; ctx.lineWidth = 2;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(cone.x + k * 10 - 6, cy - 34); ctx.lineTo(cone.x + k * 4 + 8, cy + 10); ctx.stroke(); }
    // stacked scoops
    for (let i = 0; i < scoops.length; i++) { const p = scoopPos(i); scoop(p.x, p.y, scoops[i], i === scoops.length - 1 ? dropT * 0.8 : 0); }
    for (const f of falling) scoop(f.x, f.y, f.c);
    for (const m of melt) if (!m.puddle) scoop(m.x, m.y, m.c);
    ctx.restore();
    ctx.restore();
    $('score').textContent = scoops.length;
    $('lives').textContent = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(3 - Math.max(0, lives));
    $('tilt').style.left = (50 + Math.max(-1, Math.min(1, theta / LIMIT)) * 45) + '%';
    $('tilt').style.background = Math.abs(theta) > LIMIT * 0.6 ? '#ff4d6d' : '#fff';
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
